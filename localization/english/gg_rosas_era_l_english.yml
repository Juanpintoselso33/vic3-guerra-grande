 gg_x_arg_rosas_no_vote_tt:0 "While Rosas holds the sum of public power, the Confederation does not go to the polls: the Sala de Representantes renews his mandate each time it runs out."
 gg_x_arg_rosas_no_oligarchy_tt:0 "While Rosas holds the sum of public power, the Sala de Representantes will not share out the government: the Restorer of the Laws divides command with no one, not even the estancieros."
