l_english:
 gg_arg_paraguay.1.t:0 "The Independence of Paraguay"
 gg_arg_paraguay.1.d_urquiza:0 "Dispatches arrive from Asunción from Dr. #b Santiago Derqui#!, chargé d'affaires on special mission to the government of Paraguay. On 15 July he signed with Minister Benito Varela a treaty of limits, commerce and navigation: the Paraná as the boundary, free navigation of the Paraná for the Paraguayan flag and of the river Paraguay for the Argentine one. What is still missing is the act President #b Carlos Antonio López#! has asked for since his Congress swore independence in November 1842.\n\nRosas never gave it. In April 1843 he answered that the Confederation withheld its assent; later he forbade every ship in its ports to trade with Paraguay, and on 4 December 1845 Paraguay declared war on him. The Empire, by contrast, recognized it on 14 September 1844, and by the treaty of 25 December 1850 bound itself to aid Paraguay if the Confederation attacked it.\n\nDerqui's instructions allow him to recognize it \"as an accomplished fact\", with the adhesion of the provincial governments and answerable to the next General Congress. The act is drafted: \"I recognize in the name of the said Argentine Confederation the Independence and Sovereignty of the Republic of Paraguay\". The Director's order is all that is missing."
 gg_arg_paraguay.1.d_confederation:0 "Buenos Aires stayed with Rosas and the provinces with the government of #b Urquiza#!, and it is to this government that Asunción writes. President #b Carlos Antonio López#! asks the Confederation to recognize the independence his Congress swore in November 1842, and offers what the Littoral needs: the Paraná as the boundary and free navigation of the river Paraguay for the Argentine flag, in exchange for that of the Paraná for his own.\n\nRosas never recognized it. In April 1843 he answered that the Confederation withheld its assent; later he forbade every ship in its ports to trade with Paraguay, and on 4 December 1845 Paraguay declared war on him. The Empire, by contrast, recognized it on 14 September 1844, and by the treaty of 25 December 1850 bound itself to aid Paraguay if the Confederation attacked it.\n\nWith Buenos Aires apart, recognizing Paraguay is also the first foreign act of a government that still has to prove it is one. The act proposed reads: \"the Republic of Paraguay is entitled to exercise all the great prerogatives inherent in its Independence and National Sovereignty\"."
 gg_arg_paraguay.1.d_rosas:0 "The old question returns to Palermo, now that the war is decided. President #b Carlos Antonio López#! asks once more that the Confederation recognize the independence his Congress swore in November 1842, and this time he does not write alone: the Empire recognized it on 14 September 1844, and by the treaty of 25 December 1850 bound itself to aid Paraguay if the Confederation attacked it.\n\nThis government's answer has been on paper since April 1843: the one entrusted with foreign relations withholds his assent, and at the same time assures that \"never shall the arms of the Argentine Confederation disturb the peace and tranquillity of the Paraguayan people\". When López came to terms with Corrientes, every ship in the Confederation's ports was forbidden to trade with Paraguay, and on 4 December 1845 Asunción declared war.\n\nFor Buenos Aires, the old province of Paraguay is a province that has not come back. For Asunción, and now for Rio de Janeiro, it is a Republic. An answer is due."
 gg_arg_paraguay.1.f:0 "\"An accomplished fact, duly communicated.\""
 gg_arg_paraguay.1.a:0 "Recognize the independence and sovereignty of the Republic of Paraguay, as an accomplished fact."
 gg_arg_paraguay.1.b:0 "Withhold assent: Paraguay is a province that has not come back."
 gg_arg_paraguay.1.a_tt:0 "@information! The Confederation #b gives up its claim#! to the ground that is wholly Paraguayan. The Chaco stays as it is: its limits remain pending. Rio de Janeiro reads it as a guarantee kept."
 gg_arg_paraguay.1.b_tt:0 "@warning! The Confederation #b claims as its own#! the ground that is wholly Paraguayan, a rebel province. The courts that already recognized the Republic take note, and the Empire, bound to aid it, most of all."
