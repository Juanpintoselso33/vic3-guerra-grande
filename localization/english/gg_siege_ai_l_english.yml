l_english:
 gg_siege_line:0 "Siege Lines"
 gg_siege_line_gerund:0 "Holding the Siege Lines"
 gg_siege_line_desc:0 "Hold the line before the city without hurling the army at its walls: the camp at the Cerrito, dug in and fed by the whole countryside, waits for hunger to do what the missing siege guns cannot. Only during the Great Siege, on the Montevideo front."
 gg_siege_line_tooltip:0 "#header $gg_siege_line$#!"
 gg_siege_walls:0 "Man the Walls"
 gg_siege_walls_gerund:0 "Manning the Walls"
 gg_siege_walls_desc:0 "Hold the city's line with Montevideo at your back. Only during the Great Siege, on the Montevideo front."
 gg_siege_walls_tooltip:0 "#header $gg_siege_walls$#!"
 gg_siege_behind_the_walls:0 "Behind the Walls"
 gg_siege_behind_the_walls_desc:0 "This general is fighting on the Montevideo front, sheltered by the city's line of fortifications."
 gg_siege_without_breaching_guns:0 "No Siege Guns"
 gg_siege_without_breaching_guns_desc:0 "This general stands before the city without a siege train: his assaults on the wall carry half their weight."
 gg_ai_strategy_cerrito_siege:0 "Hold the Siege"
 gg_ai_strategy_cerrito_siege_desc:0 "[COUNTRY.GetName] shuns other wars while the city still stands: every effort goes into the lines at the Cerrito."
