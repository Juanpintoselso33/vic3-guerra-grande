 gg_argentina.16.t:0 "A Treasury without Customs Revenue"
 gg_argentina.16.d:0 "Governor: the blockade has ruined the customs revenue, and the treasury cannot wait for the ships to come back.\n\nThe reform of the #b Direct Contribution#! of #V 12 April 1839#! does away with exemptions and changes how property is assessed. We can hold to it and tax a broader base, whatever the displeasure of the owners it reaches.\n\nWe could instead cover the shortfall with paper money, or hasten the sale of public land. Both bring money in today; the reckoning comes tomorrow."
 gg_argentina.16.f:0 "The customs house is shut; the government's obligations are not."
 gg_argentina.16.a:0 "Collect the Direct Contribution."
 gg_argentina.16.b:0 "Issue paper money to cover the shortfall."
 gg_argentina.16.c:0 "Put public land up for sale."
 gg_argentina.17.t:0 "Those Who Could Afford to Wait"
 gg_argentina.17.d:0 "Governor: now that the French blockade is lifted, not everyone returns to market on the same footing. The great landowners could halt the slaughter, build up their breeding stock, hoard hides and buy land.\n\nThe small rancher had to sell his beef for a pittance. Many were ruined; that rift, together with the end of emphyteusis, fed the rising of the #b Libres del Sur#!.\n\nGoing on with the sales, without renewing the leases, brings in money and powerful buyers. Halting them and setting relief aside for the small men leaves less in the treasury, but a different temper in the countryside."
 gg_argentina.17.f:0 "Some sold to eat; others bought because they could wait."
 gg_argentina.17.a:0 "Keep selling."
 gg_argentina.17.b:0 "Set relief aside for the small ranchers."
 gg_argentina.18.t:0 "This Year's Resignation"
 gg_argentina.18.d:0 "Governor: it is time to write to the provinces again. As every year, your resignation from the conduct of foreign relations will plead your health, and we expect their governments to refuse it once more.\n\nThe ceremony affirms that the charge comes from them. But a resignation that is offered may be accepted: renewal does not make the mandate our property.\n\nWe can repeat the full formula, tone it down, or let this year pass without asking for a fresh vote of confidence."
 gg_argentina.18.f:0 "Whoever holds a charge must remember who entrusted it to him."
 gg_argentina.18.a:0 "Hold the full ceremony."
 gg_argentina.18.b:0 "Tone down the formula."
 gg_argentina.18.c:0 "Offer no resignation this year."
 gg_argentina.19.t:0 "Beef, Charqui, Tallow and Tongues"
 gg_argentina.19.d:0 "Governor: the summons served on #b Entre Ríos#! requires national vessels and a bond of twice the cargo's value, and forbids shipping to Montevideo beef, charqui, tallow, candles, grease and salted tongues — the whole output of its saladeros.\n\nThreats notwithstanding, the trade goes on briskly. Enforcing every prohibition protects our customs house, but sets the government against the men who must sell those cargoes.\n\nWe can hunt them down, turn a blind eye so long as appearances are kept, or license part of the trade and charge for it."
 gg_argentina.19.f:0 "The order lists what the saladero has to sell."
 gg_argentina.19.a:0 "Demand the bond and suppress the trade."
 gg_argentina.19.b:0 "Turn a blind eye."
 gg_argentina.19.c:0 "License part of it and charge fees."
 gg_argentina.28.t:0 "Sixty-Eight Per Cent"
 gg_argentina.28.d:0 "Governor: the trade returns for #V 1846–1847#! credit #b Montevideo#! with #V 68%#! of the River Plate's exports. The goods have found another door.\n\nThe littoral's trade is moving from the Paraná to the Uruguay, above all to Concepción del Uruguay and Concordia. Open ports keep Entre Ríos growing, and the flows are kept out of sight to avoid a quarrel with Buenos Aires.\n\nWe can insist that exports pass through here, tolerate that outlet while the blockade lasts, or recognise provincial licences in return for a share of the revenue."
 gg_argentina.28.f:0 "Cargoes do not wait for governments to agree."
 gg_argentina.28.a:0 "Channel all exports through Buenos Aires."
 gg_argentina.28.b:0 "Allow the Entre Ríos outlet for now."
 gg_argentina.28.c:0 "Recognise provincial licences in return for a share."
