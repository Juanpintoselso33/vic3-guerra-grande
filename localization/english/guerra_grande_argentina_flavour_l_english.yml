 gg_arg_flavour_trade_expired_tt:0 "@information! #b Entre Ríos#! is no longer under this delegation and administration: the dispatch has no effect and changes neither money nor grievances."
 gg_arg_littoral_restricted:0 "Cargoes held back"
 gg_arg_flavour_hard_tt:0 "@arrow_up! #b Entre Ríos#! grievance: #N +1#! while it still delegates; its petition remains open."
 gg_arg_flavour_relief_tt:0 "@arrow_down! #b Entre Ríos#! grievance: #P −1#!, to a minimum of #V 0#!, while it still delegates. Its petition closes only if no grievance remains."
 gg_arg_flavour_ritual_tt:0 "@information! The ceremony preserves the #b revocable#! delegation; it neither restores withdrawn delegations nor settles pending petitions."
 gg_arg_flavour_omit_tt:0 "@warning! Petitions open in #b Corrientes, Entre Ríos and the northern provinces#! that still delegate and whose regional grievance count exceeds #V 0#!."
 gg_argentina.16.t:0 "The treasury without customs"
 gg_argentina.16.d:0 "Governor, the blockade has broken customs revenue. The treasury cannot wait for the ships to return.\n\nThe #b Direct Contribution#! reform of #V 12 April 1839#! removes exemptions and changes assessments. We can enforce it on a broader base, despite the displeasure of the affected owners.\n\nWe can also cover the shortfall with paper money or accelerate public land sales. These resources arrive today; their costs remain for tomorrow."
 gg_argentina.16.f:0 "Customs are closed; the government’s obligations are not."
 gg_argentina.16.a:0 "Collect the Direct Contribution."
 gg_argentina.16.b:0 "Cover it with paper money."
 gg_argentina.16.c:0 "Put public land up for sale."
 gg_argentina.17.t:0 "Those who could afford to wait"
 gg_argentina.17.d:0 "Governor, with the French blockade lifted, the countryside returns to market on unequal terms. Large owners could suspend slaughter, expand breeding herds, store hides and buy land.\n\nSmall ranchers had to sell meat for next to nothing. Many were ruined; that divide, alongside the end of emphyteusis, helped fuel the #b Freemen of the South#!.\n\nContinued sales without renewing leases bring money and powerful buyers. Halting sales and reserving relief for small ranchers leaves less in the treasury, but a different mood in the countryside."
 gg_argentina.17.f:0 "Some sold to eat; others bought because they could wait."
 gg_argentina.17.a:0 "Continue the sales."
 gg_argentina.17.b:0 "Reserve relief for small ranchers."
 gg_argentina.18.t:0 "This year’s resignation"
 gg_argentina.18.d:0 "Governor, it is time to write to the provinces again. As every year, the resignation from the conduct of foreign relations will invoke your health; we expect their governments to reject it again.\n\nThe ceremony affirms that the charge comes from them. Yet an offered resignation can be accepted: reaffirmation does not make the delegation our property.\n\nWe can repeat the full formula, soften it, or let this year pass without requesting another expression of confidence."
 gg_argentina.18.f:0 "The holder of a charge must remember who entrusted it to him."
 gg_argentina.18.a:0 "Repeat the full ceremony."
 gg_argentina.18.b:0 "Soften the formula."
 gg_argentina.18.c:0 "Submit no resignation this year."
 gg_argentina.19.t:0 "Meat, charqui, tallow and tongues"
 gg_argentina.19.d:0 "Governor, the demand addressed to #b Entre Ríos#! requires national vessels, a bond worth twice the cargo and a ban on shipments to Montevideo of meat, charqui, tallow, candles, fat and salted tongues. These are the products of its saladeros.\n\nDespite the threats, trade remains intense. Enforcing every prohibition protects our customs house but sets the government against those who need to sell these cargoes.\n\nWe can pursue them, tolerate trade while appearances are maintained, or license a portion and charge for it."
 gg_argentina.19.f:0 "The order lists what the saladero has to sell."
 gg_argentina.19.a:0 "Enforce the bond and pursue the trade."
 gg_argentina.19.b:0 "Tolerate the trade."
 gg_argentina.19.c:0 "License a portion and collect fees."
 gg_argentina.28.t:0 "Sixty-eight per cent"
 gg_argentina.28.d:0 "Governor, the trade accounts for #V 1846–1847#! attribute #V 68%#! of River Plate exports to #b Montevideo#!. Merchandise is finding another gateway.\n\nLittoral trade is shifting from the Paraná to the Uruguay, especially towards Concepción del Uruguay and Concordia. Open ports sustain Entre Ríos’s growth; flows are concealed to avoid conflict with Buenos Aires.\n\nWe can insist on concentrating exports here, provisionally admit that outlet during the blockade, or recognise provincial licences in exchange for a share of revenue."
 gg_argentina.28.f:0 "Cargoes do not wait for governments to agree."
 gg_argentina.28.a:0 "Concentrate exports in Buenos Aires."
 gg_argentina.28.b:0 "Provisionally admit the Entre Ríos outlet."
 gg_argentina.28.c:0 "Recognise licences in exchange for a share."
