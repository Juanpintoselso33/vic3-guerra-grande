 gg_fort_french_supply:0 "Fort Supplied by France"
 gg_fort_french_supply_desc:0 "The small arms and iron for the Montevideo batteries come on French ships and at France’s charge, while she stands by the Defensa."
 gg_defensor_de_las_leyes:0 "Defender of the Laws"
 gg_defensor_de_las_leyes_desc:0 "So his party calls him: the president who swore to the Constitution of 1830 and means to answer for it."
 gg_cerrito_army_forming:0 "Army of the Siege Taking Shape"
 gg_cerrito_army_forming_desc:0 "The Cerrito raises its battalions in the middle of the war: veterans of the Ejército Unido, militia of the departments and recruits come in by the week."
