l_english:

 gg_powers.10.t:0 "Purvis Does Not Recognise the Blockade"
 gg_powers.10.d:0 "Rosas declared the blockade of Montevideo, but the British commodore Purvis says the new ports of South America have no right to blockade, and his boats carry the city's troops along the coast. Insisting means pitting Brown's squadron against the largest navy in the world. There is another way to squeeze the city: let it trade with the countryside until it runs out of specie."
 gg_powers.10.f:0 "Water does not recognise governments: it recognises guns."
 gg_powers.10.a:0 "The blockade holds."
 gg_powers.10.b:0 "Let them trade. Let their money run out."
 gg_powers.11.t:0 "Brown's Squadron"
 gg_powers.11.d:0 "The ministers of Britain and France demand that the blockade be lifted and threaten to seize Brown's squadron. Rosas has ordered the fleet back to Buenos Aires, but the allied ships already surround it. Saving the ships means losing the blockade; resisting means losing the ships."
 gg_powers.11.f:0 "Thirty-three years under the flag, struck without a shot."
 gg_powers.11.a:0 "Lift the blockade and save the squadron."
 gg_powers.11.b:0 "Let them take it. America will know who stole it."
 gg_powers.12.t:0 "The Hood Bases"
 gg_powers.12.d:0 "Thomas Samuel Hood arrives on behalf of London and Paris with a proposal: a ceasefire, the foreigners of Montevideo disarmed, the Argentine troops withdrawn, the blockade lifted, free elections and a broad amnesty. Rosas accepts it with amendments. The Cerrito decides first; Montevideo decides after."
 gg_powers.12.f:0 "A peace nobody won, offered by those who do not fight."
 gg_powers.12.a:0 "Accept it, with Rosas's amendments."
 gg_powers.12.b:0 "No negotiating with those who blockade."
 gg_powers.13.t:0 "Montevideo and the Hood Bases"
 gg_powers.13.d:0 "The Cerrito has accepted. Now the powers' proposal is on the Defensa's table: elections Oribe will probably win, the legions disarmed and the Argentines back on their shore. If Montevideo refuses, London and Paris say they will stop holding it up."
 gg_powers.13.f:0 "Accepting is losing the city at the ballot. Refusing is risking it to hunger."
 gg_powers.13.a:0 "Accept the powers' peace."
 gg_powers.13.b:0 "Refuse. Montevideo is not handed over for a set of terms."
 gg_powers.14.t:0 "Howden and Walewski at the Cerrito"
 gg_powers.14.d:0 "The new mediators, Lord Howden and Count Walewski, come up to the Cerrito. Oribe will not sign a peace without Rosas, but he can offer something: six months of truce and cattle for the city, in exchange for lifting the blockade."
 gg_powers.14.f:0 "A truce is a peace with an expiry date."
 gg_powers.14.a:0 "Offer the truce and the cattle."
 gg_powers.14.b:0 "There is nothing to offer without Rosas."
 gg_powers.15.t:0 "Howden's Truce"
 gg_powers.15.d:0 "The Cerrito offers six months without shots and cattle for the city. Lord Howden has already ordered the British blockade lifted; the French one stays. Accepting means eating, and giving the other side six months to prepare."
 gg_powers.15.f:0 "Six months of beef are six months of wall."
 gg_powers.15.a:0 "Accept the truce."
 gg_powers.15.b:0 "The city does not negotiate with the besieger."
 gg_powers.16.t:0 "Gore and Gros"
 gg_powers.16.d:0 "Robert Gore and Baron Gros bring another offer, and this time it is for Oribe alone: the presidency in Montevideo for the time he lost in 1838, guaranteed by the powers, if he stops being Rosas's lieutenant. From Buenos Aires comes the warning: if Oribe accepts, the powers will be free to move against the Confederation, and then against him."
 gg_powers.16.f:0 "The presidency, in exchange for the man who paid for it."
 gg_powers.16.a:0 "Accept the presidency and leave Rosas."
 gg_powers.16.b:0 "Oribe does not part from the Restorer."
 gg_powers.16.c:0 "Answer with courtesies and buy time."
 gg_powers.17.t:0 "Urquiza and the Treaty of Alcaraz"
 gg_powers.17.d:0 "Justo José de Urquiza signed the peace with Corrientes at Alcaraz, and Rosas does not approve it. Through quiet channels, the governor of Entre Ríos listens to Montevideo. If Rosas is strong, he will hold him; if not, Entre Ríos may change sides four years before anyone expects."
 gg_powers.17.f:0 "Rosas's best general is not Rosas's man."
 gg_powers.17.a:0 "Offer him the alliance."
 gg_powers.17.b:0 "It is too risky."
 gg_powers.18.t:0 "Those Who Leave"
 gg_powers.18.d:0 "France cuts what it sends and the city cannot pay everyone. The Basque volunteers who came with France are going over to Buenos Aires, and Garibaldi prepares his return to Italy, where the revolution has broken out. Some can be kept, at a high price, or all can go."
 gg_powers.18.f:0 "A legion is whoever is willing to stand in it."
 gg_powers.18.a:0 "Keep the Italians."
 gg_powers.18.b:0 "Keep the Basques."
 gg_powers.18.c:0 "Let them go. The wall is held by our own."
 gg_powers.19.t:0 "Britain Leaves"
 gg_powers.19.d:0 "On 24 November minister Southern and Arana sign the treaty: Britain recognises the Confederation's sovereignty over its rivers, returns the squadron and Martín García, and stops holding up Montevideo. France stays, for now. The Defensa must choose whom to ask for what is missing."
 gg_powers.19.f:0 "Allies sign treaties too."
 gg_powers.19.a:0 "Send Pacheco y Obes to Paris."
 gg_powers.19.b:0 "Let Lamas ask the Empire."
 gg_powers.19.c:0 "Hold on alone."
 gg_powers.21.t:0 "The Subsidy Runs Out"
 gg_powers.21.d:0 "The French Assembly voted the subsidy for nine more months and the nine months are gone. The city has nothing to pay the garrison with. There is the customs house, already pledged, or cuts."
 gg_powers.21.f:0 "A city kept on other people's money mortgages itself."
 gg_powers.21.a:0 "Mortgage the customs again."
 gg_powers.21.b:0 "Cut whatever must be cut."
 gg_powers.23.t:0 "The Chiefs Go Over"
 gg_powers.23.d:0 "Urquiza has crossed the Uruguay. At Paysandú, Servando Gómez, Lucas Píriz and other officers, weary of an endless war, joined him. Ignacio Oribe's troops desert en masse. The Cerrito can fight with what it has left, ask for terms, or ask the squadrons for a guarantee to leave with the Argentines."
 gg_powers.23.f:0 "Nine years of siege, and the siege comes apart in a month."
 gg_powers.23.a:0 "Fight with what is left."
 gg_powers.23.b:0 "Send Lucas Moreno to Urquiza."
 gg_powers.23.c:0 "Ask for the naval guarantee to leave with the Argentines."
 gg_powers.24.t:0 "The Defensa's Crisis"
 gg_powers.24.d:0 "A blow like this changes who rules inside the walls. The line of resistance, Pacheco y Obes's, and the line of negotiation, Herrera y Obes's, fight over Suárez's government. Changing line now has a cost."
 gg_powers.24.f:0 "Inside the walls there are two governments too."
 gg_powers.24.a:0 "Carry on as we are."
 gg_powers.24.b:0 "Change line."
 gg_powers.25.t:0 "The Convention with Spain"
 gg_powers.25.d:0 "Juan Francisco Giró negotiates in Madrid a convention recognising the independence. It is a signed paper, not a treaty: Spain will not ratify it while the Republic has two governments, because binding itself to one of them compromises its relations with whoever wins. Even so, it is a paper that can be shown at two different tables."
 gg_powers.25.f:0 "The old metropolis signs, and keeps the ratification back."
 gg_powers.25.a:0 "Show it in London and Paris."
 gg_powers.25.b:0 "Show it in Buenos Aires."
 gg_powers.26.t:0 "Florencio Varela"
 gg_powers.26.d:0 "The day after Gore and Gros arrive, Florencio Varela, the man who went to London and Paris to ask for the intervention, is murdered in front of his house. The Montevideo press already has a culprit. Nobody has proved who did it."
 gg_powers.26.f:0 "A dead man serves everyone who names him."
 gg_powers.26.a:0 "It was Rosas. Let Europe know."
 gg_powers.26.b:0 "Investigate before accusing."
 gg_powers.28.t:0 "Larrañaga's Funeral"
 gg_powers.28.d:0 "Father Dámaso Antonio Larrañaga has died; he lived near the Cerrito and said mass at the Matriz. For one day the war stops, and people from both sides walk together behind the coffin. Some say it is the moment to talk between orientales."
 gg_powers.28.f:0 "A funeral is not a peace, but it looks like one."
 gg_powers.28.a:0 "Use it to sound out a peace."
 gg_powers.28.b:0 "Respect the mourning, and nothing more."
 gg_powers.29.t:0 "The New Troy"
 gg_powers.29.d:0 "Pacheco y Obes came back from Paris with little more than kind words and a book: Alexandre Dumas wrote about Montevideo as a new Troy. Spreading it costs money; it may buy some time with French opinion."
 gg_powers.29.f:0 "A besieged city also defends itself with novels."
 gg_powers.29.a:0 "Let all of France read it."
 gg_powers.29.b:0 "The money is needed more on the walls."
 gg_powers.31.t:0 "The University Opens"
 gg_powers.31.d:0 "Eleven years after the decree, the Universidad Mayor de la República opens its doors in the middle of the war. Whoever holds Montevideo decides how."
 gg_powers.31.f:0 "18 July 1849."
 gg_powers.31.a:0 "With ceremony."
 gg_powers.31.b:0 "Without ceremony."
 gg_rivera.7.t:0 "Mercedes and Paysandú"
 gg_rivera.7.d:0 "Rivera is back in the countryside and wants to fight: the litoral is within reach, and Mercedes and Paysandú can be taken. Herrera y Obes would rather he stayed covering Maldonado while he negotiates in secret. And some say Rivera already writes to Oribe."
 gg_rivera.7.f:0 "December 1846."
 gg_rivera.7.a:0 "Let him take the litoral."
 gg_rivera.7.b:0 "Let him cover Maldonado and let others negotiate."
 gg_rivera.7.c:0 "Let him talk to Oribe, between orientales."
 gg_peace.6.t:0 "The Powers' Peace"
 gg_peace.6.desc:0 "Both governments have accepted the terms of London and Paris. Arms are laid down, the foreigners of Montevideo hand theirs over, the Argentines go back to their shore, and there is amnesty for all. One Republic is left, and the election decides who governs it."
 gg_peace.6.flav:0 "Nobody won the war. Someone will win the election."
 gg_peace.6.a:0 "Let the orientales vote."
 gg_peace.7.t:0 "Oribe, President"
 gg_peace.7.desc:0 "Oribe accepted Gore and Gros's offer: he completes his term in Montevideo under the powers' guarantee, and the Defensa dissolves in peace. In Buenos Aires, Rosas does not forgive: his lieutenant is gone, and the Confederation is left hostile to the Republic."
 gg_peace.7.flav:0 "A presidency recovered, a protector lost."
 gg_peace.7.a:0 "Govern under the European guarantee."
 gg_peace.7.b:0 "Govern and call elections."
 gg_powers_ships_lost:0 "Ships Lost to the British"
 gg_powers_specie_drain:0 "Specie Leaves the City"
 gg_powers_american_cause:0 "The American Cause"
 gg_powers_hardened:0 "The Powers Against Us"
 gg_truce_cattle:0 "Cattle for the City"
 gg_line_change:0 "The Defensa Changes Line"
 gg_university_inaugurated:0 "The Universidad Mayor"
 gg_peace_powers_tutelage:0 "The Powers' Peace"
 gg_peace_european_guarantee:0 "The European Guarantee"
 guerra_grande_requires_brown_fleet:0 "Without Brown's squadron there is no blockade until 1850."
 gg_powers_ships_lost_desc:0 "Brown's squadron fell into British and French hands, and the blockade with it."
 gg_powers_specie_drain_desc:0 "The city trades with the countryside and pays in specie: the silver leaves through the gates."
 gg_powers_american_cause_desc:0 "Against the European squadrons, the Confederation presents itself as the defence of America."
 gg_powers_hardened_desc:0 "London and Paris took the refusal as an affront, and they are making it count."
 gg_truce_cattle_desc:0 "Howden's truce lets cattle into the city."
 gg_line_change_desc:0 "The Defensa's government changed line in the middle of the war, and pays for it in disorder."
 gg_university_inaugurated_desc:0 "The Universidad Mayor de la República opened its doors on 18 July 1849."
 gg_peace_powers_tutelage_desc:0 "London and Paris wrote the peace, and they watch over it."
 gg_peace_european_guarantee_desc:0 "Oribe's presidency rests on the powers' guarantee, not on Rosas's."
