l_english:

 gg_powers.10.t:0 "Purvis Does Not Recognise the Blockade"
 gg_powers.10.d:0 "Rosas has declared the blockade of Montevideo and Brown's squadron enforces it. The British commodore #b John Brett Purvis#! answers that his government holds to the principle of not recognising in the new ports of South America ‘so high and interesting a right as that of blockade’, and acts accordingly.\n\nWhen Brown carries off the gunpowder the merchants kept on the Isla de Ratas, Purvis trains his guns on him and makes him give it back. To an admiral who has been an Argentine citizen for thirty years he speaks as ‘Mr. Brown, British subject in command of the ships of Buenos Aires’, and warns him that hostilities against the city will be treated as piracy. His boats ferry the city's troops to the coast and his supplies enter the besieged port.\n\nLondon will disavow him, but it will not punish him. Meanwhile the city eats, and the blockade that was to reduce it in months reduces nothing. To insist is to stake the squadron against the first navy in the world."
 gg_powers.10.f:0 "Water does not recognise governments: it recognises guns."
 gg_powers.10.a:0 "Hold the blockade even if Britain takes offence."
 gg_powers.10.b:0 "Let them trade. Let their money run out."
 gg_powers.11.t:0 "Brown's Squadron"
 gg_powers.11.d:0 "In July the British and French ministers deliver the ultimatum: lift the blockade of Montevideo or the squadron is taken. Rosas answers by declaring a total blockade and, when he sees what is coming, orders Brown back to Buenos Aires with the fleet.\n\nIt is already too late. The allied ships ring the squadron off the city: the frigate #b 25 de Mayo#!, the brigs #b General Echagüe#! and #b San Martín#! — the flagship — and the schooners #b Maipú#! and #b 9 de Julio#!. Six ships, taken without a fight, in what Buenos Aires will always call the theft of the squadron.\n\nSaving the ships means losing the blockade; resisting means losing the ships and the blockade with them. What follows is worse for the Restorer: from 2 August the allied squadrons close every port of the Confederation and of the Republic, except one. Except Montevideo."
 gg_powers.11.f:0 "Thirty-three years under the flag, struck without a shot."
 gg_powers.11.a:0 "Lift the blockade and save the squadron."
 gg_powers.11.b:0 "Let them take it. America will know who stole it."
 gg_powers.12.t:0 "The Hood Bases"
 gg_powers.12.d:0 "#b Thomas Samuel Hood#! was British consul in Montevideo for twenty years, until in 1843 he was removed for his closeness to Oribe. Now he returns as London's envoy, and Paris accredits him too: one man speaks for both powers.\n\nHe brings seven bases. A cessation of hostilities; the disarming of Montevideo's foreign legions; the withdrawal of the Argentine divisions; the lifting of the blockade with the return of Martín García and the captured ships; recognition of the Paraná as an exclusively Argentine river; a general amnesty, except for the exiles from Buenos Aires; and a salute of twenty-one guns to the Argentine flag. On top of all that, free elections in the Republic.\n\nRosas accepts them with amendments, and Oribe approves them on 11 August. What the instrument leaves unwritten, the ministers say aloud: if Montevideo refuses, Britain and France will leave it to its fate."
 gg_powers.12.f:0 "A peace nobody won, offered by those who do not fight."
 gg_powers.12.a:0 "Accept it, with Rosas's amendments."
 gg_powers.12.b:0 "We do not negotiate with blockaders."
 gg_powers.13.t:0 "Montevideo and the Hood Bases"
 gg_powers.13.d:0 "The Cerrito has accepted. The powers' proposal now lies upon the Defensa's table, and its terms are plain: a cessation of hostilities, elections, the disarming of the foreign corps and the withdrawal of the Argentine troops.\n\nThere is a trap in that calculation, and everyone sees it. With the entire countryside in Oribe's hands, elections are his to win; disarming the legions means disarming half the garrison, for the remainder are freedmen and national guards who cannot hold the line alone.\n\nLondon and Paris say it plainly: if Montevideo rejects terms accepted by the Cerrito, they will not continue to sustain a city that refuses the peace they themselves drafted. Acceptance means surrendering the government by signed instrument. Refusal means being left alone behind the wall."
 gg_powers.13.f:0 "Accept, and lose the city at the polls; refuse, and risk losing it to hunger."
 gg_powers.13.a:0 "Accept the powers' peace."
 gg_powers.13.b:0 "Refuse. Montevideo is not to be handed over for a set of terms."
 gg_powers.14.t:0 "Howden and Walewski at the Cerrito"
 gg_powers.14.d:0 "The new mediators are #b Lord Howden#! and Count #b Walewski#!, the unacknowledged son of Napoleon. Neither takes up residence ashore: Howden conducts his work from the frigate Raleigh because Montevideo's foreign legionaries have threatened to kill him, as he writes to Palmerston.\n\nThey proceed to the Cerrito and find what anyone might have foreseen. Oribe will neither make peace without Rosas nor raise the siege, but he offers four bases: six months without hostilities, the troops remaining in place, fifteen hundred head of cattle a month for the city, and the blockade lifted on both banks.\n\nRosas has already told them what he thinks: the ministers' schemes ‘are as far from, as different from the Hood bases, as heaven is from hell’. The Cerrito's offer, by contrast, lies on the table and demands an answer."
 gg_powers.14.f:0 "A truce is a peace with an expiry date."
 gg_powers.14.a:0 "Offer the truce and the cattle."
 gg_powers.14.b:0 "There is nothing to offer without Rosas."
 gg_powers.15.t:0 "Howden's Truce"
 gg_powers.15.d:0 "The Cerrito offers four terms: six months without hostilities, the troops where they stand, fifteen hundred head of cattle a month for the city, and the blockade lifted on both banks.\n\nLord Howden has already ordered the British blockade lifted and his French colleague does not follow him. Of the two squadrons holding the river, one is leaving, and Minister Barreiro answers with what the government thinks: keeping the blockades ‘is one of the conditions of our existence’, and lifting them ‘would very dangerously compromise our preservation’.\n\nAcceptance feeds the city for six months, but gives the other side six months to remount and rest troops already four years in camp. Refusal means hunger, one fewer squadron upon the river and the cattle still beyond the ditch."
 gg_powers.15.f:0 "Six months of beef are six months of wall."
 gg_powers.15.a:0 "Accept the truce."
 gg_powers.15.b:0 "The city does not negotiate with the besieger."
 gg_powers.16.t:0 "Gore and Gros"
 gg_powers.16.d:0 "#b Robert Gore#! and Baron #b Gros#! arrived days ago and did not come ashore: the city is not safe, and the murder of Florencio Varela the day after they anchored proves them right. The whole mission is conducted from shipboard.\n\nOn 20 April they spend seven hours in the besiegers' camp. Their offer is for Oribe alone and meant to prise him away from Rosas: the powers will guarantee his return to Montevideo as president for the remainder of the term interrupted in 1838. Villademoros answers in writing with terms of his own: recognition of Oribe as lawful president, annulment of the confiscations ‘to draw a veil over the past’, amnesty, and the surrender of the legions' arms.\n\nThe answer from Buenos Aires arrives on 8 May and ends the negotiation: ‘What kind of mediators are these? They cannot be mediators, because they are belligerents. Have they not made war on you? Have they not shelled the ports of the Argentine Confederation, your ally?’"
 gg_powers.16.f:0 "The presidency, in exchange for the man who paid for it."
 gg_powers.16.a:0 "Accept the presidency and leave Rosas."
 gg_powers.16.b:0 "Oribe does not part from the Restorer."
 gg_powers.16.c:0 "Answer with courtesies and buy time."
 gg_powers.17.t:0 "Urquiza and the Treaty of Alcaraz"
 gg_powers.17.d:0 "Justo José de Urquiza has signed peace with Corrientes at Alcaraz, and Rosas does not approve: any settlement made independently by the governor of Entre Ríos with a rebel province smacks of an independent policy, and within the Confederation an independent policy is treason.\n\nThrough discreet channels, Urquiza listens to Montevideo. He promises nothing: he asks questions, permits others to ask them and weighs the answers. Entre Ríos lives by the river and the hide trade, both stifled by Rosas's blockade; its army is, moreover, the best in the Confederation after that of Buenos Aires.\n\nIf Rosas is strong, he will keep Urquiza in obedience and this conversation never took place. If he is not, Entre Ríos may change sides four years earlier than anyone expects, and the war may be decided in a single afternoon across the river."
 gg_powers.17.f:0 "Rosas's best general is not Rosas's man."
 gg_powers.17.a:0 "Offer him the alliance."
 gg_powers.17.b:0 "It is too risky."
 gg_powers.18.t:0 "Those Who Leave"
 gg_powers.18.d:0 "France is reducing its aid and the city cannot pay everyone. The Basque volunteers who came with the French Legion are crossing to Buenos Aires, where there is work and no siege ration; month by month, emigration carries away the men needed upon the walls.\n\nGaribaldi is preparing to return to Italy: revolution broke out there in 1848, and the sailor from Nice who raised a legion upon the Río de la Plata will go to fight for his own country. His followers go with him. They were never numerous; now fewer than half remain of a force that numbered seven hundred at its height.\n\nSome may be retained at great cost, or all allowed to depart in favour of a smaller, cheaper garrison. Neither course restores what is being lost: increasingly, the legionaries who remain are those with nowhere left to return to."
 gg_powers.18.f:0 "A legion is whoever is willing to stand in it."
 gg_powers.18.a:0 "Keep the Italians."
 gg_powers.18.b:0 "Keep the Basques."
 gg_powers.18.c:0 "Let them go. Our own men will hold the wall."
 gg_powers.19.t:0 "Britain Leaves"
 gg_powers.19.d:0 "One November afternoon, at half past two, #b Felipe Arana#! and the British minister #b Henry Southern#! sign in Buenos Aires. Southern had sat through fifteen postponements before he could present his credentials, because Rosas would negotiate on nothing but the Hood bases.\n\nThe treaty recognises Argentine sovereignty over its rivers and the Confederation's right to settle its quarrel with the Republic without foreign intervention, including the right to blockade. Britain evacuates Martín García, returns the warships it took in 1845 and salutes the Argentine flag with twenty-one guns.\n\nFor the city this is not a treaty between third parties: it is the withdrawal of the power that kept the port open for six years. France remains, for now, and the Defensa must decide whether to buy time or to accept that the sea is no longer its own."
 gg_powers.19.f:0 "Allies sign treaties too."
 gg_powers.19.a:0 "Send Pacheco y Obes to Paris."
 gg_powers.19.b:0 "Let Lamas ask the Empire."
 gg_powers.19.c:0 "Hold out alone."
 gg_powers.21.t:0 "Renouncing the Subsidy"
 gg_powers.21.d:0 "The French subsidy arises from the convention of 12 June 1848: forty thousand pesos a month, advanced by the consul and later indemnified by the Assembly, to compensate the city for the lifting of the blockade. Paris has never refused it: the Assembly approved it four times, always by a landslide, the closest vote being five hundred and thirty to twenty-six.\n\nObtaining the money is another matter. Each month the consulate withholds the bills to extract some concession, and for two years the city has depended upon that humiliating negotiation. Mármol states it plainly in his newspaper: ‘Every month's payment has become a dispute.’\n\nNow Brazil has chosen its course and Urquiza has issued his pronunciamiento. Renouncing the subsidy means surrendering the treasury's only certain income; it also deprives the French Assembly of its argument about fruitless expense just as it prepares to vote upon the Plata, and presents the city to its new allies as a government that does not live upon alms."
 gg_powers.21.f:0 "‘Every month's payment has become a dispute.’ — José Mármol"
 gg_powers.21.a:0 "Renounce the subsidy and stake everything on the new allies."
 gg_powers.21.b:0 "Keep drawing it while it lasts."
 gg_powers.23.t:0 "The Chiefs Go Over"
 gg_powers.23.d:0 "Urquiza has crossed the Uruguay. At Paysandú he is joined by #b Servando Gómez#!, military commander of the department and one of the two chiefs between whom the Cerrito divided the country, and behind him go Lucas Píriz and other officers sick of a war without end.\n\nIgnacio Oribe's troops desert in droves. It is not a defeat: it is an army that simply ceases to exist as the men go home, and the Cerrito government is left with eleven thousand men on paper and far fewer in the field.\n\nThree courses remain: fight with whatever there is, ask for terms while there is still something to ask for, or ask the squadrons for a guarantee to ship the Argentines out and end this without anyone hanging anyone."
 gg_powers.23.f:0 "Nine years of siege, and the siege comes apart in a month."
 gg_powers.23.a:0 "Fight with what is left."
 gg_powers.23.b:0 "Send Lucas Moreno to Urquiza."
 gg_powers.23.c:0 "Ask the squadrons for safe conduct to sail with the Argentines."
 gg_powers.25.t:0 "Spain Signs and Does Not Ratify"
 gg_powers.25.d:0 "The old metropolis still does not recognise the Republic. One treaty was signed in Paris in 1841; a second, enlarged instrument was signed in Montevideo on 26 March 1846 with the chargé d'affaires #b Carlos Creus#!, who had been sent to take charge of a consulate within a besieged city.\n\nMadrid ratifies neither. The reason is not the colonial debt or wounded pride: the Republic has two governments, and to sign with one is to take its side against the other and estrange whichever government wins the war.\n\nThe instrument nevertheless exists, and a signed instrument may be produced. In London and Paris it shows that the Defensa is a state dealing as an equal with the Crown of Spain; in Buenos Aires it reminds Rosas that Europe has already recognised the independence he disputes."
 gg_powers.25.f:0 "Spain signs, and keeps the ratification for whoever wins."
 gg_powers.25.a:0 "Show it in London and Paris."
 gg_powers.25.b:0 "Show it in Buenos Aires."
 gg_powers.26.t:0 "Florencio Varela"
 gg_powers.26.d:0 "On Monday night #b Florencio Varela#! is killed in the calle Misiones, stabbed from behind a few steps from his own door. He is the editor of #b El Comercio del Plata#!, the man the Defensa sent to London and Paris to ask for intervention, and the loudest voice against negotiating with Rosas.\n\nThe killer is #b Andrés Cabrera#!, a Canary Islander, illiterate, who did not know Varela by sight: someone pointed him out from the shadows, and nobody stopped that man. Cabrera flees to the besiegers' side. The city's press already has its culprit and shouts it: Oribe, Rosas, or both.\n\nMinister Herrera y Obes writes something else to Lamas, in private: the murderer escaped to the Buceo ‘and he has accomplices here in frock coats’. Nobody ever proved who paid him, and the city will argue about it for a century and a half."
 gg_powers.26.f:0 "A dead man serves everyone who names him."
 gg_powers.26.a:0 "It was Rosas. Let Europe hear it."
 gg_powers.26.b:0 "Investigate before accusing."
 gg_powers.28.t:0 "Larrañaga's Funeral Rites"
 gg_powers.28.d:0 "Father #b Dámaso Antonio Larrañaga#! is dead — the man who founded the Library, drafted the Instructions of the Year XIII and carried the law that ordered the Republic's first chairs of learning. He was eighty-six, blind, and had long lived retired at his quinta on the Miguelete.\n\nThe quinta lies outside the wall, in Oribe's country. They bury him there, in the oratory of his own farm, with the Cerrito's honours, and #b El Defensor de la Independencia Americana#! prints an obituary by Villademoros that is the vicar's first biography.\n\nInside the city they cannot reach the body, so the Defensa holds rites of its own and declares him a #b general of the Republic#!. Two governments that agree on nothing sign the same mourning, each on its own side."
 gg_powers.28.f:0 "Two burials for one man, one on each side of the ditch."
 gg_powers.28.a:0 "Use the mourning to sound out a peace between Uruguayans."
 gg_powers.28.b:0 "Respect the mourning, and nothing more."
 gg_powers.29.t:0 "The New Troy"
 gg_powers.29.d:0 "Melchor Pacheco y Obes returns from Paris with little more than fine words and a book. Alexandre Dumas has written of Montevideo as a new Troy: a city that survives nine years of siege, facing an investment which, in the French telling, bears more than a passing resemblance to Homer's.\n\nIt is not history, and nobody in Montevideo supposes that it is. It is propaganda written by Europe's most widely read novelist, commissioned by a government that needs Paris to keep its eyes upon the Plata when the Assembly votes on what aid it will send.\n\nCirculating it costs money the customs house does not possess. It buys neither a battalion nor a subsidy, but time — paid in the one currency the Defensa still handles well: European opinion."
 gg_powers.29.f:0 "A besieged city also defends itself with novels."
 gg_powers.29.a:0 "Let all of France read it."
 gg_powers.29.b:0 "The money is needed more on the walls."
 gg_powers.31.t:0 "The University Opens"
 gg_powers.31.d:0 "On 18 July, the anniversary of the Constitution, the #b Universidad Mayor de la República#! is inaugurated in the chapel of San Ignacio. The city is besieged, lives on rations and has just lost British support; it opens a university all the same.\n\nIt is not founded today: it was founded by the decree of 27 May 1838, signed by #b Manuel Oribe#!, upon the law Larrañaga carried in 1833. Suárez's decree of four days ago orders that decree and that law to be carried out. The university the Defensa inaugurates was created, on paper, by the man besieging it.\n\nOf the four faculties in the regulations, only Jurisprudence will actually operate, with some sixty students. The first rector is Father Lorenzo Fernández, apostolic vicar and Larrañaga's successor; the patron is Minister Herrera y Obes, who will himself become rector the following year."
 gg_powers.31.f:0 "18 July 1849, in a city living on rations."
 gg_powers.31.a:0 "With ceremony."
 gg_powers.31.b:0 "Without ceremony."
 gg_rivera.7.t:0 "Mercedes and Paysandú"
 gg_rivera.7.d:0 "Rivera is back in the countryside and eager to fight: the Litoral lies within reach, and Mercedes and Paysandú can be taken. Herrera y Obes would rather he remain covering Maldonado while secret negotiations continue. Some say Rivera is already writing to Oribe."
 gg_rivera.7.f:0 "December 1846."
 gg_rivera.7.a:0 "Let him take the Litoral."
 gg_rivera.7.b:0 "Let him cover Maldonado and let others negotiate."
 gg_rivera.7.c:0 "Let him speak to Oribe, Uruguayan to Uruguayan."
 gg_peace.6.t:0 "The Powers' Peace"
 gg_peace.6.desc:0 "Both governments have accepted the terms of London and Paris. Arms are laid down, the foreigners of Montevideo hand theirs over, the Argentines go back to their shore, and there is amnesty for all. One Republic remains, and the polls will decide who governs it."
 gg_peace.6.flav:0 "Nobody won the war. Someone will win the election."
 gg_peace.6.a:0 "Let the Uruguayans vote."
 gg_peace.7.t:0 "Oribe, President"
 gg_peace.7.desc:0 "Oribe accepted Gore and Gros's offer: he completes his term in Montevideo under the powers' guarantee, and the Defensa dissolves in peace. In Buenos Aires, Rosas does not forgive: his lieutenant is gone, and the Confederation is left hostile to the Republic."
 gg_peace.7.flav:0 "A presidency recovered, a protector lost."
 gg_peace.7.a:0 "Govern under the European guarantee."
 gg_peace.7.b:0 "Govern and call elections."
 gg_powers_ships_lost:0 "Ships Lost to the British"
 gg_powers_specie_drain:0 "Specie Leaves the City"
 gg_powers_american_cause:0 "The American Cause"
 gg_powers_hardened:0 "The Powers Against Us"
 gg_truce_cattle:0 "Cattle for the City"
 gg_university_inaugurated:0 "The Universidad Mayor"
 gg_peace_powers_tutelage:0 "The Powers’ Peace"
 gg_peace_european_guarantee:0 "The European Guarantee"
 guerra_grande_requires_brown_fleet:0 "Without Brown's squadron there is no blockade until 1850."
 gg_powers_ships_lost_desc:0 "Brown's squadron fell into British and French hands, and the blockade with it."
 gg_powers_specie_drain_desc:0 "The city trades with the countryside and pays in specie: the silver leaves through the gates."
 gg_powers_american_cause_desc:0 "Against the European squadrons, the Confederation presents itself as the defence of America."
 gg_powers_hardened_desc:0 "London and Paris took the refusal as an affront, and they are making it count."
 gg_truce_cattle_desc:0 "Howden's truce lets cattle into the city."
 gg_university_inaugurated_desc:0 "The Universidad Mayor de la República opened its doors on 18 July 1849."
 gg_peace_powers_tutelage_desc:0 "London and Paris wrote the peace, and they watch over it."
 gg_peace_european_guarantee_desc:0 "Oribe's presidency rests on the powers' guarantee, not on Rosas's."
 gg_powers.32.d:0 "#b Andrés Lamas#! has been in Río de Janeiro since November 1847 asking for the same thing over and over: that the Empire intervene. The Empire paid covertly — Mauá's loans, the secret advances — and did not move, because open intervention cost it the neutrality that suited it.\n\nNow the answer comes with conditions. Brazil can intervene early and in full, but in exchange it wants treaties: alliance with a right to intervene, boundaries, commerce, extradition, and a subsidy secured on the Republic's customs house.\n\nLamas writes that London's attempt to hold the Empire back has come too late. He may be right. What is also true is that whoever finances another man's war ends up deciding how the peace is signed, and this time it will be decided in writing."
