# Interest groups renamed by the ribbons of Carpinteria
 ig_blanco_party:0 "Blanco Party"
 ig_blanco_party_desc:0 "Those who wore Oribe's white ribbon, lettered 'Defensores de las Leyes' - Defenders of the Laws. Estancieros, parish priests and the militias of the countryside, who claim to be the lawful government and the party of order."
 ig_colorado_party:0 "Colorado Party"
 ig_colorado_party_desc:0 "Those who wore Rivera's ribbon, cut from the red lining of their own ponchos after the sky-blue one bleached white in the sun. The port, the customs house, the printers and the foreign merchants of Montevideo."

# Journal entry
 je_group_guerra_grande:0 "The Guerra Grande"
 je_guerra_grande:0 "The Guerra Grande"
 je_guerra_grande_desc:0 "Two ribbons, two governments, one country. For eight years the Republic was crossed from north to south by Uruguayan, French, Basque, Italian and Argentine armies, split between the Cerrito Government under Oribe - which reconvened the Chambers Rivera had dissolved and had them renew his mandate - and the Defensa Government, where Joaquin Suarez served eight years as interim president. Neither can finish the other alone: every battle won tips the war one way or the other."
 je_guerra_grande_reason:0 "The ribbons of Carpinteria have divided the Republic."
 je_guerra_grande_status_factions:0 "There is no war yet: Oribe governs the Republic and Rivera commands the countryside. But every decision of these years weighs for one side, and the bar already counts it.\n\n@battalions! #b Score:#! #blue_value Blancos#! #V [GetGlobalVariable('guerra_grande_blanco_score').GetValue|v0]#!  —  #R Colorados#! #V [GetGlobalVariable('guerra_grande_colorado_score').GetValue|v0]#!\n\n@leverage! #b The patrons#! (0 to 100)\n  Rosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|v0]#!  ·  France #V [GetGlobalVariable('gg_patron_francia').GetValue|v0]#!  ·  Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|v0]#!  ·  Brazil #V [GetGlobalVariable('gg_patron_brasil').GetValue|v0]#!  ·  Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|v0]#!\n  Rosas will back the #blue_value blancos#!; France, Britain and Brazil, the #R colorados#!. Whatever they gain or lose now is what each side brings into the war. France and Britain together, at 60 or more, open the river.\n\n@intelligentsia! #b Balance between doctores and caudillos:#! #V [GetGlobalVariable('gg_cerrito_balance').GetValue|v0]#! (towards -100 the caudillos weigh more, towards 100 the doctores). It will decide who rules the blanco government.\n\n#Y When the Republic splits, the side ahead arms the men its lead bought: two points put one more battalion in the field, four put two.#! The blancos muster them in San José, the colorados in Montevideo. Neither goes past eight, so the war starts where you left it."
 je_guerra_grande_status_siege:0 "Two governments, one Republic: the Defensa behind the walls of Montevideo, the Cerrito over the countryside.\n\n@battalions! #b Score:#! #blue_value Cerrito#! #V [GetGlobalVariable('guerra_grande_blanco_score').GetValue|v0]#!  —  #R Defensa#! #V [GetGlobalVariable('guerra_grande_colorado_score').GetValue|v0]#!\nEvery battle won and every decision moves the needle. Five ahead gives the leader the upper hand; ten ahead forces the other side to the table.\n\n@leverage! #b The patrons#! (0 to 100)\n  Rosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|v0]#!  ·  France #V [GetGlobalVariable('gg_patron_francia').GetValue|v0]#!  ·  Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|v0]#!  ·  Brazil #V [GetGlobalVariable('gg_patron_brasil').GetValue|v0]#!  ·  Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|v0]#!\n  Rosas backs the #blue_value Cerrito#!; France, Britain and Brazil back the #R Defensa#!. A side whose patrons add up to less than 40 loses war support every month, and each patron sends money according to its backing. At the peace, a patron's options only appear if that patron has backing.\n\n@ships! #b The sea#!\n  France #V [GetGlobalVariable('gg_patron_francia').GetValue|v0]#! + Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|v0]#!: at 60 or more, the squadrons open the river and the Cerrito's blockade is lifted.\n  Months of siege with the sea shut: #V [GetGlobalVariable('gg_siege_months').GetValue|v0]#! of 24. At 24 the Defensa must negotiate (12 from 1851).\n\n@intelligentsia! #b Inside each government#!\n  The Defensa's line: #V [GetGlobalVariable('gg_defensa_line').GetValue|v0]#! (1 = Pacheco y Obes, resist; 2 = Herrera y Obes, negotiate).\n  The Cerrito's balance: #V [GetGlobalVariable('gg_cerrito_balance').GetValue|v0]#! (towards -100 the caudillos rule, towards 100 the doctores).\n\n@information! #b How peace comes#!\n  The Defensa negotiates if its war support runs out, if the siege reaches its limit or if the Cerrito leads by ten. The Cerrito negotiates if its war support runs out, if half its countryside is occupied or if the Defensa leads by ten. If nothing closes, the powers may impose their own peace.\n\nNeither Argentina nor Brazil joins as a belligerent: they send battalions and money, as they did. It fails if a foreign power takes Montevideo."
 je_guerra_grande_complete_tt:0 "Only one of the two governments is left standing."

