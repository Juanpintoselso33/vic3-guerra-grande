# Interest groups renamed by the ribbons of Carpinteria
 ig_blanco_party:0 "Blanco Party"
 ig_blanco_party_desc:0 "Those who wore Oribe's white ribbon, lettered 'Defensores de las Leyes' - Defenders of the Laws. Estancieros, parish priests and the militias of the countryside, who claim to be the lawful government and the party of order."
 ig_colorado_party:0 "Colorado Party"
 ig_colorado_party_desc:0 "Those who wore Rivera's ribbon, cut from the red lining of their own ponchos after the sky-blue one bleached white in the sun. The port, the customs house, the printers and the foreign merchants of Montevideo."

# Journal entry
 je_group_guerra_grande:0 "The Guerra Grande"
 je_guerra_grande:0 "The Guerra Grande"
 je_guerra_grande_desc:0 "Between 1838 and 1851 the Republic had two governments: the #R Defensa#!, shut inside Montevideo, and the #blue_value Cerrito#!, which Oribe set up before the city and which governed the rest of the country. Each claimed to be the lawful government.\n\n#b The reckoning of this war#!\n• @battalions! Neither ribbon means to surrender: the point is to reach the table weighing more than the other. Every battle won, every treaty and every favour called in tips the scale, and during the siege the river tips it too: every four months with the river shut is worth a point to the #blue_value blancos#!, every four with it open a point to the #R colorados#!, up to #V 4#! a side.\n• #V 5#! ahead and the leader sets the pace while the other begins to show the strain. #V 10#! ahead and the one below has nothing left but to negotiate.\n• Whatever is won before 1843 is collected in men: the day the Republic splits, whoever leads will raise the larger army, and a good deal larger at #V 4#! or more. The #blue_value Cerrito#!'s will be horsemen of the countryside; the #R Defensa#!'s, infantry behind the walls.\n• @information! The government that runs out of endurance sits down, as does the one that loses half its countryside, or the one that falls #V 10#! behind; the #R Defensa#! also at #V 24#! months of siege. From 1851 half of that is enough. If neither yields, the powers will impose their terms, and by 1860 nobody will remember what the quarrel was about.\n• Whoever ends on top dictates the peace. If that is the #blue_value Cerrito#!, there is once again a single Oriental Republic of Uruguay.\n• @warning! All is lost if a foreign power keeps Montevideo. Neither Argentina nor the Empire will declare war: they send men and money, which is worse.\n\nThe river and the squadrons are reckoned separately; so is the siege."
 je_guerra_grande_reason:0 "Between 1838 and 1851 the Republic had two governments: the #R Defensa#!, shut inside Montevideo, and the #blue_value Cerrito#!, which Oribe set up before the city and which governed the rest of the country. Each claimed to be the lawful government.\n\n#b The reckoning of this war#!\n• @battalions! Neither ribbon means to surrender: the point is to reach the table weighing more than the other. Every battle won, every treaty and every favour called in tips the scale, and during the siege the river tips it too: every four months with the river shut is worth a point to the #blue_value blancos#!, every four with it open a point to the #R colorados#!, up to #V 4#! a side.\n• #V 5#! ahead and the leader sets the pace while the other begins to show the strain. #V 10#! ahead and the one below has nothing left but to negotiate.\n• Whatever is won before 1843 is collected in men: the day the Republic splits, whoever leads will raise the larger army, and a good deal larger at #V 4#! or more. The #blue_value Cerrito#!'s will be horsemen of the countryside; the #R Defensa#!'s, infantry behind the walls.\n• @information! The government that runs out of endurance sits down, as does the one that loses half its countryside, or the one that falls #V 10#! behind; the #R Defensa#! also at #V 24#! months of siege. From 1851 half of that is enough. If neither yields, the powers will impose their terms, and by 1860 nobody will remember what the quarrel was about.\n• Whoever ends on top dictates the peace. If that is the #blue_value Cerrito#!, there is once again a single Oriental Republic of Uruguay.\n• @warning! All is lost if a foreign power keeps Montevideo. Neither Argentina nor the Empire will declare war: they send men and money, which is worse.\n\nThe river and the squadrons are reckoned separately; so is the siege."
 je_guerra_grande_status_factions:0 "There is no war yet: every decision of these years adds to one side, and the bar already counts it."
 je_guerra_grande_status_siege:0 "Two governments: the #R Defensa#! in Montevideo and the #blue_value Cerrito#! in the countryside.\n@battalions! Exhaustion (three months running open the other side's peace table): #blue_value Cerrito#! #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|v0]#! of 3 · #R Defensa#! #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|v0]#! of 3."
 je_guerra_grande_complete_tt:0 "A peace is signed, only one government is left standing, or the war reaches its 1860 cut-off."
 je_guerra_grande_complete_nowar_tt:0 "The army that was to cross the river stayed on the far bank, and the Republic was never split."

