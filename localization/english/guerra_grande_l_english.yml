# 1 - Carpinteria, 19 September 1836
 guerra_grande.1.t:0 "The Ribbons of Carpinteria"
 guerra_grande.1.d:0 "Last August the President decreed that every man, soldier or civilian, wear a white badge on hat or coat lettered 'Defensores de las Leyes' - the same white the patriots of 1811 had worn. Rivera's rebels answered with the sky blue of the national cockade, but sun and rain bleached it white within weeks, so they cut new ribbons from the red lining of their ponchos.\n\nOn the banks of the Carpinteria stream in Durazno the two met at last: three thousand men under Oribe and Lavalleja against fourteen hundred under Rivera and the exiled Argentine unitarian Juan Lavalle. The government won the field. What was born there outlived every man on it - from this day the Republic has two parties, and every estancia, parish and regiment will be asked which ribbon it wears. The white ribbon makes a #b blanco#!, the red one a #b colorado#! - the plain Spanish for white and red, and the only names these two will answer to for the next century and a half."
 guerra_grande.1.f:0 "Blancos and Colorados, and the country between them."
 guerra_grande.1.a:0 "The white ribbon: the laws, the church and the countryside."
 guerra_grande.1.b:0 "The red ribbon: the port, the press and the liberal cause."
 guerra_grande.1.c:0 "The Republic wears no ribbon at all."

# 2 - The fall of Oribe, 24 October 1838
 guerra_grande.2.t:0 "The Fall of Oribe"
 guerra_grande.2.d:0 "A French squadron blockades Buenos Aires, Rivera's riders are at the gates, and the President has run out of money and of friends. Manuel Oribe can resign and take ship for Buenos Aires - where Rosas will go on receiving him as the lawful president of Uruguay, and where a government of the Cerrito will be waiting to be formed - or he can stay, and turn the capital into a fortress."
 guerra_grande.2.f:0 "A president with two ways out of the city."
 guerra_grande.2.a:0 "Let him resign. The Colorados take the government."
 guerra_grande.2.b:0 "He does not resign. The Blancos hold the state."

# 3 - The split
 guerra_grande.3.t:0 "The Great War Begins"
 guerra_grande.3.d:0 "The Republic breaks in two. Behind the walls sits the Gobierno de la Defensa - the government of the defence, and the Defensa from here on - with the customs house, the foreign merchants and the sea. Out on the little hill that gives it its name, beside the Villa de la Restauracion, sits the Gobierno del Cerrito, with the cattle, the caudillos and Rosas at its back. It has reconvened the Chambers Rivera dissolved in 1838 and had them renew his mandate, so that both governments can call themselves lawful and neither has room for the other.\n\n'The army of Rosas is before this capital,' the Defensa decrees on the day the siege begins. 'The Government counts on the patriotism of its inhabitants: it rests on that, and on victory.'"
 guerra_grande.3.f:0 "Two governments, nine years, one country."
 guerra_grande.3.a:0 "Montevideo will hold."
 guerra_grande.3.b:0 "Ride out to the Cerrito with Oribe."

# 4 - Rosas
 guerra_grande.4.t:0 "Rosas and the Cerrito"
 guerra_grande.4.d:0 "Oribe writes from the Cerrito as the lawful president of Uruguay, asking for what he was promised in exile: men, money and cattle. Backing him puts the Confederation into a war on the far bank and brings the British and French squadrons across our rivers - but the far bank has never been a foreign question, and a friendly government in Montevideo would close the Plata to the unitarians for good."
 guerra_grande.4.f:0 "The far bank has always been our business."
 guerra_grande.4.a:0 "Back Oribe. The Plata is one country."
 guerra_grande.4.b:0 "Let them settle it themselves."

# 5 - The Italian Legion
 guerra_grande.5.t:0 "The Red Shirts of Montevideo"
 guerra_grande.5.d:0 "The legion has its commander: Giuseppe Garibaldi, a sailor from Nice condemned to death in Genoa, who came to the Plata to privateer for Rio Grande and stayed. His men drill in the shirts nobody else wanted - a lot of red work smocks meant for the saladeros of the Confederation, stranded here by the war. Sixteen years from now the same shirt will be worn in Sicily."
 guerra_grande.5.f:0 "A uniform bought by accident, and kept on purpose."
 guerra_grande.5.a:0 "Put them on the line."

