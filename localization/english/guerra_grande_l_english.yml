# 9 - Intervention
 guerra_grande.9.t:0 "The Squadrons Enter the Plata"
 guerra_grande.9.d:0 "British and French men-of-war have forced the river. Every port of the Confederation is closed to trade but ours, the convoys reach the besieged city, and the powers have made it plain what they are buying: free navigation of the Parana and the Uruguay, for their merchants, once the shooting stops."
 guerra_grande.9.f:0 "The river belongs to whoever can sail it."
 guerra_grande.9.a:0 "Let them come."

# 11 - Portrait: Manuel Oribe
 guerra_grande.11.t:0 "The President and the Laws"
 guerra_grande.11.d:0 "Manuel Oribe was born in Montevideo in 1792, joined the revolution as a boy and was second in command of the Thirty-Three Orientals: Lavalleja led them, Oribe organised the crossing. He is a lodge man, of the Caballeros Orientales, and a legalist to the bone - when Lavalleja rose against President Rivera in 1832 and again in 1834, it was Oribe who stood by the government he disliked, because it was the lawful one.\n\nThat is the whole of him: the cult of discipline and of authority, and a badge that says Defenders of the Laws. He has already refused Rosas once, when Buenos Aires suggested the Banda Oriental might return to the Argentine Confederation."
 guerra_grande.11.f:0 "A president who would rather be obeyed than loved."
 guerra_grande.11.a:0 "The law stands above the man."
 guerra_grande.11.b:0 "A republic is not a barracks."

# 12 - Portrait: Juan Antonio Lavalleja
 guerra_grande.12.t:0 "The Chief of the Thirty-Three"
 guerra_grande.12.d:0 "On 19 April 1825 Juan Antonio Lavalleja landed at the beach of La Agraciada with thirty-three men and set the whole countryside alight; the Congress of Florida made him Captain General. What came after was less kind. Rivera took the presidency he thought was his, and Lavalleja rose against him in 1832 and in 1834, and was beaten both times, easily.\n\nAt Carpinteria he rode with the government - as did almost every man of the Thirty-Three. He is loyal to the laws now, and to himself, and nobody is quite sure in which order."
 guerra_grande.12.f:0 "The man who started it all, and finished nothing."
 guerra_grande.12.a:0 "Give him a command. He has earned it twice over."
 guerra_grande.12.b:0 "No command for the caudillos. The Republic is governed from the capital."

# 13 - Portrait: Fructuoso Rivera
 guerra_grande.13.t:0 "Don Frutos"
 guerra_grande.13.d:0 "Fructuoso Rivera, born on an estancia and barely schooled, was the most effective chief Artigas ever had - unpredictable strikes, and the countryside in his hand. When the Portuguese won he signed at Tres Arboles and served the Baron de la Laguna, who offered him a barony he declined. He came back with the Thirty-Three at the embrace of Monzon, took the Misiones Orientales on his own account, became the first president of the Republic, and governed from Durazno while lawyers ran the state.\n\nThe British consul Hood wrote of him in 1829: 'He is a man without any kind of talent, but he is popular with the majority of the people'. He fled towards Porto Alegre, into the land of the farrapos, and he will be back."
 guerra_grande.13.f:0 "Beaten at Carpinteria, and not finished."
 guerra_grande.13.a:0 "Ask Brazil to hand him over."
 guerra_grande.13.b:0 "Let him wear out his welcome in exile."

# 14 - Portrait: Artigas
 guerra_grande.14.t:0 "The Old Man of Curuguaty"
 guerra_grande.14.d:0 "Jose Gervasio Artigas crossed the Parana in September 1820 with a hundred and fifty men and never came back. Doctor Francia gave him asylum and made sure he would have no politics with it: no correspondence, no visitors, and eighteen years in the villa of San Isidro de Curuguaty, which the Paraguayans call their Siberia. The dictator never once agreed to see him.\n\nThey say Francia sends him a gold ounce a month, and that he gives most of it away to the poor of the village. He farms, he prays the rosary at dusk with his neighbours answering in Guarani, and he has asked for nothing. He is seventy-four. The Republic his men invented has just seen its president fall, and nobody in Montevideo has written to him."
 guerra_grande.14.f:0 "The father of the country, farming in someone else's."
 guerra_grande.14.a:0 "Send word to Curuguaty."
 guerra_grande.14.b:0 "Let the old man rest. This war is not his."

