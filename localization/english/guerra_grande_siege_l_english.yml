l_english:

# EN: The economic asymmetry of the Sitio Grande. Every figure quoted below is sourced in
#     ~/dev/juegos/victoria3-uruguay/SOURCES_siege.md and in the comments of
#     common/static_modifiers/guerra_grande_siege_modifiers.txt.

 gg_siege_port_without_a_countryside:0 "A Port Without a Countryside"
 gg_siege_port_without_a_countryside_desc:0 "Montevideo has the customs house and the bay, and nothing else. With Buenos Aires under blockade the whole trade of the basin comes through here: the receipts of the port rose from 86,000 pesos in 1844 to more than 2,900,000 in 1847. The advantage is not the water — the enemy has three landings of his own on the same river. It is that this is the one customs house a foreign shipmaster can clear through and still call his cargo lawful anywhere else. Immigrants keep landing: of 31,000 inhabitants only some 11,000 are orientals. But the quintas and the chacras are outside the wall and inside the enemy's line, so every arroba of meat and every bushel of grain must be bought and shipped in, and the garrison that eats it is not a national army."
 gg_siege_countryside_without_a_port:0 "Ports Nobody Recognises"
 gg_siege_countryside_without_a_port_desc:0 "The Cerrito governs the whole Republic except the walled city: the cattle, the hides, the saladeros and the horsemen are all out here, and the saladeros of the Buceo, of the Guardia de Arredondo on the Yaguarón and of the Uruguay river littoral work right through the war while Montevideo's own are ruined. Nor does it lack a coast. Oribe habilitated the Buceo by decree on 10 July 1843 and raised a customs house there with seventy officials in it; at its height forty overseas merchantmen lay off the beach. What it lacks is standing. The Buceo is an open roadstead with no harbour works, Montevideo declares every ship that calls there a pirate and every cargo contraband, and a single squadron can close all three landings in a week. A hide sold as contraband off a beach is still a hide sold — for less than it is worth, to whoever will risk coming."
 gg_siege_mortgaged_customs:0 "The Mortgaged Customs"
 gg_siege_mortgaged_customs_desc:0 "The Defensa has money and none of it is its own. The customs revenue is sold forward year by year to the Sociedad Compradora de los Derechos de Aduana, which collects it in exchange for half of what comes in; the contract of 12 October 1847 buys the whole revenue of 1850 for 555,000 pesos against a subsidy of 150,000 a month. The Plaza Matriz and the Cabildo are mortgaged to a French merchant. From June 1848 France pays 40,000 pesos a month by convention; from July 1850 Brazil pays 18,000 pesos fuertes a month in secret. Cash today, and a creditor for every peso of it."
 gg_siege_customs_house_at_the_buceo:0 "The Customs House at the Buceo"
 gg_siege_customs_house_at_the_buceo_desc:0 "On 10 July 1843 Oribe and his minister Villademoros habilitate the Buceo as a port, expressly so that the needs of the population may be more easily met and the state's duties more easily collected, and raise a customs house there — the 'aduana de Oribe' — with seventy officials under the Primer Receptor Ignacio Soria. It is the Cerrito's main source of revenue and it is a small one. Against that: the Cerrito owes nobody. Oribe refused a British loan of three million pesos rather than sign the perpetual alliance attached to it, and he governs and collects the country himself."
 gg_siege_trading_with_the_enemy:0 "Trading Across the Lines"
 gg_siege_trading_with_the_enemy_desc:0 "Both governments have forbidden all communication with the enemy — Montevideo on 26 June 1843, Oribe more tightly in February 1845 — and both license it anyway, because each needs exactly what the other has. Cattle walk into the besieged plaza by boat and along the coast, sold under permits signed at Oribe's own headquarters. Overseas cargo reaches Buenos Aires by paying duty at Montevideo first, so the commerce of the besiegers' own ally pays the government they are besieging. Neither side can starve the other, and both know it."
 gg_siege_the_asymmetry_tt:0 "Each government holds exactly what the other lacks. Montevideo has the recognised customs house, the deepwater bay and the foreign squadrons that keep it open: cash, and no countryside to feed itself or raise a national army. The Cerrito has the cattle, the hides, the saladeros and the horsemen of the whole Republic, and landings of its own on the same river — but they are open beaches, their customs house is recognised by nobody, and everything that leaves them leaves as contraband. Neither can finish the other, and that is why this lasts nine years."
 gg_siege_the_land_frontier_stays_open:0 "The Land Frontier Stays Open"
 gg_siege_the_land_frontier_stays_open_desc:0 "Close the river and the trade walks north. Oribe habilitates ports on the Yaguarón, the Laguna Merín and the Chuy and moves the Administración Central de la Aduana to Melo; from 1845 the saladeros work again in the north, where the frontier is open to the cattle trade while the ports of the Plata are shut, and the herds cross into Rio Grande do Sul on the hoof. No squadron in the river can reach any of it — the mirror of the sea lane the plaza cannot lose."
 gg_siege_no_breaching_guns:0 "No Breaching Guns"
 gg_siege_no_breaching_guns_desc:0 "Thirty-five pieces in the park before Montevideo and not one of them able to open a wall. Oribe sat down before the city expecting hunger to do the work, and hunger took nine years."
 gg_siege_guns_of_the_plaza:0 "The Guns of the Plaza"
 gg_siege_guns_of_the_plaza_desc:0 "Twenty-three guns in February, a hundred and eight hundred artillerymen by June. The besieged out-gunned the besiegers threefold."
 gg_siege_the_sea_lane_stays_open:0 "The Sea Lane Stays Open"
 gg_siege_the_sea_lane_stays_open_desc:0 "The port never closed. Men, money and food came in by ship for nine years, and no army in the countryside could reach the water."
