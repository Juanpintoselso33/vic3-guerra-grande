l_english:

# EN: The economic asymmetry of the Sitio Grande. Every figure quoted below is sourced in
#     ~/dev/juegos/victoria3-uruguay/SOURCES_siege.md and in the comments of
#     common/static_modifiers/guerra_grande_siege_modifiers.txt.

 gg_siege_port_without_a_countryside:0 "A Port Without a Countryside"
 gg_siege_port_without_a_countryside_desc:0 "Montevideo has the customs house and the bay, and nothing else. With Buenos Aires under blockade the whole trade of the basin comes through here: the port's receipts rose from 86,000 pesos in 1844 to more than 2,900,000 in 1847. Its advantage is not access to the water — the enemy has three landing places of his own on the same river. It is that this is the only customs house through which a foreign shipmaster may clear his vessel and still have his cargo recognised as lawful elsewhere. Immigrants continue to land: of 31,000 inhabitants, only some 11,000 are Uruguayans. Yet the quintas and chacras lie beyond the walls and within the enemy's lines, so every arroba of meat and every bushel of grain must be purchased and brought in by water, while the garrison consuming it is no national army."
 gg_siege_countryside_without_a_port:0 "Ports Nobody Recognises"
 gg_siege_countryside_without_a_port_desc:0 "The Cerrito governs the whole Republic except the walled city: the cattle, hides, saladeros and horsemen are all here, and the saladeros of the Buceo, the Guardia de Arredondo on the Yaguarón and the Uruguay River littoral continue working throughout the war while Montevideo's are ruined. Nor does the Cerrito lack a coast. Oribe opened the Buceo to commerce by decree on 10 July 1843 and established a customs house there with seventy officials; at its height, forty ocean-going merchantmen lay off the beach. What it lacks is recognition. The Buceo is an open roadstead without harbour works; Montevideo declares every ship that calls there a pirate and every cargo contraband; and a single squadron can close all three landing places within a week. A hide sold as contraband from a beach is still a hide sold — below its worth, to whoever will risk approaching."
 gg_siege_mortgaged_customs:0 "The Mortgaged Customs"
 gg_siege_mortgaged_customs_desc:0 "The Defensa has money and none of it is its own. The customs revenue is sold forward year by year to the Sociedad Compradora de los Derechos de Aduana, which collects it in exchange for half of what comes in; the contract of 12 October 1847 buys the whole revenue of 1850 for 555,000 pesos against a subsidy of 150,000 a month. The Plaza Matriz and the Cabildo are mortgaged to a French merchant. From June 1848 France pays 40,000 pesos a month by convention; from July 1850 Brazil pays 18,000 pesos fuertes a month in secret. Cash today, and a creditor for every peso of it."
 gg_siege_customs_house_at_the_buceo:0 "The Customs House at the Buceo"
 gg_siege_customs_house_at_the_buceo_desc:0 "On 10 July 1843 Oribe and his minister Villademoros open the Buceo as a port, expressly so that the needs of the population may be met more readily and the State's duties collected more easily. They establish a customs house there — the 'aduana de Oribe' — with seventy officials under Chief Receiver Ignacio Soria. It is the Cerrito's chief source of revenue, and a modest one. Yet the Cerrito owes nobody. Oribe refused a British loan of three million pesos rather than sign the perpetual alliance attached to it, and he governs the country and collects its revenues himself."
 gg_siege_trading_with_the_enemy:0 "Trading Across the Lines"
 gg_siege_trading_with_the_enemy_desc:0 "Both governments have forbidden all communication with the enemy — Montevideo on 26 June 1843, Oribe more tightly in February 1845 — and both license it anyway, because each needs exactly what the other has. Cattle reach the besieged city by water and along the coast, sold under permits signed at Oribe's own headquarters. Overseas cargo reaches Buenos Aires by paying duty at Montevideo first, so the commerce of the besiegers' own ally pays the government they are besieging. Neither side can starve the other, and both know it."
 gg_siege_the_land_frontier_stays_open:0 "The Land Frontier Stays Open"
 gg_siege_the_land_frontier_stays_open_desc:0 "Close the river and commerce walks north. Oribe licenses ports on the Yaguarón, the Laguna Merín and the Chuy and moves the Administración Central de la Aduana to Melo; from 1845 the northern saladeros resume work, the frontier remains open to the cattle trade while the ports of the Plata are closed, and the herds cross into Rio Grande do Sul on the hoof. No squadron in the river can reach any of it — the landward counterpart to the sea lane that Montevideo cannot afford to lose."
 gg_siege_no_breaching_guns:0 "No Breaching Guns"
 gg_siege_no_breaching_guns_desc:0 "Thirty-five pieces in the park before Montevideo and not one of them able to open a wall. Oribe sat down before the city expecting hunger to do the work, and hunger took nine years."
 gg_siege_guns_of_the_plaza:0 "The Guns of Montevideo"
 gg_siege_guns_of_the_plaza_desc:0 "Twenty-three guns in February; one hundred guns and eight hundred artillerymen by June. The besieged out-gunned the besiegers threefold."
 gg_siege_the_sea_lane_stays_open:0 "Reinforcements by Sea"
 gg_siege_the_sea_lane_stays_open_desc:0 "What the city cannot raise from its own people comes in by sea: men, money and powder, while the garrison makes good its losses behind the walls. The Defensa recovers #P 2#! endurance a month."
