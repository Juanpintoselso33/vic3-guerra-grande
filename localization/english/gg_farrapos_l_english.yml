l_english:

# EN: the Ragamuffin War (1835-1845) and its Oriental links. 23/9/2026 (Juan, balance A + I2).
 dp_gg_farrapos:0 "Ragamuffin War"
 gg_farrapos.3.t:0 "Ponche Verde"
 gg_farrapos.3.d:0 "On 25 February, at Ponche Verde, Antônio Vicente da Fontoura read the republican chiefs the twelve conditions he had brought from the Court. On the 28th David Canabarro and Manuel Lucas de Oliveira signed the act, and the Riograndense Republic that Netto proclaimed on 11 September 1836 ceased to exist. There is no treaty between two parties: the Empire never recognised the Republic. There is a decree of amnesty of 18 December and a set of reserved instructions.\n\nThe conditions are these: full oblivion and no prosecutions, freedom for the prisoners, the Republic's public debt guaranteed by the Empire, the officers into the imperial army with their ranks, the generals excepted, the soldiers exempt from recruitment, and freedom for the slaves who served in the republican ranks. Canabarro put it to his men without ceremony: “the continuation of a war would be the ultimatum of the destruction and annihilation of our land”, and pointed to a “foreign power” that threatens the integrity of the Empire.\n\nThat power is on the Plata. The Baron of Caxias will proclaim the peace on 1 March, and the province that fought the Empire for nine years becomes its border with Rosas and with Oribe. How much of the reserved articles is kept decides in what spirit it will hold that border."
 gg_farrapos.3.f:0 "“Eternal damnation on whoever remembers our dissensions.” Baron of Caxias, 1 March 1845."
 gg_farrapos.3.a:0 "Keep all twelve articles, the reserved ones too."
 gg_farrapos.3.a_tt:0 "@information! The Treasury takes on the Republic's debt, and its officers join the army with their ranks: the province puts its cavalry at the Empire's service."
 gg_farrapos.3.b:0 "The decree of amnesty, and nothing more."
 gg_farrapos.3.b_tt:0 "@warning! The debt is saved, but the province is pacified without being won over: nothing reserved is kept."
 gg_farrapos.4.t:0 "The Peace of Ponche Verde"
 gg_farrapos.4.d:0 "The proclamations of 28 February and 1 March arrive from Río Grande. The Riograndense Republic has ended without a last battle: Canabarro and Lucas de Oliveira signed an act, and the Baron of Caxias proclaimed the peace from the banks of the Santa Maria. The Emperor ordered the past forgotten, and Caxias promises to see it done “on my word of honour”.\n\nFor nine years that war was our border. Its horse herds, its jerked beef and its chiefs all passed this way; Bento Gonçalves and General Rivera have known each other since the Portuguese army. Now Canabarro speaks to his men of a “foreign power” that threatens the integrity of the Empire, and in Rio de Janeiro nobody doubts which one.\n\nThe Empire has Caxias, his army and the republican officers with their ranks, all on our border and none with a war of its own to attend to. What it does with them it will decide with its eyes on Rosas."
 gg_farrapos.4.f:0 "“Uma só vontade nos una, rio-grandenses.”"
 gg_farrapos.4.a:0 "Let our minister in Rio make the most of it."
 gg_farrapos.6.t:0 "Caxias on the Border"
 gg_farrapos.6.d:0 "In November 1842 the Baron of Caxias took the presidency of Río Grande and the command of arms. He found eleven thousand five hundred and forty-nine imperial men, four and a half thousand of them in garrisons, against some three thousand five hundred republicans who, when pressed, cross into the Banda Oriental, where Rivera shelters them, and come back with horses.\n\nThe first thing he did was write to General Oribe. He proposes an agreement that the republicans shall not cross the border, and he wants to buy horse herds in our countryside for a cavalry he himself admits is inferior. In Rio de Janeiro there is already talk of an alliance with the Confederation to restore peace in the Oriental Republic and in the province of Río Grande at once, against the rebels who have “allied and united with Fructuoso Rivera”.\n\nClosing the border to Piratini is a favour to the Empire, which to this day backs the colorados. Leaving it open leaves Rivera his friends on the other side."
 gg_farrapos.6.f:0 "A border the cattle cross by night."
 gg_farrapos.6.a:0 "The republicans shall not cross the line."
 gg_farrapos.6.b:0 "The border is this Republic's business."
 gg_prewar.9.c:0 "Let Ignacio Oribe give battle, and accept the treaty the Regency offers."
 gg_prewar.9.c_tt:0 "@information! Republicans who cross are hunted on this side: Rivera gets less from Piratini, and whatever he signs with them stays on paper."
 gg_prewar.9.a_cangue_tt:0 "@information! With the countryside in hand, Rivera is free to treat with Piratini: three thousand horses for his line cavalry and a force at Santa Teresa against the Empire's supplies."
 gg_phase1.7.d_nopni:0 "On 28 November last, José María Paz, the one-armed general, destroyed Echagüe at Caaguazú, leaving Entre Ríos with a new governor: Justo José de Urquiza. Paz proclaimed himself governor of Entre Ríos, and in February the envoys of Paz, Pedro Ferré, Juan Pablo López and Rivera agreed to continue the war towards a precise end: a new State comprising Entre Ríos, Corrientes, Santa Fe and the Banda Oriental. Río Grande, once counted in, is the Empire's again.\n\nToday, at Paysandú, the allied chiefs offer Rivera supreme command of their armies. Paz takes offence. Nobody in Entre Ríos recognises him as governor, and Admiral Brown has already swept Garibaldi's flotilla from the river.\n\nTo command the coalition is to answer for everything that goes wrong."
 gg_phase1.8.c:0 "Cross with Netto's riograndenses: two thousand horses for seven hundred men."
 gg_phase1.8.c_tt:0 "@information! The treaty of San Fructuoso is kept: five hundred infantry and two hundred freedmen horsemen under Netto cross with Rivera, and the horses go to Río Grande. If the crossing goes wrong, the defeat costs less."
 gg_tt_farrapos_refuge_-3:0 "@arrow_down! The Farrapos' Oriental refuge #N closes#!: no passage across the border and no horse herds."
 gg_tt_farrapos_refuge_-1:0 "@arrow_down! The Farrapos' Oriental refuge drops #N one step#!."
 gg_tt_farrapos_refuge_0:0 "@information! The Farrapos' Oriental refuge stays as it is."
 gg_tt_farrapos_refuge_1:0 "@arrow_up! The Farrapos' Oriental refuge rises #P one step#!."
 gg_tt_farrapos_refuge_means:0 "@information! What the refuge is worth in Río Grande: #b closed#!, republican spirits hold down to #N -60#!; #b watched#!, down to #N -50#! and #P +10%#! defence in their countryside; #b open#!, down to #N -40#!, #P +20%#! and #P -5%#! desertion; #b allied#!, down to #N -30#!, #P +30%#! and #P -10%#! desertion."
 gg_farrapos_refuge_1:0 "Oriental Refuge: Watched"
 gg_farrapos_refuge_1_desc:0 "The border with the Estado Oriental is watched but not closed: when pressed, the republicans cross and come back with horses."
 gg_farrapos_refuge_2:0 "Oriental Refuge: Open"
 gg_farrapos_refuge_2_desc:0 "Nobody hunts them on the other side of the line. Horse herds, jerked beef and chiefs come and go across the border."
 gg_farrapos_refuge_3:0 "Oriental Refuge: Allied"
 gg_farrapos_refuge_3_desc:0 "The Oriental countryside is the Republic's rear: horses by treaty, free passage and friends in the government at Montevideo."
 gg_ponche_verde_officers:0 "The Officers of Ponche Verde"
 gg_ponche_verde_officers_desc:0 "The republican officers entered the imperial army with their ranks. They know the countryside and the border better than anyone."
 gg_ponche_verde_decree_only:0 "The Decree Alone"
 gg_ponche_verde_decree_only_desc:0 "Of Ponche Verde, the amnesty was kept and nothing more. Río Grande is at peace, but it is not content."
