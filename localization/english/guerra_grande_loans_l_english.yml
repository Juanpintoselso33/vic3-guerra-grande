l_english:

# EN: The Brazilian loan and what it cost, and the Argentine money that mirrors it.
#     Every figure, date and quotation is sourced in SOURCES_loans.md and in the
#     comments of events/guerra_grande_loans.txt.

 gg_loan.1.t:0 "Forty Thousand Pesos a Month"
 gg_loan.1.d:0 "The squadrons are going home and the treasury remains empty. On 12 June 1848 the baron de Gros, vice-admiral Le Prédour and the chargé d'affaires Devoize sign a convention for relief funds with Joaquín Suárez's government, in force from the fifteenth: forty thousand pesos corrientes at the end of every month, ‘in cash or bills drawn on France’, beginning on the thirtieth. It is no gift. The articles call it a reimbursable loan and name its security: customs revenue from 1852 onward. But the customs have already been sold. Since the contract of 5 March 1846, a company of creditor-shareholders has owned the duties of future years in advance, and the government lives on whatever funds its creditors release. This would pledge what remains of what remains."
 gg_loan.1.f:0 "Paris will pay for the walls. Somebody will pay Paris."
 gg_loan.1.a:0 "Sign the convention. The city eats this month."
 gg_loan.1.b:0 "The Republic will not mortgage a customs house it no longer owns."
 gg_loan.2.t:0 "The Contracts of September"
 gg_loan.2.d:0 "The French monthly payments are being reduced, and Andrés Lamas has spent three years in Río de Janeiro asking the Empire to replace them. On 6 September 1850 he succeeds: eighteen thousand pesos fortes a month for thirteen months, secured upon the Republic's revenues once order is restored. The contracts are secret. The merchant Irineu Evangelista de Souza will deliver the bills, allowing the arrangement to appear in public as one mercantile house supporting another; article 6 entitles him to collect the receipts, which become instruments of a debt to Brazil. The same money may be obtained another way. Souza will advance it on his own account, in francs and at his own price: of the first three instalments of fifty-four thousand pesos fortes he retains forty-two thousand, and of the ten monthly instalments of eighteen thousand he keeps thirteen thousand two hundred."
 gg_loan.2.f:0 "The Empire's money, or a merchant's, and the merchant is the Empire."
 gg_loan.2.a:0 "Sign with the Empire. Let it be an alliance."
 gg_loan.2.b:0 "Take it through Souza's house. Keep the Empire off the paper."
 gg_loan.2.c:0 "No. This month's pay will be found in Montevideo."
 gg_loan.3.t:0 "The Buceo Customs or the Buenos Aires Treasury"
 gg_loan.3.d:0 "Every department but the walled city answers to the Cerrito, yet none of them produces coin. The country has cattle and hides, and hides require a port. On 10 July 1843 a decree goes out under the signatures of Oribe and Villademoros: the bay of the Buceo is opened ‘provisionally, so that the needs of the population may be met more readily and the collection of duties for the State made easier’. There will be a mole, a partly fortified customs house, seventy officials under the collector Ignacio Soria and, in time, more than forty ocean-going merchantmen in the roads. Montevideo answers by declaring every ship that calls there a pirate and all its commerce contraband. The alternative is more direct. Rosas named Oribe commander-in-chief of the Ejército de Vanguardia in October 1840 and has supplied that army with cattle and hard money ever since; Buenos Aires can simply pay for the siege."
 gg_loan.3.f:0 "A customs house of our own, or a chest across the river."
 gg_loan.3.a:0 "Take the chest. The siege cannot wait for the hides."
 gg_loan.3.b:0 "Open the Buceo. What the country earns, the country spends."
 gg_loan.4.t:0 "Reuniting the Fatherland"
 gg_loan.4.d:0 "An alliance, not a flag. Rosas gets a friend, not a province."
 gg_loan.4.f:0 "There is no instrument. There is an offer, and there is a committee."
 gg_loan.4.a:0 "Accept. Let the Banda Oriental be a province of the Confederation again."
 gg_loan.4.b:0 "Send it to a commission of the Assembly."
 gg_loan.4.c:0 "The Republic is a republic. Tell Buenos Aires so."
 gg_loan.5.t:0 "The Account of Twelve October"
 gg_loan.5.d:0 "Five treaties in one day in Río de Janeiro, all signed by Andrés Lamas: alliance, boundaries, extradition, commerce and navigation, and financial relief. Under the last, the Empire grants sixty thousand patacones a month from 1 November, lends a hundred and thirty-eight thousand at once at six per cent a year, and the Uruguayan government acknowledges two hundred and eighty-eight thousand seven hundred and ninety-one pesos fuertes already advanced, together with interest. Article X names the security: the Republic 'mortgages all revenues of the State, all direct and indirect contributions, and especially customs duties'. Until the debt is discharged, a Junta de Crédito Público with imperial representatives administers the country's finances. Lamas wrote to his minister the next day that, in a question of territory, force is the only true title; that the dispute could continue only to the advantage of the stronger party; and that a clear and recognised right was at least a barrier. The reckoning lies on the table all the same."
 gg_loan.5.f:0 "The siege is lifted. The books are opened."
 gg_loan.5.a:0 "Recognise it. What was borrowed was spent on the walls."
 gg_loan.5.b:0 "Burn them in the Plaza. Nothing there was signed by a free hand."
 gg_loan.6.t:0 "The Debts of the Cerrito"
 gg_loan.6.d:0 "The Pantanoso, 8 October 1851. Oribe is at liberty and may go where he pleases; the acts of his government are valid for all purposes; every Uruguayan has the same rights, whichever ribbon he wore; resistance to the Anglo-French intervention is recognised as a defence of Uruguayan independence; the war ends with neither victors nor vanquished. Amid the clauses of a capitulation that reads like an amnesty lies one sentence about money: the government returned by the next elections will assume the debts contracted by this one. Nine years of a country governed from a hill, financed by a customs house on an open bay and by the treasury in Buenos Aires, reduced to a figure that somebody else must carry. Four months later, at Caseros, the man who filled that treasury will lose everything in an afternoon and take ship for England."
 gg_loan.6.f:0 "Neither victors nor vanquished. Only creditors."
 gg_loan.6.a:0 "Recognise what was borrowed. The men were fed on it."
 gg_loan.6.b:0 "There is no creditor left. Let the account die with him."
