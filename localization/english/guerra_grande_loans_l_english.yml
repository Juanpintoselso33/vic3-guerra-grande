l_english:

# EN: The Brazilian loan and what it cost, and the Argentine money that mirrors it.
#     Every figure, date and quotation is sourced in SOURCES_loans.md and in the
#     comments of events/guerra_grande_loans.txt.

 gg_loan.1.t:0 "Forty Thousand Pesos a Month"
 gg_loan.1.d:0 "The squadrons are going home and the treasury is not filling. On 12 June 1848 the baron de Gros, vice-admiral Le Prédour and the chargé d'affaires Devoize sign a convention of prestación de socorros with Joaquín Suárez's government, in force from the fifteenth: forty thousand pesos corrientes at the end of every month, 'en dinero o en letras sobre Francia', beginning on the thirtieth. It is not a gift. The articles call it a reimbursable loan and they name the security: the customs, from 1852 onward. The customs are already sold. Since the contract of 5 March 1846 a society of creditor shareholders has owned the duties of future years in advance, and the government lives on what that cash box hands it. This would pledge what is left of what is left."
 gg_loan.1.f:0 "Paris will pay for the walls. Somebody will pay Paris."
 gg_loan.1.a:0 "Sign the convention. The city eats this month."
 gg_loan.1.b:0 "The Republic will not mortgage a customs house it no longer owns."
 gg_loan.2.t:0 "The Contracts of September"
 gg_loan.2.d:0 "The French monthly payments are being cut and Andrés Lamas has spent three years in Río de Janeiro asking the Empire to take their place. On 6 September 1850 he gets it: eighteen thousand pesos fortes a month for thirteen months, guaranteed on the fiscal revenues of the Republic for when order is restored. The contracts are secret. The bills will be handed over by the merchant Irineu Evangelista de Souza, so that in public it reads as one trading house supporting another; article 6 has him collect the receipts, and the receipts are the titles of a debt to Brazil. There is a second way to take the same money. Souza will advance it on his own account, in francs, at his own price: of the first three instalments of fifty-four thousand pesos fortes he retains forty-two thousand, and of the ten monthly instalments of eighteen thousand he keeps thirteen thousand two hundred."
 gg_loan.2.f:0 "The Empire's money, or a merchant's, and the merchant is the Empire."
 gg_loan.2.a:0 "Sign with the Empire. Let it be an alliance."
 gg_loan.2.b:0 "Take it through Souza's house. Keep the Empire off the paper."
 gg_loan.2.c:0 "No. This month's pay will be found in Montevideo."
 gg_loan.3.t:0 "The Buceo and the Chest"
 gg_loan.3.d:0 "Every department but the walled city answers to the Cerrito, and none of it is money. The country is cattle and hides, and hides need a port. On 10 July 1843 the decree goes out over Oribe's signature and Villademoros': the bay of the Buceo is opened, 'con carácter provisorio a fin de que más fácilmente se llenen las necesidades de la población y se haga más fácil el percibo de los derechos para el estado'. There will be a mole, a customs house in part artilleried, seventy officials under the receptor Ignacio Soria, and in time more than forty deep-sea merchantmen in the roads. Montevideo answers by declaring every ship that calls there a pirate and the whole traffic contraband. The other road is shorter. Rosas named Oribe general in chief of the Ejército de Vanguardia in October 1840 and has kept that army in cattle and hard money ever since; Buenos Aires will simply pay for the siege."
 gg_loan.3.f:0 "A customs house of our own, or a chest across the river."
 gg_loan.3.a:0 "Take the chest. The siege cannot wait for the hides."
 gg_loan.3.b:0 "Open the Buceo. What the country earns, the country spends."
 gg_loan.4.t:0 "The Reunification of the Patria"
 gg_loan.4.d:0 "An alliance, not a flag. Rosas gets a friend, not a province."
 gg_loan.4.f:0 "There is no document. There is an offer, and there is a commission."
 gg_loan.4.a:0 "Accept. Let the Banda Oriental be a province of the Confederation again."
 gg_loan.4.b:0 "Send it to a commission of the Assembly."
 gg_loan.4.c:0 "The Republic is a republic. Tell Buenos Aires so."
 gg_loan.5.t:0 "The Account of Twelve October"
 gg_loan.5.d:0 "Five treaties in one day in Río de Janeiro, all of them signed by Andrés Lamas: alliance, limits, extradition, commerce and navigation, and the prestación de socorros. By the last, the Empire cedes sixty thousand patacones a month from 1 November, lends a hundred and thirty-eight thousand at once at six per cent a year, and the oriental government recognises two hundred and eighty-eight thousand seven hundred and ninety-one pesos fuertes of what it has already been lent, with the interest on it. Article X says what stands behind the figure: the Republic 'hipoteca todas las rentas del Estado, todas las contribuciones directas e indirectas, especialmente los derechos de aduana'. Until it is cancelled, a Junta de Crédito Público with imperial members administers the finances of the country. Lamas wrote to his minister the next day that in a question of territory the true title is force, that the dispute could only go on to the profit of the strong, and that a clear recognised right was at least a barrier. The account is on the table either way."
 gg_loan.5.f:0 "The siege is lifted. The books are opened."
 gg_loan.5.a:0 "Recognise it. What was borrowed was spent on the walls."
 gg_loan.5.b:0 "Burn them in the Plaza. Nothing there was signed by a free hand."
 gg_loan.6.t:0 "The Debts of the Cerrito"
 gg_loan.6.d:0 "The Pantanoso, 8 October 1851. Oribe is at liberty and may dispose of his own person; the acts of his government are held legal to every effect; every oriental has the same rights whichever ribbon he wore; the resistance to the Anglo-French intervention is recognised as a defence of oriental independence; the war ends with neither victors nor vanquished. And among the clauses of a capitulation that reads like an amnesty there is one line about money: the government that comes out of the next elections assumes the debts this one contracted. Nine years of a country governed from a hill, financed by a customs house on an open bay and by a chest in Buenos Aires, reduced to a figure somebody else will carry. Four months from now, at Caseros, the man who filled that chest will lose everything in an afternoon and take ship for England."
 gg_loan.6.f:0 "Neither victors nor vanquished. Only creditors."
 gg_loan.6.a:0 "Recognise what was borrowed. The men were fed on it."
 gg_loan.6.b:0 "There is no creditor left. Let the account die with him."
