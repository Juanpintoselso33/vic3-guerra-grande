l_english:
 gg_ui_brazil_commitment:0 "#b The Pledge to the Empire#!\nThe Defensa has accepted Brazil's backing: any peace it signs will be on Brazilian terms, and it can no longer turn to London and Paris for protection."
 gg_ui_customs_commitment:0 "#b The Customs Revenue#!\nThe Defensa has drawn #V 40,000#! against its customs house. The debt will have to be settled after the peace."
 gg_ui_empty:0 ""
 gg_ui_squadrons_action_tt:0 "Requires open war, both governments established, and the squadrons not yet requested. Available from #V 1843#! if a great power has an interest in the Plata, or from #V 1848#! regardless.\n\n[GetScriptedGui('gg_ui_call_squadrons').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_backing_tt:0 "Backing runs from #V 0#! to #V 100#!. The figure alone is no treaty: commitments are entered into only when their terms are accepted."
