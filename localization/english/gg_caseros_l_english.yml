l_english:
 gg_argentina.41.a_tt:0 "@warning! If the Buenos Aires army is beaten in this war, Rosas's government falls at once: #b Urquiza#! takes command and Rosas goes into exile. No siege, no interval."
 gg_argentina.41.b_tt:0 "@information! The war goes on. Every month Buenos Aires is not beaten, Entre Ríos loses #N 5#! war support. If after #V 6#! months nobody has won, the war ends without a victor: the Pronunciamiento stands and Rosas keeps his government."
 gg_argentina.41.c_tt:0 "@information! Buenos Aires holds out under siege for #V 6#! months at least. Until then no ending is written: Rosas keeps the capital and his government even if the campaign is decided sooner. If Entre Ríos wins in the end, Rosas falls and goes into exile, but the Confederation stands."
 gg_argentina.41.a_day_tt:0 "@information! The day will not be decided by chance but by the war as it was fought: the battles each side has lost, the ground each holds (#b Buenos Aires#!, #b Santa Fe#!, #b Entre Ríos#!), the battalions under arms and the spirit of each camp. Brazil and the Republic marching complete weigh #V 10#! for Urquiza; Urquiza marching alone, #V 10#! for Rosas. Whoever leads by #V 10#! carries the day; closer than that, fortune decides. Whoever carries it gains #P +30#! war support a month, and the other loses #N -40#!."
 gg_argentina.41.b_day_tt:0 "@information! The day will not be decided by chance but by the war as it was fought: the battles each side has lost, the ground each holds (#b Buenos Aires#!, #b Santa Fe#!, #b Entre Ríos#!), the battalions under arms and the spirit of each camp. Refusing battle to manoeuvre weighs #V 10#! for Rosas. Brazil and the Republic marching complete weigh #V 10#! for Urquiza; Urquiza marching alone, #V 10#! for Rosas. Whoever leads by #V 10#! carries the day; closer than that, fortune decides. Whoever carries it gains #P +30#! war support a month, and the other loses #N -40#!."
 gg_argentina.41.c_day_tt:0 "@information! The day will not be decided by chance but by the war as it was fought: the battles each side has lost, the ground each holds (#b Buenos Aires#!, #b Santa Fe#!, #b Entre Ríos#!), the battalions under arms and the spirit of each camp. Holding the city weighs #V 5#! for Rosas. Brazil and the Republic marching complete weigh #V 10#! for Urquiza; Urquiza marching alone, #V 10#! for Rosas. Whoever leads by #V 10#! carries the day; closer than that, fortune decides. Whoever carries it gains #P +30#! war support a month, and the other loses #N -40#!."
 gg_argentina.83.d_pitched:0 "The Buenos Aires army accepted battle in the open field and was beaten, and Rosas's government did not outlive the day. Rosas embarked on a British ship bound for England.\n\nUrquiza enters Buenos Aires as head of the victorious coalition. Entre Ríos does not disappear or become a possession of the port; it retains its government within the settlement that must now organise the Confederation. The campaign's debts and commitments to Brazil survive victory.\n\nWar decided who governs. A constitution will decide under which rules."
 gg_argentina.83.d_siege:0 "Buenos Aires held out for six months under siege, and it was not enough. Rosas gave up the government and embarked on a British ship bound for England; the city itself was spared.\n\nUrquiza enters Buenos Aires as head of the victorious coalition. Entre Ríos does not disappear or become a possession of the port; it retains its government within the settlement that must now organise the Confederation. The campaign's debts and commitments to Brazil survive victory.\n\nWar decided who governs. A constitution will decide under which rules."
 gg_argentina.85.d_manoeuvre:0 "Six months of marching and counter-marching never brought the battle Urquiza sought, and his army tired before that of Buenos Aires. The war ended without a victor.\n\nThere is no reunited Confederation to proclaim and no fall of Rosas to pretend. Two authorities survived, and the Federal Pact can no longer reunite them by itself.\n\nThe campaign closes in division. Any future reunion must arise from another agreement or another war."
 gg_caseros.2.t:0 "Rosas's Answer"
 gg_caseros.2.d_battle:0 "Rosas awaits us in the open field. If his army is beaten, his government falls at once and he goes into exile."
 gg_caseros.2.d_manoeuvre:0 "Rosas will not give battle: he manoeuvres to choose his own ground. Every month we fail to catch him costs us #N 5#! war support, and if after #V 6#! months nobody has won, the war ends without a victor."
 gg_caseros.2.d_siege:0 "Rosas shuts himself up in Buenos Aires. The city will hold for #V 6#! months at least, and until then, even if the campaign is decided, he keeps the capital and his government."
 gg_caseros.2.a:0 "Forward."
 gg_caseros.3.t:0 "The Siege of Buenos Aires Runs Its Course"
 gg_caseros.3.d:0 "Six months of siege have passed. From now on, whatever the war between Buenos Aires and Entre Ríos decides will stand without further delay."
 gg_caseros.3.a:0 "Let it be known."
 gg_caseros.4.d:0 "The war ended without our bringing Rosas down or his bringing us to heel. The Pronunciamiento stands: Entre Ríos keeps the authority it resumed, and Rosas his government."
 gg_caseros.4.d_manoeuvre:0 "Six months chasing an army that would not give battle wore out our troops before his. The war ended without a victor: the Pronunciamiento stands, and Rosas keeps his government."
 gg_caseros.4.a:0 "Back to Entre Ríos."
 gg_caseros.5.d:0 "Buenos Aires has been beaten. Urquiza takes command of the Confederation, and Entre Ríos keeps its government within the settlement that must now be organised."
 gg_caseros.5.d_exile:0 "Buenos Aires has been beaten and Rosas's government has fallen with it: Rosas has gone into exile aboard a British ship. Urquiza takes command of the Confederation, and Entre Ríos keeps its government within the settlement that must now be organised."
 gg_caseros.5.a:0 "Enter Buenos Aires."
 gg_pact_war_tilt_tt:0 "@warning! Buenos Aires does not leave the defensive: while this war lasts, #b Entre Ríos#! gains #P +30#! war support a month. If the Littoral crosses in arms, Buenos Aires's ranks fall apart: #N -40#! a month. If Buenos Aires holds the day of Caseros, the war turns: #b Buenos Aires#! gains #P +30#! a month and the Ejército Grande comes apart, #N -40#! a month."
 gg_pact_war_hold_tt:0 "@warning! Neither side lays down its arms early: until the summer of 1852, the war support of #b Entre Ríos#! and of #b Buenos Aires#! never stays below #V 50#!: each day it falls under it, it is propped back up."
