 je_gg_factions:0 "Doctors and Caudillos"
 je_gg_factions_reason:0 "Inside each side, the fight is over who rules: the city's doctores or the countryside's caudillos."
 je_gg_factions_desc:0 "The struggle was not only between blancos and colorados. Both sides had doctores and caudillos: in the Cerrito, Oribe against Berro and Acevedo; in the Defensa, Rivera and Flores against Herrera y Obes and Suárez. Each balance runs from −100 (the caudillos rule) to 100 (the doctores rule), and decisions move it.\n\n#b What it does:#! with the caudillos strong (−30 or less), that government holds out longer. With the doctores strong (30 or more), the powers' peace offers cost it less and the postwar is more civil."
 je_gg_factions_status:0 "#blue_value Blancos#! #V [GetGlobalVariable('gg_cerrito_balance').GetValue|v0]#!  ·  #R Colorados#! #V [GetGlobalVariable('gg_defensa_balance').GetValue|v0]#!   (−100 caudillos · 100 doctores)"
