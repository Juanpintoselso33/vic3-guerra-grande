 gg_sea_bar:0 "The Sea"
 gg_sea_bar_desc:0 "@ships! France #V [GetGlobalVariable('gg_patron_francia').GetValue|v0]#! + Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|v0]#!"
 gg_sea_bar_second_desc:0 "opens at #V 60#!"
 gg_siege_bar:0 "The Siege"
 gg_siege_bar_desc:0 "Months with the sea shut: #V [GetGlobalVariable('gg_siege_months').GetValue|v0]#!"
 gg_siege_bar_second_desc:0 "at #V 24#! the Defensa negotiates"
 je_gg_patrons:0 "The Foreign Intervention"
 je_gg_patrons_reason:0 "Neither side can sustain the war without help from abroad."
 je_gg_patrons_desc:0 "The Guerra Grande was not fought among orientales alone. Rosas backed the #blue_value blancos#! with troops and money; France, Britain and Brazil backed the #R colorados#! with squadrons, subsidies and loans; Urquiza decided in 1851. Each one's backing runs from 0 to 100, and every decision moves it.\n\n#b What it does:#! a side whose foreign backing adds up to less than 40 loses war support every month, and each ally sends money according to its backing. France and Britain together, at 60 or more, open the river: the squadrons lift the Cerrito's blockade and the siege does not advance. At the peace, an ally's options only appear if it has backing, and a pledge made to Rosas or to the Empire narrows that side's menu."
 je_gg_patrons_status:0 "#blue_value Rosas#! #V [GetGlobalVariable('gg_patron_rosas').GetValue|v0]#!  ·  #R France#! #V [GetGlobalVariable('gg_patron_francia').GetValue|v0]#!  ·  #R Britain#! #V [GetGlobalVariable('gg_patron_britania').GetValue|v0]#!  ·  #R Brazil#! #V [GetGlobalVariable('gg_patron_brasil').GetValue|v0]#!  ·  Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|v0]#!"
 je_gg_patrons_complete_tt:0 "The peace is signed."
 je_gg_patrons_fail_tt:0 "The Republic fell into foreign hands."
 je_gg_siege:0 "The Great Siege"
 je_gg_siege_reason:0 "Oribe's army stands before the walls of Montevideo."
 je_gg_siege_desc:0 "On 16 February 1843 Oribe's army arrived before Montevideo, and the siege would last eight and a half years. The Cerrito had three camps: the Cerrito de la Victoria, where the troops were organised; the Villa de la Restauración, seat of the government; and the port of the Buceo, through which the hides went out. Inside the walls, the Defensa raised an army under José María Paz and Melchor Pacheco y Obes, and the French, Spanish and Italian communities formed legions that together outnumbered the oriental soldiers.\n\n#b How it works:#! every month with the Cerrito's blockade in place and the sea shut adds one to the siege; any other month takes one away. At 24 the Defensa must negotiate (12 from 1851). A truce freezes it. France and Britain open the sea: follow it in «The Foreign Intervention»."
 je_gg_siege_status:0 "@ships! #b Months with the sea shut:#! #V [GetGlobalVariable('gg_siege_months').GetValue|v0]#! of #V 24#! (#V 12#! from 1851)"
 je_gg_siege_complete_tt:0 "The siege ended with the peace."
