 gg_brown_squadron_name:0 "Brown's Squadron"
 gg_lent_squadron_name:0 "The Anglo-French Squadron"
 gg_naval_anglo_french_station:0 "The Anglo-French Station"
 gg_naval_anglo_french_station_desc:0 "France and Britain hold the river: the port cannot be closed."
 gg_loan.1.a_tt2:0 "@information! The French convention is signed; Paris now owes the #R Defensa#! what the paper promises."
 gg_loan.2.a_tt2:0 "@information! The Empire is committed on paper, and its full weight can be called upon."
 gg_loan.2.b_tt2:0 "@information! The Empire is committed without appearing on the paper, and its full weight can still be called upon."
 gg_loan.3.a_tt2:0 "@warning! The #blue_value Cerrito#!'s debt is entered in the books and survives the war."
 gg_peace.6.a_tt2:0 "@information! The powers write the settlement; their terms govern both the end of the war and the order that follows."
 gg_powers.11.b_tt2:0 "@warning! Without the squadron there is no blockade: Rosas loses his bank's battery and #N cannot shut the river#! until it is returned."
 gg_powers.12.b_tt2:0 "@warning! The Hood bases are rejected: the powers' peace does not return until the arbiter brings it back."
 gg_powers.16.c_tt2:0 "@information! The mission stalls rather than breaks: it can be taken up again later."
 gg_powers.19.a_tt2:0 "@information! If exposed, the mission to Paris costs the Defensa some French backing."
 gg_powers.19.b_tt2:0 "@information! The Empire is committed, and its full weight can be called upon."
 gg_powers.21.b_tt2:0 "@warning! The customs house remains mortgaged after peace."
 gg_powers.26.a_tt2:0 "@information! Blaming Rosas before Europe hardens the mediators against the #blue_value Cerrito#!."
 gg_rivera.1.a_tt2:0 "@information! Rivera keeps an army in the countryside and the strength to contest the campaign."
 gg_rivera.1.b_tt2:0 "@information! Rivera is left outside without infantry; his next campaign rests on his own horsemen."
 gg_rivera.2.a_tt2:0 "@warning! Rivera loses the command but keeps a following outside the government."
 gg_rivera.2.b_tt2:0 "@information! With Brazilian arms Rivera takes the field again, and the Empire is inside the account."
 gg_rivera.2.c_tt2:0 "@warning! Held in Brazil, Rivera is out of the war, and those who handed him over earn his lasting enmity."
 gg_rivera.3.a_tt2:0 "@information! Rivera is restored to command, and his followers recover their place in the government."
 gg_rivera.3.b_tt2:0 "@warning! Rivera remains outside the government; his followers are left without a chief in the city's quarrels."
 gg_rivera.4.a_tt2:0 "@warning! Rivera is exiled to Río, though the government retains the power to recall him."
 gg_rivera.4.b_tt2:0 "@information! Rivera stays in the government; any new coalition must reckon with him from within."
 gg_rivera.4.c_tt2:0 "@information! Rivera's #b eight conditions#! remain on the table for any settlement."
 gg_rivera.5.a_tt2:0 "@information! The order of recall is sent; the road from Río is long, and Rivera's health is failing."
 gg_rivera.5.b_tt2:0 "@information! Rivera remains in Río, far from his followers and without a road home."
 gg_rivera.7.a_tt2:0 "@information! With Rivera on the littoral, Urquiza gains a Uruguayan intermediary beyond Rosas."
 gg_rivera.7.c_tt2:0 "@information! Rivera's #b eight conditions#! remain on the table for any settlement."
 gg_rivera.8.a_tt2:0 "@warning! #N Mitre leaves the Defensa's service#! and takes Echeverría's books to Valparaíso."
 gg_rivera.8.b_tt2:0 "@information! #P Bartolomé Mitre joins as a general#! and the Defensa's batteries gain #P 2 artillery units#! @battalions!; the disagreement with Rivera remains open."
 gg_rivera.8.c_tt2:0 "@information! #P Bartolomé Mitre joins Corrientes as a general#! and its army gains #P 1 artillery unit#! @battalions!."
 gg_argentina.22.a_tt:0 "@battalions! #N 2 infantry units#! and #N 2 artillery units#! are separated from the rest of the army into two real formations on the Paraná."
 gg_argentina.22.b_tt:0 "@information! The river claims of #b Corrientes#! and #b Entre Ríos#! are answered in the #b Federal Pact#!. @money! For #V 10 years#!, both provinces gain #P +10#! trade capacity and #P +1#! weekly trade; Buenos Aires loses #N 5%#! minting for #V 20 years#!."
 gg_argentina.22.c_tt:0 "@battalions! A limited defence gathers #N 1 infantry unit#! and #N 1 artillery unit#!. @information! The powers' mediation route is enabled without lifting the blockade."
 gg_argentina.23.a_tt:0 "@battalions! The #N 2 infantry units#! and #N 2 artillery units#! remain assigned to the Paraná and unavailable to other fronts."
 gg_argentina.23.b_tt:0 "@battalions! The mobile column —#P 1 infantry unit#! and #P 1 artillery unit#!— is mobilised for another front; the fixed battery remains on the river. @information! The mediation route is enabled."
 gg_argentina.24.a_tt:0 "@battalions! Both formations remain on the Paraná. @information! Buenos Aires retains the full material weight behind its demand for river sovereignty."
 gg_argentina.24.b_tt:0 "@battalions! The mobile column —#P 1 infantry unit#! and #P 1 artillery unit#!— is mobilised and, if it exists, deployed to the front against #b Corrientes#!. @warning! The river demand loses the support of that column."
 gg_argentina.24.c_tt:0 "@battalions! The mobile column —#P 1 infantry unit#! and #P 1 artillery unit#!— is mobilised and, if it exists, deployed to the front against #b Paraguay#!. @warning! The river demand loses the support of that column."
 gg_argentina.25.a_tt:0 "@information! Buenos Aires accepts the bases. The #blue_value Cerrito#! receives this same answer and, if it confirms it, the proposal passes to the #R Defensa#!. #b This option does not end the war.#!"
 gg_argentina.25.b_tt:0 "@warning! Buenos Aires rejects this route. The #blue_value Cerrito#! receives the same answer and operations continue."
 gg_argentina.26.a_tt:0 "@information! #P Every pending formal demand#! under the #b Federal Pact#! receives an answer; a province that has already withdrawn the commission #N does not entrust it anew#!. The #R Defensa#! receives the same news."
 gg_argentina.26.b_tt:0 "@information! #P One pending formal demand#! under the #b Federal Pact#! receives an answer, if any; all others remain as they are. The #R Defensa#! receives the same news and Buenos Aires's excerpt."
 gg_argentina.26.c_tt:0 "@information! The commission and its formal demands #V do not change#!. The news still reaches the #R Defensa#!, without an official publication from Buenos Aires to contest."
 gg_argentina.27.a_tt:0 "@battalions! The offensive against #b Rosas#! adds #P +2#! to the #R colorado#! war score. @warning! Challenging the Liberator's testament creates #N radicals#! in the city."
 gg_argentina.27.b_tt:0 "@battalions! Separating the Liberator from the government adds #P +1#! to the #R colorado#! war score without denying the testament."
