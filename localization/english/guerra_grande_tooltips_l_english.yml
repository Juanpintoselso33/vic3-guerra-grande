 je_gg_siege:0 "The Great Siege of Montevideo"
 je_gg_siege_reason:0 "The Cerrito rules the whole Republic save the city; the city keeps the harbour, the customs house and its walls. The besiegers have no breaching guns, and the besieged no countryside."
 je_gg_siege_desc:0 "The Cerrito rules the whole Republic save the city; the city keeps the harbour, the customs house and its walls. The besiegers have no breaching guns, and the besieged no countryside."
 je_gg_siege_complete_tt:0 "The siege is lifted with the peace."
