 gg_arg_intro.1.t:0 "The Commission"
 gg_arg_intro.1.d:0 "Your power over the other provinces is not sovereignty, and this government has never claimed otherwise. By the #b Federal Pact of 4 January 1831#! — a treaty between entities that recognise one another as sovereign — the provinces entrusted the conduct of their foreign relations to the governor of Buenos Aires. Nothing more. There is no national state here for him to govern.\n\nThe count that matters is therefore one of #b consent#!: #V thirteen#! provinces, the Confederation's fourteen less Buenos Aires itself. Each retains, in writing, the right to withdraw the authority it lent. Every year this government offers to relinquish the commission, and every year they refuse. It is a ceremony, and the whole foundation of your authority.\n\nTwo things can undo it, and neither requires a lost battle. A legislature may #b withdraw the commission#! by vote, after which its province speaks for itself before the world. Short of that are #b formal demands left unanswered#!, accumulating in plain view. And when fewer than #b half#! still entrust their foreign relations to Buenos Aires — six of thirteen — its governor speaks for a minority, which is to say for nothing at all. For now, no province has moved."
 gg_arg_intro.1.f:0 "‘Entrusted with the foreign relations of the Confederation.’"
 gg_arg_intro.1.a:0 "Thirteen, and they have not moved."
 gg_intro.1.t:0 "The Guerra Grande"
 gg_intro.1.d:0 "Montevideo, January 1836. The Republic is fourteen years old and already has two masters: president #b Manuel Oribe#! and the Commander General of the Countryside, #b Fructuoso Rivera#!, who cannot stand each other. From that quarrel will come the ribbons — #blue_value blancos#! and #R colorados#! — and in time two governments that will each call themselves the lawful one: the #R Defensa#! shut inside Montevideo and the #blue_value Cerrito#! encamped before it.\n\nFrom here on everything is counted. Every treaty, every favour called in or refused tips the scale toward one ribbon, and from 1843 the months of the ring tip it too. When one ribbon is #V 10#! ahead, the other will have nothing left but to come to the table, and whoever ends on top will dictate the terms.\n\nAnd there is a second reckoning, kept far from Montevideo: neither side can pay for this war alone. Rosas backs the #blue_value blancos#! from Buenos Aires; France, Britain and the Empire of Brazil watch the place. While the river is open, the city eats. The day it closes, the ring decides."
 gg_intro.1.f:0 "Two ribbons, two governments, one country."
 gg_intro.1.a:0 "Let it all be counted."
 gg_intro.4.t:0 "The Great Siege"
 gg_intro.4.d:0 "Oribe's army has arrived before Montevideo, and from today the Republic has two governments. The city is not taken by storm: it surrenders to hunger or it does not surrender.\n\nFrom here on it is the water that decides. Every month with the river shut and the #blue_value Cerrito#!'s blockade standing, the ring tightens a little more; any month ships come in, it slackens as much. At #V 24#! months of it, the #R Defensa#! will have nothing left to go on with.\n\nThe #blue_value Cerrito#! may shut the river, if Rosas is willing and Brown's squadron is on the water. The #R Defensa#! has the city's foreigners, who outnumber its own soldiers and who can take up arms."
 gg_intro.4.f:0 "16 February 1843."
 gg_intro.4.a:0 "Let the ring close."
