l_english:
 gg_constitution.1.t:0 "The Constitution"
 gg_constitution.1.d:0 "The Federal Pact is no longer a promise put off: the provinces have agreed how to go on together, and the question Buenos Aires dodged for twenty years is on the table. What law will govern the Confederation?\n\nAlberdi's #b Bases#!, written in Valparaíso, pass from hand to hand: a republic with a strong president, freedom of worship, doors open to immigration, no slave on its soil. Against them stands what exists: the mandate for foreign relations, the sum of public power and the religion of the State.\n\nEither is written with the same ink."
 gg_constitution.1.d_urquiza:0 "General Urquiza entered Buenos Aires with the word #b Constitution#! on his banner, and now he must write it. The Congress meets in Santa Fe with Alberdi's #b Bases#! on every bench: a republic with a strong president, freedom of worship, doors open to immigration, no slave on its soil.\n\nThere is no going back: the sum of public power left with the Restorer."
 gg_constitution.1.d_rosas:0 "The Restorer has won, and those who asked him for a Congress must now await his answer. He may give them the Constitution Alberdi wrote in Valparaíso, with a republic, freedom of worship and doors open to immigration; or he may go on governing as he always has, with the mandate for foreign relations and the sum of public power.\n\nIn Buenos Aires nobody believes he will choose the first. That is precisely what makes the second cheap."
 gg_constitution.1.f:0 "'To govern is to populate.' — Juan Bautista Alberdi, Bases, 1852"
 gg_constitution.1.a:0 "The Constitution of 1853: a republic, free worship, open doors."
 gg_constitution.1.b:0 "The Pact without a Constitution: the sum of public power goes on."
 gg_pais_sin_constitucion:0 "A Country Without a Constitution"
 gg_pais_sin_constitucion_desc:0 "The Restorer governs with the sum of public power, and nobody disputes his authority while he lives. But the question the Pact left unanswered is still there: federales and unitarios wait, each with a constitution in his pocket, for the day he is gone."
 gg_constitution.1.b_tt:0 "@warning! Rosas governs with all power, and the question between #b federales and unitarios#! stays open: #b A Country Without a Constitution#! while he lives."
 gg_constitution.2.t:0 "The Restorer Dies"
 gg_constitution.2.d:0 "Juan Manuel de Rosas is dead, and the sum of public power ends with him: it was never a law, it was a man. Nobody in the Confederation has his authority, and nobody inherits it.\n\nThe question the Federal Pact left unanswered comes back to the surface on the day of the funeral. The federales want a constitution that respects the provinces; the unitarios, one that orders them from a capital. Every governor begins to count who stands with him.\n\nThe country Rosas held together by force must now decide whether it wants to stay together, and under what law."
 gg_constitution.2.f:0 "The sum of public power is not inherited."
 gg_constitution.2.a:0 "Let each province say what country it wants."
 gg_constitution.2.a_tt:0 "@warning! #b A Country Without a Constitution#! ends. #b Corrientes#! and the northern provinces (#b Tucumán, Salta, Jujuy, Catamarca#!) rise as the #b Coalición del Norte#!, unitario; the rest follow Buenos Aires with the federales. Whoever wins the war writes the #b Constitution#!, and the country becomes one."
 gg_constitution.1.a_tt:0 "@warning! A #b federation#!, not a confederation: the provinces of the Pact are incorporated into one country and keep their governments. The autocracy ends: #b presidential republic#!, #b universal male suffrage#!, #b freedom of worship#!, no slavery, no barriers to immigration and the #b right of assembly#!."
 gg_constitution.4.t:0 "The Victors' Constitution"
 gg_constitution.4.d_federal:0 "The federales have won the war that followed the Restorer's death, and they write the Constitution the provinces had been asking for since 1831: a federal republic, with a strong president, freedom of worship, doors open to immigration and the vote for every man.\n\nIt is no longer a confederation of provinces that delegate: it is one nation, and each province keeps its government within it. The sum of public power does not return: now there is a law that forbids it."
 gg_constitution.4.d_unitaria:0 "The unitarios have won the war that followed the Restorer's death, and they write the Constitution the League carried in its pocket: a republic governed from a capital, with the religion of the State and the vote for those who have the means.\n\nThe country is reunited under that law. The sum of public power does not return, but the provinces do not recover what the Pact left them either."
 gg_constitution.4.f:0 "War decided who writes; the law, how to govern."
 gg_constitution.4.a:0 "Let it be sworn in every province."
