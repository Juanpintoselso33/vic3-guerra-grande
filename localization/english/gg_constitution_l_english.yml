l_english:
 gg_constitution.1.t:0 "The Constitution"
 gg_constitution.1.d:0 "The Federal Pact is no longer a promise put off: the provinces have agreed how to go on together, and the question Buenos Aires dodged for twenty years is on the table. What law will govern the Confederation?\n\nThe Pact promised it in 1831: a #b General Federative Congress#! to settle the administration of the country. On one side, a written constitution: a republic with a strong president, freedom of worship, doors open to immigration, no slave on its soil. Against it stands what exists: the mandate for foreign relations, the sum of public power and the religion of the State.\n\nEither is written with the same ink."
 gg_constitution.1.d_urquiza:0 "Since 1851 General Urquiza has headed his papers with a new motto, 'Death to the enemies of National Organisation!', and now he must make good on it. The Congress meets in Santa Fe, and Alberdi's #b Bases#!, which Urquiza himself read and praised, pass among the deputies: a republic with a strong president, freedom of worship, doors open to immigration, no slave on its soil.\n\nThere is no going back: the sum of public power left with the Restorer."
 gg_constitution.1.d_rosas:0 "The Restorer has won, and those who asked him for a Congress wait for his answer. Since 7 March 1835 he has governed with the sum of public power the House of Representatives gave him, and the Confederation goes on as the Pact left it: each province with its own government, and the mandate for foreign relations in Buenos Aires.\n\nThe Pact of 1831 promised a #b General Federative Congress#! to settle the administration of the country under the federal system. The exiles' papers still ask for it, passed from hand to hand, quietly.\n\nNobody in the Confederation can dispute anything with him now. If there is a Constitution, it will be because he gives it."
 gg_constitution.1.f:0 "'…that by means of a General Federative Congress the general administration of the country be settled under the federal system.' — Federal Pact, 4 January 1831, art. 16"
 gg_constitution.1.a:0 "The Constitution of 1853: a republic, free worship, open doors."
 gg_constitution.1.b:0 "The Pact without a Constitution: the sum of public power goes on."
 gg_pais_sin_constitucion:0 "A Country Without a Constitution"
 gg_pais_sin_constitucion_desc:0 "The Restorer governs with the sum of public power, and nobody disputes his authority while he lives. But the question the Pact left unanswered is still there: federales and unitarios wait, each with a constitution in his pocket, for the day he is gone."
 gg_constitution.1.b_tt:0 "@warning! Rosas governs with all power, and the question between #b federales and unitarios#! stays open: #b A Country Without a Constitution#! while he lives."
 gg_constitution.2.t:0 "The Restorer Dies"
 gg_constitution.2.d:0 "Juan Manuel de Rosas is dead, and the sum of public power ends with him: it was never a law, it was a man. Nobody in the Confederation has his authority, and nobody inherits it.\n\nThe question the Federal Pact left unanswered comes back to the surface on the day of the funeral. The federales want a constitution that respects the provinces; the unitarios, one that orders them from a capital. Every governor begins to count who stands with him.\n\nThe country Rosas held together by force must now decide whether it wants to stay together, and under what law."
 gg_constitution.2.f:0 "The sum of public power is not inherited."
 gg_constitution.2.a:0 "Let each province say what country it wants."
 gg_constitution.2.a_tt:0 "@warning! #b A Country Without a Constitution#! ends. #b Corrientes#! and the northern provinces (#b Tucumán, Salta, Jujuy, Catamarca#!) rise as the #b Coalición del Norte#!, unitario; the rest follow Buenos Aires with the federales. Whoever wins the war writes the #b Constitution#!, and the country becomes one."
 gg_constitution.1.a_tt:0 "@warning! A #b federation#!, not a confederation: the provinces of the Pact are incorporated into one country and keep their governments. The autocracy ends: #b presidential republic#!, #b universal male suffrage#!, #b freedom of worship#!, no slavery, no barriers to immigration and the #b right of assembly#!."
 gg_constitution.4.t:0 "The Victors' Constitution"
 gg_constitution.4.d_federal:0 "The federales have won the war that followed the Restorer's death, and they write the Constitution the provinces had been asking for since 1831: a federal republic, with a strong president, freedom of worship, doors open to immigration and the vote for every man.\n\nIt is no longer a confederation of provinces that delegate: it is one nation, and each province keeps its government within it. The sum of public power does not return: now there is a law that forbids it."
 gg_constitution.4.d_unitaria:0 "The unitarios have won the war that followed the Restorer's death, and they write the Constitution the League carried in its pocket: a republic governed from a capital, with the religion of the State and the vote for those who have the means.\n\nThe country is reunited under that law. The sum of public power does not return, but the provinces do not recover what the Pact left them either."
 gg_constitution.4.f:0 "War decided who writes; the law, how to govern."
 gg_constitution.4.a:0 "Let it be sworn in every province."
 gg_constitution.4.d_peace:0 "The war that followed the Restorer's death ended with no victor: the Coalición del Norte laid down its arms without imposing its law. The federales remain in government, and they write the Constitution the provinces had been asking for since 1831: a federal republic, with a strong president, freedom of worship, doors open to immigration and the vote for every man.\n\nIt is one nation, and each province keeps its government within it. The sum of public power does not return: now there is a law that forbids it."
 gg_constitution.5.t:0 "One Nation"
 gg_constitution.5.d:0 "The province you govern enters the Nation that has just been constituted: its land, its people and its troops become Argentine, and its governor answers from now on to a common law.\n\nThere is no government of its own left to lead in the province. There is one for all of them, and that is the one to take.\n\nWhat was defended in the province goes on being defended from the Nation."
 gg_constitution.5.f:0 "One province less to govern; a whole Nation ahead."
 gg_constitution.5.a:0 "Carry on from the national government."
 gg_play_as_argentina_tt:0 "@information! You take up the government of #b Argentina#!, and your country is incorporated into it."
 gg_constitution.1.d_stalemate:0 "The Federal Pact has broken in two. The provinces of the Littoral and the interior follow Urquiza and are governed from Paraná; Buenos Aires keeps the city, the countryside, the port and the customs house.\n\nThe #b General Federative Congress#! the Pact promised in 1831 will meet, if it meets at all, without deputies from Buenos Aires. Here the question is another: by what law is a province governed that no longer speaks for the others.\n\nThe mandate for foreign relations reaches no one else now. The sum of public power, on the other hand, stays in the same hands."
 gg_constitution.1.c:0 "Convene the Congress the Pact promised: a federal Constitution."
 gg_constitution.1.c_tt:0 "@warning! The Restorer convenes the #b General Federative Congress#!. A #b federation#!, not a confederation: the provinces of the Pact are incorporated into one country and keep their governments. The sum of public power ends: #b presidential republic#!, #b universal male suffrage#!, #b freedom of worship#!, no slavery, no barriers to immigration and the #b right of assembly#!."
 gg_constitution.1.e:0 "A Constitution for the State of Buenos Aires."
 gg_constitution.1.e_tt:0 "@warning! Buenos Aires gives itself its own law, without waiting for the Congress of Paraná: a #b State#! that keeps its sovereignty while it does not delegate it to a federal government. The sum of public power ends: #b presidential republic#!, #b census suffrage#!, #b state religion#!, no slavery and the #b right of assembly#!. The provinces stay with the Confederation."
 gg_constitution.1.g:0 "The Pact of 1831 and nothing more: each province in its liberty, independence and rights."
 gg_constitution.1.g_tt:0 "@information! A #b confederation#!, not a federation: every province of the Pact is its own country again, with its governor, its legislature and its revenues, a #b Province of the Pact#! that leaves the mandate for foreign relations in Buenos Aires. Buenos Aires keeps its own province and the frontier lands no province governs. No law of Buenos Aires changes: a treaty between governments writes none. A province at war with Buenos Aires, bound to another power, or that has chosen to stand alone stays as it is."
 gg_constitution.1.g_rosas_tt:0 "@warning! The Restorer keeps the sum of public power, and the question between #b federales and unitarios#! stays open: #b A Country Without a Constitution#! while he lives."
 gg_constitution.1.a_tt_one:0 "@warning! A #b federation#!, not a confederation: the provinces already form one country, and this law keeps their governments. The autocracy ends: #b presidential republic#!, #b universal male suffrage#!, #b freedom of worship#!, no slavery, no barriers to immigration and the #b right of assembly#!."
 gg_constitution.1.c_tt_one:0 "@warning! The Restorer convenes the #b General Federative Congress#!. A #b federation#!, not a confederation: the provinces already form one country, and this law keeps their governments. The sum of public power ends: #b presidential republic#!, #b universal male suffrage#!, #b freedom of worship#!, no slavery, no barriers to immigration and the #b right of assembly#!."
 gg_constitution.1.c_vote_tt:0 "@information! From now on the government is won at the polls."
 gg_constitution_rosas_first_term_tt:0 "@information! #b Rosas#! serves the first term the Constitution sets: #V six years#!, leaving power on the very day it expires. After it, the government is won at the polls."
