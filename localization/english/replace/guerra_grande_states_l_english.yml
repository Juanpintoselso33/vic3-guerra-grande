# EN: Every state and hub name checked against two things: the real coordinates of each town,
#     read off the province map, and its documented year of foundation. Nothing here is named
#     after a river or a hill, and nothing is named after a town that does not exist yet in
#     1836 unless no settlement existed in that province at all -- Cerro Largo had exactly two.
#     Sources in SOURCES.md.

