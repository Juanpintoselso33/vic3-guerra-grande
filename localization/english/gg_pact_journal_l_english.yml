l_english:
 gg_pact_j_band:0 "#V [JournalEntry.MakeScope.ScriptValue('gg_ui_pact_delegating_shown')|0]#! of #V [JournalEntry.MakeScope.ScriptValue('gg_ui_pact_total')|0]#! Provinces Delegate to Buenos Aires"
 gg_pact_j_band_tt:0 "Under the Federal Pact the provinces entrusted the governor of Buenos Aires with the Confederation's foreign relations, and a legislature may take that mandate back. Buenos Aires is not counted: it cannot delegate to itself."
 gg_pact_j_more:0 "The Mandate in Detail"
 gg_pact_j_list_header:0 "The Provinces"
 gg_pact_j_st_0:0 "#P Delegating#!"
 gg_pact_j_st_1:0 "#Y Petition pending#!"
 gg_pact_j_st_2:0 "#N Mandate withdrawn#!"
 gg_pact_j_grv_corrientes:0 "Grievances of Corrientes: #N [GetGlobalVariable('gg_corrientes_agravio').GetValue|0]#!"
 gg_pact_j_grv_norte:0 "Grievances of the North: #N [GetGlobalVariable('gg_norte_agravio').GetValue|0]#!"
 gg_pact_j_grv_entre_rios:0 "Grievances of Entre Ríos: #N [GetGlobalVariable('gg_entre_rios_agravio').GetValue|0]#!"
 gg_pact_j_more_body:0 "$gg_pact_j_more_who$\n\n#b How it ends#!: with a negotiated Confederation, with the end of the war between Buenos Aires and Entre Ríos, or once, after 1851, no more than #N 6#! provinces still delegate, the Oriental Province included if it is in the Pact."
 gg_pact_j_gov:0 "#b [Character.GetFullName]#!"
 gg_pact_j_interim:0 "#b Interim government#!"
 gg_pact_j_interim_tt:0 "No governor holds office in his own right: the province is between two governors, or its governor is dead."
 gg_pact_j_st_0_tt:0 "Its legislature leaves the conduct of foreign relations with Buenos Aires."
 gg_pact_j_st_1_tt:0 "A petition from its legislature awaits an answer from Buenos Aires."
 gg_pact_j_st_2_tt:0 "Its legislature has withdrawn the mandate: the province no longer entrusts its foreign relations to Buenos Aires."
 gg_pact_j_league:0 "Leagued in the Coalition of the North under #b [Character.GetFullName]#!"
 gg_pact_j_name_corrientes_tt:0 "Corrientes’s petitions reach Buenos Aires first. Each one leaves a grievance when it arrives and another if it is refused; granting it redresses it. A legislature that still nurses grievances when the hour of rupture comes withdraws the mandate. Corrientes comes back when it is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires holds its land."
 gg_pact_j_name_entre_rios_tt:0 "The last province able to withdraw the mandate, and the strongest. Its petitions leave grievances as the others’ do; even without them, Entre Ríos asks besides for the Treaty of Alcaraz, the road to a constitution and Corrientes’s exemption. It comes back when it is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires holds its land."
 gg_pact_j_name_corrientes:0 "#b Corrientes#!"
 gg_pact_j_name_tucuman:0 "#b Tucumán#!"
 gg_pact_j_name_salta:0 "#b Salta#!"
 gg_pact_j_name_jujuy:0 "#b Jujuy#!"
 gg_pact_j_name_catamarca:0 "#b Catamarca#!"
 gg_pact_j_name_la_rioja:0 "#b La Rioja#!"
 gg_pact_j_name_cordoba:0 "#b Córdoba#!"
 gg_pact_j_name_entre_rios:0 "#b Entre Ríos#!"
 gg_pact_j_name_santa_fe:0 "#b Santa Fe#!"
 gg_pact_j_name_santiago_del_estero:0 "#b Santiago del Estero#!"
 gg_pact_j_name_mendoza:0 "#b Mendoza#!"
 gg_pact_j_name_san_juan:0 "#b San Juan#!"
 gg_pact_j_name_san_luis:0 "#b San Luis#!"
 gg_pact_j_name_oriental:0 "#b Oriental Province#!"
 gg_pact_j_name_oriental_tt:0 "The Banda Oriental, back in the Confederation as a province, with its own government and the flag of the Treinta y Tres."
 gg_pact_j_more_who:0 "#b Those with a voice in the mandate#!\n· #b Buenos Aires#!: it speaks for all of them; its governor is Rosas for as long as he holds power.\n· #b The provinces#!, in the list above, each with its governor. Corrientes, the North and Entre Ríos can take the mandate back; Santa Fe, Santiago and Cuyo have not asked for anything, and the Oriental Province, while it is part of the Pact, delegates without reserve.\n· #b A province Buenos Aires defeats#! stands as a country apart, its foreign relations held by Buenos Aires and its chair filled by a governor of Buenos Aires’s choosing."
 gg_pact_j_more_body_fixed:0 "$gg_pact_j_more_who$\n\n#b How it ends#!: with a negotiated Confederation or with the end of the war between Buenos Aires and Entre Ríos."
 gg_pact_j_norte_tt:0 "Tucumán, Salta, Jujuy, Catamarca and La Rioja share their grievances and act together, in the Coalition of Avellaneda and Brizuela — and of Lamadrid, if Buenos Aires sent him north; Córdoba may join them. A petition leaves a grievance when it arrives and another if it is refused; granting it redresses it. Beaten, the Coalition breaks up into its provinces, each under a governor of Buenos Aires’s choosing, and they return to the mandate together."
 gg_pact_j_name_oriental_reinc_tt:0 "The Banda Oriental, fully reincorporated into the Confederation: Buenos Aires rules it as its own land, with Oribe at its head."
