 gg_pact_j_st_2:0 "#N Mandate withdrawn#!"
 gg_pact_j_grv_corrientes:0 "Grievances: #N [GetGlobalVariable('gg_corrientes_agravio').GetValue|0]#!"
 gg_pact_j_grv_norte:0 "Grievances: #N [GetGlobalVariable('gg_norte_agravio').GetValue|0]#!"
 gg_pact_j_grv_entre_rios:0 "Grievances: #N [GetGlobalVariable('gg_entre_rios_agravio').GetValue|0]#!"
 gg_pact_j_grv_none:0 "#P No grievances#!"
 gg_pact_j_row_corrientes_tt:0 "Corrientes's petitions reach Buenos Aires first. Each one leaves a grievance when it arrives and another if it is refused; granting it redresses it. A legislature that still nurses grievances when the hour of rupture comes withdraws the mandate. Corrientes comes back when it is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires holds its land."
 gg_pact_j_row_norte_tt:0 "Tucumán, Salta, Jujuy, Catamarca and La Rioja share their grievances and act together, in the Coalition of Avellaneda and Brizuela — and of Lamadrid, if Buenos Aires sent him north; Córdoba may join them. A petition leaves a grievance when it arrives and another if it is refused; granting it redresses it. They come back together, when the Coalition is made subject to Buenos Aires or ceases to exist and Buenos Aires holds the provinces that had risen."
 gg_pact_j_row_entre_rios_tt:0 "The last province able to withdraw the mandate, and the strongest. Its petitions leave grievances as the others' do; even without them, Entre Ríos asks besides for the Treaty of Alcaraz, the road to a constitution and Corrientes's exemption. It comes back when it is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires holds its land."
 gg_pact_j_more_body:0 "#b Those with a voice in the mandate#!\n· #b Buenos Aires#!: it speaks for the thirteen; its governor is Rosas for as long as he holds power.\n· #b Corrientes, the North and Entre Ríos#!: the three that can take the mandate back, in the list above.\n· #b Santa Fe, Santiago del Estero, Mendoza, San Juan and San Luis#!: they go on delegating, under federal governors such as Ibarra, Benavídez and Aldao.\n\n#b How it ends#!: with a negotiated Confederation, with the end of the war between Buenos Aires and Entre Ríos, or once, after 1851, no more than #N 6#! provinces still delegate."
