l_english:
 gg_pact_j_band:0 "#V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! of #V 13#! Provinces Delegate to Buenos Aires"
 gg_pact_j_band_tt:0 "Under the Federal Pact the provinces entrusted the governor of Buenos Aires with the Confederation's foreign relations, and a legislature may take that mandate back. Buenos Aires is not counted: it cannot delegate to itself."
 gg_pact_j_legend:0 "#P Delegating#! · #Y Petition pending#! · #N Mandate withdrawn#! · #blue_value Buenos Aires#!"
 gg_pact_j_more:0 "The Mandate in Detail"
 gg_pact_j_list_header:0 "The Provinces That Can Withdraw the Mandate"
 gg_pact_j_row_corrientes:0 "#b Corrientes#!"
 gg_pact_j_row_norte:0 "#b The North#!"
 gg_pact_j_row_entre_rios:0 "#b Entre Ríos#!"
 gg_pact_j_gov_corrientes:0 "Governed by #b [Character.GetFullName]#!"
 gg_pact_j_gov_norte:0 "Voice of the North: #b [Character.GetFullName]#!"
 gg_pact_j_gov_entre_rios:0 "Governed by #b [Character.GetFullName]#!"
 gg_pact_j_st_0:0 "#P Delegating#!"
