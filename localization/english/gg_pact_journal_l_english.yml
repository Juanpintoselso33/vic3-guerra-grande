l_english:
 gg_pact_j_band:0 "#V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! of #V 13#! Provinces Delegate to Buenos Aires"
 gg_pact_j_band_tt:0 "Under the Federal Pact the provinces entrusted the governor of Buenos Aires with the Confederation's foreign relations, and a legislature may take that mandate back. Buenos Aires is not counted: it cannot delegate to itself."
 gg_pact_j_short:0 "Buenos Aires does not govern the provinces: it speaks for them. Eight legislatures may withdraw its mandate, and a petition left unanswered is the first step towards doing so."
 gg_pact_j_sec_map:0 "The Thirteen Provinces"
 gg_pact_j_legend:0 "#P Delegating#! · #Y Petition pending#! · #N Mandate withdrawn#! · #blue_value Buenos Aires#!"
 gg_pact_j_sec_front:0 "Against Buenos Aires"
 gg_pact_j_versus:0 "vs"
 gg_pact_j_holder:0 "#b Buenos Aires#!\n[Character.GetFullName]"
 gg_pact_j_holder_tt:0 "The governor of Buenos Aires, entrusted with the Confederation's foreign relations. A province in arms comes back under the mandate when it is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires regains its land."
 gg_pact_j_risen:0 "[Character.GetFullName]"
 gg_pact_j_risen_tt:0 "A province that has withdrawn the mandate and risen against Buenos Aires. It comes back when it is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires regains its land."
 gg_pact_j_sec_grievances:0 "Petitions Unanswered"
 gg_pact_j_grv_corrientes:0 "#b Corrientes#!: #N [GetGlobalVariable('gg_corrientes_agravio').GetValue|0]#! grievances unredressed"
 gg_pact_j_grv_norte:0 "#b The North#! (Tucumán, Salta, Jujuy, Catamarca, La Rioja): #N [GetGlobalVariable('gg_norte_agravio').GetValue|0]#! grievances unredressed"
 gg_pact_j_grv_entre_rios:0 "#b Entre Ríos#!: #N [GetGlobalVariable('gg_entre_rios_agravio').GetValue|0]#! grievances unredressed"
 gg_pact_j_grv_tt:0 "Petitions and quarrels with Buenos Aires leave grievances behind; meeting the province's demands redresses them. A province that still nurses grievances when the hour of rupture comes withdraws the mandate. Without grievances, Corrientes and the North stay; Entre Ríos asks besides for the Treaty of Alcaraz, the road to a constitution and Corrientes's exemption."
 gg_pact_j_sec_accounts:0 "Subsidies from Buenos Aires"
 gg_pact_j_obligation_tt:0 "Oribe's government has accepted the remittance: it is now obliged to Buenos Aires, and Rosas's backing for it has risen by #P 10#!."
 gg_pact_j_more:0 "The Mandate in Detail"
 gg_pact_j_more_body:0 "#b Those with a voice in the mandate#!\n· #b Buenos Aires#!: it speaks for the thirteen; its governor is Rosas for as long as he holds power.\n· #b Corrientes#!: its petitions come first. Berón de Astrada governs it, and later Paz and the Madariagas raise it again.\n· #b The North#!: Tucumán, Salta, Jujuy, Catamarca and La Rioja may declare together in the Coalition of Avellaneda and Brizuela — and Lamadrid, if Buenos Aires sent him north — and Córdoba may join them.\n· #b Entre Ríos and Urquiza#!: the last province able to withdraw the mandate, and the strongest.\n· #b Santa Fe, Santiago del Estero, Mendoza, San Juan and San Luis#!: they go on delegating, under federal governors such as Ibarra, Benavídez and Aldao.\n· #b Oribe's government#!: it receives Buenos Aires money if it is offered and accepts.\n\n#b How a province comes back#!: when the rebel province is made subject to Buenos Aires, or when it ceases to exist and Buenos Aires regains its land. The northern provinces return, and leave, together.\n\n#b The subsidy#!: Buenos Aires may offer Oribe's government an extraordinary remittance of #V £20,000#!, or #V £10,000#! if fewer than #V 10#! provinces delegate. If it is accepted, that government is obliged to Buenos Aires; should the backing later be withdrawn, the monthly subsidy stops as well.\n\n#b How it ends#!: with a negotiated Confederation, with the end of the war between Buenos Aires and Entre Ríos, or once, after 1851, no more than #N 6#! provinces still delegate."