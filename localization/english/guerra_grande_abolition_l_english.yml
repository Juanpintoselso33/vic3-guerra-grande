l_english:

# EN: The two abolitions of the Guerra Grande -- the Defensa's law of 12 December 1842 and the
#     Cerrito's decree of 26 October 1846. Every date, figure and quotation below is sourced in
#     SOURCES_abolition.md and in the comments of events/guerra_grande_abolition.txt.

 gg_abolition.2.t:0 "The Law of 12 December"
 gg_abolition.2.d:0 "Six days ago Rivera lost the army at Arroyo Grande, and Oribe is marching on the city. The Chamber sits and writes three articles. The first: «Desde la promulgación de la presente resolución, no hay esclavos en todo el territorio de la República.» The second says what the first is for -- the government will send the able-bodied men who were slaves, colonos or pupilos «al servicio de las armas por el tiempo que crea necesario». The third leaves the women and the unfit with their old masters, as wards. It is Ley N.º 242, and it is a recruitment bill written as an emancipation. Some 1,800 libertos will march into the line battalions, and the commanders of the garrison will call them the only real soldiers on the walls."
 gg_abolition.2.f:0 "Freedom in article one. The ranks in article two."
 gg_abolition.2.a:0 "Promulgate it -- article two and all."
 gg_abolition.2.b:0 "Draw them by lot, and pay their owners three hundred pesos a head."
 gg_abolition.2.c:0 "The Republic will not take a man's property to fill a battalion."
 gg_abolition.3.t:0 "The Decree of the Cerrito"
 gg_abolition.3.d:0 "Four years into the siege, from the camp at the Cerrito, the blanco government decrees abolition: total, unrestricted, and its application watched by Oribe in person. The text is cleaner than Montevideo's -- it says nothing whatever about the army. The regulation does. Within days the authorities are drawing up lists of the men now free and fit to serve, and enrolling them before their owners can walk them back across the frontier. Most of those owners are Brazilian subjects with estancias astride the border; in districts like Tacuarembó the enslaved are a third of the population. They are promised compensation «en tiempo oportuno»."
 gg_abolition.3.f:0 "The decree is silent about the army. The lists are not."
 gg_abolition.3.a:0 "Decree it, and carry the lists to the camp."
 gg_abolition.3.b:0 "Levy them one by one, and pay for each man taken."
 gg_abolition.3.c:0 "The estancias are the government. Leave their people alone."
 gg_abolition.4.t:0 "Their Property, Our Soil"
 gg_abolition.4.d_defensa:0 "The Empire's chargé d'affaires is at the door with a list. Most of the people freed by the law belonged to Brazilian subjects, and Rio de Janeiro wants them returned -- if not by law then by sea. It has been done before: in December 1842, days after the law was passed, more than two hundred slaves were carried out of Montevideo aboard the corvette Siete de Abril and landed in Santa Catarina, to save the property of the Empire's subjects from a decree the Republic had just signed."
 gg_abolition.4.d_cerrito:0 "The claims have been arriving since the decree, and by this year they are a flood. The owners of the frontier want their people back, and the government's answer has been to keep them: men who are serving in the blanco army are not handed over, whoever signed for them. The Empire is told that «el negro pasó de cosa a hombre porque podía cambiársele esa condición; y sin gran injusticia no puede volver al estado de esclavitud». Every refusal is another paragraph in the case Rio de Janeiro is quietly building against this government."
 gg_abolition.4.d_generic:0 "The owners across the frontier want their people back, and the Empire has undertaken to ask on their behalf. The men in question are in uniform, in our own line. Whatever is decided here will be read in Rio de Janeiro as the measure of what our decree is actually worth."
 gg_abolition.4.f:0 "A decree is only worth what you will refuse for it."
 gg_abolition.4.a:0 "They landed on free soil. They stay free."
 gg_abolition.4.b:0 "Give them back. We cannot fight the Empire as well."
