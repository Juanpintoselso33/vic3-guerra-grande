l_english:

 gg_peace.1.desc_withdraws:0 "The war has been decided without another battle. Oribe secured the squadrons' guarantee for his departure with the Argentine division and is gone: Urquiza does not obtain the arsenal, and only the Uruguayans remain at the Cerrito, leaderless and unwilling to continue.\n\nThis government writes the terms. What it cannot do is refuse them: there is nobody left to fight."
 gg_peace.1.desc_imperial:0 "The war is decided, and it was decided with the Empire's money and ships. Lamas signed the bargain in Río: Brazil helps, and in exchange Brazil has the last word on how this ends.\n\nOnly terms acceptable to Río can now be written. Full independence, with free hands, is no longer on the table."
 gg_peace.1.desc_sold:0 "The war has been decided and, for the first time in nine years, this government writes the terms.\n\nIt also has a cry to answer: in 1845 the Cerrito said yes to Rosas. To the Montevideo press, Oribe sold the country, and every Uruguayan who questions this peace will see the accusation upon every street corner. There is no proof that Oribe desired annexation, but the charge no longer requires proof."
 gg_peace.1.g:0 "Vassalage: the Republic comes under the Empire of Brazil."
 gg_peace.1.h:0 "Provincia Cisplatina: the Republic becomes a puppet province of Brazil."
 gg_peace_cisplatina_tt:0 "Uruguay becomes a Brazilian puppet under the name #b Provincia Cisplatina#!, and the Empire retains the power to incorporate it. Argentina and the powers take this as an affront."
 gg_peace.2.desc_pledged:0 "The gates are open. Nine years before the wall, and in the end hunger opened it.\n\nBut in 1845 the Cerrito told Rosas yes, and the Confederation has come to collect. The terms that can be written are Argentine ones: vassal, client or, if Rosas is strong enough, one more province. No document shows Oribe wanted it. Now it is the price."
 gg_peace.2.g:0 "Reincorporation: the Republic joins the Confederation as one more province."
 gg_peace_reincorporation_tt:0 "The Republic ceases to exist: Argentina incorporates the country, which retains the provincial autonomy of the #b Provincia Oriental#!. Brazil and the powers take this as an affront."
 gg_powers.32.t:0 "A Mission to Río de Janeiro"
 gg_powers.32.f:0 "A protector bought at a high price is also an owner."
 gg_powers.32.a:0 "Accept the pledge to the Empire."
 gg_powers.32.b:0 "Keep asking for help without tying our hands."
 gg_imperial_pledge_tt:0 "@information! The pledge binds the #R Defensa#! to a peace written on Brazilian terms."
 gg_postwar.2.t:0 "The Victor's Reckoning"
 gg_postwar.2.d:0 "The war ended in punishment. Nobody recognises the beaten government's debts, and its men go back to the countryside with their grudges intact. Fusion of the parties is off the table. All that can be decided now is whether to soften the hand, late."
 gg_postwar.2.f:0 "A peace that punishes is a war that changes shape."
 gg_postwar.2.a:0 "Let them pay."
 gg_postwar.2.b:0 "A late amnesty."
 gg_postwar.3.t:0 "The Debts of Both Governments"
 gg_postwar.3.d:0 "As at the Pantanoso, a peace without victors comes with a bill: what the Defensa and the Cerrito owed. If the State takes on both, the creditors of both sides rest easy. If it only recognises its own, half the country is left holding worthless paper."
 gg_postwar.3.d_mortgaged:0 "As at the Pantanoso, a peace without victors comes with a bill: what the Defensa and the Cerrito owed. And the customs house was pledged again when the French subsidy ended, so the bill is larger. If only our own debt is recognised, half the country is left holding worthless paper."
 gg_postwar.3.f:0 "No victors, and debts on both sides."
 gg_postwar.3.a:0 "The State takes on both."
 gg_postwar.3.b:0 "Recognise only our own."
 gg_postwar.4.t:0 "The Elections of the Peace"
 gg_postwar.4.d:0 "Everyone expected Eugenio Garzón, but Garzón is dead. The Chambers must choose a president, and in a peace with no vanquished, anyone may win. The name going round is Juan Francisco Giró, a blanco both sides can accept."
 gg_postwar.4.d_powers:0 "The powers' peace ends at the ballot box, and London and Paris are watching. Everyone expected Eugenio Garzón, but Garzón is dead. The Chambers choose a president with European observers in the gallery. The name going round is Juan Francisco Giró, a blanco both sides can accept."
 gg_postwar.4.f:0 "The Chambers, sitting as a General Assembly."
 gg_postwar.4.a:0 "A compromise blanco: Giró."
 gg_postwar.4.b:0 "The Defensa's candidate: Manuel Herrera y Obes."
 gg_postwar.4.c:0 "The countryside's candidate: Lavalleja."
 gg_postwar.5.t:0 "The Caudillos Return"
 gg_postwar.5.d:0 "The punishing peace left the caudillos with troops and with reasons. Rivera, Flores and the chiefs of the countryside demand their share of the government, and they do not ask permission."
 gg_postwar.5.d_contained:0 "The years of the peace without victors have passed, and the caudillos return to claim their share, as in the triumvirate of 1853. They come later and weaker than they would after a punishing peace."
 gg_postwar.5.f:0 "Party compacts are signed on paper; caudillos settle them on horseback."
 gg_postwar.5.a:0 "Let them into the government."
 gg_postwar.5.b:0 "Keep them out."
 gg_postwar.6.t:0 "The Fusion Policy"
 gg_postwar.6.d:0 "Andrés Lamas writes it in 1855: the parties of the war no longer have any reason to exist, and the country must put the divisas behind it. Fusion promises stability. The caudillos, who live off the divisas, will not accept it without a fight."
 gg_postwar.6.f:0 "Neither blancos nor colorados: Uruguayans."
 gg_postwar.6.a:0 "Adopt fusion."
 gg_postwar.6.b:0 "Keep the divisas."
 gg_peace_imperial_vassal:0 "Vassal of the Empire"
 gg_peace_imperial_vassal_desc:0 "The Republic governs under Brazil's guarantee, and Brazil decides what the Republic may do abroad."
 gg_peace_cisplatina:0 "The Provincia Cisplatina"
 gg_peace_cisplatina_desc:0 "Twenty-three years after the Convention of 1828, Uruguay bears the name of the occupation again. Nobody in the Defensa asked for it."
 gg_provincia_oriental:0 "Provincia Oriental"
 gg_provincia_oriental_desc:0 "The Banda Oriental enters the Confederation as one more province, with its own government and its caudillos."
 gg_peace_oribe_withdrew:0 "Oribe Left with the Argentines"
 gg_peace_oribe_withdrew_desc:0 "The Cerrito's chief sailed with the Argentine division under the squadrons' guarantee. The blancos who stayed have nobody to follow."
 gg_peace_oribe_sold_country:0 "‘Oribe Sold the Country’"
 gg_peace_oribe_sold_country_desc:0 "The Montevideo press repeats that the Cerrito agreed in 1845 to rejoin the Confederation. There is no proof Oribe wanted it, but the charge works."
 gg_postwar_unrecognised_debts:0 "The Debts of the Beaten Side Disowned"
 gg_postwar_unrecognised_debts_desc:0 "The beaten government's creditors go unpaid, and the Republic's credit pays the price."
 gg_postwar_unrest:0 "A Resentful Countryside"
 gg_postwar_unrest_desc:0 "The men of the beaten side went home with their weapons hidden."
 gg_postwar_late_amnesty:0 "A Late Amnesty"
 gg_postwar_late_amnesty_desc:0 "The government forgave late. The countryside calms down, and the army takes it as weakness."
 gg_postwar_shared_debts:0 "Both Governments’ Debts"
 gg_postwar_shared_debts_desc:0 "The State took on what the Defensa and the Cerrito owed, as at the Pantanoso."
 gg_postwar_debts_disowned:0 "Debts Disowned"
 gg_postwar_debts_disowned_desc:0 "The State recognises only what its own government owed."
 gg_postwar_observed_election:0 "An Election Under European Eyes"
 gg_postwar_observed_election_desc:0 "The powers' peace ended in a vote London and Paris accepted."
 gg_postwar_caudillos:0 "The Caudillos in Government"
 gg_postwar_caudillos_desc:0 "The war chiefs rule again, with their troops behind them."
 gg_postwar_fusion:0 "The Fusion Policy"
 gg_postwar_fusion_desc:0 "The divisas lose weight and the country gains stability, as long as the caudillos put up with it."
 gg_powers.10.a_tt:0 "@information! Britain takes offence and backs the Defensa more. Purvis keeps letting the neutrals in until London disavows him."
 gg_powers.12.a_tt:0 "@information! The proposal goes to Montevideo: if the Defensa accepts too, the powers' peace is signed and the election decides who governs."
 gg_powers.13.a_tt:0 "@information! One side leads the balance, the river included, by #V 5#! points or more: the bases suffice to end the war. The powers' peace is signed: one government, chosen at the polls. If the #blue_value blancos#! are ahead on the score, the Cerrito governs."
 gg_powers.13.a_truce_tt:0 "@information! Neither side leads the balance, the river included, by the #V 5#! points the bases would need to end the war: the powers obtain only the cessation of hostilities. #b Six months of truce#!: the siege, the river and all pressure for peace stand still, and then the war goes on."
 gg_powers.14.a_tt:0 "@information! The offer goes to Montevideo: if the Defensa accepts, six months of truce (the siege and the negotiations freeze)."
 gg_powers.15.a_tt:0 "@information! Six months of truce: the siege and all pressure for peace stand still while it lasts."
 gg_powers.16.a_tt:0 "@information! Oribe takes the presidency under a European guarantee: the Cerrito absorbs the Defensa in peace, and Rosas becomes an enemy."
 gg_powers.23.b_tt:0 "@information! The Cerrito asks for terms: from 1849, the Defensa may dictate the peace."
 gg_powers.23.c_tt:0 "@information! Oribe sails with the Argentine division and leaves the country: from 1849, the Defensa may dictate the peace."
 gg_powers.28.a_tt:0 "@information! The rites cost money, and the mourning closes ranks: the clergy take note of who honoured the vicar."
 gg_powers.36.a_tt:0 "@information! The chiefs are satisfied, but a government seeking terms from the besieger frees the French commissioner from his duty to sustain the city. The arrangement only succeeds if someone has already come to the table — the #b Hood bases#!, Rivera's #b eight conditions#! or a #blue_value Cerrito#! that has asked for terms — and one side holds the lead the balance demands, the river included: that side dictates the peace. Before #V 1849#! nobody counts the balance as settled."
 gg_powers.36.b_tt:0 "@information! The chiefs leave discontented, and the garrison feels it. The government holds the French commissioner to his instructions: if there is no blockade, France must sustain the city."
 gg_peace_reject_tt:0 "@information! The war goes on, and for two years nobody offers peace again."
 gg_peace.6.blancos_tt:0 "@information! The #blue_value blancos#! win the election: the Cerrito absorbs the Defensa and governs the Republic."
 gg_peace.6.colorados_tt:0 "@information! The #R colorados#! win the election: the Defensa absorbs the Cerrito and governs the Republic."
 gg_peace.9.t:0 "The Blancos Win the Election"
 gg_peace.9.desc:0 "Both governments accepted the terms of London and Paris, and the election the powers watched was won by the party that held more of the country. The Defensa hands over the city without a shot, the legions give up their arms, and the president whose term the rising of 1838 cut short governs the whole Republic again."
 gg_peace.9.flav:0 "Nine years of siege, and the city opens to a ballot box."
 gg_peace.9.a:0 "Govern the whole Republic."
 gg_peace.9.a_tt:0 "@information! The Cerrito absorbs the Defensa and restores the República Oriental del Uruguay."
 gg_loan.4.a_tt:0 "@information! The pledge binds the #blue_value Cerrito#! to an Argentine peace: vassalage, clienthood or reincorporation. Rosas's backing rises sharply."
 guerra_grande.9.b_tt:0 "@information! The powers send mediators; the closed sea no longer keeps their proposal from the government."
 gg_postwar.4.d_oribe:0 "The four years the Assembly granted Oribe are over, and the Chambers choose a president once more. Everyone expected Eugenio Garzón, but Garzón is dead. The name going round is Juan Francisco Giró, a blanco both sides can accept."
 gg_postwar.4.b_tt:0 "@information! #b Manuel Herrera y Obes#!, the Defensa's foreign minister, takes the presidency. The allies had pressed his name, though the colorados never agreed among themselves."
 gg_postwar.4.c_tt:0 "@information! #b Juan Antonio Lavalleja#!, leader of the Thirty-Three, takes the presidency on the countryside's vote."
 gg_postwar.4.c_tt_none:0 "@information! Lavalleja is dead: the countryside governs, but the presidency does not change hands."
 gg_postwar.4.b_tt_none:0 "@information! Herrera y Obes is dead: the Defensa governs, but the presidency does not change hands."
