l_english:
 gg_argentina.1.t:0 "Corrientes secedes"
 gg_argentina.1.d:0 "Corrientes has disavowed the government of Buenos Aires and declared war on it. Governor #b Genaro Berón de Astrada#! invokes no doctrine: he invokes the #b blockade on its commerce#!. This is the province of the #V 68#! per cent of the yerba and the hides that come down the Paraná, and the port they must pass through is shut by your order.\n\nIt takes Misiones with it. Corrientes has occupied the land south of the Aguapey since #V 1830#!, handed it out in enfiteusis, and claimed the whole territory on #b 1 September 1832#!. In fact and in declared law that land is hers, and she is taking it.\n\nAnd she goes #b alone#!. No other province joins her: not Entre Ríos, not Santa Fe, not the north. Corrientes by herself against the whole Confederation is a sum anyone can do — and she seceded anyway."
 gg_argentina.1.f:0 "One province, one closed river, and no company."
 gg_argentina.1.a:0 "Let the army march."
 gg_argentina.1.b:0 "Go with Corrientes."
 gg_argentina.2.t:0 "Tucumán pronounces"
 gg_argentina.2.d:0 "Tucumán has not rebelled: it has done something more precise and more serious. It has disavowed you #b in your character as governor of Buenos Aires#! and #b withdrawn the delegation of foreign relations#!. What is demanded is not the French alliance: it is that there be a constitution.\n\nWithin the month #b Salta, Jujuy, Catamarca and La Rioja#! follow. Five provinces, and the count may go on. Your power over them was never sovereignty: it was a lent faculty, and five legislatures have just reminded you of it.\n\nOne alone refuses flatly. #b Juan Felipe Ibarra#! of Santiago del Estero does not sign — and his province stands as a wedge of federal ground driven into the middle of the north, cutting the bloc into two halves that do not touch."
 gg_argentina.2.f:0 "Not a rebellion: a faculty reassumed."
 gg_argentina.2.a:0 "The north pronounces."
 gg_argentina.3.t:0 "The Pronunciamiento"
 gg_argentina.3.d:0 "Every year you tender your resignation from the charge of foreign relations, and every year the provinces refuse it. It is a ceremony: one offers what one knows nobody will take.\n\nThis year the legislature of Entre Ríos #b accepted#!. And in May the Convention will put it in writing, in as many words: Entre Ríos, #b "having reassumed"#! the faculty granted to the governor of Buenos Aires, will again treat with other nations in her own name.\n\nThere is no illegality to denounce, and that is the worst of it. The Federal Pact of 1831 is a treaty between sovereign entities, and each kept the right to withdraw what it lent. #b Justo José de Urquiza#! has usurped nothing: he has taken you at your word."
 gg_argentina.3.f:0 "They accepted the resignation."
 gg_argentina.3.a:0 "Then it is war."
 gg_argentina.3.b:0 "Move to Entre Ríos."
 gg_argentina.4.t:0 "Córdoba joins"
 gg_argentina.4.d:0 "Six months after Tucumán pronounced, #b Córdoba#! joins the Coalition. That is #b six provinces at once#!, and it is no longer a matter of the north: the line now reaches the heart of the road that joins Buenos Aires to the interior.\n\nThe Coalition has stopped being an understanding between governors. It has a congress of agents sitting in Tucumán, a director with the power to make war, sign peace and negotiate loans, and now the most populous inland province.\n\nWhat it does not have is continuous ground. Santiago del Estero still has not signed, and between the six provinces and the Litoral there is a wedge that obeys Buenos Aires."
 gg_argentina.4.f:0 "Six provinces, and a hole in the middle."
 gg_argentina.4.a:0 "Six, then."
 gg_argentina.10.t:0 "Pago Largo"
 gg_argentina.10.d:0 "Twenty-five days after disavowing Buenos Aires, the army of Corrientes came apart at Pago Largo. #b Genaro Berón de Astrada#! died commanding it; not one province had come.\n\nIt was exactly what anyone could work out in March: one province alone against the whole Confederation. What could not be worked out is that she seceded anyway.\n\nThe legislature of Corrientes submits to the victors. The river is shut again, and the customs house is one account once more."
 gg_argentina.10.f:0 "Not one other province came."
 gg_argentina.10.a:0 "Let the others learn."
 gg_argentina.11.t:0 "Quebracho Herrado"
 gg_argentina.11.d:0 "The Ejército Unido de Vanguardia caught Lavalle at Quebracho Herrado and broke him. More than fifteen hundred unitarian dead; thirty-six federal.\n\nAnd it is worth saying why, because it was no lesson in tactics. Lavalle and #b Lamadrid#! had agreed to join at the posta de Romero on 20 November. Lavalle arrived late and #b Lamadrid had withdrawn without a word#!. The Coalition lost its best army to a misunderstanding between two generals who were not speaking.\n\nThe man commanding that vanguard is #b Manuel Oribe#!, deposed president of the Oriental Republic, fighting your war while he waits for his own."
 gg_argentina.11.f:0 "Lost at a posting house, not in the field."
 gg_argentina.11.a:0 "Let him go north."
 gg_argentina.12.t:0 "Famaillá, and then Metán"
 gg_argentina.12.d:0 "At Famaillá the Tucumán militia #b withdrew without fighting#!. Lavalle escaped with what was left and would die three weeks later in Jujuy, to a bullet that went through a door's keyhole.\n\nThen came Metán. Governor #b Marco Avellaneda#! was beheaded in Oribe's presence, and his head set on a pike in the square of Tucumán. Some two thousand of the opposition crossed to Chile.\n\nThe Coalition of the North lasted eighteen months. And the army that undid it is now free -- with its commander looking east, where Montevideo is."
 gg_argentina.12.f:0 "And the head on a pike, in the square."
 gg_argentina.12.a:0 "The north is quiet."
