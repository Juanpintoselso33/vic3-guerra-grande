l_english:
 gg_argentina.1.t:0 "Corrientes secedes"
 gg_argentina.1.d:0 "Corrientes has disavowed the government of Buenos Aires and declared war on it. Governor #b Genaro Berón de Astrada#! invokes no doctrine: he invokes the #b blockade on its commerce#!. This is the province of the #V 68#! per cent of the yerba and the hides that come down the Paraná, and the port they must pass through is shut by your order.\n\nIt takes Misiones with it. Corrientes has occupied the land south of the Aguapey since #V 1830#!, handed it out in enfiteusis, and claimed the whole territory on #b 1 September 1832#!. In fact and in declared law that land is hers, and she is taking it.\n\nAnd she goes #b alone#!. No other province joins her: not Entre Ríos, not Santa Fe, not the north. Corrientes by herself against the whole Confederation is a sum anyone can do — and she seceded anyway."
 gg_argentina.1.f:0 "One province, one closed river, and no company."
 gg_argentina.1.a:0 "Let the army march."
 gg_argentina.1.b:0 "Go with Corrientes."
 gg_argentina.2.t:0 "Tucumán pronounces"
 gg_argentina.2.d:0 "Tucumán has not rebelled: it has done something more precise and more serious. It has disavowed you #b in your character as governor of Buenos Aires#! and #b withdrawn the delegation of foreign relations#!. What is demanded is not the French alliance: it is that there be a constitution.\n\nWithin the month #b Salta, Jujuy, Catamarca and La Rioja#! follow. Five provinces, and the count may go on. Your power over them was never sovereignty: it was a lent faculty, and five legislatures have just reminded you of it.\n\nOne alone refuses flatly. #b Juan Felipe Ibarra#! of Santiago del Estero does not sign — and his province stands as a wedge of federal ground driven into the middle of the north, cutting the bloc into two halves that do not touch."
 gg_argentina.2.f:0 "Not a rebellion: a faculty reassumed."
 gg_argentina.2.a:0 "The north pronounces."
 gg_argentina.3.t:0 "The Pronunciamiento"
 gg_argentina.3.d:0 "Every year you tender your resignation from the charge of foreign relations, and every year the provinces refuse it. It is a ceremony: one offers what one knows nobody will take.\n\nThis year the legislature of Entre Ríos #b accepted#!. And in May the Convention will put it in writing, in as many words: Entre Ríos, #b "having reassumed"#! the faculty granted to the governor of Buenos Aires, will again treat with other nations in her own name.\n\nThere is no illegality to denounce, and that is the worst of it. The Federal Pact of 1831 is a treaty between sovereign entities, and each kept the right to withdraw what it lent. #b Justo José de Urquiza#! has usurped nothing: he has taken you at your word."
 gg_argentina.3.f:0 "They accepted the resignation."
 gg_argentina.3.a:0 "Then it is war."
 gg_argentina.3.b:0 "Move to Entre Ríos."
 gg_argentina.4.t:0 "Córdoba joins"
 gg_argentina.4.d:0 "Six months after Tucumán pronounced, #b Córdoba#! joins the Coalition. That is #b six provinces at once#!, and it is no longer a matter of the north: the line now reaches the heart of the road that joins Buenos Aires to the interior.\n\nThe Coalition has stopped being an understanding between governors. It has a congress of agents sitting in Tucumán, a director with the power to make war, sign peace and negotiate loans, and now the most populous inland province.\n\nWhat it does not have is continuous ground. Santiago del Estero still has not signed, and between the six provinces and the Litoral there is a wedge that obeys Buenos Aires."
 gg_argentina.4.f:0 "Six provinces, and a hole in the middle."
 gg_argentina.4.a:0 "Six, then."
 gg_argentina.10.t:0 "Pago Largo"
 gg_argentina.10.d:0 "Twenty-five days after disavowing Buenos Aires, the army of Corrientes came apart at Pago Largo. #b Genaro Berón de Astrada#! died commanding it; not one province had come.\n\nIt was exactly what anyone could work out in March: one province alone against the whole Confederation. What could not be worked out is that she seceded anyway.\n\nThe legislature of Corrientes submits to the victors. The river is shut again, and the customs house is one account once more."
 gg_argentina.10.f:0 "Not one other province came."
 gg_argentina.10.a:0 "Let the others learn."
 gg_argentina.11.t:0 "Quebracho Herrado"
 gg_argentina.11.d:0 "The Ejército Unido de Vanguardia caught Lavalle at Quebracho Herrado and broke him. More than fifteen hundred unitarian dead; thirty-six federal.\n\nAnd it is worth saying why, because it was no lesson in tactics. Lavalle and #b Lamadrid#! had agreed to join at the posta de Romero on 20 November. Lavalle arrived late and #b Lamadrid had withdrawn without a word#!. The Coalition lost its best army to a misunderstanding between two generals who were not speaking.\n\nThe man commanding that vanguard is #b Manuel Oribe#!, deposed president of the Oriental Republic, fighting your war while he waits for his own."
 gg_argentina.11.f:0 "Lost at a posting house, not in the field."
 gg_argentina.11.a:0 "Let him go north."
 gg_argentina.12.t:0 "Famaillá, and then Metán"
 gg_argentina.12.d:0 "At Famaillá the Tucumán militia #b withdrew without fighting#!. Lavalle escaped with what was left and would die three weeks later in Jujuy, to a bullet that went through a door's keyhole.\n\nThen came Metán. Governor #b Marco Avellaneda#! was beheaded in Oribe's presence, and his head set on a pike in the square of Tucumán. Some two thousand of the opposition crossed to Chile.\n\nThe Coalition of the North lasted eighteen months. And the army that undid it is now free -- with its commander looking east, where Montevideo is."
 gg_argentina.12.f:0 "And the head on a pike, in the square."
 gg_argentina.12.a:0 "The north is quiet."
 gg_argentina.30.t:0 "Nobody delegates any more"
 gg_argentina.30.d:0 "There was no battle. The last legislature that still let the governor of Buenos Aires speak for it withdrew the faculty, and with that the Confederation as you administered it is over.\n\nThere is nothing to denounce, and that is the part with no remedy. The Federal Pact of 4 January 1831 is a treaty between sovereign entities; each kept the right to withdraw what it lent, and every one of them has. What you held was not a country: it was a charge renewed by silence, year after year.\n\nWhat remains is the government of one province -- the richest, the one with the port and the customs house, but one. Beyond its borders your signature binds nobody."
 gg_argentina.30.f:0 "A delegate with nobody to represent."
 gg_argentina.30.a:0 "Then let us govern Buenos Aires."
 gg_arg_ejercito_correntino:0 "Army of Corrientes"
 gg_arg_ejercito_coalicion:0 "Army of the Coalition"
 gg_arg_ejercito_entrerriano:0 "Army of Entre Ríos"
 gg_argentina.40.t:0 "Pacheco resigns"
 gg_argentina.40.d:0 "#b Ángel Pacheco#! has tendered his resignation from the command. He is the ablest general you have left, the man who won Rodeo del Medio, and he goes two days before the battle.\n\nHe does not go out of fear. He goes because for weeks he has been receiving orders that contradict one another and arrive when they are no longer of use, and because he will not command a battle he cannot direct.\n\nThe army is left to you, and you have not led a field action in twenty years."
 gg_argentina.40.f:0 "Two days before, and in writing."
 gg_argentina.40.a:0 "Let him go."
 gg_argentina.41.t:0 "The hour of Caseros"
 gg_argentina.41.d:0 "The Ejército Grande is a few leagues off. Entrerrianos, correntinos, Orientals of the Defensa and Brazilians, under the man you yourself called, sixteen years ago, \"that chief will be your ruin\".\n\nThere is no delegation left to invoke and no congress left to promise. There is the army, the field, and the hours until daylight.\n\nYou have three roads, and posterity will argue for a century about which you should have taken."
 gg_argentina.41.f:0 "3 February 1852."
 gg_argentina.41.a:0 "Give battle where they find us."
 gg_argentina.41.b:0 "Manoeuvre and choose the ground ourselves."
 gg_argentina.41.c:0 "Fall back on Buenos Aires and hold the city."
 gg_argentina.50.t:0 "It delegates again"
 gg_argentina.50.d:0 "The province has been reincorporated. Its legislature again delegates the conduct of foreign relations to the governor of Buenos Aires -- and it does so for the simplest reason of all: it no longer has a legislature that could decide otherwise.\n\nThat is the difference between a delegation and a loyalty. A loyalty is lost; a delegation is withdrawn, and can be demanded back.\n\nThe count rises again. Whether it rose by conviction or by occupation is a question of another kind, and this count does not answer it."
 gg_argentina.50.f:0 "No legislature left to decide otherwise."
 gg_argentina.50.a:0 "The Confederation is one again."
 gg_argentina.5.t:0 "The Pact of the League of the North"
 gg_argentina.5.d:0 "The Congress of Agents has been sitting in Tucumán since #b 22 August#!, and on the twenty-fourth of September it signed what it came to sign: a defensive and offensive alliance of #V five#! provinces — Tucumán, Salta, Jujuy, Catamarca and La Rioja — sworn to give the Republic a constitution and to make war on you until there is one.\n\nAnd it has named a head. #b Tomás Brizuela#!, governor of La Rioja, is Director of the League, with the «general affairs» in his hands and the faculty of #b making war, signing peace and negotiating loans «within or outside the Republic»#!, besides concluding treaties — these last subject to ratification by each province.\n\nThey did not choose him for his letters. He has the most numerous and best armed army of the Coalition and its most distinguished officers, and he holds the mountain passes into Chile, from which they expect what they cannot make for themselves. #b Lamadrid#! has gone over to his ranks. The doctors of law wrote the pronouncement; from today a soldier answers for it."
 gg_argentina.5.f:0 "«To make war, to sign peace, to negotiate loans.»"
 gg_argentina.5.a:0 "A league with one man at its head."
 gg_argentina.6.t:0 "Caá Guazú"
 gg_argentina.6.d:0 "#b Pascual Echagüe#! entered Corrientes with some #V five thousand#! men and has come back with nothing. #b José María Paz#! waited for him at Caá Guazú with #V three thousand#!, held him with the foot and closed with the horse, and the army of Entre Ríos ceased to exist in an afternoon: #N eight hundred#! dead and #N a thousand#! prisoners, against #V fifty-three#! Correntine dead.\n\nThe field matters less than the arithmetic, and the arithmetic is the worst dispatch you have had from the interior. Corrientes is again a province in arms, with an army that won and a general who knows how to keep one — the same #b Paz#! who was eight years a prisoner and got out to command again.\n\nThere is one name that is not in the order of battle, and it will cost you more than the thousand prisoners: Echagüe did not take #b Justo José de Urquiza#! with him, and Urquiza will not be long in occupying the chair Echagüe is coming back to."
 gg_argentina.6.f:0 "Fifty-three men, against eighteen hundred."
 gg_argentina.6.a:0 "Then Echagüe is finished."
 gg_argentina.7.t:0 "The Pass of the Free Men"
 gg_argentina.7.d:0 "The #b Madariaga#! brothers did not come to restore anybody. After Arroyo Grande they refused to bring up their squadrons to save #b Pedro Ferré#!, went back to their estancia, and let four months go by.\n\nOn the first of April they crossed the Uruguay from Brazilian ground, at a ford they have baptised #b the Pass of the Free Men#!, and in #V thirteen#! days they were in the city. What they have set up there is theirs and nobody else's: a Unitarian party of their own making, and the confiscation of the property of #b every federal#! in the province — the method of Lavalle, and it will be said, the method of yours.\n\n#b Joaquín#! governs and #b Juan#! commands, and that division of the work is why they will last. Corrientes is on its feet again on the very flank of the river, in the month your army reaches Montevideo on the other bank."
 gg_argentina.7.f:0 "Thirteen days from the ford to the city."
 gg_argentina.7.a:0 "The province is theirs again."
 gg_arg_division_rioja:0 "Division of La Rioja"
 gg_arg_ejercito_caa_guazu:0 "Army of Caá Guazú"
 gg_arg_ejercito_libertador:0 "Liberating Army of Corrientes"
