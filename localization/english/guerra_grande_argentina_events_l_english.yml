l_english:
 gg_argentina.1.t:0 "Corrientes secedes"
 gg_argentina.1.d:0 "Corrientes has disavowed the government of Buenos Aires and declared war on it. Governor #b Genaro Berón de Astrada#! invokes no doctrine: he invokes the #b blockade on its commerce#!. This is the province of the #V 68#! per cent of the yerba and the hides that come down the Paraná, and the port they must pass through is shut by your order.\n\nIt takes Misiones with it. Corrientes has occupied the land south of the Aguapey since #V 1830#!, handed it out in enfiteusis, and claimed the whole territory on #b 1 September 1832#!. In fact and in declared law that land is hers, and she is taking it.\n\nAnd she goes #b alone#!. No other province joins her: not Entre Ríos, not Santa Fe, not the north. Corrientes by herself against the whole Confederation is a sum anyone can do — and she seceded anyway."
 gg_argentina.1.f:0 "One province, one closed river, and no company."
 gg_argentina.1.a:0 "Let the army march."
 gg_argentina.1.b:0 "Go with Corrientes."
 gg_argentina.2.t:0 "Tucumán pronounces"
 gg_argentina.2.d:0 "Tucumán has not rebelled: it has done something more precise and more serious. It has disavowed you #b in your character as governor of Buenos Aires#! and #b withdrawn the delegation of foreign relations#!. What is demanded is not the French alliance: it is that there be a constitution.\n\nWithin the month #b Salta, Jujuy, Catamarca and La Rioja#! follow. Five provinces, and the count may go on. Your power over them was never sovereignty: it was a lent faculty, and five legislatures have just reminded you of it.\n\nOne alone refuses flatly. #b Juan Felipe Ibarra#! of Santiago del Estero does not sign — and his province stands as a wedge of federal ground driven into the middle of the north, cutting the bloc into two halves that do not touch."
 gg_argentina.2.f:0 "Not a rebellion: a faculty reassumed."
 gg_argentina.2.a:0 "The north pronounces."
 gg_argentina.3.t:0 "The Pronunciamiento"
 gg_argentina.3.d:0 "Every year you tender your resignation from the charge of foreign relations, and every year the provinces refuse it. It is a ceremony: one offers what one knows nobody will take.\n\nThis year the legislature of Entre Ríos #b accepted#!. And in May the Convention will put it in writing, in as many words: Entre Ríos, #b "having reassumed"#! the faculty granted to the governor of Buenos Aires, will again treat with other nations in her own name.\n\nThere is no illegality to denounce, and that is the worst of it. The Federal Pact of 1831 is a treaty between sovereign entities, and each kept the right to withdraw what it lent. #b Justo José de Urquiza#! has usurped nothing: he has taken you at your word."
 gg_argentina.3.f:0 "They accepted the resignation."
 gg_argentina.3.a:0 "Then it is war."
 gg_argentina.3.b:0 "Move to Entre Ríos."
 gg_argentina.4.t:0 "Córdoba joins"
 gg_argentina.4.d:0 "Six months after Tucumán pronounced, #b Córdoba#! joins the Coalition. That is #b six provinces at once#!, and it is no longer a matter of the north: the line now reaches the heart of the road that joins Buenos Aires to the interior.\n\nThe Coalition has stopped being an understanding between governors. It has a congress of agents sitting in Tucumán, a director with the power to make war, sign peace and negotiate loans, and now the most populous inland province.\n\nWhat it does not have is continuous ground. Santiago del Estero still has not signed, and between the six provinces and the Litoral there is a wedge that obeys Buenos Aires."
 gg_argentina.4.f:0 "Six provinces, and a hole in the middle."
 gg_argentina.4.a:0 "Six, then."
 gg_argentina.10.t:0 "Pago Largo"
 gg_argentina.10.d:0 "Twenty-five days after disavowing Buenos Aires, the army of Corrientes came apart at #b Pago Largo#!. #b Genaro Berón de Astrada#! died commanding it; not one province had come.\n\nIt was the sum anyone could do in March: one province alone against the whole Confederation. The governor and the army with which he opened the war were left on the field.\n\nThe dispatch brings no capitulation from the legislature and no province reincorporated. It brings a broken enemy force, a dead commander and a campaign that must still be decided on the ground."
 gg_argentina.10.f:0 "Not one other province came."
 gg_argentina.10.a:0 "The field is ours; the campaign continues."
 gg_argentina.11.t:0 "Quebracho Herrado"
 gg_argentina.11.d:0 "The Ejército Unido de Vanguardia caught Lavalle at Quebracho Herrado and broke him. More than fifteen hundred unitarian dead; thirty-six federal.\n\nAnd it is worth saying why, because it was no lesson in tactics. Lavalle and #b Lamadrid#! had agreed to join at the posta de Romero on 20 November. Lavalle arrived late and #b Lamadrid had withdrawn without a word#!. The Coalition lost its best army to a misunderstanding between two generals who were not speaking.\n\nThe man commanding that vanguard is #b Manuel Oribe#!, deposed president of the Oriental Republic, fighting your war while he waits for his own."
 gg_argentina.11.f:0 "Lost at a posting house, not in the field."
 gg_argentina.11.a:0 "Let him go north."
 gg_argentina.12.t:0 "Famaillá, and then Metán"
 gg_argentina.12.d:0 "At #b Famaillá#! the Tucumán militia #b withdrew without fighting#!. #b Lavalle#! escaped with what was left and would die three weeks later in Jujuy, to a bullet that went through a door's keyhole.\n\nThen came #b Metán#!. Governor #b Marco Avellaneda#! was beheaded in #b Oribe's#! presence, and his head set on a pike in the square of Tucumán. Some #N two thousand#! of the opposition crossed to Chile.\n\nThe dispatch lists the dead, the fugitives and a broken enemy force; it does not carry the surrender of the provinces that still uphold the Coalition. The vanguard won the field, but the north remains a campaign."
 gg_argentina.12.f:0 "And the head on a pike, in the square."
 gg_argentina.12.a:0 "Re-form the vanguard; the campaign continues."
 gg_argentina.21.t:0 "The Vanguard crosses"
 gg_argentina.21.d:0 "'General Oribe is before Montevideo,' the minister reports. 'It is the same United Army of the Vanguard that broke Rivera at Arroyo Grande, returning from the campaign in the interior with the force left standing. We must decide what crosses now and what force remains on this bank.'\n\nWe can send everything that remains and require the littoral to raise its own cavalry later; set one division aside before the crossing; or hold the army until this bank is secure. There are no more troops to divide: anything kept here will be missing there."
 gg_argentina.21.f:0 "One vanguard, two banks."
 gg_argentina.21.a:0 "Send everything still standing across."
 gg_argentina.21.b:0 "Reserve one division for the littoral."
 gg_argentina.21.c:0 "Secure this bank first."
 gg_argentina.30.t:0 "Nobody delegates any more"
 gg_argentina.30.d:0 "There was no battle. The last legislature that still let the governor of Buenos Aires speak for it withdrew the faculty, and with that the Confederation as you administered it is over.\n\nThere is nothing to denounce, and that is the part with no remedy. The Federal Pact of 4 January 1831 is a treaty between sovereign entities; each kept the right to withdraw what it lent, and every one of them has. What you held was not a country: it was a charge renewed by silence, year after year.\n\nWhat remains is the government of one province -- the richest, the one with the port and the customs house, but one. Beyond its borders your signature binds nobody."
 gg_argentina.30.f:0 "A delegate with nobody to represent."
 gg_argentina.30.a:0 "Then let us govern Buenos Aires."
 gg_arg_ejercito_correntino:0 "Army of Corrientes"
 gg_arg_ejercito_coalicion:0 "Army of the Coalition"
 gg_arg_ejercito_entrerriano:0 "Army of Entre Ríos"
 gg_arg_division_litoral:0 "Division of the Littoral"
 gg_argentina.40.t:0 "Pacheco resigns"
 gg_argentina.40.d:0 "#b Ángel Pacheco#! has tendered his resignation from the command. He is the ablest general you have left, the man who won Rodeo del Medio, and he goes two days before the battle.\n\nHe does not go out of fear. He goes because for weeks he has been receiving orders that contradict one another and arrive when they are no longer of use, and because he will not command a battle he cannot direct.\n\nThe army is left to you, and you have not led a field action in twenty years."
 gg_argentina.40.f:0 "Two days before, and in writing."
 gg_argentina.40.a:0 "Let him go."
 gg_argentina.41.t:0 "The hour of Caseros"
 gg_argentina.41.d:0 "The Ejército Grande is a few leagues off. Entrerrianos, correntinos, Orientals of the Defensa and Brazilians, under the man you yourself called, sixteen years ago, \"that chief will be your ruin\".\n\nThere is no delegation left to invoke and no congress left to promise. There is the army, the field, and the hours until daylight.\n\nYou have three roads, and posterity will argue for a century about which you should have taken."
 gg_argentina.41.f:0 "3 February 1852."
 gg_argentina.41.a:0 "Give battle where they find us."
 gg_argentina.41.b:0 "Manoeuvre and choose the ground ourselves."
 gg_argentina.41.c:0 "Fall back on Buenos Aires and hold the city."
 gg_argentina.50.t:0 "It delegates again"
 gg_argentina.50.d:0 "The province has been reincorporated. Its legislature again delegates the conduct of foreign relations to the governor of Buenos Aires -- and it does so for the simplest reason of all: it no longer has a legislature that could decide otherwise.\n\nThat is the difference between a delegation and a loyalty. A loyalty is lost; a delegation is withdrawn, and can be demanded back.\n\nThe count rises again. Whether it rose by conviction or by occupation is a question of another kind, and this count does not answer it."
 gg_argentina.50.f:0 "No legislature left to decide otherwise."
 gg_argentina.50.a:0 "The Confederation is one again."
 gg_argentina.5.t:0 "The Pact of the League of the North"
 gg_argentina.5.d:0 "The Congress of Agents has been sitting in Tucumán since #b 22 August#!, and on the twenty-fourth of September it signed what it came to sign: a defensive and offensive alliance of #V five#! provinces — Tucumán, Salta, Jujuy, Catamarca and La Rioja — sworn to give the Republic a constitution and to make war on you until there is one.\n\nAnd it has named a head. #b Tomás Brizuela#!, governor of La Rioja, is Director of the League, with the «general affairs» in his hands and the faculty of #b making war, signing peace and negotiating loans «within or outside the Republic»#!, besides concluding treaties — these last subject to ratification by each province.\n\nThey did not choose him for his letters. He has the most numerous and best armed army of the Coalition and its most distinguished officers, and he holds the mountain passes into Chile, from which they expect what they cannot make for themselves. The doctors of law wrote the pronouncement; from today a soldier answers for it."
 gg_argentina.5.f:0 "«To make war, to sign peace, to negotiate loans.»"
 gg_argentina.5.a:0 "A league with one man at its head."
 gg_argentina.6.t:0 "Caá Guazú"
 gg_argentina.6.d:0 "#b Pascual Echagüe#! entered Corrientes with some #V five thousand#! men and has come back with nothing. #b José María Paz#! waited for him at Caá Guazú with #V three thousand#!, held him with the foot and closed with the horse, and the army of Entre Ríos ceased to exist in an afternoon: #N eight hundred#! dead and #N a thousand#! prisoners, against #V fifty-three#! Correntine dead.\n\nThe field matters less than the arithmetic, and the arithmetic is the worst dispatch you have had from the interior. Corrientes is again a province in arms, with an army that won and a general who knows how to keep one — the same #b Paz#! who was eight years a prisoner and got out to command again.\n\nThere is one name that is not in the order of battle, and it will cost you more than the thousand prisoners: Echagüe did not take #b Justo José de Urquiza#! with him, and Urquiza will not be long in occupying the chair Echagüe is coming back to."
 gg_argentina.6.f:0 "Fifty-three men, against eighteen hundred."
 gg_argentina.6.a:0 "Then Echagüe is finished."
 gg_argentina.7.t:0 "The Pass of the Free Men"
 gg_argentina.7.d:0 "The #b Madariaga#! brothers did not come to restore anybody. After Arroyo Grande they refused to bring up their squadrons to save #b Pedro Ferré#!, went back to their estancia, and let four months go by.\n\nOn the first of April they crossed the Uruguay from Brazilian ground, at a ford they have baptised #b the Pass of the Free Men#!, and in #V thirteen#! days they were in the city. What they have set up there is theirs and nobody else's: a Unitarian party of their own making, and the confiscation of the property of #b every federal#! in the province — the method of Lavalle, and it will be said, the method of yours.\n\n#b Joaquín#! governs and #b Juan#! commands, and that division of the work is why they will last. Corrientes is on its feet again on the very flank of the river, in the month your army reaches Montevideo on the other bank."
 gg_argentina.7.f:0 "Thirteen days from the ford to the city."
 gg_argentina.7.a:0 "The province is theirs again."
 gg_arg_division_rioja:0 "Division of La Rioja"
 gg_arg_ejercito_caa_guazu:0 "Army of Caá Guazú"
 gg_arg_ejercito_libertador:0 "Liberating Army of Corrientes"
 gg_argentina.61.t:0 "The petition from Corrientes"
 gg_argentina.61.d:0 "Since #V 1830#!, #b Pedro Ferré#! has upheld the same programme for Corrientes: license other ports and open the #b Paraná#! and #b Uruguay#! rivers to navigation. He is not asking that the Confederation be surrendered to the Unitarians; he asks that a federal province be able to ship its produce without passing through a single gate.\n\nThe Customs Law of #b 18 December 1835#! granted him protection against European manufactures. It did not grant the ports or the rivers, the two parts of the programme that draw traffic away from Buenos Aires and touch its customs revenue.\n\nThe petition is again on this desk. The single passage and its immediate revenue can be preserved, but Corrientes will carry another refusal in its accounts; or the system can be opened now, at the price of yielding it."
 gg_argentina.61.f:0 "Federal, fluvial, and written in Corrientes."
 gg_argentina.61.a:0 "The Confederation will have one gate."
 gg_argentina.61.b:0 "License the ports and open the rivers."
 gg_argentina.62.t:0 "The customs account"
 gg_argentina.62.d:0 "#b Ferré's#! second claim concerns not the channel but the chest: Corrientes asks for a share of the Buenos Aires customs revenue. While every cargo must pass through this port, the petition argues, its proceeds cannot remain in a single province.\n\nThe answer from Buenos Aires is also in writing. Buenos Aires carries the national debt, the security of the coasts and the consuls; to divide the revenue is to divide the resources that meet those obligations. It was over this point and the ports that #b Ferré#! withdrew from the debate of #V 1830-1831#!.\n\nThe signature can reserve the account to Buenos Aires and add another refusal, or it can share it. Sharing requires money now and reduces for years what the government can draw from the provinces it administers."
 gg_argentina.62.f:0 "One customs house, and more than one claimant to its revenue."
 gg_argentina.62.a:0 "Buenos Aires pays; Buenos Aires collects."
 gg_argentina.62.b:0 "Share the customs revenue."
 gg_argentina.63.t:0 "The river under blockade"
 gg_argentina.63.d:0 "Rear Admiral #b Louis Leblanc#! has closed the port. The French ultimatum demanded exemption of its subjects from military service, indemnities and most-favoured-nation treatment; when its term expired, the squadron began the blockade on #b 28 March 1838#!.\n\nThe order falls on Buenos Aires, but the choking reaches upriver. The hides and yerba of Corrientes need an outlet, and the province that disputes ports, navigation and customs discovers that now even the contested conduit does not lead to the sea.\n\nThe chest can advance relief to sustain that inland traffic while the closure lasts. If the customs house keeps every peso to resist France, the Correntine economy will bear the blockade directly."
 gg_argentina.63.f:0 "The squadron is at the mouth; the account runs upriver."
 gg_argentina.63.a:0 "The customs house must sustain resistance."
 gg_argentina.63.b:0 "Relieve Correntine commerce."
 gg_argentina.64.t:0 "Corrientes remains"
 gg_argentina.64.d:0 "No declaration of war has arrived from Corrientes. The licensed ports and open navigation gave her an outlet of her own; the shared revenue gave her a part in the account she had disputed for years.\n\nThe French blockade still weighs on the commerce of the Litoral, but it can no longer be presented as the final proof that Buenos Aires closes the river and keeps its proceeds alone. The Correntine petition was answered before it became a rupture.\n\nThe province remains within the Confederation. So do the money spent, the revenue yielded and the limit this government accepted upon its customs monopoly."
 gg_argentina.64.f:0 "There was no rupture because there was an answer."
 gg_argentina.64.a:0 "Keep the settlement and pay its price."
 gg_argentina.65.t:0 "The murder of Heredia"
 gg_argentina.65.d:0 "The dispatch from the north confirms the murder of #b Alejandro Heredia#!. During the war against the Peru-Bolivian Confederation he had been #b Protector of Salta, Jujuy, Catamarca and Tucumán#!; with him disappears the man around whom regional power had been ordered.\n\nAfter his death, government in those provinces passes to liberal groups. There is no need to call them all Unitarians to understand the change: the hands receiving papers from Buenos Aires are no longer those that received them under #b Heredia#!.\n\nBuenos Aires may withhold recognition from the new authorities and demand that the former order continue, or admit the provincial governments that have taken its place. The first dispatch sent to them will decide whether the relationship begins with repudiation or concession."
 gg_argentina.65.f:0 "One murder, and other hands upon the papers of the north."
 gg_argentina.65.a:0 "Do not recognise the new authorities."
 gg_argentina.65.b:0 "Recognise the provincial governments."
 gg_argentina.66.t:0 "Lamadrid to Tucumán"
 gg_argentina.66.d:0 "#b Gregorio Aráoz de Lamadrid#! can depart for Tucumán with #V fifty#! grenadiers. The dispatch he will carry already settles what shall be done with the arms of the army that fought in Bolivia; it remains to decide whether Buenos Aires puts a general and an escort behind that resolution.\n\nIt is a small commission in men and a great one in trust. The north has been in liberal hands since #b Heredia's#! death, and #b Lamadrid#! knows that country, its officers and its grievances better than any envoy who might replace him.\n\nSending him asserts Buenos Aires's intervention in northern command, but also leaves him before those preparing the rising. Keeping him preserves the general in Buenos Aires and leaves the provincial authorities to carry out what has already been decided."
 gg_argentina.66.f:0 "#V Fifty#! grenadiers and a general who must be trusted."
 gg_argentina.66.a:0 "Send him to demand the arms."
 gg_argentina.66.b:0 "Keep Lamadrid; do not expose that command."
 gg_argentina.67.t:0 "Two orders for Urquiza"
 gg_argentina.67.d:0 "The dispatch for #b Justo José de Urquiza#! carries command of the army that must face Brazil. In the same packet goes another order: cut the traffic between Entre Ríos and Montevideo, tolerated for years although Buenos Aires regards it as contraband.\n\nThe two instructions cannot fit together without cost. He is asked to organise the war while the commerce sustaining his province's economy is closed; he is given the Confederation's greatest military responsibility and deprived of the material base with which he must discharge it.\n\n#b Rosas's#! annual resignation from the charge of foreign relations travels with them. Each year the provinces refuse it and the gesture confirms the delegation; this time Entre Ríos will receive at once a ceremony expected to remain ritual and two orders that test its obedience."
 gg_argentina.67.f:0 "The command on one sheet; the closure of traffic on the next."
 gg_argentina.67.a:0 "Send both orders; the resignation will be refused."
 gg_argentina.67.b:0 "Do not demand both things at once."
 gg_argentina.68.t:0 "The armaments of the north"
 gg_argentina.68.d:0 "The army of operations that fought against the Peru-Bolivian Confederation has left its arms in the north. With that campaign over, the provincial governments retain the men and stores gathered under #b Alejandro Heredia's#! command.\n\nBuenos Aires may demand their return to the authority of the Confederation. That was the claim with which #b Rosas#! historically sent #b Gregorio Aráoz de Lamadrid#! towards Tucumán in March #V 1840#!.\n\nThe other signature leaves the armaments where they stand and recognises that the provinces administer what their army assembled. The Confederation loses available strength, but the north does not receive an order to surrender them as the first answer to its new governments."
 gg_argentina.68.f:0 "The arms remained where the campaign ended; authority over them is still disputed."
 gg_argentina.68.a:0 "Demand the armaments."
 gg_argentina.68.b:0 "Leave them in provincial hands."
 gg_argentina.69.t:0 "The Treaty of Alcaraz"
 gg_argentina.69.d:0 "In August #V 1846#!, #b Justo José de Urquiza#! and #b Madariaga#! have signed peace between Entre Ríos and Corrientes. The agreement reincorporates Corrientes into the Confederation and provides for a constituent congress.\n\nThe treaty also excuses Corrientes from fighting in Uruguay. #b Urquiza#! has negotiated on his own account a peace touching foreign war and the organisation of the Confederation, matters conducted by Buenos Aires through the provinces' delegation.\n\nAmendments may be demanded and the agreement returned to #b Madariaga#!, as happened historically, or the Entre Ríos signature may be allowed to stand. Accepting it preserves the agreed peace, but recognises today the provincial authority that Entre Ríos will invoke again tomorrow."
 gg_argentina.69.f:0 "The peace comes signed from Alcaraz; Buenos Aires decides whether to return it."
 gg_argentina.69.a:0 "Demand amendments to the treaty."
 gg_argentina.69.b:0 "Let the peace of Alcaraz stand."
 gg_argentina.70.t:0 "The north does not pronounce"
 gg_argentina.70.d:0 "The #b 7th of April 1840#! has arrived without a pronouncement from Tucumán. The governments that emerged after #b Heredia's#! death were recognised before disagreement became a rupture.\n\nThe arms of the army that fought in Bolivia remained in provincial hands, and #b Lamadrid#! remained in Buenos Aires. Without a demand for their surrender or a Buenos Aires general sent to enforce it, the northern provinces retain their governments and continue delegating foreign relations.\n\nThe Coalition is not born. The concessions that prevented it also remain: less political authority for this government, less force gathered under its hand, and a limit the provinces may recall in the next petition."
 gg_argentina.70.f:0 "There was no pronouncement because all three petitions received an answer."
 gg_argentina.70.a:0 "Keep the settlement and pay its price."
 gg_argentina.71.t:0 "Entre Ríos maintains the delegation"
 gg_argentina.71.d:0 "The #b 1st of May 1851#! has arrived and the Entre Ríos legislature has not accepted #b Rosas's#! annual resignation. The charge of foreign relations remains in Buenos Aires.\n\nThe peace of Alcaraz was allowed to stand five years ago. Later, when #b Urquiza#! received command against Brazil, he was not required at the same time to close the traffic with Montevideo that sustained his province's economy.\n\nThere is no Pronunciamiento and no Entre Ríos army marching against Buenos Aires. What remains instead is the treaty Rosas accepted, the money spent to avoid imposing both orders, and the precedent of a province that negotiated peace on its own account."
 gg_argentina.71.f:0 "The resignation returns refused; the delegation remains."
 gg_argentina.71.a:0 "Keep the settlement and pay its price."
 gg_argentina.60.t:0 "Oribe in Buenos Aires"
 gg_argentina.60.d:0 "#b Manuel Oribe#! has landed. Five days ago, with the French squadron at the Cerro and the oriental flotilla disarmed, he signed an act at the Villa de la Unión that the newspapers of Montevideo are calling a resignation. He does not call it that. He says he was made to sign it by a foreign fleet and by an armed rebel, and that an act extorted by force binds nobody — least of all the man who signed it.\n\nSo what is standing in the port is either an exile asking for shelter or the #b lawful president of the Oriental Republic#!, and which of the two he is depends entirely on what this government says he is. Rivera is already governing in Montevideo. France and Britain will deal with whoever holds the customs house.\n\nHe is also a soldier, and this government has a war coming that it does not yet have a general for. He commanded against the Farrapos, he held the campaña for three years, and the officers who followed him out of Montevideo came with him. Whatever is decided about the title, the man is worth an army."
 gg_argentina.60.f:0 "«Resignó», dice el acta. Él dice que no renunció."
 gg_argentina.60.a:0 "He is the president, and he will be received as one."
 gg_argentina.60.b:0 "Give him a command and say nothing of the presidency."
 gg_argentina.22.t:0 "The River Closed"
 gg_argentina.22.d:0 "The minister lays the report on the table: the British and French squadrons have closed #b every port of the Confederation and Uruguay#! except #P Montevideo#!. #b Brown's#! squadron was seized without a prior declaration of war.\n\nThe closure does not stop trade: it diverts it. Cargoes that no longer pass through Buenos Aires enrich #P Montevideo#! and the #b Entre Ríos littoral#!. Every day of blockade feeds that diversion.\n\n‘The river can be closed with men and guns,’ the minister concludes. ‘It can also be opened by concession, or defended lightly while the Foreign Ministry seeks an agreement. But we cannot spend the same guns on the Paraná, at the siege, and in the interior.’"
 gg_argentina.22.f:0 "One open customs house is enough to change the course of every cargo."
 gg_argentina.22.a:0 "#b Close and fortify the Paraná.#!"
 gg_argentina.22.b:0 "#b Accept foreign navigation.#!"
 gg_argentina.22.c:0 "#b Negotiate and limit the defences.#!"
 gg_argentina.23.t:0 "After the Chains"
 gg_argentina.23.d:0 "The report from #b Obligado#! permits no tactical consolation. A fleet of #V 22 warships#! and #V 92 merchantmen#! broke the chains and #N passed#!. #b Mansilla#! was gravely wounded; #b Thorne#! left nearly deaf.\n\nThe War Minister points upriver. The commercial expedition has passed, but the business meant to justify it is already failing. The batteries can still follow it from the bank, provided that their gunners and infantry remain unavailable to every other front.\n\nThe alternative is to turn the resistance into a negotiating position. Part of the column would return to the army; the fixed guns would remain behind. Nothing signed now changes what happened at the bend."
 gg_argentina.23.f:0 "The chains are broken. The decision begins upriver."
 gg_argentina.23.a:0 "#b Continue the resistance upriver.#!"
 gg_argentina.23.b:0 "#b Turn the defence into diplomatic leverage.#!"
 gg_argentina.24.t:0 "The Convoy Returns by Quebracho"
 gg_argentina.24.d:0 "The convoy returns through the #b Angostura del Quebracho#! with its commercial failure already written in its holds. The batteries open fire and the fleet loses #N six merchantmen#!. On the Argentine side, #N one man is killed#!.\n\n‘This was the last blow we could strike against that expedition,’ the minister reports. The guns and men remain there, still separated from the rest of the army. Keeping them on the Paraná materially sustains the demand that the powers recognise who commands the river.\n\nPart of them can also be withdrawn. The mobile column can march towards the littoral or the Paraguayan front; the fixed battery stays at its post, but Buenos Aires comes to the table with less force behind its claim."
 gg_argentina.24.f:0 "Fewer merchantmen return than sailed upriver."
 gg_argentina.24.a:0 "#b Keep the batteries until recognition.#!"
 gg_argentina.24.b:0 "#b Send the column to the Corrientes front.#!"
 gg_argentina.24.c:0 "#b Send the column to the Paraguayan front.#!"
 gg_argentina.25.t:0 "The Hood Bases, from Buenos Aires"
 gg_argentina.25.d:0 "#b Thomas Samuel Hood#! brings a common basis from the two powers. The paper offers to recognise #P Argentine sovereignty over the Paraná#!, return #b Martín García#! and the captured ships, disarm the foreigners in Montevideo, and abandon the city if the Defensa rejects the settlement.\n\nThe minister promises no peace that does not yet exist. Acceptance in Buenos Aires only carries the answer to the Cerrito and places the terms before the Defensa; Montevideo retains its own decision. Nothing in this signature by itself lifts the blockade or ends the war.\n\nRejecting the bases keeps the Argentine demand outside this paper and leaves operations open. This is a decision about which road is offered, not about an outcome that still belongs to the other bank."
 gg_argentina.25.f:0 "The same sheet must cross two banks before it can be called an agreement."
 gg_argentina.25.a:0 "#b Accept the bases and send them to the Cerrito.#!"
 gg_argentina.25.b:0 "#b Continue until another settlement is obtained.#!"
# EN: The quoted third clause below is a careful English translation of the Spanish original.
# ES: La clausula tercera citada abajo es una traduccion cuidada al ingles del original espanol.
 gg_argentina.26.t:0 "The Liberator's Sabre"
 gg_argentina.26.d:0 "The dispatch from Paris reports #b José de San Martín's#! death at Boulogne-sur-Mer on #V 17 August#! and transcribes the copy of his testament that #b Mariano Balcarce#! made on #V 28 September#! and deposited in the Legation archive. The original is holographic: San Martín wrote it in Paris on #V 23 January 1844#! in his own hand, before the notary #b François Huillier#! and accompanied by Balcarce.\n\nIts third clause reads: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe complete document does not end there. It forbids any funeral and asks to be taken directly to the cemetery without attendance, yet wishes his heart to be deposited in that of #b Buenos Aires#!; it declares, #V ‘I do not owe, nor have I ever owed, anything to anyone.’#! And he signs as #b ‘Generalissimo of the Republic of Peru and founder of its liberty, Captain General of that of Chile and Brigadier General of the Argentine Confederation’#!. The whole man may be published, the political weapon may be excerpted, or the paper may be received in silence."
 gg_argentina.26.f:0 "One clause for the government; one testament for the country."
 gg_argentina.26.a:0 "#b Publish it whole and declare mourning.#!"
 gg_argentina.26.b:0 "#b Print only the third clause.#!"
 gg_argentina.26.c:0 "#b Receive it without a public act.#!"
 gg_argentina.27.t:0 "The Liberator's Clause"
 gg_argentina.27.d_full:0 "#b Buenos Aires#! has published #b José de San Martín's#! testament in full and declared mourning. From Paris, Montevideo too receives the clause that matters to the government: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe opposition to #b Rosas#! is already disputing the document's authenticity and even San Martín's mental capacity when he wrote it. That is a weapon, but one with a price: challenging the testament of the man who liberated half a continent.\n\nThere is another answer. San Martín and Rosas corresponded, but those letters do not turn praise for firmness against foreign aggression into support for the governor's domestic politics. The Defensa may honour the Liberator and deny that the clause absolves the government."
 gg_argentina.27.d_clause:0 "#b Buenos Aires#! has printed only the third clause of #b José de San Martín's#! testament: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe excerpt makes the piece sharper and the answer easier. The opposition to #b Rosas#! is already disputing the document's authenticity and even San Martín's mental capacity when he wrote it. That is a weapon, but one with a price: challenging the testament of the man who liberated half a continent.\n\nThere is another answer. San Martín and Rosas corresponded, but those letters do not turn praise for firmness against foreign aggression into support for the governor's domestic politics. The Defensa may honour the Liberator and deny that the clause absolves the government."
 gg_argentina.27.d_private:0 "#b Buenos Aires#! has held no public act, but the report from Paris carries the third clause of #b José de San Martín's#! testament: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe opposition to #b Rosas#! disputes the document's authenticity and even San Martín's mental capacity when he wrote it. That is a weapon, but one with a price: challenging the testament of the man who liberated half a continent.\n\nThere is another answer. San Martín and Rosas corresponded, but those letters do not turn praise for firmness against foreign aggression into support for the governor's domestic politics. The Defensa may honour the Liberator and deny that the clause absolves the government."
 gg_argentina.27.f:0 "Firmness against the foreigner does not decide who governs at home."
 gg_argentina.27.a:0 "#b Deny the testament's authenticity.#!"
 gg_argentina.27.b:0 "#b Honour San Martín, not absolve Rosas.#!"
 gg_oribe_pretension:0 "The Oriental presidency upheld"
 gg_oribe_recognised_tt:0 "@battalions! By upholding #b Oribe#! as president, Buenos Aires may lend the Vanguard as a government's army: it will retain up to #P +1#! infantry battalion and #P +1#! cavalry battalion compared with receiving him as a general alone."
 gg_oribe_unrecognised_tt:0 "@battalions! If #b Oribe#! is received only as a general, the Vanguard Buenos Aires may lend will muster up to #N -1#! infantry battalion and #N -1#! cavalry battalion, with a minimum of #V 1#! of each arm."
 gg_vanguardia_cruce_total_tt:0 "@battalions! The Vanguard will cross with all available strength. The littoral will be left #N without a reserve#!: the cavalry raised there will muster #N +2#! squadrons."
 gg_vanguardia_reserva_litoral_tt:0 "@battalions! The Vanguard will cross with #N -1#! infantry battalion and #N -1#! cavalry squadron. Those same units will form Argentina's own #P division#!."
 gg_vanguardia_cruce_postergado_tt:0 "@battalions! The Vanguard will retain all available strength, but its crossing will be delayed by #N six months#!. Any cavalry the littoral can raise will muster #N -2#! squadrons."
 gg_urquiza_double_order_tt:0 "@warning! The command against Brazil travels with the order to cut off Entre Ríos's trade. If the province withdraws the charge, #b Urquiza's#! troops will march prepared for #V 2 years#!: #P +10%#! offence and #P +10%#! defence."
 gg_lamadrid_sent_tt:0 "@warning! #b Lamadrid#! carries the demand for the armaments north with #V 50#! grenadiers; if the provinces withdraw the charge, he and those officers may place themselves at their command."
 gg_norte_refusal_tt:0 "@warning! This petition goes unanswered. If even #N 1#! of the #V 3#! grievances remains, the northern legislatures will have common cause to withdraw the charge from Buenos Aires."
 gg_norte_concession_tt:0 "Buenos Aires grants this petition. Only if all #V 3#! are granted will the north be left without common cause to withdraw the charge."
 gg_entre_rios_refusal_tt:0 "@warning! Buenos Aires returns this petition without agreement. While even #N 1#! of the #V 2#! grievances remains, Entre Ríos may accept Rosas's next resignation and resume the charge."
 gg_entre_rios_concession_tt:0 "Buenos Aires yields on this petition. With the #V 2#! petitions favourably answered, Rosas's next resignation will be refused again and the charge will remain in his hands."
 gg_argentina.80.t:0 "The provinces held on trust"
 gg_argentina.80.d:0 "The war on the other bank is decided, and it was decided your way. The consequence reaches the interior before the treaties are signed: the provinces this government beat and left under a federal governor have no one left to look to.\n\nThey were never annexed. Each kept its legislature, its revenue and its name, and each conducted its foreign relations through Buenos Aires because it had been beaten into doing so — which is what the Federal Pact asked of them in the first place, only obtained by other means.\n\nNow the distinction stops paying for itself. What was a charge held on trust becomes ground held outright, and the map ceases to record that these provinces were ever asked."
 gg_argentina.80.f:0 "Lo que se tenía en depósito pasa a tenerse."
 gg_argentina.80.a:0 "Let them be incorporated."
 gg_argentina.81.t:0 "What Montevideo cost in the interior"
 gg_argentina.81.d:0 "The war on the other bank is decided, and it was not decided your way. The account comes due here, in provinces, and it comes due at once.\n\nThe provinces this government beat were never annexed: they were held under a federal governor, conducting their foreign relations through Buenos Aires because they had no other choice. The moment it is clear that Buenos Aires lost its war, the choice comes back to them.\n\nTheir legislatures are resuming the charge — the same clause of the Federal Pact, read the other way round. Nine years in front of Montevideo were paid for with the interior, and this is the invoice."
 gg_argentina.81.f:0 "La misma cláusula, leída al revés."
 gg_argentina.81.a:0 "Then they were never ours."
