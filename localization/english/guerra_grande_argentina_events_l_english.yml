l_english:
 gg_argentina.1.t:0 "Corrientes Secedes"
 gg_argentina.1.d:0 "Corrientes has disavowed the government of Buenos Aires and declared war on it. Governor #b Genaro Berón de Astrada#! invokes no doctrine: he invokes the #b blockade of its trade#!. This is the province that sends #V 68#! per cent of the yerba and hides down the Paraná, and the port they must pass through is closed on your orders.\n\nIt takes Misiones with it. Corrientes has occupied the land south of the Aguapey since #V 1830#!, leased it out under emphyteusis, and claimed the whole territory on #b 1 September 1832#!. In fact, and by its own declared right, that land is its own, and it is taking it.\n\nAnd it goes #b alone#!. No other province joins her: not Entre Ríos, not Santa Fe, not the north. Corrientes by itself against the whole Confederation is a calculation anyone could make — and it seceded anyway."
 gg_argentina.1.f:0 "One province, one closed river, and no company."
 gg_argentina.1.a:0 "Let the army march."
 gg_argentina.1.b:0 "Go with Corrientes."
 gg_argentina.2.t:0 "Tucumán Issues a Pronunciamiento"
 gg_argentina.2.d:0 "Tucumán has not rebelled: it has done something more precise, and more serious. It no longer recognises your authority #b as governor of Buenos Aires#! and has #b withdrawn its grant of authority over foreign relations#!. Its demand is not an alliance with France, but a constitution.\n\nWithin the month #b Salta, Jujuy, Catamarca and La Rioja#! follow. Five provinces, and the number may yet grow. Your power over them was never sovereignty: it was authority held in trust, as five legislatures have just reminded you.\n\nOnly one refuses outright. #b Juan Felipe Ibarra#! of Santiago del Estero will not sign — leaving his province as a wedge of federal territory driven through the north, dividing the bloc into two halves that do not meet."
 gg_argentina.2.f:0 "No rebellion: merely the recovery of an authority once entrusted."
 gg_argentina.2.a:0 "The north issues its pronunciamiento."
 gg_argentina.3.t:0 "The Pronunciamiento"
 gg_argentina.3.d:0 "Every year you offer to relinquish the conduct of foreign relations, and every year the provinces refuse. It is a ceremony: you offer what you know nobody will take.\n\nThis year the legislature of Entre Ríos #b accepted#!. In May, the Convention will put it beyond doubt: Entre Ríos, #b 'having reassumed'#! the authority entrusted to the governor of Buenos Aires, will once again deal with foreign nations in its own name.\n\nThere is no illegality to denounce, and that is the worst of it. The Federal Pact of 1831 is a treaty between sovereign entities, and each kept the right to withdraw the authority it lent. #b Justo José de Urquiza#! has usurped nothing: he has taken you at your word."
 gg_argentina.3.f:0 "They accepted the resignation."
 gg_argentina.3.a:0 "Accept the reassumption and call a congress."
 gg_argentina.3.b:0 "Declare the measure a rebellion."
 gg_argentina.3.c:0 "Declare rebellion and move to Entre Ríos."
 gg_pronunciamiento_accept_tt:0 "@information! #b Entre Ríos#! peacefully reassumes the conduct of its foreign relations: the authority entrusted to Buenos Aires is withdrawn, no war begins, and a #V constituent congress#! is called. Reconsidering Buenos Aires's support for Oribe reduces Rosas's backing of the Cerrito by #N 10#!."
 gg_pronunciamiento_rebelion_tt:0 "@warning! #b Entre Ríos#! withdraws the authority entrusted to Buenos Aires, takes the field with its army under Urquiza and begins an #N open war#! over the Federal Pact. A diplomatic channel opens between Entre Ríos, Montevideo and Brazil."
 gg_argentina.4.t:0 "Córdoba Joins"
 gg_argentina.4.d:0 "Six months after Tucumán issued its pronunciamiento, #b Córdoba#! joins the Coalition. That makes #b six provinces at once#!, and the matter is no longer confined to the north: the revolt now reaches the main road from Buenos Aires into the interior.\n\nThe Coalition is no longer a mere understanding between governors. It has a congress of delegates sitting in Tucumán, a director empowered to make war, conclude peace and negotiate loans, and now the most populous inland province.\n\nWhat it lacks is territorial continuity. Santiago del Estero still has not signed, leaving between the six provinces and the Litoral a wedge loyal to Buenos Aires."
 gg_argentina.4.f:0 "Six provinces, and a hole in the middle."
 gg_argentina.4.a:0 "Six, then."
 gg_argentina.10.t:0 "Pago Largo"
 gg_argentina.10.d:0 "Twenty-five days after disavowing Buenos Aires, the army of Corrientes came apart at #b Pago Largo#!. #b Genaro Berón de Astrada#! died commanding it; not one province had come to its aid.\n\nIt was a calculation anyone could have made in March: one province alone against the whole Confederation. The governor and the army with which he opened the war were left on the field.\n\nThe dispatch brings no capitulation from the legislature and no province reincorporated. It brings a broken enemy force, a dead commander and a campaign that must still be decided on the ground."
 gg_argentina.10.f:0 "Not one other province came."
 gg_argentina.10.a:0 "The field is ours; the campaign continues."
 gg_argentina.11.t:0 "Quebracho Herrado"
 gg_argentina.11.d:0 "The Ejército Unido de Vanguardia caught Lavalle at Quebracho Herrado and broke him. More than fifteen hundred Unitarians lie dead, against thirty-six Federals.\n\nThe reason bears telling, for this was no lesson in tactics. Lavalle and #b Lamadrid#! had agreed to join forces at the Posta de Romero on 20 November. Lavalle arrived late and #b Lamadrid had withdrawn without a word#!. The Coalition lost its best army through a failure of understanding between two generals who were not speaking.\n\nThe commander of that vanguard is #b Manuel Oribe#!, deposed president of the República Oriental, fighting your war while he awaits his own."
 gg_argentina.11.f:0 "Lost at a posting house, not in the field."
 gg_argentina.11.a:0 "Let him go north."
 gg_argentina.12.t:0 "Famaillá, and then Metán"
 gg_argentina.12.d:0 "At #b Famaillá#! the Tucumán militia #b withdrew without fighting#!. #b Lavalle#! escaped with what was left and would die three weeks later in Jujuy, to a bullet that went through a door's keyhole.\n\nThen came #b Metán#!. Governor #b Marco Avellaneda#! was beheaded in #b Oribe's#! presence, and his head set on a pike in the square of Tucumán. Some #N two thousand#! of the opposition crossed to Chile.\n\nThe dispatch lists the dead, the fugitives and a broken enemy force; it does not carry the surrender of the provinces that still uphold the Coalition. The vanguard won the field, but the north remains a campaign."
 gg_argentina.12.f:0 "And the head on a pike, in the square."
 gg_argentina.12.a:0 "Re-form the vanguard; the campaign continues."
 gg_argentina.21.t:0 "The Vanguard Crosses"
 gg_argentina.21.d:0 "‘General Oribe is before Montevideo,’ the minister reports. 'It is the same Ejército Unido de Vanguardia that broke Rivera at Arroyo Grande, returning from the campaign in the interior with the force left standing. We must decide what crosses now and what force remains on this bank.'\n\nWe can send everything that remains and require the littoral to raise its own cavalry later; set one division aside before the crossing; or hold the army until this bank is secure. There are no more troops to divide: anything kept here will be missing there."
 gg_argentina.21.f:0 "One vanguard, two banks."
 gg_argentina.21.a:0 "Send everything still standing across."
 gg_argentina.21.b:0 "Reserve one division for the littoral."
 gg_argentina.21.c:0 "Secure this bank first."
 gg_argentina.21.t_held:0 "The Vanguard Stays"
 gg_argentina.21.d_held:0 "‘General Oribe is before Montevideo,’ the minister reports, 'but he arrives with his Orientals and nothing more. The Ejército Unido de Vanguardia cannot follow him: the interior is still in arms, and every battalion that crosses the river is a battalion missing against the risen provinces.'\n\nThe Confederation cannot sustain two wars with a single army. While any province disowns the Pact, the Vanguard stays on this side of the river.\n\nOribe will have to besiege the city with what is his own, and Buenos Aires will send him what it can once the interior is in order."
 gg_argentina.21.e:0 "The interior comes first."
 gg_argentina.30.t:0 "The Mandate No Longer Suffices"
 gg_argentina.30.d:0 "More than half the provinces have ceased to recognise Buenos Aires's mandate to conduct foreign relations. Some retained the delegation and others withdrew it; that division alone prevents one signature from binding the Confederation.\n\nThe Federal Pact does not disappear, nor does it automatically transfer a yard of ground. What falls is the government that claimed to speak for every province under a mandate now retained by a minority. The provincial governments remain where they stood; territorial disputes will be decided by their own wars and treaties.\n\nThe customs house remains in Buenos Aires. Common representation does not. Another government and another settlement are required."
 gg_argentina.30.f:0 "A majority has withdrawn its mandate; those that retained it remain on the map and in the Pact."
 gg_argentina.30.a:0 "Hand over the government and open constitutional organisation."
 gg_argentina.82.t:0 "The Negotiated Confederation"
 gg_argentina.82.d:0 "Congress is no longer a promise postponed until after the next crisis. Buenos Aires recognises that the conduct of foreign relations can no longer rest on annual renewals in place of a constitution; Entre Ríos remains within a common settlement and the outstanding petitions close without another campaign.\n\nRosas retains the government of Buenos Aires, but not the old system intact: navigation, provincial representation and national organisation are now governed by the written settlement he conceded. No province was conquered and no battle need be invented.\n\nThe old mandate gives way to institutions."
 gg_argentina.82.f:0 "What legislatures delegated returns in writing from a congress."
 gg_argentina.82.a:0 "Summon the provinces and fulfil the settlement."
 gg_argentina.83.t:0 "Urquiza's Victory"
 gg_argentina.83.d:0 "The army of Buenos Aires has been defeated and Entre Ríos has enforced its objective. Rosas can no longer present the conduct of foreign relations as a living mandate: the government that exercised it fell with the defeat.\n\nUrquiza enters Buenos Aires as head of the victorious coalition. Entre Ríos does not disappear or become a possession of the port; it retains its government within the settlement that must now organise the Confederation. The campaign's debts and commitments to Brazil survive victory.\n\nWar decided who governs. A constitution will decide under which rules."
 gg_argentina.83.f:0 "Caseros was not a military modifier: it was the end of a government."
 gg_argentina.83.a:0 "Install the victor and summon national organisation."
 gg_argentina.84.t:0 "The Mandate Renewed by Arms"
 gg_argentina.84.d:0 "Buenos Aires enforced its objective and Entre Ríos again became subordinate in foreign affairs. Rosas won the war; turning that victory into his fall would deny what happened in the field.\n\nThe Entre Ríos delegation is restored, but the uprising cannot be erased from the record. Corrientes, the Brazilian mortgages and navigation concessions retain their own outcomes. Oribe's army does not reappear if the Oriental war has already ended.\n\nThe governor retains the mandate. The absence of a constitution is now the visible price of retaining it by force."
 gg_argentina.84.f:0 "Buenos Aires won; the constitutional question survived."
 gg_argentina.84.a:0 "Record the victory and demand the delegation anew."
 gg_argentina.85.t:0 "Two Governments, No Victor"
 gg_argentina.85.d:0 "The war ended without Buenos Aires subduing Entre Ríos or Entre Ríos overthrowing the government of Buenos Aires. The Pronunciamiento is not undone: the province retains the authority it resumed. Rosas retains his government but can no longer speak for the rebellious littoral.\n\nThere is no reunited Confederation to proclaim and no fall of Rosas to pretend. Two authorities survived, and the Federal Pact can no longer reunite them by itself.\n\nThe campaign closes in division. Any future reunion must arise from another agreement or another war."
 gg_argentina.85.f:0 "Peace stopped the armies; it did not repair the mandate."
 gg_argentina.85.a:0 "Recognise the division and close the file."
 gg_arg_ejercito_correntino:0 "Army of Corrientes"
 gg_arg_ejercito_coalicion:0 "Army of the Coalition"
 gg_arg_ejercito_entrerriano:0 "Army of Entre Ríos"
 gg_arg_division_litoral:0 "Division of the Littoral"
 gg_argentina.40.t:0 "Pacheco Resigns"
 gg_argentina.40.d:0 "#b Ángel Pacheco#! has tendered his resignation from the command. He is the ablest general you have left, the man who won Rodeo del Medio, and he goes two days before the battle.\n\nHe does not go out of fear. He goes because for weeks he has been receiving orders that contradict one another and arrive when they are no longer of use, and because he will not command a battle he cannot direct.\n\nThe army is left to you, and you have not led a field action in twenty years."
 gg_argentina.40.f:0 "Two days before, and in writing."
 gg_argentina.40.a:0 "Let him go."
 gg_argentina.41.t:0 "The Hour of Caseros"
 gg_argentina.41.d:0 "The Ejército Grande is a few leagues away: men from Entre Ríos and Corrientes, Uruguayans of the Defensa and Brazilians, all under the man you yourself called, sixteen years ago, \"that chief will be your ruin\".\n\nThere is no delegated authority left to invoke and no congress left to promise. Only the army, the battlefield and the hours before dawn remain.\n\nThree courses lie before you, and posterity will spend a century arguing over which you should have taken."
 gg_argentina.41.f:0 "3 February 1852."
 gg_argentina.41.a:0 "Give battle where they find us."
 gg_argentina.41.b:0 "Manoeuvre and choose the ground ourselves."
 gg_argentina.41.c:0 "Fall back on Buenos Aires and hold the city."
 gg_argentina.50.t:0 "A Mandate Restored"
 gg_argentina.50.d:0 "Buenos Aires has been given back the conduct of foreign relations.\n\nA mandate that had been withdrawn is in force once more. This concerns one province's return, not the reunification of them all.\n\nThe restoration has already been entered in the Pact."
 gg_argentina.50.f:0 "Buenos Aires receives the mandate once more."
 gg_argentina.50.a:0 "Record the restoration."
 gg_argentina.51.t:0 "Corrientes: Mandate Restored"
 gg_argentina.51.d:0 "#b Corrientes#! has returned to the authority of Buenos Aires as a subject country.\n\nThis is no annexation: it keeps its own government, and the conduct of its foreign relations has been restored to Buenos Aires.\n\nThe Pact records the return. The other provinces' mandates stand as they were."
 gg_argentina.52.t:0 "Corrientes: Mandate Restored"
 gg_argentina.52.d:0 "#b Corrientes#! has been reincorporated into the territory governed from Buenos Aires.\n\nWith its separate state gone and the provinces that had withdrawn their mandates recovered, the conduct of their foreign relations is entered in the Pact once more.\n\nThe Pact records the return. The other provinces' mandates stand as they were."
 gg_argentina.53.t:0 "The Coalition of the North Dissolved"
 gg_argentina.53.d:0 "#b The Coalition of the North#! is no more. Beaten in the field, the league has broken up into the provinces that formed it, and each once again entrusts its foreign relations to Buenos Aires, under a governor of Buenos Aires’s choosing.\n\nThis is no annexation: every province keeps its legislature and its name.\n\nThe Pact records the return. The other provinces’ mandates stand as they were."
 gg_argentina.54.t:0 "The Northern Coalition: Mandate Restored"
 gg_argentina.54.d:0 "#b The Northern Coalition#! has been reincorporated into the territory governed from Buenos Aires.\n\nWith its separate state gone and the provinces that had withdrawn their mandates recovered, the conduct of their foreign relations is entered in the Pact once more.\n\nThe Pact records the return. The other provinces' mandates stand as they were."
 gg_argentina.55.t:0 "Entre Ríos: Mandate Restored"
 gg_argentina.55.d:0 "#b Entre Ríos#! has returned to the authority of Buenos Aires as a subject country.\n\nThis is no annexation: it keeps its own government, and the conduct of its foreign relations has been restored to Buenos Aires.\n\nThe Pact records the return. The other provinces' mandates stand as they were."
 gg_argentina.56.t:0 "Entre Ríos: Mandate Restored"
 gg_argentina.56.d:0 "#b Entre Ríos#! has been reincorporated into the territory governed from Buenos Aires.\n\nWith its separate state gone and the provinces that had withdrawn their mandates recovered, the conduct of their foreign relations is entered in the Pact once more.\n\nThe Pact records the return. The other provinces' mandates stand as they were."
 gg_argentina.5.t:0 "The Pact of the League of the North"
 gg_argentina.5.d:0 "The Congress of Delegates has been sitting in Tucumán since #b 22 August#!, and on the twenty-fourth of September it signed what it had assembled to sign: a defensive and offensive alliance of #V five#! provinces — Tucumán, Salta, Jujuy, Catamarca and La Rioja — sworn to give the Republic a constitution and to wage war against you until it has one.\n\nIt has also chosen a leader. #b Tomás Brizuela#!, governor of La Rioja, is Director of the League, with its ‘general affairs’ in his hands and the power of #b making war, concluding peace and negotiating loans ‘within or outside the Republic’#!, as well as concluding treaties — though these remain subject to ratification by each province.\n\nThey did not choose him for his learning. He commands the Coalition's largest and best-armed force and its most distinguished officers, and he holds the mountain passes into Chile, from which they expect what they cannot produce themselves. Lawyers drafted the pronunciamiento; from today, a soldier answers for it."
 gg_argentina.5.f:0 "‘To make war, to sign peace, to negotiate loans.’"
 gg_argentina.5.a:0 "A league with one man at its head."
 gg_argentina.6.t:0 "Caá Guazú"
 gg_argentina.6.d:0 "#b Pascual Echagüe#! entered Corrientes with some #V five thousand#! men and has come back with nothing. #b José María Paz#! waited for him at Caá Guazú with #V three thousand#!, held him with the foot and closed with the horse, and the army of Entre Ríos ceased to exist in an afternoon: #N eight hundred#! dead and #N a thousand#! prisoners, against #V fifty-three#! Correntine dead.\n\nThe field matters less than the arithmetic, and the arithmetic is the worst dispatch you have had from the interior. Corrientes is again a province in arms, with an army that won and a general who knows how to keep one — the same #b Paz#! who was eight years a prisoner and got out to command again.\n\nThere is one name that is not in the order of battle, and it will cost you more than the thousand prisoners: Echagüe did not take #b Justo José de Urquiza#! with him, and Urquiza will not be long in occupying the chair Echagüe is coming back to."
 gg_argentina.6.f:0 "Fifty-three men, against eighteen hundred."
 gg_argentina.6.a:0 "Then Echagüe is finished."
 gg_argentina.7.t:0 "Paso de los Libres"
 gg_argentina.7.d:0 "The #b Madariaga#! brothers did not come to restore anybody. After Arroyo Grande they refused to bring up their squadrons to save #b Pedro Ferré#!, went back to their estancia, and let four months go by.\n\nOn the first of April they crossed the Uruguay from Brazilian ground, at a ford they christened #b Paso de los Libres#!, and in #V thirteen#! days they were in the city. What they have established there belongs to them alone: a Unitarian party of their own making and the confiscation of the property of #b every Federal#! in the province — Lavalle's method, and, it will be said, yours as well.\n\n#b Joaquín#! governs and #b Juan#! commands, and that division of labour is why they will endure. Corrientes stands again upon the river's very flank, in the same month that your army reaches Montevideo on the opposite bank."
 gg_argentina.7.f:0 "Thirteen days from the ford to the city."
 gg_argentina.7.a:0 "The province is theirs again."
 gg_arg_division_rioja:0 "Division of La Rioja"
 gg_arg_ejercito_caa_guazu:0 "Army of Caá Guazú"
 gg_arg_ejercito_libertador:0 "Liberating Army of Corrientes"
 gg_argentina.61.t:0 "The Formal Demand from Corrientes"
 gg_argentina.61.d:0 "Since #V 1830#!, #b Pedro Ferré#! has pressed the same programme for Corrientes: license other ports and open the #b Paraná#! and #b Uruguay#! rivers to navigation. He does not ask that the Confederation be surrendered to the Unitarians; he asks that a federal province be able to export its produce without passing through a single gate.\n\nThe Customs Law of #b 18 December 1835#! gave him protection against European manufactures. It did not give him the ports or the rivers, the two parts of his programme that would divert trade from Buenos Aires and diminish its customs revenue.\n\nThe formal petition is once more upon this desk. Buenos Aires may preserve its single gateway and the revenue it brings, but Corrientes will add another refusal to its grievances; or the system may be opened now, at the cost of surrendering that monopoly."
 gg_argentina.61.f:0 "Federal, fluvial, and written in Corrientes."
 gg_argentina.61.a:0 "The Confederation will have one gate."
 gg_argentina.61.b:0 "License the ports and open the rivers."
 gg_argentina.62.t:0 "The Customs Revenue"
 gg_argentina.62.d:0 "#b Ferré's#! second claim concerns not the channel but the treasury: Corrientes demands a share of the Buenos Aires customs revenue. So long as every cargo must pass through this port, the province argues, the proceeds cannot belong to Buenos Aires alone.\n\nThe reply from Buenos Aires is also in writing. Buenos Aires bears the national debt, the defence of the coasts and the expense of the consulates; dividing the revenue means dividing the resources that meet those obligations. It was over this question and the ports that #b Ferré#! withdrew from the debate of #V 1830-1831#!.\n\nBuenos Aires may keep the revenue and add another refusal to the record, or share it. Sharing costs money now and reduces for years what the government can draw from the provinces it administers."
 gg_argentina.62.f:0 "One customs house, and more than one claimant to its revenue."
 gg_argentina.62.a:0 "Buenos Aires pays; Buenos Aires collects."
 gg_argentina.62.b:0 "Share the customs revenue."
 gg_argentina.63.t:0 "The River under Blockade"
 gg_argentina.63.d:0 "Rear Admiral #b Louis Leblanc#! has closed the port. The French ultimatum demanded exemption of its subjects from military service, indemnities and most-favoured-nation treatment; when the deadline passed, the squadron began the blockade on #b 28 March 1838#!.\n\nThe order is directed at Buenos Aires, but the strangulation reaches upriver. The hides and yerba of Corrientes need an outlet, and the province that has long disputed ports, navigation and customs finds that even the contested channel no longer leads to the sea.\n\nThe treasury can advance relief to sustain that river trade while the blockade lasts. If the customs house keeps every peso for the resistance to France, the Correntine economy will bear the blockade directly."
 gg_argentina.63.f:0 "The squadron is at the mouth; the account runs upriver."
 gg_argentina.63.a:0 "The customs house must sustain resistance."
 gg_argentina.63.b:0 "Relieve Correntine commerce."
 gg_argentina.64.t:0 "Corrientes Stays"
 gg_argentina.64.d:0 "No declaration of war has arrived from Corrientes. The licensed ports and free navigation gave the province an outlet of its own; the shared revenue gave it a stake in the income it had contested for years.\n\nThe French blockade still weighs upon the commerce of the Litoral, but it can no longer be offered as final proof that Buenos Aires closes the river and keeps all its proceeds. Corrientes received an answer to its demands before disagreement became rupture.\n\nThe province remains within the Confederation. So do the money spent, the revenue surrendered and the limit this government accepted upon its customs monopoly."
 gg_argentina.64.f:0 "There was no rupture because there was an answer."
 gg_argentina.64.a:0 "Keep the settlement and pay its price."
 gg_argentina.65.t:0 "The Murder of Heredia"
 gg_argentina.65.d:0 "The dispatch from the north confirms the murder of #b Alejandro Heredia#!. During the war against the Peru-Bolivian Confederation he had been #b Protector of Salta, Jujuy, Catamarca and Tucumán#!; with him disappears the man around whom regional power had been ordered.\n\nAfter his death, government in those provinces passes to liberal groups. There is no need to call them all Unitarians to understand the change: the hands receiving papers from Buenos Aires are no longer those that received them under #b Heredia#!.\n\nBuenos Aires may withhold recognition from the new authorities and demand that the former order continue, or admit the provincial governments that have taken its place. The first dispatch sent to them will decide whether the relationship begins with repudiation or concession."
 gg_argentina.65.f:0 "One murder, and new hands receiving the dispatches from the north."
 gg_argentina.65.a:0 "Do not recognise the new authorities."
 gg_argentina.65.b:0 "Recognise the provincial governments."
 gg_argentina.66.t:0 "Lamadrid to Tucumán"
 gg_argentina.66.d:0 "#b Gregorio Aráoz de Lamadrid#! can depart for Tucumán with #V fifty#! grenadiers. The dispatch he will carry already settles what shall be done with the arms of the army that fought in Bolivia; it remains to decide whether Buenos Aires puts a general and an escort behind that resolution.\n\nIt is a small commission in men and a great one in trust. The north has been in liberal hands since #b Heredia's#! death, and #b Lamadrid#! knows that country, its officers and its grievances better than any envoy who might replace him.\n\nSending him asserts Buenos Aires's intervention in northern command, but also leaves him before those preparing the rising. Keeping him preserves the general in Buenos Aires and leaves the provincial authorities to carry out what has already been decided."
 gg_argentina.66.f:0 "#V Fifty#! grenadiers and a general who must be trusted."
 gg_argentina.66.a:0 "Send him to demand the arms."
 gg_argentina.66.b:0 "Keep Lamadrid here; do not risk that command."
 gg_argentina.67.t:0 "Two Orders for Urquiza"
 gg_argentina.67.d:0 "The dispatch for #b Justo José de Urquiza#! gives him command of the army that must face Brazil. The same packet contains another order: cut the trade between Entre Ríos and Montevideo, tolerated for years although Buenos Aires regards it as contraband.\n\nThe two instructions cannot be reconciled without cost. He is asked to organise the war while the commerce sustaining his province's economy is closed; he is given the Confederation's greatest military responsibility and deprived of the material means with which to discharge it.\n\nThey travel with #b Rosas's#! annual offer to relinquish the conduct of foreign relations. Each year the provinces refuse it, reaffirming the authority entrusted to him; this time Entre Ríos will receive, all at once, a ceremony expected to remain a ritual and two orders that test its obedience."
 gg_argentina.67.f:0 "The command on one sheet; the order to close the trade on the next."
 gg_argentina.67.a:0 "Give him the command and close the trade."
 gg_argentina.67.b:0 "Give him the command and tolerate the trade."
 gg_argentina.67.c:0 "Close the trade and give the command to another."
 gg_urquiza_orders_both_tt:0 "@warning! The grievances of #b Entre Ríos#! are now on the table. A #P field army#! forms there under Urquiza and Buenos Aires improves its readiness; if both governments still stand, the Defensa loses #N 20,000#! from its treasury and the Cerrito receives #P 10,000#!. Enforcing the trade restrictions costs revenue."
 gg_urquiza_command_trade_tt:0 "@information! The grievances of #b Entre Ríos#! are settled and its grant of authority remains in force. A #P field army#! forms under Urquiza and Buenos Aires improves its readiness; if the Defensa still stands, the resumed trade adds #P 20,000#! to its treasury."
 gg_other_general_close_trade_tt:0 "@warning! The grievances of #b Entre Ríos#! are now on the table. The army against Brazil forms in Buenos Aires under #b another general#!, so Urquiza gathers less force of his own; if both governments still stand, the Defensa loses #N 20,000#! and the Cerrito receives #P 10,000#!."
 gg_argentina.9.t:0 "La Regeneración"
 gg_argentina.9.d:0 "#b La Regeneración#! has published #b Terrada's#! article. #b Justo José de Urquiza's#! answer is already on the table: freedom of the press is respected in Entre Ríos.\n\nThis is not yet a withdrawal of the delegation or a declaration of war. It is a provincial reply to the governor who conducts foreign relations and who, one month ago, joined command against Brazil to the pursuit of Entre Ríos commerce.\n\nThe answer may be allowed to pass, the commercial pressure feeding the conflict may be withdrawn, or obedience over the newspaper may be demanded. That last demand would be a new decision by Buenos Aires, not a historical order found in the documentation."
 gg_argentina.9.f:0 "An Entre Ríos printing press answers Buenos Aires."
 gg_argentina.9.a:0 "Let Urquiza's reply stand."
 gg_argentina.9.b:0 "Demand that he muzzle the newspaper."
 gg_argentina.9.c:0 "Withdraw the commercial orders."
 gg_regeneracion_pass_tt:0 "@information! The existing arrangement remains: the grievances of Entre Ríos, its trade and the military command settled in December do not change. Urquiza comes out stronger for having answered without being corrected."
 gg_regeneracion_submit_tt:0 "@warning! This #V counterfactual#! demand places the grievances of #b Entre Ríos#! on the table and raises an additional #P provincial reserve#! under Urquiza."
 gg_regeneracion_withdraw_tt:0 "@information! The grievances of #b Entre Ríos#! are settled and the trade restrictions end; if the Defensa still stands, it receives #P 20,000#! from the resumed traffic. Any military command already granted remains."
 gg_arg_ejercito_brasil_urquiza:0 "Army against Brazil"
 gg_arg_ejercito_brasil_nacional:0 "National Army against Brazil"
 gg_arg_reserva_entrerriana:0 "Entre Ríos Reserve"
 gg_argentina.68.t:0 "The Armaments of the North"
 gg_argentina.68.d:0 "The army of operations that fought against the Peru-Bolivian Confederation has left its arms in the north. With that campaign over, the provincial governments retain the men and stores gathered under #b Alejandro Heredia's#! command.\n\nBuenos Aires may demand their return to the authority of the Confederation. That was the claim with which #b Rosas#! historically sent #b Gregorio Aráoz de Lamadrid#! towards Tucumán in March #V 1840#!.\n\nThe other signature leaves the armaments where they stand and recognises that the provinces administer what their army assembled. The Confederation loses available strength, but the north does not receive an order to surrender them as the first answer to its new governments."
 gg_argentina.68.f:0 "The arms remained where the campaign ended; authority over them is still disputed."
 gg_argentina.68.a:0 "Demand the armaments."
 gg_argentina.68.b:0 "Leave them in provincial hands."
 gg_argentina.69.t:0 "The Treaty of Alcaraz"
 gg_argentina.69.d:0 "In August #V 1846#!, #b Justo José de Urquiza#! and #b Madariaga#! signed peace between Entre Ríos and Corrientes. The agreement reincorporates Corrientes into the Confederation and provides for a constituent congress.\n\nThe treaty also excuses Corrientes from fighting in Uruguay. #b Urquiza#! has negotiated on his own account a peace touching foreign war and the organisation of the Confederation, matters conducted by Buenos Aires through the provinces' delegation.\n\nAmendments may be demanded and the agreement returned to #b Madariaga#!, as happened historically, or the Entre Ríos signature may be allowed to stand. Accepting it preserves the agreed peace, but recognises today the provincial authority that Entre Ríos will invoke again tomorrow."
 gg_argentina.69.f:0 "The peace comes signed from Alcaraz; Buenos Aires decides whether to send it back."
 gg_argentina.69.a:0 "Demand amendments to the treaty."
 gg_argentina.69.b:0 "Let the peace of Alcaraz stand."
 gg_alcaraz_amendments_tt:0 "@warning! The war with #b Corrientes#! continues or resumes under the #b Federal Pact#!, while the grievances of #b Entre Ríos#! remain unanswered. A military resolution remains possible."
 gg_alcaraz_accept_tt:0 "@information! The war with #b Corrientes#! ends; it becomes a #P protectorate#! and delegates foreign relations again. Corrientes is exempted from supplying troops to the Cerrito and a route to a #V constituent congress#! opens."
 gg_argentina.8.t:0 "The Corrientes Campaign"
 gg_argentina.8.d:0 "The Treaty of Alcaraz returned from Buenos Aires with amendments, #b Madariaga#! rejected them, and the war continues. The Corrientes front remains open, but the decision of how to sustain it is again before #b Rosas#!.\n\n#b Justo José de Urquiza#! asks for authority over the campaign and for Entre Ríos resources gathered under a formation of his own. He promises no victory: he asks for the army and the front on which to seek it. If he keeps that force, he will also keep an instrument that does not depend entirely on Buenos Aires.\n\nThe other signature puts back on the table the terms Urquiza and Madariaga signed at Alcaraz in #V 1846#!: peace, reincorporation, exemption from service in Uruguay, and a constituent congress."
 gg_argentina.8.f:0 "Authority may go to the front; the earlier terms may return to the table."
 gg_argentina.8.a:0 "Give Urquiza the campaign and its resources."
 gg_argentina.8.b:0 "Reopen the terms of Alcaraz."
 gg_vences_delegate_tt:0 "@warning! A reinforced #P Entre Ríos army#! is formed and mobilised under Urquiza, then sent to the Corrientes front. The battle and the outcome of the war will be decided in the field; Urquiza keeps a stronger military base of his own."
 gg_vences_reopen_alcaraz_tt:0 "@information! The terms of #V Alcaraz of 1846#! return: peace, protectorate status and the restoration of Corrientes's grant of authority, exemption from service in Uruguay, and a route to congress."
 gg_argentina.70.t:0 "No Pronunciamiento in the North"
 gg_argentina.70.d:0 "#b 7 April 1840#! has come without a pronunciamiento from Tucumán. The governments that emerged after #b Heredia's#! death were recognised before disagreement became rupture.\n\nThe arms of the army that fought in Bolivia remained in provincial hands, and #b Lamadrid#! remained in Buenos Aires. Without a demand that the arms be surrendered or a general from Buenos Aires sent to enforce it, the northern provinces retain their governments and continue to entrust their foreign relations to Buenos Aires.\n\nThe Coalition is never born. The concessions that prevented it also remain: less political authority for this government, less force gathered under its command, and a limit the provinces may cite in their next formal petition."
 gg_argentina.70.f:0 "There was no pronunciamiento because all three grievances were answered."
 gg_argentina.70.a:0 "Keep the settlement and pay its price."
 gg_argentina.71.t:0 "The Negotiated Confederation"
 gg_argentina.71.d:0 "#b 1 May 1851#! has come with the constitutional course opened at Alcaraz still available and no unanswered demand from Entre Ríos. Its legislature refuses #b Rosas's#! annual offer to relinquish the conduct of foreign relations: the mandate remains with Buenos Aires.\n\nThe peace of Alcaraz was allowed to stand five years ago, Corrientes once more entrusted its foreign relations to Buenos Aires, and the call for a constituent congress survived the orders that followed. The Confederation no longer rests solely upon each province rejecting a ritual resignation.\n\nThere is no Pronunciamiento and no army of Entre Ríos marching against Buenos Aires. The conclusion is a different one: a #P negotiated confederation#!, born of the concessions that preserved the Pact and of a congress Buenos Aires agreed to convene."
 gg_argentina.71.f:0 "The mandate remains; constitutional order is no longer a promise deferred."
 gg_argentina.71.a:0 "Write the Confederation's compact."
 gg_confederacion_negociada_tt:0 "@information! The grievances of Entre Ríos are settled and the constitutional arrangement is recorded as a #P negotiated confederation#!."
 gg_argentina.60.t:0 "Oribe in Buenos Aires"
 gg_argentina.60.d:0 "#b Manuel Oribe#! has landed. Five days ago, with the French squadron off the Cerro and the Uruguayan flotilla disarmed, he signed an instrument at the Villa de la Unión which the Montevideo newspapers call a resignation. He does not. He says a foreign fleet and a rebel in arms compelled his signature, and that an act extorted by force can bind nobody — least of all the man who signed it.\n\nThe man standing in the port is therefore either an exile seeking asylum or the #b lawful president of the República Oriental#!; which of the two he is depends entirely upon what this government declares him to be. Rivera already governs in Montevideo. France and Britain will deal with whoever controls the customs house.\n\nHe is also a soldier, and this government faces a war for which it has no general. He commanded against the Farrapos, held the countryside for three years, and brought with him the officers who followed him out of Montevideo. Whatever is decided about his title, the man is worth an army."
 gg_argentina.60.f:0 "The instrument says he ‘resigned’. He says he did no such thing."
 gg_argentina.60.a:0 "He is the president, and he will be received as one."
 gg_argentina.60.b:0 "Give him a command and say nothing of the presidency."
 gg_argentina.22.t:0 "The River Closed"
 gg_argentina.22.d:0 "The minister lays the report on the table: the British and French squadrons have closed #b every port of the Confederation and Uruguay#! except #P Montevideo#!. #b Brown's#! squadron was seized without a prior declaration of war.\n\nThe closure does not stop trade: it diverts it. Cargoes that no longer pass through Buenos Aires enrich #P Montevideo#! and the #b Entre Ríos littoral#!. Every day of blockade feeds that diversion.\n\n‘The river can be closed with men and guns,’ the minister concludes. ‘It can also be opened by concession, or defended lightly while the Foreign Ministry seeks an agreement. But we cannot spend the same guns on the Paraná, at the siege, and in the interior.’"
 gg_argentina.22.f:0 "One open customs house is enough to change the course of every cargo."
 gg_argentina.22.a:0 "#b Close and fortify the Paraná.#!"
 gg_argentina.22.b:0 "#b Accept foreign navigation.#!"
 gg_argentina.22.c:0 "#b Negotiate and limit the defences.#!"
 gg_argentina.23.t:0 "After the Chains"
 gg_argentina.23.d:0 "The report from #b Obligado#! permits no tactical consolation. A fleet of #V 22 warships#! and #V 92 merchantmen#! broke the chains and #N passed#!. #b Mansilla#! was gravely wounded; #b Thorne#! left nearly deaf.\n\nThe War Minister points upriver. The commercial expedition has passed, but the business meant to justify it is already failing. The batteries can still follow it from the bank, provided that their gunners and infantry remain unavailable to every other front.\n\nThe alternative is to turn the resistance into a negotiating position. Part of the column would return to the army; the fixed guns would remain behind. Nothing signed now changes what happened at the bend."
 gg_argentina.23.f:0 "The chains are broken. The decision begins upriver."
 gg_argentina.23.a:0 "#b Continue the resistance upriver.#!"
 gg_argentina.23.b:0 "#b Turn the defence into diplomatic leverage.#!"
 gg_argentina.24.t:0 "The Convoy Returns by Quebracho"
 gg_argentina.24.d:0 "The convoy returns through the #b Angostura del Quebracho#! with its commercial failure already written in its holds. The batteries open fire and the fleet loses #N six merchantmen#!. On the Argentine side, #N one man is killed#!.\n\n‘This was the last blow we could strike against that expedition,’ the minister reports. The guns and men remain there, still separated from the rest of the army. Keeping them on the Paraná materially sustains the demand that the powers recognise who commands the river.\n\nPart of them can also be withdrawn. The mobile column can march towards the littoral or the Paraguayan front; the fixed battery stays at its post, but Buenos Aires comes to the table with less force behind its claim."
 gg_argentina.24.f:0 "Fewer merchantmen return than sailed upriver."
 gg_argentina.24.a:0 "#b Keep the batteries until recognition.#!"
 gg_argentina.24.b:0 "#b Send the column to the Corrientes front.#!"
 gg_argentina.24.c:0 "#b Send the column to the Paraguayan front.#!"
 gg_argentina.25.t:0 "The Hood Bases, from Buenos Aires"
 gg_argentina.25.d:0 "#b Thomas Samuel Hood#! brings a common basis from the two powers. The paper offers to recognise #P Argentine sovereignty over the Paraná#!, return #b Martín García#! and the captured ships, disarm the foreigners in Montevideo, and abandon the city if the Defensa rejects the settlement.\n\nThe minister promises no peace that does not yet exist. Acceptance in Buenos Aires only carries the answer to the Cerrito and places the terms before the Defensa; Montevideo retains its own decision. Nothing in this signature by itself lifts the blockade or ends the war.\n\nRejecting the bases keeps the Argentine demand outside this paper and leaves operations open. This is a decision about which road is offered, not about an outcome that still belongs to the other bank."
 gg_argentina.25.f:0 "The same sheet must cross two banks before it can be called an agreement."
 gg_argentina.25.a:0 "#b Accept the bases and send them to the Cerrito.#!"
 gg_argentina.25.b:0 "#b Continue until another settlement is obtained.#!"
# EN: The quoted third clause below is a careful English translation of the Spanish original.
# ES: La clausula tercera citada abajo es una traduccion cuidada al ingles del original espanol.
 gg_argentina.26.t:0 "The Liberator's Sabre"
 gg_argentina.26.d:0 "The dispatch from Paris reports #b José de San Martín's#! death at Boulogne-sur-Mer on #V 17 August#! and transcribes the copy of his testament that #b Mariano Balcarce#! made on #V 28 September#! and deposited in the Legation archive. The original is holographic: San Martín wrote it in Paris on #V 23 January 1844#! in his own hand, before the notary #b François Huillier#! and accompanied by Balcarce.\n\nIts third clause reads: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe complete document does not end there. It forbids any funeral and asks to be taken directly to the cemetery without attendance, yet wishes his heart to be deposited in that of #b Buenos Aires#!; it declares, #V ‘I do not owe, nor have I ever owed, anything to anyone.’#! And he signs as #b ‘Generalissimo of the Republic of Peru and founder of its liberty, Captain General of that of Chile and Brigadier General of the Argentine Confederation’#!. The whole man may be published, the political weapon may be excerpted, or the paper may be received in silence."
 gg_argentina.26.f:0 "One clause for the government; one testament for the country."
 gg_argentina.26.a:0 "#b Publish it whole and declare mourning.#!"
 gg_argentina.26.b:0 "#b Print only the third clause.#!"
 gg_argentina.26.c:0 "#b Receive it without a public act.#!"
 gg_argentina.27.t:0 "The Liberator's Clause"
 gg_argentina.27.d_full:0 "#b Buenos Aires#! has published #b José de San Martín's#! testament in full and declared mourning. From Paris, Montevideo too receives the clause that matters to the government: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe opposition to #b Rosas#! is already disputing the document's authenticity and even San Martín's mental capacity when he wrote it. That is a weapon, but one with a price: challenging the testament of the man who liberated half a continent.\n\nThere is another answer. San Martín and Rosas corresponded, but those letters do not turn praise for firmness against foreign aggression into support for the governor's domestic politics. The Defensa may honour the Liberator and deny that the clause absolves the government."
 gg_argentina.27.d_clause:0 "#b Buenos Aires#! has printed only the third clause of #b José de San Martín's#! testament: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe excerpt makes the piece sharper and the answer easier. The opposition to #b Rosas#! is already disputing the document's authenticity and even San Martín's mental capacity when he wrote it. That is a weapon, but one with a price: challenging the testament of the man who liberated half a continent.\n\nThere is another answer. San Martín and Rosas corresponded, but those letters do not turn praise for firmness against foreign aggression into support for the governor's domestic politics. The Defensa may honour the Liberator and deny that the clause absolves the government."
 gg_argentina.27.d_private:0 "#b Buenos Aires#! has held no public act, but the report from Paris carries the third clause of #b José de San Martín's#! testament: #V ‘The sabre which has accompanied me throughout the war for the independence of South America shall be delivered to the General of the Argentine Republic, Don Juan Manuel de Rosas, as proof of the satisfaction which, as an Argentine, I have felt on seeing the firmness with which he has upheld the honour of the Republic against the unjust pretensions of the foreigners who sought to humiliate it.’#!\n\nThe opposition to #b Rosas#! disputes the document's authenticity and even San Martín's mental capacity when he wrote it. That is a weapon, but one with a price: challenging the testament of the man who liberated half a continent.\n\nThere is another answer. San Martín and Rosas corresponded, but those letters do not turn praise for firmness against foreign aggression into support for the governor's domestic politics. The Defensa may honour the Liberator and deny that the clause absolves the government."
 gg_argentina.27.f:0 "Firmness against the foreigner does not decide who governs at home."
 gg_argentina.27.a:0 "#b Deny the testament's authenticity.#!"
 gg_argentina.27.b:0 "#b Honour San Martín without absolving Rosas.#!"
 gg_oribe_pretension:0 "Oribe’s Presidency Upheld"
 gg_oribe_recognised_tt:0 "@battalions! By upholding #b Oribe#! as president, Buenos Aires may lend the Vanguard as a government's army: it will retain up to #P +1#! infantry battalion and #P +1#! cavalry battalion compared with receiving him as a general alone."
 gg_oribe_unrecognised_tt:0 "@battalions! If #b Oribe#! is received only as a general, the Vanguard Buenos Aires may lend will muster up to #N -1#! infantry battalion and #N -1#! cavalry battalion, with a minimum of #V 1#! of each arm."
 gg_vanguardia_cruce_total_tt:0 "@battalions! The Vanguard will cross with all available strength. The littoral will be left #N without a reserve#!: the cavalry raised there will muster #N +2#! squadrons."
 gg_vanguardia_reserva_litoral_tt:0 "@battalions! The Vanguard will cross with #N -1#! infantry battalion and #N -1#! cavalry squadron. Those same units will form Argentina's own #P division#!."
 gg_vanguardia_held_tt:0 "@battalions! The Vanguard #N does not cross#!: Buenos Aires's army stays in the interior while provinces are risen against the Pact."
 gg_vanguardia_awaits_tt:0 "@battalions! The Ejército Unido de Vanguardia will cross once Buenos Aires decides what force it sends across the river."
 gg_vanguardia_cruce_postergado_tt:0 "@battalions! The Vanguard will retain all available strength, but its crossing will be delayed by #N six months#!. Any cavalry the littoral can raise will muster #N -2#! squadrons."
 gg_urquiza_double_order_tt:0 "@warning! Command of the army against Brazil travels with the order to cut off Entre Ríos's trade. If the province withdraws the mandate from Buenos Aires, #b Urquiza's#! troops will march prepared for #V 2 years#!: #P +10%#! offence and #P +10%#! defence."
 gg_lamadrid_sent_tt:0 "@warning! #b Lamadrid#! carries the demand for the armaments north with #V 50#! grenadiers; if the provinces withdraw the mandate from Buenos Aires, he and those officers may enter their service."
 gg_norte_refusal_tt:0 "@warning! This formal petition goes unanswered. If even #N 1#! of the #V 3#! grievances remains, the northern legislatures will have common cause to withdraw the mandate from Buenos Aires."
 gg_norte_concession_tt:0 "Buenos Aires answers this formal petition favourably. Only if all #V 3#! grievances are redressed will the north be left without common cause to withdraw the mandate."
 gg_entre_rios_refusal_tt:0 "@warning! Buenos Aires returns this formal petition without agreement. While even #N 1#! of the #V 2#! grievances remains, Entre Ríos may accept Rosas's next resignation and reassume the authority entrusted to him."
 gg_entre_rios_concession_tt:0 "Buenos Aires yields to this formal petition. With the #V 2#! grievances redressed, Rosas's next resignation will again be refused and the mandate will remain in his hands."
 gg_argentina.80.t:0 "The Provinces Held in Trust"
 gg_argentina.80.d:0 "The Federal Pact is settled, and what it leaves behind reaches the interior at once: the provinces this government defeated and left under federal governors have no one else to whom they may turn.\n\nThey were never annexed. Each retained its legislature, its revenues and its name, and each conducted its foreign relations through Buenos Aires because force gave it no choice — precisely what the Federal Pact had required, obtained by other means.\n\nThe distinction has now outlived its usefulness. Authority once held in trust becomes territory held outright, and the map ceases to record that these provinces were ever asked."
 gg_argentina.80.f:0 "What was held in trust is now simply held."
 gg_argentina.80.a:0 "Let them be incorporated."
 gg_argentina.13.t:0 "The Montevideo Trap"
 gg_argentina.13.d:0 "The Convention lies upon the table. #b Brazil#!, the #b República Oriental#! and #b Entre Ríos#! bind themselves to expel Oribe and the Argentine forces under his command from Uruguayan territory. Article V permits the Empire to protect persons and property up to #N twenty leagues#! within Uruguay; article XVIII opens navigation upon the riparian stretch of the Paraná; article XIX places #b Eugenio Garzón#! at the head of the Uruguayan army.\n\nThe clause concerning this bank is the fifteenth. If Buenos Aires declares war in support of Oribe, the three allies will make common cause against it. The Brazilian price is written down; so too is the threshold Rosas must decide whether to cross.\n\nEntre Ríos may sign and bring allies into the war in Uruguay, or continue its war against Buenos Aires without them."
 gg_argentina.13.f:0 "Twenty leagues as the price; one clause facing Buenos Aires."
 gg_argentina.13.a:0 "Sign the Convention and pay the price."
 gg_argentina.13.b:0 "Fight without this alliance."
 gg_montevideo_convention_sign_tt:0 "@battalions! #b Entre Ríos#! and #b Brazil#! enter the war in Uruguay alongside the Defensa; Brazilian and Uruguayan advance contingents appear, the Paraná is #P open#!, and the Cerrito loses #N 20#! war support. Imperial protection extends #N twenty leagues#! into Uruguay."
 gg_montevideo_convention_refuse_tt:0 "@warning! Entre Ríos keeps its war with Buenos Aires, but #N gives up#! the contingents, navigation and military intervention of Brazil and Uruguay."
 gg_argentina.14.t:0 "The Clause Against Buenos Aires"
 gg_argentina.14.d:0 "Entre Ríos has signed. Brazil and the government in Montevideo are already at war in Uruguay, and the Cerrito feels the pressure of troops that were not there yesterday. The Convention does not yet compel the allies to march against Buenos Aires: article XV awaits a declaration from this government.\n\nAbandoning #b Oribe#! withdraws the Argentine forces from the arrangement that sustained him. His army loses the political and material basis of resistance, and the war in Uruguay closes around him. It also ends the wider war threatened by the Pronunciamiento.\n\nA declaration of war does the opposite. It sustains Oribe and, by the very terms of the instrument, turns the alliance in Uruguay into common cause against Buenos Aires."
 gg_argentina.14.f:0 "The clause does not activate itself. It awaits a declaration."
 gg_argentina.14.a:0 "Abandon Oribe and avoid the general war."
 gg_argentina.14.b:0 "Declare war to sustain Oribe."
 gg_rosas_abandon_oribe_tt:0 "@information! The Cerrito army receives #N -35%#! offence and defence and #N -50%#! morale recovery while it dissolves; its support in the war in Uruguay and Buenos Aires's support against Entre Ríos are exhausted. The Ejército Grande is #b not#! created."
 gg_rosas_declare_alliance_tt:0 "@warning! The clause against Buenos Aires comes into force: #b Brazil#! and the #b República Oriental#! enter the war on the side of Entre Ríos. The contingents to be sent will be decided in a separate agreement."
 gg_argentina.15.t:0 "The Price of the Ejército Grande"
 gg_argentina.15.d:0 "The second Convention turns an alliance into an army. #b Urquiza#! will cross the Paraná as generalissimo with #V 18,000 men#!. Brazil supplies #V 3,000 soldiers and its fleet#!; Uruguay, #V 2,500#!.\n\nThe movement is paid for by an imperial loan of #V 100,000 patacones monthly for four months#!. It is not a subsidy: it bears #N 6% annual interest#!. Urquiza undertakes to obtain recognition of the debt by the government succeeding Rosas. If he does not, Entre Ríos and Corrientes remain liable, and from this moment mortgage #N their revenues and public lands#!.\n\nThe terms may be accepted in full, the foreign contribution counterfactually reduced to an initial tranche, or the army formed from Entre Ríos and Corrientes forces without loan or mortgage. The crossing does not exist until one of these signatures creates it."
 gg_argentina.15.f:0 "Eighteen thousand men; four bills; two provinces mortgaged."
 gg_argentina.15.a:0 "Accept the loan and the full mortgage."
 gg_argentina.15.b:0 "Limit the foreign contribution."
 gg_argentina.15.c:0 "March with Entre Ríos and Corrientes."
 gg_ejercito_grande_full_tt:0 "@battalions! An army of #P 18 battalions#! forms under Urquiza; the contingents reach the documented #V 3,000 Brazilians#! and #V 2,500 Uruguayans#!, and the imperial fleet appears. @money! Entre Ríos receives #P 400,000 patacones#! and, with Corrientes, mortgages revenues and public lands at #N 6%#!; the debt survives the war."
 gg_ejercito_grande_limited_tt:0 "@battalions! An army of #P 18 battalions#! forms under Urquiza and a reduced foreign contribution marches. @money! Entre Ríos takes one instalment of #P 100,000 patacones#!; Entre Ríos and Corrientes bear a smaller mortgage at #N 6%#! that survives the war. This scale is a design counterfactual."
 gg_ejercito_grande_alone_tt:0 "@battalions! An army of #P 18 battalions#! forms under Urquiza, supported by Entre Ríos and the existing Corrientes army. #P No#! loan is taken, no revenues or lands are mortgaged, and no foreign contingent marches with it."
 gg_arg_ejercito_grande:0 "Ejército Grande"
 gg_arg_oriental_advance_contingent:0 "Uruguayan Vanguard"
 gg_arg_brazilian_advance_contingent:0 "Imperial Vanguard"
 gg_arg_brazilian_grand_army_contingent:0 "Brazilian Division of the Ejército Grande"
 gg_arg_oriental_grand_army_contingent:0 "Uruguayan Division of the Ejército Grande"
 gg_arg_brazilian_limited_contingent:0 "Limited Brazilian Contingent"
 gg_arg_oriental_limited_contingent:0 "Limited Uruguayan Contingent"
 gg_arg_brazilian_allied_fleet:0 "Allied Imperial Squadron"
 gg_ejercito_grande_full_mortgage:0 "Mortgage of the Ejército Grande"
 gg_ejercito_grande_limited_mortgage:0 "Limited Mortgage of the Ejército Grande"
 gg_oribe_abandoned_army:0 "The Abandoned Army"
 gg_argentina.41.d_full:0 "The Ejército Grande is a few leagues away: Urquiza's #V 18,000#!, the Brazilian and Uruguayan contingents secured by the loan and mortgage, and the forces of Corrientes. It is commanded by the man you yourself called, sixteen years ago, \"that chief will be your ruin\".\n\nThere is no delegated authority left to invoke and no congress left to promise. Only the army, the battlefield and the hours before dawn remain.\n\nThree courses lie before you, and posterity will spend a century arguing over which you should have taken."
 gg_argentina.41.d_limited:0 "The Ejército Grande is a few leagues away: Urquiza's #V 18,000#!, the forces of Corrientes and the limited Brazilian and Uruguayan contribution that Entre Ríos agreed to finance. It is commanded by the man you yourself called, sixteen years ago, \"that chief will be your ruin\".\n\nThere is no delegated authority left to invoke and no congress left to promise. Only the army, the battlefield and the hours before dawn remain.\n\nThree courses lie before you, and posterity will spend a century arguing over which you should have taken."
 gg_argentina.41.d_alone:0 "The Ejército Grande is a few leagues away: Urquiza's #V 18,000#! and the forces of Corrientes, without foreign contingents or mortgage. It is commanded by the man you yourself called, sixteen years ago, \"that chief will be your ruin\".\n\nThere is no delegated authority left to invoke and no congress left to promise. Only the army, the battlefield and the hours before dawn remain.\n\nThree courses lie before you, and posterity will spend a century arguing over which you should have taken."
