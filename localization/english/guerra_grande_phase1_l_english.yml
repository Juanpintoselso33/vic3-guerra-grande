l_english:

 gg_phase1.9.t:0 "Oribe Goes Anyway"
 gg_phase1.9.d:0 "He refused to sign the resignation and held on a few more months, and it was not enough: with the flotilla disarmed, Martín García in French hands and Rivera master of the countryside, Manuel Oribe leaves the government. What resisting bought is how he leaves."
 gg_phase1.9.f:0 "A resignation in form, not in intent."
 gg_phase1.9.a:0 "Let him leave with his army."
 gg_phase1.9.b:0 "Negotiate the exit, and the amnesty."
 gg_phase1.1.t:0 "War on Rosas"
 gg_phase1.1.d:0 "Rivera is president, the unitarian émigrés ask him to finish what he started, and the governor of Corrientes, Berón de Astrada, offers a treaty against Rosas. France pushes. Declaring war on the Restorer is inviting him across the river."
 gg_phase1.1.f:0 "«Not on the worthy Argentine people, but on the tyrant.»"
 gg_phase1.1.a:0 "War on Rosas."
 gg_phase1.1.b:0 "The treaty with Corrientes, and nothing more."
 gg_phase1.1.c:0 "The Republic does not enter other people's wars."
 gg_phase1.2.t:0 "Echagüe Crosses the Uruguay"
 gg_phase1.2.d:0 "After Pago Largo, Pascual Echagüe and Juan Antonio Lavalleja cross the river at Salto with an army twice ours. Rivera can do what he knows how to do, fall back, cut off their cattle and wait for the Montevideo infantry behind the Santa Lucía, or go and find them now."
 gg_phase1.2.f:0 "A war of horses before a war of battles."
 gg_phase1.2.a:0 "A war of resources, behind the Santa Lucía."
 gg_phase1.2.b:0 "Go and find them now."
 gg_phase1.3.t:0 "Cagancha"
 gg_phase1.3.d:0 "With the infantry and artillery arrived from Montevideo, Rivera leaves the Santa Lucía line and beats Echagüe at Cagancha. The unitarians want more: that he cross into Entre Ríos and carry the war into the Confederation."
 gg_phase1.3.f:0 "29 December 1839."
 gg_phase1.3.a:0 "Cross into Entre Ríos."
 gg_phase1.3.b:0 "The Republic has defended itself. Stay."
 gg_phase1.4.t:0 "Lavalle"
 gg_phase1.4.d:0 "Juan Lavalle, who until now refused to join a war with France in the middle of it, joins the fight against Rosas and needs ships, men and a port. Helping him puts the Republic up to its neck in the Argentine civil war."
 gg_phase1.4.f:0 "They bring their quarrel inside ours."
 gg_phase1.4.a:0 "Ships, men and a port for Lavalle."
 gg_phase1.4.b:0 "Let the unitarians pay for the unitarians' war."
 gg_phase1.5.t:0 "France Leaves"
 gg_phase1.5.d:0 "On 29 October Admiral Mackau and minister Arana sign the peace: France lifts the blockade of Buenos Aires and leaves on their own those who fought Rosas with its help. Another backer must be found before the Restorer notices."
 gg_phase1.5.f:0 "A death blow to the anti-Rosas cause."
 gg_phase1.5.a:0 "Look for Britain."
 gg_phase1.5.b:0 "Lean on the unitarians and Corrientes."
 gg_phase1.5.c:0 "Ask Brazil, even if it charges in border."
 gg_phase1.6.t:0 "News from Famaillá"
 gg_phase1.6.d:0 "Oribe, commanding the Confederation's troops, broke Lavalle at Quebracho Herrado and at Famaillá, and stories come of prisoners with their throats cut. Lavalle died in Jujuy. The Montevideo press has material for a whole campaign."
 gg_phase1.6.f:0 "A name is a weapon too."
 gg_phase1.6.a:0 "Let the press call him by his name: throat-cutter."
 gg_phase1.6.b:0 "Leave the subject alone."
 gg_phase1.7.t:0 "The Greater Uruguay"
 gg_phase1.7.d:0 "José María Paz, Pedro Ferré, Juan Pablo López, Bento Gonçalves and Rivera talk of a new state: Entre Ríos, Corrientes, Santa Fe, Rio Grande and the Banda Oriental. At Paysandú they offer Rivera the supreme command, and Paz, displeased, withdraws."
 gg_phase1.7.f:0 "A country the size of a caudillo's ambition."
 gg_phase1.7.a:0 "Accept the supreme command."
 gg_phase1.7.b:0 "The Republic does not grow on other people's land."
 gg_phase1.8.t:0 "Oribe Defenceless"
 gg_phase1.8.d:0 "News from Buenos Aires arrives through the British minister Mandeville: Oribe is coming back from Jujuy without horses and with few arms, and is in Entre Ríos within reach. Rivera can cross the Uruguay and surprise him, or wait for him on this side."
 gg_phase1.8.f:0 "«If the Pardejón only knew how to take advantage...»"
 gg_phase1.8.a:0 "Cross and surprise him."
 gg_phase1.8.b:0 "Wait for him on the coast."
 gg_phase1_cagancha_lost:0 "Defeat by Echagüe"
