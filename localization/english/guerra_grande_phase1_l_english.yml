l_english:

 gg_phase1.9.t:0 "Oribe Goes Anyway"
 gg_phase1.9.d:0 "We held out longer than anyone expected, and it was not enough. Rivera owns the countryside, the river belongs to others and the capital stands alone.\n\nThe President will not sign a resignation. He will present the Assembly with a ‘resignation’ of another kind and ask for a ‘temporary leave’: twice he avoids the word, so that the record shows he is still the lawful president and leaves under a force beyond his control. In Buenos Aires, Rosas will receive him as constitutional president.\n\nWhat holding out bought is the manner of leaving: with how many men, and with what guarantees for those who stay."
 gg_phase1.9.f:0 "A resignation in form, not in intent."
 gg_phase1.9.a:0 "Leave with those willing to follow him."
 gg_phase1.9.b:0 "Negotiate the departure and an amnesty for those who stay."
 gg_phase1.1.t:0 "War on Rosas"
 gg_phase1.1.d:0 "Oribe left on 29 October aboard a British ship, with three hundred soldiers and followers, and in Buenos Aires Rosas received him as constitutional president. Now he offers him command of the Confederation's armies.\n\nOn this side, the unitarian exiles urge Rivera to finish what he started, and the governor of Corrientes, Genaro Berón de Astrada, offers a treaty against Rosas: Corrientes has ports on the Paraná and wants to trade with European ships without going through Buenos Aires. France, blockading Buenos Aires since last year, pushes the same way. Lavalle, however, still wants nothing to do with a war waged arm in arm with the French.\n\nTo declare war on the Restorer is to invite him across the river."
 gg_phase1.1.f:0 "‘Not on the worthy Argentine people, but on the tyrant of the immortal people of South America.’"
 gg_phase1.1.a:0 "War on Rosas."
 gg_phase1.1.b:0 "The treaty with Corrientes, and nothing more."
 gg_phase1.1.c:0 "The Republic does not enter wars that are not its own."
 gg_phase1.2.t:0 "Echagüe Crosses the Uruguay"
 gg_phase1.2.d:0 "On 21 March Echagüe destroyed Berón de Astrada at Pago Largo. The wounded and the prisoners had their throats cut, and the governor of Corrientes himself was left on the field. Now Echagüe and Juan Antonio Lavalleja have crossed the Uruguay at Salto with an army twice the size of ours.\n\nRivera saw it coming and already has cavalry on the Queguay. His plan is the one he knows: harass them from the moment they land, jump from the Queguay to the Negro and from the Negro to the Santa Lucía, shelter behind that river until the infantry and artillery arrive from Montevideo, and let hunger do the rest. An army that size needs cattle, and to find them it must split up.\n\nOr we can march out and meet them now, before they dig in."
 gg_phase1.2.f:0 "A war of horses before a war of battles."
 gg_phase1.2.a:0 "A war of resources, behind the Santa Lucía."
 gg_phase1.2.b:0 "March out and meet them now."
 gg_phase1.3.t:0 "Cagancha"
 gg_phase1.3.d:0 "It worked. Echagüe had to split his army to find cattle: Anacleto Medina caught Manuel Lavalleja at the head of the Arias stream, and Colonel Fortunato Silva destroyed Leonardo Olivera at San Carlos on 17 October. With the infantry and artillery in hand, Rivera left the Santa Lucía line, went after him, and at Cagancha three thousand men beat six thousand.\n\nNow the unitarians want more: that the army cross into Entre Ríos and carry the war into the Confederation, now that Echagüe is retreating in pieces. Lavalle is already in Corrientes, under Governor Pedro Ferré.\n\nThe Republic has defended itself. The question now is whether it should also attack."
 gg_phase1.3.f:0 "Cagancha, 29 December 1839."
 gg_phase1.3.a:0 "Cross into Entre Ríos."
 gg_phase1.3.b:0 "The Republic has defended itself. We stay."
 gg_phase1.4.t:0 "Lavalle"
 gg_phase1.4.d:0 "Juan Lavalle spent these years in Montevideo refusing to join a war waged arm in arm with France. He changed his mind. He landed in Entre Ríos with the exiles, signed a proclamation embracing federalism that nobody took seriously, and moved on to Corrientes to serve under Governor Pedro Ferré.\n\nNow he asks for what he lacks: ships, men and a port to fit them out. The ships can be French; the men and the port must be ours. In Montevideo the exiles repeat that ‘killing Rosas is a holy deed’ since the plot failed in Buenos Aires in June and Colonel Ramón Maza was shot.\n\nHelping Lavalle means plunging the Republic up to its neck in the Argentine civil war."
 gg_phase1.4.f:0 "They bring their own quarrel into ours."
 gg_phase1.4.a:0 "Ships, men and a port for Lavalle."
 gg_phase1.4.b:0 "Let the unitarians pay for the unitarians' war."
 gg_phase1.5.t:0 "France Leaves"
 gg_phase1.5.d:0 "On 29 October Admiral Mackau and Minister Felipe Arana signed peace between France and the Confederation. France lifts the blockade of Buenos Aires and collects what it came for: Buenos Aires recognises the claims of French subjects. For those who fought Rosas with French help, the convention's amnesty does not reach the generals or the commanders.\n\nThe news could not come at a worse moment. Lavalle landed at San Pedro in August with four thousand Correntinos in French ships, expected Buenos Aires to rise and met hostility and indifference. On 7 September he ordered the retreat, and the exiles in Montevideo already call him a traitor.\n\nThe Republic declared war on Rosas with France behind it. Another backer must be found before the Restorer notices."
 gg_phase1.5.f:0 "‘A death blow to the anti-Rosas cause.’"
 gg_phase1.5.a:0 "Look for Britain."
 gg_phase1.5.b:0 "Lean on the unitarians and Corrientes."
 gg_phase1.5.c:0 "Ask Brazil, even if the price is paid at the frontier."
 gg_phase1.6.t:0 "News from Famaillá"
 gg_phase1.6.d:0 "The news from the north arrives all at once. Oribe, commanding the Confederation's army, crushed Lavalle at Quebracho Herrado last November and crushed him again at Famaillá on 19 September. After Famaillá prisoners were shot and had their throats cut. Oribe wrote to Rosas that he had ‘ordered the head cut off’ of ‘the savage unitarian Avellaneda’, and that the head ‘will be placed for the inhabitants to behold in the public square of the city of Tucumán’.\n\nLavalle died on 9 October in Jujuy, shot through the throat in a house he had entered to sleep with an escort of eight men. His men carried the body off towards Bolivia so that Oribe would not have it.\n\nThe Montevideo press has material for a whole campaign, and the man it is writing about will be back on this side of the river."
 gg_phase1.6.f:0 "A name is a weapon too."
 gg_phase1.6.a:0 "Let the press call him by his name: throat-cutter."
 gg_phase1.6.b:0 "Leave the subject alone."
 gg_phase1.7.t:0 "Greater Uruguay"
 gg_phase1.7.d:0 "On 28 November last, José María Paz, the one-armed general, destroyed Echagüe at Caaguazú, leaving Entre Ríos with a new governor: Justo José de Urquiza. Paz proclaimed himself governor of Entre Ríos, and in February the envoys of Paz, Pedro Ferré, Juan Pablo López and Rivera agreed to continue the war towards a precise end: a new State comprising Entre Ríos, Corrientes, Santa Fe and the Banda Oriental. Bento Gonçalves would secretly add Río Grande.\n\nToday, at Paysandú, the allied chiefs offer Rivera supreme command of their armies. Paz takes offence. Nobody in Entre Ríos recognises him as governor, and Admiral Brown has already swept Garibaldi's flotilla from the river.\n\nTo command the coalition is to answer for everything that goes wrong."
 gg_phase1.7.f:0 "A country the size of a caudillo's ambition."
 gg_phase1.7.a:0 "Accept the supreme command."
 gg_phase1.7.b:0 "The Republic will not grow on its neighbours' land."
 gg_phase1.8.t:0 "Oribe Defenceless"
 gg_phase1.8.d:0 "A trusted man of the British minister Mandeville arrives from Buenos Aires with news that looks like a gift. Oribe is coming back from Jujuy with a worn-out army: no horses and few arms, already in Entre Ríos, within reach. Mandeville heard it from Rosas himself, who said it as if lamenting: ‘If the Pardejón knew how to take advantage...’.\n\nMandeville considers himself the Restorer's friend.\n\nRivera commands the coalition and a large army. He can cross the Uruguay and fall on Oribe before he recovers, or wait for him on our own bank and make the other man cross the river."
 gg_phase1.8.f:0 "‘If the Pardejón only knew how to take advantage...’"
 gg_phase1.8.a:0 "Cross and surprise him."
 gg_phase1.8.b:0 "Wait for him on our own bank."
 gg_phase1_cagancha_lost:0 "Beaten by Echagüe"
 gg_phase1.2.d_small:0 "On 21 March Echagüe destroyed Berón de Astrada at Pago Largo. The wounded and the prisoners had their throats cut, and the governor of Corrientes himself was left on the field. Now Echagüe and Juan Antonio Lavalleja have crossed the Uruguay at Salto.\n\nThey bring less than Rosas would have sent against a declaration of war: the Republic signed the treaty with Corrientes but declared no war. Even so they outnumber us. Rivera already has cavalry on the Queguay and knows what he will do: harass them, shelter behind the Santa Lucía until the Montevideo infantry arrives, and let hunger force them to split up.\n\nOr we can march out and meet them now, before they dig in."
 gg_phase1.2.a_tt:0 "@information! Rivera waits for the Montevideo infantry and meets Echagüe with the army complete."
 gg_phase1.2.b_tt:0 "@information! Rivera marches without his infantry: an even chance of an early victory, or of a defeat worth #P +2#! to the #blue_value blancos#! and three years of disarray."
 gg_phase1.3.a_tt:0 "@information! The army is exposed across the river: a defeat in Entre Ríos would be worth #P +1#! to the #blue_value blancos#! at Arroyo Grande."
 gg_phase1.7.a_tt:0 "@information! Rivera takes command of the Greater Uruguay coalition; defeat across the river would be worth #P +1#! to the #blue_value blancos#! at Arroyo Grande."
 gg_phase1.1.b_tt:0 "@information! With the Republic neutral towards France, Rosas sends a smaller army; the #R colorados#! keep a #P +1#! advantage against it."
 gg_phase1.1.c_tt:0 "@information! The Republic escapes invasion for now, but Rosas goes on preparing Oribe's return; the struggle moves across the river and the country's unity frays sooner."
 gg_phase1.8.a_tt:0 "@information! Rivera crosses the Uruguay and stakes the whole army on catching Oribe; the division of the Republic draws nearer."
 gg_phase1.8.b_tt:0 "@information! The #R colorado#! army stays whole on this bank; Oribe keeps the initiative, but the division of the Republic is put off."
