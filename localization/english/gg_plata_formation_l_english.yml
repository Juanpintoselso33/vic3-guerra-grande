 # 24/9/2026 (Juan) -- forming La Plata (PLT): common/country_formation/zz_guerra_grande_formables.txt, common/scripted_triggers/gg_plata_formation.txt
 gg_plt_form_mandatory_tt:0 "The whole Oriental shore, #b Montevideo, San José, Maldonado, Cerro Largo#! and #b Paysandú#!, and both halves of Paraguay, the #b Upper#! and the #b Lower#!, held by us or by a government bound to us that will be joined to the union: all #V 7#!, without exception"
 gg_plt_form_provinces_tt:0 "At least #V 10#! of the #V 14#! old provinces of the Confederation: #b Buenos Aires, Santa Fe, Entre Ríos, Corrientes, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, Mendoza#! and #b San Luis#!. For each one lacking, a frontier land may stand in its stead, #b La Pampa, Neuquén, Río Negro, Chubut, Santa Cruz, Tierra del Fuego, Misiones, the Chaco, Formosa#! or #b Rio Grande do Sul#!, if it is ours and at least #V 75%#! of it has been settled; ground still being opened below that share does not count, and none is asked for"
