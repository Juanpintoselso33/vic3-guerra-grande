l_english:
 gg_ui_plata_phase_5:0 "@ships! Phase: #N French Blockade#!"
 gg_ui_plata_phase_5_tt:0 "Rear Admiral Leblanc's squadron blockades the port of Buenos Aires, and will until France and Rosas come to terms. The river is open to everyone else; Buenos Aires is the one cut off.\n#b Effects#!: the Buenos Aires shore, trade capacity #N -50%#! and port throughput #N -50%#!."
 gg_ui_plata_ba_blockaded_fr:0 "#N Blockaded by France#!"
 gg_ui_plata_ba_blockaded_fr_tt:0 "The French squadron lies off the port: the battery still stands, but the ships it would stop are not the ones that matter now."
 gg_ui_plata_word_french_blockade:0 "#b France#! is blockading Buenos Aires: the river question is her quarrel with Rosas, not a closure of his."
 gg_ui_plata_word_french_blockade_tt:0 "The blockade began in March 1838 over the treatment of French subjects in Buenos Aires, and lasts until France and Rosas settle it."
 gg_french_blockade_port:0 "French Blockade"
 gg_french_blockade_port_desc:0 "A French squadron blockades the port: almost no ship comes in, and the customs house that paid the government stands idle."
 gg_plata.42.t:0 "Leblanc's Squadron off Buenos Aires"
 gg_plata.42.d:0 "Rear Admiral Leblanc has declared the port of Buenos Aires and the whole coast of the Confederation under blockade. France demands for her subjects what Rosas refuses to grant, and until one of the two gives way her ships will stop every vessel bound for our port.\n\nThe customs house was the government's purse. From today it collects almost nothing."
 gg_plata.42.f:0 "Buenos Aires, March 1838."
 gg_plata.42.a:0 "France will tire before we do."
 gg_plata.42.a_tt:0 "While the blockade lasts, the Buenos Aires shore has #N -50%#! trade capacity and #N -50%#! port throughput."
 gg_plata.43.t:0 "France Lifts the Blockade"
 gg_plata.43.d:0 "The convention signed by Arana and Baron de Mackau ends the quarrel with France: her subjects are to be treated as those of the most favoured nation, and the squadron raises the blockade and sails home. The ships return to the port, and with them the customs house."
 gg_plata.43.f:0 "Buenos Aires, October 1840."
 gg_plata.43.a:0 "The port is ours again."
 gg_plata.43.a_tt:0 "The French blockade ends: the Buenos Aires shore recovers its trade and its port."
