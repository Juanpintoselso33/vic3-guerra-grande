 # 25/9/2026 (Juan) -- forming Great Argentina (Great_ARG): common/country_formation/zz_guerra_grande_formables.txt, common/scripted_triggers/gg_great_arg_formation.txt
 gg_garg_form_mandatory_tt:0 "The whole Oriental shore, #b Montevideo, San José, Maldonado, Cerro Largo#! and #b Paysandú#!, and both halves of Paraguay, the #b Upper#! and the #b Lower#!, held by us or by a government bound to us that will be joined to the nation: all #V 7#!, without exception"
 gg_garg_form_provinces_tt:0 "At least #V 10#! of the #V 14#! old provinces of the Confederation, held by us or by a government bound to us that will be joined to the nation: #b Buenos Aires, Santa Fe, Entre Ríos, Corrientes, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, Mendoza#! and #b San Luis#!. For each one lacking, a frontier land may stand in its stead, #b Misiones, the Chaco, Formosa, Rio Grande do Sul#! or any land of the south, if it is held the same way and at least #V 75%#! of it has been settled; ground still being opened below that share does not count, and none is asked for by name"
 gg_garg_form_south_tt:0 "Over and above those ten, at least #V 3#! lands of the south held the same way and settled in at least #V 75%#!: #b La Pampa, Neuquén, Río Negro, Chubut, Santa Cruz, Tierra del Fuego#!, the Chilean south of #b Los Ríos, Los Lagos, Aysén#! and #b Magallanes#!, or the #b South Atlantic Islands#!. Any three will do; none is asked for by name"
