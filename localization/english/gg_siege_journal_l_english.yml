l_english:
 # EN/ES: El Sitio Grande journal (22/9/2026 redesign) -- docs/guerra-grande-flujo/sitio-textos-mecanica.md
 gg_siege_ui_short:0 "The Cerrito rules the whole Republic save the city; the city keeps the harbour, the customs house and its walls. The besiegers have no breaching guns, and the besieged no countryside."
 gg_siege_ui_sec_line:0 "At the Walls"
 gg_siege_ui_leader_defender:0 "#R Holding the City#!\n#b [Character.GetFullName]#!"
 gg_siege_ui_leader_besieger:0 "#blue_value Besieging the City#!\n#b [Character.GetFullName]#!"
 gg_siege_ui_sec_sides:0 "What Each Side Holds"
 gg_siege_ui_col_plaza:0 "#R The City#!"
 gg_siege_ui_col_campo:0 "#blue_value The Countryside#!"
 gg_siege_ui_walls_tt:0 "The walls of Montevideo have kept the city since the partition of the Republic.\n#b Effects#! (the Defensa): blockade resistance #P +100#!.\n#b Should it come to fighting#!: attrition risk #P -25%#!, war exhaustion from casualties #P -25%#!, and its generals before Montevideo, defence #P +75%#!, while the city remains the Defensa's."
 gg_siege_ui_guns_tt:0 "Twenty-three guns in February 1843, a hundred by June: the garrison outgunned its besiegers three to one.\n#b Should the city be fought over#! (Montevideo): fortification resistance to bombardment #P +250#!."
 gg_siege_ui_port_tt:0 "The one customs house foreign merchants will recognise, the one deep-water harbour on the river, and not a single head of cattle inside the lines.\n#b Effects#! (Montevideo): tax capacity #P +60%#!, trade capacity #P +30#!, trade advantage #P +25%#!, migration attraction #P +50%#!, ranching and agriculture #N -60%#!, conscription #N -15%#!, working adults #P +15%#!."
 gg_siege_ui_sea_tt:0 "What the city cannot raise from its own people comes in by sea: men, money and powder. The Defensa recovers #P 2#! endurance a month.\n#b Should it come to fighting#! (the Defensa): unit recovery #P +25%#!, morale recovery #P +15%#!."
 gg_siege_ui_mortgaged_tt:0 "The customs revenue is sold years ahead to the Sociedad Compradora de los Derechos de Aduana: ready money now, and a debt that will outlast the war.\n#b Effects#! (the Defensa): minting #P +300#!, loan interest #N +50%#!, authority #N -40#!."
 gg_siege_ui_trading_def_tt:0 "Both governments have forbidden all dealings with the enemy, and both license them all the same, for each needs what the other has.\n#b Effects#! (each government): minting #P +50#!, prestige #N -5%#!, authority #N -20#!."
 gg_siege_ui_trading_cer_tt:0 "Both governments have forbidden all dealings with the enemy, and both license them all the same, for each needs what the other has.\n#b Effects#! (each government): minting #P +50#!, prestige #N -5%#!, authority #N -20#!."
 gg_siege_ui_cattle_tt:0 "Under Howden's truce, cattle are let into the city for six months.\n#b Effects#! (the Defensa): legitimacy #P +5#!, petty bourgeoisie approval #P +3#!."
 gg_siege_ui_noguns_tt:0 "Thirty-five guns before Montevideo, and not one heavy enough to breach a wall.\n#b Should the city be stormed#! (the Cerrito's generals before Montevideo): offence #N -50%#!, occupation speed #N -50%#!, provinces captured #N -50%#!. Away from the city, the Cerrito fights without that burden."
 gg_siege_ui_countryside_tt:0 "The cattle, the hides, the saladeros and the horsemen are all out here; but the landing places are open beaches, and whatever leaves them is contraband in the eyes of the city.\n#b Effects#! (San José, Maldonado, the Banda Oriental and Paysandú): tax capacity #N -30%#!, trade capacity #N -20%#!, trade advantage #N -25%#!, port throughput #N -20%#!, blockade resistance #N -60#!, migration attraction #N -50%#!, ranching and agriculture #P +30%#!, conscription #P +25%#!."
 gg_siege_ui_buceo_tt:0 "The Buceo, declared a port by decree of 10 July 1843, with a customs house of its own: a modest revenue, but not a peso owed to anyone.\n#b Effects#! (the Cerrito): minting #P +100#!, loan interest #P -25%#!, authority #P +40#!."
 gg_siege_ui_frontier_tt:0 "With the powers' squadrons in the river, the Cerrito's trade goes north overland: by the Laguna Merín, the Yaguarón, Melo and the Uruguay shore.\n#b Effects#! (the Banda Oriental and Paysandú, five years): trade capacity #P +25%#!, trade advantage #P +20%#!, ranching #P +20%#!."
 gg_siege_ui_sec_forces:0 "Garrison and Besiegers"
 gg_siege_ui_italian_0:0 "#b Italian Legion#!: #V not yet raised#!"
 gg_siege_ui_italian_1:0 "#b Italian Legion#!: #P raised#!"
 gg_siege_ui_italian_2:0 "#b Italian Legion#!: #P reinforced#!"
 gg_siege_ui_italian_tt:0 "The Italians of the city. Raising the legion adds a new formation; Garibaldi comes in as its general if the government raises it by decree, or if he has already made his name.\n#b Effects#! (the Defensa, on raising; fading over ten years): defence #P +10%#!, military goods cost #P -5%#!, Armed Forces approval #P +2#!.\nReinforcing it costs #N 20,000#! and #N 5#! points of French backing, and renews it for five years."
 gg_siege_ui_french_0:0 "#b French Legion#!: #V not yet raised#!"
 gg_siege_ui_french_1:0 "#b French Legion#!: #P raised#!"
 gg_siege_ui_french_2:0 "#b French Legion#!: #P reinforced#!"
 gg_siege_ui_french_3:0 "#b French Legion#!: #N declined by the government#!"
 gg_siege_ui_french_tt:0 "The French residents, under Thiébaut. It may be raised from 1843, and brings troops and Thiébaut as a general.\n#b Effects#! (the Defensa, on raising; fading over ten years): defence #P +15%#!, military goods cost #P -10%#!, migration attraction #P +25%#!, Armed Forces approval #P +2#!.\nReinforcing it costs #N 20,000#! and #N 5#! points of French backing, and renews it for five years."
 gg_siege_ui_argentine_0:0 "#b Argentine Legion#!: #V not yet raised#!"
 gg_siege_ui_argentine_1:0 "#b Argentine Legion#!: #P raised#!"
 gg_siege_ui_argentine_tt:0 "The exiles who fled Rosas, taking up arms for the city. Raising it costs #N 10,000#! and cools relations with Buenos Aires (#N -30#!).\n#b Effects#! (the Defensa, on raising; fading over seven years): offence #P +5%#!, intelligentsia approval #P +2#!, prestige #P +5%#!."
 gg_siege_ui_aux_0:0 "#b Rosas's Auxiliaries#!: #V no aid from Buenos Aires#!"
 gg_siege_ui_aux_1:0 "#b Rosas's Auxiliaries#!: #P aided by Buenos Aires#!"
 gg_siege_ui_aux_tt:0 "The divisions Buenos Aires lends the Cerrito, without ever declaring war on the Republic. If they come with Rosas's loan, they bring money and further backing besides.\n#b Effects#! (the Cerrito, ten years): offence #P +10%#!, military goods cost #P -5%#!. The money comes through Rosas’s monthly payment as the Cerrito’s backer."
 gg_siege_ui_basque_cer:0 "#b The Basque Battalion#!: #P gone over to the Cerrito#!"
 gg_siege_ui_basque_tt:0 "The Basque-Navarrese battalion raised in the city deserts to Oribe's camp: the Cerrito gains a battalion, and it costs the Defensa #N 10,000#!. If the Argentine Legion has been raised, José María Paz arrives in the city as a general.\n#b Effects#! (the Defensa, on desertion; fading over five years): defence #N -5%#!, authority #N -25#!, Armed Forces approval #N -2#!."
 gg_siege_ui_more:0 "The Great Siege in Detail"
 gg_siege_ui_more_body:0 "#b Two Governments, One Line#!\nThe Cerrito rules the whole Republic save the city, from its camp on the Cerrito de la Victoria, the Villa de la Restauración and the customs house at the Buceo. The Defensa has the harbour, the customs house foreigners recognise and its walls, and no countryside whatever. Each side has precisely what the other lacks.\n\n#b Why the City Holds#!\nThe besiegers have no breaching guns, and the walls multiply the garrison's strength: a direct assault comes dear. The countryside raises men and cattle; the city lives on its customs, on credit and on what comes in by sea.\n\n#b The Legions#!\nThe city is full of foreigners. Italians, Frenchmen, Basques and Argentine exiles form corps of their own; reinforcing the Italian or the French legion costs money and French goodwill. Across the lines stand Rosas's battalions.\n\n#b What Is Settled Elsewhere#!\nThe river is contested by Rosas and the powers' squadrons; the peace, by the two governments and those who back them."
 gg_siege_ui_brie:0 "#b Basque Chasseurs#!: #P raised#!"
 gg_siege_ui_brie_tt:0 "The Basque companies break away from the French Legion and form a regiment of their own under Jean Baptiste Brie: the city gains a battalion."
 gg_siege_ui_allied:0 "#b Allied Army#!: #P landed at Montevideo#!"
 gg_siege_ui_allied_tt:0 "Under the treaties of 1851 with the Empire of Brazil, the city receives infantry and cavalry.\n#b Effects#! (the Defensa; fading over fifteen years): prestige #N -15%#!, authority #N -50#!. The Empire's money comes through its monthly payment (see ‘The Backers’ in The Guerra Grande). The Cerrito loses #N 30#! endurance."
