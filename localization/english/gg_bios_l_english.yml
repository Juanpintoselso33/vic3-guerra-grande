l_english:
 gg_bio_button_tt:0 "#T [Character.GetFullName]#!\n\n[Character.GetCustom('gg_bio_text')]"
 gg_bio_oribe_manuel:0 "Born in Montevideo in 1792, a soldier of independence and one of the Thirty-Three, he was President of the Republic from 1835 to 1838. He gave his followers the white ribbon inscribed ‘Defenders of the Laws’, and when pressure from Rivera and the French blockade drove him to resign in 1838 he left for Buenos Aires without ever accepting his fall. At the head of Confederation armies he won at Quebracho Herrado, Famaillá and Arroyo Grande; from February 1843 he besieged Montevideo and governed most of the country from the Cerrito until the peace of October 1851. He died in Montevideo in 1857."
 gg_bio_rivera_fructuoso:0 "A rancher and lieutenant of Artigas, he served the Portuguese for a time and returned with the Crusade of 1825; his conquest of the Missions came just before the peace that created the Oriental State. First President (1830-1834), he governed by riding the countryside, where his popularity was immense; the massacre of Salsipuedes took place under his command. Rising against Oribe in 1836 and beaten at Carpintería, he won at Palmar and returned to the presidency. He lost Arroyo Grande and India Muerta, was exiled by the Defensa in 1847, and died in 1854 on his way to Montevideo to join the triumvirate."
 gg_bio_lavalleja:0 "Born in Minas in 1784, he led the Thirty-Three Orientals who crossed the Uruguay in 1825 to wrest the Oriental Province from Brazil, and governed the province during the war. Rivera's rival, he rose against his first government in 1832 and again in 1834, without success, and ended up on Oribe's side. After the Great War he sat on the triumvirate of 1853 with Rivera and Flores, and died in Montevideo that same October."
 gg_bio_suarez:0 "Born in Canelones in 1781 to settlers of the town, he joined the revolution and was delegate governor of the Oriental Province in 1826. A wealthy merchant, he signed for Rivera the capitulation of October 1838 that removed Oribe from power. President of the Defensa from March 1843 to February 1852, he held the city through the siege at the head of a government in which the doctores carried great weight, and which in 1847 exiled Rivera himself. He died in Montevideo in 1868."
 gg_bio_oribe_ignacio:0 "Manuel Oribe's younger brother, born in Montevideo in 1795, he joined the army during the second siege of Montevideo and fought under Rivera against the Portuguese. Minister of War and Navy from 1830 to 1833, he commanded the government forces that beat Rivera at Carpintería in September 1836, and was beaten by him at Palmar in 1838. He followed his brother throughout the Great War. He died in Montevideo in 1866."
 gg_bio_herrera_y_obes:0 "Born in Montevideo in 1806, son of Nicolás Herrera, a lawyer and man of letters, he was one of the typical doctores of the age. A deputy under Rivera and a member of the Defensa's Assembly of Notables and Council of State, he was made Minister of Foreign Affairs by Joaquín Suárez. From that post he led the Defensa's diplomacy in the years that ended with Urquiza parted from Rosas and the Empire of Brazil in the war. He died in Montevideo in 1890."
 gg_bio_lamas:0 "Born in Montevideo in 1817 and a journalist at eighteen, he was exiled to Brazil in 1836 for writing against Oribe's government. A lawyer and judge-advocate, he refounded El Nacional, where the Argentine Generation of '37 wrote, and in 1843 he founded the Historical and Geographical Institute. Finance Minister of the Defensa in 1844, from 1847 he was its envoy to the Empire of Brazil and negotiated the treaties of October 1851. He died in Buenos Aires in 1891."
 gg_bio_berro:0 "Born in Montevideo in 1803 to Basque merchants, he was a writer as well as a politician. On Oribe's side during the war, he was often at odds with Villademoros within the Cerrito. As President of the Senate he held the government in February 1852, and was constitutional President from 1860 to 1864. He was murdered in Montevideo in February 1868."
 gg_bio_diaz_cesar:0 "Born in Montevideo in 1812, he fought at Ituzaingó under José María Paz and then in the Unitarian campaigns in Córdoba. In exile in the Oriental State, he joined Rivera against Oribe in 1837; of Arroyo Grande he left the line that there ‘all was lost, even honour’. Commander of Montevideo's defences during the siege, he led the Oriental division at Caseros, where Urquiza made him general on the field. He was shot after the defeat at Quinteros in 1858."
 gg_bio_flores:0 "Born in Trinidad in 1808, he joined the Liberating Crusade at nearly seventeen, after the landing of the Thirty-Three, and fought at Rincón, Sarandí and Ituzaingó. Rivera's man, he defended his first government and followed him in the rising against Oribe; in the Great War he fought for the Defensa until 1846, when he resigned because the government refused to negotiate peace. He returned in 1851 with Urquiza. He succeeded Rivera as caudillo of the Colorado Party and was murdered in Montevideo in 1868."
 gg_bio_aparicio:0 "Born in Canelón Grande in 1814, he first bore arms beside Manuel Oribe in 1836 and stayed with him through the siege of Montevideo and the government of the Cerrito. A man of the countryside, he spent much of his life in Florida. A long-lived Blanco caudillo, in 1870 he led the Revolution of the Lances and beat the forces of Lorenzo Batlle's government at Paso Severino. He died in 1882."
 gg_bio_batlle_lorenzo:0 "Born in Montevideo in 1810 to a Catalan merchant whose property Artigas's government confiscated, he was educated in Barcelona and at the French college of Sorèze before returning to the River Plate. A soldier and politician of the Colorado Party, he was President of the Republic from 1868 to 1872, and the father of José Batlle y Ordóñez. He died in Montevideo in 1887."
 gg_bio_medina:0 "Born in Las Víboras, near Colonia, in 1788, he joined Artigas's Blandengues and led cavalry at the victory of Guayabos. A horseman all his life, in the Great War he was a Colorado general and Rivera's chief of staff; he fought at Cagancha and Arroyo Grande, went to Brazil after the defeats of 1846 and in 1851 joined Urquiza's army. He was executed at the end of the battle of Manantiales, in 1871, at the age of eighty-three."
 gg_bio_pacheco_y_obes:0 "Born in Buenos Aires in 1809, he joined the Crusade of 1825 at sixteen and fought at Ituzaingó. Settled in Montevideo, he kept out of Rivera's rising against Oribe, but with the siege he became the Defensa's Minister of War and the organiser of its resistance. He pleaded the city's cause before the French Parliament. He died in Buenos Aires in 1855."
 gg_bio_villademoros:0 "Born in Cerro Largo in 1806, orphaned when his father fell in the wars of independence, he qualified as a lawyer in Buenos Aires. A poet of odes and eclogues, author of the drama Los Treinta y Tres and a journalist on El Defensor de las Leyes, he worked closely with Manuel Oribe and held high office in his governments, Foreign Affairs among them. Within the Cerrito he was often at odds with Berro. He died in Montevideo in 1853."
 gg_bio_giro:0 "Born in Montevideo in 1791, he rose through the Cabildo and served as Minister of Government in the Oriental State's first administrations. An adherent of the white ribbon and a legislator of the Cerrito during the siege, he was elected President of the Republic on 1 March 1852, once the war was over, and attempted a government of fusion between the parties. Pressure from within forced him out in September 1853. He died in Montevideo in 1863."
 gg_bio_garzon:0 "Born in Montevideo in 1796, he enlisted with Artigas in 1811 and fought at Las Piedras and in the siege of Montevideo. He then joined the Army of the Andes: he was San Martín's aide at Chacabuco and fought at Cancha Rayada and Maipú. A veteran of the wars of independence and of the civil wars of the Plate, he served on the Blanco side. He died in Montevideo on 1 December 1851, weeks after the peace."
 gg_bio_gomez_servando:0 "Born around 1798, he joined Artigas in 1818 and fought under Rivera at Rincón and at Ituzaingó, where he won the rank of colonel. Loyal to Rivera during his first presidency, under Oribe he commanded in Cerro Largo and fought for the government at Carpintería: Ignacio Oribe called him ‘bravest among the brave’. At the head of the Legión Fidelidad he followed Oribe into exile in 1838 and stayed with him through the Littoral campaign. He died in Gualeguaychú in 1865."
 gg_bio_mitre:0 "Born in Buenos Aires in 1821, he spent his youth in exile in Montevideo, where he served as an artillery officer of the city and wrote for its newspapers; he belonged to the National Association presided over by Andrés Lamas. He broke with Rivera in 1846. A man of arms and letters, he went on to govern Buenos Aires and to be President of the Argentine Nation from 1862 to 1868. He died in Buenos Aires in 1906."
 gg_bio_urquiza:0 "Born in Entre Ríos in 1801, he was the greatest rancher and salting-house owner of his province, which he governed from 1842. A Federal commander of the Littoral in Rosas's service, he fought at Arroyo Grande beside Oribe and crushed the Madariagas at Vences in 1847, after negotiating the Treaty of Alcaraz with them. On 1 May 1851 he declared against Rosas, allied with Brazil and the Defensa, lifted the siege of Montevideo, and in February 1852 defeated him at Caseros. He presided over the Argentine Confederation from 1854 to 1860 and was murdered in 1870."
 gg_bio_lamadrid:0 "Born in Tucumán in 1795, he fought with Belgrano in the North and was a military leader of the Unitarian party in the civil wars. He governed Tucumán more than once and, briefly, La Rioja and Mendoza. In the war of the Coalition of the North he led the army of Tucumán and in 1841 carried the campaign into Cuyo, where that September Ángel Pacheco defeated him at Rodeo del Medio; what was left of his men crossed the snowbound Andes. He fought against Rosas at Caseros and died in Buenos Aires in 1857."
 gg_bio_heredia:0 "Born in Tucumán in 1788 and a doctor of law from Córdoba, he was Belgrano's lieutenant at Salta, Vilcapugio and Ayohuma, and one of the leaders of the Arequito mutiny in 1820. Governor of Tucumán from 1831, he was proclaimed Protector of the North and held great influence over the neighbouring provinces under the Federal banner. He was murdered at Lules in November 1838, and soon after his death the Coalition of the North was born."
 gg_bio_pacheco_angel:0 "Born in Buenos Aires around 1793, he was trained as a mounted grenadier under San Martín and received his baptism of fire at San Lorenzo. He was one of Rosas's chief commanders and is reputed never to have lost a battle he led: he won at Quebracho Herrado and, in 1841, beat Lamadrid at Rodeo del Medio. He died in Buenos Aires in 1869."
 gg_bio_ferre:0 "Born in Corrientes in 1788 to Catalan parents, a shipwright and river trader, he governed his province four times. In the debates over the Federal Pact of 1831 he asked for more ports, a share of the customs and open rivers; Rosas gave him protection, but not free navigation. He returned to power after Pago Largo, broke with Paz in 1842 and after Arroyo Grande fled to Paraguay. He sat in the constituent convention of 1853 and died in Buenos Aires in 1867."
 gg_bio_brizuela:0 "Born in La Rioja around 1800 and nicknamed el Zarco for his pale eyes, he was Facundo Quiroga's lieutenant in his province and governor of La Rioja from 1837. In September 1840 he was chosen director of the League of the North, empowered to make war and peace and to raise loans. He died at Sañogasta in June 1841, fighting against Rosas's power."
 gg_bio_avellaneda:0 "Born in Catamarca in 1813, son of the province's first governor, he studied in Buenos Aires with Alberdi and Juan María Gutiérrez and took his doctorate in law in 1834; his fellows called him Marcus Tullius for his oratory. Governor of Tucumán in 1841 and a leading figure of the Coalition of the North, after the defeat at Famaillá he had his throat cut at Metán that October. His son Nicolás became President of Argentina."
 gg_bio_paz:0 "Born in Córdoba in 1791, he studied at the university before joining the Army of the North, where he lost the use of an arm; el Manco Paz was one of the great tacticians of the Unitarian party. He beat Echagüe at Caá Guazú in November 1841 and in 1842 had himself made governor of Entre Ríos, which set him against Ferré. In 1846 he tried to overthrow the Madariagas, failed and fled to Paraguay. He died in Buenos Aires in 1854."
 gg_bio_beron_de_astrada:0 "Born in Corrientes in 1801, a cavalry officer and warden of his province's eastern frontier, he had fought in the Oriental State under Rivera against Oribe. Governor of Corrientes from 1837, in March 1839 he broke with Rosas and declared war on him to lift the blockade that was strangling the province's trade. He died at the head of his troops at Pago Largo on 31 March 1839."
 gg_bio_madariaga_juan:0 "Born in Corrientes in 1809, Joaquín's younger brother, he took up cattle ranching at Curuzú Cuatiá. He fought at Caá Guazú and in the defeat at Arroyo Grande, after which he went into exile in Brazil. In 1843 he crossed the Uruguay with his brother at the ford they named Paso de los Libres and within days they retook Corrientes; he became the province's military chief. Urquiza captured him at Laguna Limpia in 1846 and released him to open talks. He died in 1879."
 gg_bio_madariaga_joaquin:0 "Born in Corrientes in 1799, son of a Basque from Bilbao, he was a soldier in Buenos Aires, a judge in his province and a rancher at Curuzú Cuatiá. After crossing the Uruguay at Paso de los Libres in 1843, he governed Corrientes against Rosas until 1847. He signed the Treaty of Alcaraz with Urquiza and refused the changes Rosas demanded; in November 1847 Urquiza routed him at Vences. He died in exile in Porto Alegre in 1848."
 gg_bio_ibarra:0 "Born in 1787 at Villa Matará, he championed the autonomy of Santiago del Estero and became its first governor, ruling it almost without a break from 1820 until his death. A Federal caudillo of the interior, in 1840 he refused to join the Coalition of the North when Tucumán, Salta, Jujuy, Catamarca and La Rioja declared against Rosas, and his province stood as a wedge in the midst of the revolt. He died in Santiago del Estero in July 1851."
 gg_bio_benavidez:0 "Born in San Juan in 1805, a Federal caudillo and ally of Rosas, he governed his province in four separate terms between 1836 and 1857. In the war against the Coalition of the North, in August 1841, he captured the Unitarian general Mariano Acha at La Chacarilla, who was later executed. He was murdered in San Juan in October 1858."
 gg_bio_aldao:0 "Born in Mendoza in 1785, a Dominican friar who exchanged the habit for arms in the war of independence, the Friar Aldao was the chief of Mendoza's Federals. In August 1841 Acha beat him at Angaco, one of the bloodiest battles of the civil wars, and that November he took the government of Mendoza, which he held until his death in January 1845. His reputation for cruelty is bound up with the largely fictionalised biography Sarmiento wrote of him."
