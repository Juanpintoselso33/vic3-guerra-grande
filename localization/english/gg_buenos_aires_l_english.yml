l_english:
 gg_ba_play_name:0 "The Buenos Aires Question"
 dp_gg_buenos_aires:0 "Settle the National Integrity"
 gg_ba_army_name:0 "Army of Buenos Aires"
 gg_ba_differential_duties_hit:0 "Differential Duties"
 gg_ba_differential_duties_hit_desc:0 "Goods landed straight at the Confederation's ports pay less than goods that have passed through our customs house. The coasting trade stalls and the port's revenue falls."
 gg_ba_differential_duties_gain:0 "Ocean Ships on the Paraná"
 gg_ba_differential_duties_gain_desc:0 "Under the differential duties, ocean-going ships begin to sail up to Rosario, and the river customs collect what Buenos Aires used to."
 gg_ba_flores_customs:0 "The Customs House to the Nation"
 gg_ba_flores_customs_desc:0 "Under the Pact of San José de Flores the federal government takes over the Buenos Aires customs house and guarantees the province its budget for five years."

 gg_ba.1.t:0 "The September Revolution"
 gg_ba.1.d:0 "On 11 September 1852 Buenos Aires overthrew the authorities the Provisional Director had set over it and refused to remain in the Confederation. In June its Legislature had already thrown out the San Nicolás Agreement: the porteños would give up neither their capital city nor the revenue of their customs house.\n\nThe national organisation goes on without them. Thirteen provinces send their deputies to the congress at Santa Fe, and the Confederation's government moves up the river to Paraná. Buenos Aires keeps the port, the customs house and half the country's revenue.\n\nOut in the porteño countryside there are federal commanders who will not accept the men of the city. Hilario Lagos is gathering men and promises to besiege it before the year is out, if someone will stand behind him."
 gg_ba.1.f:0 "The port, the customs house and the capital city: what Buenos Aires would not surrender."
 gg_ba.1.a:0 "Let it go. The Nation will organise all the same."
 gg_ba.1.a_tt:0 "Buenos Aires stays apart, without a war. The question stays open."
 gg_ba.1.b:0 "Back Lagos and besiege the city."
 gg_ba.1.b_tt:0 "The Confederation goes to war with Buenos Aires alongside the federals of the countryside."
 gg_ba.1.c:0 "Throw in our lot with Buenos Aires."
 gg_ba.1.c_tt:0 "You take over the government of the State of Buenos Aires."

 gg_ba.2.t:0 "Two Governments"
 gg_ba.2.d:0 "The war of the Pact produced no victor, and time has not settled it. Rosas still holds Buenos Aires, with the port and the customs house; Urquiza governs from Paraná the provinces that will no longer take orders from the city.\n\nNeither recognises the other as the government of the Nation, and both call themselves Argentine. Merchants load at both ports, émigrés change banks with the wind, and every mail brings a new proclamation.\n\nWhatever is settled between them will be settled by treaty or by battle: there is no other court."
 gg_ba.2.f:0 "One Nation, two governments, and neither willing to yield."
 gg_ba.2.a:0 "Let time tell who makes the Nation."
 gg_ba.2.a_tt:0 "Buenos Aires and the Confederation each go their own way."

 gg_ba.3.t:0 "Coe's Squadron"
 gg_ba.3.d:0 "Since Christmas Eve 1852 the city has been besieged by land, and the Confederation's small squadron, under the American John Halstead Coe, blockades it from the river. But the siege drags on: the federals have the numbers, and Buenos Aires has the port, the customs house and the credit.\n\nCoe and several of his officers can be bought. Colonel José María Flores, back from Montevideo, is already buying Lagos's officers: within days the besiegers could melt away.\n\nPay, and the blockade lifts, and the siege has nothing left to stand on."
 gg_ba.3.f:0 "A squadron that is sold does not sink: it changes flags."
 gg_ba.3.a:0 "Pay. Let the squadron come over to Buenos Aires."
 gg_ba.3.a_tt:0 "The siege is lifted and the war ends with Buenos Aires still apart."
 gg_ba.3.b:0 "Hold out and pay nobody."
 gg_ba.3.b_tt:0 "The war goes on by force of arms."

 gg_ba.4.t:0 "A State with Its Sovereignty"
 gg_ba.4.d:0 "On 12 April 1854 the Legislature enacts the constitution of Buenos Aires. Its first article declares it 'a State in the free exercise of its internal and external sovereignty, until it expressly delegates it to a federal Government'.\n\nThe word is State, not province, and it was chosen on purpose. With it Buenos Aires claims almost half of what it calls the national territory: the Pampa and the whole of Patagonia, though beyond the line of forts it is Calfucurá's chiefs who rule.\n\nPastor Obligado, who has governed since the siege was lifted, will be its first constitutional governor."
 gg_ba.4.f:0 "Until it expressly delegates it."
 gg_ba.4.a:0 "Swear to the constitution of the State."

 gg_ba.5.t:0 "The Treaty of Coexistence"
 gg_ba.5.d:0 "At the end of 1854, when Lagos and Costa rode into the porteño countryside again, the two governments came within a step of war. Two merchants, Daniel Gowland and José María Cullen, backed by the British vice-consul, averted it: on 20 December a status quo was signed.\n\nOn 8 January 1855, at Paraná, the status quo becomes a treaty. Buenos Aires and the Confederation will stand together against an attack from abroad and against Indian raids; the merchant ships of both will fly the national flag, and there will be no customs houses between them.\n\nNobody expects it to last. But for now ships load at both ports without paying twice."
 gg_ba.5.f:0 "Coexistence on paper is not union: it is a truce with open customs."
 gg_ba.5.a:0 "Sign, and each keep to our own."

 gg_ba.6.t:0 "The Differential Duties"
 gg_ba.6.d:0 "The Confederation opened fourteen ports on the Paraná and five on the Uruguay, and the ocean-going ships hardly come: they still unload at Buenos Aires, and whatever goes up-country pays duty there. The porteño customs house collects the revenue of the whole Nation.\n\nAlberdi and the deputies Lucero and Rueda propose a law: goods landed straight at a port of the Confederation will pay less than goods that have passed through the Buenos Aires customs house. Congress resisted it for two years.\n\nIf it passes, Buenos Aires can answer by closing its port to the produce of the interior."
 gg_ba.6.f:0 "A customs war makes everything dearer, and somebody has to win it."
 gg_ba.6.a:0 "Pass the law. Let the ships sail up to Rosario."
 gg_ba.6.b:0 "Leave it. Trade is not to be touched."
 gg_ba.6.b_tt:0 "The porteño customs house goes on collecting everyone's revenue."

 gg_ba.7.t:0 "By Reason or by Force"
 gg_ba.7.d:0 "On 20 May 1859 the Congress sitting at Paraná, 'provisional capital of the Argentine Confederation', authorises the President 'to resolve the question of national integrity with respect to the dissident province of Buenos Aires, by peaceful negotiation or by war, as circumstances may advise'.\n\nThe law lets him call out the national guards, enlarge the regular army and raise a navy. The minister Derqui put it plainly to the Chamber: the aim is 'to put an end to this state of affairs by reason or by force'.\n\nIn Buenos Aires the law is read as a declaration of war. Colonel Mitre is already gathering the army to march on Santa Fe."
 gg_ba.7.f:0 "'Reporting to Congress the result obtained by one means or the other.'"
 gg_ba.7.a:0 "March. National integrity will not wait."
 gg_ba.7.a_tt:0 "War between the Confederation and Buenos Aires."
 gg_ba.7.b:0 "Wait. Let Buenos Aires come when it will."
 gg_ba.7.b_tt:0 "Buenos Aires stays apart, and the question with it."

 gg_ba.8.t:0 "The Pact of San José de Flores"
 gg_ba.8.d:0 "In the Cañada de Cepeda the Confederation's cavalry decided the day: Mitre left a hundred dead, two thousand prisoners and some twenty guns on the field and fell back by night towards San Nicolás. Urquiza advanced as far as San José de Flores and did not take the city by force.\n\nThrough the mediation of Francisco Solano López, son of the Paraguayan president, and after Governor Alsina resigned, the pact was signed on 11 November 1859: Buenos Aires declares itself an integral part of the Confederation, may propose amendments to the Constitution, and the federal government takes over its customs house while guaranteeing its budget for five years.\n\nIts territory may not be divided without the consent of its Legislature. And a perpetual oblivion covers everything that caused the disunion."
 gg_ba.8.f:0 "'Buenos Aires declares itself an integral part of the Argentine Confederation.'"
 gg_ba.8.a:0 "Thirteen provinces, and one more."
 gg_ba.8.a_tt:0 "Buenos Aires comes under the federal government, its customs house in the Nation's hands."

 gg_ba.10.t:0 "The Break"
 gg_ba.10.d:0 "On 22 August 1861 relations between Buenos Aires and the government at Paraná are broken off. What was signed at San José de Flores was not enough: each government accuses the other of breaking it, and in the provinces of the interior the parties are already killing each other in their names.\n\nMitre wants war and believes he can win it. He has taken on mercenaries recruited in Europe by Hilario Ascasubi and most of the Ranquel bands; his troops are better armed and better drilled. Fifteen thousand four hundred porteños stand against seventeen thousand national troops.\n\nThe march would be on Santa Fe, as two years ago. This time, they say in the city, there will be no Cepeda."
 gg_ba.10.d_apart:0 "On 22 August 1861 relations between Buenos Aires and the government at Paraná are broken off. No pact binds the two governments: each accuses the other of wanting war, and in the provinces of the interior the parties are already killing each other in their names.\n\nMitre wants war and believes he can win it. He has taken on mercenaries recruited in Europe by Hilario Ascasubi and most of the Ranquel bands; his troops are better armed and better drilled. Fifteen thousand four hundred porteños stand against seventeen thousand national troops.\n\nThe march would be on Santa Fe, on the road to Paraná."
 gg_ba.10.f:0 "Two years after Cepeda, the same road north."
 gg_ba.10.a:0 "March on Santa Fe."
 gg_ba.10.a_tt:0 "War between Buenos Aires and the Confederation, and out of it comes whoever makes the Nation."
 gg_ba.10.b:0 "Give way. The Nation is made at Paraná."
 gg_ba.10.b_tt:0 "Buenos Aires enters the Confederation's government without a fight."

 gg_ba.11.t:0 "One Republic"
 gg_ba.11.d_ba:0 "At Pavón the national cavalry rode down both porteño wings while the Buenos Aires infantry drove the national foot from its ground. And then Urquiza, without committing his Entre Ríos reserve, left the field, crossed the Paraná and went home to his province. It was days before Mitre was convinced he had won.\n\nThe government at Paraná falls apart of its own accord. On 12 December 1861 it is declared dissolved, and Mitre takes charge as Governor of Buenos Aires in charge of the National Executive; the new Congress sits in Buenos Aires.\n\nThe Nation is organised at last, but in the porteño manner. In the provinces, yesterday's federals are beginning to pay the bill."
 gg_ba.11.d_conf:0 "The last war between Buenos Aires and the Confederation ended without leaving the city the means to go on alone. Its deputies will take the seats its population gives it, and its customs house belongs to the Nation.\n\nThe Constitution of 1853, with the amendments Buenos Aires asked for, now governs all fourteen provinces. The city keeps its institutions and its Legislature; what it loses is the claim to be a State apart.\n\nThe porteños who dreamed of independence fall silent or take ship. The rest begin looking for their place in the government of all."
 gg_ba.11.f:0 "One Nation, one government."
 gg_ba.11.a:0 "Let the Republic be organised."
 gg_ba.11.a_tt:0 "Buenos Aires and the Confederation become a single country."
 gg_ba.11.a_tt_players:0 "@information! Neither government disappears: the one that lost the last war becomes a #N protectorate#! of the one that won it, keeping its ruler and its capital."

 gg_ba.12.t:0 "Buenos Aires Remains Apart"
 gg_ba.12.d:0 "The war is over and the question stands where it stood. Buenos Aires keeps its port, its customs house and its government; the Confederation, its thirteen provinces and its capital at Paraná.\n\nBoth governments count their dead, pay off the campaign's debts and blame each other in the newspapers. In the ports the merchants go back to loading as if nothing had happened.\n\nNobody thinks this is the end. It is only the end of this war."
 gg_ba.12.f:0 "Two governments, and the same old question."
 gg_ba.12.a:0 "Until the next time."

 gg_ba.13.t:0 "The Other Government"
 gg_ba.13.d:0 "The government you served ceases to exist: its provinces, its troops and its men pass to the Republic that comes out of this war.\n\nThere is one government left for the whole Nation, and that is the one to lead now.\n\nWhat was lost in the field can be won in the cabinet."
 gg_ba.13.f:0 "A capital is lost; the Nation goes on."
 gg_ba.13.a:0 "Carry on from the government that remains."

 # 24/9/2026 (Juan): with two governments, Rosas's Buenos Aires and not Alsina's
 gg_ba.5.d_rosas:0 "At the end of 1854 the two governments came within a step of war. The merchants of the two ports averted it: they load at Buenos Aires and at Rosario, and will not pay twice for the same cargo.\n\nOn 8 January 1855, at Paraná, a treaty of coexistence is signed. Buenos Aires and the Confederation will stand together against an attack from abroad and against Indian raids; the merchant ships of both will fly the national flag, and there will be no customs houses between them.\n\nNobody expects it to last: Buenos Aires is still ruled by the same party Urquiza pronounced against. But for now ships load at both ports without paying twice."
 gg_ba.7.d_rosas:0 "On 20 May 1859 the Congress sitting at Paraná, 'provisional capital of the Argentine Confederation', authorises the President 'to resolve the question of national integrity with respect to the dissident province of Buenos Aires, by peaceful negotiation or by war, as circumstances may advise'.\n\nThe law lets him call out the national guards, enlarge the regular army and raise a navy. The minister Derqui put it plainly to the Chamber: the aim is 'to put an end to this state of affairs by reason or by force'.\n\nIn Buenos Aires the law is read as a declaration of war. The government of the city calls out the militias of the countryside and the frontier regiments, the same men who served the Pact for twenty years."
 gg_ba.8.d_rosas:0 "In the Cañada de Cepeda the Confederation's cavalry decided the day, and the army of Buenos Aires fell back by night. Urquiza advanced as far as San José de Flores and did not take the city by force.\n\nThe pact is signed on 11 November 1859: Buenos Aires declares itself an integral part of the Confederation, and the federal government takes over its customs house while guaranteeing the province its budget for five years. The government that spoke for every province for twenty years becomes one among fourteen.\n\nIts territory may not be divided without the consent of its Legislature. And a perpetual oblivion covers everything that caused the disunion."
 gg_ba.10.d_rosas:0 "On 22 August 1861 relations between Buenos Aires and the government at Paraná are broken off. What was signed at San José de Flores was not enough: each government accuses the other of breaking it, and in the provinces of the interior the parties are already killing each other in its name.\n\nIn Buenos Aires the federales of the city want back what they lost at Cepeda: the customs house and the province's voice. The militias of the countryside and the frontier regiments are under arms again.\n\nThe march would be on Santa Fe, as two years before. This time, they say in the city, there will be no Cepeda."
 gg_ba.10.d_apart_rosas:0 "On 22 August 1861 relations between Buenos Aires and the government at Paraná are broken off. No pact binds the two governments: each accuses the other of wanting war, and in the provinces of the interior the parties are already killing each other in its name.\n\nIn Buenos Aires the government of the city believes it can win: it has the port, the customs house and the credit the Confederation lacks. The militias of the countryside and the frontier regiments are under arms again.\n\nThe march would be on Santa Fe, on the road to Paraná."
 gg_ba.11.d_ba_rosas:0 "The city won the last war between Buenos Aires and the Confederation. The government at Paraná comes apart on its own: its ministers scatter, and the provinces send their dispatches to Buenos Aires again.\n\nThe Nation is remade as it stood before the Pronouncement, with Buenos Aires at its head and no constitution to bind it. The provinces keep their governors; what they lose is the government of their own they had at Paraná.\n\nIn Entre Ríos and in Corrientes nobody forgets what it cost. Those who pronounced in 1851 delegate again what they had reassumed."
 gg_ba.11.d_conf_rosas:0 "The last war between Buenos Aires and the Confederation ended without leaving the city the means to go on alone. Its deputies will take the seats its population gives them, and its customs house belongs to the Nation.\n\nThe city keeps its institutions and its Legislature. What it loses is the government that spoke for every province for twenty years, and the sum of public power that upheld it.\n\nThe porteño federales who dreamed of ruling again fall silent or take ship. The rest begin to look for their place in the government of all."
