l_english:

# EN: The Cerrito's buttons. Not foreign legions: the countryside, and the river. Sources in
#     ~/dev/juegos/victoria3-uruguay/SOURCES_french_legion.md, section 3.


 guerra_grande_river_blockade_button:0 "Close the River"
 guerra_grande_river_blockade_button_desc:0 "The siege line will never take Montevideo while the sea behind it stays open, for by sea come its flour, its powder and its customs revenue.\n\nWe ask Rosas to close the river, and Admiral William Brown's squadron is fitted out at Maldonado to serve the Cerrito (once only, provided Maldonado is ours). Should Rosas agree, every month the river stays shut tightens the noose on the city, brings it nearer to suing for peace and tips the war towards the #blue_value blancos#! — at the cost of the patience of the powers that back the Defensa. Should he refuse, we may ask again after a year."
 guerra_grande_requires_rosas:0 "The Confederation must still stand"
 guerra_grande_requires_river_unwatched:0 "Rosas must hold his shore of the Plata with its battery, with no foreign squadron intervening on the river"
 gg_plata_requires_no_guarantee:0 "The river must not be under the powers' guarantee (Rosas gave way to their ultimatum)"
 gg_plata_requires_no_refusal:0 "Rosas must not have refused the request within the past year"
 gg_cerrito_assembly_button:0 "Convene the Assembly"
 gg_cerrito_assembly_button_desc:0 "The chambers the Cerrito had elected in 1845 sit with the Constitution of 1830 in hand; since 1846 the plaza has been governed through an Assembly of Notables set up by decree. When Rosas proposed to ‘reunite the fatherland’, #b Oribe#! sent the proposal to a committee of those chambers, and the committee settled nothing. To convene them again is to let the Republic speak for itself."
 gg_cerrito_assembly_button_tt:0 "@information! Once only. The balance marks it in the blancos’ favour, and Buenos Aires, which expected something else of those chambers, marks it too."
 gg_cerrito_assembly_requires_once:0 "The Assembly must not have been convened already"
 gg_cerrito_assembly_requires_window:0 "It must be before July 1851"
