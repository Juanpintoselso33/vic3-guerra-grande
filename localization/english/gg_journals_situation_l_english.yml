 gg_ui_plata_leader_envoy_4:0 "#b London and Paris#!\n[Character.GetFullName]\n#b Southern#! has signed; #b Lepredour#! remains\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_phase_0:0 "@ships! Phase: #P The open river#!"
 gg_ui_plata_phase_0_tt:0 "Ships of every flag come and go. While the river stays open, Montevideo eats what the sea brings."
 gg_ui_plata_phase_1:0 "@ships! Phase: #N The blockade#!"
 gg_ui_plata_phase_1_tt:0 "Rosas has shut the river from the Buenos Aires shore, and foreign ships no longer reach Montevideo. Outside of truces, every month of a shut river squeezes the city and spends the patience of London and Paris.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_2:0 "@warning! Phase: #N The ultimatum#!"
 gg_ui_plata_phase_2_tt:0 "The ministers of London and Paris demand that the blockade be lifted, and Rosas owes them an answer.\n#b Effects#!: Argentina, prestige #N -10%#!."
 gg_ui_plata_phase_3:0 "@warning! Phase: #N The intervention#!"
 gg_ui_plata_phase_3_tt:0 "The powers' squadrons are in the river and blockade the port of Buenos Aires. The passage to Montevideo does not open by itself: it depends on what becomes of Brown's squadron and of Rosas's battery.\n#b Effects#!: Buenos Aires, trade capacity #N -10#!; the powers with a squadron in the river, infamy generation #N +10%#!."
 gg_ui_plata_phase_4:0 "@ships! Phase: #P The settlement#!"
 gg_ui_plata_phase_4_tt:0 "London and Paris have signed with Rosas and withdrawn their squadrons. If Rosas keeps the Buenos Aires shore and its battery, the river is in his hands again."
 gg_ui_plata_key_tt:0 "The passage is decided on the Buenos Aires shore: if Rosas holds it and keeps its battery, he can deny it to foreign flags. Without the battery, or in other hands, there is no closure. Montevideo does not shut the river: it lives off it."
 gg_war_ui_phase_1:0 "Phase: #b The revolution#!"
 gg_war_ui_phase_1_tt:0 "After Carpintería, where the ribbons were born, Rivera is in arms against Oribe's government.\n#b Effects#!: Uruguay, authority #N -10%#!."
 gg_war_ui_phase_2:0 "Phase: #b The war#!"
 gg_war_ui_phase_2_tt:0 "Oribe has left the government and fights from outside, with Rosas's forces; the colorados rule in Montevideo.\n#b Effects#!: Uruguay, army political strength #P +10%#!."
 gg_war_ui_phase_3:0 "Phase: #b Two governments#!"
 gg_war_ui_phase_3_tt:0 "The Defensa in Montevideo and the Cerrito in the countryside: each calls itself the lawful government.\n#b Effects#!: both, legitimacy #N -5#!."
 gg_war_ui_phase_4:0 "Phase: #b The truce#!"
 gg_war_ui_phase_4_tt:0 "Arms fall silent while terms are negotiated.\n#b Effects#!: both, war exhaustion from casualties #P -20%#!."
 gg_war_ui_phase_5:0 "Phase: #b The peace#!"
 gg_war_ui_phase_5_tt:0 "The war is over."
 gg_war_phase_revolution:0 "The revolution"
 gg_war_phase_revolution_desc:0 "A government with an army risen against it."
 gg_war_phase_war:0 "The war"
 gg_war_phase_war_desc:0 "In wartime the military chiefs weigh more in politics."
 gg_war_phase_siege:0 "Two governments"
 gg_war_phase_siege_desc:0 "Each calls itself the legal government of the Republic."
 gg_war_phase_truce:0 "The truce"
 gg_war_phase_truce_desc:0 "While terms are negotiated, casualties weigh less."
