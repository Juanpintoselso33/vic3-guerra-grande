 gg_ui_plata_leader_envoy_0:0 "#b London#!\n[Character.GetFullName]\nEnvoy: #b Ouseley#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
