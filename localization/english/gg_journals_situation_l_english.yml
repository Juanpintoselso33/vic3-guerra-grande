 gg_war_ui_leader_defensa:0 "#R The Defensa#!\n#b [Character.GetFullName]#!\n[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_war_ui_leader_cerrito:0 "#blue_value The Cerrito#!\n#b [Character.GetFullName]#!\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon]"
 gg_war_ui_rules_toggle:0 "The war, in detail"
 gg_siege_ui_about:0 "What the Great Siege was"
 gg_ui_plata_card_ba_tt:0 "For Rosas, the rivers belong to the Confederation and shutting them is his right. The blockade is his weapon against the city, and it suits Oribe: that is why the Cerrito asks for it. His limit is the patience of London and Paris."
 gg_ui_plata_card_mvd_tt:0 "The Defensa lives off its port: without ships there is neither bread nor customs revenue. It cannot open the river by itself, but it can call the squadrons: the patience of London and Paris runs out sooner, both powers commit more to the city for some years and, if it does so before 1845, it costs legitimacy."
 gg_ui_plata_short:0 "Rosas, while he holds the Buenos Aires shore and its battery, can shut the River Plate to foreign flags. Shutting it squeezes Montevideo and spends the patience of London and Paris."
 gg_ui_plata_shore_ba:0 "#b Buenos Aires shore#!\n[GetGlobalVariable('gg_plata_ba_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_shore_mvd:0 "#b Montevideo shore#!\n[GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_battery_yes:0 "#P Battery in place#!"
 gg_ui_plata_battery_no:0 "#N No battery#!"
 gg_ui_plata_passage_open:0 "#P Open#!"
 gg_ui_plata_passage_closed:0 "#N Closed#!"
 gg_ui_plata_more:0 "The question, in detail"
 gg_ui_plata_more_body:0 "#b Those with a stake in the river#!\n· #b Rosas#!: the rivers belong to the Confederation. He shuts the Plata from Buenos Aires to starve the city into surrender.\n· #b Oribe and the Cerrito#!: the siege by land is not enough while ships come in, and they ask Rosas to shut the river.\n· #b The Defensa#!: lives off its port and can call the squadrons.\n· #b London and Paris#!: want the rivers open to trade. They go from the diplomatic note to blockading the port of Buenos Aires, and they do not leave together: London signs first.\n· #b Brazil#!: backs the Defensa to keep Rosas away from its borders.\n· #b Urquiza#!: weighs with Rosas while he stands by him, and with the Defensa if he turns.\n\n#b The river in the war#!: the river keeps a single balance. Each shut month moves it towards the #blue_value blancos#! and each open month towards the #R colorados#!; every four months of balance weigh one point, up to #V 4#! a side. During a truce it does not move."
 gg_ui_plata_sec_river:0 "The passage of the river"
 gg_ui_plata_sec_sides:0 "Face to face"
 gg_ui_plata_sec_clocks:0 "The clocks"
 gg_ui_plata_shore_ba_tt:0 "The Buenos Aires battery, in Rosas's hands, is the only thing that can shut the river. If he loses it, there is no blockade until he gets it back."
 gg_ui_plata_shore_mvd_tt:0 "Montevideo does not shut the river: it lives off it. By sea come the flour, the powder and the customs money that keep it standing behind its line."
 gg_ui_plata_supply_yes:0 "#P Ships arriving#!"
 gg_ui_plata_supply_no:0 "#N No ships arriving#!"
 gg_ui_plata_card_powers_tt:0 "In London and Paris, the merchants want the Paraná and the Uruguay open, and the cabinets want no war. While Rosas keeps their friendship they bear the blockade; once he loses it, they send him their ministers and, if he does not yield, their squadrons."
