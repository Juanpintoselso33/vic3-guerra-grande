l_english:
 gg_plata_patience_bar:0 "The patience of London and Paris"
 gg_plata_patience_bar_desc:0 "#V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! months of a shut river. They add up even if the river opens in between, and during a truce the count stops. At #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#! (#V 12#! if the Defensa called the squadrons), with the war between the two Oriental governments already open and London or Paris no longer cordial towards Rosas, their ministers demand that he lift the blockade."
 gg_plata_hunger_bar:0 "The city's hunger"
 gg_plata_hunger_bar_desc:0 "#V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! months in a row without a foreign ship coming in. A month of open river sets the count back to zero, and during a truce it stops. At #V [GetPlayer.MakeScope.ScriptValue('gg_plata_hunger_threshold')|0]#! (#V 12#! from 1851), hunger puts the Defensa in a position to treat for peace with the Cerrito."
 gg_plata_phase_blockade:0 "The blockade of the port"
 gg_plata_phase_blockade_desc:0 "No foreign ship comes in and the city eats what it has."
 gg_plata_phase_ultimatum:0 "The powers' ultimatum"
 gg_plata_phase_ultimatum_desc:0 "London and Paris demand the blockade be lifted, and the whole region watches what Buenos Aires answers."
 gg_plata_phase_intervention_port:0 "Buenos Aires blockaded"
 gg_plata_phase_intervention_port_desc:0 "The Anglo-French squadrons shut Rosas's port."
 gg_plata_phase_intervention_powers:0 "The intervention in the Plata"
 gg_plata_phase_intervention_powers_desc:0 "An undeclared war against an American government: the other cabinets take note."
 gg_ui_plata_versus:0 "vs"
