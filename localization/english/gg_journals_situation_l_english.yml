 gg_war_ui_leader_defensa:0 "#R The Defensa#!\n#b [Character.GetFullName]#!"
 gg_war_ui_leader_cerrito:0 "#blue_value The Cerrito#!\n#b [Character.GetFullName]#!"
 gg_war_ui_exhaustion:0 "Exhaustion: #blue_value Cerrito#! #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#!/3 · #R Defensa#! #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#!/3"
 gg_war_ui_exhaustion_tt:0 "Months in a row with war support at #N -25#! or worse. At #V 3#!, that government must negotiate."
 gg_war_ui_rules_toggle:0 "How this war is reckoned"
 gg_siege_ui_about:0 "What the Great Siege was"
 gg_ui_plata_card_ba_tt:0 "#b Buenos Aires wins the question#! if the city surrenders to hunger: #V 24#! months of a shut river in a row (#V 12#! from 1851), before London and Paris run out of patience.\n\n#b Who backs each Oriental government#! (0 to 100):\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!"
 gg_ui_plata_card_mvd_tt:0 "#b Montevideo wins the question#! if the river opens again: because Rosas lifts the blockade, or because he loses the means to hold it. While ships come in, the city holds.\n\n#b Who backs each Oriental government#! (0 to 100):\nFrance #V [GetGlobalVariable('gg_patron_francia').GetValue|0]#! · Great Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|0]#! · Brazil #V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!"
 gg_ui_plata_short:0 "The River Plate is governed from its two shores: the one that keeps its battery can close it to foreign ships."
 gg_ui_plata_shore_ba:0 "#b Buenos Aires shore#!\n[GetGlobalVariable('gg_plata_ba_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_shore_mvd:0 "#b Montevideo shore#!\n[GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_battery_yes:0 "#P Battery manned#!"
 gg_ui_plata_battery_no:0 "#N No battery#!"
 gg_ui_plata_passage_open:0 "#P Open#!"
 gg_ui_plata_passage_closed:0 "#N Closed#!"
 gg_ui_plata_more:0 "The question, in detail"
 gg_ui_plata_more_body:0 "#b Buenos Aires wins the question#! if the city surrenders to hunger: #V 24#! months of a shut river in a row (#V 12#! from 1851), before London and Paris run out of patience.\n\n#b Montevideo wins the question#! if the river opens again: because Rosas lifts the blockade, or because he loses the means to hold it. While ships come in, the city holds.\n\n#b The river in the war#!: from the split, every four months of a shut river are worth a point to the #blue_value blancos#!, and every four open, one to the #R colorados#!, up to #V 4#! a side."
 gg_ui_plata_sec_river:0 "The passage of the river"
 gg_ui_plata_sec_sides:0 "Face to face"
 gg_ui_plata_sec_clocks:0 "The clocks"
