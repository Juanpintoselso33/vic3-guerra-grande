 gg_plata_patience_bar_desc:0 "The patience of London and Paris: #V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! months of a shut river out of #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#!"
 gg_plata_hunger_bar:0 "Towards the city's surrender"
 gg_plata_hunger_bar_desc:0 "Montevideo's hunger: #V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! months of a shut river in a row out of #V [GetPlayer.MakeScope.ScriptValue('gg_plata_hunger_threshold')|0]#!"
 gg_plata_phase_blockade:0 "The blockade of the port"
 gg_plata_phase_blockade_desc:0 "No foreign ship comes in and the city eats what it has."
 gg_plata_phase_ultimatum:0 "The powers' ultimatum"
 gg_plata_phase_ultimatum_desc:0 "London and Paris demand the blockade be lifted, and the whole region watches what Buenos Aires answers."
 gg_plata_phase_intervention_port:0 "Buenos Aires blockaded"
 gg_plata_phase_intervention_port_desc:0 "The Anglo-French squadrons shut Rosas's port."
 gg_plata_phase_intervention_powers:0 "The intervention in the Plata"
 gg_plata_phase_intervention_powers_desc:0 "An undeclared war against an American government: the other cabinets take note."
