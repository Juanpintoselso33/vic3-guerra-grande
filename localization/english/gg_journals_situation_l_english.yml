l_english:
 gg_plata_patience_bar:0 "Towards the ultimatum"
 gg_plata_patience_bar_desc:0 "The patience of London and Paris: #V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! months of a shut river out of #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#!"
 gg_plata_hunger_bar:0 "Towards the city's surrender"
 gg_plata_hunger_bar_desc:0 "Montevideo's hunger: #V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! months of a shut river in a row out of #V [GetPlayer.MakeScope.ScriptValue('gg_plata_hunger_threshold')|0]#!"
 gg_plata_phase_blockade:0 "The blockade of the port"
 gg_plata_phase_blockade_desc:0 "No foreign ship comes in and the city eats what it has."
 gg_plata_phase_ultimatum:0 "The powers' ultimatum"
 gg_plata_phase_ultimatum_desc:0 "London and Paris demand the blockade be lifted, and the whole region watches what Buenos Aires answers."
 gg_plata_phase_intervention_port:0 "Buenos Aires blockaded"
 gg_plata_phase_intervention_port_desc:0 "The Anglo-French squadrons shut Rosas's port."
 gg_plata_phase_intervention_powers:0 "The intervention in the Plata"
 gg_plata_phase_intervention_powers_desc:0 "An undeclared war against an American government: the other cabinets take note."
 gg_ui_plata_role_involved:0 "#b You are involved in the River Plate Question#!"
 gg_ui_plata_role_outsider:0 "#b You follow the River Plate Question from outside#!"
 gg_ui_plata_versus:0 "vs"
 gg_ui_plata_leader_rosas:0 "#b Buenos Aires#!\n[Character.GetFullName]"
 gg_ui_plata_leader_defensa:0 "#b Montevideo#!\n[Character.GetFullName]"
 gg_ui_plata_leader_envoy_0:0 "#b London#!\n[Character.GetFullName]\nEnvoy: #b Ouseley#!"
 gg_ui_plata_leader_envoy_1:0 "#b London#!\n[Character.GetFullName]\nEnvoy: #b Hood#!"
 gg_ui_plata_leader_envoy_2:0 "#b London#!\n[Character.GetFullName]\nEnvoy: #b Howden#!"
 gg_ui_plata_leader_envoy_3:0 "#b London#!\n[Character.GetFullName]\nEnvoys: #b Gore and Gros#!"
 gg_ui_plata_leader_envoy_4:0 "#b London#!\n[Character.GetFullName]\nEnvoy: #b Southern#!"
 gg_ui_plata_win_buenos_aires:0 "@information! What Buenos Aires wins"
 gg_ui_plata_win_buenos_aires_tt:0 "#b Buenos Aires wins the question#! if the city surrenders to hunger: #V 24#! months of a shut river in a row (#V 12#! from 1851), before London and Paris run out of patience."
 gg_ui_plata_win_montevideo:0 "@information! What Montevideo wins"
 gg_ui_plata_win_montevideo_tt:0 "#b Montevideo wins the question#! if the river opens again: because Rosas lifts the blockade, or because he loses the means to hold it. While ships come in, the city holds."
 gg_ui_plata_phase_0:0 "@ships! Phase: #P The open river#!"
 gg_ui_plata_phase_0_tt:0 "Ships come and go past both banks. Nobody claims anything."
 gg_ui_plata_phase_1:0 "@ships! Phase: #N The blockade#!"
 gg_ui_plata_phase_1_tt:0 "Rosas shuts the river from his bank, and the most severe bank rules.\n#b Effects#!: Montevideo, mortality #N +5%#!. Each month adds to the powers' patience and to the city's hunger."
 gg_ui_plata_phase_2:0 "@warning! Phase: #N The ultimatum#!"
 gg_ui_plata_phase_2_tt:0 "London and Paris demand the blockade be lifted and wait for an answer.\n#b Effects#!: Argentina, prestige #N -10%#! while it lasts."
 gg_ui_plata_phase_3:0 "@warning! Phase: #N The intervention#!"
 gg_ui_plata_phase_3_tt:0 "The squadrons are in the river.\n#b Effects#!: Buenos Aires, trade capacity #N -10#!; Britain and France, infamy generation #N +10%#!."
 gg_ui_plata_phase_4:0 "@ships! Phase: #P The settlement#!"
 gg_ui_plata_phase_4_tt:0 "London and Paris have settled with Rosas and the squadrons are gone."
 gg_ui_plata_faction_ba:0 "#b Buenos Aires faction#!\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_cerrito').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_faction_mvd:0 "#b Montevideo faction#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_faction_ba_alone:0 "#b Buenos Aires faction#!\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_faction_ba_tt:0 "#b Who backs each Oriental government#! (0 to 100):\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!"
 gg_ui_plata_faction_mvd_tt:0 "#b Who backs each Oriental government#! (0 to 100):\nFrance #V [GetGlobalVariable('gg_patron_francia').GetValue|0]#! · Great Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|0]#! · Brazil #V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!"
 gg_ui_plata_key:0 "@ships! #b The key to the river#!: Buenos Aires shore [GetGlobalVariable('gg_plata_ba_owner').GetCountry.GetFlagTextIcon] #b [GetGlobalVariable('gg_plata_ba_owner').GetCountry.GetName]#! · Montevideo shore [GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetFlagTextIcon] #b [GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetName]#!"
 gg_ui_plata_key_tt:0 "Passage up the river is governed from its two shores. A shore with its battery can deny passage to foreign ships; without the battery, or in other hands, it no longer closes it."
 gg_ui_plata_forts_0:0 "Batteries: #N neither shore keeps its own#!"
 gg_ui_plata_forts_1:0 "Batteries: #b Buenos Aires#! keeps its own; #N Montevideo does not#!"
 gg_ui_plata_forts_2:0 "Batteries: #b Montevideo#! keeps its own; #N Buenos Aires does not#!"
 gg_ui_plata_forts_3:0 "Batteries: #b both shores#! keep their own"
 gg_ui_pact_accounts_title:0 "#b Buenos Aires's accounts with the Cerrito#!"
 gg_war_ui_sources:0 "#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_ui_sources_tt:0 "Each decision adds what its document says; the river adds or subtracts as it is shut or open.\n\n#b The patrons#! sustain each government's war support, not the balance:\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · France #V [GetGlobalVariable('gg_patron_francia').GetValue|0]#! · Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|0]#! · Brazil #V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!"
 gg_war_ui_sources_partition:0 "The split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! colorados (the new war starts with half the lead)"
 gg_war_ui_exhaustion_cerrito:0 "#blue_value Cerrito exhaustion#!: #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#!/3"
 gg_war_ui_exhaustion_defensa:0 "#R Defensa exhaustion#!: #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#!/3"
 gg_war_ui_phase_0:0 "Phase: #b The prelude#!"
 gg_war_ui_phase_0_tt:0 "Oribe governs; Rivera has not risen yet."
 gg_war_ui_phase_1:0 "Phase: #b The revolution#!"
 gg_war_ui_phase_1_tt:0 "Rivera in arms against Oribe's government.\n#b Effects#!: Uruguay, authority #N -10%#!."
 gg_war_ui_phase_2:0 "Phase: #b The war#!"
 gg_war_ui_phase_2_tt:0 "Rivera governs and Oribe fights from outside with Rosas's forces.\n#b Effects#!: Uruguay, army political strength #P +10%#!."
 gg_war_ui_phase_3:0 "Phase: #b The Siege#!"
 gg_war_ui_phase_3_tt:0 "Two governments, each the legal one: the Defensa in Montevideo, the Cerrito in the rest of the country.\n#b Effects#!: both, legitimacy #N -5#!."
 gg_war_ui_phase_4:0 "Phase: #b The truce#!"
 gg_war_ui_phase_4_tt:0 "Arms fall silent while terms are negotiated.\n#b Effects#!: both, war exhaustion from casualties #P -20%#!."
 gg_war_ui_phase_5:0 "Phase: #b The peace#!"
 gg_war_ui_phase_5_tt:0 "The war is over."
 gg_war_phase_revolution:0 "The revolution"
 gg_war_phase_revolution_desc:0 "A government with an army risen against it."
 gg_war_phase_war:0 "The war"
 gg_war_phase_war_desc:0 "In wartime the military chiefs weigh more in politics."
 gg_war_phase_siege:0 "Two governments"
 gg_war_phase_siege_desc:0 "Each calls itself the legal government of the Republic."
 gg_war_phase_truce:0 "The truce"
 gg_war_phase_truce_desc:0 "While terms are negotiated, casualties weigh less."
 gg_ui_siege_col_plaza:0 "#R The city#!"
 gg_ui_siege_col_campo:0 "#blue_value The countryside#!"
 gg_ui_siege_leader_besieger:0 "#b Besieges#!\n[Character.GetFullName]"
 gg_ui_siege_leader_defender:0 "#b Defends the city#!\n[Character.GetFullName]"
 gg_ui_siege_leader_government:0 "#b Government of the Defensa#!\n[Character.GetFullName]"
