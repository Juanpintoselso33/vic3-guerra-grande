 gg_ui_plata_leader_envoy_3:0 "#b London#!\n[Character.GetFullName]\nEnvoys: #b Gore and Gros#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_4:0 "#b London#!\n[Character.GetFullName]\nEnvoy: #b Southern#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_phase_0:0 "@ships! Phase: #P The open river#!"
 gg_ui_plata_phase_0_tt:0 "Ships come and go past both banks. Nobody claims anything."
 gg_ui_plata_phase_1:0 "@ships! Phase: #N The blockade#!"
 gg_ui_plata_phase_1_tt:0 "Rosas shuts the river from his bank, and the most severe bank rules.\n#b Effects#!: Montevideo, mortality #N +5%#!. Each month adds to the powers' patience and to the city's hunger."
 gg_ui_plata_phase_2:0 "@warning! Phase: #N The ultimatum#!"
 gg_ui_plata_phase_2_tt:0 "London and Paris demand the blockade be lifted and wait for an answer.\n#b Effects#!: Argentina, prestige #N -10%#! while it lasts."
 gg_ui_plata_phase_3:0 "@warning! Phase: #N The intervention#!"
 gg_ui_plata_phase_3_tt:0 "The squadrons are in the river.\n#b Effects#!: Buenos Aires, trade capacity #N -10#!; Britain and France, infamy generation #N +10%#!."
 gg_ui_plata_phase_4:0 "@ships! Phase: #P The settlement#!"
 gg_ui_plata_phase_4_tt:0 "London and Paris have settled with Rosas and the squadrons are gone."
 gg_ui_plata_key_tt:0 "Passage up the river is governed from its two shores. A shore with its battery can deny passage to foreign ships; without the battery, or in other hands, it no longer closes it."
 gg_war_ui_phase_0:0 "Phase: #b The prelude#!"
 gg_war_ui_phase_0_tt:0 "Oribe governs; Rivera has not risen yet.\n\n#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_ui_phase_1:0 "Phase: #b The revolution#!"
 gg_war_ui_phase_1_tt:0 "Rivera in arms against Oribe's government.\n#b Effects#!: Uruguay, authority #N -10%#!.\n\n#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_ui_phase_2:0 "Phase: #b The war#!"
 gg_war_ui_phase_2_tt:0 "Rivera governs and Oribe fights from outside with Rosas's forces.\n#b Effects#!: Uruguay, army political strength #P +10%#!.\n\n#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_ui_phase_3:0 "Phase: #b The Siege#!"
 gg_war_ui_phase_3_tt:0 "Two governments, each the legal one: the Defensa in Montevideo, the Cerrito in the rest of the country.\n#b Effects#!: both, legitimacy #N -5#!.\n\n#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_ui_phase_4:0 "Phase: #b The truce#!"
 gg_war_ui_phase_4_tt:0 "Arms fall silent while terms are negotiated.\n#b Effects#!: both, war exhaustion from casualties #P -20%#!.\n\n#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_ui_phase_5:0 "Phase: #b The peace#!"
 gg_war_ui_phase_5_tt:0 "The war is over.\n\n#b What moved the balance last month#!\nDecisions: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nThe split: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nThe river weighs #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! today (positive for the blancos)"
 gg_war_phase_revolution:0 "The revolution"
 gg_war_phase_revolution_desc:0 "A government with an army risen against it."
 gg_war_phase_war:0 "The war"
 gg_war_phase_war_desc:0 "In wartime the military chiefs weigh more in politics."
 gg_war_phase_siege:0 "Two governments"
 gg_war_phase_siege_desc:0 "Each calls itself the legal government of the Republic."
 gg_war_phase_truce:0 "The truce"
 gg_war_phase_truce_desc:0 "While terms are negotiated, casualties weigh less."
