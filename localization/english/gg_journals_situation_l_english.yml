l_english:
 gg_plata_patience_bar:0 "The Powers' Patience"
 gg_plata_patience_bar_desc:0 "#V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! months with the river shut. They keep adding up even if the river opens in between, and the count stops during a truce. At #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#! (#V 12#! if the Defensa has called in the squadrons) — provided the war between the two Oriental governments has broken out and London or Paris is no longer on cordial terms with Rosas — their ministers will demand that he lift the blockade. Only the powers that back the Defensa count (see ‘The Backers’ in The Guerra Grande): a Protector only alongside the other, a Guarantor even alone."
 gg_plata_hunger_bar:0 "Hunger in the City"
 gg_plata_hunger_bar_desc:0 "#V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! months running without a foreign ship making port. A single month with the river open resets the count, and it stops during a truce. At #V [GetPlayer.MakeScope.ScriptValue('gg_plata_hunger_threshold')|0]#! (#V 12#! from 1851), hunger brings the Defensa to the point of treating with the Cerrito."
 gg_plata_phase_blockade:0 "The Port under Blockade"
 gg_plata_phase_blockade_desc:0 "No foreign ship makes port, and the city lives on what it has."
 gg_plata_phase_ultimatum:0 "The Powers’ Ultimatum"
 gg_plata_phase_ultimatum_desc:0 "The powers that back the Defensa demand that the blockade be lifted, and the whole region waits to see how Buenos Aires replies."
 gg_plata_phase_intervention_port:0 "Buenos Aires under Blockade"
 gg_plata_phase_intervention_port_desc:0 "Foreign squadrons are blockading Rosas's port."
 gg_plata_phase_intervention_powers:0 "Intervention in the Plata"
 gg_plata_phase_intervention_powers_desc:0 "An undeclared war on an American government: the other cabinets take note."
 gg_ui_plata_versus:0 "vs"
 gg_ui_plata_leader_rosas:0 "#b The Buenos Aires Government#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_cerrito').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_defensa:0 "#b The Defensa#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_0:0 "#b London and Paris#!\n[Character.GetFullName]\nEnvoys: #b Ouseley and Deffaudis#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_1:0 "#b London and Paris#!\n[Character.GetFullName]\nEnvoy: #b Hood#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_2:0 "#b London and Paris#!\n[Character.GetFullName]\nEnvoys: #b Howden and Walewski#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_3:0 "#b London and Paris#!\n[Character.GetFullName]\nEnvoys: #b Gore and Gros#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_4:0 "#b London and Paris#!\n[Character.GetFullName]\n#b Southern#! has signed; #b Lepredour#! remains\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_phase_0:0 "@ships! Phase: #P Free Navigation#!"
 gg_ui_plata_phase_0_tt:0 "Foreign ships make port. While the river stays open, Montevideo lives on what the sea brings."
 gg_ui_plata_phase_1:0 "@ships! Phase: #N Blockade#!"
 gg_ui_plata_phase_1_tt:0 "Rosas has closed the river from the Buenos Aires shore, and foreign ships no longer reach Montevideo. Every month it stays shut deepens the city's hunger and wears down the patience of London and Paris.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_2:0 "@warning! Phase: #N Ultimatum#!"
 gg_ui_plata_phase_2_tt:0 "The ministers of London and Paris have demanded that the blockade be lifted, and Rosas owes them an answer.\n#b Effects#!: Argentina, prestige #N -10%#!; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_phase_3:0 "@warning! Phase: #N Anglo-French Intervention#!"
 gg_ui_plata_phase_3_tt:0 "The powers' squadrons are on the river, blockading the port of Buenos Aires. That does not reopen the way to Montevideo by itself: much depends on what becomes of Brown's squadron and of Rosas's battery.\n#b Effects#!: Buenos Aires, trade capacity #N -10#!; each power with a squadron on the river, infamy generation #N +10%#!; the Defensa, #V 4#! frigates lent by the powers, their stores paid for by France; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_phase_4:0 "@ships! Phase: #P Peace with Rosas#!"
 gg_ui_plata_phase_4_tt:0 "London and Paris have come to terms with Rosas, withdrawn their squadrons and recognised his right of blockade. If Rosas still holds the Buenos Aires shore and its battery, the river is his to command once more, and a fresh closure no longer brings the squadrons."
 gg_ui_plata_key_tt:0 "The passage is decided on the Buenos Aires shore: if Rosas holds it and keeps its battery, he can close it to foreign flags. Without the battery, or with the shore in other hands, the river cannot be closed. Montevideo does not close the river; it lives off it."
 gg_war_ui_phase_1:0 "Phase: #b Rivera's Rising#!"
 gg_war_ui_phase_1_tt:0 "Since Carpintería, where the colours of the two parties were born, Rivera has been in arms against Oribe's government.\n#b Effects#!: Uruguay, authority #N -10%#!."
 gg_war_ui_phase_2:0 "Phase: #b Open War#!"
 gg_war_ui_phase_2_tt:0 "Oribe has given up the presidency and fights on from abroad, with Rosas's troops; the colorados govern in Montevideo.\n#b Effects#!: Uruguay, army political strength #P +10%#!."
 gg_war_ui_phase_3:0 "Phase: #b Two Governments#!"
 gg_war_ui_phase_3_tt:0 "The Defensa in Montevideo, the Cerrito in the countryside: each claims to be the lawful government.\n#b Effects#!: both, legitimacy #N -5#!."
 gg_war_ui_phase_4:0 "Phase: #b Truce#!"
 gg_war_ui_phase_4_tt:0 "The guns fall silent while terms are negotiated.\n#b Effects#!: both governments regain endurance, #P +5#! a month; should it come to fighting, war exhaustion from casualties #P -20%#!."
 gg_war_ui_phase_5:0 "Phase: #b Peace#!"
 gg_war_ui_phase_5_tt:0 "The war is over."
 gg_war_phase_revolution:0 "Revolution"
 gg_war_phase_revolution_desc:0 "A government with an army in arms against it."
 gg_war_phase_war:0 "Open War"
 gg_war_phase_war_desc:0 "In wartime, the generals carry more weight in politics."
 gg_war_phase_siege:0 "Two Governments"
 gg_war_phase_siege_desc:0 "Each claims to be the lawful government of the Republic."
 gg_war_phase_truce:0 "Truce"
 gg_war_phase_truce_desc:0 "While terms are discussed, nobody fights: both governments recover #P 5#! endurance a month."

 gg_war_ui_leader_colorado:0 "#R Colorados#!\n#b [Character.GetFullName]#!"
 gg_war_ui_leader_blanco:0 "#blue_value Blancos#!\n#b [Character.GetFullName]#!"
 gg_war_ui_leader_defensa:0 "#R The Defensa#!\n#b [Character.GetFullName]#!\n[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_war_ui_leader_cerrito:0 "#blue_value The Cerrito#!\n#b [Character.GetFullName]#!\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon]"
 gg_war_ui_rules_toggle:0 "The War in Detail"
 gg_ui_plata_card_ba_tt:0 "To Rosas, the rivers belong to the Confederation and closing them is his right. The blockade is his weapon against the city, and it suits Oribe, which is why the Cerrito asks for it. The limit is the patience of the powers that back the Defensa."
 gg_ui_plata_card_mvd_tt:0 "The Defensa lives off its port: without ships there is neither bread nor customs revenue. It cannot reopen the river on its own, but it can call in the squadrons: the patience of the powers that back the Defensa then runs out sooner, London and Paris bind themselves more closely to the city, and doing so before 1845 costs legitimacy for some years."
 gg_ui_plata_short:0 "So long as Rosas holds the Buenos Aires shore and its battery, he can close the River Plate to foreign flags. Closing it squeezes Montevideo and, once the war is open, wears down the patience of the powers that back the Defensa."
 gg_ui_plata_shore_ba:0 "#b Buenos Aires shore#!\n[GetGlobalVariable('gg_plata_ba_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_shore_mvd:0 "#b Montevideo shore#!\n[GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_battery_yes:0 "#P Battery in place#!"
 gg_ui_plata_battery_no:0 "#N No battery#!"
 gg_ui_plata_passage_open:0 "#P Open#!"
 gg_ui_plata_passage_closed:0 "#N Closed#!"
 gg_ui_plata_more:0 "The Question in Detail"
 gg_ui_plata_more_body:0 "#b Who Has a Stake in the River#!\n· #b Rosas#!: the rivers belong to the Confederation. He closes the Plata from Buenos Aires to starve the city into surrender.\n· #b Oribe and the Cerrito#!: a siege by land cannot succeed while ships still come in, so they ask Rosas to close the river.\n· #b The Defensa#!: lives off its port and can call in the squadrons.\n· #b London and Paris#!: want the rivers open to trade. They move from diplomatic notes to blockading the port of Buenos Aires, and they do not always act together: at times Paris goes on alone.\n· #b Brazil#!: backs the Defensa once it commits itself, to keep Rosas away from its borders; before 1850 it looks on from outside.\n· #b Urquiza#!: counts for Rosas while he stands by him, and for the Defensa if he changes sides. The Littoral wants to navigate the Paraná: a river closed after the powers' settlement costs Rosas Urquiza's goodwill.\n\n#b The River and the War#!: the river keeps a single running balance. Each month it is shut moves it towards the #blue_value blancos#!, each month it is open towards the #R colorados#!; every four months on balance count as one point, up to #V 4#! a side while it lasts. During the siege, every four months beyond that cap stay on the war's account, up to #V [JournalEntry.MakeScope.ScriptValue('gg_siege_river_bank_cap')|0]#! points a side. It does not move during a truce."
 gg_ui_plata_sec_river:0 "The Passage of the River"
 gg_ui_plata_sec_sides:0 "Face to Face"
 gg_ui_plata_sec_clocks:0 "Running Out"
 gg_ui_plata_shore_ba_tt:0 "The Buenos Aires battery, in Rosas's hands, is the only thing that can close the river. If he loses it, there can be no blockade until he recovers it."
 gg_ui_plata_shore_mvd_tt:0 "Montevideo does not close the river; it lives off it. By sea come the flour, the powder and the customs revenue that keep it standing behind its lines."
 gg_ui_plata_supply_yes:0 "#P Ships getting through#!"
 gg_ui_plata_supply_no:0 "#N No ships getting through#!"
 gg_ui_plata_card_powers_tt:0 "In London and Paris, the merchants want the Paraná and the Uruguay open, and the cabinets want no war. As long as Rosas keeps their goodwill, they put up with the blockade; once he loses it, they send him their ministers and, if he will not give way, their squadrons."
 gg_ui_plata_word_guarantee:0 "#b River guaranteed by London and Paris#!: the Cerrito cannot ask for it to be closed."
 gg_ui_plata_word_guarantee_tt:0 "Rosas gave way to the ultimatum. While the guarantee holds, the Cerrito cannot ask him to close the river, and if Rosas closes it all the same the squadrons sail in at once, with no fresh ultimatum. The guarantee ends when London comes to terms with Rosas and recognises his right of blockade."
 gg_ui_plata_word_paris:0 "#b River guaranteed by Paris alone#!: the Cerrito cannot ask for it to be closed."
 gg_ui_plata_word_paris_tt:0 "London stayed out, and Rosas gave way to the French ultimatum. If Rosas closes the river, the French squadron sails in at once. The guarantee ends when Paris, too, comes to terms with Rosas and recognises his right of blockade, provided no ultimatum is pending."
 gg_ui_plata_word_london:0 "#b London has recognised the right of blockade#!: only Paris's patience counts."
 gg_ui_plata_word_london_tt:0 "As in the Arana–Southern treaty, London recognises Argentine sovereignty over its rivers and its right of blockade. A closure now wears only on Paris's patience, until Paris comes to terms with Rosas as well, provided no ultimatum is pending."
 gg_ui_plata_word_settled:0 "#b London and Paris have recognised the right of blockade#!: no closure brings the squadrons back."
 gg_ui_plata_word_settled_tt:0 "Both powers have come to terms with Rosas and recognised his right of blockade. If Rosas closes the river again it tightens the siege and counts towards the hunger, but no squadron returns."
 gg_plata_patience_bar_desc_france:0 "#V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! months of a closed river. They add up even if the river opens in between, and the count stops during a truce. London keeps out of the question: at #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#! (#V 12#! if the Defensa called in the squadrons), with the war between the two Oriental governments under way and Paris no longer on cordial terms with Rosas, the French minister demands that he lift the blockade, provided France stands Guarantor: a Protector on her own makes no demand."
 gg_ui_plata_phase_3_france:0 "@warning! Phase: #N French Intervention#!"
 gg_ui_plata_phase_3_france_tt:0 "The French squadron is in the river and blockades the port of Buenos Aires; London is out of it. So long as Rosas holds his shore and its battery, he can keep the way to Montevideo closed.\n#b Effects#!: Buenos Aires, trade capacity #N -10#!; France, infamy generation #N +10%#!; the Defensa, #V 4#! frigates lent by France, their stores at her expense; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_leader_defensa_france:0 "#b The Defensa#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_phase_2_france_tt:0 "London keeps out of the question; the minister from Paris demands that the blockade be lifted, and Rosas owes him an answer.\n#b Effects#!: Argentina, prestige #N -10%#!; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_leader_defensa_nobrz:0 "#b The Defensa#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_defensa_france_nobrz:0 "#b The Defensa#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon]"
 gg_plata_hunger_bar_desc_fixed:0 "#V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! months running without a foreign ship making port. A single month with the river open resets the count, and it stops during a truce. In this war hunger tightens its grip on the city, but does not bring it to the table."
 gg_plata_patience_bar_desc_brazil:0 "#V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! months of a closed river since London and Paris signed. They add up even if the river opens in between, and the count stops during a truce. The #b Empire of Brazil#! is counting now: at #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#!, with the war between the two Oriental governments still open, its squadron forces the passage and the Buenos Aires shore loses its battery."
