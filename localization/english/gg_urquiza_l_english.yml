l_english:
 gg_urquiza.1.t:0 "The Representation of Entre Ríos"
 gg_urquiza.1.d:0 "A letter from the governor of Entre Ríos reaches Palermo. It is addressed to Dr. Rufino de Elizalde, but asks that it be kept from everyone "with the single exception of General Rosas": it is meant for the Restorer, and it is no courtesy.\n\nUrquiza does not withdraw the mandate for foreign relations; he lists grievances. That the #b Gaceta Mercantil#! loses sight of the merits of the army of Entre Ríos and gives Arroyo Grande to Oribe and Pacheco alone. That Dr. Baldomero García, before the Chamber on 2 November, did not name him "beside the illustrious General Oribe and the intrepid General Pacheco". That Entre Ríos "has lavished the gold of its province and the glorious blood of its soldiers" for the Federal Cause and is "unheard every time it makes a claim", as over the export of gold. And that the port captain takes a declaration from the skippers of every ship coming from his province, "as if it were held an enemy of the principles of the national cause".\n\nHe asks for public redress, and he asks in writing. In the Government House they know what an unanswered representation means."
 gg_urquiza.1.f:0 "Entre Ríos still delegates; now it also asks."
 gg_urquiza.1.a:0 "Hear the representation: let the Gaceta correct itself and the port leave the ships of Entre Ríos in peace."
 gg_urquiza.1.b:0 "A province does not give orders to the one entrusted with foreign relations."
 gg_urquiza.1.a_tt:0 "@information! The representation is answered: #b one grievance#! of those Entre Ríos has pending is settled, and #b Urquiza#!'s backing rises by #P 10#!. In San José it is noted that Buenos Aires replied.\n#grey Entre Ríos's discontent, when the letter arrived, stood at #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!: pushed up by open grievances (Alcaraz, the orders of 1850, the Congress put off, each claim unanswered, a Brazil free to intervene); held down by a Guerra Grande won, the Banda Oriental in the Confederation, a Brazil beaten and a Litoral that delegates.#!"
 gg_urquiza.1.b_tt:0 "@warning! The representation goes unanswered: #b one grievance#! is added to Entre Ríos's account, and #b Urquiza#!'s backing falls by #N 10#!. What today is a letter #b may become a pronouncement#!."
 gg_urquiza.1.a_far_tt:0 "@information! The representation is answered, and #b Urquiza#!'s backing rises by #P 10#!. In San José it is noted that Buenos Aires replied."
 gg_urquiza.1.b_far_tt:0 "@warning! The representation goes unanswered, and #b Urquiza#!'s backing falls by #N 10#!. What today is a letter #b may become a pronouncement#!."
 gg_urquiza.2.t:0 "Urquiza Alone"
 gg_urquiza.2.d:0 "The governor of Entre Ríos has pronounced, but he has pronounced alone. There is no besieged government in Montevideo looking for allies against the Restorer, and in Rio de Janeiro nobody signs conventions about the Plata with a man who cannot guarantee them.\n\nUrquiza has his province, his cavalry and whatever Corrientes cares to give him. Against him stand the armies of the Confederation, which have no other war left to fight."
 gg_urquiza.2.f:0 "A pronouncement without a convention is a gamble."
 gg_urquiza.2.a:0 "Let the Litoral know."
 gg_urquiza.2.a_tt:0 "@information! The war with Entre Ríos is the one the pronouncement opened, without foreign contingents. When it ends, the Pact is decided by its outcome."
 gg_urquiza.4.t:0 "Urquiza, Between Oribe and Rosas"
 gg_urquiza.4.d:0 "In San José, #b Rosas#!'s annual resignation of the charge of foreign relations lies on the table, the one he offers every year certain it will be handed back. The Legislature awaits Your Excellency's word. But on the other bank there is no siege left: #b Oribe#! governs the Republic, a friend of the Restorer, and in Montevideo there is no government of the Defensa left to sign anything with. What the step would need, a friendly army on the frontier and a squadron on the interior rivers, is not there.\n\nYour Excellency knows the sum. The Brazilian chargé d'affaires wrote of you that you "know perfectly the risks of your position" and could leave it "as soon as you are convinced you can do so with success". Don Antonio Cuyás put it plainly: it is not fitting to show your face "until the means each of the States of the coalition must contribute are secured in a treaty or convention". Today there is no coalition, no treaty and no convention.\n\nTo accept the resignation now is to take Rosas at his word with the Confederation's army freed from the war across the river. In Rio de Janeiro they wrote it without circumlocution: with Rosas "there is no middle ground: either blind and absolute obedience, or open rebellion". And the Restorer had warned as early as 1836: "Take care; that chief will be your ruin". Entre Ríos has its cavalry; what it lacks is anyone to ride with."
 gg_urquiza.4.d_province:0 "In San José, #b Rosas#!'s annual resignation of the charge of foreign relations lies on the table, the one he offers every year certain it will be handed back. The Legislature awaits Your Excellency's word. But on the other bank there is no siege left: the Banda Oriental delegates to Buenos Aires as one more province of the Pact, with #b Oribe#! at its head, and in Montevideo there is no government of the Defensa left to sign anything with. What the step would need, a friendly army on the frontier and a squadron on the interior rivers, is not there.\n\nYour Excellency knows the sum. The Brazilian chargé d'affaires wrote of you that you "know perfectly the risks of your position" and could leave it "as soon as you are convinced you can do so with success". Don Antonio Cuyás put it plainly: it is not fitting to show your face "until the means each of the States of the coalition must contribute are secured in a treaty or convention". Today there is no coalition, no treaty and no convention.\n\nTo accept the resignation now is to take Rosas at his word with the Confederation's army freed from the war across the river, and both banks of the Uruguay in his hands. In Rio de Janeiro they wrote it without circumlocution: with Rosas "there is no middle ground: either blind and absolute obedience, or open rebellion". And the Restorer had warned as early as 1836: "Take care; that chief will be your ruin". Entre Ríos has its cavalry; what it lacks is anyone to ride with."
 gg_urquiza.4.f:0 ""He will act as circumstances present themselves." Antonio Cuyás y Sampere, on Urquiza"
 gg_urquiza.4.a:0 "Let the Legislature hand the resignation back, as every year."
 gg_urquiza.4.b:0 "Let it accept: Entre Ríos resumes its powers, with allies or without them."
 gg_urquiza.4.a_tt:0 "@information! Entre Ríos #b does not pronounce#!: the charge stays in Buenos Aires and the pending grievances are taken up with #b Rosas#!, within the Pact.\n#grey Entre Ríos's discontent, today: #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!.#!"
 gg_urquiza.4.b_tt:0 "@warning! Entre Ríos #N pronounces with no convention and no squadron#!: it takes back the delegation, and the answer lies with #b Rosas#!, who may accept it or make war on it.\n#grey Entre Ríos's discontent, today: #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!.#!"
 gg_argentina.71.d_alone:0 "The #b 1st of May 1851#! has come and the Legislature of Entre Ríos hands #b Rosas#!'s resignation back, as every year: the charge of foreign relations continues in Buenos Aires.\n\nIt is not gratitude. On the other bank #b Oribe#! governs, in Montevideo there is no government of the Defensa left to sign with, and the Empire has bound itself to nothing with Entre Ríos: no treaty, no squadron on the rivers. Urquiza has done the sum any governor with cavalry and no allies would do, and the sum did not come out.\n\nThe grievances of Entre Ríos have not been erased; they will be taken up at the table. What lies ahead is to write the Confederation down while the calm lasts."
 gg_argentina.71.d_strong:0 "The #b 1st of May 1851#! has come and the Legislature of Entre Ríos does not accept #b Rosas#!'s annual resignation: the mandate for foreign relations continues in Buenos Aires.\n\nIt is not gratitude. The other bank of the Plata is at peace and on the Restorer's side, the Empire has no means to intervene and the Litoral delegates without demur. Urquiza has done the sum any governor with cavalry and no allies would do, and the sum did not come out.\n\nWhat lies ahead is to write the Confederation down while the calm lasts."
 gg_argentina.3.d_alone:0 "Every year you offer to relinquish the conduct of foreign relations, and every year the provinces refuse. It is a ceremony: you offer what you know nobody will take.\n\nThis year the legislature of Entre Ríos #b accepted#!. Entre Ríos, #b 'having reassumed'#! the authority entrusted to the governor of Buenos Aires, will once again deal with foreign nations in its own name, though nobody is left across the river to sign with it.\n\nThere is no illegality to denounce, and that is the worst of it. The Federal Pact of 1831 is a treaty between sovereign entities, and each kept the right to withdraw the authority it lent. #b Justo José de Urquiza#! has usurped nothing: he has taken you at your word."
 gg_pronunciamiento_rebelion_alone_tt:0 "@warning! #b Entre Ríos#! withdraws the authority entrusted to Buenos Aires, takes the field with its army under Urquiza and begins an #N open war#! over the Federal Pact. This time #b with no allies#! across the river."
 gg_argentina.67.d_postwar:0 "The dispatch for #b Justo José de Urquiza#! gives him command of the army of observation on the Empire's frontier. The same packet contains another order: cut Entre Ríos's direct trade with foreign ships, tolerated for years although Buenos Aires regards it as contraband.\n\nThe two instructions cannot be reconciled without cost. He is given the Confederation's greatest military responsibility and deprived of the commerce that sustains his province's economy.\n\nThey travel with #b Rosas's#! annual offer to relinquish the conduct of foreign relations. Each year the provinces refuse it, reaffirming the mandate; this time Entre Ríos will receive, at once, a ceremony expected to be ritual and two orders that test its obedience."
 gg_argentina.26.defensa_tt:0 "@information! The #R Defensa#! receives the same news."
 gg_alcaraz_accept_postwar_tt:0 "@information! The war with #b Corrientes#! ends; it becomes a #P protectorate#! and delegates foreign relations again, and a route to a #V constituent congress#! opens."
 gg_argentina.83.d_alone:0 "The army of Buenos Aires has been defeated and Entre Ríos has enforced its objective, with no allies but its own cavalry. Rosas can no longer present the conduct of foreign relations as a living mandate: the government that exercised it fell with the defeat.\n\nUrquiza enters Buenos Aires as head of the victorious Litoral. Entre Ríos does not disappear or become a possession of the port; it retains its government within the settlement that must now organise the Confederation.\n\nWar decided who governs. A constitution will decide under which rules."
