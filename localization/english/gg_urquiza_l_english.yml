l_english:
 gg_urquiza.1.t:0 "The Representation of Entre Ríos"
 gg_urquiza.1.d:0 "The Legislature of Entre Ríos has not accepted the Restorer's annual resignation: the mandate for foreign relations stays in Buenos Aires. But with the answer comes a #b representation#! signed by General Urquiza, and it is no courtesy.\n\nIt asks what the Litoral has asked since the Pact of 1831: that the Congress the Pact promised be convened, that the rivers be no business of a single custom house, that the orders of 1850 not fall on the provinces as they fall on enemies. It asks without withdrawing the mandate, and it asks in writing.\n\nIn the Government House they know what an unanswered representation means."
 gg_urquiza.1.f:0 "Entre Ríos still delegates; now it also asks."
 gg_urquiza.1.a:0 "Hear the representation and open the road to the Congress."
 gg_urquiza.1.b:0 "A province does not give orders to the one entrusted with foreign relations."
 gg_urquiza.1.a_tt:0 "@information! Entre Ríos stays in the Pact and the #b negotiated confederation#! opens. #b Urquiza#!'s backing rises by #P 10#!.\n#grey Entre Ríos's discontent stood at #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!: pushed up by open grievances (Alcaraz, the orders of 1850, the Congress put off, each claim unanswered, a Brazil free to intervene); held down by a Guerra Grande won, the Banda Oriental in the Confederation, a Brazil beaten and a Litoral that delegates.#!"
 gg_urquiza.1.b_tt:0 "@warning! The representation goes unanswered. #b Urquiza#!'s backing falls by #N 10#!, and what today is a petition #b may become a pronouncement#!."
 gg_urquiza.2.t:0 "Urquiza Alone"
 gg_urquiza.2.d:0 "The governor of Entre Ríos has pronounced, but he has pronounced alone. There is no besieged government in Montevideo looking for allies against the Restorer, and in Rio de Janeiro nobody signs conventions about the Plata with a man who cannot guarantee them.\n\nUrquiza has his province, his cavalry and whatever Corrientes cares to give him. Against him stand the armies of the Confederation, which have no other war left to fight."
 gg_urquiza.2.f:0 "A pronouncement without a convention is a gamble."
 gg_urquiza.2.a:0 "Let the Litoral know."
 gg_urquiza.2.a_tt:0 "@information! The war with Entre Ríos is the one the pronouncement opened, without foreign contingents. When it ends, the Pact is decided by its outcome."
 gg_argentina.71.d_strong:0 "The #b 1st of May 1851#! has come and the Legislature of Entre Ríos does not accept #b Rosas#!'s annual resignation: the mandate for foreign relations continues in Buenos Aires.\n\nIt is not gratitude. The other bank of the Plata is at peace and on the Restorer's side, the Empire has no means to intervene and the Litoral delegates without demur. Urquiza has done the sum any governor with cavalry and no allies would do, and the sum did not come out.\n\nWhat lies ahead is to write the Confederation down while the calm lasts."
