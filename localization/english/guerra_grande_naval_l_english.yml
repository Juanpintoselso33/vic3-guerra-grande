l_english:

 gg_naval.1.t:0 "Coe's Squadron"
 gg_naval.1.d:0 "The Mackau-Arana Convention freed Rosas from the world's second naval power, and the Restorer promptly turned his attention to the river. On 22 January he closed the Paraná and the Uruguay, authorised privateering against any vessel sailing from a Uruguayan port and declared Montevideo under blockade. On 2 February he placed the squadron under Brigadier #b Guillermo Brown#!, now retired but still the acknowledged hero of the wars against Spain and the Empire.\n\nThe government answered by closing the rivers in turn and issuing letters of marque. It lacked only a squadron. On 31 December the Ministry of War and Navy appointed Colonel #b John Halstead Coe#! to command naval forces ‘to be raised’, while a Maritime Commission sought subscriptions from the city's men of means. The proceeds furnish a corvette — the ten-gun #b Sarandí#! — a brig, a few schooners and little else. Coe, like half the officers in both squadrons, served under Brown in the Brazilian war.\n\nA squadron must be paid before it fires a shot, and the treasury was meant to sustain one army, not an army and a navy. The alternative is to abandon the river to the enemy and trust the harbour batteries — in other words, to submit to the blockade."
 gg_naval.1.d_neutral:0 "The Republic kept out of another country's war, but the river took no notice. On 22 January Rosas closed the Paraná and the Uruguay, authorised privateering against any vessel sailing from a Uruguayan port and declared Montevideo under blockade, with or without a declaration of war. On 2 February he placed the squadron under Brigadier #b Guillermo Brown#!, now retired but still the hero of the wars against Spain and the Empire.\n\nThe government answered by closing the rivers in turn and issuing letters of marque. It lacked only a squadron. On 31 December the Ministry of War and Navy appointed Colonel #b John Halstead Coe#! to command naval forces ‘to be raised’, while a Maritime Commission sought subscriptions from the city's men of means. The proceeds furnish a corvette — the ten-gun #b Sarandí#! — a brig, a few schooners and little else. Coe, like half the officers in both squadrons, served under Brown in the Brazilian war.\n\nA squadron must be paid before it fires a shot, and neutrality no longer spares the port any expense. The alternative is to abandon the river to the enemy and trust the batteries — in other words, to submit to the blockade."
 gg_naval.1.d_open:0 "The Mackau-Arana Convention freed Rosas from the world's second naval power, and the Restorer now has a free hand on the river. He has not yet closed the Paraná or the Uruguay, nor declared Montevideo under blockade, but on 2 February he placed the squadron under Brigadier #b Guillermo Brown#!, now retired but still the acknowledged hero of the wars against Spain and the Empire. Such a squadron, under such a man, is not fitted out to watch the river.\n\nWhat the Republic lacks is a squadron of its own. On 31 December the Ministry of War and Navy appointed Colonel #b John Halstead Coe#! to command naval forces ‘to be raised’, while a Maritime Commission sought subscriptions from the city's men of means. The proceeds furnish a corvette — the ten-gun #b Sarandí#! — a brig, a few schooners and little else. Coe, like half the officers in both squadrons, served under Brown in the Brazilian war.\n\nA squadron must be paid before it fires a shot, and the treasury was meant to sustain one army, not an army and a navy. The alternative is to abandon the river and trust the harbour batteries — in other words, to leave the water to Brown."
 gg_naval.1.f:0 "The commodore and the admiral know each other: they served together against Brazil."
 gg_naval.1.a:0 "Open the subscription. Let the Republic have a squadron."
 gg_naval.1.a_tt:0 "@information! Coe puts to sea; the squadron's fate is now tied to the river campaign."
 gg_naval.1.b:0 "Leave the river to the harbour batteries."
 gg_naval.1.b_tt:0 "@warning! Brown's squadron remains unopposed off Montevideo: the port, the customs house and trade bear the cost until the sea is reopened."

 gg_naval.2.t:0 "The Lampoons against Coe"
 gg_naval.2.d:0 "A year afloat is reckoned in damage sustained. On 24 May, off Punta Brava, a round shot tore Lieutenant Colonel #b Malcolm Shannon#! in two aboard his own corvette, and the squadron put into port for repairs. On 3 August, at the mouth of the Santa Lucía, Brown exchanged broadsides with the #b Belgrano#! until night and fog ended the cannonade. On 10 December, near the Ortiz Bank, the #b Cagancha#! became separated, was dismasted in a storm and fell into enemy hands by morning: she now sails for the Confederation as the #b Restaurador#!. Two ships had already defected, crews and all.\n\nCoe returned the day before yesterday, reporting a pursuit as far as the southern channel and bringing the damaged #b Sarandí#! into port. The city does not believe him. For a week, lampoons have asked why the commodore can never defeat his former commander; Coe himself demands a court martial to clear his name. Minister Vidal counsels an end to the expense: sell the ships and surrender the river to Brown.\n\nTwo sound hulls remain, the #b Pereira#! and the #b Constitución#!. Properly fitted out, they could ascend the Paraná with arms and men for Corrientes — the sole remaining support for the war on the opposite bank."
 gg_naval.2.f:0 "‘It consumed great sums — sums one might even call immense in proportion to the squadron's importance.’ — General José María Paz"
 gg_naval.2.a:0 "Pay off the squadron and fit out the Pereira and the Constitución for Corrientes."
 gg_naval.2.a_tt:0 "@information! The two remaining ships are committed to the Paraná expedition, within reach of Brown's squadron."
 gg_naval.2.b:0 "Sell every last hull. Let the court martial decide Coe's case."
 gg_naval.2.b_tt:0 "@information! Without the Paraná expedition, Garibaldi does not win command of the Italian Legion."

 gg_naval.3.t:0 "Costa Brava"
 gg_naval.3.d:0 "The expedition ascended the Paraná aboard the #b Pereira#! and the #b Constitución#! under #b Giuseppe Garibaldi#!, the sailor from Nice, with Brown in pursuit. On 15 August Brown caught it at Costa Brava, near Esquina on the border between Entre Ríos and Corrientes. He did not attack head-on: men went ashore to tow his vessels upstream by hawser, infantry drove the riflemen from the bank, and his left wing anchored within gunshot. Garibaldi sent a burning fireship towards him; Bartolomé Cordero, a twelve-year-old ship's boy, boarded it from a boat and turned it aside.\n\nThe battle lasted two days. On the second, Garibaldi ran out of ammunition, his decks shattered and half his men out of action. Rather than surrender the vessels, he blew them up and struck inland with the survivors. Brown's officers asked leave to pursue; the admiral refused. His dispatch to Rosas called them pirates who plundered without mercy. To his officers, he said something else.\n\nNothing remains of the Republic's squadron. What returns to Montevideo is a man renowned for having held out for two days against the finest sailor on the Río de la Plata, then burned his ships rather than strike his colours — and a body of Italians prepared to follow him."
 gg_naval.3.f:0 "‘Let him escape; that gringo is a brave man.’ — Guillermo Brown"
 gg_naval.3.a:0 "Receive him as the man the city already believes him to be."
 gg_naval.3.a_tt:0 "@information! Costa Brava gives #b Garibaldi#! command of the Italian Legion."
 gg_naval.3.b:0 "A defeat is a defeat: no honours and no promotion."
 gg_naval.3.b_tt:0 "@information! Without public honours, Garibaldi does not win command of the Italian Legion. The government earns some credit for not dressing up the defeat: legitimacy #P +2#!."

 gg_naval_port_under_blockade:0 "The Port under Blockade"
 gg_naval_port_under_blockade_desc:0 "The Confederation's squadron rides at anchor off Montevideo, unchallenged."
 gg_naval_no_false_honours:0 "No Honours for a Defeat"
 gg_naval_no_false_honours_desc:0 "The government did not dress the defeat up as a victory, and the city credits it for that."
