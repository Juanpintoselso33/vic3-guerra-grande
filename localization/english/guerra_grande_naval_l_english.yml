l_english:

 gg_naval.1.t:0 "Coe's Squadron"
 gg_naval.1.d:0 "The Mackau-Arana convention took the world's second naval power off Rosas's back, and the Restorer used his free hand on the river. On 22 January he closed the Parana and the Uruguay, authorised privateering against any ship out of an Oriental port and declared Montevideo blockaded. On 2 February he gave the squadron to Brigadier #b Guillermo Brown#!, retired, hero of the wars against Spain and against the Empire, whom both parties acknowledge.\n\nThe government answered by closing the rivers too and authorising privateers of its own. What is missing is the squadron. On 31 December the Ministry of War and Navy named Colonel #b John Halstead Coe#! head of the naval forces «to be created», and a Maritime Commission opened a subscription among the moneyed men of the city. It buys a corvette -- the #b Sarandi#!, ten guns -- a brig, a few schooners and little else. Coe, like half the officers of both squadrons, served under Brown in the Brazilian war.\n\nA squadron is paid for before it fires a shot, and the treasury is built to keep an army, not two services. The alternative is to leave the river alone and trust the harbour batteries, which amounts to accepting the blockade."
 gg_naval.1.d_neutral:0 "The Republic stayed out of other men's war, and the river did not notice. On 22 January Rosas closed the Parana and the Uruguay, authorised privateering against any ship out of an Oriental port and declared Montevideo blockaded, declared war or no declared war. On 2 February he gave the squadron to Brigadier #b Guillermo Brown#!, retired, hero of the wars against Spain and against the Empire.\n\nThe government closed the rivers too and authorised privateers of its own. What is missing is the squadron. On 31 December the Ministry of War and Navy named Colonel #b John Halstead Coe#! head of the naval forces «to be created», and a Maritime Commission opened a subscription among the moneyed men of the city. It buys a corvette -- the #b Sarandi#!, ten guns -- a brig, a few schooners and little else. Coe, like half the officers of both squadrons, served under Brown in the Brazilian war.\n\nA squadron is paid for before it fires a shot, and neutrality is no longer saving the harbour anything. The alternative is to leave the river alone and trust the batteries, which amounts to accepting the blockade."
 gg_naval.1.f:0 "The commodore and the admiral know each other: they served together against Brazil."
 gg_naval.1.a:0 "Open the subscription. Let the Republic have a squadron."
 gg_naval.1.a_tt:0 "@information! Coe puts to sea: in December the campaign closes and what is left of the squadron must be decided."
 gg_naval.1.b:0 "Let the harbour batteries keep the river."
 gg_naval.1.b_tt:0 "@warning! Brown's squadron stays off Montevideo: the port, the customs house and the trade pay for it until the intervention reopens the sea in 1843."

 gg_naval.2.t:0 "The Lampoons against Coe"
 gg_naval.2.d:0 "The year on the water is counted in damage. On 24 May, off Punta Brava, a roundshot cut Lieutenant Colonel #b Malcolm Shannon#! in two aboard his own corvette and the squadron ran into port to repair. On 3 August, at the mouth of the Santa Lucia, Brown fought broadside to broadside in the #b Belgrano#! until night and fog ended the cannonade. On 10 December, near the Ortiz bank, the #b Cagancha#! was cut off from the rest, dismasted by the storm, and by morning she was taken: she sails for the Confederation now under the name #b Restaurador#!. Two ships had already gone over to the enemy, crews and all.\n\nCoe came back the day before yesterday telling of a chase down the southern channel and bringing the #b Sarandi#! in damaged. The city does not believe him. For a week lampoons have been asking why the commodore never manages to beat his old chief, and he himself is asking for a court martial to clear his name. Minister Vidal advises an end to the spending: sell the ships and leave the river to Brown.\n\nTwo hulls are still sound, the #b Pereira#! and the #b Constitucion#!. Fitted out, they are enough to go up the Parana with arms and men for Corrientes, the one thing still holding the war together on the far bank."
 gg_naval.2.f:0 "«It spent large sums, and one may say immense ones, next to the importance of the little squadron.» -- General Jose Maria Paz"
 gg_naval.2.a:0 "Pay off the squadron and fit out the Pereira and the Constitucion for Corrientes."
 gg_naval.2.a_tt:0 "@information! The expedition goes up the Parana next year, and Brown will come after it."
 gg_naval.2.b:0 "Sell every last hull. Let the court martial settle Coe."
 gg_naval.2.b_tt:0 "@information! No Parana expedition. The Italian Legion of 1843 arrives as it stands: one battalion, and not under Garibaldi."

 gg_naval.3.t:0 "Costa Brava"
 gg_naval.3.d:0 "The expedition went up the Parana with the #b Pereira#! and the #b Constitucion#! under the seaman from Nice, #b Giuseppe Garibaldi#!, and Brown went after it. On 15 August he caught it at Costa Brava, on the line between Entre Rios and Corrientes, near Esquina. Brown did not attack head on: he put men ashore to warp his ships up by line, cleared the riflemen off the bank with infantry, and anchored his left wing within range. Garibaldi sent a fire ship down on him; a twelve-year-old ship's boy, Bartolome Cordero, boarded it from a rowboat and turned it away.\n\nThe fight lasted two days. On the second Garibaldi ran out of ammunition, his decks torn open and half his men down. Rather than hand the ships over he blew them up, and went inland with what was left. Brown's officers asked leave to pursue him and the admiral refused. In his report to Rosas he described those men as pirates looting without mercy; to his officers he said something else.\n\nNothing is left of the Republic's squadron. What comes back to Montevideo is a man with the name of having fought two days against the finest sailor on the Plate and burned his own ships rather than strike them, and a body of Italians who follow him."
 gg_naval.3.f:0 "«Let him go, that gringo is a brave man.» -- Guillermo Brown"
 gg_naval.3.a:0 "Receive him as what the city already believes he is."
 gg_naval.3.a_tt:0 "@information! In 1843 the Italian Legion is commanded by #b Garibaldi#! and musters one battalion more."
 gg_naval.3.b:0 "A defeat is a defeat: no honours and no promotion."
 gg_naval.3.b_tt:0 "@information! The Italian Legion of 1843 arrives as it stands: one battalion, and not under Garibaldi."

 gg_naval_port_under_blockade:0 "The Port under Blockade"
 gg_naval_port_under_blockade_desc:0 "The Confederation's squadron lies off Montevideo and nobody disputes it."
