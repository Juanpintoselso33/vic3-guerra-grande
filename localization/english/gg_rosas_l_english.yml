l_english:
 gg_rosas.1.t:0 "Oribe's Army before Montevideo"
 gg_rosas.1.d:0 "After #b Arroyo Grande#!, on 6 December, Rivera's army no longer exists, and General #b Oribe#! advances on Montevideo with the divisions Buenos Aires gave him for that campaign. Now he sits before the wall, and the war thought to last weeks begins to look like one of years.\n\nThose divisions are Argentine, paid by the Confederation's treasuries, and the Litoral asks how much longer they will be missing from its provinces. Oribe asks that they stay: without them the Cerrito is a line of cavalry before a city with a port.\n\nIn the Government House it must be decided how much of the Oriental war is the Confederation's war."
 gg_rosas.1.f:0 "A city with a port is not taken with cavalry."
 gg_rosas.1.a:0 "The divisions stay with Oribe."
 gg_rosas.1.b:0 "Bring the troops back; send Oribe money."
 gg_rosas.1.c:0 "The Oriental war is Oribe's."
 gg_rosas.1.a_tt:0 "@information! #b Rosas#!'s backing of the Cerrito rises by #P 10#!, and the Cerrito receives the #b Argentine auxiliaries#! for five years. It costs the Confederation #N 30,000#!."
 gg_rosas.1.b_tt:0 "@information! #b Rosas#!'s backing rises by #P 5#! and the Cerrito's endurance by #P 10#!. It costs #N 20,000#!."
 gg_rosas.1.c_tt:0 "@warning! #b Rosas#!'s backing of the Cerrito falls by #N 10#!."
 gg_rosas.2.t:0 "Urquiza Crosses the Uruguay"
 gg_rosas.2.d:0 "Rivera has come back from Brazil and roams the Oriental countryside with a new army, raising bands and avoiding battle. The governor of Entre Ríos, #b Justo José de Urquiza#!, has his cavalry across the river and asks for the order to cross.\n\nSending him means finishing Rivera in open country, where the cavalry of Entre Ríos has no rival. It also means giving Urquiza the greatest victory of his career, with the Confederation's soldiers and on Oriental soil."
 gg_rosas.2.f:0 "The caudillos of the Litoral are made in the battles others send them to fight."
 gg_rosas.2.a:0 "Let Urquiza cross and finish Rivera."
 gg_rosas.2.b:0 "Urquiza stays in Entre Ríos."
 gg_rosas.2.a_tt:0 "@information! The #R Defensa#!'s endurance falls by #N 10#! and the #blue_value Blancos#! gain #P 1#!. #b Urquiza#!'s backing of the Cerrito rises by #P 10#!."
 gg_rosas.2.b_tt:0 "@warning! #b Rosas#!'s backing of the Cerrito falls by #N 5#!: Oribe was counting on the Litoral's cavalry."
 gg_rosas.3.t:0 "Lord Howden in Buenos Aires"
 gg_rosas.3.d:0 "Lord #b Howden#! and Count #b Walewski#! have come to end the Oriental war with a formula: an armistice, the disarming of the foreign forces and elections in the Banda Oriental. Howden works from the frigate Raleigh, and every proposal crosses Minister #b Arana#!'s desk.\n\nThe underlying question is a single one: does Buenos Aires hold that #b Oribe#! is the Republic's lawful president, or does it agree to treat him as one of the parties?"
 gg_rosas.3.f:0 "Howden wrote that the blockade did Rosas no harm and only gave money to those who kept it up."
 gg_rosas.3.a:0 "Oribe is the lawful president: there is no other formula."
 gg_rosas.3.b:0 "Advise Oribe to accept the armistice."
 gg_rosas.3.a_tt:0 "@information! #b Rosas#!'s backing rises by #P 5#!. Relations with Great Britain fall by #N 10#!."
 gg_rosas.3.b_tt:0 "@warning! #b Rosas#!'s backing falls by #N 10#! and the Cerrito's endurance by #N 10#!. Relations with Great Britain rise by #P 20#!."
 gg_rosas.4.t:0 "The Arana-Southern Treaty"
 gg_rosas.4.d:0 "Sir #b Henry Southern#! sat through fifteen postponements in Buenos Aires before he could present his credentials, and now the treaty is ready to sign: Great Britain, having already lifted the blockade, returns Martín García and the ships it took, and recognises that navigation of the Paraná is an internal matter of the Confederation.\n\nOne clause remains. The sixth article says the Restorer will only treat if his ally, President #b Oribe#!, agrees. Southern may accept it; London would rather not see it."
 gg_rosas.4.f:0 "'…should previously be in agreement with it.' — Arana-Southern Treaty, art. VI"
 gg_rosas.4.a:0 "Sign with the sixth article: nothing without Oribe."
 gg_rosas.4.b:0 "Sign without binding ourselves to Oribe."
 gg_rosas.4.a_tt:0 "@information! Relations with Great Britain rise by #P 40#! and #b Rosas#!'s backing of the Cerrito by #P 5#!."
 gg_rosas.4.b_tt:0 "@warning! Relations with Great Britain rise by #P 60#!, but #b Rosas#!'s backing falls by #N 20#! and the Cerrito's endurance by #N 20#!."
 gg_rosas.5.t:0 "The Arana-Le Prédour Treaty"
 gg_rosas.5.d:0 "Admiral #b Le Prédour#! brings to Buenos Aires what France needs to leave the Plata with honour: the end of the blockade, the withdrawal of the legion and a settlement on the Banda Oriental. Minister #b Arana#! has the text on his desk.\n\nAs with Southern, what is at issue is #b Oribe#!: whether the treaty protects him or Buenos Aires washes its hands of the Cerrito's fate."
 gg_rosas.5.f:0 "A treaty Paris never ratified."
 gg_rosas.5.a:0 "Sign while looking after Oribe."
 gg_rosas.5.b:0 "Sign without binding ourselves to Oribe."
 gg_rosas.5.a_tt:0 "@information! Relations with France rise by #P 40#! and #b Rosas#!'s backing of the Cerrito by #P 5#!."
 gg_rosas.5.b_tt:0 "@warning! Relations with France rise by #P 60#!, but #b Rosas#!'s backing falls by #N 20#! and the Cerrito's endurance by #N 20#!."
 gg_rosas.6.t:0 "Peace in the Banda Oriental"
 gg_rosas.6.d:0 "News comes from the other bank: the Oriental war is nearing its end, and the terms of peace may be on the table within weeks. What Buenos Aires does now weighs on how it ends."
 gg_rosas.6.d_blanco:0 "Good news comes from the other bank: the balance has tipped towards the Cerrito, and #b Oribe#! is in a position to dictate the peace. Within weeks it will be known what Republic comes out of nine years of siege, and how much of it owes Buenos Aires.\n\nOribe asks for one last effort so that the peace is his and not a half one."
 gg_rosas.6.d_colorado:0 "Bad news comes from the other bank: the balance has tipped towards the Defensa, and the peace under discussion is not #b Oribe#!'s. Nine years of siege may end without the Cerrito entering Montevideo.\n\nOribe asks that Buenos Aires not leave him alone at the table."
 gg_rosas.6.f:0 "Long wars are ended at the table."
 gg_rosas.6.a:0 "Back Oribe to the end."
 gg_rosas.6.b:0 "Advise Oribe to negotiate."
 gg_rosas.6.a_tt:0 "@information! The Cerrito's endurance rises by #P 15#! and #b Rosas#!'s backing by #P 5#!. It costs #N 40,000#!."
 gg_rosas.6.b_tt:0 "@information! #b Rosas#!'s backing falls by #N 5#!. London and Paris take it well: #P +10#! with each."
