l_english:
 gg_war_ui_short_prewar:0 "Since Carpintería, blancos and colorados have been fighting over the Republic. Every decision of the two caudillos tips the balance."
 gg_war_ui_short_split:0 "Two governments, each the lawful one: the Defensa, shut up in Montevideo, and the Cerrito, master of the countryside. Neither means to surrender; the point is to reach the table weighing more than the other."
 gg_war_ui_sec_sides:0 "Face to face"
 gg_war_ui_versus:0 "vs"
 gg_war_ui_card_defensa_tt:0 "#b Who backs the Defensa#! (0 to 100 each)\nFrance #V [GetGlobalVariable('gg_patron_francia').GetValue|0]#! · Great Britain #V [GetGlobalVariable('gg_patron_britania').GetValue|0]#! · Brazil #V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!; Urquiza, if he turns.\nIn all, #V [GetPlayer.MakeScope.ScriptValue('gg_defensa_backing')|0]#!. Below #V 40#!, its war support drains away month after month.\n\n@money! France and Brazil send it #P [GetPlayer.MakeScope.ScriptValue('gg_defensa_subsidy')|0]#! a month."
 gg_war_ui_card_cerrito_tt:0 "#b Who backs the Cerrito#! (0 to 100 each)\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!, as long as he does not turn.\nIn all, #V [GetPlayer.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!. Below #V 40#!, its war support drains away month after month.\n\n@money! Rosas sends it #P [GetPlayer.MakeScope.ScriptValue('gg_cerrito_subsidy')|0]#! a month, unless he withdraws his support."
 gg_war_ui_sec_balance:0 "The balance"
 gg_war_ui_sec_balance_tt:0 "#b What tips it#!\nThe decisions of either side, including some made in Buenos Aires. In the open war the river weighs too, on a single account: each month shut adds for the #blue_value blancos#! and each month open takes away; every four months of balance is one point, up to #V 4#! a side. The split cuts in half the lead of whoever reaches it #V 2#! or more ahead.\n\n#b Last month#!: decisions #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados · the split #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! · the river, today, #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (for the blancos if positive).\n\n#b With a lead of 5 in decisions#!, not counting the river and once the war is open, the side ahead fights better (offense #P +10%#!, defense #P +5%#!, prestige #P +10%#!, Armed Forces approval #P +2#!) and the side behind loses authority (#N -25#!), attacks worse (#N -10%#!), feels its casualties more (#N +15%#!) and loses its officers (#N -2#!).\n#b At 10 on the balance#! (#V 5#! from 1851), the government behind is asked whether it will sue for terms or fight on, as soon as no other negotiation or truce is under way."
 gg_war_ui_sec_endurance:0 "Endurance"
 gg_war_ui_sec_endurance_tt:0 "Months in a row with war support at #N -25#! or lower; one better month sets the count back to zero. At #V 3#!, that government is asked whether it will sue for terms or fight on, as soon as no other negotiation or truce is under way. When support falls to #N -60#! or lower, each month the men pull themselves together a little (#P +15#!)."
 gg_war_ui_endurance_defensa:0 "#R The Defensa#!: #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! of #V 3#! months without endurance"
 gg_war_ui_endurance_cerrito:0 "#blue_value The Cerrito#!: #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#! of #V 3#! months without endurance"
 gg_war_ui_sec_table:0 "The peace table"
