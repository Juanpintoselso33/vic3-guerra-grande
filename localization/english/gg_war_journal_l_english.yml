l_english:
 gg_war_ui_short_prewar:0 "Since Carpintería, blancos and colorados have fought for control of the Republic. Every decision the two caudillos take tips the balance."
 gg_war_ui_short_split:0 "Two governments, each claiming to be the lawful one: the Defensa, penned inside Montevideo, and the Cerrito, master of the countryside. Neither means to surrender; what matters is to come to the table with greater leverage."
 gg_war_ui_sec_sides:0 "Face to Face"
 gg_war_ui_versus:0 "vs"
 gg_war_ui_card_defensa_tt:0 "#b The Defensa's Backers#!: the powers that stand Protector or Guarantor (see «The Powers», below), and Urquiza, should he change sides.\nAltogether, #V [GetPlayer.MakeScope.ScriptValue('gg_defensa_backing')|0]#!. Below #V 40#!, its war support drains away month after month.\n\n@money! France (until her subsidy is renounced) and the Empire, if they back it, send it #P [GetPlayer.MakeScope.ScriptValue('gg_defensa_subsidy')|0]#! a month. The historical subsidies (the French convention of 1848, the Brazilian treaties of 1851) come through this same payment: they are not paid twice."
 gg_war_ui_card_cerrito_tt:0 "#b The Cerrito's Backers#! (0 to 100 each)\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!, for as long as he stays loyal.\nAltogether, #V [GetPlayer.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!. Below #V 40#!, its war support drains away month after month.\n\n@money! Rosas sends it #P [GetPlayer.MakeScope.ScriptValue('gg_cerrito_subsidy')|0]#! a month, for as long as he keeps backing it. Rosas's chest comes through this same payment: it is not paid twice."
 gg_war_ui_sec_balance:0 "The Balance"
 gg_war_ui_sec_balance_tt:0 "#b What Tips It#!\nDecisions taken on either side, some of them in Buenos Aires. Once the war is open, the river weighs in too, on a single running account: each month it is shut counts for the #blue_value blancos#! and each month it is open counts against them; every four months of net balance count as one point, up to #V 4#! a side; during the siege, every four months beyond that cap stay on the war's account. At the partition, any lead of #V 2#! or more is halved.\n\n#b Last Month#!: decisions #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados · the river #blue_value [GetGlobalVariable('gg_src_last_river_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_river_colorado').GetValue|+=0]#! · the partition #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! · the river, as things stand, #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (in the blancos' favour if positive).\n\n#b With a lead of 5 in decisions#!, leaving the river aside and once the war is open, the side ahead fights better (offense #P +10%#!, defense #P +5%#!, prestige #P +10%#!, Armed Forces approval #P +2#!), while the side behind loses authority (#N -25#!), attacks less effectively (#N -10%#!), suffers more from its casualties (#N +15%#!) and loses the goodwill of its officers (#N -2#!).\n#b At 10 on the balance#! (#V 5#! from 1851), the government that is behind is asked whether it will sue for terms or fight on, as soon as no other negotiation or truce is in progress."
 gg_war_ui_sec_endurance:0 "Endurance"
 gg_war_ui_sec_endurance_tt:0 "How long each government can bear the war, from #N -100#! to #P 100#!: its own decisions wear it down, and so does a patron that stops backing it. Consecutive months with endurance at #N -25#! or lower; a single better month resets the count. At #V 3#!, that government is asked whether it will sue for terms or fight on, as soon as no other negotiation or truce is in progress. Once endurance falls to #N -60#! or lower, the men rally a little each month (#P +15#!)."
 gg_war_ui_endurance_defensa:0 "#R The Defensa#!: endurance #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!, #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! of #V 3#! months at the end of its tether"
 gg_war_ui_endurance_cerrito:0 "#blue_value The Cerrito#!: endurance #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!, #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#! of #V 3#! months at the end of its tether"
 gg_war_ui_sec_table:0 "The Peace Table"
