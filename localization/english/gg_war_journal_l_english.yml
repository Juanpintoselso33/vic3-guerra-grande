l_english:
 gg_war_ui_short_prewar:0 "Since Carpintería, blancos and colorados have fought for control of the Republic. Every decision the two caudillos take tips the balance."
 gg_war_ui_short_split:0 "Two governments, each claiming to be the lawful one: the Defensa, penned inside Montevideo, and the Cerrito, master of the countryside. Neither means to surrender; what matters is to come to the table with greater leverage."
 gg_war_ui_sec_sides:0 "Face to Face"
 gg_war_ui_versus:0 "vs"
 gg_war_ui_card_defensa_tt:0 "#b The Defensa's Backers#!: the powers that stand Protector or Guarantor (see «The Backers», below), and Urquiza, should he change sides.\nAltogether, #V [GetPlayer.MakeScope.ScriptValue('gg_defensa_backing')|0]#!. Below #V 40#!, its endurance drains away month after month.\n\n@money! France (until her subsidy is renounced) and the Empire, if they back it, send it #P [GetPlayer.MakeScope.ScriptValue('gg_defensa_subsidy')|0]#! a month. The historical subsidies (the French convention of 1848, the Brazilian treaties of 1851) come through this same payment: they are not paid twice."
 gg_war_ui_card_cerrito_tt:0 "#b The Cerrito's Backers#! (0 to 100 each)\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!, for as long as he stays loyal.\nAltogether, #V [GetPlayer.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!. Below #V 40#!, its endurance drains away month after month.\n\n@money! Rosas sends it #P [GetPlayer.MakeScope.ScriptValue('gg_cerrito_subsidy')|0]#! a month, for as long as he keeps backing it. Rosas's chest comes through this same payment: it is not paid twice."
 gg_war_ui_sec_balance:0 "The Balance"
 gg_war_ui_sec_balance_tt:0 "#b What Tips It#!\nThe figure at each end is all that side holds on the scales, decisions and river together; the scales show the difference.\nDecisions taken on either side, some of them in Buenos Aires. Once the war is open, the river weighs in too, on a single running account: each month it is shut counts for the #blue_value blancos#! and each month it is open counts against them; every four months of net balance count as one point, up to #V 4#! a side; during the siege, every four months beyond that cap stay on the war's account. At the partition, any lead of #V 2#! or more is halved.\n\n#b Last Month#!: decisions #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados · the river #blue_value [GetGlobalVariable('gg_src_last_river_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_river_colorado').GetValue|+=0]#! · the partition #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! · the river, as things stand, #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (in the blancos' favour if positive).\n\n#b With a lead of 5 in decisions#!, leaving the river aside and once the war is open, the side ahead gains prestige (#P +10%#!) and its officers' goodwill (#P +2#!), while the side behind loses authority (#N -25#!) and the goodwill of its officers (#N -2#!). Should it come to fighting, the side ahead attacks at #P +10%#! and defends at #P +5%#!, and the side behind attacks at #N -10%#! and feels its casualties more (#N +15%#!).\n#b At 15 on the balance#! (#V 10#! from 1849, #V 5#! from 1851), the government that is behind is asked whether it will sue for terms or fight on, as soon as no other negotiation or truce is in progress."
 gg_war_ui_sec_endurance:0 "Endurance"
 gg_war_ui_sec_endurance_tt:0 "How long each government can bear the war, from #N -100#! to #P 100#!: its own decisions wear it down, and so does a patron that stops backing it. Consecutive months with endurance at #N -25#! or lower; a single better month resets the count. At #V 3#!, that government is asked whether it will sue for terms or fight on, as soon as no other negotiation or truce is in progress. Once endurance falls to #N -60#! or lower, the men rally a little each month (#P +15#!)."
 gg_war_ui_endurance_defensa:0 "#R The Defensa#!: endurance #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!, #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! of #V 3#! months at the end of its tether"
 gg_war_ui_endurance_cerrito:0 "#blue_value The Cerrito#!: endurance #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!, #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#! of #V 3#! months at the end of its tether"
 gg_war_ui_sec_table:0 "The Peace Table"
 gg_war_ui_backer_rosas:0 "[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] #b Buenos Aires#!\nRosas backs the #blue_value blancos#!: #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100"
 gg_war_ui_backer_urquiza_cer:0 "@gg_entre_rios_flag! #b Entre Ríos#!\nUrquiza, with the #blue_value blancos#!: #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_war_ui_backer_urquiza_def:0 "@gg_entre_rios_flag! #b Entre Ríos#!\nUrquiza, with the #R colorados#!: #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_tt_backer_rosas:0 "What Buenos Aires puts behind the #blue_value Cerrito#!: the battalions of the Vanguard, a monthly remittance in pesos and the river squadron. With Urquiza while he stands on that side, it is the Cerrito's backing: below #V 40#!, the Cerrito loses endurance every month."
 gg_tt_backer_urquiza_cer:0 "The governor of Entre Ríos and his cavalry of the Littoral, on the side of the #blue_value Cerrito#!. Counts towards the Cerrito's backing along with Rosas: below #V 40#!, the Cerrito loses endurance every month."
 gg_tt_backer_urquiza_def:0 "The governor of Entre Ríos has pronounced and now stands with the #R Defensa#!: he counts towards its backing along with the powers. Below #V 40#!, the Defensa loses endurance every month."
 gg_tt_power_number:0 "How far each power is committed to the cause of Montevideo, from #V 0#! to #V 100#!. Every decision taken in the events raises or lowers it.\n· From #V 20#!, #b Protector#!; from #V 60#!, #b Guarantor#!.\n· The landmarks override the number: the guarantee of the river and the intervention make a power Guarantor, Southern and Lepredour take it out, and the Empire does not count before 1850, however high it stands.\nOnly a Protector's or a Guarantor's commitment adds to the Defensa's backing."
 gg_war_ui_backers_lean:0 "Backing: #R Defensa#! #V [JournalEntry.MakeScope.ScriptValue('gg_defensa_backing')|0]#!  ·  #blue_value Cerrito#! #V [JournalEntry.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!"
 gg_tt_backers_lean:0 "Which way the backers lean.\n#R Defensa#!: the commitment of the powers that stand Protector or Guarantor, and Urquiza's once he has pronounced.\n#blue_value Cerrito#!: Rosas's, and Urquiza's for as long as he stays at his side.\nBelow #V 40#!, a government loses endurance every month: a point for every #V 5#! it falls short."
