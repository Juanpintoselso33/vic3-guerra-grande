 gg_notice.14.d_nolegion:0 "In August the plaza resolved ‘to reconquer every port on the Uruguay’. With the intervention’s squadrons it took #b Colonia#!, Martín García and Gualeguaychú, and then the #b Salto#!, which its garrison gave up without a fight. #b Urquiza#!, on his way back from India Muerta, attacked the Salto early in December with three thousand horse, failed to take it and rode on to Corrientes, where Rosas had sent him; now he is back in Entre Ríos, on the far side of the river.\n\nOn 8 February, at San Antonio, #b Servando Gómez#! rode out with twelve hundred men — a third of them infantry, the Patricios de Buenos Aires battalion among them — to cut off #b Medina#!, who was coming down from the frontier with three hundred to reinforce the Salto. Gómez dated his dispatch ‘from the field of the Victory of San Antonio del Uruguay’. But Medina got into the Salto.\n\nIn the plaza they are celebrating San Antonio. North of the Río Negro #b Gómez#! commands; south of it, #b Ignacio Oribe#!. The two divisions can be brought together on the littoral, with the siege line thinner for it; the line can be held and the river left to the plaza for now; or Rosas can be asked for a division to cross the Uruguay."
 gg_notice.14.f:0 "From the Salto to Montevideo, one camp that calls itself victorious and one flag that calls itself invincible."
 gg_notice.14.a:0 "Bring the two divisions together on the littoral."
 gg_notice.14.a_tt:0 "@information! Men from the siege line go down to the river: the littoral stops paying the plaza, and the camp pays for it in endurance."
 gg_notice.14.b:0 "Hold the line and leave the river to the plaza, for now."
 gg_notice.14.b_tt:0 "@information! The siege line yields no men and the camp gets its rest; the littoral stays in the plaza’s hands, and the balance marks it in the colorados’ favour."
 gg_notice.14.c:0 "Ask Rosas for a division."
 gg_notice.14.c_tt:0 "@information! A division from Buenos Aires crosses the Uruguay: the camp breathes again and the balance marks it in the blancos’ favour; Rosas counts it as a favour owed."
 gg_notice.15.t:0 "The Schools of the Restauración"
 gg_notice.15.d:0 "On 18 July the plaza opened its Universidad Mayor in the chapel of San Ignacio, under the decree President #b Oribe#! signed in 1838. Across the walls, the Defensa has founded a university on this government’s own signature.\n\nOut here the schools were made from whatever there was. In 1843 #b Ramón Massini#! opened the Colegio Uruguayo; the first benches of #b José María Cordero#!’s school were planks from the army workshops, American barrels filled with stones and sand, and powder boxes, and strapping lads from the army sat among the children. In the Restauración stands the college the President had built, run by #b Cayetano Rivas#!; in 1846 Mercedes was given a schoolmaster at twenty-five pesos a month, his school under the inspection of the parish priest, to inspire in the children ‘love of country and attachment to the republican institutions that govern us’.\n\n#b El Defensor#! has its pen ready, as it had in 1847 for the plaza’s Institute of Public Instruction. The answer can also be schools: one for every town of the State, with a paid master, and a board of men of letters to direct them."
 gg_notice.15.f:0 "A university inside the wall; benches of powder boxes outside it."
 gg_notice.15.a:0 "A school in every town, and a board to direct them."
 gg_notice.15.a_tt:0 "@information! Paid masters, and schools under the parish priest’s inspection in the towns of the State: the government gains legitimacy and the Church approves. It comes out of the treasury."
 gg_notice.15.b:0 "Answer them in El Defensor."
 gg_notice.15.b_tt:0 "@warning! It costs not a peso; a polemic in place of schools does not please the intelligentsia."
 gg_arg_notice.1.t:0 "The Patrón Is Back"
 gg_arg_notice.1.d:0 "Your Excellency: #b Fructuoso Rivera#! has landed in Montevideo. The Empire had him in prison in Rio, accused of plotting with the republicans of Rio Grande; the city’s government named him its representative in Paraguay to keep him far away, Brazil refused him leave to travel to Asunción and put him aboard the schooner #b Perla#!.\n\nThe city forbade him to land. On 1 April the Basque battalion, the freedmen of the infantry and the forces of #b César Díaz#! and #b Venancio Flores#! rose; #b Pacheco y Obes#! gave up the command of arms and sailed for Europe, and the government annulled the banishment. Rivera came ashore on his wife’s arm, and today he is general in chief of the Army of Operations and grand marshal of the Republic.\n\nHe goes back to the countryside, and the Oriental countryside faces Entre Ríos along the whole river Uruguay. It remains to decide whether watching that bank is the Confederation’s business or President #b Oribe#!’s."
 gg_arg_notice.1.f:0 "The government that banished him made him grand marshal within two weeks."
 gg_arg_notice.1.a:0 "Let the Entre Ríos cavalry watch the Uruguay bank."
 gg_arg_notice.1.a_tt:0 "@information! The watch costs the treasury #N 10,000#!, and Buenos Aires is tied more closely to the Cerrito’s fortunes."
 gg_arg_notice.1.b:0 "It is President Oribe’s business."
 gg_arg_notice.2.t:0 "One Squadron Leaves"
 gg_arg_notice.2.d:0 "Your Excellency: #b Lord Howden#! has lifted the British blockade, on this bank and the other. He did it on the same day the Montevideo government rejected the four terms President #b Oribe#! had accepted, which asked, among other things, for the blockade to be lifted on both banks.\n\nCount #b Walewski#! refused to follow him: the French blockade goes on, and the alliance of the two powers in the Plata has broken apart in the roads of Montevideo.\n\nShips under the British flag may return to the Buenos Aires anchorage. It tells in the customs house; it does not decide the war."
 gg_arg_notice.2.d_truce:0 "Your Excellency: the Montevideo government has accepted the four terms President #b Oribe#! offered: six months without hostilities, the troops where they stand, cattle for the city and the blockade lifted on both banks. #b Lord Howden#! had already lifted the British one, on this bank and the other.\n\nCount #b Walewski#! refused to follow him: the French blockade goes on, and the alliance of the two powers in the Plata has broken apart in the roads of Montevideo.\n\nShips under the British flag may return to the Buenos Aires anchorage. It tells in the customs house; it does not decide the war."
 gg_arg_notice.2.f:0 "Two powers came into the river together; they leave one at a time."
 gg_arg_notice.2.a:0 "Open the customs house to the British flag."
 gg_arg_notice.2.a_tt:0 "@information! British ships come back: the customs house collects #P 15,000#!. The French blockade goes on."
 gg_arg_notice.3.t:0 "An Exile in the Calle Misiones"
 gg_arg_notice.3.d:0 "Your Excellency: in Montevideo they have killed #b Florencio Varela#!, the Argentine exile who edited #b El Comercio del Plata#! and whom the city’s government sent to London and Paris to ask for intervention against this Confederation. It was on the night of Monday 20 March, in the calle Misiones, a knife in the back.\n\nThe man who killed him is a Canary Islander, #b Andrés Cabrera#!, who did not even know him by sight and fled towards the Cerrito’s lines. The city’s press has already passed sentence: Oribe, Rosas, or both.\n\nIt happened in the week two mediators arrived, #b Gore#! and Baron #b Gros#!, who will not go ashore. Whatever is said from Buenos Aires, they will read it first."
 gg_arg_notice.3.f:0 "Every newspaper in the city has its own culprit."
 gg_arg_notice.3.a:0 "Let the #b Archivo Americano#! answer."
 gg_arg_notice.3.a_tt:0 "@information! The press costs #N 5,000#!, and Buenos Aires answers in public for its ally."
 gg_arg_notice.3.b:0 "Let President Oribe answer for his own camp."
 gg_arg_notice.4.t:0 "Belligerent Mediators"
 gg_arg_notice.4.d:0 "Your Excellency: the mediators #b Robert Gore#! and Baron #b Gros#! laid down their terms on 5 April: President #b Oribe#! to discharge the Argentine troops, Montevideo to disband and disarm its legions, and both at once. At the Cerrito they tried to part the President from this Confederation.\n\nThe President does not part, and the Restorer’s letter to him says it all: ‘What kind of mediators are these? They cannot be mediators, because they are belligerents. Have they not made war on you? Have they not bombarded the ports of the Argentine Confederation, your ally?’\n\nThe #b Archivo Americano#! has already passed judgement on the mission: ‘insidious in its plan, clumsy in its execution, ridiculous in its results’. They will read it in London and in Paris."
 gg_arg_notice.4.f:0 "‘They cannot be mediators, because they are belligerents.’"
 gg_arg_notice.4.a:0 "Publish it."
 gg_gore_gros_refused_tt:0 "@information! The refusal reaches #b Buenos Aires#!, which makes it its own before the mediators."
 gg_howden_answered_tt:0 "@information! The city’s answer reaches the #b Cerrito#! and #b Buenos Aires#!."
