l_english:
 gg_tt_endurance_defensa_5:0 "Endurance of #R the Defensa#!: #P +5#!"
 gg_tt_endurance_cerrito_5:0 "Endurance of #blue_value the Cerrito#!: #P +5#!"
 gg_notice.1.t:0 "The Convention of 29 May"
 gg_notice.1.d:0 "Three men sign in Montevideo: the Empire’s chargé d’affaires, #b Rodrigo de Souza da Silva Pontes#!; our Minister of Government and Foreign Affairs, #b Manuel Herrera y Obes#!; and, for the State of Entre Ríos, #b Antonio Cuyás y Sampere#!. Article I says what for: an offensive and defensive alliance ‘to make General Don Manuel Oribe and the Argentine forces he commands leave its territory’, and afterwards, ‘things being restored to their normal state’, the free election of the President under the Constitution.\n\nThe price is written down too. Article V lets the Empire’s forces guard persons and property ‘up to a distance of twenty leagues within the Oriental State’. Article XIX binds this government to make #b Eugenio Garzón#! general in chief ‘as soon as the said General has recognised the Government of Montevideo as the Government of the Republic’. Article XXI leaves the president who is elected the duty of concluding with the Empire ‘all the arrangements and conventions’ still outstanding.\n\nArticle XXIV orders that the convention ‘be kept secret until the end it aims at is achieved’. Eight years of siege end, if they end, with a paper the city cannot yet read. What remains is how to fulfil it: count on the Empire’s army marching to the frontier, as Article IV promises, or bring back the emigrés Article VII asks for, ‘at the Republic’s expense’."
 gg_notice.1.f:0 "Twenty-four articles, and the last one says no one may read them."
 gg_notice.1.a:0 "Let the Empire march to the frontier, as Article IV says."
 gg_notice.1.a_tt:0 "@information! The Defensa trusts the end of the siege to the Empire’s army: the city sees the end, and #b Brazil#! weighs more in whatever peace comes."
 gg_notice.1.b:0 "Bring the emigrés home, at the Republic’s expense."
 gg_notice.1.b_tt:0 "@information! The customs house pays #N 20,000#! in passages and kit for the emigrés; Orientals back under arms count for the Defensa at the table, without owing the Empire more."
 gg_notice.2.t:0 "The Empire’s Army Crosses"
 gg_notice.2.d:0 "The Count of #b Caxias#! crosses at Santana with 16,200 men in four divisions: 6,500 infantry, 8,900 cavalry, 800 gunners, twenty-six guns. It is what the Empire signed in May, in Article IV of the Convention: that its army would march to the frontier ‘to go into action on the territory of the Republic when necessary’.\n\nArticle VI placed the allies under the Oriental general in chief, unless their forces outnumbered ours. They do: sixteen thousand men fit under no general of this city, and the same article allows for it. They are led by a commander of their own nation, who must ‘come to an agreement with the general of the Oriental army’ on the conduct of the war.\n\nArticle V also gives the Empire twenty leagues of frontier in which to protect Brazilians ‘against robberies, murders and outrages’. That army can be let in with everything it brought, to shorten the war, or asked to keep to its strip and leave the campaign to the Orientals and to Entre Ríos."
 gg_notice.2.d_contracts:0 "The Count of #b Caxias#! crosses at Santana with 16,200 men in four divisions: 6,500 infantry, 8,900 cavalry, 800 gunners, twenty-six guns. No convention with Entre Ríos brings him; in this city it is taken for granted that he comes on the strength of last September’s contracts: eighteen thousand pesos fortes a month, lent by the Empire so that the plaza of Montevideo would not fall.\n\nThe receipts #b Souza#! collects are titles to a debt owed to Brazil, secured on the Republic’s revenues ‘quando se restabelecer a ordem’. Here the contracts are read the only way they can be: whoever lends to a besieged plaza so that it does not fall has already taken a side in the siege.\n\nWithout a treaty no article sets it a strip of frontier or places it under our general in chief. Sixteen thousand men cross under a commander of their own nation and ask no leave: all this city’s government can do is open the campaign to them."
 gg_notice.2.f:0 "Sixteen thousand men do not wait for the general in chief’s orders."
 gg_notice.2.a:0 "Let the Allied Army in."
 gg_notice.2.a_tt:0 "@battalions! The Allied Army enters the Oriental campaign and joins the siege’s forces; #b Brazil#! gains weight in the Defensa."
 gg_notice.2.b:0 "Let the Empire keep to its twenty leagues."
 gg_notice.2.b_tt:0 "@information! The campaign stays in Oriental and Entre Ríos hands: the blow to the Cerrito is smaller, and #b Brazil#! weighs less in the Defensa."
 gg_notice.10.t:0 "The City’s Answer"
 gg_notice.10.d:0 "The city’s answer arrives to the four terms the President accepted: six months without hostilities, the troops where they stand, fifteen hundred head of cattle a month for Montevideo and the blockade lifted on both banks. Minister #b Barreiro#! says no: keeping the blockades ‘is one of the conditions of our existence’.\n\nThat same day #b Lord Howden#! lifts the British blockade, on both banks. Count #b Walewski#! refuses to lift the French one, and the alliance of the two powers that closed the river splits apart in the roads.\n\nFor the camp it is the first squadron to go. The French remain, and so does the city, which chose to stay hungry rather than give us six months of rest."
 gg_notice.10.d_truce:0 "The city accepts the four terms the President offered: six months without hostilities, the troops where they stand, fifteen hundred head of cattle a month for Montevideo and the blockade lifted on both banks.\n\n#b Lord Howden#! has already lifted the British blockade, on both banks. Count #b Walewski#! refuses to lift the French one, and the alliance of the two powers that closed the river splits apart in the roads.\n\nFor the camp it means six months without a shot, to remount the cavalry and rest men who have spent years on the line. The beef the city eats comes from our estancias."
 gg_notice.10.f:0 "One squadron leaves; the other stays."
 gg_notice.10.a:0 "Let the camp know."
 gg_notice.11.t:0 "The Night in the Calle Misiones"
 gg_notice.11.d:0 "On the night of Monday 20 March #b Florencio Varela#! is killed in the calle Misiones: the editor of #b El Comercio del Plata#!, the man the city sent to London and Paris to ask for intervention. Stabbed from behind, a few steps from his door.\n\nThe killer is #b Andrés Cabrera#!, a Canary Islander who cannot read, and who did not know him by sight: someone pointed him out from the shadows. Cabrera has fled towards our lines, and the city’s press already has its culprit: Oribe, Rosas, or both.\n\nIt happens in the week the mediators #b Gore#! and #b Gros#! arrived, who will not go ashore and run everything from their ships. Whatever the Cerrito answers, they will read it first."
 gg_notice.11.f:0 "One knife in the calle Misiones, and a culprit in every newspaper."
 gg_notice.11.a:0 "Let #b El Defensor de la Independencia Americana#! answer."
 gg_notice.11.b:0 "Find Cabrera and bring him before a judge."
 gg_notice.11.b_tt:0 "@information! The camp does not want to hand over one of its own, but the mediators see a government that does not cover up a crime: #b France#! backs the Defensa less."
 gg_notice.12.t:0 "Gros and the Buceo"
 gg_notice.12.d:0 "In June Baron #b Gros#!, Vice-Admiral #b Le Prédour#! and the chargé d’affaires #b Devoize#! sign an agreement of assistance with the city’s government: forty thousand pesos a month, ‘in money or in bills on France’, as a loan. It is the price of the French blockade, which Gros declares at an end: France withdraws from Rosas’s port and from ours, and pays Montevideo so that the city does not feel it.\n\nOn the 14th the city’s garrison abandons #b Maldonado#! aboard French steamers, and not one enemy sail is left off the Buceo. The captain of the port, #b Joaquín Idoyaga#!, refers the first case upward: the Brazilian smack #b Delmira#! claims to come from Rio Grande and carries goods from Montevideo. Headquarters answers as it always has: she is to sail without trading, and her papers are to record that she may put in at no other point of our coast.\n\nYet the camp feeds an army of more than fourteen thousand men and a town, the Restauración, that grows by the month. A Buceo open to every flag, wherever it last called, fills the customs house; Buenos Aires, which in the Confederation’s ports demands a bond of twice the cargo’s value on anything shipped from Montevideo, will call it trading with the enemy. A Buceo closed to whatever has touched the plaza keeps the siege a siege."
 gg_notice.12.f:0 "France leaves the river and stays in the treasury; not a sentry is left off the Buceo."
 gg_notice.12.a:0 "Let every flag in, wherever it last called."
 gg_notice.12.a_tt:0 "@information! The Buceo’s customs house taxes what has passed through the plaza as well, and the camp lives on it: the #blue_value Cerrito#! regains #P +3#! endurance a month for #V 36#! months. The plaza’s consignees profit too, and Buenos Aires takes it for trading with the enemy."
 gg_notice.12.b:0 "Turn away every ship that has touched the plaza."
 gg_notice.12.b_tt:0 "@information! The siege stays a siege: nothing that comes in at the Buceo leaves Montevideo a single peso. Buenos Aires approves."
 gg_notice.13.t:0 "Arana and Southern"
 gg_notice.13.d:0 "In Buenos Aires Minister #b Felipe Arana#! and the British minister #b Henry Southern#! sign; Southern waited through fifteen postponements before presenting his credentials. Great Britain evacuates Martín García, returns the warships she took and salutes the Argentine flag with twenty-one guns.\n\nWhat matters in the Cerrito lies in other clauses. The treaty recognises the Confederation’s right to settle its question with the Republic without foreign intervention, the right of blockade included; and the sixth article states that Buenos Aires signed only with the prior assent of its ally, President #b Oribe#!, ‘an indispensable condition of any settlement’. That assent has been given.\n\nThere remains the third article: the Argentine auxiliary divisions ‘shall recross the Uruguay when the French government disarms the foreign legion’ and the other foreigners under arms in the plaza. To wait on Paris is to keep Rosas’s battalions in the field; to give up now what Buenos Aires pays for them is to let the Republic bear its war alone."
 gg_notice.13.f:0 "Twenty-one guns for a flag London once meant to shut out."
 gg_notice.13.a:0 "We assent, as an ally: the divisions stay."
 gg_notice.13.a_tt:0 "@information! Buenos Aires is grateful, and the divisions remain in the field."
 gg_notice.13.b:0 "We assent, and the Republic bears its war alone."
 gg_notice.13.b_tt:0 "@warning! Buenos Aires stops paying and supplying its auxiliary divisions: the #blue_value Cerrito#! loses the endurance they gave (#P +2#! a month) and their edge in fire and stores. The battalions already in its lines stay, at the Republic's charge. The balance marks it; Buenos Aires takes it ill."
 gg_notice.14.t:0 "The Littoral after San Antonio"
 gg_notice.14.d:0 "In August the plaza resolved ‘to reconquer every port on the Uruguay’. With the intervention’s squadrons it took #b Colonia#!, Martín García and Gualeguaychú, and then the #b Salto#!, which its garrison gave up without a fight. #b Urquiza#!, on his way back from India Muerta, attacked the Salto early in December with three thousand horse, failed to take it and rode on to Corrientes, where Rosas had sent him; now he is back in Entre Ríos, on the far side of the river.\n\nOn 8 February, at San Antonio, #b Servando Gómez#! rode out with twelve hundred men — a third of them infantry, the Patricios de Buenos Aires battalion among them — to cut off #b Medina#!, who was coming down from the frontier with three hundred to reinforce the Salto. #b Garibaldi#! covered him with some two hundred legionaries and a hundred of Báez’s horsemen: the cavalry fell back on the Salto, and the infantry held from noon until nine at night. Gómez dated his dispatch ‘from the field of the Victory of San Antonio del Uruguay’, and the camp’s paper wrote that ‘the savage pirate Garibaldi barely escaped lying dead like most of his soldiers’. But Medina got into the Salto, and the plaza had the legion’s flag inscribed: ‘Invincible, they fought on 8 February 1846’.\n\nIn the plaza they are celebrating San Antonio. North of the Río Negro #b Gómez#! commands; south of it, #b Ignacio Oribe#!. The two divisions can be brought together on the littoral, with the siege line thinner for it; the line can be held and the river left to the plaza for now; or Rosas can be asked for a division to cross the Uruguay."
