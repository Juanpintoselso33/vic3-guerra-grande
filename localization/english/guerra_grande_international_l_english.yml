l_english:
 gg_int_arg_offer_button:0 "Offer aid to Oribe"
 gg_int_arg_offer_button_desc:0 "Put an extraordinary payment before Oribe's government. Buenos Aires pays only if the other government accepts a diplomatic obligation."
 gg_int_arg_offer_possible:0 "The conflict remains unresolved; Oribe has a government able to receive the offer; at least #V 4#! provinces still delegate; no previous extraordinary offer has been sent. Reserves must cover #V £20,000#! with at least #V 10#! delegating provinces, or #V £10,000#! otherwise."
 gg_int_arg_offer_tt:0 "Send a single extraordinary aid offer: #V £20,000#! with at least #V 10#! delegating provinces, otherwise #V £10,000#!. No money moves until acceptance. The recipient may refuse; an unanswered or refused offer cannot be sent again."
 gg_int_arg_withdraw_button:0 "Withdraw financial backing"
 gg_int_arg_withdraw_button_desc:0 "End the campaign's monthly access to Argentine funds. Earlier payments and the diplomatic obligation are not cancelled."
 gg_int_arg_withdraw_possible:0 "An extraordinary offer was accepted, the conflict remains unresolved, and financial backing has not already been withdrawn."
 gg_int_arg_withdraw_tt:0 "Stop the Cerrito's regular monthly subsidy for the rest of this conflict. Earlier payments are not refunded and the diplomatic obligation remains."
 gg_int_arg_accept_tt:0 "Buenos Aires pays #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#! and this government receives the same amount. The expenditure is recorded in the Federal Pact account. A diplomatic obligation is owed to the donor; this does not surrender independence."
 gg_int_arg_decline_tt:0 "Close this extraordinary offer without transferring funds or creating an obligation. While the conflict remains unresolved, Rosas's backing falls by #N 5#!."
 gg_int_status_pending:0 "#Y Awaiting Oribe's reply#! to an offer of #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#!. Nothing has been paid."
 gg_int_status_refused:0 "#Y The extraordinary offer is closed#!. No payment or obligation arose from it."
 gg_int_status_withdrawn:0 "#N Argentine financial backing withdrawn#!. Regular payments to the Cerrito are suspended; earlier aid and the obligation incurred are not cancelled."
 gg_int_pact_account:0 "\n\n#b Aid to Oribe#!: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#! remitted in extraordinary funds. Buenos Aires's backing: #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100. Provincial withdrawals limit the amount that can be offered."
 gg_international.2.t:0 "An offer from Buenos Aires"
 gg_international.2.d:0 "Buenos Aires offers an extraordinary remittance to sustain our government. The money would leave its own treasury; the offer is not an order to enter another country's war.\n\nThe condition is diplomatic. By taking the funds we would owe an obligation to the government that supplies them. Recognition of our independence is not surrendered, but neither could we treat this assistance as a gift without consequences.\n\nThe treasury asks whether we should accept these terms or rely on our own resources. No payment can proceed if the donor can no longer afford it or the government for which it was intended is no longer ours."
 gg_international.2.f:0 "The remittance and the undertaking belong to the same agreement."
 gg_international.2.a:0 "Accept the funds and the obligation."
 gg_international.2.b:0 "Close the offer without accepting it."
