l_english:
 gg_int_arg_offer_possible:0 "The conflict is still unresolved; Oribe has a government able to receive the offer; at least #V 4#! provinces still delegate; no extraordinary offer has been made before. The treasury must be able to cover #V £20,000#! if at least #V 10#! provinces delegate, or #V £10,000#! otherwise."
 gg_int_arg_offer_tt:0 "Make a single offer of extraordinary aid: #V £20,000#! if at least #V 10#! provinces delegate, otherwise #V £10,000#!. No money changes hands until it is accepted. The recipient may refuse; an offer left unanswered or refused cannot be made again."
 gg_int_arg_withdraw_possible:0 "An extraordinary offer has been accepted, the conflict is still unresolved, and financial backing has not yet been withdrawn."
 gg_int_arg_withdraw_tt:0 "Suspend the Cerrito's regular monthly subsidy for the rest of the conflict. Past payments are not refunded, and the diplomatic obligation stands."
 gg_int_arg_accept_tt:0 "Buenos Aires pays #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#! and this government receives the same sum. The outlay is entered in the Federal Pact's accounts. A diplomatic obligation is owed to the donor; independence is not surrendered."
 gg_int_arg_decline_tt:0 "Close this extraordinary offer: no money changes hands and no obligation is incurred. While the conflict remains unresolved, Rosas's backing falls by #N 5#!."
 gg_int_pact_account:0 "\n\n#b Aid to Oribe#!: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#! remitted as extraordinary funds. Buenos Aires's backing: #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100. Provinces that withdraw their mandate reduce the sum that can be offered."
 gg_international.2.t:0 "An Offer from Buenos Aires"
 gg_international.2.d:0 "Buenos Aires offers an extraordinary remittance to sustain our government. The money would come from its own treasury; the offer does not oblige us to enter another country's war.\n\nThe condition is diplomatic. In taking the funds we would incur an obligation to the government that provides them. We would not be giving up the recognition of our independence, but nor could we treat this help as a gift that costs nothing.\n\nThe treasury asks us to decide whether to accept these terms or rely on our own resources. No payment can be made if the donor can no longer afford it, or if the government it was meant for is no longer ours."
 gg_international.2.f:0 "The remittance and the undertaking are one and the same bargain."
 gg_international.2.a:0 "Accept the funds and the obligation."
 gg_international.2.b:0 "Decline the offer."
 gg_international.10.t:0 "Oribe Asks for Funds"
 gg_international.10.d:0 "Oribe's agent in Buenos Aires has come with the accounts of his army: pay in arrears, horses to be bought, powder that does not arrive. He asks the Restorer for an extraordinary remittance, and the treasury can bear it: #V £20,000#!, or #V £10,000#! if fewer than #V 10#! provinces still delegate.\n\nIf Oribe accepts, his government will be in debt to Buenos Aires."
 gg_international.10.f:0 "A request from the Cerrito's agent in Buenos Aires."
 gg_international.10.a:0 "Send the remittance."
 gg_international.10.b:0 "Not now."
 gg_international.10.b_tt:0 "Oribe's agent will ask again within the year."
 gg_international.11.t:0 "Who Answers for Oribe's Army"
 gg_international.11.d:0 "No more than #N [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! provinces still delegate to Buenos Aires, and the Sala wants to know whether the Confederation can go on answering for the army before Montevideo. Withdrawing the backing stops the monthly money as well."
 gg_international.11.f:0 "A question from the Sala de Representantes."
 gg_international.11.a:0 "Withdraw the backing."
 gg_international.11.b:0 "Oribe keeps our backing."
 gg_international.11.b_tt:0 "The Sala will ask again within the year if the provinces have not come back."
