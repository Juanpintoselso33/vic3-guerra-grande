l_english:
 gg_cisplatina.1.t:0 "The Banda Oriental: Province or Republic?"
 gg_cisplatina.1.d:0 "The Cerrito's Assembly sits again on 11 August, and its first act is to confirm Oribe as lawful president. In the Government House they are thinking further ahead: seventeen years after the Preliminary Convention of 1828, the independence of the Banda Oriental is still, for many Federalists, a wound Lord Ponsonby opened and nobody closed.\n\nThe Restorer means to offer Oribe the 'reunification of the fatherland': the Oriental Province back in the Confederation, with its own government like any other province of the Pact. What remains to be settled is how hard to press. An offer can be sent to a committee; a formal request, with Buenos Aires's battalions holding the Cerrito's line, is another matter.\n\nIn Paraná and Corrientes any larger Buenos Aires is watched with suspicion, and the chargés d'affaires of London and Paris make no secret that they want the Plata with two banks and an open river."
 gg_cisplatina.1.f:0 "'Reunify the fatherland,' they said in Buenos Aires; 'annul the Convention,' they read in Rio de Janeiro."
 gg_cisplatina.1.a:0 "Ask him to come back as a province of the Confederation."
 gg_cisplatina.1.b:0 "Leave it as an offer: Oribe will know what suits him."
 gg_cisplatina.1.a_tt:0 "@information! Oribe receives the request with the full weight of Buenos Aires's support behind it: if he wins the war, returning as a #b province#! (of the Pact, or fully incorporated) becomes his likeliest choice, and incorporation stays within his reach even if he does not accept now.\n@warning! The Litoral wants no larger Buenos Aires: #b Urquiza#!'s backing falls by #N 10#!. Great Britain and France, who want the Plata with two banks, cool towards us: #N -25#! with each."
 gg_cisplatina.1.b_tt:0 "@information! The offer reaches the Cerrito with no more pressure than usual."
 gg_cisplatina.2.t:0 "The Convention of 1828 Broken"
 gg_cisplatina.2.desc:0 "A month has passed since the Oriental Province rejoined the Argentine Confederation, and in Rio de Janeiro the Council of State rereads the text signed in this very city on 27 August 1828. Its first article parted the province of Montevideo, then called Cisplatina, from the Empire; the second bound the United Provinces to recognise it as independent; the third pledged both governments to defend that independence.\n\nThe definitive peace treaty the Convention promised was never signed, and in Buenos Aires they hold that this leaves their hands free. Rio does not read it so: the independence of the Banda Oriental was the price of peace, and Rosas has just taken it without paying anything. The ranchers of Rio Grande, with land and cattle across the Quaraí, ask what the Empire means to do.\n\nThe Minister of Foreign Affairs lays three roads to war and one of protest on the table."
 gg_cisplatina.2.f:0 "Third: both high contracting parties bind themselves to defend the independence and integrity of the Province of Montevideo. — Preliminary Peace Convention, 1828"
 gg_cisplatina.2.a:0 "Protest, and no more: this is no time for another war on the Plata."
 gg_cisplatina.2.b:0 "Enforce the Convention: the Republic must exist again."
 gg_cisplatina.2.c:0 "If the Convention no longer holds, the Cisplatina returns to the Empire."
 gg_cisplatina.2.d:0 "A free Republic, but under the Empire's protection."
 gg_cisplatina.2.a_tt:0 "@information! No war. Relations with Argentina fall by #N 30#!."
 gg_cisplatina.2.b_tt:0 "@warning! The Empire breaks with Argentina and #b waits for its moment#!: it declares war when Argentina is at war or its army is smaller than the Empire's. If it wins, the #b Oriental Republic of Uruguay#! exists again with all its states; if not, the Oriental Province stays in the Confederation. After 1852 the question is dropped."
 gg_cisplatina.2.c_tt:0 "@warning! The Empire breaks with Argentina and #b waits for its moment#!: it declares war when Argentina is at war or its army is smaller than the Empire's. If it wins, the Oriental states pass to #b Brazil#!; if not, the Oriental Province stays in the Confederation. After 1852 the question is dropped."
 gg_cisplatina.2.d_tt:0 "@warning! The Empire breaks with Argentina and #b waits for its moment#!: it declares war when Argentina is at war or its army is smaller than the Empire's. If it wins, the #b Oriental Republic of Uruguay#! exists again as a protectorate of Brazil; if not, the Oriental Province stays in the Confederation. After 1852 the question is dropped."
 gg_cisplatina.4.t:0 "The Second Cisplatine War Ends"
 gg_cisplatina.4.d_1:0 "The Empire's arms have settled what the Convention could not uphold on its own: the flag of nine stripes flies again over the Fort of Montevideo, and the Oriental Republic of Uruguay exists once more, mistress of all its departments.\n\nIn Buenos Aires they speak of allies' treachery and the weakness of treaties; in Rio, of the word given in 1828. In Montevideo, of starting again."
 gg_cisplatina.4.d_2:0 "What was lost at Ituzaingó has been won back twenty years later: the Oriental departments return to the Empire, and the Quaraí is a frontier no longer.\n\nIn Buenos Aires the defeat is paid for in the Legislature; in Montevideo, those who asked to rejoin the Confederation find they never asked to rejoin Brazil."
 gg_cisplatina.4.d_3:0 "The Oriental Republic of Uruguay exists again, but its independence now has a guarantor who sits in Rio de Janeiro: the Empire conducts its foreign relations, and no government in Montevideo will be able to forget it.\n\nIn Buenos Aires they say one dependence has been traded for another. In Rio, that the Convention has been kept."
 gg_cisplatina.4.d_0:0 "The Empire could not impose its terms. The Oriental Province remains in the Argentine Confederation, and the Convention of 1828 is left, once again, a paper each bank reads its own way."
 gg_cisplatina.4.f:0 "Twice in twenty years the same bank was fought over."
 gg_cisplatina.4.a:0 "Let it be known."
 gg_cis_play_name:0 "The Second Cisplatine War"
 dp_gg_cisplatina:0 "Enforce the Convention of 1828"
 gg_peace_reincorporation_brazil_tt:0 "@warning! It breaks the #b Preliminary Peace Convention of 1828#!: #b Brazil#! will answer."
 gg_cisplatina.1.c:0 "Ask him for a republic apart, recognised, under our protection."
 gg_cisplatina.1.c_tt:0 "@information! If he wins the war, Oribe leans towards a #b republic apart#!: independent and recognised, but under Buenos Aires's protection, flying the familiar Uruguayan flag. It does not break the Convention of 1828.\n@warning! Great Britain and France are wary all the same: #N -10#! with each."
 gg_cisplatina.5.t:0 "The Banda Oriental Returns"
 gg_cisplatina.5.d_1:0 "Oribe has entered Montevideo, and his first dispatch comes to Buenos Aires: the Banda Oriental wishes to return to the Confederation as one more province of the Pact, with its own government, its own Chamber and its own governor, who will be he.\n\nIn the Government House some think that a province with its own government is a province that may leave again tomorrow, and that the moment calls for incorporating it outright. Others recall that the Pact rests precisely on no province losing its government.\n\nThe decision is the Restorer's."
 gg_cisplatina.5.d_2:0 "Oribe has entered Montevideo, and his first dispatch comes to Buenos Aires: the Republic renounces itself and places the whole Banda Oriental in the Confederation's hands, without conditions.\n\nIn the Government House some think it best to accept it so, fully incorporated, and others fear that swallowing a whole republic will cost Buenos Aires the trust of the other provinces, which delegate but do not surrender.\n\nThe decision is the Restorer's."
 gg_cisplatina.5.f:0 "Seventeen years after 1828, the other bank knocks at the door again."
 gg_cisplatina.5.a:0 "Incorporate it outright: the Banda Oriental is the Confederation's land."
 gg_cisplatina.5.b:0 "Let it be a province of the Pact, with its own government."
 gg_cisplatina.6.t:0 "The Empire Declares War on Us"
 gg_cisplatina.6.d_1:0 "Rio de Janeiro invokes the Convention of 1828 and declares war: the Empire says it fights so that the Oriental Republic may exist again.\n\nBrazilian divisions gather in Rio Grande and the squadron readies itself for the Plata. In Buenos Aires they debate whether the Banda Oriental is worth a war with the Empire."
 gg_cisplatina.6.d_2:0 "Rio de Janeiro invokes the Convention of 1828 and declares war, but not to restore anyone's independence: the Empire wants the Cisplatina for itself, as before Ituzaingó.\n\nBrazilian divisions gather in Rio Grande and the squadron readies itself for the Plata. In Buenos Aires they debate whether the Banda Oriental is worth a war with the Empire."
 gg_cisplatina.6.d_3:0 "Rio de Janeiro invokes the Convention of 1828 and declares war: it says it fights for the independence of the Oriental Republic, but a Republic that would stand under the Empire's protection.\n\nBrazilian divisions gather in Rio Grande and the squadron readies itself for the Plata. In Buenos Aires they debate whether the Banda Oriental is worth a war with the Empire."
 gg_cisplatina.6.f:0 "The second time the same bank is fought over."
 gg_cisplatina.6.a:0 "Defend the Oriental Province."
 gg_cisplatina.6.b:0 "Yield: we will not fight another war with the Empire."
 gg_cisplatina.6.a_tt:0 "@warning! #b War with Brazil#!. If we win it or it ends in a white peace, the Oriental Province stays in the Confederation. If we lose, the Empire takes what it came for."
 gg_cisplatina.6.b_tt:0 "@warning! The war ends at once, and the Empire takes #b what it came for#!: the Republic freed, the Cisplatina for Brazil, or the Republic under its protection."
