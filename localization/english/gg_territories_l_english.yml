# EN: 24/9/2026 (AUD-CONST-TERR) -- a national territory becomes a province under the confederation (events/gg_arg_territories.txt).
 gg_arg_territories.1.t:0 "A Territory Asks to Be a Province"
 gg_arg_territories.1.t_la_pampa:0 "La Pampa Asks to Be a Province"
 gg_arg_territories.1.t_neuquen:0 "Neuquén Asks to Be a Province"
 gg_arg_territories.1.t_rio_negro:0 "Río Negro Asks to Be a Province"
 gg_arg_territories.1.t_chubut:0 "Chubut Asks to Be a Province"
 gg_arg_territories.1.t_santa_cruz:0 "Santa Cruz Asks to Be a Province"
 gg_arg_territories.1.t_tierra_del_fuego:0 "Tierra del Fuego Asks to Be a Province"
 gg_arg_territories.1.t_misiones:0 "Misiones Asks to Be a Province"
 gg_arg_territories.1.t_formosa:0 "Formosa Asks to Be a Province"
 gg_arg_territories.1.t_chaco:0 "Chaco Asks to Be a Province"
 gg_arg_territories.1.d:0 "The frontier census has reached the government's desk: the territory Buenos Aires administers in the Confederation's name has reached sixty thousand souls, and trade, the mail and the judges reach its towns as they reach any province's. Its settlers ask for what the others have: a governor of their own, a legislature and their own revenues.\n\nThe Pact of 1831 knows no territories: it knows provinces that recognise one another's ‘liberty, independence, representation and rights’. And its article 12 says how one more enters: ‘with the express and unanimous consent of each of the other federal provinces’. To ask for it is to add a signature to that treaty; to refuse it is to go on governing from Buenos Aires sixty thousand people who elected no one.\n\nBuenos Aires would keep what the other provinces entrusted to it: foreign relations."
 gg_arg_territories.1.d_ley:0 "The frontier census has reached the government's desk: the territory Buenos Aires administers in the Confederation's name has reached sixty thousand souls, and trade, the mail and the judges reach its towns as they reach any province's. Its settlers ask for what the others have: a governor of their own, a legislature and their own revenues.\n\nThe figure is that of the national territories law of 1884: ‘When the population of a Gobernación reaches sixty thousand inhabitants, established by the general census and the successive supplementary censuses, it shall have the right to be declared an Argentine province’. The Pact of 1831 knows no territories: it knows provinces that recognise one another's ‘liberty, independence, representation and rights’, and admits another ‘with the express and unanimous consent of each of the other federal provinces’.\n\nBuenos Aires would keep what the other provinces entrusted to it: foreign relations."
 gg_arg_territories.1.f:0 "Where sixty thousand settlers live, a province asks to sign."
 gg_arg_territories.1.a:0 "Ask the provinces' consent and admit it to the Pact."
 gg_arg_territories.1.a_tt:0 "@information! The territory becomes a country, a #b Province of the Pact#! under Buenos Aires, with its governor and its legislature, and its land is #P incorporated#!. Buenos Aires keeps foreign relations; the territory is no longer its own ground."
 gg_arg_territories.1.b:0 "Let it wait for the next census."
 gg_arg_territories.1.b_tt:0 "@warning! The settlers take note: #N +10%#! radicals in the territory. The request is not taken up again for #V 5#! years."
 gg_arg_territories.2.t:0 "A New Province of the Pact"
 gg_arg_territories.2.t_la_pampa:0 "The Province of La Pampa"
 gg_arg_territories.2.t_neuquen:0 "The Province of Neuquén"
 gg_arg_territories.2.t_rio_negro:0 "The Province of Río Negro"
 gg_arg_territories.2.t_chubut:0 "The Province of Chubut"
 gg_arg_territories.2.t_santa_cruz:0 "The Province of Santa Cruz"
 gg_arg_territories.2.t_tierra_del_fuego:0 "The Province of Tierra del Fuego"
 gg_arg_territories.2.t_misiones:0 "The Province of Misiones"
 gg_arg_territories.2.t_formosa:0 "The Province of Formosa"
 gg_arg_territories.2.t_chaco:0 "The Province of Chaco"
 gg_arg_territories.2.d:0 "The government of Buenos Aires, charged with the Confederation's foreign relations, has gathered the consent of the federal provinces and admitted this territory to the Pact. From today it has its own governor and legislature, collects its own revenues and signs the Pact of 1831 like the others: its ‘liberty, independence, representation and rights’ are recognised, and it recognises theirs.\n\nWhat does not change: relations with foreign powers remain in Buenos Aires, as the other provinces entrusted them.\n\nThe frontier is still the frontier. What was an office of the government of Buenos Aires is now a government."
 gg_arg_territories.2.f:0 "One more signature at the foot of the Pact."
 gg_arg_territories.2.a:0 "Let the legislature sit."
 gg_arg_territories.2.a_tt:0 "@information! We are a #b Province of the Pact#!: our own government and revenues; foreign relations, in Buenos Aires."
