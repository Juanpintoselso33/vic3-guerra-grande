 gg_war_ui_diplomacy_2:0 "The talks have broken down: for one or two years nobody will call the other to the table."
 gg_war_ui_diplomacy_3:0 "#Y Peace terms are on the table.#! While they are weighed, nobody else is called to negotiate."
 gg_war_ui_diplomacy_4:0 "#Y A truce holds.#! While it lasts, the river does not count and nobody is called to negotiate."
 gg_war_ui_diplomacy_5:0 "#P Peace has been signed.#!"
