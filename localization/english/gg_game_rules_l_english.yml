l_english:
 rule_gg_war_outcome:0 "#blue_value GG#! End of the Guerra Grande"
 setting_gg_war_outcome_dynamic:0 "Dynamic"
 setting_gg_war_outcome_dynamic_desc:0 "The arbiter decides by score, endurance and the river, on the siege's calendar: either government may win."
 setting_gg_war_outcome_historical:0 "Historical"
 setting_gg_war_outcome_historical_desc:0 "Peace comes in October 1851, as it did: neither victors nor vanquished. Nobody gives in before."
 setting_gg_war_outcome_defensa:0 "The Defensa Wins"
 setting_gg_war_outcome_defensa_desc:0 "The Cerrito may fall earlier; the Defensa never. If the war still runs in October 1851, the Defensa dictates the peace."
 setting_gg_war_outcome_cerrito:0 "The Cerrito Wins"
 setting_gg_war_outcome_cerrito_desc:0 "The Defensa may fall earlier; the Cerrito never. If the war still runs in October 1851, the Cerrito dictates the peace."
 setting_gg_war_outcome_defensa_punish:0 "The Defensa Wins: Punishment"
 setting_gg_war_outcome_defensa_punish_desc:0 "The Defensa wins and enforces the decrees of February 1843: the Blancos are proscribed."
 setting_gg_war_outcome_defensa_brazil_treaties:0 "The Defensa Wins: Treaties with Brazil"
 setting_gg_war_outcome_defensa_brazil_treaties_desc:0 "The Defensa wins and signs the five treaties with the Empire: limits, alliance, commerce, extradition and subsidy."
 setting_gg_war_outcome_defensa_europe:0 "The Defensa Wins: European Protectorate"
 setting_gg_war_outcome_defensa_europe_desc:0 "The Defensa wins and asks London and Paris for a protectorate."
 setting_gg_war_outcome_defensa_war_rosas:0 "The Defensa Wins: War on Rosas"
 setting_gg_war_outcome_defensa_war_rosas_desc:0 "The Defensa wins, pacifies the Republic and crosses the river against Rosas."
 setting_gg_war_outcome_defensa_brazil_vassal:0 "The Defensa Wins: Brazilian Vassal"
 setting_gg_war_outcome_defensa_brazil_vassal_desc:0 "The Defensa wins and the Republic passes under the Empire of Brazil."
 setting_gg_war_outcome_defensa_cisplatina:0 "The Defensa Wins: Cisplatine Province"
 setting_gg_war_outcome_defensa_cisplatina_desc:0 "The Defensa wins and the Republic becomes the Cisplatina again, a puppet province of Brazil."
 setting_gg_war_outcome_cerrito_amnesty:0 "The Cerrito Wins: Amnesty"
 setting_gg_war_outcome_cerrito_amnesty_desc:0 "The Cerrito wins and grants the clause of Oribe's terms: neither victors nor vanquished."
 setting_gg_war_outcome_cerrito_presidency:0 "The Cerrito Wins: Presidency Restored"
 setting_gg_war_outcome_cerrito_presidency_desc:0 "The Cerrito wins and Oribe returns to the presidency: every decree of the Defensa is void."
 setting_gg_war_outcome_cerrito_punish:0 "The Cerrito Wins: Punishment"
 setting_gg_war_outcome_cerrito_punish_desc:0 "The Cerrito wins and punishes the savage Unitarians."
 setting_gg_war_outcome_cerrito_pact_province:0 "The Cerrito Wins: Province of the Pact"
 setting_gg_war_outcome_cerrito_pact_province_desc:0 "The Cerrito wins and the Banda Oriental returns to the Confederation as a province of the Pact, with its own government."
 setting_gg_war_outcome_cerrito_rosas_client:0 "The Cerrito Wins: Republic under Rosas"
 setting_gg_war_outcome_cerrito_rosas_client_desc:0 "The Cerrito wins and the Republic stays independent and recognised, under Rosas's protection."
 setting_gg_war_outcome_cerrito_reincorporation:0 "The Cerrito Wins: Reincorporation into Argentina"
 setting_gg_war_outcome_cerrito_reincorporation_desc:0 "The Cerrito wins and the Republic joins the Confederation as one more province. Brazil will take it as a breach of the 1828 Convention."
 rule_gg_pact_outcome:0 "#blue_value GG#! End of the Federal Pact"
 setting_gg_pact_outcome_dynamic:0 "Dynamic"
 setting_gg_pact_outcome_dynamic_desc:0 "In May 1851 Urquiza weighs his grievances: he pronounces, protests or stays. If it comes to war, the battlefield decides."
 setting_gg_pact_outcome_historical:0 "Historical"
 setting_gg_pact_outcome_historical_desc:0 "Urquiza pronounces and wins: Caseros, by 3 February 1852 at the latest. Rosas goes into exile and the Confederation adopts the Constitution of 1853."
 setting_gg_pact_outcome_negotiated:0 "Negotiated Confederation"
 setting_gg_pact_outcome_negotiated_desc:0 "Rosas lets Entre Ríos resume its powers and calls the congress. There is no war: the provinces give themselves a constitution."
 setting_gg_pact_outcome_rosas:0 "Rosas Prevails: No Constitution"
 setting_gg_pact_outcome_rosas_desc:0 "Urquiza pronounces and is beaten. Rosas goes on ruling without a constitution for as long as he lives; what follows is settled at his death."
 setting_gg_pact_outcome_stalemate:0 "Two Governments"
 setting_gg_pact_outcome_stalemate_desc:0 "Urquiza pronounces and the war ends with no victor, by February 1852 at the latest: Buenos Aires and the Littoral each go their own way."
