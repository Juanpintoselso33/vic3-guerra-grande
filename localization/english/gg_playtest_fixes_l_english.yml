l_english:
 gg_legion_paid_by_france_tt:0 "@information! The reinforcement is paid by #b France#!, which backs the Defensa: the city puts up no money."
 gg_lent_squadron_french_supply:0 "Squadron Supplied by France"
 gg_lent_squadron_french_supply_desc:0 "The ships the powers lend the Defensa are victualled by France: the city pays nothing for their stores."
 gg_plata.31.t:0 "The Rivers Closed"
 gg_plata.31.d:0 "With the Mackau convention France has lifted her blockade and taken her ships home. The river is ours again, and Montevideo remains the port of Rivera and the Unitarian exiles.\n\nWe can close the Paraná and the Uruguay, issue letters of marque against every vessel sailing from an Oriental port and declare Montevideo blockaded. The squadron is at hand, under Brigadier William Brown."
 gg_plata.31.f:0 "January 1841: the Paraná and the Uruguay, closed."
 gg_plata.31.a:0 "Close the rivers and blockade Montevideo."
 gg_plata.31.b:0 "Leave the river open for now."
 gg_plata.31.b_tt:0 "@information! The river stays open. The question returns when Oribe’s government asks for it."
 # EN/ES: playtest 22/9 -- the powers before the partition / las potencias antes de la particion
 gg_war_ui_sec_powers_pre_tt:0 "Until the Republic is partitioned, no power pays or counts for the river: each one stands towards the government in Montevideo and the Colorado cause as #b Spectator#!, #b Protector#! or #b Guarantor#!, and that is the stance it will take into the war if the Republic is partitioned.\n· #b Spectator#!: will not pay the Defensa or back its war.\n· #b Protector#!: will pay and back the war; when the river is closed, its patience will run only alongside that of the other power.\n· #b Guarantor#!: will pay and back the war; its patience will run even alone.\nBetween landmarks, each decision in the events raises or lowers the commitment."
 gg_tt_patron_francia_pre_2:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now staking herself on the Colorados (#b Guarantor#!). She does not pay yet: if the Republic is partitioned, she will pay the Defensa every month, back its war, and when the river is closed her patience will run even without London."
 gg_tt_patron_francia_pre_1:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France now leans towards the Colorados (#b Protector#!). She does not pay yet: if the Republic is partitioned, she will pay the Defensa every month and back its war; when the river is closed, her patience will run only if London stands with her."
 gg_tt_patron_francia_pre_0:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France now keeps out of the Banda Oriental's quarrel (#b Spectator#!): if the Republic is partitioned, she will neither pay the Defensa nor back its war."
 gg_tt_patron_britania_pre_2:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now staking herself on the Colorados (#b Guarantor#!). If the Republic is partitioned, she will back the Defensa's war, though she will not pay it, and when the river is closed her patience will run alongside that of Paris."
 gg_tt_patron_britania_pre_1:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain now leans towards the Colorados (#b Protector#!). If the Republic is partitioned, she will back the Defensa's war, though she will not pay it, and when the river is closed her patience will run alongside that of Paris. London never acts without Paris."
 gg_tt_patron_britania_pre_0:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain now keeps out of the Banda Oriental's quarrel (#b Spectator#!): if the Republic is partitioned, she will not back the Defensa's war."
 gg_tt_patron_brasil_pre_2:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now staking itself on the Colorados (#b Guarantor#!). It does not pay yet: if the Republic is partitioned, it will pay the Defensa every month and back its war."
 gg_tt_patron_brasil_pre_1:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire now leans towards the Colorados (#b Protector#!). It does not pay yet: if the Republic is partitioned, it will pay the Defensa every month and back its war."
 gg_tt_patron_brasil_pre_0:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire now watches the Banda Oriental's quarrel from outside (#b Spectator#!): if the Republic is partitioned, it will neither pay the Defensa nor back its war. Before 1850 it does not count."
