l_english:

 gg_prewar.1.t:0 "El Moderador"
 gg_prewar.1.d:0 "The Buenos Aires unitarians Rosas drove out publish El Moderador in Montevideo, and every issue is an attack on the Restorer. The Confederation's envoy, Correa Morales, demands guarantees that the émigrés stop plotting from our shore. Rivera, who protects them, protests before the government decides."
 gg_prewar.1.f:0 "A printing press in Montevideo is a Buenos Aires affair."
 gg_prewar.1.a:0 "Close the paper and watch the émigrés."
 gg_prewar.1.b:0 "The Republic gives asylum. Let them write."
 gg_prewar.2.t:0 "The Farrapos War"
 gg_prewar.2.d:0 "Since September last year Rio Grande has been in arms against the Empire, and the border is a single ridge with estancias on both sides. Bento Gonçalves needs horses, fords and friends; Rio de Janeiro needs someone to shut that door. Rivera has a friendship with the riograndenses that does not go through the government."
 gg_prewar.2.f:0 "Cattle cross the border before the law does."
 gg_prewar.2.a:0 "Neutrality, with eyes open."
 gg_prewar.2.b:0 "Help the Empire close the border."
 gg_prewar.2.c:0 "Let the farrapos through. It is not our war."
 gg_prewar.3.t:0 "The Accounts of the First Presidency"
 gg_prewar.3.d:0 "In January the government abolished the Comandancia General de la Campaña and Rivera accepted it: he went back to his estancia in Durazno. Now the commission of Juan Pedro Ramírez, Antonio Costa and Ramón Artagaveytia has its findings on the previous administration. Publishing them puts the state in order. Doing it while the Comandancia goes back to Ignacio Oribe tells Rivera he is not coming back."
 gg_prewar.3.f:0 "A set of accounts is also a declaration."
 gg_prewar.3.a:0 "Publish them, and the Comandancia to Ignacio Oribe."
 gg_prewar.3.b:0 "Publish them. The Comandancia stays abolished."
 gg_prewar.3.c:0 "File them away, and give the general a post."
 gg_prewar.4.t:0 "Tacuarembó, Salto and Minas"
 gg_prewar.4.d:0 "The law of 16 June creates three new departments. In the north that means political chiefs, judges and tax collectors where until now the caudillos who rode with Rivera ruled. Who heads them decides whether the state reaches the border or the border stays theirs."
 gg_prewar.4.f:0 "A department is a signature in Montevideo and a man on horseback on the ridge."
 gg_prewar.4.a:0 "Political chiefs appointed by the government."
 gg_prewar.4.b:0 "Let the local caudillos head them."
 gg_prewar.5.t:0 "Yucutujá"
 gg_prewar.5.d:0 "Rivera has crossed the border again, this time with riograndenses at his side, and seeks the government's army in the north. How many follow him depends on what happened on the border and in the new departments. The government can accept battle where he offers it or fall back towards the centre."
 gg_prewar.5.f:0 "22 October 1837."
 gg_prewar.5.a:0 "Give battle in the north."
 gg_prewar.5.b:0 "Fall back to the centre and wait for him."
 gg_prewar.6.t:0 "The Action of the Yí"
 gg_prewar.6.d:0 "Shortly after Yucutujá, the government's forces caught up with Rivera on the Yí and beat him. We can go after him with everything or secure what we hold before he returns."
 gg_prewar.6.f:0 "A revenge, not an ending."
 gg_prewar.6.a:0 "Chase him to the border."
 gg_prewar.6.b:0 "Secure the countryside."
 gg_prewar.7.t:0 "Leblanc's Sails"
 gg_prewar.7.d:0 "Since March Rear Admiral Leblanc's French squadron has blockaded Buenos Aires, and its ships need ports on this side of the river. Rosas asks us to close them. France offers to talk. Closing them leaves us with the Confederation against the strongest navy on the Plata; talking leaves us on bad terms with Rosas and without half of what stands behind Oribe."
 gg_prewar.7.f:0 "On the Plata, whoever holds the water holds the war."
 gg_prewar.7.a:0 "The ports are closed to the squadron."
 gg_prewar.7.b:0 "Talk to France."
 gg_prewar.8.t:0 "The Universidad Mayor"
 gg_prewar.8.d:0 "In 1833 the law promoted by Father Dámaso Antonio Larrañaga created the Casa de Estudios Generales, which by 1836 taught Latin, philosophy, mathematics, theology and jurisprudence. The step that makes it a university is still missing. Taking it now costs money in the middle of the war with Rivera."
 gg_prewar.8.f:0 "A republic that thinks about itself also defends itself."
 gg_prewar.8.a:0 "Decree the Universidad Mayor de la República."
 gg_prewar.8.b:0 "After the war."
 gg_prewar.9.t:0 "Palmar"
 gg_prewar.9.d:0 "Rivera and the riograndenses advance on the army commanded by Ignacio Oribe. If the government arrives ahead, it can still deny them battle and save the army. If not, it has to fight where they choose."
 gg_prewar.9.f:0 "15 June 1838."
 gg_prewar.9.a:0 "Give battle."
 gg_prewar.9.b:0 "Deny them battle and fall back."
