l_english:

 gg_prewar.1.t:0 "El Moderador"
 gg_prewar.1.d:0 "The unitarians Rosas drove out of Buenos Aires found a city with printing presses on this side of the river, and they are using it. El Moderador comes out in Montevideo, and every issue is against the Restorer.\n\nThe Confederation's envoy, Correa Morales, has not come to ask. He was firm and nearly rude: he demands guarantees that the exiles will stop plotting against the Buenos Aires government from our shore. On the other side stands General Rivera, still Commander General of the Countryside, who counts those same exiles as friends and has already said he will protest.\n\nClosing a newspaper proves Buenos Aires right. Not closing it gives Buenos Aires a reason."
 gg_prewar.1.f:0 "A printing press in Montevideo is a Buenos Aires affair."
 gg_prewar.1.a:0 "Close El Moderador and watch the exiles."
 gg_prewar.1.b:0 "The Republic gives asylum. Let them write."
 gg_prewar.2.t:0 "The Farrapos War"
 gg_prewar.2.d:0 "Since 20 September, Rio Grande has been in arms against the Empire. The ranchers and jerky-makers of Bento Gonçalves, Antônio de Sousa Neto and Onofre Pires are fighting, among other things, because their jerked beef costs more than that of our saladeros and Buenos Aires's. And they say our own war of independence inspired them.\n\nThe President already marched north once to watch over neutrality, and took care to record that he did so «in agreement with the Commander General of the Countryside». Rivera felt pushed aside anyway. Bento Gonçalves was his comrade in the Portuguese army, and the General's dealings with the riograndense chiefs do not go through this government. Rio de Janeiro sees them, and it will hold us to account.\n\nThe border is a line nobody has measured. Someone has to decide who crosses it."
 gg_prewar.2.f:0 "Cattle cross the border before the law does."
 gg_prewar.2.a:0 "Neutrality, with our eyes on the border."
 gg_prewar.2.b:0 "Help the Empire close the border."
 gg_prewar.2.c:0 "Let the farrapos through. It is not our war."
 gg_prewar.3.t:0 "The Accounts of the First Presidency"
 gg_prewar.3.d:0 "On 9 January this government abolished the General Command of the Countryside, and General Rivera accepted it: he went off to his ranch in Durazno. Juan María Pérez wrote to Giró that everyone expected him to jump and start a rising, «but he fooled them all, for he has behaved more obediently than a veteran of the Viceroy of India».\n\nNow the commission of Juan Pedro Ramírez, Antonio Costa and Ramón Artagaveytia has finished examining the previous administration, and its conclusions leave no room: there was waste and there was fraud. Publishing them cannot be avoided. What is being decided is what else happens at the same time. The Command can be restored, and the candidate is Ignacio Oribe, the President's brother.\n\nRivera accepted losing the post. Nobody knows whether he will accept seeing it given to someone else."
 gg_prewar.3.f:0 "«General Oribe's rigidities, which did not fit the primitive frame of those times, would give rise to the revolution of 1836.»"
 gg_prewar.3.a:0 "Publish them, and the Comandancia to Ignacio Oribe."
 gg_prewar.3.b:0 "Publish them. The Command stays abolished."
 gg_prewar.3.c:0 "File them away, and give the general a post."
 gg_prewar.4.t:0 "Tacuarembó, Salto and Minas"
 gg_prewar.4.d:0 "The law of 16 June cuts the countryside into more pieces: Tacuarembó is split from Paysandú, and Salto and Minas become departments. The Constitution's nine are now twelve.\n\nA new department means a political chief, a judge and someone to collect revenue, in places where until today the only authority was the local commander, and that commander is nearly always one of Rivera's men. Rivera has been in Brazil since Carpintería, and across the border the farrapos keep horses for him.\n\nWho heads the departments decides whether the State reaches the north or the north stays theirs."
 gg_prewar.4.f:0 "A department is a signature in Montevideo and a man on horseback on the ridge."
 gg_prewar.4.a:0 "Political chiefs appointed by the government."
 gg_prewar.4.b:0 "Let the local caudillos head them."
 gg_prewar.5.t:0 "Yucutujá"
 gg_prewar.5.d:0 "Rivera is back. He crossed at the Cuaró with seven hundred and eighty-five men and four guns, and before that he sent Colonel Luna with two hundred to mislead us about where the invasion would come and to start raising the partisans. With him come Lavalle, Enrique Martínez, José María Luna and Anacleto Medina, and behind them the riograndenses of Piratini.\n\nThe President has gone north with the bulk of the army to find him. There are some eight hundred on each side. Rivera is not looking for a head-on clash: he wants us to march past him, so he can fall on our flanks.\n\nWe can seek him where he is, or fall back to the centre and make him come."
 gg_prewar.5.f:0 "The Yucutujá paddock, 22 October 1837."
 gg_prewar.5.a:0 "Seek him in the north and offer battle."
 gg_prewar.5.b:0 "Fall back to the centre and wait for him."
 gg_prewar.6.t:0 "The Action of the Yí"
 gg_prewar.6.d:0 "On the Yí the government's forces caught up with Rivera and beat him. After Yucutujá, the countryside can breathe again.\n\nBut Rivera does not fall apart. What he loses on one field he makes good across the border, where the riograndenses give him horses and cover his retreat, and the unitarians lend him officers who know how to fight: Pirán, Chilavert, Hornos, Juan Apóstol Martínez. Today he runs; tomorrow he returns with another army.\n\nWe can chase him to the border, and risk reaching it exhausted, or hold what we have before he comes back."
 gg_prewar.6.f:0 "A revenge, not an ending."
 gg_prewar.6.a:0 "Chase him to the border."
 gg_prewar.6.b:0 "Hold the countryside and wait."
 gg_prewar.7.t:0 "Leblanc's Sails"
 gg_prewar.7.d:0 "On 21 February Rear Admiral Leblanc arrived in Montevideo, and since March his squadron has been blockading Buenos Aires, with ships at the anchorages of the Salado, the Tuyú, the Ensenada and Martín García. Some of the schooners he uses were bought here.\n\nNow the French commander asks for what he lacks: the use of the port of Montevideo as a base. Rosas is our ally in this war, and Rivera is in arms in the countryside. France does not say what it will do if we refuse, and it need not: a squadron that finds no port with one government looks for another government that will give it one.\n\nSaying no puts us on the Confederation's side against the French squadron. Saying yes breaks with Buenos Aires."
 gg_prewar.7.f:0 "On the Plata, whoever holds the water holds the war."
 gg_prewar.7.a:0 "No. The port of Montevideo is nobody's base."
 gg_prewar.7.b:0 "Deal with France."
 gg_prewar.8.t:0 "The Universidad Mayor"
 gg_prewar.8.d:0 "The law of 11 June 1833, the one Father Dámaso Antonio Larrañaga proposed in the Senate, created nine chairs and left the President of the Republic one task: to decree the university once most of them were running. The House of General Studies already teaches Latin, philosophy, mathematics, theology and jurisprudence.\n\nThe condition was met at the worst moment. Rivera has the countryside in arms, the French squadron is on the river and the Treasury cannot pay for the army. A decree costs nothing. A university that works does.\n\nWhat is signed today may stay on paper. But it will stay signed, and whoever holds the capital when peace returns will find it."
 gg_prewar.8.f:0 "A republic that thinks about itself also defends itself."
 gg_prewar.8.a:0 "Decree the Universidad Mayor de la República."
 gg_prewar.8.b:0 "After the war."
 gg_prewar.9.t:0 "Palmar"
 gg_prewar.9.d:0 "Rivera is coming down with his army and the riograndenses, and with him comes Lavalle and the unitarian officers: Pirán with the artillery, Chilavert, Hornos, Enrique Martínez. Facing them are Ignacio Oribe and General Lavalleja, with the last army this government has left in the countryside.\n\nThe place is the Palmar stream, in Paysandú. Our cavalry is good and knows it: if it charges first, it can sweep theirs away. But if Lavalle takes command on the other side and keeps them within range of Pirán's guns, one afternoon is enough to lose everything.\n\nThere is no other army behind this one."
 gg_prewar.9.f:0 "The Palmar stream, 15 June 1838."
 gg_prewar.9.a:0 "Let Ignacio Oribe give battle."
 gg_prewar.9.b:0 "Deny him the battle and fall back with the army whole."
 gg_prewar_state_chiefs:0 "Government Political Chiefs"
 gg_prewar_local_caudillos:0 "Caudillos Heading the Departments"
 gg_prewar_north_lost:0 "The North Answers to Rivera"
 gg_artigas_letter:0 "A Letter to Curuguaty"
 gg_prewar.5.d_closed:0 "Rivera is back. He crossed at the Cuaró with seven hundred and eighty-five men and four guns, and before that he sent Colonel Luna with two hundred to mislead us about where the invasion would come. With him come Lavalle, Enrique Martínez, José María Luna and Anacleto Medina.\n\nWhat he does not bring is all he expected from across the border. This government helped the Empire close it, and the riograndenses gave him fewer horses and fewer men than they had promised. There are some eight hundred on each side, and the President has gone north with the bulk of the army to find him.\n\nWe can seek him where he is, or fall back to the centre and make him come."
 gg_prewar.5.d_local:0 "Rivera is back. He crossed at the Cuaró with seven hundred and eighty-five men and four guns, and before that he sent Colonel Luna with two hundred to raise the partisans of the north.\n\nThe partisans did not rise as he hoped. The caudillos this government put at the head of Tacuarembó and Salto now have something to lose, and many stayed at home. With Rivera come Lavalle, Enrique Martínez, José María Luna, Anacleto Medina and the riograndenses of Piratini: some eight hundred, as many as ours.\n\nWe can seek him where he is, or fall back to the centre and make him come."
 gg_prewar.5.a_tt:0 "@information! War score: #P +1#! to #P +3#! for the #R colorados#!, depending on how many men followed Rivera (the border and the new departments count)."
 gg_prewar.9.d_ahead:0 "Rivera is coming down with his army and the riograndenses, and with him comes Lavalle and the unitarian officers: Pirán with the artillery, Chilavert, Hornos, Enrique Martínez. Facing them are Ignacio Oribe and General Lavalleja, with the last army this government has left in the countryside.\n\nBut this time the countryside is ours. After Yucutujá and the Yí, the partisans of the north answer to the government, and Rivera needs the battle more than we do: without a victory, the riograndenses will tire of paying for his war. Ignacio Oribe can deny it to him and keep the army whole.\n\nThe Palmar stream, in Paysandú, is the place Rivera chose. It need not be ours."
 gg_prewar.1.b_tt:0 "@information! Lavalle stays neutral for longer: if the Republic goes to war with Rosas, he arrives half a year later."
 gg_prewar.2.b_tt:0 "@information! When Rivera invades again, the riograndenses will give him fewer men."
 gg_prewar.4.a_tt:0 "@information! The northern caudillos lose their place: when Rivera invades again, more men will follow him."
 gg_prewar.4.b_tt:0 "@information! The northern caudillos have something to lose: when Rivera invades again, fewer men will follow him."
 gg_prewar.7.b_tt:0 "@information! France leaves the government's flotilla alone: when Oribe falls, the #blue_value blancos#! keep more strength (#P +1#! #blue_value blanco#! score)."
 gg_prewar.8.a_tt:0 "@information! The University is decreed: in 1849, whichever government holds Montevideo can open it."
 gg_prewar.9.b_tt:0 "@information! The defeat is smaller. If Oribe refuses to resign when his government falls, the army kept whole adds 2 to the #blue_value blanco#! score."
 guerra_grande.2.b_tt:0 "@information! Oribe refuses to resign and holds out a few months more. He falls anyway, but what was kept (Palmar avoided) counts for the #blue_value blancos#!."
