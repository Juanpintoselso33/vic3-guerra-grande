l_english:
# -------------------------------------------------------------------------------------------------
# EN/ES: the three countries of the Argentine side. The Coalition has no adjective of its own in
#     the sources -- it was a league, not a people -- so it takes a phrase.
#     / los tres paises del lado argentino. La Coalicion no tiene gentilicio propio en las fuentes
#     -- era una liga, no un pueblo -- asi que lleva una frase.
# -------------------------------------------------------------------------------------------------
 ENR:0 "Entre Ríos"
 ENR_ADJ:0 "Entrerrian"
 CRR:0 "Corrientes"
 CRR_ADJ:0 "Correntine"
 CLN:0 "Coalition of the North"
 CLN_ADJ:0 "Coalition"
 gg_ai_strategy_corrientes:0 "Open the river"
 gg_ai_strategy_corrientes_desc:0 "[COUNTRY.GetName] seceded over the blockade on its commerce, not over a doctrine. It wants open ports, free navigation of the Paraná and the Uruguay, and a share of the customs revenue -- and it knows it cannot get them alone."
 gg_ai_strategy_coalicion:0 "Hold out until there is a constitution"
 gg_ai_strategy_coalicion_desc:0 "[COUNTRY.GetName] covets not one foot of another's soil: it wants the Republic to adopt a constitution. It does not start wars; it answers them. Every month it holds out is another month the federal army remains in the interior."
 gg_ai_strategy_entre_rios:0 "March on Buenos Aires"
 gg_ai_strategy_entre_rios_desc:0 "[COUNTRY.GetName] has the best army in the Confederation, the Empire of Brazil for an ally and Montevideo waiting for it. It is not defending anything."
 gg_argentina_play_CRR:0 "Corrientes Returns to the Federal Pact"
 gg_argentina_play_CLN:0 "The dissolution of the League of the North"
 gg_argentina_play_ENR:0 "Entre Ríos Returns to the Federal Pact"
 dp_gg_pacto_federal:0 "Restore the Federal Pact"
 dp_gg_liga_disuelta:0 "Dissolve the League"
