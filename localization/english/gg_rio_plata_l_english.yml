 gg_ui_plata_powers_4:0 "London and Paris have settled with Rosas: the squadrons are gone."
 gg_ui_plata_weight_blancos:0 "In the war, the river weighs #blue_value +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! for the blancos."
