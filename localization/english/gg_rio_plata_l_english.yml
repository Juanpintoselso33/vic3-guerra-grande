 gg_plata_intervention_start_tt:0 "@warning! #N The Anglo-French intervention begins#!: Britain and France break with Rosas (relations #N -30#!), and their squadrons enter the river."
 gg_plata_squadrons_called_tt:0 "@information! The patience of London and Paris with a shut river drops from #V 18#! to #V 12#! months."
 gg_plata.2.b_tt:0 "@information! The Cerrito may ask again."
 gg_plata.2.t:0 "Oribe asks for the blockade of Montevideo"
 gg_plata.2.d:0 "General #b Oribe#! writes from the Cerrito: the city lives off its port, and while ships come in by the river the siege will not bring it down. He asks that Commodore #b Brown#!'s squadron shut the waters of Montevideo to every flag.\n\nThe British station has already said how it will take it. Its government holds as a principle that it does not grant «the new ports of South America» the exercise of «so high and weighty a right as that of blockade», and Commodore #b Purvis#! has the #b Alfred#!, fifty guns, anchored in the roads.\n\nWhatever is decided, the Buenos Aires battery will uphold it. Without it none of our bans holds on the water; with it, the river is shut from our bank even if the other stays open."
 gg_plata.2.f:0 "Who holds the bank holds the river."
 gg_plata.2.a:0 "Declare the blockade."
 gg_plata.2.b:0 "The squadron will not be staked on Montevideo."
 gg_plata.10.t:0 "The passports of Ouseley and Deffaudis"
 gg_plata.10.d:0 "The British minister #b William Gore Ouseley#! and Baron #b Deffaudis#!, who came with Guizot's instructions, demand the same thing note after note: that the blockade of Montevideo be lifted and that the Argentine divisions leave the Oriental State. They declare they will not accept General Oribe as legal president «not even if elected».\n\nNow the ultimatum arrives, with a deadline. If it is not granted, their admirals seize Commodore Brown's squadron off Montevideo and the ports of the Confederation are blockaded. Both ministers have already asked for their passports in that case.\n\nMr. #b Arana#! has them ready. Returning them is war with the two first powers of Europe without either declaring it; keeping them is lifting the blockade that keeps General Oribe before the city."
 gg_plata.10.f:0 "«As much for the interest of our commerce as for that of humanity, we find ourselves forced to put an end to a state of things that has become intolerable.» — Guizot, instructions to Baron Deffaudis"
 gg_plata.10.a:0 "Return their passports."
 gg_plata.10.b:0 "Lift the blockade."
 gg_strait_control_magellan:0 "Bank of the Strait of Magellan"
 gg_strait_control_magellan_desc:0 "Whoever holds this coast holds the passage, even without a fort to shut it."
 gg_plata_rosas_yielded:0 "Struck his colours before the powers"
 gg_plata_rosas_yielded_desc:0 "Rosas lifted the blockade before the ultimatum of London and Paris."
 gg_ai_strategy_plata_open:0 "The open river"
 gg_ai_strategy_plata_open_desc:0 "[COUNTRY.GetName] lets every flag pass its bank of the Plata."
 gg_ai_strategy_plata_closed:0 "The blockade of Montevideo"
 gg_ai_strategy_plata_closed_desc:0 "[COUNTRY.GetName] shuts its bank of the Plata to every flag but its own."
 gg_ai_strategy_plata_enemies:0 "The half blockade"
 gg_ai_strategy_plata_enemies_desc:0 "[COUNTRY.GetName] only stops its enemies' ships; neutrals reach the port."
 gg_ai_strategy_plata_defensa:0 "The open port"
 gg_ai_strategy_plata_defensa_desc:0 "[COUNTRY.GetName] lives off its port and keeps it open to all."
