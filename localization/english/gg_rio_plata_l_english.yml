 gg_ui_plata_mvd_other:0 "#N In other hands#!"
 gg_ui_plata_mvd_fort_yes:0 "Battery standing"
 gg_ui_plata_mvd_fort_no:0 "#N No battery#!"
 gg_ui_plata_passage_closed:0 "The passage: #N shut to foreign flags#!, #V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! months running."
 gg_ui_plata_passage_open:0 "The passage: #P open#!. Ships reach the port of Montevideo."
 gg_ui_plata_powers_0:0 "London and Paris have no complaint about the river."
