l_english:
 gg_ui_plata_weight_blancos:0 "The river tips the war #blue_value +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! in the blancos' favour."
 gg_ui_plata_weight_colorados:0 "The river tips the war #R +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! in the colorados' favour."
 gg_plata_rosas_close_tt:0 "@ships! Rosas #N closes the Plata#! to every foreign flag. So long as his shore has a battery, the closure holds even if Montevideo stays open.\n@warning! #b Playing as Rosas, the blockade is not enforced until you close your shore#! in the River Plate strait panel (click the strait on the map, between Buenos Aires and Montevideo). Without a battery on the Buenos Aires shore, it does not close either."
 gg_plata_rosas_open_tt:0 "@ships! Rosas #P opens the Plata#!.\n#grey (Playing as Rosas: keep your shore open in the strait panel. Close it again and the powers' patience starts running down once more; if the river is under their guarantee, their squadrons sail in at once.)#!"
 gg_plata_rosas_neutrals_tt:0 "@ships! Rosas's blockade stops only the Defensa's ships: #P neutral vessels make port#!."
 gg_plata_fort_remove_tt:0 "@warning! Buenos Aires loses its battery: #N Rosas cannot close the river#! until he recovers it."
 gg_plata_fort_restore_tt:0 "@ships! Buenos Aires recovers its battery: #b Rosas can close the river once more#!."
 gg_plata_intervention_start_tt:0 "@warning! #N The Anglo-French intervention begins#!: Britain and France break with Rosas (relations #N -30#!), and their squadrons enter the river."
 gg_plata_squadrons_called_tt:0 "@information! The patience of the powers that back the Defensa with a closed river falls from #V 18#! to #V 12#! months."
 gg_plata.2.b_tt:0 "@information! The Cerrito may ask again in a year's time."
 gg_plata.2.t:0 "Oribe Asks for the Blockade of Montevideo"
 gg_plata.2.d:0 "General #b Oribe#! writes from the Cerrito: the city lives off its port, and so long as ships come in by the river the siege will never bring it down. He asks that Commodore #b Brown#!'s squadron close the waters of Montevideo to every flag.\n\nThe British station has already made plain how it will receive this. Its government holds it as a principle not to allow ‘the new ports of South America’ the exercise of ‘so high and weighty a right as that of blockade’, and Commodore #b Purvis#! has the fifty-gun #b Alfred#! lying in the roads.\n\nWhatever is decided, the Buenos Aires battery will enforce it. Without it, none of our prohibitions counts for anything on the water; with it, the river is closed from our shore even if the other stays open."
 gg_plata.2.f:0 "Whoever holds the shore holds the river."
 gg_plata.2.a:0 "Declare the blockade."
 gg_plata.2.b:0 "I will not stake the squadron on Montevideo."
 gg_plata.10.t:0 "The Ministers' Passports"
 gg_plata.10.d:0 "The British minister, #b William Gore Ouseley#!, and Baron #b Deffaudis#!, who came out with Guizot's instructions, demand the same thing note after note: that the blockade of Montevideo be lifted and the Argentine divisions leave the Oriental State. They declare they will not accept General Oribe as lawful president ‘not even if elected’.\n\nNow the ultimatum has come, with a deadline. If it is refused, their admirals will seize Commodore Brown's squadron off Montevideo and blockade the ports of the Confederation. Both ministers have already asked for their passports should it come to that.\n\nSeñor #b Arana#! has them ready. To hand them over is war with the two foremost powers of Europe, though neither will declare it. To hold them back is to lift the blockade without granting the rest: the river opens, and London and Paris stand guarantors that it stays open."
 gg_plata.10.f:0 "‘As much in the interest of our commerce as in that of humanity, we find ourselves obliged to put an end to a state of affairs that has become intolerable.’ — Guizot, instructions to Baron Deffaudis"
 gg_plata.10.a:0 "Hand back the passports."
 gg_plata.10.b:0 "Lift the blockade."
 gg_strait_control_magellan:0 "Shore of the Strait of Magellan"
 gg_strait_control_magellan_desc:0 "Whoever holds this coast commands the passage, even without a fort to close it."
 gg_plata_rosas_yielded:0 "Struck His Colours to the Powers"
 gg_plata_rosas_yielded_desc:0 "Rosas lifted the blockade in the face of London's and Paris's ultimatum."
 gg_ai_strategy_plata_open:0 "Free Navigation"
 gg_ai_strategy_plata_open_desc:0 "[COUNTRY.GetName] lets every flag pass its shore of the Plata."
 gg_ai_strategy_plata_closed:0 "Blockade of Montevideo"
 gg_ai_strategy_plata_closed_desc:0 "[COUNTRY.GetName] closes its shore of the Plata to every flag but its own."
 gg_ai_strategy_plata_enemies:0 "Partial Blockade"
 gg_ai_strategy_plata_enemies_desc:0 "[COUNTRY.GetName] stops only its enemies' ships; neutrals make port."
 gg_ai_strategy_plata_defensa:0 "Open Port"
 gg_ai_strategy_plata_defensa_desc:0 "[COUNTRY.GetName] lives off its port and keeps it open to all comers."
 gg_plata.20.t:0 "The River Closed"
 gg_plata.20.d:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nFor as long as the closure lasts, the city suffers (mortality #N +5%#!). Outside a truce, each month also deepens its hunger, wears down the patience of the powers that back the Defensa and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_plata.20.a:0 "Let it be known along the lines."
 gg_plata.21.t:0 "The River Reopened"
 gg_plata.21.d_battery:0 "Buenos Aires has lost its battery, and without it Rosas cannot close the river: ships are reaching Montevideo again. There can be no closure until the battery is raised once more.\n\nThe run of months without a ship is broken."
 gg_plata.21.d_shore:0 "The Buenos Aires shore is no longer in Rosas's hands, and no one else can close the river: ships are reaching Montevideo again.\n\nThe run of months without a ship is broken."
 gg_plata.21.d_neutrals:0 "Rosas is letting neutral ships through. The blockade now stops only the Defensa's own vessels, and through that open door the city is being supplied again.\n\nThe run of months without a ship is broken."
 gg_plata.21.d_rosas:0 "Rosas has reopened the river, and ships are reaching Montevideo again.\n\nThe run of months without a ship is broken."
 gg_plata.22.t:0 "The Ministers Ask for Their Passports"
 gg_plata.22.d:0 "The ministers of London and Paris have demanded that Rosas lift the blockade of the river, and await his reply. On it hangs whether their squadrons will enter the Plata.\n\nArgentina loses prestige (#N -10%#!) while the matter stands."
 gg_plata.23.t:0 "The Squadrons on the River"
 gg_plata.23.d:0 "The British and French squadrons have entered the Plata and are blockading the port of Buenos Aires. That alone does not reopen the way to Montevideo: much depends on what becomes of Brown's squadron and of Rosas's battery."
 gg_plata.24.t:0 "Terms with Rosas"
 gg_plata.24.d:0 "London and Paris have come to terms with Rosas and withdrawn their squadrons, taking back the frigates they had lent the Defensa. If Rosas still holds the Buenos Aires shore and its battery, the river is his to command once more."
 gg_plata_guarantee_tt:0 "@information! London and Paris stand as #b guarantors of the open river#!: while the guarantee holds, the Cerrito cannot ask for the river to be closed, and if Rosas closes it again their squadrons sail in at once, with no fresh ultimatum.\n#grey (Playing as Rosas: open your shore in the strait panel within two months.)#!"
 gg_plata_yield_cerrito_tt:0 "@warning! The Cerrito #N loses the Rosista backing#! the blockade had won it."
 gg_plata.10.d_france:0 "London keeps out of this; Paris does not. The French minister demands, note after note, that the blockade of Montevideo be lifted, and now the ultimatum has come, with a deadline. If it is refused, the French squadron will enter the Plata. The minister has already asked for his passports should it come to that.\n\nSeñor #b Arana#! has them ready. To hand them over is war with France, though she will not declare it. To hold them back is to lift the blockade: the river opens, and Paris stands guarantor that it stays open."
 gg_plata.22.d_france:0 "London keeps out of the question, but the French minister has demanded that he lift the blockade of the river, and awaits his reply. On it hangs whether the French squadron will enter the Plata.\n\nArgentina loses prestige (#N -10%#!) while the matter stands."
 gg_plata.25.t:0 "Rosas Yields to the Ultimatum"
 gg_plata.25.d:0 "Rosas has given way to the ultimatum and pledged to lift the blockade: as soon as his shore is opened, ships will reach Montevideo again, and London and Paris stand as guarantors that the river stays open.\n\nWhile the guarantee holds, the Cerrito cannot ask Rosas to close it again. Should the river still be closed after two months, or should Rosas close it again, the squadrons will sail in at once, with no fresh ultimatum; those two months count neither towards the hunger nor towards the patience. The guarantee lasts until London recognises the right of blockade."
 gg_plata.25.d_france:0 "Rosas has given way to the French ultimatum and pledged to lift the blockade: as soon as his shore is opened, ships will reach Montevideo again, and Paris stands guarantor that the river stays open.\n\nWhile the guarantee holds, the Cerrito cannot ask Rosas to close it again. Should the river still be closed after two months, or should Rosas close it again, the French squadron will sail in at once; those two months count neither towards the hunger nor towards the patience. The guarantee lasts until Paris, too, recognises the right of blockade."
 gg_plata.26.t:0 "Rosas Breaks His Word"
 gg_plata.26.d:0 "With the river under the powers' guarantee, Rosas has closed it again. There is no fresh note and no new deadline: their squadrons enter the Plata and blockade the port of Buenos Aires."
 gg_plata.27.t:0 "London Recognises the Right of Blockade"
 gg_plata.27.d:0 "Without a shot fired, London recognises Argentine sovereignty over its rivers and its right of blockade, as in the Arana–Southern treaty. Its guarantee is at an end: the Cerrito may again ask Rosas to close the river, and from now on only Paris's patience counts."
 gg_plata.28.t:0 "Paris Comes to Terms with Rosas"
 gg_plata.28.d:0 "Paris, too, comes to terms with Rosas, as in the Arana–Lepredour convention, and recognises his right of blockade. No power now answers for the river: should Rosas close it again, the squadrons will not return."
 gg_plata_guarantee_france_tt:0 "@information! Paris stands as #b guarantor of the open river#!: while the guarantee holds, the Cerrito cannot ask for the river to be closed, and if Rosas closes it again the French squadron sails in at once, with no fresh ultimatum.\n#grey (Playing as Rosas: open your shore in the strait panel within two months.)#!"
 gg_plata_intervention_start_france_tt:0 "@warning! #N The French intervention begins#!: France breaks with Rosas (relations #N -30#!), and her squadron enters the river and blockades the port of Buenos Aires. London stays out."
 gg_plata.23.d_france:0 "The French squadron has entered the Plata and blockades the port of Buenos Aires. London stays out. The French blockade does not of itself open the way to Montevideo: so long as Rosas holds his shore and its battery, he can keep the river closed."
 gg_plata.26.d_france:0 "With the river under the guarantee of Paris, Rosas has closed it again. There is no fresh note and no new deadline: the French squadron enters the Plata and blockades the port of Buenos Aires."
 gg_plata.25.d_cost:0 "Rosas has given way to the ultimatum and pledged to lift the blockade: as soon as his shore is opened, ships will reach Montevideo again, and London and Paris stand as guarantors that the river stays open.\n\nWhile the guarantee holds, the Cerrito cannot ask Rosas to close it again, and it loses the Rosista backing the blockade had won it. Should the river still be closed after two months, or should Rosas close it again, the squadrons will sail in at once, with no fresh ultimatum; those two months count neither towards the hunger nor towards the patience. The guarantee lasts until London recognises the right of blockade."
 gg_plata.25.d_france_cost:0 "Rosas has given way to the French ultimatum and pledged to lift the blockade: as soon as his shore is opened, ships will reach Montevideo again, and Paris stands guarantor that the river stays open.\n\nWhile the guarantee holds, the Cerrito cannot ask Rosas to close it again, and it loses the Rosista backing the blockade had won it. Should the river still be closed after two months, or should Rosas close it again, the French squadron will sail in at once; those two months count neither towards the hunger nor towards the patience. The guarantee lasts until Paris, too, recognises the right of blockade."
 gg_plata.20.d_france:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nFor as long as the closure lasts, the city suffers (mortality #N +5%#!). Outside a truce, each month also deepens its hunger, wears down the patience of Paris (London keeps out of the question) and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_plata.20.d_none:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nLondon and Paris have both recognised his right of blockade: no squadron will come. For as long as the closure lasts, the city suffers (mortality #N +5%#!). Outside a truce, each month also deepens its hunger and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_ui_plata_phase_1_prewar_tt:0 "Rosas has closed the river from the Buenos Aires shore, and foreign ships no longer reach Montevideo. Until there are two Oriental governments at war, the closure squeezes the city but counts neither towards its hunger nor against the patience of London and Paris.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_1_truce_tt:0 "Rosas has closed the river from the Buenos Aires shore, and foreign ships no longer reach Montevideo. While the truce holds, nothing moves: neither the city's hunger nor the powers' patience.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_1_grace_tt:0 "Rosas has given way to the ultimatum, but his shore is still closed: he has two months to open it. Within that time the closure counts neither towards the city's hunger nor against the powers' patience; if it is still closed when the time runs out, the squadrons sail in with no fresh ultimatum.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_1_none_tt:0 "Rosas has closed the river from the Buenos Aires shore, and foreign ships no longer reach Montevideo. Every month it stays shut deepens the city's hunger, but no power backs the Defensa firmly enough today to call Rosas to account.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_1_france_tt:0 "Rosas has closed the river from the Buenos Aires shore, and foreign ships no longer reach Montevideo. Every month it stays shut deepens the city's hunger and wears down the patience of Paris; London keeps out of the question.\n#b Effects#!: Montevideo, mortality #N +5%#!."
 gg_ui_plata_phase_3_howden_tt:0 "Lord Howden has raised the British blockade and Walewski would not raise the French one: the French squadron still lies off Buenos Aires, and London remains in the question until it comes to terms with Rosas. So long as Rosas holds his shore and its battery, he can keep the way to Montevideo closed.\n#b Effects#!: Buenos Aires, trade capacity #N -10#!; each power with a squadron on the river, infamy generation #N +10%#!; the Defensa, #V 4#! frigates lent by the powers, their stores paid for by France; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_phase_3_southern_tt:0 "London has come to terms with Rosas, as in the Arana–Southern treaty, and recognised his right of blockade. Only the French squadron is left on the river; it has already raised its blockade of Buenos Aires and goes on standing by the city until Paris, too, comes to terms. So long as Rosas holds his shore and its battery, he can keep the way to Montevideo closed.\n#b Effects#!: France, infamy generation #N +10%#!; the Defensa, #V 4#! frigates lent by the powers, their stores paid for by France; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_phase_4_france_tt:0 "Paris has come to terms with Rosas, withdrawn her squadron and recognised his right of blockade; London was already out of the question. If Rosas still holds the Buenos Aires shore and its battery, the river is his to command once more, and a fresh closure brings no squadron at all."
 gg_ui_plata_ba_blockaded_fr_int_tt:0 "The French squadron lies off the port of Buenos Aires: it is Buenos Aires that is closed, not Montevideo. The battery still decides whether Rosas can shut the river."
 gg_ui_plata_ba_port_blockaded:0 "#N Port blockaded#!"
 gg_ui_plata_ba_port_blockaded_tt:0 "Warships lie off the port of Buenos Aires. That is a blockade of the port, apart from the passage of the river, which still turns on the shore and its battery."
 gg_ui_plata_decree_pending:0 "#b Rosas has decreed the blockade#!, but his shore still lets ships through."
 gg_ui_plata_decree_pending_tt:0 "The decree is signed and the battery stands, but the closure is not yet enforced on the water: ships are still reaching Montevideo, and the river neither deepens the city's hunger nor wears down the powers' patience.\n@warning! #b Playing as Rosas, the blockade is not enforced until you close your shore#! in the River Plate strait panel (click the strait on the map, between Buenos Aires and Montevideo). Without a battery on the Buenos Aires shore, it does not close either."
 gg_ui_plata_decree_neutrals:0 "#b Rosas stops only the Defensa's ships#!: neutral vessels make port."
 gg_ui_plata_decree_neutrals_tt:0 "The British station does not recognise the blockade and keeps the city supplied. While that lasts the city eats: the river neither deepens its hunger nor wears down the powers' patience."
 gg_ui_plata_sec_clocks_truce:0 "Stilled by the Truce"
 gg_ui_plata_sec_clocks_truce_tt:0 "While the truce holds, nothing on the river moves: neither the city's hunger, nor the powers' patience, nor the river's weight in the war."
 gg_plata.10.d_peace:0 "The ministers of London and Paris demand, with a deadline, that the blockade of the river be lifted. But the Oriental war is over, and whatever answer is given now lies between Buenos Aires and the powers.\n\nSeñor #b Arana#! has the passports ready. To hand them over is war with the two foremost powers of Europe, though neither will declare it. To hold them back is to lift the blockade: the river opens, and there is no war left for the powers to stand guarantor over."
 gg_plata.20.d_prewar:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nFor as long as the closure lasts, the city suffers (mortality #N +5%#!). There are not yet two Oriental governments at war: the closure brings the city no nearer to treating for peace and costs nothing of the patience of London and Paris."
 gg_plata.20.d_squadrons:0 "Rosas has closed the River Plate again from the Buenos Aires shore, with the powers already upon him: no foreign ship reaches Montevideo.\n\nFor as long as the closure lasts, the city suffers (mortality #N +5%#!). Outside a truce, every month it stays shut also deepens its hunger and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_plata.21.d_squadron:0 "The powers' squadrons have carried off Brown's squadron off Montevideo, and without ships Rosas's battery closes nothing: vessels are reaching the city again. There can be no closure until what was taken from him is returned.\n\nThe run of months without a ship is broken."
 gg_plata.24.d_france:0 "Paris has come to terms with Rosas and withdrawn her squadron, taking back the frigates she had lent the Defensa; London was already out of the question. If Rosas still holds the Buenos Aires shore and its battery, the river is his to command once more."
 gg_plata.27.d_none:0 "Without a shot fired, London recognises Argentine sovereignty over its rivers and its right of blockade, as in the Arana–Southern treaty. Its guarantee is at an end: the Cerrito may again ask Rosas to close the river, and no power today backs the Defensa firmly enough to call him to account."
 gg_plata.44.t:0 "The British Station and the Blockade"
 gg_plata.44.d:0 "Commodore #b Purvis#!, from the #b Alfred#!, answers our blockade that his government does not allow the new ports of South America ‘so high and weighty a right as that of blockade’, and demands passage for the neutral ships bound for the city.\n\nUntil London either backs or disowns its commodore, the only blockade the British station will tolerate is one that stops the Defensa's own vessels."
 gg_plata.44.f:0 "‘Mr Brown, a British subject in command of the ships of Buenos Aires.’ — Commodore Purvis"
 gg_plata.44.a:0 "Let London disown him."
 gg_plata.44.a_tt:0 "@information! Until London disowns Purvis, Rosas's word is that his blockade stops only the Defensa's ships.\n#grey (Playing as Rosas: your shore stays as you left it in the strait panel. Closed to enemies only, neutrals make port; closed to every flag, the closure still holds.)#!"
 gg_plata.45.t:0 "London Disowns Purvis"
 gg_plata.45.d:0 "Lord #b Aberdeen#! has disowned his commodore: London recognises our right of blockade, and the British station no longer demands passage for the city. #b Purvis#! goes unpunished.\n\nNothing now stands in the way of closing the river to every flag."
 gg_plata.45.f:0 "London did not punish its commodore; it merely told him he was wrong."
 gg_plata.45.a:0 "Close the river again."
 gg_plata.10.d_peace_france:0 "The French minister demands, with a deadline, that the blockade of the river be lifted; London keeps out of it. But the Oriental war is over, and whatever answer is given now lies between Buenos Aires and Paris.\n\nSeñor #b Arana#! has the passports ready. To hand them over is war with France, though she will not declare it. To hold them back is to lift the blockade: the river opens, and there is no war left for Paris to stand guarantor over."
 gg_ui_plata_sec_clocks_grace:0 "Stilled While Rosas's Time Runs"
 gg_ui_plata_sec_clocks_grace_tt:0 "Rosas has given way to the ultimatum and has two months to open his shore. While that time runs, nothing on the river moves: neither the city's hunger, nor the powers' patience, nor the river's weight in the war."
 gg_ui_plata_phase_3_lifted_tt:0 "France has raised her blockade of Buenos Aires, as Baron Gros did in June 1848: no squadron closes Rosas's port any longer. London and Paris remain in the question, their squadrons on the river, until they come to terms with Rosas. So long as Rosas holds his shore and its battery, he can keep the way to Montevideo closed.\n#b Effects#!: each power with a squadron on the river, infamy generation #N +10%#!; the Defensa, #V 4#! frigates lent by the powers, their stores paid for by France; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_ui_plata_phase_3_france_lifted_tt:0 "France has raised her blockade of Buenos Aires, as Baron Gros did in June 1848, but her squadron is still on the river and Paris remains in the question until she comes to terms with Rosas; London is out of it. So long as Rosas holds his shore and its battery, he can keep the way to Montevideo closed.\n#b Effects#!: France, infamy generation #N +10%#!; the Defensa, #V 4#! frigates lent by France, their stores at her expense; Montevideo, mortality #N +5%#! while the river stays shut."
 gg_plata.46.t:0 "France Raises the Blockade of Buenos Aires"
 gg_plata.46.d:0 "France raises her blockade of the port of Buenos Aires, as in June 1848, when Baron Gros brought it to an end with the convention he arranged for Montevideo. Ships are returning to Rosas's port.\n\nThis is not the end of the intervention: the French squadron stays in the Plata, and Paris remains in the question until she comes to terms with Rosas. London remains too, until its own settlement."
 gg_plata.46.d_france:0 "France raises her blockade of the port of Buenos Aires, as in June 1848, when Baron Gros brought it to an end with the convention he arranged for Montevideo. Ships are returning to Rosas's port.\n\nThis is not the end of the intervention: the French squadron stays in the Plata, and Paris remains in the question until she comes to terms with Rosas."
 gg_plata.46.a_tt:0 "@information! The Buenos Aires shore is no longer blockaded: its trade capacity recovers #P +10#!. The French squadron stays on the river."
