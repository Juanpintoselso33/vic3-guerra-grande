l_english:
 gg_ui_plata_weight_blancos:0 "The river tips the war #blue_value +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! in the blancos' favour."
 gg_ui_plata_weight_colorados:0 "The river tips the war #R +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! in the colorados' favour."
 gg_ui_plata_port_blockade:0 "@warning! #b The port of Buenos Aires is under blockade#!: it is Buenos Aires that is closed, not Montevideo."
 gg_plata_rosas_close_tt:0 "@ships! Rosas #N closes the Plata#! to every foreign flag. So long as his shore has a battery, the closure holds even if Montevideo stays open.\n#gray (Playing as Rosas: close your shore in the River Plate strait panel.)#!"
 gg_plata_rosas_open_tt:0 "@ships! Rosas #P opens the Plata#!.\n#gray (Playing as Rosas: keep your shore open in the strait panel; close it again and London's and Paris's patience starts running down once more.)#!"
 gg_plata_rosas_neutrals_tt:0 "@ships! Rosas's blockade stops only the Defensa's ships: #P neutral vessels make port#!."
 gg_plata_fort_remove_tt:0 "@warning! Buenos Aires loses its battery: #N Rosas cannot close the river#! until he recovers it."
 gg_plata_fort_restore_tt:0 "@ships! Buenos Aires recovers its battery: #b Rosas can close the river once more#!."
 gg_plata_intervention_start_tt:0 "@warning! #N The Anglo-French intervention begins#!: Britain and France break with Rosas (relations #N -30#!), and their squadrons enter the river."
 gg_plata_squadrons_called_tt:0 "@information! London's and Paris's patience with a closed river falls from #V 18#! to #V 12#! months."
 gg_plata.2.b_tt:0 "@information! The Cerrito may ask again."
 gg_plata.2.t:0 "Oribe Asks for the Blockade of Montevideo"
 gg_plata.2.d:0 "General #b Oribe#! writes from the Cerrito: the city lives off its port, and so long as ships come in by the river the siege will never bring it down. He asks that Commodore #b Brown#!'s squadron close the waters of Montevideo to every flag.\n\nThe British station has already made plain how it will receive this. Its government holds it as a principle not to allow ‘the new ports of South America’ the exercise of ‘so high and weighty a right as that of blockade’, and Commodore #b Purvis#! has the fifty-gun #b Alfred#! lying in the roads.\n\nWhatever is decided, the Buenos Aires battery will enforce it. Without it, none of our prohibitions counts for anything on the water; with it, the river is closed from our shore even if the other stays open."
 gg_plata.2.f:0 "Whoever holds the shore holds the river."
 gg_plata.2.a:0 "Declare the blockade."
 gg_plata.2.b:0 "I will not stake the squadron on Montevideo."
 gg_plata.10.t:0 "Passports for Ouseley and Deffaudis"
 gg_plata.10.d:0 "The British minister, #b William Gore Ouseley#!, and Baron #b Deffaudis#!, who came out with Guizot's instructions, demand the same thing note after note: that the blockade of Montevideo be lifted and the Argentine divisions leave the Oriental State. They declare they will not accept General Oribe as lawful president ‘not even if elected’.\n\nNow the ultimatum has come, with a deadline. If it is refused, their admirals will seize Commodore Brown's squadron off Montevideo and blockade the ports of the Confederation. Both ministers have already asked for their passports should it come to that.\n\nSeñor #b Arana#! has them ready. To hand them over is war with the two foremost powers of Europe, though neither will declare it; to hold them back is to lift the blockade that keeps General Oribe before the city."
 gg_plata.10.f:0 "‘As much in the interest of our commerce as in that of humanity, we find ourselves obliged to put an end to a state of affairs that has become intolerable.’ — Guizot, instructions to Baron Deffaudis"
 gg_plata.10.a:0 "Hand them their passports."
 gg_plata.10.b:0 "Lift the blockade."
 gg_strait_control_magellan:0 "Shore of the Strait of Magellan"
 gg_strait_control_magellan_desc:0 "Whoever holds this coast commands the passage, even without a fort to close it."
 gg_plata_rosas_yielded:0 "Struck His Colours to the Powers"
 gg_plata_rosas_yielded_desc:0 "Rosas lifted the blockade in the face of London's and Paris's ultimatum."
 gg_ai_strategy_plata_open:0 "Free Navigation"
 gg_ai_strategy_plata_open_desc:0 "[COUNTRY.GetName] lets every flag pass its shore of the Plata."
 gg_ai_strategy_plata_closed:0 "Blockade of Montevideo"
 gg_ai_strategy_plata_closed_desc:0 "[COUNTRY.GetName] closes its shore of the Plata to every flag but its own."
 gg_ai_strategy_plata_enemies:0 "Partial Blockade"
 gg_ai_strategy_plata_enemies_desc:0 "[COUNTRY.GetName] stops only its enemies' ships; neutrals make port."
 gg_ai_strategy_plata_defensa:0 "Open Port"
 gg_ai_strategy_plata_defensa_desc:0 "[COUNTRY.GetName] lives off its port and keeps it open to all comers."
 gg_plata.20.t:0 "The River Closed"
 gg_plata.20.d:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nFor as long as the closure lasts, the city suffers (mortality #N +5%#!). Outside a truce, each month also deepens its hunger, wears down the patience of London and Paris and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_plata.20.a:0 "Let it be known along the lines."
 gg_plata.21.t:0 "The River Reopened"
 gg_plata.21.d_battery:0 "Buenos Aires has lost its battery, and without it Rosas cannot close the river: ships are reaching Montevideo again. There can be no closure until the battery is raised once more.\n\nThe run of months without a ship is broken."
 gg_plata.21.d_shore:0 "The Buenos Aires shore is no longer in Rosas's hands, and no one else can close the river: ships are reaching Montevideo again.\n\nThe run of months without a ship is broken."
 gg_plata.21.d_neutrals:0 "Rosas is letting neutral ships through. The blockade now stops only the Defensa's own vessels, and through that open door the city is being supplied again.\n\nThe run of months without a ship is broken."
 gg_plata.21.d_rosas:0 "Rosas has reopened the river, and ships are reaching Montevideo again.\n\nThe run of months without a ship is broken."
 gg_plata.22.t:0 "The Ministers Ask for Their Passports"
 gg_plata.22.d:0 "The ministers of London and Paris have demanded that Rosas lift the blockade of the river, and await his reply. On it hangs whether their squadrons will enter the Plata.\n\nArgentina loses prestige (#N -10%#!) while the matter stands."
 gg_plata.23.t:0 "The Squadrons on the River"
 gg_plata.23.d:0 "The British and French squadrons have entered the Plata and are blockading the port of Buenos Aires. That alone does not reopen the way to Montevideo: much depends on what becomes of Brown's squadron and of Rosas's battery."
 gg_plata.24.t:0 "Terms with Rosas"
 gg_plata.24.d:0 "London and Paris have come to terms with Rosas and withdrawn their squadrons. If Rosas still holds the Buenos Aires shore and its battery, the river is his to command once more."
