l_english:

# EN: Fructuoso Rivera, 1842-1854 -- the defeats, the banishment decreed by his own government,
#     the return and the death on the road. Every date, figure and quotation below is sourced in
#     SOURCES_rivera.md and in the comments of events/guerra_grande_rivera.txt.

 gg_rivera.1.t:0 "Arroyo Grande"
 gg_rivera.1.d:0 "Eight thousand a side on the Arroyo Grande, in Entre Ríos. Oribe's right, under Urquiza, and his brother Ignacio's horse take the centre apart, and by evening the army the President took across the river does not exist: two thousand dead on the field, fourteen hundred prisoners, every gun, every round, twenty-four thousand horses. The officers are put to the knife, and it is said the corporals and sergeants with them; the soldiers are folded into Oribe's ranks, because the blancos hold that a colorado is a man who overthrew the legal government with foreign help. Oribe loses three hundred. Rivera runs from the field leaving his sword and his pistols in the grass, and rides for Montevideo by forced marches with Oribe coming behind him.\n\nThe government has perhaps ten weeks. Oribe wastes them on small business, and Rosas's fleet has to ferry his guns across, so it is 16 February before his vanguard camps on the hill. What is decided now is where the last five thousand men in the Republic are going to stand: out in the campaña with Rivera, where the war can still be won, or behind the wall, where the city is."
 gg_rivera.1.f:0 "Defeated abroad, without armies or soldiers, without war matériel, without money, revenue or credit."
 gg_rivera.1.a:0 "Send the infantry out to him. The war is not won inside a wall."
 gg_rivera.1.b:0 "Everything to the wall. Call out the Guardia Nacional and remount the old guns."
 gg_rivera.2.t:0 "India Muerta"
 gg_rivera.2.d_reinforced:0 "Rosas has sent four thousand entrerrianos under Urquiza with one instruction: finish Rivera. On the night of the twenty-sixth Rivera calls a council of war beside the arroyo, and the council votes to fight. Before dawn a rider comes in from Anacleto Medina with Medina's opinion — do not engage until the rest of the men are up. Rivera engages.\n\nIt lasts two hours. The left is inverted in the confusion and gone before it can form; Rivera is nearly killed on the right and is pulled out by the colonels around him; Urquiza throws in his own escort and the battle is over. Four hundred to a thousand dead on the ground, five hundred prisoners, the park, the horses, his whole correspondence, and his sword. Urquiza has the five hundred prisoners' throats cut, and hangs a paper from a lookout post: «El que entierre uno de estos será degollado.»\n\nHe crosses the Yaguarón at the Paso de las Piedras and asks the Empire for asylum. The Army of Operations of the Republic is three hundred men on Brazilian ground and a general with no sword."
 gg_rivera.2.d_alone:0 "He gave battle waiting for us. That is the part of it that will be read out in this room for years.\n\nRosas sent four thousand entrerrianos under Urquiza with one instruction: finish Rivera. Rivera detached Medina and Olavarría to La Paloma to meet the infantry we were going to send, and his own chief of staff, José Antonio Costa, wrote to him that he doubted it would come in time. It did not come at all. On the night of the twenty-sixth the council of war voted to fight anyway; before dawn a rider came in from Medina saying do not engage until the men are up; he engaged.\n\nTwo hours. Four hundred to a thousand dead, five hundred prisoners, the park, the horses, his correspondence and his sword. Urquiza had the five hundred prisoners' throats cut and hung a paper from a lookout post: «El que entierre uno de estos será degollado.» Rivera crossed the Yaguarón and asked the Empire for asylum."
 gg_rivera.2.f:0 "Three defeats in three years, and each one the last army this Republic had."
 gg_rivera.2.a:0 "Strip him of every command. The army goes to Anacleto Medina."
 gg_rivera.2.b:0 "Pay Caxias for arms and horses, and put him back in the field."
 gg_rivera.2.c:0 "Ask Río de Janeiro to keep him where he is."
 gg_rivera.3.t:0 "Se Viene el Patrón"
 gg_rivera.3.d:0 "The man this government stripped of everything was then made its minister to Paraguay — partly to do something about the cell the Empire was holding him in, mostly to have him anywhere but here. Brazil refused him the passport for Asunción, let him out of the cell anyway, and put him aboard the schooner Perla for Montevideo. He is standing on the deck in the harbour now, and half the city is on the mole. The watchword has been going round the barracks for a week: «Se viene el Patrón.»\n\nThis government forbade the landing. It offered him a legation in Europe, and he refused it in front of witnesses. The Sociedad Nacional — the gentlemen of the city organised against him, Santiago Vázquez in the chair — has extracted a decree of banishment. And this morning the Basque battalion, the liberto infantry of the line and the squadrons of Colonels César Díaz and Venancio Flores are under arms in the street demanding that the decree be torn up. The men on the wall are asking the government whether it would like to be a government.\n\nHis wife has been at the centre of the conspiracy for a month. She is waiting at the foot of the gangway."
 gg_rivera.3.f:0 "A decree is worth what the garrison will enforce."
 gg_rivera.3.a:0 "Annul it. Let him come ashore, and let the ministry resign."
 gg_rivera.3.b:0 "The decree stands. Break the mutiny and cashier the colonels who led it."
 gg_rivera.4.t:0 "The House on the Corner at Maldonado"
 gg_rivera.4.d_restored:0 "He took Mercedes, and then Paysandú in December, and his men sacked it. In January Ignacio Oribe and Servando Gómez destroyed what was left of him at the Cerro de las Ánimas and had both towns back within the week. Since then he has been in Maldonado, and he has not been idle: he has sent the Cerrito a peace of eight conditions over this government's head. End the war. Give back the confiscated property. Hold elections. An arrangement «entre orientales», with the foreign troops of both sides evacuated.\n\nHerrera y Obes has already disowned the approach in writing. The commission has the decree drafted: destitution from every post he holds, and banishment from the Republic «por todo el tiempo que dure la presente guerra». Colonels Lorenzo Batlle and Francisco Tajes are waiting for the order with a considerable force, and a French ship — our ally's ship — is standing by to carry him to the Empire.\n\nHe founded the party that sits in this room. He threw Oribe out in 1838. His government created this government."
 gg_rivera.4.d_brazilian_arms:0 "He rebuilt his divisions out of the Empire's arsenals in Rio Grande, with this government's money and this government's signature, and every man in the Sociedad Nacional knows it. Since then: Mercedes taken, Paysandú taken in December and sacked by his own men, and in January the Cerro de las Ánimas, where Ignacio Oribe and Servando Gómez destroyed him and had both towns back within the week.\n\nAnd now he has sent the Cerrito a peace of eight conditions over this government's head. End the war. Give back the confiscated property. Hold elections. An arrangement «entre orientales», with the foreign troops of both sides evacuated. Herrera y Obes has disowned it in writing. The charge sheet writes itself: a general who arms himself from a foreign empire and negotiates with the enemy is not a general, and the word for him is in every pamphlet in the city.\n\nThe decree is drafted — destitution and banishment «por todo el tiempo que dure la presente guerra». Batlle and Tajes are waiting for the order, and a French ship is standing by."
 gg_rivera.4.f:0 "The government he made, defending the city he saved, deciding where to put him."
 gg_rivera.4.a:0 "Sign it. Batlle and Tajes to Maldonado tonight."
 gg_rivera.4.b:0 "He is the only general we have ever had. Let him govern, then."
 gg_rivera.4.c:0 "Back the eight conditions. Send them to the Cerrito over the ministry's head."
 gg_rivera.5.t:0 "The Triumvirate of Exiles"
 gg_rivera.5.d_exiled:0 "The peace was signed without him. «Ni vencidos ni vencedores», and the man who had been proposing exactly that since 1846 was in a house in Río de Janeiro, forbidden to leave the city, living in the greatest poverty. When the war ended, President Juan Francisco Giró refused to let him come home: the decree said for the duration of the war, and the government found other words.\n\nEveryone expected Eugenio Garzón to be the first president of the reunited country. Garzón died, and Giró was elected instead, on the politica de fusión — blancos and colorados in one cabinet. It did not hold a year. Venancio Flores, Jefe Político of Montevideo and then Minister of War, has forced Giró out and named three men to finish the constitutional term: himself, Juan Antonio Lavalleja and Fructuoso Rivera.\n\nTwo of the three triumvirs are abroad. One of them this government put there."
 gg_rivera.5.d_at_home:0 "«Ni vencidos ni vencedores», and then two years of arguing about what the words meant. Everyone expected Eugenio Garzón to be the first president of the reunited country; Garzón died, and Juan Francisco Giró was elected instead, on the politica de fusión — blancos and colorados in one cabinet. It did not hold a year.\n\nVenancio Flores, Jefe Político of Montevideo and then Minister of War, has forced Giró out and named three men to finish the constitutional term: himself, Juan Antonio Lavalleja and Fructuoso Rivera. It is a government made entirely of names, and the names are the two old men who founded the two halves of this country's politics, plus the colonel who wrote the list."
 gg_rivera.5.f:0 "Lavalleja is sixty-nine. Rivera is sixty-four."
 gg_rivera.5.a:0 "Call them both home. Let the old man have the chair a third time."
 gg_rivera.5.b:0 "Flores governs. Leave Don Frutos in Río de Janeiro."
 gg_rivera.6.t:0 "Arroyo Conventos"
 gg_rivera.6.d_on_the_road:0 "He crossed back on the nineteenth of November and slept at the Posta de Menna. On the twenty-fourth Anacleto Medina rode out to meet him — the indio Medina, who was handed his army in 1845 — and paraded the troops past the triumvir, and the old man's eyes filled. At Durazno, where he had known his glories and his loves, the friends came out to the road, and there the vomiting started.\n\nHe rested a few days at Cerro Largo, wrote his last letters, and went on. Brígido Silveira, who commanded his escort, begged him to stop longer. He would not: Bernardina was waiting, Pacheco y Obes was waiting, Flores was waiting, Montevideo was waiting. At midday on the twelfth he understood, and spoke to the men in the rancho: «Ese baúl, si muero, se encargarán ustedes de entregarlo al Gobierno. En él se encierran todos los últimos actos de mi vida, y en ellos encontrarán mis enemigos documentos que prueban que jamás he dejado de servir a la patria.»\n\nHe died the next day in the rancho of his compadre Bartolo Silva, by the arroyo Conventos outside Melo, three months and three weeks after Lavalleja. There is no coffin to be had, so they put him in a tin box of cane spirit and carry on toward the capital."
 gg_rivera.6.d_in_rio:0 "The notice comes up from Río de Janeiro by the packet, weeks late and three lines long. Fructuoso Rivera died in January, in the house he was not allowed to leave, in the greatest poverty, sixty-four years old.\n\nHe was the first president this country ever elected, twice more its head of state, the founder of the party that governs it, and the man who threw Manuel Oribe out in 1838 and so began everything that followed. He spent the last seven years of his life in a city he was sent to by the government he created, on a decree that said «por todo el tiempo que dure la presente guerra» — and the war has been over for two years.\n\nThere is a trunk of papers with the effects. He left instructions that it go to the Government: «en ellos encontrarán mis enemigos documentos que prueban que jamás he dejado de servir a la patria»."
 gg_rivera.6.f:0 "Ni vencidos ni vencedores — and now there is nobody left to argue about which he was."
 gg_rivera.6.a:0 "Bury him in the Matriz beside Lavalleja, and keep the fusión."
 gg_rivera.6.b:0 "The party governs alone. Open the trunk."
 gg_rivera.8.t:0 "The Lieutenant Colonel's Books"
 gg_rivera.8.d:0 "Lieutenant Colonel Bartolomé Mitre has requested his discharge. He came to Montevideo with his family in 1831; five years later he entered the Military School and trained in artillery. Before 1839 was out he had become an ensign, written for El Iniciador and El Nacional, and fought at Cagancha under Rivera. In 1842 he joined General Paz's forces and came out of Arroyo Grande defeated and a captain. Then came the Great Siege, and with it Garibaldi.\n\nThis year he received the rank of lieutenant colonel. Now he says only that he will no longer serve under Rivera. There is nothing on record about the reason that this ministry can add.\n\nA ship leaves today. Mitre has packed the books Esteban Echeverría asked him to distribute among the exiles during the stop at Valparaíso. We can still let him board, return him to the batteries, or give him orders for the littoral."
 gg_rivera.8.f:0 "Fifteen years in Montevideo, and all the file says is that one man will no longer serve under another."
 gg_rivera.8.a:0 "Let him embark. And see that the books reach Valparaíso."
 gg_rivera.8.b:0 "No. Send him back to the batteries."
 gg_rivera.8.c:0 "Give him orders for the littoral. Let him report to Paz."

# Military formations raised by this arc.
 Ejercito_de_Operaciones:0 "Army of Operations"
 Guardia_Nacional_de_Montevideo:0 "National Guard of Montevideo"
 Division_del_Yaguaron:0 "Division of the Yaguarón"
 gg_mitre_baterias_defensa:0 "Batteries of the Defensa"
 gg_mitre_artilleria_corrientes:0 "Artillery of Corrientes"

# Modifiers.
 gg_rivera_walls_stripped:0 "The Wall Stripped for the Campaña"
 gg_rivera_walls_stripped_desc:0 "The battalions marched out to the open country are battalions that are not on the wall. In February 1843 the line infantry was the only thing between Oribe and the city; everything else was national guard and urban militia."
 gg_rivera_the_city_takes_the_war:0 "The City Takes the War"
 gg_rivera_the_city_takes_the_war_desc:0 "The Guardia Nacional called out, the first line corps raised, and the colonial guns that had been serving as posts in the pavements taken up and remounted. The city has worked out that the defence is the defence of its own houses."
 gg_rivera_medina_takes_the_army:0 "Medina Takes the Army"
 gg_rivera_medina_takes_the_army_desc:0 "Anacleto Medina held the right at India Muerta and had advised against giving battle at all. He is a professional where there was a caudillo — and a man nobody in the campaña will follow out of love."
 gg_rivera_arms_from_the_empire:0 "Arms from the Empire"
 gg_rivera_arms_from_the_empire_desc:0 "Muskets, clothing and horses from the imperial arsenals in Rio Grande, dealt for with the Marquis of Caxias. It puts a beaten army back in the field and puts the Republic in the Empire's ledger, where nothing is ever written off."
 gg_rivera_the_doctors_free_hand:0 "The Doctores Have a Free Hand"
 gg_rivera_the_doctors_free_hand_desc:0 "With the caudillo in an imperial cell, the ministries govern by decree and answer to nobody on horseback. It is everything the doctores said they wanted, obtained by asking a foreign empire to jail the founder of their own party."
 gg_rivera_gran_mariscal:0 "Gran Mariscal de la República"
 gg_rivera_gran_mariscal_desc:0 "General-in-chief of the Army of Operations and Grand Marshal of the Republic, both conferred within days by a government that had just tried to forbid him to come ashore. The men follow him. The government annulled its own decree under the guns of its own garrison."
 gg_rivera_the_mutiny_broken:0 "The Mutiny Broken"
 gg_rivera_the_mutiny_broken_desc:0 "The order held and the garrison did not. The Basque battalion and the liberto line infantry were the real soldiers on the wall, and the two colonels who marched them out were the best field officers this government had."
 gg_rivera_the_doctors_republic:0 "A Republic of Ministers"
 gg_rivera_the_doctors_republic_desc:0 "Herrera y Obes at Gobierno and Relaciones Exteriores, the Asamblea de Notables sitting, the decree of banishment printed with all its papers — and not one general left who has ever commanded an army in the field against Oribe."
 gg_rivera_the_caudillos_republic:0 "A Republic of One Man"
 gg_rivera_the_caudillos_republic_desc:0 "A government that will not banish its caudillo is a government the caudillo runs. The army follows him and the campaña follows him; the ministries, the Asamblea and the whole case being made to Paris and London about civilisation against caudillo barbarism do not."
 gg_rivera_entre_orientales:0 "Entre Orientales"
 gg_rivera_entre_orientales_desc:0 "End the war, give back what was confiscated, hold elections, and send home the foreign troops of both sides. The offer is affordable for everyone in the Republic except the government making it, because the foreign troops are what has been holding this line since 1843."
 gg_rivera_the_triumvirate:0 "The Triumvirate of 1853"
 gg_rivera_the_triumvirate_desc:0 "A three-man executive appointed by a colonel who has just forced out a president, to finish a term that is not his. Two of the three were abroad when they were named. It is a government made of names, and the names are enormous."
 gg_rivera_flores_alone:0 "Flores Governs Alone"
 gg_rivera_flores_alone_desc:0 "A clean chain of command, and the government of one faction of one party. The other half of the country did not read the peace that way, and will say so with weapons."
 gg_rivera_the_politics_of_fusion:0 "La Política de Fusión"
 gg_rivera_the_politics_of_fusion_desc:0 "Blancos and colorados in one cabinet: the only reading of «ni vencidos ni vencedores» with anything in it. The men who besieged this city for eight years sit in its government, and the army that broke the siege is asked to shake their hands."
 gg_rivera_colorado_exclusivism:0 "The Party Is the Government"
 gg_rivera_colorado_exclusivism_desc:0 "The government is the party, the party is the army and the port, and the countryside belongs to somebody else. Everything the phrase «ni vencidos ni vencedores» was written to prevent."
