l_english:

# EN: Fructuoso Rivera, 1842-1854 -- the defeats, the banishment decreed by his own government,
#     the return and the death on the road. Every date, figure and quotation below is sourced in
#     SOURCES_rivera.md and in the comments of events/guerra_grande_rivera.txt.

 gg_rivera.1.t:0 "Arroyo Grande"
 gg_rivera.1.d:0 "Eight thousand men on each side at Arroyo Grande, in Entre Ríos. Oribe's right wing under Urquiza and the cavalry of his brother Ignacio tear the centre apart. By evening the army the President led across the river no longer exists: two thousand dead upon the field, fourteen hundred prisoners, every gun, every round of ammunition and twenty-four thousand horses lost. The officers are put to the knife, and reportedly the corporals and sergeants with them; the rank and file are incorporated into Oribe's army, for to the blancos a colorado is merely a man who overthrew the lawful government with foreign aid. Oribe loses three hundred men. Rivera flees the field, leaving sword and pistols in the grass, and rides for Montevideo by forced marches with Oribe behind him.\n\nThe government has ten weeks at most. Oribe wastes them on lesser affairs, while Rosas's fleet must ferry his artillery across the river; only on 16 February does his vanguard camp upon the ridge. The question now is where the Republic's last five thousand men will stand: in the countryside with Rivera, where the war may still be won, or behind the walls, where the city lies."
 gg_rivera.1.f:0 "Defeated abroad, without armies or soldiers, without war matériel, without money, revenue or credit."
 gg_rivera.1.a:0 "Send the infantry out to him. The war is not won inside a wall."
 gg_rivera.1.b:0 "Everything to the wall. Call out the Guardia Nacional and remount the old guns."
 gg_rivera.2.t:0 "India Muerta"
 gg_rivera.2.d_reinforced:0 "Rosas has sent four thousand men from Entre Ríos under Urquiza with a single instruction: finish Rivera. On the night of the twenty-sixth Rivera summons a council of war beside the arroyo, and the council votes to give battle. Before dawn a rider arrives from Anacleto Medina with his advice — do not engage until the rest of the men have come up. Rivera engages.\n\nThe battle lasts two hours. In the confusion the left wing forms facing the wrong way and is lost before it can deploy; Rivera is nearly killed on the right and is dragged away by the colonels around him; Urquiza commits his own escort, and the battle is over. Between four hundred and a thousand lie dead, five hundred are taken prisoner, and the artillery park, the horses, all his correspondence and his sword are lost. Urquiza has the five hundred prisoners' throats cut and hangs a notice from a lookout post: ‘Whoever buries one of these men will have his throat cut.’\n\nRivera crosses the Yaguarón at the Paso de las Piedras and asks the Empire for asylum. The Army of Operations of the Republic is reduced to three hundred men on Brazilian soil and a general without a sword."
 gg_rivera.2.d_alone:0 "He gave battle while waiting for us. That is the part which will be read aloud in this chamber for years.\n\nRosas sent four thousand men from Entre Ríos under Urquiza with a single instruction: finish Rivera. Rivera detached Medina and Olavarría to La Paloma to meet the infantry we were to send, while his own chief of staff, José Antonio Costa, warned that he doubted it would arrive in time. It never arrived at all. On the night of the twenty-sixth the council of war voted to fight nonetheless; before dawn a rider came from Medina with orders not to engage until the men had come up; Rivera engaged.\n\nTwo hours. Between four hundred and a thousand dead, five hundred prisoners, the artillery park, the horses, his correspondence and his sword. Urquiza had the five hundred prisoners' throats cut and hung a notice from a lookout post: ‘Whoever buries one of these men will have his throat cut.’ Rivera crossed the Yaguarón and asked the Empire for asylum."
 gg_rivera.2.f:0 "Three defeats in three years, and each one the last army this Republic had."
 gg_rivera.2.a:0 "Strip him of every command. The army goes to Anacleto Medina."
 gg_rivera.2.b:0 "Pay Caxias for arms and horses, and put him back in the field."
 gg_rivera.2.c:0 "Ask Río de Janeiro to keep him where he is."
 gg_rivera.3.t:0 "The Old Chief Is Coming"
 gg_rivera.3.d:0 "The man whom this government stripped of everything was then appointed its minister to Paraguay — partly to secure his release from the Empire's cell, chiefly to keep him anywhere but here. Brazil refused him a passport for Asunción, released him from prison all the same, and placed him aboard the schooner Perla bound for Montevideo. He now stands upon its deck in the harbour, while half the city crowds the mole. A watchword has passed through the barracks for a week: ‘The old chief is coming.’\n\nThis government forbade him to land. It offered him a legation in Europe, which he refused before witnesses. The Sociedad Nacional — the gentlemen of the city organised against him, with Santiago Vázquez in the chair — has wrung from the government a decree of banishment. This morning the Basque battalion, the line infantry of freedmen and the squadrons of Colonels César Díaz and Venancio Flores stand armed in the streets, demanding that the decree be torn up. The men upon the walls are asking the government whether it intends to govern.\n\nHis wife has been at the centre of the conspiracy for a month. She is waiting at the foot of the gangway."
 gg_rivera.3.f:0 "A decree is worth what the garrison will enforce."
 gg_rivera.3.a:0 "Annul it. Let him come ashore, and let the ministry resign."
 gg_rivera.3.b:0 "The decree stands. Break the mutiny and cashier the colonels who led it."
 gg_rivera.4.t:0 "The House on the Corner at Maldonado"
 gg_rivera.4.d_restored:0 "He took Mercedes and then Paysandú in December, which his men sacked. In January Ignacio Oribe and Servando Gómez destroyed what remained of his force at the Cerro de las Ánimas and recovered both towns within a week. Since then he has remained in Maldonado, but not idle: over this government's head he has sent the Cerrito eight conditions for peace. End the war. Restore confiscated property. Hold elections. An agreement ‘among Uruguayans’, with the foreign troops of both sides evacuated.\n\nHerrera y Obes has already repudiated the overture in writing. The commission has drafted its decree: removal from every office he holds and banishment from the Republic ‘for as long as the present war shall last’. Colonels Lorenzo Batlle and Francisco Tajes await the order with a considerable force, while a French ship — a ship belonging to our ally — stands ready to carry him to the Empire.\n\nHe founded the party seated in this chamber. He overthrew Oribe in 1838. His government created this government."
 gg_rivera.4.d_brazilian_arms:0 "He rebuilt his divisions from the Empire's arsenals in Río Grande, with this government's money and under this government's signature, as every member of the Sociedad Nacional knows. Since then he has taken Mercedes and Paysandú, the latter sacked by his own men in December, only for Ignacio Oribe and Servando Gómez to destroy his force at the Cerro de las Ánimas in January and recover both towns within a week.\n\nNow, over this government's head, he has sent the Cerrito eight conditions for peace. End the war. Restore confiscated property. Hold elections. An agreement ‘among Uruguayans’, with the foreign troops of both sides evacuated. Herrera y Obes has repudiated the overture in writing. The articles of accusation write themselves: a general who arms himself from a foreign empire and negotiates with the enemy is no general, and the proper word for him appears in every pamphlet in the city.\n\nThe decree has been drafted — removal and banishment ‘for as long as the present war shall last’. Batlle and Tajes await the order, and a French ship stands ready."
 gg_rivera.4.d_closed:0 "The file arrived too late. The Cerrito government no longer exists and the war addressed by the eight conditions has ended. There are no enemy plenipotentiaries left with whom to negotiate, nor can this ministry now sign a banishment ‘for as long as the present war shall last’."
 gg_rivera.4.f:0 "The government he made, defending the city he saved, deciding where to put him."
 gg_rivera.4.a:0 "Sign it. Batlle and Tajes to Maldonado tonight."
 gg_rivera.4.b:0 "He is the only general we have ever had. Let him govern, then."
 gg_rivera.4.c:0 "Back the eight conditions. Send them to the Cerrito over the ministry's head."
 gg_rivera.4.d:0 "File the papers: the war is over."
 gg_rivera.5.t:0 "The Triumvirate of Exiles"
 gg_rivera.5.d_exiled:0 "Peace was signed without him. ‘Neither victors nor vanquished’ — and the man who had proposed precisely that formula since 1846 sat in a house in Río de Janeiro, forbidden to leave the city and living in the greatest poverty. When the war ended, President Juan Francisco Giró refused to allow his return: the decree said for the duration of the war, and the government found other words.\n\nEveryone expected Eugenio Garzón to become the first president of the reunited country. Garzón died, and Giró was elected instead upon a policy of fusion — blancos and colorados in one cabinet. It did not survive a year. Venancio Flores, Political Chief of Montevideo and later Minister of War, has forced Giró from office and named three men to complete the constitutional term: himself, Juan Antonio Lavalleja and Fructuoso Rivera.\n\nTwo of the three triumvirs are abroad. This government placed one of them there."
 gg_rivera.5.d_at_home:0 "‘Neither victors nor vanquished’ — followed by two years of argument over what those words meant. Everyone expected Eugenio Garzón to become the first president of the reunited country; Garzón died, and Juan Francisco Giró was elected instead upon a policy of fusion — blancos and colorados in one cabinet. It did not survive a year.\n\nVenancio Flores, Political Chief of Montevideo and later Minister of War, has forced Giró from office and named three men to complete the constitutional term: himself, Juan Antonio Lavalleja and Fructuoso Rivera. It is a government composed entirely of names: the two old men who founded the two halves of this country's politics, and the colonel who wrote the list."
 gg_rivera.5.d_incompatible:0 "The triumvirate belonged to another settlement: peace without victors, Giró's government and a policy of fusion. None of those conditions now governs this country. Papers preserved by the ministry cannot dismiss the sitting president or decide anew a succession that the war resolved otherwise."
 gg_rivera.5.f:0 "Lavalleja is sixty-nine. Rivera is sixty-four."
 gg_rivera.5.a:0 "Call them both home. Let the old man have the chair a third time."
 gg_rivera.5.b:0 "Flores governs. Leave Don Frutos in Río de Janeiro."
 gg_rivera.5.c:0 "Close the file. That succession never occurred."
 gg_rivera.6.t:0 "Arroyo Conventos"
 gg_rivera.6.d_on_the_road:0 "He crossed back on the nineteenth of November and slept at the Posta de Menna. On the twenty-fourth Anacleto Medina rode out to meet him — Medina the Indian, to whom his army had been entrusted in 1845 — and paraded the troops before the triumvir. The old man's eyes filled with tears. At Durazno, where he had known his triumphs and his loves, friends came out to meet him upon the road; there the vomiting began.\n\nHe rested for several days at Cerro Largo, wrote his last letters and continued. Brígido Silveira, commander of his escort, begged him to remain longer. He refused: Bernardina was waiting, Pacheco y Obes was waiting, Flores was waiting, Montevideo was waiting. At noon on the twelfth he understood and addressed the men in the rancho: ‘If I die, you will see that this trunk is delivered to the Government. It contains all the last acts of my life; in those papers my enemies will find proof that I have never ceased to serve the fatherland.’\n\nHe died the next day in the rancho of his compadre Bartolo Silva, beside the Arroyo Conventos near Melo, three months and three weeks after Lavalleja. No coffin could be found, so they placed him in a tin-lined case filled with cane spirit and continued towards the capital."
 gg_rivera.6.d_in_rio:0 "The notice arrives from Río de Janeiro by packet, weeks late and three lines long. Fructuoso Rivera died in January, at the age of sixty-four, in the house he was forbidden to leave and in the greatest poverty.\n\nHe was the first president this country elected, twice more its head of state, the founder of the party that governs it, and the man who drove Manuel Oribe from office in 1838 and so began all that followed. He spent the last seven years of his life in a city to which the government he created had sent him, under a decree that read ‘for as long as the present war shall last’ — and the war has been over for two years.\n\nAmong his effects is a trunk of papers. He instructed that it be sent to the Government: ‘in those papers my enemies will find proof that I have never ceased to serve the fatherland.’"
 gg_rivera.6.f:0 "Neither victor nor vanquished — and nobody remains to argue which he was."
 gg_rivera.6.a:0 "Bury him in the Matriz beside Lavalleja, and keep the fusión."
 gg_rivera.6.b:0 "The party governs alone. Open the trunk."
 gg_rivera.8.t:0 "The Lieutenant Colonel's Books"
 gg_rivera.8.d:0 "Lieutenant Colonel Bartolomé Mitre has requested his discharge. He came to Montevideo with his family in 1831; five years later he entered the Military School and trained as an artillerist. Before 1839 was out he had become an ensign, written for El Iniciador and El Nacional, and fought under Rivera at Cagancha. In 1842 he joined General Paz's forces and emerged from the defeat at Arroyo Grande a captain. Then came the Great Siege, and with it Garibaldi.\n\nThis year he received the rank of lieutenant colonel. Now he says only that he will no longer serve under Rivera. The record gives no reason that this ministry can repeat.\n\nA ship leaves today. Mitre has packed the books Esteban Echeverría asked him to distribute among the exiles during the call at Valparaíso. We may still let him embark, return him to the batteries, or give him orders for the Litoral."
 gg_rivera.8.f:0 "Fifteen years in Montevideo, and all the file says is that one man will no longer serve under another."
 gg_rivera.8.a:0 "Let him embark. And see that the books reach Valparaíso."
 gg_rivera.8.b:0 "No. Send him back to the batteries."
 gg_rivera.8.c:0 "Give him orders for the littoral. Let him report to Paz."

# Military formations raised by this arc.
 Ejercito_de_Operaciones:0 "Army of Operations"
 Guardia_Nacional_de_Montevideo:0 "National Guard of Montevideo"
 Division_del_Yaguaron:0 "Division of the Yaguarón"
 gg_mitre_baterias_defensa:0 "Batteries of the Defensa"
 gg_mitre_artilleria_corrientes:0 "Artillery of Corrientes"

# Modifiers.
 gg_rivera_walls_stripped:0 "The Wall Stripped for the Countryside"
 gg_rivera_walls_stripped_desc:0 "The battalions marched out to the open country are battalions that are not on the wall. In February 1843 the line infantry was the only thing between Oribe and the city; everything else was national guard and urban militia."
 gg_rivera_the_city_takes_the_war:0 "The City Takes the War"
 gg_rivera_the_city_takes_the_war_desc:0 "The Guardia Nacional called out, the first line corps raised, and the colonial guns that had been serving as posts in the pavements taken up and remounted. The city has realised that it is defending its own homes."
 gg_rivera_medina_takes_the_army:0 "Medina Takes the Army"
 gg_rivera_medina_takes_the_army_desc:0 "Anacleto Medina held the right at India Muerta and had advised against giving battle at all. He is a professional where there was a caudillo — and a man nobody in the countryside will follow out of love."
 gg_rivera_arms_from_the_empire:0 "Arms from the Empire"
 gg_rivera_arms_from_the_empire_desc:0 "Muskets, clothing and horses from the imperial arsenals in Río Grande, obtained through the Marquis of Caxias. They put a beaten army back in the field and the Republic in the Empire's ledger, where nothing is ever written off."
 gg_rivera_the_doctors_free_hand:0 "The Doctores Have a Free Hand"
 gg_rivera_the_doctors_free_hand_desc:0 "With the caudillo in an imperial cell, the ministries govern by decree and answer to nobody on horseback. It is everything the doctores said they wanted, obtained by asking a foreign empire to jail the founder of their own party."
 gg_rivera_gran_mariscal:0 "Gran Mariscal de la República"
 gg_rivera_gran_mariscal_desc:0 "General-in-chief of the Army of Operations and Grand Marshal of the Republic, both conferred within days by a government that had just tried to forbid him to come ashore. The men follow him. The government annulled its own decree under the guns of its own garrison."
 gg_rivera_the_mutiny_broken:0 "The Mutiny Broken"
 gg_rivera_the_mutiny_broken_desc:0 "The order stood; the garrison did not. The Basque battalion and the freedmen's line infantry were the true soldiers upon the walls, while the two colonels who led them into the streets were the best field officers this government possessed."
 gg_rivera_the_doctors_republic:0 "A Republic of Ministers"
 gg_rivera_the_doctors_republic_desc:0 "Herrera y Obes at Gobierno and Relaciones Exteriores, the Asamblea de Notables sitting, the decree of banishment printed with all its papers — and not one general left who has ever commanded an army in the field against Oribe."
 gg_rivera_the_caudillos_republic:0 "A Republic of One Man"
 gg_rivera_the_caudillos_republic_desc:0 "A government that will not banish its caudillo is a government the caudillo runs. The army follows him and the countryside follows him; the ministries, the Asamblea and the whole case being made to Paris and London about civilisation against caudillo barbarism do not."
 gg_rivera_entre_orientales:0 "Among Uruguayans"
 gg_rivera_entre_orientales_desc:0 "End the war, give back what was confiscated, hold elections, and send home the foreign troops of both sides. The offer is affordable for everyone in the Republic except the government making it, because the foreign troops are what has been holding this line since 1843."
 gg_rivera_the_triumvirate:0 "The Triumvirate of 1853"
 gg_rivera_the_triumvirate_desc:0 "A three-man executive appointed by a colonel who has just forced out a president, to finish a term that is not his. Two of the three were abroad when they were named. It is a government made of names, and the names are enormous."
 gg_rivera_flores_alone:0 "Flores Governs Alone"
 gg_rivera_flores_alone_desc:0 "A clean chain of command, and the government of one faction of one party. The other half of the country did not read the peace that way, and will say so with weapons."
 gg_rivera_the_politics_of_fusion:0 "The Fusion Policy"
 gg_rivera_the_politics_of_fusion_desc:0 "Blancos and colorados in one cabinet: the only reading of ‘neither victors nor vanquished’ with any substance. The men who besieged this city for eight years now sit in its government, and the army that broke the siege is asked to shake their hands."
 gg_rivera_colorado_exclusivism:0 "The Party Is the Government"
 gg_rivera_colorado_exclusivism_desc:0 "The government is the party; the party is the army and the port; the countryside belongs to somebody else. Everything that the formula ‘neither victors nor vanquished’ was meant to prevent."
