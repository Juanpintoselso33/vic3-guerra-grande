l_english:
 # EN/ES: 24/9/2026 (AUD-VASSAL-RECOGNIZED) -- the peace's own subject types (common/subject_types/zz_gg_subject_types.txt)
 subject_type_gg_vassal_state:0 "@vassal! Vassal State"
 subject_type_gg_vassal_state_no_icon:0 "Vassal State"
 gg_vassal_state:0 "Vassal State"
 gg_vassal_state_desc:0 "A state that keeps its own government but answers to its overlord: it fights the overlord's wars and pays it part of its income."
 gg_vassal_state_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a vassal state of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 gg_vassal_state_action_name:0 "Vassal State"
 gg_vassal_state_action_propose_name:0 "Make into a Vassal State"
 gg_vassal_state_action_break_name:0 "Grant Independence"
 gg_vassal_state_action_notification_break_name:0 "Independence Granted"
 gg_vassal_state_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] have ended our vassalage. We are independent once again."
 subject_type_gg_client_state:0 "@puppet! Client State"
 subject_type_gg_client_state_no_icon:0 "Client State"
 gg_client_state:0 "Client State"
 gg_client_state_desc:0 "A republic apart, with its own flag and name, whose government answers to its patron: it fights the patron's wars and pays it part of its income."
 gg_client_state_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is a client state of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 gg_client_state_action_name:0 "Client State"
 gg_client_state_action_propose_name:0 "Make into a Client State"
 gg_client_state_action_break_name:0 "Grant Independence"
 gg_client_state_action_notification_break_name:0 "Independence Granted"
 gg_client_state_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] no longer hold us as their client. We are independent once again."
 subject_type_gg_cisplatine_province:0 "@puppet! Cisplatine Province"
 subject_type_gg_cisplatine_province_no_icon:0 "Cisplatine Province"
 gg_cisplatine_province:0 "Cisplatine Province"
 gg_cisplatine_province_desc:0 "A province of the Empire of Brazil, as the province of Montevideo was until the Convention of 1828 parted it: it fights the Empire's wars and pays it part of its income."
 gg_cisplatine_province_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] is the Cisplatine Province of [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
 gg_cisplatine_province_action_name:0 "Cisplatine Province"
 gg_cisplatine_province_action_propose_name:0 "Take in as the Cisplatine Province"
 gg_cisplatine_province_action_break_name:0 "Recognize Independence"
 gg_cisplatine_province_action_notification_break_name:0 "Independence Recognized"
 gg_cisplatine_province_action_notification_break_desc:0 "[INITIATOR_COUNTRY.GetName] recognizes our independence: we are no longer the Cisplatine Province."
 # EN/ES: 24/9 (Codex review) -- the notification keys the engine asks of every pact action (the Province of the
 #     Pact's are in gg_cisplatina_l_*.yml, hotfix 0.1.2) / las claves de notificacion que el motor pide a toda accion de pacto
 gg_vassal_state_action_notification_name:0 "Demand to become a Vassal State"
 gg_vassal_state_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we submit to them as a vassal state."
 gg_client_state_action_notification_name:0 "Demand to become a Client State"
 gg_client_state_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we answer to them as a client state."
 gg_cisplatine_province_action_notification_name:0 "Demand to become the Cisplatine Province"
 gg_cisplatine_province_action_notification_desc:0 "[INITIATOR_COUNTRY.GetName] demands that we become the Cisplatine Province of the Empire."
