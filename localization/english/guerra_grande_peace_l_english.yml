l_english:

# EN: The peace menu of the Guerra Grande. Every clause, decree, date and quotation below is
#     sourced in ~/dev/juegos/victoria3-uruguay/SOURCES_peace.md and in the comments of
#     events/guerra_grande_peace.txt. Nothing here is invented, and where the record is disputed
#     the text says so instead of picking a side.

# ---------------------------------------------------------------------------------------------
# gg_peace.1 -- the Defensa dictates the peace
# ---------------------------------------------------------------------------------------------

 gg_peace.1.t:0 "The Terms of the Defensa"
 gg_peace.1.desc:0 "The war is decided, and for the first time in nine years this government is the one writing the terms rather than waiting on somebody else's squadron to arrive.\n\nWhat comes next is not obvious. The formula being circulated from Río de Janeiro would end the war by refusing to name a winner — and it would cost this government the confiscations, the proscriptions and the war debt of the men on the hill. The decrees of February 1843 are still on the books and were never repealed. The Empire is offering treaties. Two ministers in ten years have asked London and Paris to take the Republic under protection. And there is the other bank of the river, where the man who paid for this war is still standing."
 gg_peace.1.flav:0 "Nine years inside a wall, and now a blank page."

 gg_peace.1.a:0 "Amnesty: no victors and no vanquished, and the State pays both sides' debts."
 gg_peace.1.b:0 "Punishment: carry out the decrees of February 1843."
 gg_peace.1.c:0 "Brazilian protectorate: sign the five treaties with the Empire."
 gg_peace.1.d:0 "European protectorate: ask London and Paris for it."
 gg_peace.1.e:0 "War on Rosas: pacify the Republic and cross the river."
 gg_peace_caseros_now_tt:0 "@battalions! Once the country is pacified, the Republic sends a division against Rosas: it crosses the river now and marches under #b Entre Ríos#!, in the war it is already fighting with Buenos Aires. The Republic does not enter that war as a belligerent, but the treasury pays for the campaign and the army gains a cause across the river."
 gg_peace_caseros_pledged_tt:0 "@battalions! Once the country is pacified, the Republic commits a division against Rosas. It stays under arms: it crosses the river the day a war against Buenos Aires opens on the other bank, and marches with whoever fights it. The treasury pays for the campaign all the same, whether or not that war comes, and the army gains a cause across the river."
 gg_peace.1.f:0 "No terms. Not yet."

 gg_peace_formula_tt:0 "@information! Amnesty gives every Uruguayan equal rights and access to public office, assumes the #blue_value Cerrito#!'s war debt and leaves Oribe unproscribed. The divisas are forbidden in favour of the national cockade."
 gg_peace_proscription_defensa_tt:0 "@warning! The #R Defensa#!'s February decrees reach the countryside: the #blue_value blanco chiefs#! are exiled, confiscations stand, and executions and expulsions spread radicalism through the rural districts."
 gg_peace_treaties_tt:0 "@warning! The Empire guarantees the Constitution and subsidises the Republic against its customs revenue; the San Ildefonso claim and navigation of the Laguna Merín and Yaguarón are surrendered. Brazilian trade gains ten years of exemptions, and fugitive slaves must be returned despite the Republic's abolition law."
 gg_peace_protectorate_asked_tt:0 "@information! London and Paris receive a request to place the Republic under their joint protection. Earlier petitions met refusal, so the answer is uncertain."

# ---------------------------------------------------------------------------------------------
# gg_peace.2 -- the Cerrito dictates the peace
# ---------------------------------------------------------------------------------------------

 gg_peace.2.t:0 "The Terms of the Cerrito"
 gg_peace.2.desc:0 "The gates are open. Nine years of sitting in front of a wall this army had no gun able to breach, and hunger did it in the end because no squadron came.\n\nThis government has claimed one thing since 1838 and never anything else: that it is the lawful government of the Republic, that its president's term was cut short by an armed rising, and that everything it has done out here — the Chambers, the courts, the customs house, the schools, the abolition of slavery — was done under the Constitution of 1830. It can now say so from the city. Or it can say something else. There is a letter from Buenos Aires, six years old, that has never been answered."
 gg_peace.2.flav:0 "Thirty-five guns and not one of them able to open a wall. Hunger opened it."

 gg_peace.2.a:0 "Amnesty: no victors and no vanquished, the clause of Oribe's own terms."
 gg_peace.2.b:0 "Presidency restored: every decree of the Defensa is void."
 gg_peace.2.c:0 "Punishment: death to the savage unitarians."
 gg_peace.2.d:0 "A Province of the Pact: the Banda Oriental rejoins the Confederation as a province, with its own government."
 gg_peace.2.e:0 "A Republic Apart: recognised and independent, but under Rosas's protection."
 gg_peace.2.f:0 "No terms. Not yet."

 gg_peace_oribe_pliego_tt:0 "@information! Oribe's full terms become law: no victors or vanquished, the #blue_value Cerrito#!'s acts and debts recognised, and his battalions kept under command until constitutional elections. The national cockade replaces both divisas."
 gg_peace_legal_presidency_tt:0 "@warning! Oribe's interrupted term resumes under the Constitution, without proscriptions, but every decree of the #R Defensa#! is void. Confiscated property is restored at the treasury's expense, and the foreign legions lose their patronage: their pay and privileges go, Garibaldi sails if he commands them, and the men who remain serve as ordinary troops."
 gg_peace_proscription_cerrito_tt:0 "@warning! The #blue_value Cerrito#! carries its cry against the unitarians into Montevideo: the #R colorado chiefs#! are exiled, their property confiscated and the foreign city emptied. The treasury gains the seizures; the Republic gains infamy and lasting unrest."
 gg_peace_confederation_tt:0 "@warning! The Banda Oriental rejoins the Confederation as a #b province of the Federal Pact#!, with its own government and the flag of the #b Treinta y Tres#!, and the settlement of 1828 is set aside. No surviving document proves that Oribe intended this answer to Rosas's proposal."
 gg_peace_rosista_client_tt:0 "@warning! Buenos Aires keeps financing and arming the Republic, but Rosas becomes its master abroad. The treasury is replenished at the price of subjection, infamy and hostility from Brazil."

# ---------------------------------------------------------------------------------------------
# gg_peace.3 / gg_peace.4 -- the answer from London and Paris
# ---------------------------------------------------------------------------------------------

 gg_peace.3.t:0 "A Protectorate Granted"
 gg_peace.3.desc:0 "The answer has come, and it is yes. France takes the Republic under protection, with Britain's acquiescence, and the subsidy that has been arriving by convention since June 1848 becomes an obligation instead of a favour.\n\nThe port will never be closed again, and the immigrants will keep coming. What has been signed away is harder to name than a province, because it is not written anywhere in the instrument: the Republic has asked a European power to stand over it, and it has been given what it asked for."
 gg_peace.3.flav:0 "It is what was asked for. That is the difficulty."
 gg_peace.3.a:0 "The flag stays. Everything under it is now negotiable elsewhere."

 gg_peace.4.t:0 "A Protectorate Refused"
 gg_peace.4.desc:0 "London says no, and this time it says it where everyone can hear.\n\nIt is the sixth refusal of the same request. Muñoz in 1838, asking for an arrangement like the Ionian Islands. Ellauri in 1841. Varela in London in 1843-44. And now this. The Republic has told the world it does not believe it can govern itself, and the world has declined to take it on. The proposal was in the papers before the answer was."
 gg_peace.4.flav:0 "The humiliation without the protection."
 gg_peace.4.a:0 "Then we do it alone, and everyone knows we did not want to."

# ---------------------------------------------------------------------------------------------
# Modifiers
# ---------------------------------------------------------------------------------------------

 gg_peace_legal_presidency:0 "The Legal Presidency Restored"
 gg_peace_legal_presidency_desc:0 "The term interrupted in 1838 resumes under the Constitution of 1830. The Chambers that were dissolved sit again, the Tribunal de Apelaciones installed on 12 May 1845 stands, and the administration that governed the countryside for nine years does not have to be invented — it simply moves into the city."

 gg_peace_colorados_proscribed:0 "Death to the Savage Unitarians"
 gg_peace_colorados_proscribed_desc:0 "The masthead of El Defensor de la Independencia Americana, put into effect. Of 31,000 people inside the walls, only some 11,000 were Uruguayans; the Legions were foreign, the merchant houses were foreign, and the presses belonged to the anti-Rosista émigrés. The port empties, and what made it worth taking departs with the people who made it."

 gg_peace_confederation_province:0 "Back into the Confederation"
 gg_peace_confederation_province_desc:0 "Rosas's proposal of 11 August 1845 accepted instead of buried in a parliamentary commission: the Republic returns to the Provinces of the Río de la Plata and the Preliminary Peace Convention of 1828 is annulled. The countryside that fought the war approves. The city, the emigration and every chancellery in the basin do not."

 gg_peace_rosista_client:0 "The Restaurador Keeps Paying"
 gg_peace_rosista_client_desc:0 "Buenos Aires goes on financing and arming the Republic as it financed and armed the siege — in the last weeks before the capitulation Rosas was still sending eight hundred gold ounces. The money is real and so is the price of it: the Republic is now what its enemies always said it was."

 gg_peace_blancos_proscribed:0 "The Decrees of February 1843"
 gg_peace_blancos_proscribed_desc:0 "Anyone found bearing arms or the enemy divisa is shot on the spot, from behind; those who dealt with the besiegers face military commissions; families are expelled, some to the isla Libertad; the confiscations stand. The decrees at last reach the countryside, which spent nine years beyond the lines and will remember them."

 gg_peace_treaties_of_1851:0 "The Five Treaties of 1851"
 gg_peace_treaties_of_1851_desc:0 "Alliance, aid, boundaries, commerce and extradition, signed in Río de Janeiro on 12 October 1851. The Empire guarantees the Constitution and may intervene to restore order; the subsidy is advanced monthly against customs revenue; the northern border is fixed at the Cuareim and the Republic is denied navigation from its shore of the Laguna Merín for fifty-eight years; tasajo enters free of duty for ten years and cattle pass northward free of duty for ten years; fugitive slaves are returned despite the Republic's own abolition law."

 gg_peace_anglo_french_protectorate:0 "Under European Protection"
 gg_peace_anglo_french_protectorate_desc:0 "Manuel Herrera y Obes's project of 1848, granted: the Republic under the protection of France, with Britain's acquiescence. The port cannot be closed, the immigrants keep landing and the subsidy is now owed rather than begged for. The army, which has spent nine years being told it was defending the independence of the Republic, has been told what that independence was worth."

 gg_peace_protectorate_refused:0 "Turned Down in Public"
 gg_peace_protectorate_refused_desc:0 "The sixth request of the same kind and the sixth refusal. The Republic asked a foreign power to govern it, the request was in the newspapers before the answer was, and the answer was no. Nothing has been gained and the asking cannot be unsaid."

 gg_peace_march_on_buenos_aires:0 "And Then Across the River"
 gg_peace_march_on_buenos_aires_desc:0 "Once the national territory is pacified, military action against Rosas begins — Herrera y Obes wrote exactly that to the British and French chargés in September 1851. The Republic puts a division at the service of the war against Rosas, across the river. The army has never stood higher and the treasury has never been emptier."

 gg_peace_national_cockade:0 "The National Cockade"
 gg_peace_national_cockade_desc:0 "The divisas colorada and blanca are forbidden and the national cockade declared the only badge a citizen may wear, so that the opinions and emblems dividing the sons of Uruguay may disappear. The Villa de la Restauración becomes the Villa de la Unión. Both parties lose something to which they were attached, and the State gains an authority it never possessed."

 gg_peace_assumed_war_debt:0 "Their Debt Is Now the Nation’s"
 gg_peace_assumed_war_debt_desc:0 "The Republic shall recognise as a national debt that which general Oribe contracted, in accordance with what public law establishes for such cases. It is the third article of the pact, and it is what the formula actually cost: the government that won pays for the war the other one fought."

# T1 (FX-1)
 gg_peace.5.t:0 "Victory Without a Table"
 gg_peace.5.desc:0 "There were no terms and no plenipotentiaries. The other government no longer exists: its departments, its barracks and its debts are ours, and its chiefs wait to learn what will be done with them. What is decided now is what the Republic will remember of this war."
 gg_peace.5.desc_third_party:0 "We did not end the war. A foreign power swallowed the other government and left us the whole Republic by default. Nobody signed anything with us, but the other side's chiefs are still here, and we must decide what to do with them."
 gg_peace.5.desc_timeout:0 "Twenty years of war and nobody won it. Both governments still stand, but there is no one left to fight: the war burned itself out. What remains is to decide how to live with those who stood across the line."
 gg_peace.5.flav:0 "Nobody sat down to negotiate."
 gg_peace.5.a:0 "Clemency. Let them go home."
 gg_peace.5.b:0 "The chiefs leave the country."
 gg_peace.5.c:0 "Let the countryside learn its lesson."
 gg_peace.5.d:0 "Hand the defeated chief to his foreign ally."
 gg_victory_proscription:0 "Defeated Chiefs Proscribed"
 gg_victory_terror:0 "Terror in the Countryside"
 gg_victory_chief_handed_over:0 "The Defeated Chief Handed Over"
 gg_peace.11.t:0 "The City Cannot Hold"
 gg_peace.11.d:0 "For three months the government has lived on what is left. The troops are paid late or not at all, the ration has been cut again, and in the foreign corps there is more talk of taking ship than of fighting.\n\nThe Cerrito knows it, and so does the arbiter: while this lasts, it is the other side that dictates terms. To ask for them now is to accept that they draw up the treaty, with everything that means for this government, for the men who committed themselves, and for whatever is left of the Republic.\n\nFighting on is a decision, not inertia. It costs support at home — there are men who wanted an end to this already — and it guarantees nothing, but it takes the table away from the enemy for a year, and in a year things happen: a squadron, an alliance, a pronunciamiento on the far bank."
 gg_peace.11.f:0 "‘Asking for terms’ and ‘surrendering’ are spelt differently."
 gg_peace.11.a:0 "Ask for terms. Let them draft the treaty."
 gg_peace.11.b:0 "Fight on. Not yet."
 gg_peace.12.t:0 "The Camp Empties"
 gg_peace.12.d:0 "For three months the government has lived on what is left. The divisions come apart through desertion rather than battle, the horses are thin, and the department commanders answer later and later.\n\nThe Defensa knows it, and so does the arbiter: while this lasts, it is the other side that dictates terms. To ask for them now is to accept that they draw up the treaty, with everything that means for this government, for the men who committed themselves, and for whatever is left of the Republic.\n\nFighting on is a decision, not inertia. It costs support at home — there are men who wanted an end to this already — and it guarantees nothing, but it takes the table away from the enemy for a year, and in a year things happen: a squadron, an alliance, a pronunciamiento on the far bank."
 gg_peace.12.f:0 "‘Asking for terms’ and ‘surrendering’ are spelt differently."
 gg_peace.12.a:0 "Ask for terms. Let them draft the treaty."
 gg_peace.12.b:0 "Fight on. Not yet."
 gg_peace.13.t:0 "The Client Without a Patron"
 gg_peace.13.d:0 "Rosas has fallen, and the man who now governs the Confederation is #b Urquiza#!. The account the Restaurador opened with the Republic — the money, the arms, the direction from abroad — closes with him: the new government has chosen not to keep it.\n\nTo let it go, it need invent nothing. In the Preliminary Convention of 1828 the government of the United Provinces agreed \"to declare for its part the independence\" of the Province of Montevideo, \"and that it be constituted a free and independent State\". Rosas had forgotten it; in Paraná they prefer to remember.\n\nThe Republic conducts its foreign relations again. What Buenos Aires paid stops arriving, and what was said of the Republic while it collected will not be erased so quickly."
 gg_peace.13.f:0 "\"A free and independent State.\" Preliminary Convention of Peace, 27 August 1828, article 2."
 gg_peace.13.a:0 "Foreign relations return to Montevideo."
 gg_peace.13.a_tt:0 "@information! The Republic ceases to be a subject of Buenos Aires and conducts its own foreign relations. #N The Restaurador Keeps Paying#! ends: the money and arms from Buenos Aires stop coming, and so does the subjection they cost."
 gg_peace.15.t:0 "The Protection Remains"
 gg_peace.15.d:0 "Rosas has fallen, but the note from Paraná does not bring the independence Urquiza signed for in 1851, \"to maintain\" that of this Republic. The new government keeps what the old one had gained: the Republic's foreign relations are still conducted from the other bank.\n\nIn Rio de Janeiro the same note was read, and the Treaty of 1828 was taken out: by it the United Provinces bound themselves to declare the independence of the Province of Montevideo and to defend it. The Empire has already told Paraná what it thinks of this.\n\nNothing changes here overnight. What has changed is who rules on the other side, and what Brazil thinks of him."
 gg_peace.15.f:0 "\"Both High Contracting Parties bind themselves to defend the independence and integrity of the Province of Montevideo.\" Preliminary Convention of Peace, 1828, article 3."
 gg_peace.15.a:0 "It is noted."
 gg_peace.15.a_tt:0 "@information! The Republic remains a subject of Buenos Aires, now under Urquiza's government."
 gg_peace_ask_terms_tt:0 "@warning! The other government draws up the peace terms, and with them the fate of this one."
 gg_peace_fight_on_tt:0 "@battalions! The war goes on, with some unrest, and for a year no one brings the parties to the table again."
