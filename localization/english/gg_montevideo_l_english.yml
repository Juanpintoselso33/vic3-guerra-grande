l_english:
 gg_montevideo_port_city:0 "The Port-City"
 gg_montevideo_port_city_desc:0 "Montevideo lives off its bay: the customs house, the warehouses and the ships that call there make it the gateway of the whole Banda Oriental."
 gg_war_montevideo_refuge:0 "The New Troy"
 gg_war_montevideo_refuge_desc:0 "Behind the walls crowd the people of the outskirts, the families come down from the countryside and those who land every week: French, Italians, Spaniards and Basques. The census of 1843 counted 31,189 souls in the plaza; 5,324 were French and 4,205 Italian. While the sea stays open, the besieged city never stops filling."
 gg_war_countryside_ravaged:0 "The Ravaged Countryside"
 gg_war_countryside_ravaged_desc:0 "The levies take the men, the divisions slaughter the herds and drive the cattle to the frontier, and the families seek shelter in Brazil, in Entre Ríos or behind the walls. In January 1843 the districts of the Río Negro were ordered emptied: some ten thousand souls marched in carts behind the army."
 gg_mvd_french_legion_men_tt:0 "Enlisted in #b Montevideo#!: #P +3,600#! #b French#! soldiers and #P +750#! #b Basque#! soldiers of Brie de Laustan's battalion."
 gg_mvd_french_legion_refused_men_tt:0 "They stay in #b Montevideo#! at their trades: #P +3,600#! #b French#! and #P +750#! #b Basque#! labourers."
 gg_mvd_french_legion_reinforcement_tt:0 "New recruits in #b Montevideo#!: #P +150#! #b French#! soldiers."
 gg_mvd_italian_legion_men_tt:0 "Enlisted in #b Montevideo#!: #P +750#! #b Italian#! soldiers."
 gg_mvd_italian_legion_reinforcement_tt:0 "New recruits in #b Montevideo#!: #P +300#! #b Italian#! soldiers."
 gg_mvd_argentine_emigres_tt:0 "They settle in #b Montevideo#!: #P +3,800#! #b Argentine#! emigrés, men of the pen, the office and the epaulette."
 gg_mvd_european_ships_tt:0 "Landed in #b Montevideo#!: #P +1,000#! #b Italian#! labourers."
 gg_mvd_spaniards_enrolled_tt:0 "Landed in #b Montevideo#!: #P +3,400#! #b Spanish#! labourers and #P +1,700#! Spaniards enrolled in the Guardia Nacional."
 gg_mvd_spaniards_foreigners_tt:0 "Landed in #b Montevideo#!: #P +5,100#! #b Spanish#! labourers, none of them under arms."
 gg_immigration.1.t:0 "The Proscribed"
 gg_immigration.1.d:0 "Echagüe has crossed the Uruguay with the army of Entre Ríos, and those fleeing Rosas keep landing at the port. They are the men of Lavalle's liberating legion, the men serving in General Rivera's army of operations, the men who wrote against the Restorer until they had no press left in Buenos Aires. They bring their families, their papers and their quarrels.\n\nThis September a group of them comes before the government and offers to raise a legion for the service of the city. Many already hold a desk in the ministries, a column in the newspapers or a rank among the officers; without them the plaza would have no one to write its dispatches or to command a company.\n\nBuenos Aires does not forget it. Since the Correa Morales mission of 1836, minister Arana's instructions have demanded measures against «los Unitarios o pérfidos Federales que han emigrado», and every proscript who settles in Montevideo is one more grievance in the Restorer's ledger."
 gg_immigration.1.f:0 "They bring their families, their papers and their quarrels."
 gg_immigration.1.a:0 "Montevideo is the asylum of free men."
 gg_immigration.1.b:0 "Let them sail on."
 gg_immigration.1.b_tt:0 "The emigrés #N do not settle#! in #b Montevideo#!."
 gg_immigration.2.t:0 "The Colonists' Ships"
 gg_immigration.2.d:0 "Since 1835 more than thirty-three thousand Europeans have landed at this port, in a State that did not reach 128,371 inhabitants that year. They are French, Italians, Canarians, Basques from both banks of the Bidasoa, Catalans; artisans, shopkeepers, merchants and day labourers who fill the new town and the port.\n\nThis May the Ministry of War and Navy authorised the Basque-Navarrese battalion of Los Aguerridos, under colonel José Guerra, a veteran of the Carlist wars. The house of Genaro Rivas brings the colonists from the Peninsula and the State pays their passage; in exchange, the contingents are placed at the government's disposal to serve in the corps, clothed, fed and paid until the end of the war.\n\nThe Spaniards have no consul to claim them: the Kingdom has not yet sent a representative to the Republic. Nothing prevents entering the islanders and the peninsulars in the companies of the Guardia Nacional as if they were citizens, and the plaza needs every man. They will say, on the day someone arrives to defend them, that they came here to work."
 gg_immigration.2.f:0 "Artisans, shopkeepers, merchants and day labourers."
 gg_immigration.2.a:0 "Into the Guardia Nacional, like any other neighbour."
 gg_immigration.2.b:0 "They are foreigners: let them work at their trades."
