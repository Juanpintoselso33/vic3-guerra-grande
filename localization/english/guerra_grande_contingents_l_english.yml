l_english:

# EN: Foreign contingents of the Guerra Grande. Figures and quotations are sourced in
#     SOURCES.md and in the comments of events/guerra_grande_contingents.txt.

 gg_contingent.1.t: "The Argentine Legion"
 gg_contingent.1.d: "The proscripts of Rosas have been arriving in Montevideo for years: by the census of 1843 there are 2,553 Argentines in the city. Now they ask to serve as a corps of their own, under their own colours, against the tyrant they fled. General José María Paz, who will be named Jefe de Armas of the plaza, is blunt about what the garrison is: militias, volunteers, national guards. 'Esto no es, ni puede ser egército.'"
 gg_contingent.1.f: "They bring their own quarrel into ours."
 gg_contingent.1.a: "Let them form their legion."
 gg_contingent.1.b: "The Republic fights its own war."
 gg_contingent.3.t: "The Basques Go Over to the Cerrito"
 gg_contingent.3.d: "The Basque-Navarrese battalion 'Los Aguerridos' was raised in May 1842 through the shipping house that brought the men over: their passage in exchange for their service. It was never the Republic they owed. In February 1843, with Oribe's army closing on the city, the contingent walks out of the lines and into the camp at the Cerrito, where it is merged into Oribe's Batallón de Voluntarios."
 gg_contingent.3.f: "Men who were sold a passage, not a cause."
 gg_contingent.3.a: "Close the gap in the line."
 gg_contingent.4.t: "The French Legion"
 gg_contingent.4.d: "There are 5,324 French in Montevideo, more than a sixth of the city. On 7 April 1843 Jean-Chrysostome Thiébaut -- old soldier of Napoleon, butcher and book-keeper in the Plata -- calls them to the Teatro Nacional and two companies are formed on the spot. The corps will be the strongest battalion of the garrison, more than 3,000 men at its height. When Paris demands that it disarm, the legionaries renounce their French citizenship instead and take the oriental flag."
 gg_contingent.4.f: "Eleven men stepped forward to go home. The rest stayed."
 gg_contingent.4.a: "Arm them and put them on the wall."
 gg_contingent.4.b: "Paris would rather they went home."
 gg_contingent.5.t: "The Italian Legion"
 gg_contingent.5.d: "Giuseppe Garibaldi writes to the Ministry of War on 9 April 1843. The terms his countrymen ask for are those of an urban militia: the same pay and rations as the French, service on the defensive line, and no obligation to leave the jurisdiction of the city. They will break that last clause themselves, again and again -- at Tres Cruces, on the rivers, and at San Antonio del Salto, where fewer than three hundred of them hold off a force four times their size."
 gg_contingent.5.f: "Red shirts, bought cheap because no saladero wanted them."
 gg_contingent.5.a: "Let Garibaldi have his legion."
 gg_contingent.6.t: "The Basque Chasseurs"
 gg_contingent.6.d: "The Basque companies of the French Legion split away in April 1845, over regional pride and an accusation of embezzlement against Thiébaut. Jean Baptiste Brie takes them into a regiment of their own, between four and six hundred men. By 1845 a third of them are Galicians, Catalans and Portuguese: the legions are foreign in name and mixed in fact."
 gg_contingent.6.f: "A legion is whoever will stand in it."
 gg_contingent.6.a: "Give Brie his regiment."
 gg_contingent.7.t: "The Army of the Vanguard"
 gg_contingent.7.d: "Rosas does not declare war on the Republic. He does not have to: he recognises Oribe as its lawful constitutional president, and lends the lawful president an army. The Batallón Libertad, the Independencia, the Patricios nº 3, the Lanceros and Dragones of Buenos Aires and a flying battery cross the river under Oribe's command -- close to seven thousand men, an Argentine army intervening in Uruguay on behalf of Uruguay."
 gg_contingent.7.f: "Not an invasion. An intervention, on paper."
 gg_contingent.7.a: "Take the battalions and march."
 gg_contingent.8.t: "Caxias Crosses the Frontier"
 gg_contingent.8.d: "For nine years the Empire held to its neutrality and paid for the Defensa in secret, through Mauá's loans. On 4 September 1851 the Conde de Caxias crosses at Santana with 16,200 men in four divisions -- 6,500 infantry, 8,900 horse, 800 gunners, twenty-six guns. Oribe will capitulate on 8 October without a battle. The bill arrives four days later, in five treaties: an alliance, an extradition, a border, a commercial treaty, and a subsidy of 60,000 patacones a month secured on the customs of the Republic. It is the border treaty that will be remembered. Article 1 renounces the reserve of San Ildefonso -- the title on which the Republic had claimed as far as the Ibicui -- and article 3 leaves it a dry coast: the whole surface of the Laguna Merin and the course of the Yaguaron become Brazilian, and will stay Brazilian for fifty-eight years."
 gg_contingent.8.f: "The siege is lifted. The mortgage is signed."
 gg_contingent.8.a: "Sign. The city has held nine years and cannot hold ten."
 gg_contingent.8.b: "No treaties. The Republic owes nobody."
 gg_contingent_paz_will_come: "And when the line has to be held, the emigres will have a general to hold it with: José María Paz."
 gg_contingent_no_basque_chasseurs: "There will be no Cazadores Vascos in 1845: those were companies of this legion, and without it there is nothing for them to split from."
 gg_contingent_capitulation_follows: "Oribe capitulates at the Pantanoso within the month, without a battle."
 gg_contingent_claim_stands: "Unsigned, the limits treaty extinguishes nothing: the claim on the Laguna Merín and the Campos Neutrales stands."
 gg_contingent_no_capitulation: "And there is no capitulation. The siege goes on, and the peace will have to be found some other way."
