l_english:

# EN: Foreign contingents of the Guerra Grande. Figures and quotations are sourced in
#     SOURCES.md and in the comments of events/guerra_grande_contingents.txt.

 gg_contingent.1.t: "The Argentine Legion"
 gg_contingent.1.d:0 "Rosas's exiles have been arriving in Montevideo for years: the census of 1843 counts 2,553 Argentines in the city, among them the men who lost with Lavalle and the men who wrote against the Restorer until no press was left to them on the far bank. Now they ask to serve as a corps of their own, under their own colours, against the tyrant they fled.\n\nThe legion is not new: it was first raised in September 1839, fell apart and was re-formed more than once, according to which defeat arrived from Argentina. What is decided today is whether the Republic again gives an official name to a body of troops fighting its own war inside ours, one that will last until it is dissolved in April 1846.\n\nGeneral Jose Maria Paz, who will be made chief of arms of the place, has no illusions about what this garrison is: militias, volunteers, national guards and libertos with three months' drill. «This is not, and cannot be, an army.»"
 gg_contingent.1.f: "They bring their own quarrel into ours."
 gg_contingent.1.a: "Let them form their legion."
 gg_contingent.1.b: "The Republic fights its own war."
 gg_contingent.3.t: "The Basques Go Over to the Cerrito"
 gg_contingent.3.d:0 "The Basque-Navarrese battalion «Los Aguerridos» was raised in May 1842 through the shipping house that brought the men over: passage in exchange for service. It was never the Republic they owed, and everyone on the line knew it.\n\nIn February 1843, with Oribe's army upon the city, the contingent walks off the line and into the camp at the Cerrito. There it is folded into Oribe's Batallon de Voluntarios, under Ramon de Artagaveytia, which with other Spanish enlistments reaches six or seven hundred men: a foreign legion on the far side of the ditch, made of the men the city had bought.\n\nWhat leaves is more than a battalion. What leaves is the proof that Montevideo's foreign neighbourhoods can choose a side, and that the money which brought them buys no loyalty. The gap in the line has to be filled today, with whatever there is."
 gg_contingent.3.f: "Men who were sold a passage, not a cause."
 gg_contingent.3.a: "Close the gap in the line."
 gg_contingent.4.t: "The French Legion"
 gg_contingent.4.d:0 "There are 5,324 Frenchmen in Montevideo, more than a sixth of the city. On 7 April 1843 Jean-Chrysostome Thiebaut -- from Marseille, an old soldier of Napoleon, since then a butcher and a bookkeeper on the Plate -- calls them to the Teatro Nacional, and two companies are formed on the spot. «Without ridiculous distinctions of class or position», the Patriote Francais demands.\n\nThe corps will be the strongest battalion of the garrison: more than three thousand men at its height, close to half of the six thousand five hundred the city has under arms. Inside it, from the first day, is a Basque battalion of its own under Juan Bautista Brie de Laustan, oscillating between four and six hundred militiamen.\n\nConsul Theodore Pichon has express instructions from Paris: France is neutral, the legionaries are to be discharged, the French colours are not to be flown, and there is money for whoever abstains from enlisting. The city's answer comes in April 1844, when the volunteers renounce their French citizenship and call themselves the 2nd Legion of the National Guard. They are the same men on the same wall."
 gg_contingent.4.f: "Eleven men stepped forward to go home. The rest stayed."
 gg_contingent.4.a: "Arm them and put them on the wall."
 gg_contingent.4.b: "Paris would rather they went home."
 gg_contingent.5.t: "The Italian Legion"
 gg_contingent.5.d:0 "Giuseppe Garibaldi writes to the Ministry of War and Navy on 9 April 1843. What his countrymen ask for are the terms of an urban militia: the same pay and ration as the French, service on the line of defence, and no obligation to leave the city's jurisdiction. The decree comes out that same day, on one condition: that they muster at least a hundred men.\n\nThey muster more, but they will never be many. At their best they are some seven hundred, and by December 1850 a little over three hundred are left, half of them Canarians and Spaniards. The red shirts are bought cheap because no saladero wants them, and with that the legion Europe will look at twenty years later is dressed.\n\nThe clause about not leaving the city they break themselves, again and again: at Tres Cruces, on the rivers, and above all at San Antonio del Salto, where fewer than three hundred hold off a force four times their size. It is the only body of troops in the place that serves as infantry and as seamen at once."
 gg_contingent.5.f: "Red shirts, bought cheap because no saladero wanted them."
 gg_contingent.5.a: "Let Garibaldi have his legion."
 gg_contingent.6.t: "The Basque Chasseurs"
 gg_contingent.6.d:0 "The Basque companies of the French Legion split off in April 1845, over regional pride and an embezzlement charge against Thiebaut. Jean Baptiste Brie takes them into a regiment of their own, the Cazadores Vascos, four to six hundred men strong.\n\nBy 1845 a third of those men are not Basque at all: there are Galicians, Catalans and Portuguese among them. The legions are foreign in name and mixed in fact, and the same is true on the far side, where Oribe's battalion musters Basques, Canarians and Orientals under one flag.\n\nThe regiment will last to the end of the war. In November 1849 the Uruguayan envoy in Paris counts six hundred and thirteen Basque hunters in the ranks and nine hundred and ninety women and children eating from the ration: the place does not keep soldiers, it keeps whole families."
 gg_contingent.6.f: "A legion is whoever will stand in it."
 gg_contingent.6.a: "Give Brie his regiment."
 gg_contingent.7.t: "The Army of the Vanguard"
 gg_contingent.7.d:0 "Rosas does not declare war on the Republic. He has no need to: he recognises Oribe as its lawful constitutional president, and to a lawful president one lends an army.\n\nThe Batallon Libertad, the Independencia, the Patricios no. 3, the Lancers and Dragoons of Buenos Aires and a flying battery cross the river under Oribe: close to seven thousand men. On the other side of the wall the Montevidean press will print the roll of the battalions camped opposite to prove the besieging army is «almost exclusively Argentine», and the roll half proves it: there are Entrerrianos, Correntinos, Canarians and Orientals on the same line.\n\nOn paper this is not an invasion: it is an intervention requested by the lawful government. It is the same device the powers will use two years later to put their squadrons on the river, and neither side will be able to attack the argument without attacking its own."
 gg_contingent.7.f: "Not an invasion. An intervention, on paper."
 gg_contingent.7.a: "Take the battalions and march."
 gg_contingent.8.t: "Caxias Crosses the Frontier"
 gg_contingent.8.d:0 "For nine years the Empire held to its neutrality and paid the Defensa in secret, through Maua's loans. On 4 September 1851 the Count of Caxias crosses at Santana with 16,200 men in four divisions: 6,500 foot, 8,900 horse, 800 gunners, twenty-six guns.\n\nOribe will capitulate on 8 October without giving battle, with eleven thousand men still under arms. The bill arrives four days later, in five treaties: alliance, extradition, boundaries, commerce, and a subsidy of 60,000 patacones a month secured on the Republic's customs house.\n\nThe boundary treaty is the one that will be remembered. Article 1 renounces the reservation of San Ildefonso -- the title on which the Republic claimed as far as the Ibicui -- and article 3 leaves it landlocked on that side: the whole sheet of the Merin lagoon and the course of the Yaguaron become Brazilian, and will stay so for fifty-eight years."
 gg_contingent.8.f: "The siege is lifted. The mortgage is signed."
 gg_contingent.8.a: "Sign. The city has held nine years and cannot hold ten."
 gg_contingent.8.b: "No treaties. The Republic owes nobody."
 gg_contingent_paz_will_come: "And when the line has to be held, the emigres will have a general to hold it with: José María Paz."
 gg_contingent_no_basque_chasseurs: "There will be no Cazadores Vascos in 1845: those were companies of this legion, and without it there is nothing for them to split from."
 gg_contingent_capitulation_follows: "Oribe capitulates at the Pantanoso within the month, without a battle."
 gg_contingent_claim_stands: "Unsigned, the limits treaty extinguishes nothing: the claim on the Laguna Merín and the Campos Neutrales stands."
 gg_contingent_no_capitulation: "And there is no capitulation. The siege goes on, and the peace will have to be found some other way."
