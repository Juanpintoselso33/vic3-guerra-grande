# EN: Foreign contingents of the Guerra Grande. Figures and quotations are sourced in
#     SOURCES.md and in the comments of events/guerra_grande_contingents.txt.

 gg_contingent.1.t: "The Argentine Legion"
 gg_contingent.1.d:0 "Rosas's exiles have been arriving in Montevideo for years: the census of 1843 counts 2,553 Argentines in the city, among them the men defeated with Lavalle and the writers who opposed the Restorer until no press on the far bank remained open to them. Now they ask to serve as a corps of their own, under their own colours, against the tyrant from whom they fled.\n\nThe legion is not new: it was first raised in September 1839, fell apart and was re-formed more than once as fresh defeats drove men out of Argentina. The question today is whether the Republic will once more give official standing to a body of troops fighting its own war within ours, one that will last until its dissolution in April 1846.\n\nGeneral José María Paz, soon to become commandant of the garrison, has no illusions about the force before him: militia, volunteers, national guards and freedmen with three months' drill. ‘This is not, and cannot be, an army.’"
 gg_contingent.1.f: "They bring their own quarrel into ours."
 gg_contingent.1.a: "Let them form their legion."
 gg_contingent.1.b: "The Republic fights its own war."
 gg_contingent.3.t: "The Basques Go Over to the Cerrito"
 gg_contingent.3.d:0 "The Basque-Navarrese battalion ‘Los Aguerridos’ was raised in May 1842 through the shipping house that brought the men over: passage in exchange for service. Their debt was never to the Republic, and everyone on the line knew it.\n\nIn February 1843, with Oribe's army bearing down upon the city, the contingent abandons the line and crosses to the camp at the Cerrito. There it is incorporated into Oribe's Batallón de Voluntarios, under Ramón de Artagaveytia; with other Spanish recruits, the battalion numbers six or seven hundred men — a foreign legion on the far side of the ditch, made from soldiers the city had paid to bring over.\n\nMore than a battalion has departed. Its desertion proves that Montevideo's foreign communities can choose a side, and that the money which brought them buys no loyalty. The breach in the line must be filled today, with whatever men can be found."
 gg_contingent.3.f: "Men who were sold a passage, not a cause."
 gg_contingent.3.a: "Close the gap in the line."
 gg_contingent.4.t: "The French Legion"
 gg_contingent.4.d:0 "There are 5,324 Frenchmen in Montevideo, more than a sixth of the city's population. In April 1843 Jean-Chrysostome Thiébaut — a Marseillais, veteran of Napoleon's armies, later a butcher and bookkeeper in the Plata — summons them to the Teatro Nacional, where two companies are formed on the spot. ‘Without ridiculous distinctions of class or position,’ demands Le Patriote Français.\n\nThe corps will become the strongest battalion in the garrison: more than three thousand men at its height, nearly half of the six thousand five hundred whom the city has under arms. From the first day it includes a separate Basque battalion under Juan Bautista Brie de Laustan, varying between four and six hundred militiamen.\n\nConsul Théodore Pichon has express instructions from Paris: France is neutral, the legionaries must be discharged, the French colours must not be flown, and money is available to men who refrain from enlisting. The city's answer comes in April 1844, when the volunteers renounce their French citizenship and take the name 2nd Legion of the National Guard. They remain the same men upon the same wall."
 gg_contingent.4.f: "Eleven men stepped forward to go home. The rest stayed."
 gg_contingent.4.a: "Arm them and put them on the wall."
 gg_contingent.4.b: "Paris would rather they went home."
 gg_contingent.5.t: "The Italian Legion"
 gg_contingent.5.d:0 "Giuseppe Garibaldi writes to the Ministry of War and Navy in April 1843. His countrymen ask for the terms of an urban militia: the same pay and rations as the French, service on the defensive line, and no obligation to leave the city's jurisdiction. The decree is issued that same day, upon one condition: that they muster at least a hundred men.\n\nThey muster more, though they will never be numerous. At their height they are some seven hundred; by December 1850, little more than three hundred remain, half of them Canarians and Spaniards. The red shirts are bought cheaply because no saladero wants them, and they become the uniform of the legion that Europe will remember twenty years later.\n\nThey themselves break the clause keeping them within the city, time and again: at Tres Cruces, upon the rivers and, above all, at San Antonio del Salto, where fewer than three hundred hold off a force four times their size. It is the only corps in the garrison to serve both as infantry and as sailors."
 gg_contingent.5.f: "Red shirts, bought cheap because no saladero wanted them."
 gg_contingent.5.a: "Let Garibaldi have his legion."
 gg_contingent.6.t: "The Basque Chasseurs"
 gg_contingent.6.d:0 "The Basque companies of the French Legion split away in April 1845, over regional pride and an accusation that Thiébaut had embezzled funds. Jean Baptiste Brie forms them into a regiment of their own, the Cazadores Vascos, between four and six hundred men strong.\n\nBy 1845 a third of those men are not Basque at all: Galicians, Catalans and Portuguese serve among them. The legions are foreign in name and mixed in fact; the same is true beyond the siege lines, where Oribe's battalion musters Basques, Canarians and Uruguayans beneath one flag.\n\nThe regiment will last until the end of the war. In November 1849 the Uruguayan envoy in Paris counts six hundred and thirteen Cazadores Vascos in the ranks and nine hundred and ninety women and children drawing rations: the city is not maintaining soldiers alone, but entire families."
 gg_contingent.6.f: "A legion is whoever will stand in it."
 gg_contingent.6.a: "Give Brie his regiment."
 gg_contingent.7.t: "The Army of the Vanguard"
 gg_contingent.7.d:0 "Rosas does not declare war on the Republic. He has no need: he recognises Oribe as its lawful constitutional president, and a lawful president may be lent an army.\n\nThe Batallón Libertad, the Independencia, the Patricios no. 3, the Lancers and Dragoons of Buenos Aires and a flying battery cross the river under Oribe: nearly seven thousand men. Beyond the walls, the Montevideo press will print the roll of the battalions camped opposite to prove that the besieging army is ‘almost exclusively Argentine’. The roll half proves its case: men from Entre Ríos and Corrientes, Canarians and Uruguayans all serve in the same line.\n\nOn paper this is no invasion, but an intervention requested by the lawful government. The powers will employ the same device two years later to send their squadrons into the river, and neither side will be able to condemn the argument without condemning its own."
 gg_contingent.7.f: "Not an invasion. An intervention, on paper."
 gg_contingent.7.a: "Take the battalions and march."
 gg_contingent.8.t: "Caxias Crosses the Frontier"
 gg_contingent.8.d:0 "For nine years the Empire maintained its neutrality while secretly financing the Defensa through Mauá's loans. In September 1851 the Count of Caxias crosses at Santana with 16,200 men in four divisions: 6,500 infantry, 8,900 cavalry, 800 gunners and twenty-six guns.\n\nOribe still has eleven thousand men under arms, and no one left to pay them. The bill for the alliance arrives in five treaties: alliance, extradition, boundaries, commerce, and a subsidy of 60,000 patacones a month secured upon the Republic's customs revenue.\n\nThe boundary treaty is the one that will be remembered. Article 1 renounces the reservation of San Ildefonso — the title under which the Republic claimed as far as the Ibicuí — and article 3 leaves it with a dry shore: the waters of the Laguna Merín and the course of the Yaguarón become Brazilian, and will remain so for fifty-eight years."
 gg_contingent.8.f: "The siege is lifted. The mortgage is signed."
 gg_contingent.8.a: "Sign. The city has held nine years and cannot hold ten."
 gg_contingent.8.b: "No treaties. The Republic owes nobody."
 gg_contingent_paz_will_come: "The émigrés rally around #b José María Paz#!, a general capable of holding their line."
 gg_contingent_no_basque_chasseurs: "Without the French Legion, the Basque companies have no corps from which to form their own ranks."
 gg_contingent_capitulation_follows: "@warning! Oribe is left without the means to hold the Pantanoso."
 gg_contingent_claim_stands: "Unsigned, the limits treaty extinguishes nothing: the claim on the Laguna Merín and the Campos Neutrales stands."
 gg_contingent_no_capitulation: "And there is no capitulation. The siege goes on, and the peace will have to be found some other way."
