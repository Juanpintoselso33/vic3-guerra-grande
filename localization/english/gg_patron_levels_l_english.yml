l_english:
 gg_tt_patron_francia_now_2:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now the Defensa's #b Guarantor#!: she pays it every month (unless her subsidy has been renounced), backs its war, and when the river is closed her patience runs even without London."
 gg_tt_patron_francia_now_1:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now the Defensa's #b Protector#!: she pays it every month (unless her subsidy has been renounced), backs its war, and when the river is closed her patience runs only if London stands with her. Alone she does not intervene."
 gg_tt_patron_francia_now_0:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now a #b Spectator#!: she does not pay the Defensa, does not back its war, and a closed river does not try her patience."
 gg_tt_patron_francia_now:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France backs the Defensa according to her standing."
 gg_tt_patron_britania_now_2:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now a #b Guarantor#!: she is fully committed: her squadron in the Plata, her word on the river, or a commitment of #V 60#! or more. She backs the Defensa's war, though she does not pay it, and when the river is closed her patience runs alongside that of Paris."
 gg_tt_patron_britania_now_1:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now the Defensa's #b Protector#!: she backs its war, though she does not pay it, and when the river is closed her patience runs alongside that of Paris. London never acts without Paris."
 gg_tt_patron_britania_now_0:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now a #b Spectator#!: she does not back the Defensa's war, and a closed river does not try her patience."
 gg_tt_patron_britania_now:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain backs the Defensa according to her standing."
 gg_tt_patron_brasil_now_2:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now the Defensa's #b Guarantor#!, bound by its word, by treaty or by a commitment of #V 60#! or more: it pays every month and backs its war."
 gg_tt_patron_brasil_now_1:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now the Defensa's #b Protector#!: it pays every month and backs its war."
 gg_tt_patron_brasil_now_0:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now a #b Spectator#!: it neither pays the Defensa nor backs its war. Before 1850 it looks on from outside."
 gg_tt_patron_brasil_now:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire backs the Defensa according to its standing."
 gg_tt_patron_rosas_now:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses war support every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_urquiza_now:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_patron_france_out_tt:0 "@warning! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Without the subsidy, France becomes a #b Spectator#!: she stops paying, stops backing the Defensa's war and no longer counts for the river."
 gg_patron.a:0 "Let it be known along the line."
 gg_patron.1.t_2:0 "France Stands Guarantor"
 gg_patron.1.t_1:0 "France Stands Protector"
 gg_patron.1.t_0:0 "France Stands Aside"
 gg_patron.1.d_2:0 "Paris no longer confines herself to notes and money: she has bound herself to the fate of Montevideo. France pays the Defensa every month (unless her subsidy has been renounced) and backs its war; should Rosas close the river, her patience runs even without London, and she may intervene alone."
 gg_patron.1.d_1:0 "France supports the Defensa without tying herself to its fate. She pays it every month (unless her subsidy has been renounced) and backs its war; when the river is closed, her patience runs only if London is committed too. Alone she does not intervene."
 gg_patron.1.d_0:0 "Paris washes her hands of the River Plate question. France stops paying the Defensa and backing its war, and a closed river no longer tries her patience."
 gg_patron.2.t_2:0 "London Commits Itself in the Plata"
 gg_patron.2.t_1:0 "London Backs the Defensa"
 gg_patron.2.t_0:0 "London Stands Aside"
 gg_patron.2.d_2:0 "London is fully committed to the Defensa: her squadron in the Plata, her word on the river, or a resolved cabinet. Britain backs the Defensa's war, though she does not pay it, and when the river is closed her patience runs alongside that of Paris. London never acts without Paris."
 gg_patron.2.d_1:0 "The London merchants carry weight in the cabinet: Britain backs the Defensa's war, though she does not pay it, and when the river is closed her patience runs alongside that of Paris. Without Paris, London does not act."
 gg_patron.2.d_0:0 "London withdraws from the question: either it has already recognised Rosas's right of blockade, or its trade asks no more of it. Britain stops backing the Defensa's war, and a closed river no longer tries her patience."
 gg_patron.3.t_2:0 "The Empire Stands Guarantor"
 gg_patron.3.t_1:0 "The Empire Backs the Defensa"
 gg_patron.3.t_0:0 "The Empire Stands Aside"
 gg_patron.3.d_2:0 "Rio de Janeiro is fully committed: the Empire stands guarantor of the Defensa. It pays every month and backs its war."
 gg_patron.3.d_1:0 "The Empire supports the Defensa without yet binding itself by treaty: it pays every month and backs its war."
 gg_patron.3.d_0:0 "The Empire looks on from outside: it neither pays the Defensa nor backs its war."
 gg_war_ui_sec_powers:0 "The Powers"
 gg_war_ui_sec_powers_tt:0 "Each power stands towards the Defensa as #b Spectator#!, #b Protector#! or #b Guarantor#!.\n· #b Spectator#!: does not pay, does not back the war and does not count for the river.\n· #b Protector#!: pays and backs the war; when the river is closed, its patience runs only alongside that of the other power.\n· #b Guarantor#!: pays and backs the war; its patience runs even alone.\nOnce her subsidy is renounced, France pays at no level.\nLandmarks fix the standing: the river guarantee and the intervention make London and Paris guarantors; Southern and Lepredour take them out; renouncing the French subsidy stops France's money and, once her guarantee or her squadron is gone, takes her out; the Empire does not count before 1850 and stands guarantor from its pledge of 1851. Between landmarks, each decision in the events raises or lowers the commitment.\nBritain never paid the Defensa, and London never acted without Paris."
 gg_war_ui_power_francia_0:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #gray Spectator#!"
 gg_war_ui_power_francia_1:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #V Protector#!"
 gg_war_ui_power_francia_2:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #P Guarantor#!"
 gg_war_ui_power_britania_0:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #gray Spectator#!"
 gg_war_ui_power_britania_1:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #V Protector#!"
 gg_war_ui_power_britania_2:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #P Guarantor#!"
 gg_war_ui_power_brasil_0:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #gray Spectator#!"
 gg_war_ui_power_brasil_1:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #V Protector#!"
 gg_war_ui_power_brasil_2:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #P Guarantor#!"
 gg_ui_plata_word_aside:0 "#b London keeps out of the question#!: only the patience of Paris counts."
 gg_ui_plata_word_aside_tt:0 "Britain is now a Spectator towards the Defensa (see «The Powers» in The Guerra Grande). A closure tries only the patience of Paris, and Paris acts alone only as Guarantor."
 gg_ui_plata_word_none:0 "#b No power is in a position to object#!: a closure brings no ultimatum."
 gg_ui_plata_word_none_tt:0 "Neither London nor Paris now backs the Defensa enough to demand anything of Rosas (see «The Powers» in The Guerra Grande): a Protector alone does not act, and a Spectator does not count. Should their commitment grow, the river will try their patience again."
 gg_plata.20.d_none_aside:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nNeither London nor Paris now backs the Defensa enough to demand anything of him: the closure tries no one's patience. For as long as it lasts, the city suffers (mortality #N +5%#!). Outside a truce, each month also deepens its hunger and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_tt_patron_rosas_now_0:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses war support every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_rosas_now_1:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses war support every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_rosas_now_2:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses war support every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_urquiza_now_0:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_tt_patron_urquiza_now_1:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_tt_patron_urquiza_now_2:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_tt_patron_francia_means:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France's commitment sets her standing towards the Defensa (see «The Powers» in The Guerra Grande): at #V 20#! or more she is #b Protector#! (pays and backs the war; her patience runs only alongside London's), at #V 60#! or more, #b Guarantor#! (her patience runs even alone). While the 1848 convention runs she is at least Protector; landmarks fix the standing above this number."
 gg_tt_patron_britania_means:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain's commitment sets her standing towards the Defensa (see «The Powers» in The Guerra Grande): at #V 20#! or more she is #b Protector#! (backs the war without paying; her patience runs only alongside that of Paris), at #V 60#! or more, #b Guarantor#!. London never acts without Paris; landmarks fix the standing above this number."
 gg_tt_patron_brasil_means:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire's commitment sets its standing towards the Defensa (see «The Powers» in The Guerra Grande): before 1850 it does not count; from then, at #V 20#! or more it is #b Protector#! (pays and backs the war), and at #V 60#! or more, #b Guarantor#!. Its pledge of 1851 makes it Guarantor."
 gg_tt_patron_rosas_means:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses war support every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_urquiza_means:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_patron_france_out_river_tt:0 "@warning! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Without the subsidy, France stops paying the Defensa. While her guarantee of the river or her squadron stands, she remains #b Guarantor#! and keeps backing its war; once that ends, she becomes a #b Spectator#!."
