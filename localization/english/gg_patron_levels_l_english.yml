 gg_war_ui_power_brasil_1:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b Brazil#!\n#V Protector#!\n#V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!/100"
