 gg_ui_plata_word_aside:0 "#b London keeps out of the question#!: only the patience of Paris counts."
 gg_ui_plata_word_aside_tt:0 "Britain is now a Spectator towards the Defensa (see ‘The Powers’ in The Guerra Grande). A closure tries only the patience of Paris, and Paris acts alone only as Guarantor."
 gg_ui_plata_word_none:0 "#b No power is in a position to object#!: a closure brings no ultimatum."
 gg_ui_plata_word_none_tt:0 "Neither London nor Paris now backs the Defensa enough to demand anything of Rosas (see ‘The Powers’ in The Guerra Grande): a Protector alone does not act, and a Spectator does not count. Should their commitment grow, the river will try their patience again."
 gg_plata.20.d_none_aside:0 "Rosas has closed the River Plate from the Buenos Aires shore: no foreign ship now reaches Montevideo.\n\nNeither London nor Paris now backs the Defensa enough to demand anything of him: the closure tries no one's patience. For as long as it lasts, the city suffers (mortality #N +5%#!). Outside a truce, each month also deepens its hunger and tips the war towards the #blue_value blancos#!. A single month with the river open breaks the run of hunger."
 gg_tt_patron_rosas_now_0:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses endurance every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_rosas_now_1:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses endurance every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_rosas_now_2:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses endurance every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_urquiza_now_0:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_tt_patron_urquiza_now_1:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_tt_patron_urquiza_now_2:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_tt_patron_francia_means:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France's commitment sets her standing towards the Defensa (see ‘The Powers’ in The Guerra Grande): at #V 20#! or more she is #b Protector#! (pays and backs the war; her patience runs only alongside London's), at #V 60#! or more, #b Guarantor#! (her patience runs even alone). While the 1848 convention runs she is at least Protector; landmarks fix the standing above this number."
 gg_tt_patron_britania_means:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain's commitment sets her standing towards the Defensa (see ‘The Powers’ in The Guerra Grande): at #V 20#! or more she is #b Protector#! (backs the war without paying; her patience runs only alongside that of Paris), at #V 60#! or more, #b Guarantor#!. London never acts without Paris; landmarks fix the standing above this number."
 gg_tt_patron_brasil_means:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire's commitment sets its standing towards the Defensa (see ‘The Powers’ in The Guerra Grande): before 1850 it does not count; from then, at #V 20#! or more it is #b Protector#! (pays and backs the war), and at #V 60#! or more, #b Guarantor#!. A formal pledge to the Defensa makes it Guarantor."
 gg_tt_patron_rosas_means:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses endurance every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_urquiza_means:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_patron_france_out_river_tt:0 "@warning! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Without the subsidy, France stops paying the Defensa. While her guarantee of the river or her squadron stands, she remains #b Guarantor#! and keeps backing its war; once that ends, she becomes a #b Spectator#!."
 gg_patron.1.t_pre_2:0 "France Stakes Herself on the Colorados"
 gg_patron.1.t_pre_1:0 "France Leans Towards the Colorados"
 gg_patron.1.t_pre_0:0 "France Stands Aside"
 gg_patron.2.t_pre_2:0 "London Stakes Herself on the Colorados"
 gg_patron.2.t_pre_1:0 "London Leans Towards the Colorados"
 gg_patron.2.t_pre_0:0 "London Stands Aside"
 gg_patron.3.t_pre_2:0 "The Empire Stakes Itself on the Colorados"
 gg_patron.3.t_pre_1:0 "The Empire Leans Towards the Colorados"
 gg_patron.3.t_pre_0:0 "The Empire Stands Aside"
 gg_patron.1.d_pre_2:0 "Paris has tied her credit to the colorado cause: her agents in Montevideo already speak of Rivera as an ally.\n\n#b Effects#!: should the Republic be partitioned, France will stand #b Guarantor#! of the Defensa: she will pay it every month and back its war, and with the river shut her patience will run even without London beside her."
 gg_patron.1.d_pre_1:0 "Paris looks kindly on the colorados, without binding herself to their fortunes.\n\n#b Effects#!: should the Republic be partitioned, France will stand #b Protector#! of the Defensa: she will pay it every month and back its war; with the river shut, her patience will run only if London joins her."
 gg_patron.1.d_pre_0:0 "In Paris the River Plate question troubles no one any longer.\n\n#b Effects#!: France backs neither Oriental party and does not count for the river."
 gg_patron.2.d_pre_2:0 "London has staked herself on the colorado cause: her trade needs Montevideo open.\n\n#b Effects#!: should the Republic be partitioned, Britain will stand #b Guarantor#! of the Defensa: she will back its war, without paying it, and with the river shut her patience will run alongside that of Paris."
 gg_patron.2.d_pre_1:0 "The merchants of the City look kindly on the colorados.\n\n#b Effects#!: should the Republic be partitioned, Britain will stand #b Protector#! of the Defensa: she will back its war, without paying it, and with the river shut her patience will run alongside that of Paris."
 gg_patron.2.d_pre_0:0 "London keeps out of Oriental quarrels.\n\n#b Effects#!: Britain backs neither Oriental party and does not count for the river."
 gg_patron.3.d_pre_2:0 "Rio de Janeiro leans firmly towards the colorados.\n\n#b Effects#!: should the Republic be partitioned, the Empire will stand #b Guarantor#! of the Defensa from 1850: it will pay it every month and back its war."
 gg_patron.3.d_pre_1:0 "Rio de Janeiro looks kindly on the colorados, without committing itself.\n\n#b Effects#!: should the Republic be partitioned, the Empire will sustain the Defensa from 1850: it will pay it every month and back its war."
 gg_patron.3.d_pre_0:0 "Rio de Janeiro watches from the frontier and waits.\n\n#b Effects#!: the Empire backs neither Oriental party."
 gg_tt_patron_francia_means_pre:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France backs the #R colorados#!. Should the Republic be partitioned, her commitment will set her standing towards the Defensa: at #V 20#! or more she will be #b Protector#! (she pays and backs the war; her patience runs only alongside London's), at #V 60#! or more, #b Guarantor#! (her patience runs even alone)."
 gg_tt_patron_britania_means_pre:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain backs the #R colorados#!. Should the Republic be partitioned, her commitment will set her standing towards the Defensa: at #V 20#! or more she will be #b Protector#! (she backs the war without paying it; her patience runs only alongside that of Paris), at #V 60#! or more, #b Guarantor#!. London never acts without Paris."
 gg_tt_patron_brasil_means_pre:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire backs the #R colorados#!. Should the Republic be partitioned, it will count for the Defensa from 1850: at #V 20#! or more it will be #b Protector#! (it pays and backs the war), at #V 60#! or more, #b Guarantor#!."
 gg_tt_patron_rosas_means_pre:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas backs Oribe's #blue_value blancos#!. Should the Republic be partitioned, he will sustain the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito will lose endurance every month; at #V 40#! or more, the Cerrito may ask him to close the river."
 gg_tt_patron_urquiza_means_pre:0 "@information! Urquiza weighs on the side of Rosas and the #blue_value blancos#! for as long as he stands by him. Should the Republic be partitioned, he will count for the Cerrito, or for the Defensa if he turns: at #V 50#! or more, with Rosas below #V 60#!, he may turn."
