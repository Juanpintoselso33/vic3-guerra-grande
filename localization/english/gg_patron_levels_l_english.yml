l_english:
 gg_tt_patron_francia_now_2:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now the Defensa's #b Guarantor#!: she pays it every month (unless her subsidy has been renounced), backs its war, and when the river is closed her patience runs even without London."
 gg_tt_patron_francia_now_1:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now the Defensa's #b Protector#!: she pays it every month (unless her subsidy has been renounced), backs its war, and when the river is closed her patience runs only if London stands with her. Alone she does not intervene."
 gg_tt_patron_francia_now_0:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France is now a #b Spectator#!: she does not pay the Defensa, does not back its war, and a closed river does not try her patience."
 gg_tt_patron_francia_now:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] France backs the Defensa according to her standing."
 gg_tt_patron_britania_now_2:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now a #b Guarantor#!: she is fully committed: her squadron in the Plata, her word on the river, or a commitment of #V 60#! or more. She backs the Defensa's war, though she does not pay it, and when the river is closed her patience runs alongside that of Paris."
 gg_tt_patron_britania_now_1:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now the Defensa's #b Protector#!: she backs its war, though she does not pay it, and when the river is closed her patience runs alongside that of Paris. London never acts without Paris."
 gg_tt_patron_britania_now_0:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain is now a #b Spectator#!: she does not back the Defensa's war, and a closed river does not try her patience."
 gg_tt_patron_britania_now:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Britain backs the Defensa according to her standing."
 gg_tt_patron_brasil_now_2:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now the Defensa's #b Guarantor#!, bound by its word, by treaty or by a commitment of #V 60#! or more: it pays every month and backs its war."
 gg_tt_patron_brasil_now_1:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now the Defensa's #b Protector#!: it pays every month and backs its war."
 gg_tt_patron_brasil_now_0:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire is now a #b Spectator#!: it neither pays the Defensa nor backs its war. Before 1850 it looks on from outside."
 gg_tt_patron_brasil_now:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] The Empire backs the Defensa according to its standing."
 gg_tt_patron_rosas_now:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas's backing sustains the Cerrito's war: if Rosas and Urquiza together fall short of #V 40#!, the Cerrito loses endurance every month. He pays it every month. At #V 40#! or more, the Cerrito can ask him to close the river."
 gg_tt_patron_urquiza_now:0 "@information! Urquiza's backing counts for whichever side he is on: the Cerrito today, or the Defensa if he changes sides. At #V 50#! or more, with Rosas below #V 60#!, he may change sides."
 gg_patron_france_out_tt:0 "@warning! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Without the subsidy, France becomes a #b Spectator#!: she stops paying, stops backing the Defensa's war and no longer counts for the river."
 gg_patron.a:0 "Let it be known along the line."
 gg_patron.1.t_2:0 "France Stands Guarantor"
 gg_patron.1.t_1:0 "France Stands Protector"
 gg_patron.1.t_0:0 "France Stands Aside"
 gg_patron.1.d_2:0 "Paris no longer sends mere notes and bills of exchange: she has tied her credit to the fate of Montevideo, and her consuls speak like men with something to lose.\n\n#b Effects#!: France pays the Defensa every month, unless she has renounced her subsidy, and backs its war. Should Rosas close the river, her patience runs even without London beside her, and she may intervene alone."
 gg_patron.1.d_1:0 "Paris sustains Montevideo with money and with words, but has no wish to be bound to its fate: the Chamber asks what every month of this war is costing.\n\n#b Effects#!: France pays the Defensa every month, unless she has renounced her subsidy, and backs its war. With the river shut, her patience runs only if London is committed too; alone, she does not intervene."
 gg_patron.1.d_0:0 "In Paris the River Plate question troubles no one any longer: other affairs fill the ministry's dispatch boxes.\n\n#b Effects#!: France stops paying the Defensa and backing its war, and a shut river no longer wears down her patience."
 gg_patron.2.t_2:0 "London Commits Itself in the Plata"
 gg_patron.2.t_1:0 "London Backs the Defensa"
 gg_patron.2.t_0:0 "London Stands Aside"
 gg_patron.2.d_2:0 "London is fully committed to Montevideo: her squadron in the Plate, her word given over the river, or a cabinet resolved not to yield.\n\n#b Effects#!: Britain backs the Defensa's war, though she does not pay it, and with the river shut her patience runs alongside that of Paris. London never acts without Paris."
 gg_patron.2.d_1:0 "The merchants of the City make themselves heard in the cabinet: they want the rivers open and the port of Montevideo standing.\n\n#b Effects#!: Britain backs the Defensa's war, though she does not pay it, and with the river shut her patience runs alongside that of Paris. Without Paris, London does not act."
 gg_patron.2.d_0:0 "London withdraws from the question: either she has conceded Rosas’s right to blockade, or her trade asks nothing more of her.\n\n#b Effects#!: Britain stops backing the Defensa's war, and a shut river no longer wears down her patience."
 gg_patron.3.t_2:0 "The Empire Stands Guarantor"
 gg_patron.3.t_1:0 "The Empire Backs the Defensa"
 gg_patron.3.t_0:0 "The Empire Stands Aside"
 gg_patron.3.d_2:0 "Rio de Janeiro no longer watches from the frontier: the Empire has bound itself in writing to the fate of Montevideo.\n\n#b Effects#!: the Empire stands #b Guarantor#! of the Defensa: it pays it every month and backs its war."
 gg_patron.3.d_1:0 "Rio de Janeiro sustains Montevideo without yet binding itself by treaty: the money arrives, the signature does not.\n\n#b Effects#!: the Empire pays the Defensa every month and backs its war."
 gg_patron.3.d_0:0 "Rio de Janeiro watches from the frontier and waits.\n\n#b Effects#!: the Empire neither pays the Defensa nor backs its war."
 gg_war_ui_sec_powers:0 "The Backers"
 gg_war_ui_sec_powers_tt:0 "Each power stands towards the Defensa as #b Spectator#!, #b Protector#! or #b Guarantor#!.\n· #b Spectator#!: does not pay, does not back the war and does not count for the river.\n· #b Protector#!: pays and backs the war; when the river is closed, its patience runs only alongside that of the other power.\n· #b Guarantor#!: pays and backs the war; its patience runs even alone.\nOnce her subsidy is renounced, France pays at no level.\nLandmarks fix the standing: the river guarantee and the intervention make London and Paris guarantors; Southern and Lepredour take them out; renouncing the French subsidy stops France's money and, once her guarantee or her squadron is gone, takes her out; the Empire does not count before 1850 and stands guarantor once it pledges itself. Between landmarks, each decision in the events raises or lowers the commitment.\nBritain never paid the Defensa, and London never acted without Paris.\n#b On the Cerrito's side#!: Buenos Aires (Rosas) and Entre Ríos (Urquiza, while he stands there); their backing counts the same way, and below #V 40#! it costs endurance too."
 gg_war_ui_power_francia_0:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b France#!\n#grey Spectator#!\n#V [GetGlobalVariable('gg_patron_francia').GetValue|0]#!/100"
