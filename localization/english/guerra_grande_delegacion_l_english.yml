l_english:
 je_gg_delegation:0 "The Federal Pact"
 je_gg_delegation_desc:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a commission held in trust. By the Federal Pact of 4 January 1831, a treaty between entities that recognise one another as sovereign, the provinces entrusted the conduct of their foreign relations to the governor of Buenos Aires — and each kept the right to withdraw that authority.\n\nThere is no national state here to betray. There are fourteen provinces, and one of them speaks for the rest only so long as the rest allow it."
 je_gg_delegation_reason:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a commission held in trust. By the Federal Pact of 4 January 1831, a treaty between entities that recognise one another as sovereign, the provinces entrusted the conduct of their foreign relations to the governor of Buenos Aires — and each kept the right to withdraw that authority.\n\nThere is no national state here to betray. There are fourteen provinces, and one of them speaks for the rest only so long as the rest allow it.\n\n#b How to read this#!\n• @information! #b Thirteen provinces#! can entrust their foreign relations to Buenos Aires: the Confederation's fourteen less Buenos Aires itself. Above they are divided into three groups: those that still do so, those awaiting a reply to a formal demand, and those that have withdrawn the commission.\n• A province that issues a pronunciamiento leaves as a whole and returns as a whole — defeated in the field and placed under a federal governor, as Corrientes and Tucumán were. Neither was ever annexed.\n• @battalions! The figure below counts the months Oribe's army has stood before Montevideo. It has no cost here: it shows how much time the war across the river is consuming.\n• #b The arrangement breaks only when half the Confederation has left AND the siege continues#!. Six or fewer provinces remaining is not enough: that was already the position in October 1840, and Rosas governed for another eleven years. What finally broke his authority was keeping an army before Montevideo for #b three years#! while the interior was in arms. Both conditions must hold at once."
 je_gg_delegation_complete_tt:0 "Only #N 6 or fewer#! of the #V 13#! provinces still allow Buenos Aires to speak for them, while the army has stood before Montevideo for #V 3 years#!. The commission can no longer hold the Confederation together."
 gg_delegation_bar_desc:0 "Provinces still delegating"
 je_gg_del_l_corrientesok_cordobaok_norteok_entre_riosok:0 "#P Still delegating#! (#V 13#!): Corrientes, Entre Ríos, Santa Fe, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, San Luis and Mendoza.\n\nThe army has stood before Montevideo for #V [GetGlobalVariable('gg_oribe_siege_months').GetValue|0]#! months."
