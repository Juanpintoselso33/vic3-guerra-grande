l_english:
 je_gg_delegation:0 "The Federal Pact"
 je_gg_delegation_desc:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a charge. By the Federal Pact of 4 January 1831, a treaty between sovereign entities, the provinces delegated the conduct of foreign relations to the governor of Buenos Aires — and each kept the right to withdraw what it lent.\n\nThere is no national state to betray. There are fourteen provinces that recognise one another as independent, and one of them speaks for all the rest as long as the rest allow it."
 je_gg_delegation_reason:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a charge. By the Federal Pact of 4 January 1831, a treaty between sovereign entities, the provinces delegated the conduct of foreign relations to the governor of Buenos Aires — and each kept the right to withdraw what it lent.\n\nThere is no national state to betray. There are fourteen provinces that recognise one another as independent, and one of them speaks for all the rest as long as the rest allow it.\n\n#b What is counted#!\n• @information! #b Thirteen provinces#! delegate: the Confederation's fourteen less Buenos Aires, which cannot delegate to itself. When none are left, there will be nothing left to be the charged governor of.\n• A province that pronounces goes whole. Winning it back by arms brings it back, and that is what is at stake in the interior.\n• @battalions! Holding Oribe's army before Montevideo costs, month by month, a twelfth of a province. Nine years of siege are nine years of wear, and it is not visible until it is.\n• None of this is opinion: these are facts. The bar does not measure what the provinces think of you. It measures how many still let you speak for them."
 je_gg_delegation_status_rosas:0 "#V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! provinces still speak through you."
 je_gg_delegation_status_provincia:0 "Buenos Aires still speaks for #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! provinces. No longer for this one."
 je_gg_delegation_complete_tt:0 "No province delegates its foreign relations to the governor of Buenos Aires any more."
 gg_delegation_bar_desc:0 "Provinces still delegating"
