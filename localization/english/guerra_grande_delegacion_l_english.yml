l_english:
 je_gg_delegation:0 "The Federal Pact"
 je_gg_delegation_desc:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a charge. By the Federal Pact of 4 January 1831, a treaty between entities that recognise one another as sovereign, the provinces delegated the conduct of their foreign relations to the governor of Buenos Aires — and each kept the right to withdraw what it lent.\n\nThere is no national state here to betray. There are fourteen provinces, and one of them speaks for the rest exactly as long as the rest allow it."
 je_gg_delegation_reason:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a charge. By the Federal Pact of 4 January 1831, a treaty between entities that recognise one another as sovereign, the provinces delegated the conduct of their foreign relations to the governor of Buenos Aires — and each kept the right to withdraw what it lent.\n\nThere is no national state here to betray. There are fourteen provinces, and one of them speaks for the rest exactly as long as the rest allow it.\n\n#b How to read this#!\n• @information! #b Thirteen provinces#! can delegate: the Confederation's fourteen less Buenos Aires, which cannot delegate to itself. Above they are sorted into three: those that delegate, those that delegate with a petition unanswered, and those that have withdrawn the charge.\n• A province that pronounces goes whole, and it comes back whole — beaten in the field and given a federal governor, which is what actually happened to Corrientes and to Tucumán. Neither was ever annexed.\n• @battalions! The months counted at the foot are the ones Oribe's army has spent standing in front of Montevideo. They cost nothing here: they are there so you can see what the war on the other bank is costing in time.\n• #b The charge breaks on half the Confederation AND the siege#!. Six or fewer delegating is not enough: that is where October 1840 leaves things, and Rosas governed eleven years more. What broke him was holding the army in front of Montevideo for #b three years#! while the interior was in arms. Both at once."
 je_gg_delegation_complete_tt:0 "Only #N 6 or fewer#! of the #V 13#! provinces let Buenos Aires speak for them, while the army has stood before Montevideo for #V 3 years#!. The charge can no longer hold the Confederation together."
 gg_delegation_bar_desc:0 "Provinces still delegating"
 je_gg_del_l_corrientesok_cordobaok_norteok_entre_riosok:0 "#P Delegate#! (#V 13#!): Corrientes, Entre Ríos, Santa Fe, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, San Luis and Mendoza.\n\nThe army before Montevideo has been standing there #V [GetGlobalVariable('gg_oribe_siege_months').GetValue|0]#! months."
