l_english:
 je_gg_delegation:0 "The Federal Pact"
 je_gg_delegation_desc:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a charge. By the Federal Pact of 4 January 1831, a treaty between entities that recognise one another as sovereign, the provinces delegated the conduct of their foreign relations to the governor of Buenos Aires — and each kept the right to withdraw what it lent.\n\nThere is no national state here to betray. There are fourteen provinces, and one of them speaks for the rest exactly as long as the rest allow it."
 je_gg_delegation_reason:0 "Buenos Aires' power over the other provinces is not sovereignty: it is a charge. By the Federal Pact of 4 January 1831, a treaty between entities that recognise one another as sovereign, the provinces delegated the conduct of their foreign relations to the governor of Buenos Aires — and each kept the right to withdraw what it lent.\n\nThere is no national state here to betray. There are fourteen provinces, and one of them speaks for the rest exactly as long as the rest allow it.\n\n#b How to read this#!\n• @information! #b Thirteen provinces#! can delegate: the Confederation's fourteen less Buenos Aires, which cannot delegate to itself. Each line above is one of them, and the mark says whether it still does.\n• A province that pronounces goes whole, and it comes back whole — beaten in the field and given a federal governor, which is what actually happened to Corrientes and to Tucumán. Neither was ever annexed.\n• @battalions! The months counted at the foot are the ones Oribe's army has spent standing in front of Montevideo. They cost nothing here: they are there so you can see what the war on the other bank is costing in time.\n• #b The charge breaks at six#!. When fewer than half still delegate, the governor of Buenos Aires is conducting the foreign relations of a minority, and that is not a Confederation."
 je_gg_delegation_complete_tt:0 "Fewer than half of the thirteen provinces still let the governor of Buenos Aires speak for them."
 gg_delegation_bar_desc:0 "Provinces still delegating"
 gg_del_yes:0 "#P ✓#!"
 gg_del_no:0 "#N ✗#!"
