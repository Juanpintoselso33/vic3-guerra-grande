 gg_battle.20.t:0 "India Muerta: Rivera's Cavalry Holds"
 gg_battle.20.d:0 "On the fields of India Muerta, near Rocha, Urquiza's divisions charged Rivera's army as they had at Arroyo Grande. This time the line held: the Cerrito's squadrons fell back northwards, and Rivera keeps his army in the field.\n\nA battle won in the open does not lift the siege, but the Cerrito can no longer count the countryside as its own."
 gg_battle.20.f:0 "A battle won in the field does not open the gates of the city."
 gg_battle.20.a:0 "Let the dispatch reach the city."
 gg_battle.21.t:0 "The Lines Broken"
 gg_battle.21.d:0 "The allied forces — the Defensa's, Entre Ríos's and, if they have arrived, the Empire's — gave battle to the Cerrito's in the field and broke them. The battalions scatter towards the fords of the Santa Lucía, and the Cerrito's men begin to look to the road home to their estancias.\n\nIt is not yet peace: it is the end of what kept the siege alive."
 gg_battle.21.f:0 "Eleven thousand men under arms are no army once they have stopped believing in the war."
 gg_battle.21.a:0 "Fall back on the Cerrito."
 gg_battle.22.t:0 "The Cerrito Holds"
 gg_battle.22.d:0 "The allied forces went looking for battle, and the Cerrito gave it and held. The allies fall back to wait for reinforcements; in the city, the hope of a quick end cools."
 gg_battle.22.f:0 "Oribe still has the means to fight."
 gg_battle.22.a:0 "Wait for the Empire."
 gg_battle.22.a_tt:0 "@information! The allied crossing is held up for a month."
