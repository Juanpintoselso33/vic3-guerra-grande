l_spanish:

 gg_naval.1.t:0 "La escuadra de Coe"
 gg_naval.1.d:0 "El convenio de Mackau y Arana le sacó a Rosas de encima a la segunda potencia naval del mundo, y el Restaurador usó la mano libre en el río. El 22 de enero cerró el Paraná y el Uruguay, autorizó el corso contra los buques que salieran de puertos orientales y declaró bloqueada Montevideo. El 2 de febrero le dio el mando de la escuadra al brigadier #b Guillermo Brown#!, retirado, héroe de las guerras contra España y contra el Imperio, a quien reconocen sin distinción de partidos.\n\nLa respuesta del gobierno fue cerrar los ríos también y autorizar el corso. Lo que falta es la escuadra. El Ministerio de Guerra y Marina nombró el 31 de diciembre al coronel #b John Halstead Coe#! jefe de las fuerzas navales «a crearse», y una Comisión Marítima abrió una suscripción entre la gente de plata de la ciudad. Con eso hay corbeta —la #b Sarandí#!, de diez cañones—, un bergantín, unas goletas y poco más. Coe, como la mitad de los oficiales de las dos escuadras, sirvió a las órdenes de Brown en la guerra del Brasil.\n\nUna escuadra se paga antes de que dispare el primer tiro, y la caja está para sostener un ejército, no dos armas. La otra posibilidad es dejar el río y confiar en las baterías del puerto, que es tanto como reconocer el bloqueo."
 gg_naval.1.d_neutral:0 "La República se quedó afuera de la guerra de los otros, y el río no se enteró. El 22 de enero Rosas cerró el Paraná y el Uruguay, autorizó el corso contra los buques que salieran de puertos orientales y declaró bloqueada Montevideo, con guerra declarada o sin ella. El 2 de febrero le dio el mando de la escuadra al brigadier #b Guillermo Brown#!, retirado, héroe de las guerras contra España y contra el Imperio.\n\nEl gobierno cerró los ríos también y autorizó el corso. Lo que falta es la escuadra. El Ministerio de Guerra y Marina nombró el 31 de diciembre al coronel #b John Halstead Coe#! jefe de las fuerzas navales «a crearse», y una Comisión Marítima abrió una suscripción entre la gente de plata de la ciudad. Con eso hay corbeta —la #b Sarandí#!, de diez cañones—, un bergantín, unas goletas y poco más. Coe, como la mitad de los oficiales de las dos escuadras, sirvió a las órdenes de Brown en la guerra del Brasil.\n\nUna escuadra se paga antes de que dispare el primer tiro, y la neutralidad ya no le está ahorrando nada al puerto. La otra posibilidad es dejar el río y confiar en las baterías, que es tanto como reconocer el bloqueo."
 gg_naval.1.f:0 "El comodoro y el almirante se conocen: sirvieron juntos contra el Brasil."
 gg_naval.1.a:0 "Abrir la suscripción. Que la República tenga escuadra."
 gg_naval.1.a_tt:0 "@information! Coe sale al río; la suerte de la escuadra queda atada a esa campaña."
 gg_naval.1.b:0 "Que el río lo cuiden las baterías del puerto."
 gg_naval.1.b_tt:0 "@warning! La escuadra de Brown queda sin rival frente a Montevideo: el puerto, la aduana y el comercio pagan el costo hasta que se vuelva a abrir el mar."

 gg_naval.2.t:0 "Los pasquines contra Coe"
 gg_naval.2.d:0 "El año en el agua se cuenta en averías. El 24 de mayo, frente a Punta Brava, una bala de cañón partió al teniente coronel #b Malcolm Shannon#! en su propia corbeta y la escuadra se metió en el puerto a reparar. El 3 de agosto, en la boca del Santa Lucía, Brown peleó borda a borda con el #b Belgrano#! hasta que la noche y la niebla cortaron el cañoneo. El 10 de diciembre, cerca del banco Ortiz, el #b Cagancha#! quedó cortado del resto, desarbolado por el temporal, y amaneció capturado: hoy navega para la Confederación con el nombre #b Restaurador#!. Dos buques se habían pasado al enemigo antes, con sus tripulaciones.\n\nCoe volvió anteayer contando una persecución hasta el canal del sur y trayendo la #b Sarandí#! con averías. La ciudad no le cree. Hace una semana que aparecen pasquines preguntando por qué el comodoro nunca consigue batir a su antiguo jefe, y él mismo pide consejo de guerra para limpiar su nombre. El ministro Vidal aconseja terminar con el gasto: que se vendan los buques y que el río quede para Brown.\n\nQuedan dos cascos en condiciones, el #b Pereira#! y la #b Constitución#!. Alistados, alcanzan para subir el Paraná y llevarle armas y hombres a Corrientes, que es lo único que todavía sostiene la guerra del otro lado del río."
 gg_naval.2.f:0 "«Gastó sumas crecidas, y aún puede decirse, inmensas comparativamente a la importancia de la Escuadrilla.» — general José María Paz"
 gg_naval.2.a:0 "Desarmar la escuadra y alistar el Pereira y la Constitución para Corrientes."
 gg_naval.2.a_tt:0 "@information! Los dos buques restantes quedan comprometidos con la expedición al Paraná, al alcance de la escuadra de Brown."
 gg_naval.2.b:0 "Vender hasta el último casco. Que el consejo de guerra decida lo de Coe."
 gg_naval.2.b_tt:0 "@information! Sin expedición al Paraná, Garibaldi no gana el mando de la Legión Italiana."

 gg_naval.3.t:0 "Costa Brava"
 gg_naval.3.d:0 "La expedición subió el Paraná con el #b Pereira#! y la #b Constitución#! al mando del marino de Niza #b Giuseppe Garibaldi#!, y Brown salió atrás. El 15 de agosto la alcanzó en el paraje de Costa Brava, en el límite de Entre Ríos con Corrientes, cerca de Esquina. Brown no atacó de frente: mandó gente a tierra para remolcar sus buques a la sirga, desalojó con infantería a los tiradores que le tiraban desde la orilla y fondeó su ala izquierda a distancia de tiro. Garibaldi le mandó un brulote encendido; un grumete de doce años, Bartolomé Cordero, lo abordó en un bote y le cambió el rumbo.\n\nEl combate duró dos días. En la segunda jornada Garibaldi se quedó sin munición, con las cubiertas rotas y la mitad de la gente fuera de combate. Antes de entregar los buques los voló, y se metió tierra adentro con los que quedaban. Los oficiales de Brown pidieron perseguirlo y el almirante no los dejó. En su parte a Rosas describió a esa gente como piratas que saqueaban sin piedad; a sus oficiales les dijo otra cosa.\n\nDe la escuadra de la República no queda nada. Lo que vuelve a Montevideo es un hombre con fama de haber peleado dos días contra el mejor marino del Plata y de haber quemado sus barcos antes que rendirlos, y una tropa de italianos que lo sigue."
 gg_naval.3.f:0 "«Déjenlo escapar, ese gringo es un valiente.» — Guillermo Brown"
 gg_naval.3.a:0 "Recibirlo como lo que la ciudad ya cree que es."
 gg_naval.3.a_tt:0 "@information! Costa Brava le da a #b Garibaldi#! el mando de la Legión Italiana."
 gg_naval.3.b:0 "Una derrota es una derrota: ni honores ni ascenso."
 gg_naval.3.b_tt:0 "@information! Sin honores públicos, Garibaldi no gana el mando de la Legión Italiana. El gobierno gana algo de crédito por no disfrazar la derrota: legitimidad #P +2#!."

 gg_naval_port_under_blockade:0 "El puerto bajo bloqueo"
 gg_naval_port_under_blockade_desc:0 "La escuadra de la Confederación fondea frente a Montevideo y nadie se lo discute."
 gg_naval_no_false_honours:0 "Ni honores para una derrota"
 gg_naval_no_false_honours_desc:0 "El gobierno no disfrazó la derrota de victoria, y eso le suma crédito en la plaza."
