l_spanish:

 gg_prewar.1.t:0 "El Moderador"
 gg_prewar.1.d:0 "Los unitarios porteños que Rosas echó de Buenos Aires publican en Montevideo El Moderador, y cada número es un ataque contra el Restaurador. El enviado de la Confederación, Correa Morales, exige garantías de que los emigrados dejen de conspirar desde nuestra orilla. Rivera, que los protege, protesta antes de que el gobierno decida."
 gg_prewar.1.f:0 "Una imprenta en Montevideo es un asunto de Buenos Aires."
 gg_prewar.1.a:0 "Clausurar el diario y vigilar a los emigrados."
 gg_prewar.1.b:0 "La República da asilo. Que escriban."
 gg_prewar.2.t:0 "La guerra de los Farrapos"
 gg_prewar.2.d:0 "Desde setiembre del año pasado Río Grande está en armas contra el Imperio, y la frontera es una sola cuchilla con estancias de los dos lados. Bento Gonçalves necesita caballos, pasos y amigos; Río de Janeiro necesita que alguien le cierre esa puerta. Rivera tiene con los riograndenses una amistad que no pasa por el gobierno."
 gg_prewar.2.f:0 "La frontera la cruza el ganado antes que la ley."
 gg_prewar.2.a:0 "Neutralidad, y ojos abiertos."
 gg_prewar.2.b:0 "Ayudar al Imperio a cerrar la frontera."
 gg_prewar.2.c:0 "Que los farrapos pasen. No es nuestra guerra."
 gg_prewar.3.t:0 "Las cuentas de la primera presidencia"
 gg_prewar.3.d:0 "En enero el gobierno suprimió la Comandancia General de la Campaña y Rivera la acató: se fue a su estancia del Durazno. Ahora la comisión de Juan Pedro Ramírez, Antonio Costa y Ramón Artagaveytia tiene listas sus conclusiones sobre la administración anterior. Publicarlas es ordenar el Estado. Hacerlo mientras se le devuelve la Comandancia a Ignacio Oribe es decirle a Rivera que no vuelve."
 gg_prewar.3.f:0 "Un balance de cuentas también es una declaración."
 gg_prewar.3.a:0 "Publíquense, y la Comandancia para Ignacio Oribe."
 gg_prewar.3.b:0 "Publíquense. La Comandancia queda suprimida."
 gg_prewar.3.c:0 "Archívense, y que el general tenga un cargo."
 gg_prewar.4.t:0 "Tacuarembó, Salto y Minas"
 gg_prewar.4.d:0 "La ley del 16 de junio crea tres departamentos nuevos. En el norte eso quiere decir jefes políticos, jueces y receptores donde hasta ahora mandaban los caudillos que se hicieron con Rivera. Quién los encabece decide si el Estado llega a la frontera o si la frontera sigue siendo de ellos."
 gg_prewar.4.f:0 "Un departamento es una firma en Montevideo y un hombre a caballo en la cuchilla."
 gg_prewar.4.a:0 "Jefes políticos nombrados por el gobierno."
 gg_prewar.4.b:0 "Que los encabecen los caudillos del lugar."
 gg_prewar.5.t:0 "Yucutujá"
 gg_prewar.5.d:0 "Rivera volvió a cruzar la frontera, esta vez con riograndenses a su lado, y busca al ejército del gobierno en el norte. Cuánta gente lo sigue depende de lo que haya pasado en la frontera y en los departamentos nuevos. El gobierno puede aceptar la batalla donde él la ofrece o replegarse hacia el centro."
 gg_prewar.5.f:0 "22 de octubre de 1837."
 gg_prewar.5.a:0 "Presentar batalla en el norte."
 gg_prewar.5.b:0 "Replegarse al centro y esperarlo."
 gg_prewar.6.t:0 "La acción del Yí"
 gg_prewar.6.d:0 "Poco después de Yucutujá, las fuerzas del gobierno alcanzaron a Rivera sobre el Yí y lo derrotaron. Se puede ir tras él con todo o afirmar lo que se tiene antes de que vuelva."
 gg_prewar.6.f:0 "Una revancha, no un final."
 gg_prewar.6.a:0 "Perseguirlo hasta la frontera."
 gg_prewar.6.b:0 "Afirmar la campaña."
 gg_prewar.7.t:0 "Las velas de Leblanc"
 gg_prewar.7.d:0 "Desde marzo la escuadra francesa del contraalmirante Leblanc bloquea Buenos Aires, y sus buques necesitan puertos de este lado del río. Rosas pide que se los cierren. Francia ofrece tratar. Cerrarlos es quedar con la Confederación frente a la marina más fuerte del Plata; tratar es quedar mal con Rosas y sin la mitad de lo que Oribe tiene detrás."
 gg_prewar.7.f:0 "En el Plata, el que tiene el agua tiene la guerra."
 gg_prewar.7.a:0 "Los puertos se cierran a la escuadra."
 gg_prewar.7.b:0 "Tratar con Francia."
 gg_prewar.8.t:0 "La Universidad Mayor"
 gg_prewar.8.d:0 "En 1833 la ley que impulsó el presbítero Dámaso Antonio Larrañaga creó la Casa de Estudios Generales, que en 1836 ya dictaba latín, filosofía, matemáticas, teología y jurisprudencia. Falta el paso que la convierta en universidad. Hacerlo ahora cuesta plata en plena guerra con Rivera."
 gg_prewar.8.f:0 "Una república que se piensa a sí misma también se defiende."
 gg_prewar.8.a:0 "Decrétese la Universidad Mayor de la República."
 gg_prewar.8.b:0 "Después de la guerra."
 gg_prewar.9.t:0 "Palmar"
 gg_prewar.9.d:0 "Rivera y los riograndenses avanzan sobre el ejército que manda Ignacio Oribe. Si el gobierno llega con ventaja, todavía puede negarles la batalla y guardar el ejército. Si no, hay que pelear donde ellos quieren."
 gg_prewar.9.f:0 "15 de junio de 1838."
 gg_prewar.9.a:0 "Dar la batalla."
 gg_prewar.9.b:0 "Negarles la batalla y replegarse."
 gg_prewar_state_chiefs:0 "Jefes políticos del gobierno"
 gg_prewar_local_caudillos:0 "Caudillos al frente de los departamentos"
 gg_prewar_north_lost:0 "El norte responde a Rivera"
 gg_artigas_letter:0 "Una carta a Curuguaty"
