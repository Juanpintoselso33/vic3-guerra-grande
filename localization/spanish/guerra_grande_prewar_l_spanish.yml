l_spanish:

 gg_prewar.1.t:0 "El Moderador"
 gg_prewar.1.d:0 "Los unitarios que Rosas echó de Buenos Aires encontraron de este lado del río una ciudad con imprentas, y la usan. El Moderador sale en Montevideo y cada número es contra el Restaurador.\n\nEl enviado de la Confederación, Correa Morales, no vino a pedir. Fue firme y casi grosero: exige garantías de que los emigrados dejen de conspirar desde nuestra orilla contra el gobierno de Buenos Aires. Del otro lado está el general Rivera, todavía Comandante General de la Campaña, que tiene a esos mismos emigrados por amigos y ya avisó que va a protestar.\n\nCerrar un diario es darle la razón a Buenos Aires. No cerrarlo es darle a Buenos Aires un motivo."
 gg_prewar.1.f:0 "Una imprenta en Montevideo es un asunto de Buenos Aires."
 gg_prewar.1.a:0 "Clausurar El Moderador y vigilar a los emigrados."
 gg_prewar.1.b:0 "La República da asilo. Que escriban."
 gg_prewar.2.t:0 "La guerra de los Farrapos"
 gg_prewar.2.d:0 "Desde el 20 de setiembre Río Grande está en armas contra el Imperio. Los estancieros y charqueadores de Bento Gonçalves, Antônio de Sousa Neto y Onofre Pires pelean, entre otras cosas, porque su charque sale más caro que el de nuestros saladeros y los de Buenos Aires. Y dicen que los inspiró nuestra propia guerra de independencia.\n\nEl presidente ya marchó una vez al norte a vigilar la neutralidad, y tuvo el cuidado de anotar que lo hacía «en acuerdo con el Comandante General de la Campaña». Rivera se sintió desplazado igual. Bento Gonçalves fue su camarada en el ejército portugués, y los tratos del general con los jefes riograndenses no pasan por este gobierno. Río de Janeiro los ve y nos va a pedir cuentas a nosotros.\n\nLa frontera es una línea que nadie midió. Hay que decidir quién la cruza."
 gg_prewar.2.f:0 "La frontera la cruza el ganado antes que la ley."
 gg_prewar.2.a:0 "Neutralidad, y los ojos en la frontera."
 gg_prewar.2.b:0 "Ayudar al Imperio a cerrar la frontera."
 gg_prewar.2.c:0 "Que los farrapos pasen. No es nuestra guerra."
 gg_prewar.3.t:0 "Las cuentas de la primera presidencia"
 gg_prewar.3.d:0 "El 9 de enero este gobierno suprimió la Comandancia General de la Campaña, y el general Rivera la acató: se fue a su estancia del Durazno. Juan María Pérez le escribió a Giró que todos esperaban que saltara y armara un movimiento, «pero les pagó un chasco, pues se ha portado más subordinado que un veterano del virrey de la India».\n\nAhora la comisión de Juan Pedro Ramírez, Antonio Costa y Ramón Artagaveytia terminó de revisar la administración anterior, y sus conclusiones no dejan margen: hubo despilfarro y hubo fraude. Publicarlas es inevitable. Lo que se decide es qué se hace al mismo tiempo. La Comandancia puede volver a existir, y el candidato es Ignacio Oribe, el hermano del presidente.\n\nRivera aceptó perder el cargo. Nadie sabe si va a aceptar que se lo den a otro."
 gg_prewar.3.f:0 "«Las rigideces del general Oribe, que no cabían dentro del marco primitivo de aquellas horas, originarían la revolución de 1836.»"
 gg_prewar.3.a:0 "Publíquense, y la Comandancia para Ignacio Oribe."
 gg_prewar.3.b:0 "Publíquense. La Comandancia sigue suprimida."
 gg_prewar.3.c:0 "Archívense, y que el general tenga un cargo."
 gg_prewar.4.t:0 "Tacuarembó, Salto y Minas"
 gg_prewar.4.d:0 "La ley del 16 de junio corta la campaña en más pedazos: Tacuarembó se separa de Paysandú, y Salto y Minas pasan a ser departamentos. Los nueve de la Constitución ahora son doce.\n\nUn departamento nuevo quiere decir un jefe político, un juez y alguien que cobre las rentas, en lugares donde hasta hoy la única autoridad era el comandante de la zona, y ese comandante casi siempre es un hombre de Rivera. Rivera está en el Brasil desde Carpintería, y del otro lado de la frontera los farrapos le guardan caballos.\n\nQuién encabece los departamentos decide si el Estado llega al norte o si el norte sigue siendo de ellos."
 gg_prewar.4.f:0 "Un departamento es una firma en Montevideo y un hombre a caballo en la cuchilla."
 gg_prewar.4.a:0 "Jefes políticos nombrados por el gobierno."
 gg_prewar.4.b:0 "Que los encabecen los caudillos del lugar."
 gg_prewar.5.t:0 "Yucutujá"
 gg_prewar.5.d:0 "Rivera volvió. Cruzó por el Cuaró con setecientos ochenta y cinco hombres y cuatro piezas, y antes mandó al coronel Luna con doscientos a despistarnos sobre el lugar de la invasión y a ir levantando a los partidos. Con él vienen Lavalle, Enrique Martínez, José María Luna y Anacleto Medina, y detrás están los riograndenses de Piratini.\n\nEl presidente salió al norte con el grueso del ejército a buscarlo. Son unos ochocientos de cada lado. Rivera no busca el choque de frente: busca que lo pasemos de largo, para caernos por los flancos.\n\nSe lo puede buscar donde está, o replegarse al centro y obligarlo a venir."
 gg_prewar.5.f:0 "Potrero de Yucutujá, 22 de octubre de 1837."
 gg_prewar.5.a:0 "Buscarlo en el norte y presentar batalla."
 gg_prewar.5.b:0 "Replegarse al centro y esperar que venga."
 gg_prewar.6.t:0 "La acción del Yí"
 gg_prewar.6.d:0 "Sobre el Yí las fuerzas del gobierno alcanzaron a Rivera y lo derrotaron. Después de Yucutujá, la campaña vuelve a respirar.\n\nPero Rivera no se deshace. Lo que pierde en un campo lo repone del otro lado de la frontera, donde los riograndenses le dan caballos y le cubren la retirada, y los unitarios le ponen oficiales que saben pelear: Pirán, Chilavert, Hornos, Juan Apóstol Martínez. Hoy corre; mañana vuelve con otro ejército.\n\nSe lo puede perseguir hasta la frontera, con el riesgo de llegar a ella cansados, o afirmar lo que se tiene antes de que vuelva."
 gg_prewar.6.f:0 "Una revancha, no un final."
 gg_prewar.6.a:0 "Perseguirlo hasta la frontera."
 gg_prewar.6.b:0 "Afirmar la campaña y esperar."
 gg_prewar.7.t:0 "Las velas de Leblanc"
 gg_prewar.7.d:0 "El 21 de febrero llegó a Montevideo el contraalmirante Leblanc, y desde marzo su escuadra bloquea Buenos Aires, con buques en los fondeaderos del Salado, del Tuyú, de la Ensenada y de Martín García. Algunas de las goletas que usa las compró acá.\n\nAhora el comandante francés pide lo que le falta: usar el puerto de Montevideo como base. Rosas es nuestro aliado en esta guerra, y Rivera está en armas en la campaña. Francia no dice qué va a hacer si le decimos que no, pero no hace falta: una escuadra que no encuentra puerto en un gobierno busca otro gobierno que se lo dé.\n\nDecir que no es quedar del lado de la Confederación frente a la escuadra francesa. Decir que sí es romper con Buenos Aires."
 gg_prewar.7.f:0 "En el Plata, el que tiene el agua tiene la guerra."
 gg_prewar.7.a:0 "No. El puerto de Montevideo no es base de nadie."
 gg_prewar.7.b:0 "Tratar con Francia."
 gg_prewar.8.t:0 "La Universidad Mayor"
 gg_prewar.8.d:0 "La ley del 11 de junio de 1833, la que propuso en el Senado el presbítero Dámaso Antonio Larrañaga, creó nueve cátedras y le dejó al presidente de la República una tarea: decretar la universidad cuando la mayoría estuviera funcionando. La Casa de Estudios Generales ya dicta latín, filosofía, matemáticas, teología y jurisprudencia.\n\nLa condición se cumplió en el peor momento. Rivera tiene la campaña en armas, la escuadra francesa está en el río y el Tesoro no alcanza para el ejército. Un decreto no cuesta nada. Una universidad que funcione, sí.\n\nLo que se firme hoy puede quedar en el papel. Pero va a quedar firmado, y el que tenga la capital cuando vuelva la paz lo va a encontrar."
 gg_prewar.8.f:0 "Una república que se piensa a sí misma también se defiende."
 gg_prewar.8.a:0 "Decrétese la Universidad Mayor de la República."
 gg_prewar.8.b:0 "Después de la guerra."
 gg_prewar.9.t:0 "Palmar"
 gg_prewar.9.d:0 "Rivera baja con su ejército y los riograndenses, y con él viene Lavalle con los oficiales unitarios: Pirán en la artillería, Chilavert, Hornos, Enrique Martínez. Enfrente están Ignacio Oribe y el general Lavalleja, con el último ejército que le queda a este gobierno en la campaña.\n\nEl lugar es el arroyo del Palmar, en Paysandú. Nuestra caballería es buena y lo sabe: si carga primero, puede arrastrar a la de ellos. Pero si del otro lado Lavalle toma el mando y los mantiene al alcance de los cañones de Pirán, una tarde alcanza para perderlo todo.\n\nNo hay otro ejército detrás de éste."
 gg_prewar.9.f:0 "Arroyo del Palmar, 15 de junio de 1838."
 gg_prewar.9.a:0 "Que Ignacio Oribe dé la batalla."
 gg_prewar.9.b:0 "Negarle la batalla y replegarse con el ejército entero."
 gg_prewar_state_chiefs:0 "Jefes políticos del gobierno"
 gg_prewar_local_caudillos:0 "Caudillos al frente de los departamentos"
 gg_prewar_north_lost:0 "El norte responde a Rivera"
 gg_artigas_letter:0 "Una carta a Curuguaty"
 gg_prewar.5.d_closed:0 "Rivera volvió. Cruzó por el Cuaró con setecientos ochenta y cinco hombres y cuatro piezas, y antes mandó al coronel Luna con doscientos a despistarnos sobre el lugar de la invasión. Con él vienen Lavalle, Enrique Martínez, José María Luna y Anacleto Medina.\n\nLo que no trae es todo lo que esperaba del otro lado. Este gobierno ayudó al Imperio a cerrar la frontera, y los riograndenses le dieron menos caballos y menos gente de los que le habían prometido. Son unos ochocientos de cada lado, y el presidente salió al norte con el grueso del ejército a buscarlo.\n\nSe lo puede buscar donde está, o replegarse al centro y obligarlo a venir."
 gg_prewar.5.d_local:0 "Rivera volvió. Cruzó por el Cuaró con setecientos ochenta y cinco hombres y cuatro piezas, y antes mandó al coronel Luna con doscientos a levantar a los partidos del norte.\n\nLos partidos no se levantaron como esperaba. Los caudillos que este gobierno puso al frente de Tacuarembó y de Salto tienen ahora algo que perder, y muchos se quedaron en sus casas. Con Rivera vienen Lavalle, Enrique Martínez, José María Luna, Anacleto Medina y los riograndenses de Piratini: unos ochocientos, tantos como los nuestros.\n\nSe lo puede buscar donde está, o replegarse al centro y obligarlo a venir."
 gg_prewar.5.a_tt:0 "@information! Puntaje de la guerra: de #P +1#! a #P +4#! para los #R colorados#!, según cuánta gente siguió a Rivera (la frontera y los departamentos nuevos pesan)."
 gg_prewar.9.d_ahead:0 "Rivera baja con su ejército y los riograndenses, y con él viene Lavalle con los oficiales unitarios: Pirán en la artillería, Chilavert, Hornos, Enrique Martínez. Enfrente están Ignacio Oribe y el general Lavalleja, con el último ejército que le queda a este gobierno en la campaña.\n\nPero esta vez la campaña es nuestra. Después de Yucutujá y del Yí, los partidos del norte responden al gobierno, y Rivera necesita la batalla más que nosotros: sin una victoria, los riograndenses se cansan de pagarle la guerra. Ignacio Oribe puede negársela y guardar el ejército entero.\n\nEl arroyo del Palmar, en Paysandú, es el lugar que eligió Rivera. No tiene por qué ser el nuestro."
 gg_prewar.1.b_tt:0 "@information! Lavalle se queda neutral más tiempo: si la República entra en guerra con Rosas, él llega medio año más tarde."
 gg_prewar.2.b_tt:0 "@information! Cuando Rivera vuelva a invadir, los riograndenses le van a dar menos gente."
 gg_prewar.4.a_tt:0 "@information! Los caudillos del norte pierden su lugar: cuando Rivera vuelva a invadir, lo va a seguir más gente."
 gg_prewar.4.b_tt:0 "@information! Los caudillos del norte tienen algo que perder: cuando Rivera vuelva a invadir, lo va a seguir menos gente."
 gg_prewar.7.b_tt:0 "@information! Francia no toca la flotilla del gobierno: cuando caiga Oribe, los #blue_value blancos#! conservan más fuerza (#P +1#! al puntaje #blue_value blanco#!)."
 gg_prewar.8.a_tt:0 "@information! La Universidad queda decretada: en 1849, el gobierno que tenga Montevideo podrá inaugurarla."
 gg_prewar.9.b_tt:0 "@information! La derrota se achica. Si Oribe no renuncia cuando caiga su gobierno, el ejército entero le suma 2 al puntaje #blue_value blanco#!."
 guerra_grande.2.b_tt:0 "@information! Oribe no renuncia y se sostiene unos meses más. Al final cae igual, pero lo que se haya guardado (Palmar evitado) cuenta para los #blue_value blancos#!."
