l_spanish:
 gg_fort_french_supply:0 "Fuerte abastecido por Francia"
 gg_fort_french_supply_desc:0 "Las armas y el hierro de las baterías de Montevideo llegan en barcos franceses y por cuenta de Francia, mientras sostiene a la Defensa."
 gg_defensor_de_las_leyes:0 "Defensor de las Leyes"
 gg_defensor_de_las_leyes_desc:0 "Así lo llama su partido: el presidente que juró la Constitución de 1830 y piensa responder por ella."
 gg_cerrito_army_forming:0 "Se forma el ejército sitiador"
 gg_cerrito_army_forming_desc:0 "El Cerrito levanta sus batallones en plena guerra: veteranos del Ejército Unido, milicias de los departamentos y reclutas que llegan cada semana."
 gg_cerrito_lives_off_the_land:0 "El sitio vive de la campaña"
 gg_cerrito_lives_off_the_land_desc:0 "Las reses de las estancias y los saladeros del Buceo alimentan las líneas del Cerrito: el ejército sitiador come de su propia campaña y no espera convoyes."
 gg_defensa_city_in_arms:0 "La ciudad en armas"
 gg_defensa_city_in_arms_desc:0 "Guardias nacionales, batallones de libertos, milicias urbanas y los voluntarios de las legiones: en febrero de 1843 Montevideo tiene unos seis mil quinientos hombres armados detrás de sus líneas."
 gg_brazil_stays_out:0 "El Imperio se queda afuera"
 gg_brazil_stays_out_desc:0 "Río de Janeiro mira la guerra del Plata sin entrar en ella: la alianza que proyectó Sinimbú en 1845 no pasa del papel, y el ejército imperial recién cruzará la frontera en 1851."
 ai_strategy_gg_siege_caution:0 "Prudencia del sitio"
