l_spanish:
 gg_legion_paid_by_france_tt:0 "@information! El refuerzo lo paga #b Francia#!, que sostiene a la Defensa: la plaza no pone plata."
 gg_lent_squadron_french_supply:0 "Escuadra abastecida por Francia"
 gg_lent_squadron_french_supply_desc:0 "Los barcos que las potencias le prestan a la Defensa los aprovisiona Francia: la plaza no paga sus pertrechos."
 gg_plata.31.t:0 "Los ríos cerrados"
 gg_plata.31.d:0 "Con la convención Mackau, Francia levantó su bloqueo y se llevó sus buques. El río es otra vez nuestro, y la plaza de Montevideo sigue siendo el puerto de Rivera y de los emigrados unitarios.\n\nPodemos cerrar el Paraná y el Uruguay, dar patentes de corso contra toda embarcación que salga de un puerto oriental y declarar bloqueado Montevideo. La escuadra está a mano: la manda el brigadier Guillermo Brown."
 gg_plata.31.f:0 "Enero de 1841: el Paraná y el Uruguay, cerrados."
 gg_plata.31.a:0 "Cerrar los ríos y bloquear Montevideo."
 gg_plata.31.b:0 "Dejar el río abierto por ahora."
 gg_plata.31.b_tt:0 "@information! El río sigue abierto. La cuestión vuelve cuando el gobierno de Oribe lo pida."
 # EN/ES: playtest 22/9 -- the powers before the partition / las potencias antes de la particion
 gg_war_ui_sec_powers_pre_tt:0 "Mientras la República no se parta, ninguna potencia paga ni cuenta para el río: cada una se mide frente al gobierno de Montevideo y la causa colorada como #b Espectadora#!, #b Protectora#! o #b Garante#!, y esa es la postura con que entrará en la guerra si la República se parte.\n· #b Espectadora#!: no pagará a la Defensa ni respaldará su guerra.\n· #b Protectora#!: pagará y respaldará la guerra; ante un río cerrado, su paciencia correrá solo junto a la de la otra potencia.\n· #b Garante#!: pagará y respaldará la guerra; su paciencia correrá aunque vaya sola.\nEntre hito y hito, cada decisión de los eventos sube o baja el compromiso."
 gg_tt_patron_francia_pre_2:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia se juega hoy por los colorados (#b Garante#!). Todavía no paga: si la República se parte, le pagará a la Defensa cada mes, respaldará su guerra y, ante un río cerrado, su paciencia correrá aunque Londres no la acompañe."
 gg_tt_patron_francia_pre_1:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia se inclina hoy por los colorados (#b Protectora#!). Todavía no paga: si la República se parte, le pagará a la Defensa cada mes y respaldará su guerra; ante un río cerrado, su paciencia correrá solo si Londres la acompaña."
 gg_tt_patron_francia_pre_0:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia se aparta hoy de la cuestión oriental (#b Espectadora#!): si la República se parte, no le pagará a la Defensa ni respaldará su guerra."
 gg_tt_patron_britania_pre_2:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña se juega hoy por los colorados (#b Garante#!). Si la República se parte, respaldará la guerra de la Defensa, aunque no le pague, y ante un río cerrado su paciencia correrá junto a la de París."
 gg_tt_patron_britania_pre_1:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña se inclina hoy por los colorados (#b Protectora#!). Si la República se parte, respaldará la guerra de la Defensa, aunque no le pague, y ante un río cerrado su paciencia correrá junto a la de París. Londres nunca actúa sin París."
 gg_tt_patron_britania_pre_0:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña se aparta hoy de la cuestión oriental (#b Espectadora#!): si la República se parte, no respaldará la guerra de la Defensa."
 gg_tt_patron_brasil_pre_2:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio se juega hoy por los colorados (#b Garante#!). Todavía no paga: si la República se parte, le pagará a la Defensa cada mes y respaldará su guerra."
 gg_tt_patron_brasil_pre_1:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio se inclina hoy por los colorados (#b Protector#!). Todavía no paga: si la República se parte, le pagará a la Defensa cada mes y respaldará su guerra."
 gg_tt_patron_brasil_pre_0:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio mira hoy la cuestión oriental desde afuera (#b Espectador#!): si la República se parte, no le pagará a la Defensa ni respaldará su guerra. Antes de 1850 no cuenta."
