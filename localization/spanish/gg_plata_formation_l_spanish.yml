 # 24/9/2026 (Juan) -- formar La Plata (PLT): common/country_formation/zz_guerra_grande_formables.txt, common/scripted_triggers/gg_plata_formation.txt
 gg_plt_form_mandatory_tt:0 "Toda la costa oriental, #b Montevideo, San José, Maldonado, Cerro Largo#! y #b Paysandú#!, y las dos mitades del Paraguay, el #b Alto#! y el #b Bajo#!, en nuestras manos o en las de un gobierno ligado a nosotros que se sumará a la unión: las #V 7#!, sin excepción"
 gg_plt_form_provinces_tt:0 "Al menos #V 10#! de las #V 14#! provincias viejas de la Confederación, en nuestras manos o en las de un gobierno ligado a nosotros que se sumará a la unión: #b Buenos Aires, Santa Fe, Entre Ríos, Corrientes, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, Mendoza#! y #b San Luis#!. Por cada una que falte puede valer una tierra de frontera, #b La Pampa, Neuquén, Río Negro, Chubut, Santa Cruz, Tierra del Fuego, Misiones, el Chaco, Formosa#! o #b Río Grande del Sur#!, si se tiene de la misma manera y está poblada en al menos un #V 75%#!; la tierra que todavía se abre por debajo de esa parte no cuenta, y ninguna se exige"
