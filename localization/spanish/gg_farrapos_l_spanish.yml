l_spanish:

# ES: la guerra de los Farrapos (1835-1845) y sus lazos orientales. 23/9/2026 (Juan, balance A + I2).
# EN: the Ragamuffin War and its Oriental links.
 dp_gg_farrapos:0 "Guerra de los Farrapos"
 gg_farrapos.3.t:0 "Ponche Verde"
 gg_farrapos.3.d:0 "El 25 de febrero, en Ponche Verde, Antônio Vicente da Fontoura les leyó a los jefes republicanos las doce condiciones que traía de la Corte. El 28, David Canabarro y Manuel Lucas de Oliveira firmaron el acta, y la República Rio-Grandense que Netto proclamó el 11 de setiembre de 1836 dejó de existir. No hay un tratado entre dos partes: el Imperio nunca reconoció a la República. Hay un decreto de amnistía del 18 de diciembre y unas instrucciones reservadas.\n\nLas condiciones son estas: olvido pleno y ningún proceso, libertad de los prisioneros, la deuda pública de la República garantizada por el Imperio, los oficiales al ejército imperial con sus grados, salvo los generales, los soldados exentos del reclutamiento y la libertad de los esclavos que sirvieron en las filas republicanas. Canabarro se lo explicó a los suyos sin rodeos: «la continuación de una guerra sería el ultimátum de la destrucción y del aniquilamiento de nuestra tierra», y señaló un «poder extraño» que amenaza la integridad del Imperio.\n\nEse poder está en el Plata. El barón de Caxias va a proclamar la paz el 1 de marzo, y la provincia que peleó nueve años contra el Imperio pasa a ser su frontera con Rosas y con Oribe. Lo que se cumpla de lo reservado decide con qué ánimo la va a guardar."
 gg_farrapos.3.f:0 "«Maldición eterna a quien se acuerde de nuestras disensiones.» Barón de Caxias, 1 de marzo de 1845."
 gg_farrapos.3.a:0 "Cumplir los doce artículos, también los reservados."
 gg_farrapos.3.a_tt:0 "@information! El Tesoro carga con la deuda de la República, y sus oficiales entran al ejército con sus grados: la provincia pone su caballería al servicio del Imperio."
 gg_farrapos.3.b:0 "El decreto de amnistía, y nada más."
 gg_farrapos.3.b_tt:0 "@warning! Se ahorra la deuda, pero la provincia queda en paz sin quedar ganada: nada de lo reservado se cumple."
 gg_farrapos.4.t:0 "La paz de Ponche Verde"
 gg_farrapos.4.d:0 "Llegan de Río Grande las proclamas del 28 de febrero y del 1 de marzo. La República Rio-Grandense se terminó sin una última batalla: Canabarro y Lucas de Oliveira firmaron un acta, y el barón de Caxias proclamó la paz desde la costa del Santa María. El Emperador mandó olvidar lo pasado, y Caxias promete cumplirlo «bajo mi palabra de honor».\n\nDurante nueve años esa guerra fue nuestra frontera. Por acá pasaron sus caballadas, su charque y sus jefes; Bento Gonçalves y el general Rivera se conocen desde el ejército portugués. Ahora Canabarro les habla a los suyos de un «poder extraño» que amenaza la integridad del Imperio, y en Río de Janeiro nadie duda de cuál es.\n\nEl Imperio tiene a Caxias, a su ejército y a los oficiales republicanos con sus grados, todos sobre nuestra frontera y ninguno con una guerra propia que atender. Lo que haga con eso lo va a decidir mirando a Rosas."
 gg_farrapos.4.f:0 "«Uma só vontade nos una, rio-grandenses.»"
 gg_farrapos.4.a:0 "Que el ministro en Río sepa aprovecharla."
 gg_farrapos.6.t:0 "Caxias en la frontera"
 gg_farrapos.6.d:0 "En noviembre de 1842 el barón de Caxias asumió la presidencia de Río Grande y el mando de las armas. Encontró once mil quinientas cuarenta y nueve plazas imperiales, cuatro mil quinientas de ellas de guarnición, contra unos tres mil quinientos republicanos que, cuando los apuran, cruzan a la Banda Oriental, donde Rivera los ampara, y vuelven con caballos.\n\nLo primero que hizo fue escribirle al general Oribe. Propone un acuerdo para que los republicanos no atraviesen la frontera, y quiere comprar caballadas en nuestra campaña para una caballería que él mismo reconoce inferior. En Río de Janeiro se habla ya de una alianza con la Confederación para restablecer la paz en la República Oriental y en la provincia de Río Grande a la vez, contra los rebeldes que se han «aliado y unido a Fructuoso Rivera».\n\nCerrarle la frontera a Piratini es hacerle un favor al Imperio, que hasta hoy sostiene a los colorados. Dejarla abierta es dejarle a Rivera sus amigos del otro lado."
 gg_farrapos.6.f:0 "Una frontera que el ganado cruza de noche."
 gg_farrapos.6.a:0 "Que los republicanos no pasen la línea."
 gg_farrapos.6.b:0 "La frontera es asunto de esta República."
 gg_prewar.9.c:0 "Que Ignacio Oribe dé la batalla, y aceptar el tratado que ofrece la Regencia."
 gg_prewar.9.c_tt:0 "@information! Los republicanos que cruzan son perseguidos de este lado: Rivera recibe menos de Piratini y lo que firme con ellos queda en el papel."
 gg_prewar.9.a_cangue_tt:0 "@information! Con la campaña en la mano, Rivera queda libre para pactar con Piratini: tres mil caballos para su caballería de línea y una fuerza en Santa Teresa contra los abastos del Imperio."
 gg_phase1.7.d_nopni:0 "El 28 de noviembre pasado José María Paz, el Manco, deshizo a Echagüe en Caaguazú, y Entre Ríos quedó con un gobernador nuevo, Justo José de Urquiza. Paz se nombró a sí mismo gobernador de Entre Ríos, y en febrero los representantes de Paz, de Pedro Ferré, de Juan Pablo López y de Rivera acordaron seguir la guerra con un objetivo preciso: un Estado nuevo con Entre Ríos, Corrientes, Santa Fe y la Banda Oriental. Río Grande, que alguna vez se pensó sumar, volvió a ser del Imperio.\n\nHoy, en Paysandú, los jefes de la alianza le ofrecen a Rivera el mando supremo de los ejércitos. Paz no lo toma bien. Nadie en Entre Ríos lo reconoce como gobernador, y el almirante Brown ya barrió del río la flotilla de Garibaldi.\n\nMandar la coalición es quedar a cargo de todo lo que salga mal."
 gg_phase1.8.c:0 "Cruzar con los riograndenses de Netto: dos mil caballos por setecientos hombres."
 gg_phase1.8.c_tt:0 "@information! Se cumple el tratado de San Fructuoso: quinientos infantes y doscientos jinetes libertos, al mando de Netto, cruzan con Rivera, y los caballos van a Río Grande. Si el cruce sale mal, la derrota cuesta menos."
 gg_tt_farrapos_refuge_-3:0 "@arrow_down! El refugio oriental de los farrapos se #N cierra#!: ni paso por la frontera ni caballadas."
 gg_tt_farrapos_refuge_-1:0 "@arrow_down! El refugio oriental de los farrapos baja #N un escalón#!."
 gg_tt_farrapos_refuge_0:0 "@information! El refugio oriental de los farrapos queda como está."
 gg_tt_farrapos_refuge_1:0 "@arrow_up! El refugio oriental de los farrapos sube #P un escalón#!."
 gg_tt_farrapos_refuge_means:0 "@information! Lo que vale el refugio oriental: #b cerrado#!, el Imperio tiene atadas en Río Grande tropas por #V -5%#! de ofensiva de su ejército y #V +5%#! de costo en pertrechos; #b vigilado#!, #V -10%#! y #V +10%#!, y la República Riograndense gana #V +5#! de legitimidad; #b abierto#!, #V -15%#!, #V +15%#! y #V +10#!; #b aliado#!, #V -20%#!, #V +20%#! y #V +15#!. Todo eso se termina en Ponche Verde."
 gg_farrapos_refuge_1:0 "Refugio oriental: vigilado"
 gg_farrapos_refuge_1_desc:0 "La frontera con el Estado Oriental está vigilada, pero no cerrada: cuando los apuran, los republicanos cruzan y vuelven con caballos."
 gg_farrapos_refuge_2:0 "Refugio oriental: abierto"
 gg_farrapos_refuge_2_desc:0 "Del otro lado de la línea nadie los persigue. Las caballadas, el charque y los jefes van y vienen por la frontera."
 gg_farrapos_refuge_3:0 "Refugio oriental: aliado"
 gg_farrapos_refuge_3_desc:0 "La campaña oriental es la retaguardia de la República: caballos por tratado, paso libre y amigos en el gobierno de Montevideo."
 gg_ponche_verde_officers:0 "Los oficiales de Ponche Verde"
 gg_ponche_verde_officers_desc:0 "Los oficiales republicanos entraron al ejército imperial con sus grados. Conocen la campaña y la frontera mejor que nadie."
 gg_ponche_verde_decree_only:0 "Solo el decreto"
 gg_ponche_verde_decree_only_desc:0 "De Ponche Verde se cumplió la amnistía y nada más. Río Grande está en paz, pero no está conforme."
 gg_farrapos_tied_down_0:0 "Tropas atadas en Río Grande"
 gg_farrapos_tied_down_0_desc:0 "El Imperio tiene la costa y las ciudades —Porto Alegre desde junio de 1836, el puerto de Rio Grande— y los republicanos tienen la campaña. Aun con la frontera oriental cerrada, la provincia se come batallones y pertrechos que no pueden ir a otra parte."
 gg_farrapos_tied_down_1:0 "Tropas atadas en Río Grande"
 gg_farrapos_tied_down_1_desc:0 "El Imperio tiene la costa y las ciudades; los republicanos, la campaña, y cuando los apuran cruzan a la Banda Oriental y vuelven con caballos. En 1842 Caxias va a encontrar allí once mil quinientas plazas imperiales contra unos tres mil quinientos republicanos."
 gg_farrapos_tied_down_2:0 "Tropas atadas en Río Grande"
 gg_farrapos_tied_down_2_desc:0 "Del otro lado de la línea nadie persigue a los republicanos, y las caballadas y el charque van y vienen por la frontera. Para no perder la provincia, el Imperio tiene que dejar en ella cada vez más batallones y más barcos."
 gg_farrapos_tied_down_3:0 "Tropas atadas en Río Grande"
 gg_farrapos_tied_down_3_desc:0 "La campaña oriental es la retaguardia de la República Riograndense. Al final de la guerra, la mitad del ejército y de la armada del Imperio van a estar en la provincia: mientras tanto, no hay tropas imperiales para el Plata."
 war_goal_gg_ponche_verde_type_name:0 "Ponche Verde"
 war_goal_gg_ponche_verde_type_desc:0 "La paz de Ponche Verde: la República Riograndense vuelve al Imperio con amnistía, sus oficiales con sus grados y su deuda pagada."
 war_goal_gg_ponche_verde:0 "Ponche Verde: [WAR_GOAL_DRAFT.GetTarget.GetName] vuelve al Imperio"
