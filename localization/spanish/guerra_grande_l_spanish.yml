 guerra_grande_upper_hand:0 "La mano de arriba"
 guerra_grande_upper_hand_desc:0 "Cinco batallas de ventaja. El otro bando está cediendo terreno, y en la República no hay quien no lo vea."
 guerra_grande_losing_ground:0 "Cediendo terreno"
 guerra_grande_losing_ground_desc:0 "Cinco batallas atrás. Las estancias están leyendo bien la guerra y empiezan a cubrirse."
