# 1 - Carpintería, 19 de setiembre de 1836
 guerra_grande.1.t:0 "Las divisas de Carpintería"
 guerra_grande.1.d:0 "En agosto el Presidente decretó que toda la población, militar y civil, llevara en el sombrero o en la ropa una divisa blanca con el lema «Defensores de las Leyes» —el mismo blanco de las vinchas de los patriotas de 1811—. Los rebeldes de Rivera contestaron con el celeste de la escarapela nacional, pero el sol y la lluvia lo destiñeron hasta dejarlo blanco, así que cortaron divisas nuevas del forro colorado de los ponchos.\n\nEn las costas del arroyo Carpintería, en Durazno, los dos bandos se encontraron por fin: tres mil hombres de Oribe y Lavalleja contra mil cuatrocientos de Rivera y del unitario argentino exiliado Juan Lavalle. El gobierno ganó el campo. Lo que nació ahí sobrevivió a todos los que pelearon: desde hoy la República tiene dos partidos, y a cada estancia, parroquia y regimiento se le va a preguntar qué divisa lleva."
 guerra_grande.1.f:0 "Blancos y colorados, y el país en el medio."
 guerra_grande.1.a:0 "La divisa blanca: las leyes, la iglesia y la campaña."
 guerra_grande.1.b:0 "La divisa colorada: el puerto, la prensa y la causa liberal."
 guerra_grande.1.c:0 "La República no lleva divisa ninguna."

# 2 - La caída de Oribe, 24 de octubre de 1838
 guerra_grande.2.t:0 "La caída de Oribe"
 guerra_grande.2.d:0 "Una escuadra francesa bloquea Buenos Aires, la caballada de Rivera está en las puertas y al Presidente se le acabaron la plata y los amigos. Manuel Oribe puede renunciar y embarcarse para Buenos Aires —donde Rosas va a seguir recibiéndolo como presidente legal del Uruguay, y donde espera por armarse un gobierno del Cerrito— o puede quedarse y hacer de la capital una fortaleza."
 guerra_grande.2.f:0 "Un presidente con dos salidas de la ciudad."
 guerra_grande.2.a:0 "Que renuncie. Los colorados toman el gobierno."
 guerra_grande.2.b:0 "No renuncia. Los blancos conservan el Estado."

# 3 - La partición
 guerra_grande.3.t:0 "Empieza la Guerra Grande"
 guerra_grande.3.d:0 "La República se parte en dos. Tras los muros queda la Defensa, con la aduana, el comercio extranjero y el mar; en la falda del Cerrito, al lado de la Villa de la Restauración, queda el gobierno de Oribe, con el ganado, los caudillos y Rosas atrás. Reinstaló las Cámaras que Rivera había disuelto en 1838 y les hizo renovar su mandato, de modo que los dos gobiernos pueden llamarse legales y ninguno tiene lugar para el otro.\n\n«El ejército de Rosas está delante de esta capital —dice el decreto de la Defensa el día en que empieza el sitio—. El Gobierno cuenta con el patriotismo de sus habitantes: reposa en él y en la victoria»."
 guerra_grande.3.f:0 "Dos gobiernos, nueve años, un solo país."
 guerra_grande.3.a:0 "Montevideo va a resistir."
 guerra_grande.3.b:0 "Salir al Cerrito con Oribe."

# 4 - Rosas
 guerra_grande.4.t:0 "Rosas y el Cerrito"
 guerra_grande.4.d:0 "Oribe escribe desde el Cerrito como presidente legal del Uruguay y pide lo que se le prometió en el destierro: hombres, plata y ganado. Respaldarlo mete a la Confederación en una guerra en la otra orilla y nos trae encima las escuadras inglesa y francesa —pero la otra orilla nunca fue un asunto extranjero, y un gobierno amigo en Montevideo cerraría el Plata a los unitarios para siempre."
 guerra_grande.4.f:0 "La otra orilla siempre fue asunto nuestro."
 guerra_grande.4.a:0 "Respaldar a Oribe. El Plata es un solo país."
 guerra_grande.4.b:0 "Que lo arreglen entre ellos."

# 5 - La Legión Italiana
 guerra_grande.5.t:0 "Las camisas rojas de Montevideo"
 guerra_grande.5.d:0 "La legión ya tiene jefe: Giuseppe Garibaldi, un marino de Niza condenado a muerte en Génova, que vino al Plata a corsear para Rio Grande y se quedó. Sus hombres hacen la instrucción con las camisas que nadie más quería: una partida de blusas coloradas de trabajo destinadas a los saladeros de la Confederación, que la guerra dejó varada acá. Dentro de dieciséis años esa misma camisa se va a usar en Sicilia."
 guerra_grande.5.f:0 "Un uniforme comprado de casualidad y conservado a propósito."
 guerra_grande.5.a:0 "Que salgan a la línea."

