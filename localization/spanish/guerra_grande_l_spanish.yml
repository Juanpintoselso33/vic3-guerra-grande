# 9 - Intervención
 guerra_grande.9.t:0 "Las escuadras entran al Plata"
 guerra_grande.9.d:0 "Los buques de guerra ingleses y franceses forzaron el río. Todos los puertos de la Confederación quedan cerrados al comercio menos el nuestro, los convoyes llegan a la plaza sitiada y las potencias dejaron en claro qué están comprando: la libre navegación del Paraná y del Uruguay para sus mercantes, una vez que se dejen de tirar tiros."
 guerra_grande.9.f:0 "El río es de quien pueda navegarlo."
 guerra_grande.9.a:0 "Que vengan."

# 11 - Retrato: Manuel Oribe
 guerra_grande.11.t:0 "El presidente y las leyes"
 guerra_grande.11.d:0 "Manuel Oribe nació en Montevideo en 1792, entró a la revolución de muchacho y fue segundo jefe de los Treinta y Tres: Lavalleja los mandaba, Oribe organizó el cruce. Es hombre de logia, de los Caballeros Orientales, y legalista hasta el hueso: cuando Lavalleja se alzó contra el presidente Rivera en 1832 y otra vez en 1834, fue Oribe el que sostuvo al gobierno que no quería, porque era el legal.\n\nEn eso se resume: el culto a la disciplina y a la autoridad, y una divisa que dice Defensores de las Leyes. A Rosas ya le dijo que no una vez, cuando Buenos Aires insinuó que la Banda Oriental podía volver a la Confederación Argentina."
 guerra_grande.11.f:0 "Un presidente que prefiere que lo obedezcan antes que lo quieran."
 guerra_grande.11.a:0 "La ley está por encima del hombre."
 guerra_grande.11.b:0 "Una república no es un cuartel."

# 12 - Retrato: Juan Antonio Lavalleja
 guerra_grande.12.t:0 "El jefe de los Treinta y Tres"
 guerra_grande.12.d:0 "El 19 de abril de 1825 Juan Antonio Lavalleja desembarcó en la playa de la Agraciada con treinta y tres hombres y prendió fuego a toda la campaña; el Congreso de la Florida lo hizo Capitán General. Lo que vino después fue menos generoso. Rivera se quedó con la presidencia que él creía suya, y Lavalleja se alzó contra Rivera en 1832 y en 1834, y perdió las dos veces, fácil.\n\nEn Carpintería peleó del lado del gobierno, como casi todos los hombres de los Treinta y Tres. Hoy es leal a las leyes y a sí mismo, y nadie tiene del todo claro en qué orden."
 guerra_grande.12.f:0 "El hombre que empezó todo y no terminó nada."
 guerra_grande.12.a:0 "Darle mando. Se lo ganó dos veces."
 guerra_grande.12.b:0 "Ningún mando para los caudillos. La República se gobierna desde la capital."

# 13 - Retrato: Fructuoso Rivera
 guerra_grande.13.t:0 "Don Frutos"
 guerra_grande.13.d:0 "Fructuoso Rivera, criado en una estancia y con instrucción escasa, fue el jefe más eficaz que tuvo Artigas: golpes imprevisibles y la campaña en la mano. Cuando ganaron los portugueses firmó en Tres Árboles y sirvió al Barón de la Laguna, que le ofreció un título de barón que rechazó. Volvió con los Treinta y Tres en el abrazo del Monzón, se tomó las Misiones Orientales por cuenta propia, fue el primer presidente de la República y gobernó desde Durazno mientras unos abogados manejaban el Estado.\n\nEl cónsul británico Hood escribió de él en 1829: «Es un hombre sin ninguna clase de talento, pero es popular entre la mayoría del pueblo». Huyó hacia Porto Alegre, a la tierra de los farrapos, y va a volver."
 guerra_grande.13.f:0 "Derrotado en Carpintería, y lejos de terminado."
 guerra_grande.13.a:0 "Pedirle al Brasil que lo entregue."
 guerra_grande.13.b:0 "Que se le gaste el crédito en el destierro."

# 14 - Retrato: Artigas
 guerra_grande.14.t:0 "El viejo de Curuguaty"
 guerra_grande.14.d:0 "José Gervasio Artigas cruzó el Paraná en setiembre de 1820 con ciento cincuenta hombres y no volvió nunca. El doctor Francia le dio asilo y se encargó de que no viniera con política adentro: sin correspondencia, sin visitas, y dieciocho años en la villa de San Isidro de Curuguaty, que los paraguayos llaman su Siberia. El dictador jamás aceptó recibirlo.\n\nDicen que Francia le manda una onza de oro por mes y que él reparte la mayor parte entre los pobres del pueblo. Labra la tierra, reza el rosario al atardecer con los vecinos contestando en guaraní, y no pidió nada. Tiene setenta y cuatro años. La República que inventaron sus hombres acaba de ver caer a su presidente, y nadie en Montevideo le escribió."
 guerra_grande.14.f:0 "El padre de la patria, labrando la tierra de otra."
 guerra_grande.14.a:0 "Mandarle carta a Curuguaty."
 guerra_grande.14.b:0 "Que descanse el viejo. Esta guerra no es la suya."

