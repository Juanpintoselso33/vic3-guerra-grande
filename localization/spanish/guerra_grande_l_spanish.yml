# 1 - Carpintería, 19 de setiembre de 1836
 guerra_grande.1.t:0 "Las divisas de Carpintería"
 guerra_grande.1.d:0 "En agosto el Presidente decretó que toda la población, militar y civil, llevara en el sombrero o en la ropa una divisa blanca con el lema «Defensores de las Leyes» —el mismo blanco de las vinchas de los patriotas de 1811—. Los rebeldes de Rivera contestaron con el celeste de la escarapela nacional, pero el sol y la lluvia lo destiñeron hasta dejarlo blanco, así que cortaron divisas nuevas del forro colorado de los ponchos.\n\nEn las costas del arroyo Carpintería, en Durazno, los dos bandos se encontraron por fin: tres mil hombres de Oribe y Lavalleja contra mil cuatrocientos de Rivera y del unitario argentino exiliado Juan Lavalle. El gobierno ganó el campo. Lo que nació ahí sobrevivió a todos los que pelearon: desde hoy la República tiene dos partidos, y a cada estancia, parroquia y regimiento se le va a preguntar qué divisa lleva."
 guerra_grande.1.f:0 "Blancos y colorados, y el país en el medio."
 guerra_grande.1.a:0 "La divisa blanca: las leyes, la iglesia y la campaña."
 guerra_grande.1.b:0 "La divisa colorada: el puerto, la prensa y la causa liberal."
 guerra_grande.1.c:0 "La República no lleva divisa ninguna."

# 2 - La caída de Oribe, 24 de octubre de 1838
 guerra_grande.2.t:0 "La caída de Oribe"
 guerra_grande.2.d:0 "Una escuadra francesa bloquea Buenos Aires, la caballada de Rivera está en las puertas y al Presidente se le acabaron la plata y los amigos. Manuel Oribe puede renunciar y embarcarse para Buenos Aires —donde Rosas va a seguir recibiéndolo como presidente legal del Uruguay, y donde espera por armarse un gobierno del Cerrito— o puede quedarse y hacer de la capital una fortaleza."
 guerra_grande.2.f:0 "Un presidente con dos salidas de la ciudad."
 guerra_grande.2.a:0 "Que renuncie. Los colorados toman el gobierno."
 guerra_grande.2.b:0 "No renuncia. Los blancos conservan el Estado."

# 3 - La partición
 guerra_grande.3.t:0 "Empieza la Guerra Grande"
 guerra_grande.3.d:0 "La República se parte en dos. Tras los muros queda la Defensa, con la aduana, el comercio extranjero y el mar; en la falda del Cerrito, al lado de la Villa de la Restauración, queda el gobierno de Oribe, con el ganado, los caudillos y Rosas atrás. Reinstaló las Cámaras que Rivera había disuelto en 1838 y les hizo renovar su mandato, de modo que los dos gobiernos pueden llamarse legales y ninguno tiene lugar para el otro.\n\n«El ejército de Rosas está delante de esta capital —dice el decreto de la Defensa el día en que empieza el sitio—. El Gobierno cuenta con el patriotismo de sus habitantes: reposa en él y en la victoria»."
 guerra_grande.3.f:0 "Dos gobiernos, nueve años, un solo país."
 guerra_grande.3.a:0 "Montevideo va a resistir."
 guerra_grande.3.b:0 "Salir al Cerrito con Oribe."

# 4 - Rosas
 guerra_grande.4.t:0 "Rosas y el Cerrito"
 guerra_grande.4.d:0 "Oribe escribe desde el Cerrito como presidente legal del Uruguay y pide lo que se le prometió en el destierro: hombres, plata y ganado. Respaldarlo mete a la Confederación en una guerra en la otra orilla y nos trae encima las escuadras inglesa y francesa —pero la otra orilla nunca fue un asunto extranjero, y un gobierno amigo en Montevideo cerraría el Plata a los unitarios para siempre."
 guerra_grande.4.f:0 "La otra orilla siempre fue asunto nuestro."
 guerra_grande.4.a:0 "Respaldar a Oribe. El Plata es un solo país."
 guerra_grande.4.b:0 "Que lo arreglen entre ellos."

# 5 - La Legión Italiana
 guerra_grande.5.t:0 "Las camisas rojas de Montevideo"
 guerra_grande.5.d:0 "La legión ya tiene jefe: Giuseppe Garibaldi, un marino de Niza condenado a muerte en Génova, que vino al Plata a corsear para Rio Grande y se quedó. Sus hombres hacen la instrucción con las camisas que nadie más quería: una partida de blusas coloradas de trabajo destinadas a los saladeros de la Confederación, que la guerra dejó varada acá. Dentro de dieciséis años esa misma camisa se va a usar en Sicilia."
 guerra_grande.5.f:0 "Un uniforme comprado de casualidad y conservado a propósito."
 guerra_grande.5.a:0 "Que salgan a la línea."

# 6 - Ambiente: el sitio
 guerra_grande.6.t:0 "Las azoteas"
 guerra_grande.6.d:0 "Desde las azoteas de Montevideo se ve la línea: los fosos, las trincheras del Cerrito, el humo de los fogones del otro lado. Adentro la ciudad sigue: el puerto abierto, el mercado con lo que trae el agua, las imprentas de los emigrados. La mitad de los que están en la muralla nacieron en otro país."
 guerra_grande.6.f:0 "Una ciudad que aprendió a vivir sitiada."
 guerra_grande.6.a:0 "Que el mundo nos vea aguantar."

# 7 - Ambiente: la campaña
 guerra_grande.7.t:0 "Se acabaron las haciendas"
 guerra_grande.7.d:0 "Los dos ejércitos viven de la campaña, y la campaña se está acabando. A las estancias las deja sin ganado la columna que pase primero, y los peones que las trabajaban se van con el arreo: para un bando o para el otro, según el día."
 guerra_grande.7.f:0 "Una guerra pagada en cueros."
 guerra_grande.7.a:0 "El país va a pagar esto por una generación."

# 8 - La paz del 8 de octubre de 1851

# 9 - Intervención
 guerra_grande.9.t:0 "Las escuadras entran al Plata"
 guerra_grande.9.d:0 "Los buques de guerra ingleses y franceses forzaron el río. Todos los puertos de la Confederación quedan cerrados al comercio menos el nuestro, los convoyes llegan a la plaza sitiada y las potencias dejaron en claro qué están comprando: la libre navegación del Paraná y del Uruguay para sus mercantes, una vez que se dejen de tirar tiros."
 guerra_grande.9.f:0 "El río es de quien pueda navegarlo."
 guerra_grande.9.a:0 "Que vengan."

# 11 - Retrato: Manuel Oribe
 guerra_grande.11.t:0 "El presidente y las leyes"
 guerra_grande.11.d:0 "Manuel Oribe nació en Montevideo en 1792, entró a la revolución de muchacho y fue segundo jefe de los Treinta y Tres: Lavalleja los mandaba, Oribe organizó el cruce. Es hombre de logia, de los Caballeros Orientales, y legalista hasta el hueso: cuando Lavalleja se alzó contra el presidente Rivera en 1832 y otra vez en 1834, fue Oribe el que sostuvo al gobierno que no quería, porque era el legal.\n\nEn eso se resume: el culto a la disciplina y a la autoridad, y una divisa que dice Defensores de las Leyes. A Rosas ya le dijo que no una vez, cuando Buenos Aires insinuó que la Banda Oriental podía volver a la Confederación Argentina."
 guerra_grande.11.f:0 "Un presidente que prefiere que lo obedezcan antes que lo quieran."
 guerra_grande.11.a:0 "La ley está por encima del hombre."
 guerra_grande.11.b:0 "Una república no es un cuartel."

# 12 - Retrato: Juan Antonio Lavalleja
 guerra_grande.12.t:0 "El jefe de los Treinta y Tres"
 guerra_grande.12.d:0 "El 19 de abril de 1825 Juan Antonio Lavalleja desembarcó en la playa de la Agraciada con treinta y tres hombres y prendió fuego a toda la campaña; el Congreso de la Florida lo hizo Capitán General. Lo que vino después fue menos generoso. Rivera se quedó con la presidencia que él creía suya, y Lavalleja se alzó contra Rivera en 1832 y en 1834, y perdió las dos veces, fácil.\n\nEn Carpintería peleó del lado del gobierno, como casi todos los hombres de los Treinta y Tres. Hoy es leal a las leyes y a sí mismo, y nadie tiene del todo claro en qué orden."
 guerra_grande.12.f:0 "El hombre que empezó todo y no terminó nada."
 guerra_grande.12.a:0 "Darle mando. Se lo ganó dos veces."
 guerra_grande.12.b:0 "Ningún mando para los caudillos. La República se gobierna desde la capital."

# 13 - Retrato: Fructuoso Rivera
 guerra_grande.13.t:0 "Don Frutos"
 guerra_grande.13.d:0 "Fructuoso Rivera, criado en una estancia y con instrucción escasa, fue el jefe más eficaz que tuvo Artigas: golpes imprevisibles y la campaña en la mano. Cuando ganaron los portugueses firmó en Tres Árboles y sirvió al Barón de la Laguna, que le ofreció un título de barón que rechazó. Volvió con los Treinta y Tres en el abrazo del Monzón, se tomó las Misiones Orientales por cuenta propia, fue el primer presidente de la República y gobernó desde Durazno mientras unos abogados manejaban el Estado.\n\nEl cónsul británico Hood escribió de él en 1829: «Es un hombre sin ninguna clase de talento, pero es popular entre la mayoría del pueblo». Ahora está en Porto Alegre, entre los farrapos, y va a volver."
 guerra_grande.13.f:0 "Derrotado en Carpintería, y lejos de terminado."
 guerra_grande.13.a:0 "Pedirle al Brasil que lo entregue."
 guerra_grande.13.b:0 "Que se le gaste el crédito en el destierro."

# 14 - Retrato: Artigas
 guerra_grande.14.t:0 "El viejo de Curuguaty"
 guerra_grande.14.d:0 "José Gervasio Artigas cruzó el Paraná en setiembre de 1820 con ciento cincuenta hombres y no volvió nunca. El doctor Francia le dio asilo y se encargó de que no viniera con política adentro: sin correspondencia, sin visitas, y veinticinco años en la villa de San Isidro de Curuguaty, que los paraguayos llaman su Siberia. El dictador jamás aceptó recibirlo.\n\nDicen que Francia le manda una onza de oro por mes y que él reparte la mayor parte entre los pobres del pueblo. Labra la tierra, reza el rosario al atardecer con los vecinos contestando en guaraní, y no pidió nada. Tiene setenta y cuatro años. La República que inventaron sus hombres está por partirse al medio y nadie en Montevideo le escribió."
 guerra_grande.14.f:0 "El padre de la patria, labrando la tierra de otra."
 guerra_grande.14.a:0 "Mandarle carta a Curuguaty."
 guerra_grande.14.b:0 "Que descanse el viejo. Esta guerra no es la suya."

