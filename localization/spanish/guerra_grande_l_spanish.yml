# Grupos de interés rebautizados por las divisas de Carpintería
 ig_blanco_party:0 "Partido Blanco"
 ig_blanco_party_desc:0 "Los que llevaron la divisa blanca de Oribe con el lema «Defensores de las Leyes». Estancieros, curas de campaña y milicias del interior, que se dicen el gobierno legal y el partido del orden."
 ig_colorado_party:0 "Partido Colorado"
 ig_colorado_party_desc:0 "Los que llevaron la divisa de Rivera, cortada del forro colorado de los propios ponchos después de que la celeste de la escarapela nacional se destiñera al sol hasta quedar blanca. El puerto, la aduana, las imprentas y el comercio extranjero de Montevideo."

# Journal entry
 je_group_guerra_grande:0 "La Guerra Grande"
 je_guerra_grande:0 "La Guerra Grande"
 je_guerra_grande_desc:0 "Entre 1838 y 1851 la República tuvo dos gobiernos: el de #R la Defensa#!, encerrado en Montevideo, y el del #blue_value Cerrito#!, que Oribe instaló frente a la ciudad y que gobernó el resto del país. Cada uno se decía el gobierno legal.\n\n#b La cuenta de esta guerra#!\n• @battalions! Ninguna de las dos divisas piensa rendirse: se trata de llegar a la mesa pesando más que el otro. Cada batalla ganada, cada tratado y cada favor cobrado inclinan la balanza, y durante el sitio la inclina también el río: cada cuatro meses con el río cerrado valen un punto a los #blue_value blancos#!, cada cuatro con el río abierto uno a los #R colorados#!, hasta #V 4#! por lado.\n• Con #V 5#! de ventaja el que va arriba impone el ritmo y al otro se le empieza a notar el cansancio. Con #V 10#!, al de abajo no le queda más que sentarse a negociar.\n• Lo que se gane antes de 1843 se cobra en hombres: el día que la República se parta, el que venga arriba levantará el ejército más grande, y bastante más grande con #V 4#! o más. Los del #blue_value Cerrito#! serán jinetes de campaña; los de la #R Defensa#!, infantería detrás de los muros.\n• @information! Se sienta a negociar el gobierno al que se le acabe el aguante, al que le tomen media campaña, o al que le saquen #V 10#!; a la #R Defensa#! también #V 24#! meses de asedio. Desde 1851 alcanza con la mitad. Si nadie cede, las potencias impondrán sus condiciones, y para 1860 ya nadie se acordará de por qué se peleaba.\n• El que llegue arriba dicta la paz. Si el que la dicta es el #blue_value Cerrito#!, vuelve a haber una sola República Oriental del Uruguay.\n• @warning! Todo se pierde si una potencia extranjera se queda con Montevideo. Ni la Argentina ni el Imperio declararán la guerra: mandan hombres y plata, que es peor.\n\nDel río y de las escuadras se lleva cuenta aparte; del cerco, también."
