# Grupos de interés rebautizados por las divisas de Carpintería
 ig_blanco_party:0 "Partido Blanco"
 ig_blanco_party_desc:0 "Los que llevaron la divisa blanca de Oribe con el lema «Defensores de las Leyes». Estancieros, curas de campaña y milicias del interior, que se dicen el gobierno legal y el partido del orden."
 ig_colorado_party:0 "Partido Colorado"
 ig_colorado_party_desc:0 "Los que llevaron la divisa de Rivera, cortada del forro colorado de los propios ponchos después de que la celeste de la escarapela nacional se destiñera al sol hasta quedar blanca. El puerto, la aduana, las imprentas y el comercio extranjero de Montevideo."

# Journal entry
 je_group_guerra_grande:0 "La Guerra Grande"
 je_guerra_grande:0 "La Guerra Grande"
 je_guerra_grande_desc:0 "Entre 1843 y 1851 la República tuvo dos gobiernos: el de #R la Defensa#!, encerrado en Montevideo, y el del #blue_value Cerrito#!, que Oribe instaló frente a la ciudad y que gobernó el resto del país. Cada uno se decía el gobierno legal, y cada uno tenía detrás a sus padrinos extranjeros."
 je_guerra_grande_reason:0 "#b Los que se juegan la guerra#!\n· #R Rivera#! y los colorados, #blue_value Oribe#! y los blancos; desde la partición, #R la Defensa#! en Montevideo y #blue_value el Cerrito#! en la campaña.\n· #b Rosas#! sostiene al Cerrito y, mientras no retire su apoyo, le manda plata todos los meses. #b Urquiza#! pesa del lado de Rosas mientras no se dé vuelta.\n· #b Francia#!, #b Gran Bretaña#! y el #b Brasil#! sostienen a la Defensa; Francia y el Brasil le mandan plata todos los meses.\n· Al gobierno que sus padrinos sostienen con menos de #V 40#! se le escurre, mes a mes, el apoyo a la guerra.\n\n#b Cuándo se habla de paz#!\n· Se le pregunta si pide condiciones al gobierno que va #V 10#! abajo en la balanza (#V 5#! desde 1851) y al que lleva #V 3#! meses seguidos sin aguante; al Cerrito, también si le ocupan la mitad del territorio mientras no pelea otra guerra.\n· A la Defensa, también después de #V 24#! meses seguidos sin barcos (#V 12#! desde 1851). El Cerrito puede mandar a pedir condiciones por su cuenta.\n· Si los dos se quedan sin fuerzas a la vez, se le pregunta primero al más agotado; si empatan, al que va atrás en decisiones, y si también empatan, a la Defensa.\n· Entre 1845 y 1850, con las escuadras en el río, después de la mediación de Hood y sin que ninguno saque #V 3#! de ventaja en decisiones, las potencias vuelven una vez con su propuesta.\n· Nadie es llamado a la mesa durante una tregua, con otra negociación en curso ni en el tiempo que sigue a una que se rompió.\n\n#b Cómo termina#!\nCon la paz firmada, con un solo gobierno en pie o, a más tardar, en 1860; quien dicta la paz decide qué queda de la República. @warning! Todo se pierde si Montevideo queda en manos extranjeras."
 je_guerra_grande_status_factions:0 "Blancos y colorados todavía comparten una sola República: cada decisión de estos años inclina la balanza."
 je_guerra_grande_status_siege:0 "Dos gobiernos: la #R Defensa#! en Montevideo y el #blue_value Cerrito#! en la campaña.\n@battalions! Meses seguidos sin aguante (a los tres se le pregunta si pide condiciones): #blue_value Cerrito#! #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|v0]#! de 3 · #R Defensa#! #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|v0]#! de 3."
 je_guerra_grande_complete_tt:0 "La guerra termina con la paz firmada, con un solo gobierno en pie o, a más tardar, en 1860, siempre que Montevideo siga en manos orientales."

