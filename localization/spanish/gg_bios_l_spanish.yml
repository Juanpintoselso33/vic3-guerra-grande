l_spanish:
 gg_bio_button_tt:0 "#T [Character.GetFullName]#!\n\n[Character.GetCustom('gg_bio_text')]"
 gg_bio_oribe_manuel:0 "Nacido en Montevideo en 1792, soldado de la independencia y uno de los Treinta y Tres, fue presidente de la República de 1835 a 1838. Dio a sus partidarios la divisa blanca con el lema «Defensores de las Leyes», y cuando la presión de Rivera y el bloqueo francés lo llevaron a resignar el mando en 1838 se fue a Buenos Aires sin reconocer su caída. Al frente de ejércitos de la Confederación venció en Quebracho Herrado, Famaillá y Arroyo Grande; desde febrero de 1843 sitió Montevideo y gobernó desde el Cerrito la mayor parte del país hasta la paz de octubre de 1851. Murió en Montevideo en 1857."
 gg_bio_rivera_fructuoso:0 "Estanciero y lugarteniente de Artigas, pasó por el servicio portugués y volvió con la Cruzada de 1825; su conquista de las Misiones precedió a la paz que creó el Estado Oriental. Primer presidente (1830-1834), gobernó recorriendo la campaña, donde su popularidad era enorme; bajo su mando ocurrió la matanza de Salsipuedes. Alzado contra Oribe en 1836, vencido en Carpintería, ganó en Palmar y volvió a la presidencia. Perdió Arroyo Grande e India Muerta, la Defensa lo desterró en 1847 y murió en 1854, camino a Montevideo para integrar el triunvirato."
 gg_bio_lavalleja:0 "Nacido en Minas en 1784, fue el jefe de los Treinta y Tres Orientales que en 1825 cruzaron el Uruguay para arrancar la Provincia Oriental al Brasil, y gobernador de la provincia durante la guerra. Rival de Rivera, se alzó contra su primer gobierno en 1832 y en 1834 sin éxito, y terminó del lado de Oribe. Terminada la Guerra Grande integró el triunvirato de 1853 junto a Rivera y Flores, y murió en Montevideo ese mismo octubre."
 gg_bio_suarez:0 "Nacido en Canelones en 1781, hijo de pobladores de la villa, se sumó a la revolución y fue gobernador delegado de la Provincia Oriental en 1826. Comerciante acaudalado, firmó por Rivera la capitulación de octubre de 1838 que sacó a Oribe del gobierno. Presidente de la Defensa desde marzo de 1843 hasta febrero de 1852, sostuvo la plaza durante el sitio al frente de un gobierno en que pesaban los doctores, y que en 1847 desterró al propio Rivera. Murió en Montevideo en 1868."
 gg_bio_oribe_ignacio:0 "Hermano menor de Manuel Oribe, nacido en Montevideo en 1795, entró al ejército en el segundo sitio de Montevideo y combatió a órdenes de Rivera contra los portugueses. Ministro de Guerra y Marina entre 1830 y 1833, mandó las fuerzas del gobierno que vencieron a Rivera en Carpintería en septiembre de 1836, y fue batido por él en Palmar en 1838. Siguió a su hermano durante toda la Guerra Grande. Murió en Montevideo en 1866."
 gg_bio_herrera_y_obes:0 "Nacido en Montevideo en 1806, hijo de Nicolás Herrera, abogado y hombre de letras, fue uno de los típicos doctores de la época. Diputado durante el gobierno de Rivera, miembro de la Asamblea de Notables y del Consejo de Estado de la Defensa, Joaquín Suárez lo hizo ministro de Relaciones Exteriores. Desde esa cartera condujo la diplomacia de la Defensa en los años que terminaron con Urquiza separado de Rosas y el Imperio del Brasil en la guerra. Murió en Montevideo en 1890."
 gg_bio_lamas:0 "Nacido en Montevideo en 1817, periodista a los dieciocho años, conoció el destierro en el Brasil en 1836 por escribir contra el gobierno de Oribe. Abogado y auditor de guerra, refundó El Nacional, donde escribió la generación argentina del 37, y en 1843 fundó el Instituto Histórico y Geográfico. Ministro de Hacienda de la Defensa en 1844, desde 1847 fue su enviado ante el Imperio del Brasil y negoció los tratados de octubre de 1851. Murió en Buenos Aires en 1891."
 gg_bio_berro:0 "Nacido en Montevideo en 1803, hijo de comerciantes vascos, fue escritor además de político. Del lado de Oribe durante la guerra, fue a menudo contrario a Villademoros dentro del Cerrito. Presidente del Senado, ejerció interinamente el gobierno en febrero de 1852, y fue presidente constitucional de 1860 a 1864. Murió asesinado en Montevideo en febrero de 1868."
 gg_bio_diaz_cesar:0 "Nacido en Montevideo en 1812, peleó en Ituzaingó a las órdenes de José María Paz y luego en las campañas unitarias de Córdoba. Exiliado en el Estado Oriental, se sumó a Rivera contra Oribe en 1837; en Arroyo Grande dejó la frase de que allí «todo se perdió, hasta el honor». Comandante de la defensa de Montevideo durante el sitio, mandó la división oriental en Caseros, donde Urquiza lo ascendió a general en el campo. Fue fusilado tras la derrota de Quinteros en 1858."
 gg_bio_flores:0 "Nacido en Trinidad en 1808, se sumó a la Cruzada Libertadora con casi diecisiete años, tras el desembarco de los Treinta y Tres, y peleó en Rincón, Sarandí e Ituzaingó. Hombre de Rivera, defendió su primer gobierno y lo siguió en el levantamiento contra Oribe; en la Guerra Grande combatió por la Defensa, hasta que en 1846 renunció porque el gobierno se negaba a negociar la paz. Volvió en 1851 junto a Urquiza. Sucedió a Rivera como caudillo del Partido Colorado y murió asesinado en Montevideo en 1868."
 gg_bio_aparicio:0 "Nacido en Canelón Grande en 1814, hizo sus primeras armas junto a Manuel Oribe en 1836 y siguió con él en el sitio de Montevideo y el gobierno del Cerrito. Hombre de la campaña, pasó buena parte de su vida en Florida. Caudillo blanco de larga vida, en 1870 encabezó la Revolución de las Lanzas y venció en Paso Severino a las fuerzas del gobierno de Lorenzo Batlle. Murió en 1882."
 gg_bio_batlle_lorenzo:0 "Nacido en Montevideo en 1810, hijo de un comerciante catalán cuyas propiedades confiscó el gobierno de Artigas, se educó en Barcelona y en el colegio francés de Sorèze antes de volver al Río de la Plata. Militar y político del Partido Colorado, fue presidente de la República de 1868 a 1872, y padre de José Batlle y Ordóñez. Murió en Montevideo en 1887."
 gg_bio_medina:0 "Nacido en Las Víboras, cerca de Colonia, en 1788, entró en los Blandengues de Artigas y mandó caballería en la victoria de Guayabos. Soldado de a caballo toda su vida, en la Guerra Grande fue general colorado y jefe de Estado Mayor de Rivera; peleó en Cagancha y en Arroyo Grande, pasó al Brasil tras las derrotas de 1846 y en 1851 se sumó al ejército de Urquiza. Murió ejecutado al terminar la batalla de Manantiales, en 1871, con ochenta y tres años."
 gg_bio_pacheco_y_obes:0 "Nacido en Buenos Aires en 1809, se unió a la Cruzada de 1825 con dieciséis años y peleó en Ituzaingó. Radicado en Montevideo, no acompañó el alzamiento de Rivera contra Oribe, pero con el sitio fue ministro de Guerra de la Defensa y organizador de su resistencia. Defendió la causa de la plaza con un alegato ante el Parlamento francés. Murió en Buenos Aires en 1855."
 gg_bio_villademoros:0 "Nacido en Cerro Largo en 1806, huérfano de un padre muerto en las guerras de la independencia, se recibió de abogado en Buenos Aires. Poeta de odas y églogas, autor del drama Los Treinta y Tres y periodista de El Defensor de las Leyes, colaboró estrechamente con Manuel Oribe y ocupó altos cargos en sus gobiernos, entre ellos las Relaciones Exteriores. Dentro del Cerrito estuvo a menudo enfrentado con Berro. Murió en Montevideo en 1853."
 gg_bio_giro:0 "Nacido en Montevideo en 1791, hizo carrera en el Cabildo y fue ministro de Gobierno en los primeros gobiernos del Estado Oriental. Adherente de la divisa blanca y legislador del Cerrito durante el sitio, fue elegido presidente de la República el 1 de marzo de 1852, al terminar la guerra, e intentó un gobierno de fusión entre los partidos. Presiones internas lo obligaron a dejar el mando en septiembre de 1853. Murió en Montevideo en 1863."
 gg_bio_garzon:0 "Nacido en Montevideo en 1796, se enroló con Artigas en 1811 y peleó en Las Piedras y el sitio de Montevideo. Pasó después al Ejército de los Andes: fue ayudante de San Martín en Chacabuco y combatió en Cancha Rayada y Maipú. Veterano de las guerras de la independencia y de las civiles del Plata, sirvió en el bando blanco. Murió en Montevideo el 1 de diciembre de 1851, semanas después de la paz."
 gg_bio_gomez_servando:0 "Nacido hacia 1798, se sumó a Artigas en 1818 y peleó en Rincón a las órdenes de Rivera y en Ituzaingó, donde ganó el grado de coronel. Fiel a Rivera en su primera presidencia, bajo Oribe fue comandante de Cerro Largo y peleó en Carpintería del lado del gobierno: Ignacio Oribe lo llamó «valiente entre los valientes». Al frente de la Legión Fidelidad acompañó a Oribe al destierro en 1838 y siguió con él en la campaña del litoral. Murió en Gualeguaychú en 1865."
 gg_bio_mitre:0 "Nacido en Buenos Aires en 1821, pasó la juventud en el exilio de Montevideo, donde sirvió como oficial de artillería de la plaza y escribió en sus periódicos; integró la Asociación Nacional que presidía Andrés Lamas. Se apartó de Rivera en 1846. Hombre de armas y de letras, terminó siendo gobernador de Buenos Aires y presidente de la Nación Argentina entre 1862 y 1868. Murió en Buenos Aires en 1906."
 gg_bio_urquiza:0 "Nacido en Entre Ríos en 1801, fue el mayor estanciero y saladerista de su provincia, que gobernó desde 1842. Jefe federal del litoral al servicio de Rosas, peleó en Arroyo Grande junto a Oribe y deshizo a los Madariaga en Vences en 1847, después de negociar con ellos el tratado de Alcaraz. El 1 de mayo de 1851 se pronunció contra Rosas, se alió con el Brasil y la Defensa, levantó el sitio de Montevideo y en febrero de 1852 lo venció en Caseros. Presidió la Confederación Argentina de 1854 a 1860 y murió asesinado en 1870."
 gg_bio_lamadrid:0 "Nacido en Tucumán en 1795, combatió con Belgrano en el Norte y fue jefe militar del partido unitario en las guerras civiles. Gobernó Tucumán más de una vez y, efímeramente, La Rioja y Mendoza. En la guerra de la Coalición del Norte mandó el ejército tucumano y en 1841 llevó la campaña a Cuyo, donde en septiembre Ángel Pacheco lo derrotó en Rodeo del Medio; sus restos cruzaron los Andes nevados. Peleó en Caseros contra Rosas y murió en Buenos Aires en 1857."
 gg_bio_heredia:0 "Nacido en Tucumán en 1788, doctor en derecho por Córdoba, fue lugarteniente de Belgrano en Salta, Vilcapugio y Ayohuma, y uno de los jefes del motín de Arequito en 1820. Gobernador de Tucumán desde 1831, fue proclamado Protector del Norte y tuvo gran influencia sobre las provincias vecinas bajo el ala federal. Fue asesinado en Lules en noviembre de 1838, y poco después de su muerte nació la Coalición del Norte."
 gg_bio_pacheco_angel:0 "Nacido en Buenos Aires hacia 1793, se formó como granadero a caballo a las órdenes de San Martín y recibió el bautismo de fuego en San Lorenzo. Fue uno de los principales comandantes de Rosas y tiene fama de no haber perdido nunca una batalla que mandara: venció en Quebracho Herrado y, en 1841, a Lamadrid en Rodeo del Medio. Murió en Buenos Aires en 1869."
 gg_bio_ferre:0 "Nacido en Corrientes en 1788, hijo de catalanes, carpintero de ribera y comerciante del río, gobernó su provincia cuatro veces. En los debates del Pacto Federal de 1831 pidió habilitar otros puertos, repartir la aduana y abrir los ríos; Rosas le dio protección, pero no la libre navegación. Volvió al gobierno tras Pago Largo, rompió con Paz en 1842 y tras Arroyo Grande huyó al Paraguay. Fue convencional constituyente en 1853 y murió en Buenos Aires en 1867."
 gg_bio_brizuela:0 "Nacido en La Rioja hacia 1800, apodado el Zarco por sus ojos, fue lugarteniente de Facundo Quiroga en su provincia y gobernador de La Rioja desde 1837. En septiembre de 1840 lo eligieron director de la Liga del Norte, con facultad de hacer la guerra, firmar la paz y negociar empréstitos. Murió en Sañogasta en junio de 1841, peleando contra el poder de Rosas."
 gg_bio_avellaneda:0 "Nacido en Catamarca en 1813, hijo del primer gobernador de la provincia, estudió en Buenos Aires con Alberdi y Juan María Gutiérrez y se doctoró en leyes en 1834; sus compañeros lo llamaban Marco Tulio por su oratoria. Gobernador de Tucumán en 1841 y figura principal de la Coalición del Norte, tras la derrota de Famaillá fue degollado en Metán en octubre de ese año. Su hijo Nicolás llegó a presidente de la Argentina."
 gg_bio_paz:0 "Nacido en Córdoba en 1791, estudió en la universidad antes de entrar al Ejército del Norte, donde perdió el uso de un brazo; el Manco Paz fue uno de los grandes tácticos del partido unitario. Venció a Echagüe en Caá Guazú en noviembre de 1841 y en 1842 se hizo nombrar gobernador de Entre Ríos, lo que lo enfrentó con Ferré. En 1846 intentó derrocar a los Madariaga, fracasó y huyó al Paraguay. Murió en Buenos Aires en 1854."
 gg_bio_beron_de_astrada:0 "Nacido en Corrientes en 1801, oficial de caballería y guardián de la frontera este de su provincia, había peleado en el Estado Oriental a las órdenes de Rivera contra Oribe. Gobernador de Corrientes desde 1837, en marzo de 1839 rompió con Rosas y le declaró la guerra para levantar el bloqueo que ahogaba el comercio de la provincia. Murió al frente de sus tropas en Pago Largo, el 31 de marzo de 1839."
 gg_bio_madariaga_juan:0 "Nacido en Corrientes en 1809, hermano menor de Joaquín, se dedicó a la ganadería en Curuzú Cuatiá. Peleó en Caá Guazú y en la derrota de Arroyo Grande, tras la cual emigró al Brasil. En 1843 cruzó el Uruguay con su hermano por el paso que bautizaron de los Libres y en pocos días recuperaron Corrientes; fue el jefe militar de la provincia. Urquiza lo capturó en Laguna Limpia en 1846 y lo liberó para negociar. Murió en 1879."
 gg_bio_madariaga_joaquin:0 "Nacido en Corrientes en 1799, hijo de un vasco de Bilbao, fue militar en Buenos Aires, juez en su provincia y estanciero en Curuzú Cuatiá. Tras cruzar el Uruguay por el Paso de los Libres en 1843, gobernó Corrientes contra Rosas hasta 1847. Firmó con Urquiza el tratado de Alcaraz y rechazó las modificaciones que exigió Rosas; en noviembre de 1847 Urquiza lo destrozó en Vences. Murió exiliado en Porto Alegre en 1848."
 gg_bio_ibarra:0 "Nacido en 1787 en Villa Matará, promovió la autonomía de Santiago del Estero y fue su primer gobernador; la gobernó casi sin interrupción desde 1820 hasta su muerte. Caudillo federal del interior, en 1840 se negó a sumarse a la Coalición del Norte cuando Tucumán, Salta, Jujuy, Catamarca y La Rioja se pronunciaron contra Rosas, y su provincia quedó como una cuña en medio de la rebelión. Murió en Santiago del Estero en julio de 1851."
 gg_bio_benavidez:0 "Nacido en San Juan en 1805, caudillo federal y aliado de Rosas, gobernó su provincia en cuatro períodos entre 1836 y 1857. En la guerra contra la Coalición del Norte, en agosto de 1841, capturó en La Chacarilla al general unitario Mariano Acha, que luego fue ejecutado. Fue asesinado en San Juan en octubre de 1858."
 gg_bio_aldao:0 "Nacido en Mendoza en 1785, fraile dominico que cambió el hábito por las armas en la guerra de la independencia, el Fraile Aldao fue el jefe de los federales mendocinos. En agosto de 1841 Acha lo venció en Angaco, en una de las batallas más sangrientas de las guerras civiles, y en noviembre de ese año tomó el gobierno de Mendoza, que ejerció hasta su muerte en enero de 1845. Su fama de crueldad se asocia a la biografía, en buena parte novelada, que le escribió Sarmiento."
