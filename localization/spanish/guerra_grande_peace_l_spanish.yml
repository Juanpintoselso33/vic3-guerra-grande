l_spanish:

# ES: El menú de paz de la Guerra Grande. Cada cláusula, decreto, fecha y cita de acá abajo está
#     documentada en ~/dev/juegos/victoria3-uruguay/SOURCES_peace.md y en los comentarios de
#     events/guerra_grande_peace.txt. Acá no hay nada inventado, y donde el registro está en
#     disputa el texto lo dice en vez de elegir bando.

# ---------------------------------------------------------------------------------------------
# gg_peace.1 -- la Defensa dicta la paz
# ---------------------------------------------------------------------------------------------

 gg_peace.1.t:0 "Las condiciones de la Defensa"
 gg_peace.1.desc:0 "La guerra está decidida y, por primera vez en nueve años, este gobierno es el que escribe las condiciones en vez de esperar que llegue la escuadra de otro.\n\nLo que sigue no es obvio. La fórmula que circula desde Río de Janeiro termina la guerra negándose a nombrar un ganador, y le cuesta a este gobierno las confiscaciones, las proscripciones y la deuda de guerra de los del cerro. Los decretos de febrero de 1843 siguen vigentes: nunca se derogaron. El Imperio ofrece tratados. Dos ministros en diez años le pidieron a Londres y a París que tomaran la República bajo protección. Y está la otra orilla del río, donde el hombre que pagó esta guerra sigue en pie."
 gg_peace.1.flav:0 "Nueve años adentro de una muralla, y ahora una hoja en blanco."

 gg_peace.1.a:0 "Amnistía: ni vencidos ni vencedores, y el Estado paga las deudas de los dos."
 gg_peace.1.b:0 "Castigo: cumplir los decretos de febrero de 1843."
 gg_peace.1.c:0 "Protectorado del Brasil: firmar los cinco tratados con el Imperio."
 gg_peace.1.d:0 "Protectorado europeo: pedírselo a Londres y a París."
 gg_peace.1.e:0 "Guerra a Rosas: pacificar la República y cruzar el río."
 gg_peace.1.f:0 "Sin condiciones. Todavía no."

 gg_peace_formula_tt:0 "@information! La amnistía da iguales derechos y acceso a los empleos públicos a todos los orientales, asume la deuda de guerra del #blue_value Cerrito#! y no proscribe a Oribe. Las dos divisas quedan prohibidas en favor de la escarapela nacional."
 gg_peace_proscription_defensa_tt:0 "@warning! Los decretos de febrero de la #R Defensa#! alcanzan la campaña: los #blue_value jefes blancos#! van al destierro, las confiscaciones quedan en pie, y los fusilamientos y expulsiones siembran radicalismo en los pagos."
 gg_peace_treaties_tt:0 "@warning! El Imperio garantiza la Constitución y subsidia a la República contra la renta de aduana; se renuncia al reclamo de San Ildefonso y a navegar la Laguna Merín y el Yaguarón. El comercio brasileño gana diez años de franquicias, y los esclavos fugados deben devolverse pese a la ley de abolición."
 gg_peace_protectorate_asked_tt:0 "@information! Londres y París reciben el pedido de poner a la República bajo su protección conjunta. Las solicitudes anteriores fueron rechazadas, de modo que la respuesta es incierta."
 gg_peace_caseros_tt:0 "@battalions! Pacificado el país, la República compromete una división contra Rosas junto al Imperio, Entre Ríos y Corrientes. El ejército gana una causa del otro lado del río y la caja paga su costo."

# ---------------------------------------------------------------------------------------------
# gg_peace.2 -- el Cerrito dicta la paz
# ---------------------------------------------------------------------------------------------

 gg_peace.2.t:0 "Las condiciones del Cerrito"
 gg_peace.2.desc:0 "Las puertas están abiertas. Nueve años sentados frente a un muro que este ejército no tenía un solo cañón capaz de abrir, y al final lo abrió el hambre, porque no vino ninguna escuadra.\n\nEste gobierno sostiene una sola cosa desde 1838 y nunca ninguna otra: que es el gobierno legal de la República, que a su presidente un alzamiento armado le cortó el mandato, y que todo lo que hizo acá afuera —las Cámaras, los tribunales, la aduana, las escuelas, la abolición de la esclavitud— lo hizo bajo la Constitución de 1830. Ahora puede decirlo desde la ciudad. O puede decir otra cosa. Hay una carta de Buenos Aires, de hace seis años, que nunca se contestó."
 gg_peace.2.flav:0 "Treinta y cinco cañones y ninguno capaz de abrir un muro. Lo abrió el hambre."

 gg_peace.2.a:0 "Amnistía: ni vencidos ni vencedores, la cláusula del pliego de Oribe."
 gg_peace.2.b:0 "Presidencia restituida: todo decreto de la Defensa es nulo."
 gg_peace.2.c:0 "Castigo: mueran los salvajes unitarios."
 gg_peace.2.d:0 "Vasallaje: la República queda bajo la Confederación de Rosas."
 gg_peace.2.e:0 "Cliente de Rosas: el Restaurador paga, y el Restaurador manda."
 gg_peace.2.f:0 "Sin condiciones. Todavía no."

 gg_peace_oribe_pliego_tt:0 "@information! El pliego entero de Oribe se hace ley: ni vencidos ni vencedores, los actos y deudas del #blue_value Cerrito#! reconocidos, y sus batallones bajo su mando hasta las elecciones constitucionales. La escarapela nacional reemplaza a las dos divisas."
 gg_peace_legal_presidency_tt:0 "@warning! El mandato interrumpido de Oribe continúa bajo la Constitución, sin proscripciones, pero todo decreto de la #R Defensa#! queda nulo. Los bienes confiscados se restituyen a costa de la caja, y las legiones extranjeras pierden su lugar en Montevideo."
 gg_peace_proscription_cerrito_tt:0 "@warning! El #blue_value Cerrito#! lleva a Montevideo su pregón contra los unitarios: los #R jefes colorados#! van al destierro, sus bienes se confiscan y la ciudad extranjera se vacía. La caja gana lo incautado; la República gana infamia y un rencor duradero."
 gg_peace_confederation_tt:0 "@warning! La República queda como vasalla dentro de la Confederación de Rosas y se deja de lado el arreglo de 1828. Ningún documento conservado prueba que Oribe quisiera dar esta respuesta a la propuesta de Rosas."
 gg_peace_rosista_client_tt:0 "@warning! Buenos Aires sigue pagando y armando a la República, pero Rosas pasa a mandarla afuera. La caja se llena al precio de la sujeción, la infamia y la enemistad del Brasil."

# ---------------------------------------------------------------------------------------------
# gg_peace.3 / gg_peace.4 -- la respuesta de Londres y de París
# ---------------------------------------------------------------------------------------------

 gg_peace.3.t:0 "Un protectorado concedido"
 gg_peace.3.desc:0 "Llegó la respuesta, y es que sí. Francia toma la República bajo protección, con el consentimiento de Gran Bretaña, y el subsidio que viene por convención desde junio de 1848 pasa a ser una obligación en vez de un favor.\n\nEl puerto no se cierra nunca más y los inmigrantes van a seguir desembarcando. Lo que se entregó es más difícil de nombrar que una provincia, porque no está escrito en ninguna parte del instrumento: la República le pidió a una potencia europea que se parara encima de ella, y le dieron lo que pidió."
 gg_peace.3.flav:0 "Es lo que se pidió. Ahí está el problema."
 gg_peace.3.a:0 "La bandera queda. Todo lo que hay abajo se negocia en otra parte."

 gg_peace.4.t:0 "Un protectorado rechazado"
 gg_peace.4.desc:0 "Londres dice que no, y esta vez lo dice donde lo oye todo el mundo.\n\nEs el sexto rechazo del mismo pedido. Muñoz en 1838, pidiendo un arreglo como el de las Islas Jónicas. Ellauri en 1841. Varela en Londres en 1843-44. Y ahora éste. La República le dijo al mundo que no se cree capaz de gobernarse, y el mundo se negó a hacerse cargo. La propuesta salió en los diarios antes que la respuesta."
 gg_peace.4.flav:0 "La humillación sin la protección."
 gg_peace.4.a:0 "Entonces solos, y todos saben que no queríamos."

# ---------------------------------------------------------------------------------------------
# Modificadores
# ---------------------------------------------------------------------------------------------

 gg_peace_legal_presidency:0 "La presidencia legal restituida"
 gg_peace_legal_presidency_desc:0 "El mandato interrumpido en 1838 sigue bajo la Constitución de 1830. Las Cámaras disueltas vuelven a sesionar, el Tribunal de Apelaciones instalado el 12 de mayo de 1845 queda en pie, y la administración que gobernó la campaña durante nueve años no hay que inventarla: se muda a la ciudad."

 gg_peace_colorados_proscribed:0 "Mueran los salvages unitarios"
 gg_peace_colorados_proscribed_desc:0 "El encabezado de El Defensor de la Independencia Americana, cumplido. De 31.000 personas adentro de las murallas apenas unas 11.000 eran orientales; las legiones eran extranjeras, las casas de comercio eran extranjeras y las imprentas eran de la emigración antirrosista. El puerto se vacía, y lo que lo hacía valioso se va con la gente que lo hacía."

 gg_peace_confederation_province:0 "De vuelta en la Confederación"
 gg_peace_confederation_province_desc:0 "La propuesta de Rosas del 11 de agosto de 1845 aceptada en vez de enterrada en una comisión parlamentaria: la República vuelve a las Provincias Unidas del Río de la Plata y se anula la Convención Preliminar de Paz de 1828. La campaña que peleó la guerra está de acuerdo. La ciudad, la emigración y todas las cancillerías de la cuenca, no."

 gg_peace_rosista_client:0 "El Restaurador sigue pagando"
 gg_peace_rosista_client_desc:0 "Buenos Aires sigue financiando y armando a la República como financió y armó el sitio: en las últimas semanas antes de la capitulación Rosas todavía mandaba ochocientas onzas de oro. La plata es real y el precio también: la República es ahora lo que sus enemigos dijeron siempre que era."

 gg_peace_blancos_proscribed:0 "Los decretos de febrero de 1843"
 gg_peace_blancos_proscribed_desc:0 "Fusilado en el acto y por la espalda el que tenga armas en la mano o la divisa enemiga; comisión militar para todo el que tenga trato con los sitiadores; familias expulsadas, algunas a la isla Libertad; las confiscaciones en pie. Aplicado por fin a la campaña, que pasó nueve años del otro lado de la línea y se va a acordar."

 gg_peace_treaties_of_1851:0 "Los cinco tratados de 1851"
 gg_peace_treaties_of_1851_desc:0 "Alianza, socorros, límites, comercio y extradición, firmados en Río de Janeiro el 12 de octubre de 1851. El Imperio garante de la Constitución y con derecho a intervenir para restablecer el orden; el subsidio llega todos los meses contra la renta de aduana; la frontera norte queda en el Cuareim y la costa de la Laguna Merín queda seca por cincuenta y ocho años; el tasajo entra libre diez años y el ganado sale libre diez años; y los esclavos fugados se devuelven, contra la propia ley de abolición de la República."

 gg_peace_anglo_french_protectorate:0 "Bajo protección europea"
 gg_peace_anglo_french_protectorate_desc:0 "El proyecto de Manuel Herrera y Obes de 1848, concedido: la República bajo la protección de Francia, con el consentimiento de Gran Bretaña. El puerto no se puede cerrar, los inmigrantes siguen desembarcando y el subsidio ahora se debe en vez de mendigarse. Al ejército, que pasó nueve años escuchando que defendía la independencia de la República, le acaban de decir cuánto valía esa independencia."

 gg_peace_protectorate_refused:0 "Rechazados en público"
 gg_peace_protectorate_refused_desc:0 "El sexto pedido de la misma clase y el sexto rechazo. La República le pidió a una potencia extranjera que la gobernara, el pedido salió en los diarios antes que la respuesta, y la respuesta fue que no. No se ganó nada y lo dicho no se puede desdecir."

 gg_peace_march_on_buenos_aires:0 "Y después, al otro lado del río"
 gg_peace_march_on_buenos_aires_desc:0 "Una vez pacificado el territorio nacional se iniciará la acción militar contra Rosas: Herrera y Obes escribió exactamente eso a los encargados de negocios inglés y francés en setiembre de 1851. La República pone una división en la alianza que va a encontrarse con Rosas en Caseros. El ejército nunca estuvo más alto y el tesoro nunca estuvo más vacío."

 gg_peace_national_cockade:0 "La escarapela nacional"
 gg_peace_national_cockade_desc:0 "Se prohíben las divisas colorada y blanca y se declara la escarapela nacional el único distintivo que puede llevar un ciudadano, con el fin de hacer desaparecer las opiniones y signos que separaban de los otros a los hijos del pueblo oriental. La Villa de la Restauración pasa a ser la Villa de la Unión. Los dos partidos pierden algo a lo que le tenían cariño, y el Estado gana una autoridad que nunca tuvo."

 gg_peace_assumed_war_debt:0 "La deuda de ellos es ahora la de la Nación"
 gg_peace_assumed_war_debt_desc:0 "La República reconocerá como deuda nacional aquella que haya contraído el general Oribe con arreglo a lo que para tales casos estatuye el derecho público. Es el artículo tercero del pacto, y es lo que costó de verdad la fórmula: el gobierno que ganó paga la guerra que peleó el otro."

# T1 (FX-1)
 gg_peace.5.t:0 "La victoria sin mesa"
 gg_peace.5.desc:0 "No hubo pliegos ni plenipotenciarios. El otro gobierno ya no existe: sus departamentos, sus cuarteles y sus deudas son nuestros, y sus jefes esperan saber qué se hace con ellos. Lo que se decida ahora es lo que la República va a recordar de esta guerra."
 gg_peace.5.desc_third_party:0 "La guerra no la terminamos nosotros. Una potencia extranjera se tragó al otro gobierno y nos dejó la República entera por descarte. Nadie firmó nada con nosotros, pero los jefes del otro bando siguen acá, y hay que decidir qué se hace con ellos."
 gg_peace.5.desc_timeout:0 "Pasaron veinte años de guerra y nadie la ganó. Los dos gobiernos siguen en pie, pero ya no hay quien pelee: la guerra se apagó sola. Lo que queda es decidir cómo se vive con los que estuvieron enfrente."
 gg_peace.5.flav:0 "Nadie se sentó a negociar."
 gg_peace.5.a:0 "Clemencia. Que vuelvan a sus casas."
 gg_peace.5.b:0 "Que los jefes salgan del país."
 gg_peace.5.c:0 "Que la campaña aprenda."
 gg_peace.5.d:0 "Entregarle el jefe vencido a su aliado de afuera."
 gg_victory_proscription:0 "Los jefes vencidos, proscriptos"
 gg_victory_terror:0 "El terror en la campaña"
 gg_victory_chief_handed_over:0 "El jefe vencido, entregado"
 gg_peace.11.t:0 "La ciudad no aguanta más"
 gg_peace.11.d:0 "Hace tres meses que el gobierno vive de lo que queda. Las tropas cobran tarde o no cobran, la ración bajó otra vez, y en los cuerpos extranjeros se habla de embarcarse más que de pelear.\n\nEl Cerrito lo sabe, y el árbitro también: mientras esto siga así, quien dicta las condiciones es el otro. Pedirlas ahora es aceptar que el pliego lo escriban ellos, con lo que eso significa para el gobierno, para los que se comprometieron y para lo que quede de la República.\n\nSeguir peleando es una decisión, no una inercia. Cuesta apoyo adentro —hay gente que ya quería el fin— y no garantiza nada, pero le saca al enemigo la mesa por un año, y en un año pasan cosas: una escuadra, una alianza, un pronunciamiento en la otra orilla."
 gg_peace.11.f:0 "«Pedir condiciones» y «rendirse» se escriben distinto."
 gg_peace.11.a:0 "Pedir condiciones. Que escriban ellos el pliego."
 gg_peace.11.b:0 "Seguir peleando. Todavía no."
 gg_peace.12.t:0 "El campamento se vacía"
 gg_peace.12.d:0 "Hace tres meses que el gobierno vive de lo que queda. Las divisiones se deshacen por deserción antes que por combate, la caballada está flaca y los jefes de departamento contestan cada vez más tarde.\n\nLa Defensa lo sabe, y el árbitro también: mientras esto siga así, quien dicta las condiciones es el otro. Pedirlas ahora es aceptar que el pliego lo escriban ellos, con lo que eso significa para el gobierno, para los que se comprometieron y para lo que quede de la República.\n\nSeguir peleando es una decisión, no una inercia. Cuesta apoyo adentro —hay gente que ya quería el fin— y no garantiza nada, pero le saca al enemigo la mesa por un año, y en un año pasan cosas: una escuadra, una alianza, un pronunciamiento en la otra orilla."
 gg_peace.12.f:0 "«Pedir condiciones» y «rendirse» se escriben distinto."
 gg_peace.12.a:0 "Pedir condiciones. Que escriban ellos el pliego."
 gg_peace.12.b:0 "Seguir peleando. Todavía no."
 gg_peace_ask_terms_tt:0 "@warning! El otro gobierno escribe el pliego de paz, y ahí se decide qué pasa con este gobierno."
 gg_peace_fight_on_tt:0 "@battalions! La guerra sigue: #N -10#! de apoyo a la guerra y algo de descontento, pero el árbitro no vuelve a la mesa por un año."
