l_spanish:
 gg_tt_patron_francia_now_2:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia es hoy #b Garante#! de la Defensa: le paga cada mes (salvo que haya renunciado a su subsidio), respalda su guerra y, ante un río cerrado, su paciencia corre aunque Londres no la acompañe."
 gg_tt_patron_francia_now_1:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia es hoy #b Protectora#! de la Defensa: le paga cada mes (salvo que haya renunciado a su subsidio), respalda su guerra y, ante un río cerrado, su paciencia corre solo si Londres la acompaña. Sola no interviene."
 gg_tt_patron_francia_now_0:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia es hoy #b Espectadora#!: no le paga a la Defensa, no respalda su guerra y un río cerrado no gasta su paciencia."
 gg_tt_patron_francia_now:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia respalda a la Defensa según su nivel."
 gg_tt_patron_britania_now_2:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña es hoy #b Garante#!: está plenamente comprometida: su escuadra en el Plata, su palabra sobre el río, o un compromiso de #V 60#! o más. Respalda la guerra de la Defensa, aunque no le paga, y ante un río cerrado su paciencia corre junto a la de París."
 gg_tt_patron_britania_now_1:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña es hoy #b Protectora#! de la Defensa: respalda su guerra, aunque no le paga, y ante un río cerrado su paciencia corre junto a la de París. Londres nunca actúa sin París."
 gg_tt_patron_britania_now_0:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña es hoy #b Espectadora#!: no respalda la guerra de la Defensa y un río cerrado no gasta su paciencia."
 gg_tt_patron_britania_now:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña respalda a la Defensa según su nivel."
 gg_tt_patron_brasil_now_2:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio es hoy #b Garante#! de la Defensa, comprometido por su palabra, por los tratados o por un compromiso de #V 60#! o más: le paga cada mes y respalda su guerra."
 gg_tt_patron_brasil_now_1:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio es hoy #b Protector#! de la Defensa: le paga cada mes y respalda su guerra."
 gg_tt_patron_brasil_now_0:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio es hoy #b Espectador#!: no le paga a la Defensa ni respalda su guerra. Antes de 1850 mira desde afuera."
 gg_tt_patron_brasil_now:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio respalda a la Defensa según su nivel."
 gg_tt_patron_rosas_now:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] El respaldo de Rosas sostiene la guerra del Cerrito: si entre Rosas y Urquiza no llega a #V 40#!, el Cerrito pierde aguante cada mes. Le paga cada mes. Con #V 40#! o más, el Cerrito puede pedirle que cierre el río."
 gg_tt_patron_urquiza_now:0 "@information! El respaldo de Urquiza cuenta para el lado en que esté: hoy el Cerrito, o la Defensa si se da vuelta. Con #V 50#! o más, y Rosas por debajo de #V 60#!, puede darse vuelta."
 gg_patron_france_out_tt:0 "@warning! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Sin el subsidio, Francia pasa a #b Espectadora#!: deja de pagar, de respaldar la guerra de la Defensa y de contar para el río."
 gg_patron.a:0 "Que se sepa en la línea."
 gg_patron.1.t_2:0 "Francia, garante de la Defensa"
 gg_patron.1.t_1:0 "Francia, protectora de la Defensa"
 gg_patron.1.t_0:0 "Francia se aparta"
 gg_patron.1.d_2:0 "París ya no manda solo notas y letras de cambio: ata su crédito a la suerte de Montevideo, y sus cónsules hablan como quien tiene algo que perder.\n\n#b Efectos#!: Francia le paga cada mes a la Defensa, salvo que haya renunciado a su subsidio, y respalda su guerra. Si Rosas cierra el río, su paciencia corre aunque Londres no la acompañe, y puede intervenir sola."
 gg_patron.1.d_1:0 "París sostiene a Montevideo con plata y con palabras, pero no quiere quedar atado a su destino: la Cámara pregunta cuánto cuesta cada mes de esta guerra.\n\n#b Efectos#!: Francia le paga cada mes a la Defensa, salvo que haya renunciado a su subsidio, y respalda su guerra. Ante un río cerrado, su paciencia corre solo si Londres también está comprometida; sola no interviene."
 gg_patron.1.d_0:0 "En París la cuestión del Plata ya no ocupa a nadie: otros asuntos llenan los despachos del ministerio.\n\n#b Efectos#!: Francia deja de pagarle a la Defensa y de respaldar su guerra, y un río cerrado ya no gasta su paciencia."
 gg_patron.2.t_2:0 "Londres se compromete en el Plata"
 gg_patron.2.t_1:0 "Londres respalda a la Defensa"
 gg_patron.2.t_0:0 "Londres se aparta"
 gg_patron.2.d_2:0 "Londres está plenamente comprometida con Montevideo: su escuadra en el Plata, su palabra dada sobre el río o un gabinete resuelto a no ceder.\n\n#b Efectos#!: Gran Bretaña respalda la guerra de la Defensa, aunque no le paga, y ante un río cerrado su paciencia corre junto a la de París. Londres nunca actúa sin París."
 gg_patron.2.d_1:0 "Los comerciantes de la City hacen oír su voz en el gabinete: quieren los ríos abiertos y el puerto de Montevideo en pie.\n\n#b Efectos#!: Gran Bretaña respalda la guerra de la Defensa, aunque no le paga, y ante un río cerrado su paciencia corre junto a la de París. Sin París, Londres no actúa."
 gg_patron.2.d_0:0 "Londres se retira de la cuestión: o ya le reconoció a Rosas el derecho de bloquear, o su comercio no le pide más.\n\n#b Efectos#!: Gran Bretaña deja de respaldar la guerra de la Defensa, y un río cerrado ya no gasta su paciencia."
 gg_patron.3.t_2:0 "El Imperio, garante de la Defensa"
 gg_patron.3.t_1:0 "El Imperio respalda a la Defensa"
 gg_patron.3.t_0:0 "El Imperio se aparta"
 gg_patron.3.d_2:0 "Río de Janeiro ya no mira desde la frontera: el Imperio se compromete por escrito con la suerte de Montevideo.\n\n#b Efectos#!: el Imperio es #b Garante#! de la Defensa: le paga cada mes y respalda su guerra."
 gg_patron.3.d_1:0 "Río de Janeiro sostiene a Montevideo sin atarse todavía por tratado: la plata llega, la firma todavía no.\n\n#b Efectos#!: el Imperio le paga cada mes a la Defensa y respalda su guerra."
 gg_patron.3.d_0:0 "Río de Janeiro mira desde la frontera y espera.\n\n#b Efectos#!: el Imperio no le paga a la Defensa ni respalda su guerra."
 gg_war_ui_sec_powers:0 "Los padrinos"
 gg_war_ui_sec_powers_tt:0 "Cada potencia está frente a la Defensa como #b Espectadora#!, #b Protectora#! o #b Garante#!.\n· #b Espectadora#!: no paga, no respalda la guerra y no cuenta para el río.\n· #b Protectora#!: paga y respalda la guerra; ante un río cerrado su paciencia corre solo junto a la de la otra potencia.\n· #b Garante#!: paga y respalda la guerra; su paciencia corre aunque vaya sola.\nFrancia, una vez renunciado su subsidio, ya no paga en ningún nivel.\nLos hitos fijan el nivel: la garantía del río y la intervención hacen garantes a Londres y París; Southern y Lepredour los apartan; renunciar al subsidio francés corta la plata de Francia y, pasadas su garantía o su escuadra, la aparta; el Imperio no cuenta antes de 1850 y es garante desde que se compromete. Entre hito y hito, cada decisión de los eventos sube o baja el compromiso.\nGran Bretaña nunca le pagó a la Defensa, y Londres nunca actuó sin París.\n#b Del lado del Cerrito#!: Buenos Aires (Rosas) y Entre Ríos (Urquiza, mientras esté de ese lado); su sostén cuenta igual, y por debajo de #V 40#! también le cuesta aguante."
 gg_war_ui_power_francia_0:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b Francia#!\n#grey Espectadora#!\n#V [GetGlobalVariable('gg_patron_francia').GetValue|0]#!/100"
 gg_war_ui_power_francia_1:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b Francia#!\n#V Protectora#!\n#V [GetGlobalVariable('gg_patron_francia').GetValue|0]#!/100"
 gg_war_ui_power_francia_2:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b Francia#!\n#P Garante#!\n#V [GetGlobalVariable('gg_patron_francia').GetValue|0]#!/100"
 gg_war_ui_power_britania_0:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #b Gran Bretaña#!\n#grey Espectadora#!\n#V [GetGlobalVariable('gg_patron_britania').GetValue|0]#!/100"
 gg_war_ui_power_britania_1:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #b Gran Bretaña#!\n#V Protectora#!\n#V [GetGlobalVariable('gg_patron_britania').GetValue|0]#!/100"
 gg_war_ui_power_britania_2:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #b Gran Bretaña#!\n#P Garante#!\n#V [GetGlobalVariable('gg_patron_britania').GetValue|0]#!/100"
 gg_war_ui_power_brasil_0:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b El Brasil#!\n#grey Espectador#!\n#V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!/100"
 gg_war_ui_power_brasil_1:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b El Brasil#!\n#V Protector#!\n#V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!/100"
 gg_war_ui_power_brasil_2:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b El Brasil#!\n#P Garante#!\n#V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!/100"
 gg_ui_plata_word_aside:0 "#b Londres no se mete en la cuestión#!: solo cuenta la paciencia de París."
 gg_ui_plata_word_aside_tt:0 "Gran Bretaña es hoy Espectadora frente a la Defensa (ver «Los padrinos» en La Guerra Grande). Un cierre solo gasta la paciencia de París, y París actúa sola únicamente si es Garante."
 gg_ui_plata_word_none:0 "#b Ninguna potencia está en condiciones de reclamar#!: un cierre no trae ultimátum."
 gg_ui_plata_word_none_tt:0 "Ni Londres ni París respaldan hoy a la Defensa lo bastante para reclamarle nada a Rosas (ver «Los padrinos» en La Guerra Grande): una Protectora sola no actúa, y una Espectadora no cuenta. Si su compromiso crece, el río vuelve a gastar su paciencia."
 gg_plata.20.d_none_aside:0 "Rosas cerró el Plata desde la orilla de Buenos Aires: ningún barco extranjero llega ya a Montevideo.\n\nNi Londres ni París respaldan hoy a la Defensa lo bastante para reclamarle nada: el cierre no gasta la paciencia de nadie. Mientras dure, la plaza se aprieta (mortalidad #N +5%#!). Fuera de las treguas, además, cada mes suma a su hambre y corre la guerra hacia los #blue_value blancos#!. Un solo mes de río abierto corta la racha del hambre."
 gg_tt_patron_rosas_now_0:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] El respaldo de Rosas sostiene la guerra del Cerrito: si entre Rosas y Urquiza no llega a #V 40#!, el Cerrito pierde aguante cada mes. Le paga cada mes. Con #V 40#! o más, el Cerrito puede pedirle que cierre el río."
 gg_tt_patron_rosas_now_1:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] El respaldo de Rosas sostiene la guerra del Cerrito: si entre Rosas y Urquiza no llega a #V 40#!, el Cerrito pierde aguante cada mes. Le paga cada mes. Con #V 40#! o más, el Cerrito puede pedirle que cierre el río."
 gg_tt_patron_rosas_now_2:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] El respaldo de Rosas sostiene la guerra del Cerrito: si entre Rosas y Urquiza no llega a #V 40#!, el Cerrito pierde aguante cada mes. Le paga cada mes. Con #V 40#! o más, el Cerrito puede pedirle que cierre el río."
 gg_tt_patron_urquiza_now_0:0 "@information! El respaldo de Urquiza cuenta para el lado en que esté: hoy el Cerrito, o la Defensa si se da vuelta. Con #V 50#! o más, y Rosas por debajo de #V 60#!, puede darse vuelta."
 gg_tt_patron_urquiza_now_1:0 "@information! El respaldo de Urquiza cuenta para el lado en que esté: hoy el Cerrito, o la Defensa si se da vuelta. Con #V 50#! o más, y Rosas por debajo de #V 60#!, puede darse vuelta."
 gg_tt_patron_urquiza_now_2:0 "@information! El respaldo de Urquiza cuenta para el lado en que esté: hoy el Cerrito, o la Defensa si se da vuelta. Con #V 50#! o más, y Rosas por debajo de #V 60#!, puede darse vuelta."
 gg_tt_patron_francia_means:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] El compromiso de Francia fija su nivel frente a la Defensa (ver «Las potencias» en La Guerra Grande): con #V 20#! o más es #b Protectora#! (paga y respalda la guerra; su paciencia corre solo junto a la de Londres), con #V 60#! o más, #b Garante#! (su paciencia corre aunque vaya sola). Mientras corre la convención de 1848 es por lo menos Protectora; los hitos lo fijan por encima de este número."
 gg_tt_patron_britania_means:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] El compromiso de Gran Bretaña fija su nivel frente a la Defensa (ver «Las potencias» en La Guerra Grande): con #V 20#! o más es #b Protectora#! (respalda la guerra, sin pagarle; su paciencia corre solo junto a la de París), con #V 60#! o más, #b Garante#!. Londres nunca actúa sin París; los hitos fijan el nivel por encima de este número."
 gg_tt_patron_brasil_means:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El compromiso del Imperio fija su nivel frente a la Defensa (ver «Las potencias» en La Guerra Grande): antes de 1850 no cuenta; desde entonces, con #V 20#! o más es #b Protector#! (paga y respalda la guerra) y con #V 60#! o más, #b Garante#!. Un compromiso formal con la Defensa lo hace Garante."
 gg_tt_patron_rosas_means:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] El respaldo de Rosas sostiene la guerra del Cerrito: si entre Rosas y Urquiza no llega a #V 40#!, el Cerrito pierde aguante cada mes. Le paga cada mes. Con #V 40#! o más, el Cerrito puede pedirle que cierre el río."
 gg_tt_patron_urquiza_means:0 "@information! El respaldo de Urquiza cuenta para el lado en que esté: hoy el Cerrito, o la Defensa si se da vuelta. Con #V 50#! o más, y Rosas por debajo de #V 60#!, puede darse vuelta."
 gg_patron_france_out_river_tt:0 "@warning! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Sin el subsidio, Francia deja de pagarle a la Defensa. Mientras su garantía del río o su escuadra sigan en pie, sigue siendo #b Garante#! y respaldando su guerra; cuando eso termine, pasa a #b Espectadora#!."
 gg_patron.1.t_pre_2:0 "Francia se juega por los colorados"
 gg_patron.1.t_pre_1:0 "Francia se inclina por los colorados"
 gg_patron.1.t_pre_0:0 "Francia se aparta"
 gg_patron.2.t_pre_2:0 "Londres se juega por los colorados"
 gg_patron.2.t_pre_1:0 "Londres se inclina por los colorados"
 gg_patron.2.t_pre_0:0 "Londres se aparta"
 gg_patron.3.t_pre_2:0 "El Imperio se juega por los colorados"
 gg_patron.3.t_pre_1:0 "El Imperio se inclina por los colorados"
 gg_patron.3.t_pre_0:0 "El Imperio se aparta"
 gg_patron.1.d_pre_2:0 "París ata su crédito a la causa colorada: sus agentes en Montevideo ya hablan de Rivera como de un aliado.\n\n#b Efectos#!: si la República se parte, Francia será #b Garante#! de la Defensa: le pagará cada mes y respaldará su guerra, y ante un río cerrado su paciencia correrá aunque Londres no la acompañe."
 gg_patron.1.d_pre_1:0 "París mira con simpatía a los colorados, pero sin atarse a su suerte.\n\n#b Efectos#!: si la República se parte, Francia será #b Protectora#! de la Defensa: le pagará cada mes y respaldará su guerra; ante un río cerrado, su paciencia correrá solo si Londres la acompaña."
 gg_patron.1.d_pre_0:0 "En París la cuestión del Plata ya no ocupa a nadie.\n\n#b Efectos#!: Francia no sostiene a ningún bando oriental ni cuenta para el río."
 gg_patron.2.d_pre_2:0 "Londres se juega por la causa colorada: su comercio necesita a Montevideo abierto.\n\n#b Efectos#!: si la República se parte, Gran Bretaña será #b Garante#! de la Defensa: respaldará su guerra, sin pagarle, y ante un río cerrado su paciencia correrá junto a la de París."
 gg_patron.2.d_pre_1:0 "Los comerciantes de la City miran con simpatía a los colorados.\n\n#b Efectos#!: si la República se parte, Gran Bretaña será #b Protectora#! de la Defensa: respaldará su guerra, sin pagarle, y ante un río cerrado su paciencia correrá junto a la de París."
 gg_patron.2.d_pre_0:0 "Londres no se mete en las querellas orientales.\n\n#b Efectos#!: Gran Bretaña no sostiene a ningún bando oriental ni cuenta para el río."
 gg_patron.3.d_pre_2:0 "Río de Janeiro se inclina con decisión por los colorados.\n\n#b Efectos#!: si la República se parte, el Imperio será #b Garante#! de la Defensa desde 1850: le pagará cada mes y respaldará su guerra."
 gg_patron.3.d_pre_1:0 "Río de Janeiro mira con simpatía a los colorados, sin comprometerse.\n\n#b Efectos#!: si la República se parte, el Imperio sostendrá a la Defensa desde 1850: le pagará cada mes y respaldará su guerra."
 gg_patron.3.d_pre_0:0 "Río de Janeiro mira desde la frontera y espera.\n\n#b Efectos#!: el Imperio no sostiene a ningún bando oriental."
 gg_tt_patron_francia_means_pre:0 "@information! [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia sostiene a los #R colorados#!. Si la República se parte, su compromiso fijará su nivel frente a la Defensa: con #V 20#! o más será #b Protectora#! (paga y respalda la guerra; su paciencia corre solo junto a la de Londres), con #V 60#! o más, #b Garante#! (su paciencia corre aunque vaya sola)."
 gg_tt_patron_britania_means_pre:0 "@information! [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña sostiene a los #R colorados#!. Si la República se parte, su compromiso fijará su nivel frente a la Defensa: con #V 20#! o más será #b Protectora#! (respalda la guerra, sin pagarle; su paciencia corre solo junto a la de París), con #V 60#! o más, #b Garante#!. Londres nunca actúa sin París."
 gg_tt_patron_brasil_means_pre:0 "@information! [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] El Imperio sostiene a los #R colorados#!. Si la República se parte, contará para la Defensa desde 1850: con #V 20#! o más será #b Protector#! (paga y respalda la guerra) y con #V 60#! o más, #b Garante#!."
 gg_tt_patron_rosas_means_pre:0 "@information! [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas sostiene a los #blue_value blancos#! de Oribe. Si la República se parte, sostendrá la guerra del Cerrito: si entre Rosas y Urquiza no llega a #V 40#!, el Cerrito perderá aguante cada mes; con #V 40#! o más, el Cerrito podrá pedirle que cierre el río."
 gg_tt_patron_urquiza_means_pre:0 "@information! Urquiza pesa del lado de Rosas y de los #blue_value blancos#! mientras siga con él. Si la República se parte, contará para el Cerrito, o para la Defensa si se da vuelta: con #V 50#! o más, y Rosas por debajo de #V 60#!, puede darse vuelta."
 gg_french_subsidy_renounced_tt:0 "#b Sin vuelta atrás#!: sea cual sea el lugar de Francia en el río de aquí en más, Montevideo no vuelve a tomar su plata."
