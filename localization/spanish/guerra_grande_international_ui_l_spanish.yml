l_spanish:
 gg_ui_rosas_commitment:0 "#b El compromiso del Cerrito con Buenos Aires#!\nLa reunificación comprometida condiciona los términos de paz que puede aceptar el Cerrito."
 gg_ui_brazil_commitment:0 "#b El compromiso de la Defensa con Brasil#!\nLa Defensa ha aceptado el respaldo imperial sujeto a condiciones brasileñas para la paz."
 gg_ui_customs_commitment:0 "#b Las rentas de la aduana#!\nLa Defensa ha recibido otra remesa de #V £40.000#!, comprometiendo sus rentas aduaneras."
 gg_ui_empty:0 ""
 gg_ui_offer_action_tt:0 "$gg_int_arg_offer_possible$\n\n[GetScriptedGui('gg_ui_offer_aid').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_withdraw_action_tt:0 "$gg_int_arg_withdraw_possible$\n\n[GetScriptedGui('gg_ui_withdraw_aid').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_squadrons_action_tt:0 "Requiere guerra abierta, los dos gobiernos constituidos y no haber solicitado ya las escuadras. Disponible desde #V 1843#! con interés de una gran potencia en el Plata, o desde #V 1848#! sin ese requisito.\n\n[GetScriptedGui('gg_ui_call_squadrons').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_offer_parties:0 "#b Buenos Aires → Gobierno de Oribe#!"
 gg_ui_offer_terms:0 "Remesa extraordinaria a cambio de una #V obligación diplomática#!. El destinatario decide; el dinero se entrega al aceptar."
 gg_ui_offer_capacity:0 "Importe disponible: #V £[JournalEntry.MakeScope.ScriptValue('gg_int_arg_aid_capacity')|0]#!\nMandatos provinciales vigentes: #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#!/13."
 gg_ui_delegation_tt:0 "Un reclamo pendiente no retira por sí solo el mandato."
 gg_ui_offer_answered:0 "La respuesta ya fue registrada. La remesa figura en #b Compromisos#!."
 gg_ui_no_commitments:0 "No hay compromisos registrados."
 gg_ui_accepted_account:0 "Remitido: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#!\nContrapartida: obligación diplomática del receptor con Buenos Aires."
 gg_ui_backing_tt:0 "El respaldo va de #V 0#! a #V 100#!. La cifra no equivale por sí sola a un tratado: los compromisos se contraen al aceptar sus condiciones."
