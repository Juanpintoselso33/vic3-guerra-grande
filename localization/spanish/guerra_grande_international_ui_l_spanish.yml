l_spanish:
 gg_ui_rosas_commitment:0 "#b El compromiso del Cerrito con Buenos Aires#!\nLa reunificación comprometida condiciona los términos de paz que puede aceptar el Cerrito."
 gg_ui_brazil_commitment:0 "#b El compromiso con el Imperio#!\nLa Defensa aceptó el respaldo del Brasil: la paz que firme se escribirá en condiciones brasileñas, y ya no podrá pedir la protección de Londres y París."
 gg_ui_customs_commitment:0 "#b Las rentas de la aduana#!\nLa Defensa cobró #V 40.000#! a cuenta de su aduana. Esa deuda queda para después de la paz."
 gg_ui_empty:0 ""
 gg_ui_offer_action_tt:0 "Una remesa extraordinaria a cambio de que Oribe quede obligado con Buenos Aires. Él decide; la plata se entrega si acepta.\n\n$gg_int_arg_offer_possible$\n\n[GetScriptedGui('gg_ui_offer_aid').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_withdraw_action_tt:0 "$gg_int_arg_withdraw_possible$\n\n[GetScriptedGui('gg_ui_withdraw_aid').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_squadrons_action_tt:0 "Requiere guerra abierta, los dos gobiernos constituidos y no haber solicitado ya las escuadras. Disponible desde #V 1843#! con interés de una gran potencia en el Plata, o desde #V 1848#! sin ese requisito.\n\n[GetScriptedGui('gg_ui_call_squadrons').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_offer_parties:0 "#b Buenos Aires → Gobierno de Oribe#!"
 gg_ui_offer_capacity:0 "Importe disponible: #V £[JournalEntry.MakeScope.ScriptValue('gg_int_arg_aid_capacity')|0]#!"
 gg_ui_accepted_account:0 "Remitido: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#!\nContrapartida: obligación diplomática del receptor con Buenos Aires."
 gg_ui_backing_tt:0 "El respaldo va de #V 0#! a #V 100#!. La cifra no equivale por sí sola a un tratado: los compromisos se contraen al aceptar sus condiciones."
