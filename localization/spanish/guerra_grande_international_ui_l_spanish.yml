l_spanish:
 gg_ui_ledger_title:0 "#b La cuestión del Plata#!"
 gg_ui_tab_overview:0 "Panorama"
 gg_ui_rosas_commitment:0 "#b El compromiso del Cerrito con Buenos Aires#!\nLa reunificación comprometida condiciona los términos de paz que puede aceptar el Cerrito."
 gg_ui_brazil_commitment:0 "#b El compromiso de la Defensa con Brasil#!\nLa Defensa ha aceptado el respaldo imperial sujeto a condiciones brasileñas para la paz."
 gg_ui_customs_commitment:0 "#b Las rentas de la aduana#!\nLa Defensa ha recibido otra remesa de #V £40.000#!, comprometiendo sus rentas aduaneras."
 gg_ui_tab_proposals:0 "Propuestas"
 gg_ui_tab_agreements:0 "Compromisos"
 gg_ui_proposals_scope:0 "#b Buenos Aires y el gobierno de Oribe#!\nUna oferta no es todavía un acuerdo. La respuesta corresponde al destinatario, y el desembolso exige que Buenos Aires pueda sostener lo ofrecido."
 gg_ui_no_arg_proposal:0 "No hay una remesa extraordinaria argentina esperando respuesta."
 gg_ui_agreements_scope:0 "#b La remesa extraordinaria argentina#!\nEste expediente distingue lo ofrecido de lo efectivamente remitido; no suma los subsidios ordinarios."
 gg_ui_no_arg_agreement:0 "No se ha aceptado una remesa extraordinaria argentina."
 gg_ui_phase_alignments:0 "Acercamientos diplomáticos"
 gg_ui_phase_intervention:0 "Intervención en curso"
 gg_ui_phase_mediation:0 "Mediación abierta"
 gg_ui_patron_header:0 "Cancillería o caudillo"
 gg_ui_side_header:0 "Sostiene a"
 gg_ui_backing_header:0 "Respaldo"
 gg_ui_rosas:0 "[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] Rosas"
 gg_ui_france:0 "[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] Francia"
 gg_ui_britain:0 "[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] Gran Bretaña"
 gg_ui_brazil:0 "[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] Brasil"
 gg_ui_urquiza:0 "@gg_entre_rios_flag! Urquiza"
 gg_ui_side_oribe:0 "#blue_value Blancos#!"
 gg_ui_empty:0 ""
 gg_ui_offer_action_tt:0 "$gg_int_arg_offer_possible$\n\n[GetScriptedGui('gg_ui_offer_aid').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_withdraw_action_tt:0 "$gg_int_arg_withdraw_possible$\n\n[GetScriptedGui('gg_ui_withdraw_aid').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_squadrons_action_tt:0 "Requiere guerra abierta, los dos gobiernos constituidos y no haber solicitado ya las escuadras. Disponible desde #V 1843#! con interés de una gran potencia en el Plata, o desde #V 1848#! sin ese requisito.\n\n[GetScriptedGui('gg_ui_call_squadrons').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 gg_ui_offer_parties:0 "#b Buenos Aires → Gobierno de Oribe#!"
 gg_ui_offer_terms:0 "Remesa extraordinaria a cambio de una #V obligación diplomática#!. El destinatario decide; el dinero se entrega al aceptar."
 gg_ui_offer_capacity:0 "Importe disponible: #V £[JournalEntry.MakeScope.ScriptValue('gg_int_arg_aid_capacity')|0]#!\nMandatos provinciales vigentes: #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#!/13."
 gg_ui_delegation_tt:0 "Un reclamo pendiente no retira por sí solo el mandato."
 gg_ui_offer_answered:0 "La respuesta ya fue registrada. La remesa figura en #b Compromisos#!."
 gg_ui_no_commitments:0 "No hay compromisos registrados."
 gg_ui_accepted_account:0 "Remitido: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#!\nContrapartida: obligación diplomática del receptor con Buenos Aires."
 gg_ui_river_open:0 "@ships! Control del Plata: #P escuadras extranjeras y la Defensa#!"
 gg_ui_river_closed:0 "@ships! Control del Plata: #blue_value Buenos Aires y Oribe#!"
 gg_ui_river_account:0 "Francia #V [GetGlobalVariable('gg_patron_francia').GetValue|0]#! + Gran Bretaña #V [GetGlobalVariable('gg_patron_britania').GetValue|0]#! − bloqueo #V [JournalEntry.MakeScope.ScriptValue('gg_blockade_pressure')|0]#!."
 gg_ui_river_tt:0 "El control es exclusivo: con #V 60#! o más de peso naval lo ejercen las escuadras extranjeras junto a la Defensa; por debajo, Buenos Aires y Oribe conservan el río. La misma cuenta determina si Montevideo recibe abastecimiento, pero el control regional y el suministro de la plaza se explican por separado."
 gg_ui_side_defensa:0 "#R Colorados#!"
 gg_ui_rosas_value:0 "#V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100"
 gg_ui_france_value:0 "#V [GetGlobalVariable('gg_patron_francia').GetValue|0]#!/100"
 gg_ui_britain_value:0 "#V [GetGlobalVariable('gg_patron_britania').GetValue|0]#!/100"
 gg_ui_brazil_value:0 "#V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!/100"
 gg_ui_urquiza_value:0 "#V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_ui_backing_tt:0 "El respaldo va de #V 0#! a #V 100#!. La cifra no equivale por sí sola a un tratado: los compromisos se contraen al aceptar sus condiciones."
 gg_ui_rosas_tt:0 "#b Buenos Aires → Oribe#!\nFinancia el sostén de su causa. La oferta extraordinaria requiere dinero en el tesoro y una respuesta oriental; el Pacto Federal limita cuánto puede ofrecerse.\n\n$gg_ui_backing_tt$"
 gg_ui_france_tt:0 "#b Francia → colorados#!\nSu respaldo pesa en el sostén de la plaza y, junto al británico, en el acceso por el río. Los subsidios y convenios conservan sus propias condiciones.\n\n$gg_ui_backing_tt$"
 gg_ui_britain_tt:0 "#b Gran Bretaña → colorados#!\nLa estación naval pesa sobre el río. El respaldo británico se suma al francés; no es una entrada automática en la guerra.\n\n$gg_ui_backing_tt$"
 gg_ui_brazil_tt:0 "#b Brasil → colorados#!\nEl crédito y el respaldo imperial sostienen esa causa. Sus compromisos se negocian por separado del auxilio argentino.\n\n$gg_ui_backing_tt$"
 gg_ui_urquiza_tt:0 "#b El Litoral#!\nEl respaldo de Urquiza cuenta para el bando que figura en esta fila. Una ruptura cambia su destinatario; no se anticipa por la fecha.\n\n$gg_ui_backing_tt$"
 gg_ui_capacity:0 "Provincias que delegan\n#V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! de #V 13#!"
 gg_ui_spent:0 "Auxilio argentino remitido\n#V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#!"
 gg_ui_spent_tt:0 "Cuenta de la remesa extraordinaria efectivamente aceptada y pagada. No suma los subsidios ordinarios ni una oferta todavía sin respuesta."
 gg_ui_actions_hint:0 "#b Resoluciones del gobierno#! · requisitos en cada pliego"
 gg_ui_details_title:0 "Condiciones del auxilio y del río"
 gg_ui_summary:0 "Cada auxilio compromete una caja y una relación diplomática. El destinatario conserva su decisión; el dinero ofrecido todavía no es dinero recibido."
