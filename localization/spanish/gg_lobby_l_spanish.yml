l_spanish:
 URU_FLAVOR_TEXT:0 "La República tiene seis años y dos caudillos. Oribe gobierna desde Montevideo con la ley en la mano; Rivera manda en la campaña, con la lealtad de los paisanos. Del otro lado del río mira Rosas, y más allá Londres, París y Río de Janeiro. Lo que empiece como un pleito entre orientales puede no terminar entre ellos."
