l_spanish:
 gg_war_ui_short_prewar:0 "Desde Carpintería, blancos y colorados se disputan la República. Cada decisión de los dos caudillos inclina la balanza."
 gg_war_ui_short_split:0 "Dos gobiernos, cada uno el legal: la Defensa, encerrada en Montevideo, y el Cerrito, dueño de la campaña. Ninguno piensa rendirse; se trata de llegar a la mesa pesando más que el otro."
 gg_war_ui_sec_sides:0 "Frente a frente"
 gg_war_ui_versus:0 "vs"
 gg_war_ui_card_defensa_tt:0 "#b Quién sostiene a la Defensa#!: las potencias que son Protectoras o Garantes (ver «Los padrinos», abajo) y Urquiza, si se da vuelta.\nEn total, #V [GetPlayer.MakeScope.ScriptValue('gg_defensa_backing')|0]#!. Con menos de #V 40#!, el aguante se le escurre mes a mes; hoy es de #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!.\n\n@money! Francia (mientras no renuncie a su subsidio) y el Imperio, si la respaldan, le mandan #P [GetPlayer.MakeScope.ScriptValue('gg_defensa_subsidy')|0]#! por mes. Los subsidios históricos (la convención francesa, los tratados brasileños) llegan por este mismo pago: no se cobran dos veces."
 gg_war_ui_card_cerrito_tt:0 "#b Quién sostiene al Cerrito#! (de #V 0#! a #V 100#! cada uno)\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!, mientras no se dé vuelta.\nEn total, #V [GetPlayer.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!. Con menos de #V 40#!, el aguante se le escurre mes a mes; hoy es de #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!.\n\n@money! Rosas le manda #P [GetPlayer.MakeScope.ScriptValue('gg_cerrito_subsidy')|0]#! por mes, mientras no retire su apoyo. La caja de Rosas llega por este mismo pago: no se cobra dos veces."
 gg_war_ui_sec_balance:0 "La balanza"
 gg_war_ui_sec_balance_tt:0 "#b Qué la inclina#!\nEl número de cada lado, debajo de la balanza, es todo lo que ese lado tiene en ella, decisiones y río juntos; la balanza es la diferencia, y su extremo marca la ventaja que hoy hace falta para hablar de paz.\nLas decisiones de uno y otro lado, incluidas algunas de Buenos Aires. En la guerra abierta pesa también el río, en una sola cuenta: cada mes cerrado suma para los #blue_value blancos#! y cada mes abierto descuenta; cada cuatro meses de saldo es un punto, hasta #V 4#! por lado; en el sitio, cada cuatro meses más allá de ese techo quedan en la cuenta de la guerra, hasta #V [JournalEntry.MakeScope.ScriptValue('gg_siege_river_bank_cap')|0]#! puntos por lado. La partición le recorta a la mitad la ventaja al que llegue con #V 2#! o más.\n\n#b El mes pasado#!: decisiones #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados · el río #blue_value [GetGlobalVariable('gg_src_last_river_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_river_colorado').GetValue|+=0]#! · la partición #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! · el río, hoy, #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (a favor de los blancos si es positivo).\n\n#b Ventaja en decisiones#! de #V 5#!: sin contar nada del río (ni su peso en la balanza ni lo que el sitio ya pasó a la cuenta de la guerra) y ya en guerra abierta, el que va arriba gana prestigio (#P +10%#!) y el favor de sus militares (#P +2#!), y al de abajo se le cae la autoridad (#N -25#!) y pierde a sus militares (#N -2#!). Si se llega a pelear, el de arriba ataca #P +10%#! y defiende #P +5%#!, y el de abajo ataca #N -10%#! y siente más las bajas (#N +15%#!)."
 gg_war_ui_sec_endurance:0 "El aguante"
 gg_war_ui_sec_endurance_tt:0 "Cuánto aguanta cada gobierno la guerra, de #N -100#! a #P 100#!; arranca en #V 100#! con la partición. Lo gastan sus propias decisiones y un padrino que deja de sostenerlo: con un sostén por debajo de #V 40#!, un punto por mes por cada #V 5#! que le falten.\nLo repone cada mes: #b La tregua#!, #P +5#! a cada uno; #b Refuerzos por mar#!, #P +2#! a la #R Defensa#!; la #b Legión Italiana#! y las #b Legiones extranjeras de la Defensa#!, #P +1#! cada una a la #R Defensa#!; el #b Subsidio francés#!, #P +5#! a la #R Defensa#!; los #b Batallones auxiliares argentinos#!, #P +2#! al #blue_value Cerrito#!. Cuando el aguante cae a #N -60#! o menos, los hombres se rehacen un poco (#P +15#! por mes).\nMeses seguidos con el aguante en #N -25#! o menos; un mes mejor vuelve la cuenta a cero."
 gg_war_ui_endurance_defensa:0 "#R La Defensa#!: aguante #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!, #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! de #V 3#! meses sin aguante"
 gg_war_ui_endurance_cerrito:0 "#blue_value El Cerrito#!: aguante #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!, #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#! de #V 3#! meses sin aguante"
 gg_war_ui_sec_table:0 "La mesa de paz"
 gg_war_ui_backer_rosas:0 "[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] #b Buenos Aires#!\nRosas\n#V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100"
 gg_war_ui_backer_urquiza_cer:0 "@gg_entre_rios_flag! #b Entre Ríos#!\nUrquiza\n#V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_war_ui_backer_urquiza_def:0 "@gg_entre_rios_flag! #b Entre Ríos#!\nUrquiza\n#V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_tt_backer_rosas:0 "Lo que Buenos Aires pone detrás del #blue_value Cerrito#!: los batallones de la Vanguardia, los pesos de cada mes y la escuadra del río. Junto con Urquiza mientras esté de ese lado, es el sostén del Cerrito: por debajo de #V 40#!, el Cerrito pierde aguante cada mes."
 gg_tt_backer_rosas_pledged:0 "Lo que Buenos Aires pone detrás del #blue_value Cerrito#!: los batallones de la Vanguardia, los pesos de cada mes y la escuadra del río. Junto con Urquiza mientras esté de ese lado, es el sostén del Cerrito: por debajo de #V 40#!, el Cerrito pierde aguante cada mes.\n\n@warning! #b La palabra empeñada#!: el #blue_value Cerrito#! se comprometió a volver a la Confederación, y con esa palabra se llevó el tesoro de Rosas. La palabra ata. Si al Cerrito le toca dictar la paz, solo podrá hacerlo en términos argentinos —provincia del Pacto, república bajo la protección de Rosas o reincorporación—, y ya no con la amnistía, la presidencia restaurada ni el castigo de los salvajes unitarios. Cierra además la puerta a toda mediación europea que quiera separar a Oribe de Rosas. Y si el Cerrito pierde, la Defensa tiene su bandera lista: #R «Oribe vendió el país»#!."
 gg_tt_backer_urquiza_cer:0 "El gobernador de Entre Ríos y su caballería del litoral, del lado del #blue_value Cerrito#!. Suma al sostén del Cerrito junto con Rosas: por debajo de #V 40#!, el Cerrito pierde aguante cada mes."
 gg_tt_backer_urquiza_def:0 "El gobernador de Entre Ríos se pronunció y ahora está con la #R Defensa#!: suma a su sostén junto con las potencias. Por debajo de #V 40#!, la Defensa pierde aguante cada mes."
 gg_tt_power_number:0 "Cuánto se compromete cada potencia con la causa de Montevideo, de #V 0#! a #V 100#!. Cada decisión de los eventos lo sube o lo baja.\n· Desde #V 20#!, #b Protectora#!; desde #V 60#!, #b Garante#!.\n· Los hitos mandan sobre el número: la garantía del río y la intervención la hacen Garante, Southern y Lepredour la apartan, mientras corre el subsidio de la convención Francia es Protectora aunque no llegue a #V 20#!, y el Imperio no cuenta antes de 1850 por alto que esté.\nSolo el compromiso de una potencia Protectora o Garante suma al sostén de la Defensa."
 gg_war_ui_backers_lean:0 "Sostén: #R Defensa#! #V [JournalEntry.MakeScope.ScriptValue('gg_defensa_backing')|0]#!  ·  #blue_value Cerrito#! #V [JournalEntry.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!"
 gg_tt_backers_lean:0 "Hacia dónde se inclinan los padrinos.\n#R Defensa#!: el compromiso de las potencias Protectoras o Garantes, y el de Urquiza si se pronunció.\n#blue_value Cerrito#!: el de Rosas, y el de Urquiza mientras siga de su lado; si Urquiza se pronuncia cuando la guerra ya está gastada, su peso le resta.\nCon menos de #V 40#!, un gobierno pierde aguante cada mes: un punto por cada #V 5#! que le falten."
 gg_war_ui_row_colorados:0 "Sostienen a los #R colorados#!"
 gg_war_ui_row_blancos:0 "Sostienen a los #blue_value blancos#!"
 gg_war_ui_sec_balance_tt_0:0 "$gg_war_ui_sec_balance_tt$\n#b Con la balanza en#! #V [GetPlayer.MakeScope.ScriptValue('gg_arbiter_balance_needed')|0]#! (la ventaja exigida baja con los años), al gobierno de abajo se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. Cada gobierno puede negarse una sola vez."
 gg_war_ui_sec_endurance_tt_0:0 "$gg_war_ui_sec_endurance_tt$\nA los #V 3#! meses, a ese gobierno se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. Cada gobierno puede negarse una sola vez."
 gg_war_ui_sec_balance_tt_1:0 "$gg_war_ui_sec_balance_tt$\n#b La balanza se inclina del todo#! con #V [GetPlayer.MakeScope.ScriptValue('gg_arbiter_balance_needed')|0]#! (la ventaja exigida baja con los años), pero en esta guerra no sienta a nadie a la mesa: la paz es la de octubre de 1851."
 gg_war_ui_sec_endurance_tt_1:0 "$gg_war_ui_sec_endurance_tt$\nEn esta guerra, ni tres meses sin aguante sientan a nadie a la mesa: la paz es la de octubre de 1851."
 gg_war_ui_sec_balance_tt_2:0 "$gg_war_ui_sec_balance_tt$\n#b Con la balanza en#! #V [GetPlayer.MakeScope.ScriptValue('gg_arbiter_balance_needed')|0]#! (la ventaja exigida baja con los años) a favor de los #R colorados#!, al #blue_value Cerrito#! se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. A la #R Defensa#! la balanza no la lleva a ese punto: si nada lo decide antes, la paz es la de octubre de 1851."
 gg_war_ui_sec_endurance_tt_2:0 "$gg_war_ui_sec_endurance_tt$\nA los #V 3#! meses, al #blue_value Cerrito#! se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. A la #R Defensa#!, no: si nada lo decide antes, la paz es la de octubre de 1851."
 gg_war_ui_sec_balance_tt_3:0 "$gg_war_ui_sec_balance_tt$\n#b Con la balanza en#! #V [GetPlayer.MakeScope.ScriptValue('gg_arbiter_balance_needed')|0]#! (la ventaja exigida baja con los años) a favor de los #blue_value blancos#!, a la #R Defensa#! se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. Al #blue_value Cerrito#! la balanza no lo lleva a ese punto: si nada lo decide antes, la paz es la de octubre de 1851."
 gg_war_ui_sec_endurance_tt_3:0 "$gg_war_ui_sec_endurance_tt$\nA los #V 3#! meses, a la #R Defensa#! se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. Al #blue_value Cerrito#!, no: si nada lo decide antes, la paz es la de octubre de 1851."
 gg_war_ui_endurance_defensa_now:0 "#R La Defensa#!: aguante #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!"
 gg_war_ui_endurance_cerrito_now:0 "#blue_value El Cerrito#!: aguante #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!"
 gg_tt_backer_rosas_pre:0 "Lo que Buenos Aires pone detrás de #blue_value Oribe#! y los blancos: los batallones de la Vanguardia, la plata y la escuadra del río. Todavía no hay Cerrito que sostener: si la República se parte, este será el sostén del Cerrito, y con menos de #V 40#! el Cerrito perderá aguante cada mes."
 gg_tt_backer_urquiza_cer_pre:0 "Urquiza y la caballería entrerriana, del lado de Rosas y de los #blue_value blancos#!. Todavía no hay Cerrito: si la República se parte, sumará al sostén del Cerrito junto con Rosas."
