l_spanish:
 gg_war_ui_short_prewar:0 "Desde Carpintería, blancos y colorados se disputan la República. Cada decisión de los dos caudillos inclina la balanza."
 gg_war_ui_short_split:0 "Dos gobiernos, cada uno el legal: la Defensa, encerrada en Montevideo, y el Cerrito, dueño de la campaña. Ninguno piensa rendirse; se trata de llegar a la mesa pesando más que el otro."
 gg_war_ui_sec_sides:0 "Frente a frente"
 gg_war_ui_versus:0 "vs"
 gg_war_ui_card_defensa_tt:0 "#b Quién sostiene a la Defensa#!: las potencias que son Protectoras o Garantes (ver «Las potencias», abajo) y Urquiza, si se da vuelta.\nEn total, #V [GetPlayer.MakeScope.ScriptValue('gg_defensa_backing')|0]#!. Con menos de #V 40#!, el apoyo a la guerra se le escurre mes a mes.\n\n@money! Francia (mientras no renuncie a su subsidio) y el Imperio, si la respaldan, le mandan #P [GetPlayer.MakeScope.ScriptValue('gg_defensa_subsidy')|0]#! por mes. Los subsidios históricos (la convención francesa de 1848, los tratados brasileños de 1851) llegan por este mismo pago: no se cobran dos veces."
 gg_war_ui_card_cerrito_tt:0 "#b Quién sostiene al Cerrito#! (de 0 a 100 cada uno)\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!, mientras no se dé vuelta.\nEn total, #V [GetPlayer.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!. Con menos de #V 40#!, el apoyo a la guerra se le escurre mes a mes.\n\n@money! Rosas le manda #P [GetPlayer.MakeScope.ScriptValue('gg_cerrito_subsidy')|0]#! por mes, mientras no retire su apoyo. La caja de Rosas llega por este mismo pago: no se cobra dos veces."
 gg_war_ui_sec_balance:0 "La balanza"
 gg_war_ui_sec_balance_tt:0 "#b Qué la inclina#!\nLas decisiones de uno y otro lado, incluidas algunas de Buenos Aires. En la guerra abierta pesa también el río, en una sola cuenta: cada mes cerrado suma para los #blue_value blancos#! y cada mes abierto descuenta; cada cuatro meses de saldo es un punto, hasta #V 4#! por lado; en el sitio, cada cuatro meses más allá de ese techo quedan en la cuenta de la guerra. La partición le recorta a la mitad la ventaja al que llegue con #V 2#! o más.\n\n#b El mes pasado#!: decisiones #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados · el río #blue_value [GetGlobalVariable('gg_src_last_river_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_river_colorado').GetValue|+=0]#! · la partición #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! · el río, hoy, #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (a favor de los blancos si es positivo).\n\n#b Con 5 de ventaja en decisiones#!, sin contar el río y ya en guerra abierta, el que va arriba pelea mejor (ataque #P +10%#!, defensa #P +5%#!, prestigio #P +10%#!, aprobación de las Fuerzas Armadas #P +2#!) y al de abajo se le cae la autoridad (#N -25#!), ataca peor (#N -10%#!), siente más las bajas (#N +15%#!) y pierde a sus militares (#N -2#!).\n#b Con 10 en la balanza#! (#V 5#! desde 1851), al gobierno de abajo se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua."
 gg_war_ui_sec_endurance:0 "El aguante"
 gg_war_ui_sec_endurance_tt:0 "Cuánto aguanta cada gobierno la guerra, de #N -100#! a #P 100#!: lo gastan sus propias decisiones y un padrino que deja de sostenerlo. Meses seguidos con el aguante en #N -25#! o menos; un mes mejor vuelve la cuenta a cero. A los #V 3#!, a ese gobierno se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. Cuando el aguante cae a #N -60#! o menos, cada mes los hombres se rehacen un poco (#P +15#!)."
 gg_war_ui_endurance_defensa:0 "#R La Defensa#!: aguante #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!, #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! de #V 3#! meses sin aguante"
 gg_war_ui_endurance_cerrito:0 "#blue_value El Cerrito#!: aguante #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!, #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#! de #V 3#! meses sin aguante"
 gg_war_ui_sec_table:0 "La mesa de paz"
