l_spanish:
 gg_war_ui_short_prewar:0 "Desde Carpintería, blancos y colorados se disputan la República. Cada decisión de los dos caudillos inclina la balanza."
 gg_war_ui_short_split:0 "Dos gobiernos, cada uno el legal: la Defensa, encerrada en Montevideo, y el Cerrito, dueño de la campaña. Ninguno piensa rendirse; se trata de llegar a la mesa pesando más que el otro."
 gg_war_ui_sec_sides:0 "Frente a frente"
 gg_war_ui_versus:0 "vs"
 gg_war_ui_card_defensa_tt:0 "#b Quién sostiene a la Defensa#!: las potencias que son Protectoras o Garantes (ver «Los padrinos», abajo) y Urquiza, si se da vuelta.\nEn total, #V [GetPlayer.MakeScope.ScriptValue('gg_defensa_backing')|0]#!. Con menos de #V 40#!, el aguante se le escurre mes a mes.\n\n@money! Francia (mientras no renuncie a su subsidio) y el Imperio, si la respaldan, le mandan #P [GetPlayer.MakeScope.ScriptValue('gg_defensa_subsidy')|0]#! por mes. Los subsidios históricos (la convención francesa de 1848, los tratados brasileños de 1851) llegan por este mismo pago: no se cobran dos veces."
 gg_war_ui_card_cerrito_tt:0 "#b Quién sostiene al Cerrito#! (de 0 a 100 cada uno)\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!, mientras no se dé vuelta.\nEn total, #V [GetPlayer.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!. Con menos de #V 40#!, el aguante se le escurre mes a mes.\n\n@money! Rosas le manda #P [GetPlayer.MakeScope.ScriptValue('gg_cerrito_subsidy')|0]#! por mes, mientras no retire su apoyo. La caja de Rosas llega por este mismo pago: no se cobra dos veces."
 gg_war_ui_sec_balance:0 "La balanza"
 gg_war_ui_sec_balance_tt:0 "#b Qué la inclina#!\nEl número de cada punta es todo lo que ese lado tiene en la balanza, decisiones y río juntos; la balanza es la diferencia.\nLas decisiones de uno y otro lado, incluidas algunas de Buenos Aires. En la guerra abierta pesa también el río, en una sola cuenta: cada mes cerrado suma para los #blue_value blancos#! y cada mes abierto descuenta; cada cuatro meses de saldo es un punto, hasta #V 4#! por lado; en el sitio, cada cuatro meses más allá de ese techo quedan en la cuenta de la guerra. La partición le recorta a la mitad la ventaja al que llegue con #V 2#! o más.\n\n#b El mes pasado#!: decisiones #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados · el río #blue_value [GetGlobalVariable('gg_src_last_river_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_river_colorado').GetValue|+=0]#! · la partición #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#! · el río, hoy, #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (a favor de los blancos si es positivo).\n\n#b Con 5 de ventaja en decisiones#!, sin contar el río y ya en guerra abierta, el que va arriba gana prestigio (#P +10%#!) y el favor de sus militares (#P +2#!), y al de abajo se le cae la autoridad (#N -25#!) y pierde a sus militares (#N -2#!). Si se llega a pelear, el de arriba ataca #P +10%#! y defiende #P +5%#!, y el de abajo ataca #N -10%#! y siente más las bajas (#N +15%#!).\n#b Con 15 en la balanza#! (#V 10#! desde 1849, #V 5#! desde 1851), al gobierno de abajo se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua."
 gg_war_ui_sec_endurance:0 "El aguante"
 gg_war_ui_sec_endurance_tt:0 "Cuánto aguanta cada gobierno la guerra, de #N -100#! a #P 100#!: lo gastan sus propias decisiones y un padrino que deja de sostenerlo. Meses seguidos con el aguante en #N -25#! o menos; un mes mejor vuelve la cuenta a cero. A los #V 3#!, a ese gobierno se le pregunta si pide condiciones o sigue peleando, en cuanto no haya otra negociación en curso ni tregua. Cuando el aguante cae a #N -60#! o menos, cada mes los hombres se rehacen un poco (#P +15#!)."
 gg_war_ui_endurance_defensa:0 "#R La Defensa#!: aguante #V [GetGlobalVariable('gg_endurance_defensa').GetValue|0]#!, #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! de #V 3#! meses sin aguante"
 gg_war_ui_endurance_cerrito:0 "#blue_value El Cerrito#!: aguante #V [GetGlobalVariable('gg_endurance_cerrito').GetValue|0]#!, #V [GetGlobalVariable('gg_cerrito_exhausted').GetValue|0]#! de #V 3#! meses sin aguante"
 gg_war_ui_sec_table:0 "La mesa de paz"
 gg_war_ui_backer_rosas:0 "#b Buenos Aires#!\nRosas sostiene a los #blue_value blancos#!: #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100"
 gg_war_ui_backer_urquiza_cer:0 "#b Entre Ríos#!\nUrquiza, con los #blue_value blancos#!: #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_war_ui_backer_urquiza_def:0 "#b Entre Ríos#!\nUrquiza, con los #R colorados#!: #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!/100"
 gg_tt_backer_rosas:0 "Lo que Buenos Aires pone detrás del #blue_value Cerrito#!: los batallones de la Vanguardia, los pesos de cada mes y la escuadra del río. Junto con Urquiza mientras esté de ese lado, es el sostén del Cerrito: por debajo de #V 40#!, el Cerrito pierde aguante cada mes."
 gg_tt_backer_urquiza_cer:0 "El gobernador de Entre Ríos y su caballería del litoral, del lado del #blue_value Cerrito#!. Suma al sostén del Cerrito junto con Rosas: por debajo de #V 40#!, el Cerrito pierde aguante cada mes."
 gg_tt_backer_urquiza_def:0 "El gobernador de Entre Ríos se pronunció y ahora está con la #R Defensa#!: suma a su sostén junto con las potencias. Por debajo de #V 40#!, la Defensa pierde aguante cada mes."
 gg_war_ui_power_number_francia:0 "#V [GetGlobalVariable('gg_patron_francia').GetValue|0]#!/100"
 gg_war_ui_power_number_britania:0 "#V [GetGlobalVariable('gg_patron_britania').GetValue|0]#!/100"
 gg_war_ui_power_number_brasil:0 "#V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!/100"
 gg_tt_power_number:0 "Cuánto se compromete cada potencia con la causa de Montevideo, de #V 0#! a #V 100#!. Cada decisión de los eventos lo sube o lo baja.\n· Desde #V 20#!, #b Protectora#!; desde #V 60#!, #b Garante#!.\n· Los hitos mandan sobre el número: la garantía del río y la intervención la hacen Garante, Southern y Lepredour la apartan, y el Imperio no cuenta antes de 1850 por alto que esté.\nSolo el compromiso de una potencia Protectora o Garante suma al sostén de la Defensa."
 gg_war_ui_backers_lean:0 "Sostén: #R Defensa#! #V [JournalEntry.MakeScope.ScriptValue('gg_defensa_backing')|0]#!  ·  #blue_value Cerrito#! #V [JournalEntry.MakeScope.ScriptValue('gg_cerrito_backing')|0]#!"
 gg_tt_backers_lean:0 "Hacia dónde se inclinan los padrinos.\n#R Defensa#!: el compromiso de las potencias Protectoras o Garantes, y el de Urquiza si se pronunció.\n#blue_value Cerrito#!: el de Rosas, y el de Urquiza mientras siga de su lado.\nCon menos de #V 40#!, un gobierno pierde aguante cada mes: un punto por cada #V 5#! que le falten."
