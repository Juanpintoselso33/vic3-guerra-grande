l_spanish:

# ES: Contingentes extranjeros de la Guerra Grande. Las cifras y las citas estan
#     documentadas en SOURCES.md y en los comentarios de events/guerra_grande_contingents.txt.

 gg_contingent.1.t: "La Legión Argentina"
 gg_contingent.1.d: "Los proscriptos de Rosas llegan a Montevideo hace años: en el censo de 1843 hay 2.553 argentinos en la ciudad. Ahora piden servir como cuerpo propio, con bandera propia, contra el tirano del que huyeron. El general José María Paz, que será nombrado Jefe de Armas de la plaza, no se hace ilusiones sobre lo que es esta guarnición: milicias, voluntarios, guardias nacionales. «Esto no es, ni puede ser egército.»"
 gg_contingent.1.f: "Traen su pleito adentro del nuestro."
 gg_contingent.1.a: "Que formen su legión."
 gg_contingent.1.b: "La República pelea su propia guerra."
 gg_contingent.3.t: "Los vascos se pasan al Cerrito"
 gg_contingent.3.d: "El batallón vasco-navarro «Los Aguerridos» se levantó en mayo de 1842 a través de la casa naviera que trajo a los hombres: el pasaje a cambio del servicio. Nunca fue a la República a quien le debían. En febrero de 1843, con el ejército de Oribe encima de la ciudad, el contingente se sale de la línea y se va al campamento del Cerrito, donde lo funden en el Batallón de Voluntarios de Oribe."
 gg_contingent.3.f: "Hombres a los que les vendieron un pasaje, no una causa."
 gg_contingent.3.a: "Que se cierre el hueco en la línea."
 gg_contingent.4.t: "La Legión Francesa"
 gg_contingent.4.d: "Hay 5.324 franceses en Montevideo, más de un sexto de la ciudad. El 7 de abril de 1843, Juan Crisóstomo Thiébaut —viejo soldado de Napoleón, carnicero y tenedor de libros en el Plata— los convoca al Teatro Nacional y ahí mismo se forman dos compañías. El cuerpo será el batallón más fuerte de la guarnición: más de 3.000 hombres en su mejor momento. Cuando París exige que se desarme, los legionarios renuncian a la ciudadanía francesa y toman la bandera oriental."
 gg_contingent.4.f: "Once hombres dieron un paso al frente para irse. El resto se quedó."
 gg_contingent.4.a: "Que se armen y a la muralla."
 gg_contingent.4.b: "París preferiría que se volvieran a su casa."
 gg_contingent.5.t: "La Legión Italiana"
 gg_contingent.5.d: "Giuseppe Garibaldi le escribe al Ministerio de Guerra y Marina el 9 de abril de 1843. Lo que piden sus compatriotas son condiciones de milicia urbana: la misma paga y ración que los franceses, servicio en la línea de defensa y ninguna obligación de salir de la jurisdicción de la ciudad. Esa última cláusula la van a romper ellos mismos una y otra vez: en Tres Cruces, en los ríos y en San Antonio del Salto, donde menos de trescientos aguantan a una fuerza cuatro veces mayor."
 gg_contingent.5.f: "Camisas rojas, compradas baratas porque ningún saladero las quería."
 gg_contingent.5.a: "Que Garibaldi tenga su legión."
 gg_contingent.6.t: "Los Cazadores Vascos"
 gg_contingent.6.d: "Las compañías vascas de la Legión Francesa se separan en abril de 1845, por orgullo regional y por una acusación de malversación contra Thiébaut. Jean Baptiste Brie las lleva a un regimiento propio, de entre cuatrocientos y seiscientos hombres. Para 1845 un tercio son gallegos, catalanes y portugueses: las legiones son extranjeras de nombre y mezcladas de hecho."
 gg_contingent.6.f: "Una legión es quien esté dispuesto a pararse en ella."
 gg_contingent.6.a: "Que Brie tenga su regimiento."
 gg_contingent.7.t: "El Ejército Unido de Vanguardia"
 gg_contingent.7.d: "Rosas no le declara la guerra a la República. No le hace falta: reconoce a Oribe como su presidente constitucional legítimo, y al presidente legítimo le presta un ejército. El Batallón Libertad, el Independencia, los Patricios nº 3, los Lanceros y Dragones de Buenos Aires y una batería volante cruzan el río al mando de Oribe: cerca de siete mil hombres, un ejército argentino interviniendo en el Uruguay en nombre del Uruguay."
 gg_contingent.7.f: "No es una invasión. En el papel, es una intervención."
 gg_contingent.7.a: "Que vengan los batallones y a marchar."
 gg_contingent.8.t: "Caxias cruza la frontera"
 gg_contingent.8.d: "Nueve años sostuvo el Imperio su neutralidad y pagó la Defensa a escondidas, por los préstamos de Mauá. El 4 de septiembre de 1851 el Conde de Caxias cruza por Santana con 16.200 hombres en cuatro divisiones: 6.500 de infantería, 8.900 de caballería, 800 artilleros, veintiséis cañones. Oribe capitulará el 8 de octubre sin dar batalla. La cuenta llega cuatro días después, en cinco tratados: alianza, extradición, límites, comercio y un subsidio de 60.000 patacones por mes garantizado con la aduana de la República. El de límites es el que se va a recordar. El artículo 1 renuncia a la reserva de San Ildefonso —el título por el que la República reclamaba hasta el Ibicuí— y el artículo 3 la deja en costa seca: todo el espejo de la Laguna Merín y el curso del Yaguarón pasan a ser brasileños, y lo serán por cincuenta y ocho años."
 gg_contingent.8.f: "Se levanta el sitio. Se firma la hipoteca."
 gg_contingent.8.a: "Que se firme. La ciudad aguantó nueve años y no aguanta diez."
 gg_contingent.8.b: "Sin tratados. La República no le debe nada a nadie."
 gg_contingent_paz_will_come: "Y cuando haya que sostener la línea, los emigrados van a tener un general para sostenerla: José María Paz."
 gg_contingent_no_basque_chasseurs: "No va a haber Cazadores Vascos en 1845: eran compañías de esta legión, y sin ella no hay de qué separarse."
 gg_contingent_capitulation_follows: "Oribe capitula en el Pantanoso dentro del mes, sin dar batalla."
 gg_contingent_claim_stands: "Sin firma, el tratado de límites no extingue nada: el reclamo sobre la Laguna Merín y los Campos Neutrales queda en pie."
 gg_contingent_no_capitulation: "Y no hay capitulación. El sitio sigue, y la paz habrá que encontrarla por otro lado."
