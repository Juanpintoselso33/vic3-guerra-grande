 gg_contingent.5.d_nameless:0 "Los italianos de la ciudad le escriben al Ministerio de Guerra y Marina en abril de 1843. Lo que piden son condiciones de milicia urbana: la misma paga y ración que los franceses, servicio en la línea de defensa y ninguna obligación de salir de la jurisdicción de la ciudad. El decreto sale ese mismo día, con una condición: que junten al menos cien hombres.\n\nJuntan más, pero nunca serán muchos. En su mejor momento son unos setecientos, y para diciembre de 1850 quedan poco más de trescientos, de los cuales la mitad son canarios y españoles. Las camisas rojas se compran baratas porque ningún saladero las quiere, y con eso se viste la legión que Europa va a mirar veinte años después.\n\nLa cláusula de no salir de la ciudad la rompen ellos mismos una y otra vez: en Tres Cruces, en los ríos, y sobre todo en San Antonio del Salto, donde menos de trescientos aguantan a una fuerza cuatro veces mayor. Es la única tropa de la plaza que sirve a la vez de infantería y de gente de mar."
