l_spanish:

# ES: Contingentes extranjeros de la Guerra Grande. Las cifras y las citas estan
#     documentadas en SOURCES.md y en los comentarios de events/guerra_grande_contingents.txt.

 gg_contingent.1.t: "La Legión Argentina"
 gg_contingent.1.d:0 "Los proscriptos de Rosas llegan a Montevideo hace años: en el censo de 1843 hay 2.553 argentinos en la ciudad, y entre ellos están los hombres que perdieron con Lavalle y los que escribieron contra el Restaurador hasta que no les quedó imprenta del otro lado del río. Ahora piden servir como cuerpo propio, con bandera propia, contra el tirano del que huyeron.\n\nLa legión no es nueva: se levantó por primera vez en setiembre de 1839, se deshizo y se volvió a formar más de una vez, según qué derrota llegara de la Argentina. Lo que se decide hoy es si la República vuelve a darle nombre oficial a una tropa que pelea su propia guerra adentro de la nuestra, y que va a durar hasta que se disuelva en abril de 1846.\n\nEl general José María Paz, que va a ser Jefe de Armas de la plaza, no se hace ilusiones sobre lo que es esta guarnición: milicias, voluntarios, guardias nacionales y libertos de tres meses de instrucción. «Esto no es, ni puede ser egército.»"
 gg_contingent.1.f: "Traen su pleito adentro del nuestro."
 gg_contingent.1.a: "Que formen su legión."
 gg_contingent.1.b: "La República pelea su propia guerra."
 gg_contingent.3.t: "Los vascos se pasan al Cerrito"
 gg_contingent.3.d:0 "El batallón vasco-navarro «Los Aguerridos» se levantó en mayo de 1842 a través de la casa naviera que trajo a los hombres: el pasaje a cambio del servicio. Nunca fue a la República a quien le debían, y en la línea lo sabía todo el mundo.\n\nEn febrero de 1843, con el ejército de Oribe encima de la ciudad, el contingente se sale de la línea y se va al campamento del Cerrito. Ahí lo funden en el Batallón de Voluntarios de Oribe, al mando de Ramón de Artagaveytia, que con otras altas españolas llega a seiscientos o setecientos hombres: una legión extranjera del otro lado del foso, hecha con los que la ciudad había comprado.\n\nLo que se va no es solo un batallón. Se va la prueba de que el vecindario extranjero de Montevideo puede elegir bando, y de que la plata que lo trajo no compra lealtad. El hueco en la línea hay que taparlo hoy, con lo que haya."
 gg_contingent.3.f: "Hombres a los que les vendieron un pasaje, no una causa."
 gg_contingent.3.a: "Que se cierre el hueco en la línea."
 gg_contingent.4.t: "La Legión Francesa"
 gg_contingent.4.d:0 "Hay 5.324 franceses en Montevideo, más de un sexto de la ciudad. En abril de 1843, Juan Crisóstomo Thiébaut —marsellés, viejo soldado de Napoleón, después carnicero y tenedor de libros en el Plata— los convoca al Teatro Nacional, y ahí mismo se forman dos compañías. «Sin ridículas distinciones de clase o de posición», pide el Patriote Français.\n\nEl cuerpo va a ser el batallón más fuerte de la guarnición: más de tres mil hombres en su mejor momento, casi la mitad de los seis mil quinientos que la ciudad tiene sobre las armas. Adentro va, desde el primer día, un batallón vasco propio al mando de Juan Bautista Brie de Laustan, que oscila entre cuatrocientos y seiscientos milicianos.\n\nEl cónsul Théodore Pichon tiene instrucciones expresas de París: Francia es neutral, los legionarios tienen que licenciarse, la bandera francesa no se usa, y hay dinero para el que se abstenga de enlistarse. La respuesta de la plaza llega en abril de 1844, cuando los voluntarios renuncian a la ciudadanía francesa y se llaman 2ª Legión de Guardia Nacional. Siguen siendo los mismos hombres en la misma muralla."
 gg_contingent.4.f: "Once hombres dieron un paso al frente para irse. El resto se quedó."
 gg_contingent.4.a: "Que se armen y a la muralla."
 gg_contingent.4.b: "París preferiría que se volvieran a su casa."
 gg_contingent.5.t: "La Legión Italiana"
 gg_contingent.5.d:0 "Giuseppe Garibaldi le escribe al Ministerio de Guerra y Marina en abril de 1843. Lo que piden sus compatriotas son condiciones de milicia urbana: la misma paga y ración que los franceses, servicio en la línea de defensa y ninguna obligación de salir de la jurisdicción de la ciudad. El decreto sale ese mismo día, con una condición: que junten al menos cien hombres.\n\nJuntan más, pero nunca serán muchos. En su mejor momento son unos setecientos, y para diciembre de 1850 quedan poco más de trescientos, de los cuales la mitad son canarios y españoles. Las camisas rojas se compran baratas porque ningún saladero las quiere, y con eso se viste la legión que Europa va a mirar veinte años después.\n\nLa cláusula de no salir de la ciudad la rompen ellos mismos una y otra vez: en Tres Cruces, en los ríos, y sobre todo en San Antonio del Salto, donde menos de trescientos aguantan a una fuerza cuatro veces mayor. Es la única tropa de la plaza que sirve a la vez de infantería y de gente de mar."
 gg_contingent.5.f: "Camisas rojas, compradas baratas porque ningún saladero las quería."
 gg_contingent.5.a: "Que Garibaldi tenga su legión."
 gg_contingent.6.t: "Los Cazadores Vascos"
 gg_contingent.6.d:0 "Las compañías vascas de la Legión Francesa se separan en abril de 1845, por orgullo regional y por una acusación de malversación contra Thiébaut. Jean Baptiste Brie las lleva a un regimiento propio, el de Cazadores Vascos, de entre cuatrocientos y seiscientos hombres.\n\nPara 1845 un tercio de esa gente no es vasca: hay gallegos, catalanes y portugueses. Las legiones son extranjeras de nombre y mezcladas de hecho, y lo mismo pasa del otro lado, donde el batallón de Oribe junta vascos, canarios y orientales bajo una misma bandera.\n\nEl regimiento va a durar hasta el final de la guerra. En noviembre de 1849, el enviado oriental en París cuenta seiscientos trece cazadores vascos en las filas y novecientas noventa mujeres y criaturas comiendo de la ración: la plaza no mantiene soldados, mantiene familias enteras."
 gg_contingent.6.f: "Una legión es quien esté dispuesto a pararse en ella."
 gg_contingent.6.a: "Que Brie tenga su regimiento."
 gg_contingent.7.t: "El Ejército Unido de Vanguardia"
 gg_contingent.7.d:0 "Rosas no le declara la guerra a la República. No le hace falta: reconoce a Oribe como su presidente constitucional legítimo, y al presidente legítimo le presta un ejército.\n\nEl Batallón Libertad, el Independencia, los Patricios nº 3, los Lanceros y Dragones de Buenos Aires y una batería volante cruzan el río al mando de Oribe: cerca de siete mil hombres. Del otro lado de la muralla, la prensa de Montevideo va a publicar la nómina de los batallones que acampan enfrente para probar que el ejército sitiador es «casi exclusivamente argentino», y la nómina le da la razón a medias: hay entrerrianos, correntinos, canarios y orientales en la misma línea.\n\nEn el papel esto no es una invasión: es una intervención pedida por el gobierno legal. Es la misma figura que las potencias van a usar dos años después para meter sus escuadras en el río, y ninguno de los dos bandos podrá quejarse del argumento sin quejarse del propio."
 gg_contingent.7.f: "No es una invasión. En el papel, es una intervención."
 gg_contingent.7.a: "Que vengan los batallones y a marchar."
 gg_contingent.8.t: "Caxias cruza la frontera"
 gg_contingent.8.d:0 "Nueve años sostuvo el Imperio su neutralidad y pagó la Defensa a escondidas, por los préstamos de Mauá. En septiembre de 1851 el Conde de Caxias cruza por Santana con 16.200 hombres en cuatro divisiones: 6.500 de infantería, 8.900 de caballería, 800 artilleros, veintiséis cañones.\n\nOribe tiene todavía once mil hombres en armas, y ya nadie que le pague. La cuenta de la alianza llega en cinco tratados: alianza, extradición, límites, comercio y un subsidio de 60.000 patacones por mes garantizado con la aduana de la República.\n\nEl de límites es el que se va a recordar. El artículo 1 renuncia a la reserva de San Ildefonso —el título por el que la República reclamaba hasta el Ibicuí— y el artículo 3 la deja en costa seca: todo el espejo de la Laguna Merín y el curso del Yaguarón pasan a ser brasileños, y lo serán por cincuenta y ocho años."
 gg_contingent.8.f: "Se levanta el sitio. Se firma la hipoteca."
 gg_contingent.8.a: "Que se firme. La ciudad aguantó nueve años y no aguanta diez."
 gg_contingent.8.b: "Sin tratados. La República no le debe nada a nadie."
 gg_contingent_paz_will_come: "Los emigrados se agrupan alrededor de #b José María Paz#!, un general capaz de sostener su línea."
 gg_contingent_no_basque_chasseurs: "Sin la Legión Francesa, las compañías vascas no tienen cuerpo del cual formar filas propias."
 gg_contingent_capitulation_follows: "@warning! Oribe queda sin medios para sostener el Pantanoso."
 gg_contingent_claim_stands: "Sin firma, el tratado de límites no extingue nada: el reclamo sobre la Laguna Merín y los Campos Neutrales queda en pie."
 gg_contingent_no_capitulation: "Y no hay capitulación. El sitio sigue, y la paz habrá que encontrarla por otro lado."
