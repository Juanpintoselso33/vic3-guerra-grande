 gg_ui_plata_shore_mvd_fort:0 "#b Orilla de Montevideo#!\n[GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetName]\n@ships! Conserva su batería"
 gg_ui_plata_shore_mvd_nofort:0 "#b Orilla de Montevideo#!\n[GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetName]\n#N Sin batería#!"
 gg_ui_plata_card_ba_tt:0 "#b Buenos Aires gana la cuestión#! si la plaza se rinde por hambre: #V 24#! meses seguidos de río cerrado (#V 12#! desde 1851), antes de que se agote la paciencia de Londres y París.\n\n#b Quién sostiene a cada gobierno oriental#! (de 0 a 100):\nRosas #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#! · Urquiza #V [GetGlobalVariable('gg_patron_urquiza').GetValue|0]#!"
 gg_ui_plata_card_mvd_tt:0 "#b Montevideo gana la cuestión#! si el río vuelve a abrirse: porque Rosas levanta el bloqueo, o porque pierde con qué sostenerlo. Mientras entren barcos, la plaza aguanta.\n\n#b Quién sostiene a cada gobierno oriental#! (de 0 a 100):\nFrancia #V [GetGlobalVariable('gg_patron_francia').GetValue|0]#! · Gran Bretaña #V [GetGlobalVariable('gg_patron_britania').GetValue|0]#! · Brasil #V [GetGlobalVariable('gg_patron_brasil').GetValue|0]#!"
