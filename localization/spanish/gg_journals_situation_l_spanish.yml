l_spanish:
 gg_plata_patience_bar:0 "La paciencia de las potencias"
 gg_plata_patience_bar_desc:0 "#V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! meses de río cerrado. Se suman aunque el río se abra entre medio, y durante una tregua la cuenta se detiene. Al llegar a #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#! (#V 12#! si la Defensa llamó a las escuadras), con la guerra ya abierta entre los dos gobiernos orientales y con Londres o París sin cordialidad hacia Rosas, sus ministros le exigen que levante el bloqueo. Cuentan las potencias que respaldan a la Defensa (ver «Las potencias» en La Guerra Grande): una Protectora, solo junto a la otra; una Garante, aunque vaya sola."
 gg_plata_hunger_bar:0 "El hambre de la plaza"
 gg_plata_hunger_bar_desc:0 "#V [GetGlobalVariable('gg_plata_closed_streak').GetValue|0]#! meses seguidos sin que entre un barco extranjero. Un mes de río abierto vuelve la cuenta a cero, y durante una tregua se detiene. A los #V [GetPlayer.MakeScope.ScriptValue('gg_plata_hunger_threshold')|0]#! (#V 12#! desde 1851), el hambre pone a la Defensa en situación de tratar la paz con el Cerrito."
 gg_plata_phase_blockade:0 "El bloqueo del puerto"
 gg_plata_phase_blockade_desc:0 "No entra un barco extranjero y la plaza come lo que tiene."
 gg_plata_phase_ultimatum:0 "El ultimátum de las potencias"
 gg_plata_phase_ultimatum_desc:0 "Londres y París exigen el levantamiento del bloqueo, y toda la región mira qué contesta Buenos Aires."
 gg_plata_phase_intervention_port:0 "Buenos Aires bloqueada"
 gg_plata_phase_intervention_port_desc:0 "Las escuadras anglo-francesas cierran el puerto de Rosas."
 gg_plata_phase_intervention_powers:0 "La intervención en el Plata"
 gg_plata_phase_intervention_powers_desc:0 "Una guerra sin declarar contra un gobierno americano: los demás gabinetes toman nota."
 gg_ui_plata_versus:0 "vs"
 gg_ui_plata_leader_rosas:0 "#b El gobierno de Buenos Aires#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_cerrito').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_defensa:0 "#b La Defensa#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_0:0 "#b Londres y París#!\n[Character.GetFullName]\nEnviados: #b Ouseley y Deffaudis#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_1:0 "#b Londres y París#!\n[Character.GetFullName]\nEnviado: #b Hood#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_2:0 "#b Londres y París#!\n[Character.GetFullName]\nEnviados: #b Howden y Walewski#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_3:0 "#b Londres y París#!\n[Character.GetFullName]\nEnviados: #b Gore y Gros#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_leader_envoy_4:0 "#b Londres y París#!\n[Character.GetFullName]\n#b Southern#! ya firmó; sigue #b Lepredour#!\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_phase_0:0 "@ships! Fase: #P El río abierto#!"
 gg_ui_plata_phase_0_tt:0 "Los barcos extranjeros entran al puerto. Mientras el río siga abierto, Montevideo come de lo que trae el mar."
 gg_ui_plata_phase_1:0 "@ships! Fase: #N El bloqueo#!"
 gg_ui_plata_phase_1_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Cada mes de río cerrado suma al hambre de la plaza y gasta la paciencia de Londres y París.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_2:0 "@warning! Fase: #N El ultimátum#!"
 gg_ui_plata_phase_2_tt:0 "Los ministros de Londres y París exigen que se levante el bloqueo, y Rosas les debe una respuesta.\n#b Efectos#!: Argentina, prestigio #N -10%#!."
 gg_ui_plata_phase_3:0 "@warning! Fase: #N La intervención#!"
 gg_ui_plata_phase_3_tt:0 "Las escuadras de las potencias están en el río y bloquean el puerto de Buenos Aires. El paso a Montevideo no se abre solo: depende de lo que pase con la escuadra de Brown y con la batería de Rosas.\n#b Efectos#!: Buenos Aires, capacidad comercial #N -10#!; las potencias con escuadra en el río, generación de infamia #N +10%#!; la Defensa, #V 4#! fragatas prestadas por las potencias, con los pertrechos por cuenta de Francia."
 gg_ui_plata_phase_4:0 "@ships! Fase: #P El arreglo#!"
 gg_ui_plata_phase_4_tt:0 "Londres y París firmaron con Rosas, retiraron las escuadras y le reconocieron el derecho a bloquear. Si Rosas conserva la orilla de Buenos Aires y su batería, el río vuelve a estar en sus manos, y un nuevo cierre ya no trae a las escuadras."
 gg_ui_plata_key_tt:0 "El paso lo decide la orilla de Buenos Aires: si Rosas la tiene y conserva su batería, puede negárselo a las banderas extranjeras. Sin batería, o en otras manos, no hay cierre. Montevideo no cierra el río: vive de él."
 gg_war_ui_phase_1:0 "Fase: #b La revolución#!"
 gg_war_ui_phase_1_tt:0 "Después de Carpintería, donde nacieron las divisas, Rivera está en armas contra el gobierno de Oribe.\n#b Efectos#!: Uruguay, autoridad #N -10%#!."
 gg_war_ui_phase_2:0 "Fase: #b La guerra#!"
 gg_war_ui_phase_2_tt:0 "Oribe dejó el gobierno y pelea desde afuera, con las fuerzas de Rosas; en Montevideo mandan los colorados.\n#b Efectos#!: Uruguay, fuerza política del ejército #P +10%#!."
 gg_war_ui_phase_3:0 "Fase: #b Dos gobiernos#!"
 gg_war_ui_phase_3_tt:0 "La Defensa en Montevideo y el Cerrito en la campaña: cada uno se dice el gobierno legal.\n#b Efectos#!: los dos, legitimidad #N -5#!."
 gg_war_ui_phase_4:0 "Fase: #b La tregua#!"
 gg_war_ui_phase_4_tt:0 "Las armas callan mientras se negocia.\n#b Efectos#!: los dos, cansancio de guerra por bajas #P -20%#!."
 gg_war_ui_phase_5:0 "Fase: #b La paz#!"
 gg_war_ui_phase_5_tt:0 "La guerra terminó."
 gg_war_phase_revolution:0 "La revolución"
 gg_war_phase_revolution_desc:0 "Un gobierno con un ejército levantado en su contra."
 gg_war_phase_war:0 "La guerra"
 gg_war_phase_war_desc:0 "Con la guerra, los jefes militares pesan más en la política."
 gg_war_phase_siege:0 "Dos gobiernos"
 gg_war_phase_siege_desc:0 "Cada uno se dice el gobierno legal de la República."
 gg_war_phase_truce:0 "La tregua"
 gg_war_phase_truce_desc:0 "Mientras se negocia, las bajas pesan menos."

 gg_war_ui_leader_colorado:0 "#R Colorados#!\n#b [Character.GetFullName]#!"
 gg_war_ui_leader_blanco:0 "#blue_value Blancos#!\n#b [Character.GetFullName]#!"
 gg_war_ui_leader_defensa:0 "#R La Defensa#!\n#b [Character.GetFullName]#!\n[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_war_ui_leader_cerrito:0 "#blue_value El Cerrito#!\n#b [Character.GetFullName]#!\n[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon]"
 gg_war_ui_rules_toggle:0 "La guerra, en detalle"
 gg_ui_plata_card_ba_tt:0 "Para Rosas, los ríos son de la Confederación y cerrarlos es su derecho. El bloqueo es su arma contra la plaza, y a Oribe le conviene: por eso el Cerrito se lo pide. Su límite es la paciencia de las potencias que respaldan a la Defensa."
 gg_ui_plata_card_mvd_tt:0 "La Defensa vive del puerto: sin barcos no hay pan ni aduana. No puede abrir el río por sí misma, pero puede llamar a las escuadras: la paciencia de las potencias que respaldan a la Defensa dura menos, Londres y París se comprometen más con la plaza por unos años y, si lo hace antes de 1845, le cuesta legitimidad."
 gg_ui_plata_short:0 "Rosas, mientras tenga la orilla de Buenos Aires y su batería, puede cerrar el Plata a las banderas extranjeras. Cerrarlo aprieta a Montevideo y, con la guerra abierta, gasta la paciencia de las potencias que respaldan a la Defensa."
 gg_ui_plata_shore_ba:0 "#b Orilla de Buenos Aires#!\n[GetGlobalVariable('gg_plata_ba_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_shore_mvd:0 "#b Orilla de Montevideo#!\n[GetGlobalVariable('gg_plata_mvd_owner').GetCountry.GetNameNoFormatting]"
 gg_ui_plata_battery_yes:0 "#P Con batería#!"
 gg_ui_plata_battery_no:0 "#N Sin batería#!"
 gg_ui_plata_passage_open:0 "#P Abierto#!"
 gg_ui_plata_passage_closed:0 "#N Cerrado#!"
 gg_ui_plata_more:0 "La cuestión, en detalle"
 gg_ui_plata_more_body:0 "#b Los que se juegan el río#!\n· #b Rosas#!: los ríos son de la Confederación. Cierra el Plata desde Buenos Aires para rendir a la plaza por hambre.\n· #b Oribe y el Cerrito#!: el sitio por tierra no alcanza mientras entren barcos, y le piden a Rosas que cierre el río.\n· #b La Defensa#!: vive del puerto y puede llamar a las escuadras.\n· #b Londres y París#!: quieren los ríos abiertos al comercio. Pasan de la nota diplomática al bloqueo del puerto de Buenos Aires, y no se van juntas: Londres firma primero.\n· #b Brasil#!: sostiene a la Defensa para tener a Rosas lejos de sus fronteras.\n· #b Urquiza#!: pesa con Rosas mientras está con él, y con la Defensa si se da vuelta.\n\n#b El río en la guerra#!: el río lleva un solo saldo. Cada mes cerrado lo corre hacia los #blue_value blancos#! y cada mes abierto hacia los #R colorados#!; cada cuatro meses de saldo pesan un punto, hasta #V 4#! por lado. Durante una tregua no se mueve."
 gg_ui_plata_sec_river:0 "El paso del río"
 gg_ui_plata_sec_sides:0 "Frente a frente"
 gg_ui_plata_sec_clocks:0 "Los relojes"
 gg_ui_plata_shore_ba_tt:0 "La batería de Buenos Aires, en manos de Rosas, es lo único que puede cerrar el río. Si la pierde, no hay bloqueo hasta que la recupere."
 gg_ui_plata_shore_mvd_tt:0 "Montevideo no cierra el río: vive de él. Por mar le llegan la harina, la pólvora y el dinero de la aduana, que la mantienen en pie detrás de su línea."
 gg_ui_plata_supply_yes:0 "#P Llegan barcos#!"
 gg_ui_plata_supply_no:0 "#N No llegan barcos#!"
 gg_ui_plata_card_powers_tt:0 "En Londres y París, los comerciantes quieren el Paraná y el Uruguay abiertos, y los gabinetes no quieren una guerra. Mientras Rosas conserve su amistad aguantan el bloqueo; cuando la pierde, le mandan sus ministros y, si no cede, sus escuadras."
 gg_ui_plata_word_guarantee:0 "#b Río garantizado por Londres y París#!: el Cerrito no puede pedir el cierre."
 gg_ui_plata_word_guarantee_tt:0 "Rosas cedió al ultimátum. Mientras dure la garantía, el Cerrito no puede pedirle que cierre el río, y si Rosas lo cierra igual, las escuadras entran enseguida, sin nuevo ultimátum. Termina cuando Londres reconozca el derecho de bloqueo: con Londres otra vez en buenos términos con Rosas, o desde noviembre de 1849."
 gg_ui_plata_word_paris:0 "#b Río garantizado solo por París#!: el Cerrito no puede pedir el cierre."
 gg_ui_plata_word_paris_tt:0 "Londres no se metió, y Rosas cedió al ultimátum de Francia. Si Rosas cierra el río, la escuadra francesa entra enseguida. Termina cuando París también reconozca el derecho de bloqueo, sin un ultimátum pendiente: con París otra vez en buenos términos con Rosas, o desde agosto de 1850."
 gg_ui_plata_word_london:0 "#b Londres reconoció el derecho de bloqueo#!: solo cuenta la paciencia de París."
 gg_ui_plata_word_london_tt:0 "Como en el tratado Arana-Southern, Londres reconoce la soberanía argentina sobre sus ríos y su derecho a bloquear. Un cierre ya solo gasta la paciencia de París, hasta que París también arregle, siempre que no haya un ultimátum pendiente: con París otra vez en buenos términos con Rosas, o desde agosto de 1850."
 gg_ui_plata_word_settled:0 "#b Londres y París reconocieron el derecho de bloqueo#!: ningún cierre trae a las escuadras."
 gg_ui_plata_word_settled_tt:0 "Las dos potencias arreglaron con Rosas y le reconocieron el derecho a bloquear. Si Rosas vuelve a cerrar el río, aprieta a la plaza y cuenta para el hambre, pero ninguna escuadra vuelve."
 gg_plata_patience_bar_desc_france:0 "#V [GetGlobalVariable('gg_plata_closed_total').GetValue|0]#! meses de río cerrado. Se suman aunque el río se abra entre medio, y durante una tregua la cuenta se detiene. Londres no se mete en la cuestión: al llegar a #V [GetPlayer.MakeScope.ScriptValue('gg_plata_patience_threshold')|0]#! (#V 12#! si la Defensa llamó a las escuadras), con la guerra ya abierta entre los dos gobiernos orientales y con París sin cordialidad hacia Rosas, el ministro de Francia le exige que levante el bloqueo, siempre que Francia sea Garante: Protectora y sola, no reclama."
 gg_ui_plata_phase_3_france:0 "@warning! Fase: #N La intervención francesa#!"
 gg_ui_plata_phase_3_france_tt:0 "La escuadra de Francia está en el río y bloquea el puerto de Buenos Aires; Londres está afuera. Mientras Rosas conserve su orilla y su batería, puede seguir cerrando el paso a Montevideo.\n#b Efectos#!: Buenos Aires, capacidad comercial #N -10#!; Francia, generación de infamia #N +10%#!; la Defensa, #V 4#! fragatas prestadas por Francia, con los pertrechos por su cuenta."
 gg_ui_plata_leader_defensa_france:0 "#b La Defensa#!\n[Character.GetFullName]\n[GetGlobalVariable('gg_flag_defensa').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon]"
 gg_ui_plata_phase_2_france_tt:0 "Londres no se mete en la cuestión; el ministro de París exige que se levante el bloqueo, y Rosas le debe una respuesta.\n#b Efectos#!: Argentina, prestigio #N -10%#!."
