 gg_ui_plata_phase_0:0 "@ships! Fase: #P El río abierto#!"
 gg_ui_plata_phase_0_tt:0 "Entran y salen barcos por las dos orillas. Nadie reclama nada."
 gg_ui_plata_phase_1:0 "@ships! Fase: #N El bloqueo#!"
 gg_ui_plata_phase_1_tt:0 "Rosas cierra el río desde su orilla, y manda la orilla más severa.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!. Cada mes suma a la paciencia de las potencias y al hambre de la plaza."
 gg_ui_plata_phase_2:0 "@warning! Fase: #N El ultimátum#!"
 gg_ui_plata_phase_2_tt:0 "Londres y París exigen el levantamiento del bloqueo y esperan respuesta.\n#b Efectos#!: Argentina, prestigio #N -10%#! mientras dura."
 gg_ui_plata_phase_3:0 "@warning! Fase: #N La intervención#!"
 gg_ui_plata_phase_3_tt:0 "Las escuadras están en el río.\n#b Efectos#!: Buenos Aires, capacidad comercial #N -10#!; Gran Bretaña y Francia, generación de infamia #N +10%#!."
 gg_ui_plata_phase_4:0 "@ships! Fase: #P El arreglo#!"
 gg_ui_plata_phase_4_tt:0 "Londres y París ya arreglaron con Rosas y las escuadras se fueron."
 gg_ui_plata_key_tt:0 "El paso del río se gobierna desde sus dos orillas. Una orilla con su batería puede negar el paso a los barcos extranjeros; sin batería, o en otras manos, deja de cerrarlo."
 gg_war_ui_phase_0:0 "Fase: #b La previa#!"
 gg_war_ui_phase_0_tt:0 "Oribe gobierna; Rivera todavía no se levantó.\n\n#b Lo que movió la balanza el mes pasado#!\nDecisiones: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nLa partición: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nEl río pesa hoy #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (positivo para los blancos)"
 gg_war_ui_phase_1:0 "Fase: #b La revolución#!"
 gg_war_ui_phase_1_tt:0 "Rivera en armas contra el gobierno de Oribe.\n#b Efectos#!: Uruguay, autoridad #N -10%#!.\n\n#b Lo que movió la balanza el mes pasado#!\nDecisiones: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nLa partición: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nEl río pesa hoy #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (positivo para los blancos)"
 gg_war_ui_phase_2:0 "Fase: #b La guerra#!"
 gg_war_ui_phase_2_tt:0 "Rivera gobierna y Oribe pelea desde afuera con las fuerzas de Rosas.\n#b Efectos#!: Uruguay, fuerza política del ejército #P +10%#!.\n\n#b Lo que movió la balanza el mes pasado#!\nDecisiones: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nLa partición: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nEl río pesa hoy #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (positivo para los blancos)"
 gg_war_ui_phase_3:0 "Fase: #b El Sitio#!"
 gg_war_ui_phase_3_tt:0 "Dos gobiernos, cada uno el legal: la Defensa en Montevideo, el Cerrito en el resto del país.\n#b Efectos#!: los dos, legitimidad #N -5#!.\n\n#b Lo que movió la balanza el mes pasado#!\nDecisiones: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nLa partición: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nEl río pesa hoy #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (positivo para los blancos)"
 gg_war_ui_phase_4:0 "Fase: #b La tregua#!"
 gg_war_ui_phase_4_tt:0 "Las armas se callan mientras se negocia.\n#b Efectos#!: los dos, cansancio de guerra por bajas #P -20%#!.\n\n#b Lo que movió la balanza el mes pasado#!\nDecisiones: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nLa partición: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nEl río pesa hoy #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (positivo para los blancos)"
 gg_war_ui_phase_5:0 "Fase: #b La paz#!"
 gg_war_ui_phase_5_tt:0 "La guerra terminó.\n\n#b Lo que movió la balanza el mes pasado#!\nDecisiones: #blue_value [GetGlobalVariable('gg_src_last_decisions_blanco').GetValue|+=0]#! blancos · #R [GetGlobalVariable('gg_src_last_decisions_colorado').GetValue|+=0]#! colorados\nLa partición: #blue_value [GetGlobalVariable('gg_src_last_partition_blanco').GetValue|+=0]#! · #R [GetGlobalVariable('gg_src_last_partition_colorado').GetValue|+=0]#!\nEl río pesa hoy #V [JournalEntry.MakeScope.ScriptValue('gg_ui_war_river_now')|+=0]#! (positivo para los blancos)"
