# -------------------------------------------------------------------------------------------------
# EN/ES: names of the Argentine-side characters. They go through loc keys and not as literals,
#     which is how vanilla writes them too (ARG_Justo_Jose_de_Urquiza uses Justo_JosE_): a name
#     written literally in the template is a name the engine can fail to resolve, and this mod
#     already shipped three characters with random names that way.
#     / los nombres de los personajes del lado argentino. Van por clave y no literales, que es como
#     los escribe vanilla tambien: un nombre literal en el template es un nombre que el motor puede
#     no resolver, y este mod ya entrego tres personajes con nombre aleatorio asi.
# -------------------------------------------------------------------------------------------------
