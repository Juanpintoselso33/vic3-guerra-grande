l_spanish:
 gg_pact_j_band:0 "Delegan en Buenos Aires #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! de #V 13#! provincias"
 gg_pact_j_band_tt:0 "Por el Pacto Federal, las provincias le encargaron al gobernador de Buenos Aires las relaciones exteriores de la Confederación, y una legislatura puede retirarle ese encargo. Buenos Aires no se cuenta: no puede delegar en sí misma."
 gg_pact_j_short:0 "Buenos Aires no gobierna las provincias: habla por ellas. Ocho legislaturas pueden retirarle el encargo, y un pliego desatendido es el primer paso para hacerlo."
 gg_pact_j_sec_map:0 "Las trece provincias"
 gg_pact_j_legend:0 "#P Delega#! · #Y Reclamo pendiente#! · #N Encargo retirado#! · #blue_value Buenos Aires#!"
 gg_pact_j_sec_front:0 "Frente a Buenos Aires"
 gg_pact_j_versus:0 "vs"
 gg_pact_j_holder:0 "#b Buenos Aires#!\n[Character.GetFullName]"
 gg_pact_j_holder_tt:0 "El gobernador de Buenos Aires, encargado de las relaciones exteriores de la Confederación. Una provincia alzada vuelve al encargo cuando queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires recobra su tierra."
 gg_pact_j_risen:0 "[Character.GetFullName]"
 gg_pact_j_risen_tt:0 "Una provincia que retiró el encargo y se levantó contra Buenos Aires. Vuelve cuando queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires recobra su tierra."
 gg_pact_j_sec_grievances:0 "Los pliegos sin atender"
 gg_pact_j_grv_corrientes:0 "#b Corrientes#!: #N [GetGlobalVariable('gg_corrientes_agravio').GetValue|0]#! agravios sin reparar"
 gg_pact_j_grv_norte:0 "#b El Norte#! (Tucumán, Salta, Jujuy, Catamarca, La Rioja): #N [GetGlobalVariable('gg_norte_agravio').GetValue|0]#! agravios sin reparar"
 gg_pact_j_grv_entre_rios:0 "#b Entre Ríos#!: #N [GetGlobalVariable('gg_entre_rios_agravio').GetValue|0]#! agravios sin reparar"
 gg_pact_j_grv_tt:0 "Los pliegos y las disputas con Buenos Aires dejan agravios; concederlos los repara. Si al llegar la hora de la ruptura la provincia todavía tiene agravios sin reparar, retira el encargo. Sin agravios, Corrientes y el Norte se quedan; Entre Ríos pide además el Tratado de Alcaraz, el camino constituyente y la exención de Corrientes."
 gg_pact_j_sec_accounts:0 "La plata de Buenos Aires para Oribe"
 gg_pact_j_obligation_tt:0 "El gobierno de Oribe aceptó la remesa: queda obligado con Buenos Aires, y el sostén de Rosas a ese gobierno subió #P 10#!."
 gg_pact_j_more:0 "El encargo, en detalle"
 gg_pact_j_more_body:0 "#b Los que tienen voz en el encargo#!\n· #b Buenos Aires#!: habla por las trece; su gobernador es Rosas mientras gobierne.\n· #b Corrientes#!: sus pliegos llegan primero. La gobierna Berón de Astrada, y más tarde vuelven a levantarla Paz y los Madariaga.\n· #b El Norte#!: Tucumán, Salta, Jujuy, Catamarca y La Rioja pueden pronunciarse juntas en la Coalición de Avellaneda y Brizuela —y de Lamadrid, si Buenos Aires lo mandó al Norte—, y Córdoba puede sumarse.\n· #b Entre Ríos y Urquiza#!: la última provincia que puede retirar el encargo, y la más fuerte.\n· #b Santa Fe, Santiago del Estero, Mendoza, San Juan y San Luis#!: siguen delegando, con gobernadores federales como Ibarra, Benavídez y Aldao.\n· #b El gobierno de Oribe#!: recibe la plata de Buenos Aires si se la ofrecen y la acepta.\n\n#b Cómo vuelve una provincia#!: cuando la alzada queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires recobra su tierra. Las del Norte vuelven y se van juntas.\n\n#b La plata#!: Buenos Aires puede ofrecerle al gobierno de Oribe una remesa extraordinaria de #V £20.000#!, o de #V £10.000#! si delegan menos de #V 10#! provincias. Si la acepta, ese gobierno queda obligado con Buenos Aires; si después se le retira el respaldo, se corta también la plata de todos los meses.\n\n#b Cómo se cierra#!: con una Confederación negociada, con el fin de la guerra entre Buenos Aires y Entre Ríos, o cuando, desde 1851, ya no delegan más que #N 6#!."