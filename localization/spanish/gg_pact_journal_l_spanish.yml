l_spanish:
 gg_pact_j_band:0 "Delegan en Buenos Aires #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! de #V 13#! provincias"
 gg_pact_j_band_tt:0 "Por el Pacto Federal, las provincias le encargaron al gobernador de Buenos Aires las relaciones exteriores de la Confederación, y una legislatura puede retirarle ese encargo. Buenos Aires no se cuenta: no puede delegar en sí misma."
 gg_pact_j_legend:0 "#P Delega#! · #Y Reclamo pendiente#! · #N Encargo retirado#! · #blue_value Buenos Aires#!"
 gg_pact_j_more:0 "El encargo, en detalle"
 gg_pact_j_list_header:0 "Las trece provincias"
 gg_pact_j_st_0:0 "#P Delega#!"
 gg_pact_j_st_1:0 "#Y Reclamo pendiente#!"
 gg_pact_j_st_2:0 "#N Encargo retirado#!"
 gg_pact_j_grv_corrientes:0 "Agravios: #N [GetGlobalVariable('gg_corrientes_agravio').GetValue|0]#!"
 gg_pact_j_grv_norte:0 "Agravios: #N [GetGlobalVariable('gg_norte_agravio').GetValue|0]#!"
 gg_pact_j_grv_entre_rios:0 "Agravios: #N [GetGlobalVariable('gg_entre_rios_agravio').GetValue|0]#!"
 gg_pact_j_grv_none:0 "#P Sin agravios#!"
 gg_pact_j_more_body:0 "#b Los que tienen voz en el encargo#!\n· #b Buenos Aires#!: habla por las trece; su gobernador es Rosas mientras gobierne.\n· #b Las trece provincias#!, en la lista de arriba, cada una con su gobernador. Corrientes, el Norte y Entre Ríos pueden retirar el encargo; Santa Fe, Santiago y Cuyo no han pedido nada.\n· #b Una provincia que Buenos Aires bate#! queda como un país aparte: sus relaciones exteriores las lleva Buenos Aires, y su gobierno, un gobernador que elige Buenos Aires.\n\n#b Cómo se cierra#!: con una Confederación negociada, con el fin de la guerra entre Buenos Aires y Entre Ríos, o cuando, desde 1851, ya no delegan más que #N 6#!."
 gg_pact_j_gov:0 "#b [Character.GetFullName]#!"
 gg_pact_j_interim:0 "#b Gobierno interino#!"
 gg_pact_j_interim_tt:0 "Ningún gobernador ocupa el cargo por derecho propio: la provincia está entre dos gobernadores, o el suyo murió."
 gg_pact_j_st_0_tt:0 "Su legislatura mantiene en Buenos Aires el manejo de las relaciones exteriores."
 gg_pact_j_st_1_tt:0 "Un pliego de su legislatura espera respuesta de Buenos Aires."
 gg_pact_j_st_2_tt:0 "Su legislatura retiró el encargo: la provincia ya no delega en Buenos Aires sus relaciones exteriores."
 gg_pact_j_grp_norte:0 "#b El Norte#!"
 gg_pact_j_grp_norte_tt:0 "Tucumán, Salta, Jujuy, Catamarca y La Rioja comparten sus agravios y se mueven juntas, en la Coalición de Avellaneda y Brizuela —y de Lamadrid, si Buenos Aires lo mandó al Norte—; Córdoba puede sumarse. Un pliego deja un agravio al llegar y otro si se lo niega; concederlo lo repara. Batida, la Coalición se deshace en sus provincias, cada una con un gobernador que elige Buenos Aires, y vuelven juntas al encargo."
 gg_pact_j_grp_cinco:0 "#b Santa Fe, Santiago y Cuyo#!"
 gg_pact_j_grp_cinco_tt:0 "Santa Fe, Santiago del Estero y las tres provincias de Cuyo: Mendoza, San Juan y San Luis. Sus legislaturas no tienen pliegos pendientes con Buenos Aires."
 gg_pact_j_league:0 "Unidas en la Coalición del Norte bajo #b [Character.GetFullName]#!"
 gg_pact_j_name_corrientes_tt:0 "Los pliegos de Corrientes llegan primero a Buenos Aires. Cada uno deja un agravio al llegar y otro si se lo niega; concederlo lo repara. Una legislatura que al llegar la hora de la ruptura todavía tiene agravios retira el encargo. Corrientes vuelve cuando queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires tiene su tierra."
 gg_pact_j_name_entre_rios_tt:0 "La última provincia que puede retirar el encargo, y la más fuerte. Sus pliegos dejan agravios como los de las demás; aun sin ellos, Entre Ríos pide además el Tratado de Alcaraz, el camino constituyente y la exención de Corrientes. Vuelve cuando queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires tiene su tierra."
 gg_pact_j_name_corrientes:0 "#b Corrientes#!"
 gg_pact_j_name_tucuman:0 "#b Tucumán#!"
 gg_pact_j_name_salta:0 "#b Salta#!"
 gg_pact_j_name_jujuy:0 "#b Jujuy#!"
 gg_pact_j_name_catamarca:0 "#b Catamarca#!"
 gg_pact_j_name_la_rioja:0 "#b La Rioja#!"
 gg_pact_j_name_cordoba:0 "#b Córdoba#!"
 gg_pact_j_name_entre_rios:0 "#b Entre Ríos#!"
 gg_pact_j_name_santa_fe:0 "#b Santa Fe#!"
 gg_pact_j_name_santiago_del_estero:0 "#b Santiago del Estero#!"
 gg_pact_j_name_mendoza:0 "#b Mendoza#!"
 gg_pact_j_name_san_juan:0 "#b San Juan#!"
 gg_pact_j_name_san_luis:0 "#b San Luis#!"
