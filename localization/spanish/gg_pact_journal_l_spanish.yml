l_spanish:
 gg_pact_j_band:0 "Delegan en Buenos Aires #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! de #V 13#! provincias"
 gg_pact_j_band_tt:0 "Por el Pacto Federal, las provincias le encargaron al gobernador de Buenos Aires las relaciones exteriores de la Confederación, y una legislatura puede retirarle ese encargo. Buenos Aires no se cuenta: no puede delegar en sí misma."
 gg_pact_j_legend:0 "#P Delega#! · #Y Reclamo pendiente#! · #N Encargo retirado#! · #blue_value Buenos Aires#!"
 gg_pact_j_more:0 "El encargo, en detalle"
 gg_pact_j_list_header:0 "Las que pueden retirar el encargo"
 gg_pact_j_row_corrientes:0 "#b Corrientes#!"
 gg_pact_j_row_norte:0 "#b El Norte#!"
 gg_pact_j_row_entre_rios:0 "#b Entre Ríos#!"
 gg_pact_j_gov_corrientes:0 "Gobierna #b [Character.GetFullName]#!"
 gg_pact_j_gov_norte:0 "La voz del Norte: #b [Character.GetFullName]#!"
 gg_pact_j_gov_entre_rios:0 "Gobierna #b [Character.GetFullName]#!"
 gg_pact_j_st_0:0 "#P Delega#!"
 gg_pact_j_st_1:0 "#Y Reclamo pendiente#!"
 gg_pact_j_st_2:0 "#N Encargo retirado#!"
 gg_pact_j_grv_corrientes:0 "Agravios: #N [GetGlobalVariable('gg_corrientes_agravio').GetValue|0]#!"
 gg_pact_j_grv_norte:0 "Agravios: #N [GetGlobalVariable('gg_norte_agravio').GetValue|0]#!"
 gg_pact_j_grv_entre_rios:0 "Agravios: #N [GetGlobalVariable('gg_entre_rios_agravio').GetValue|0]#!"
 gg_pact_j_grv_none:0 "#P Sin agravios#!"
 gg_pact_j_row_corrientes_tt:0 "Los pliegos de Corrientes llegan primero a Buenos Aires. Cada uno deja un agravio al llegar y otro si se lo niega; concederlo lo repara. Una legislatura que al llegar la hora de la ruptura todavía tiene agravios retira el encargo. Corrientes vuelve cuando queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires tiene su tierra."
 gg_pact_j_row_norte_tt:0 "Tucumán, Salta, Jujuy, Catamarca y La Rioja comparten sus agravios y se mueven juntas, en la Coalición de Avellaneda y Brizuela —y de Lamadrid, si Buenos Aires lo mandó al Norte—; Córdoba puede sumarse. Un pliego deja un agravio al llegar y otro si se lo niega; concederlo lo repara. Vuelven juntas, cuando la Coalición queda sujeta a Buenos Aires o deja de existir y Buenos Aires tiene las provincias que se habían alzado."
 gg_pact_j_row_entre_rios_tt:0 "La última provincia que puede retirar el encargo, y la más fuerte. Sus pliegos dejan agravios como los de las demás; aun sin ellos, Entre Ríos pide además el Tratado de Alcaraz, el camino constituyente y la exención de Corrientes. Vuelve cuando queda sujeta a Buenos Aires, o cuando deja de existir y Buenos Aires tiene su tierra."
 gg_pact_j_more_body:0 "#b Los que tienen voz en el encargo#!\n· #b Buenos Aires#!: habla por las trece; su gobernador es Rosas mientras gobierne.\n· #b Corrientes, el Norte y Entre Ríos#!: las tres que pueden retirar el encargo, en la lista de arriba.\n· #b Santa Fe, Santiago del Estero, Mendoza, San Juan y San Luis#!: siguen delegando, con gobernadores federales como Ibarra, Benavídez y Aldao.\n\n#b Cómo se cierra#!: con una Confederación negociada, con el fin de la guerra entre Buenos Aires y Entre Ríos, o cuando, desde 1851, ya no delegan más que #N 6#!."
 gg_pact_j_chip_tucuman_0:0 "#P Tucumán#!"
