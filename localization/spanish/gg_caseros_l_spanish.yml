l_spanish:
 gg_argentina.41.a_tt:0 "@warning! Si el ejército de Buenos Aires es vencido en esta guerra, el gobierno de Rosas cae en el acto: #b Urquiza#! toma el mando y Rosas parte al exilio. No hay sitio ni plazo en el medio."
 gg_argentina.41.b_tt:0 "@information! La guerra sigue. Cada mes que Buenos Aires no es vencida, Entre Ríos pierde #N 5#! de apoyo a la guerra. Si a los #V 6#! meses nadie venció, la guerra se cierra sin vencedor: el Pronunciamiento queda en pie y Rosas conserva su gobierno."
 gg_argentina.41.c_tt:0 "@information! Buenos Aires resiste un sitio de #V 6#! meses como mínimo. Mientras dure no se escribe ningún final: Rosas conserva la capital y su gobierno aunque la campaña se decida antes. Si al cabo vence Entre Ríos, cae Rosas y parte al exilio, pero la Confederación sigue en pie."
 gg_argentina.83.d_pitched:0 "El ejército de Buenos Aires aceptó la batalla en campo abierto y fue vencido, y el gobierno de Rosas no sobrevivió a la jornada. Rosas se embarcó en un buque inglés rumbo a Inglaterra.\n\nUrquiza entra en Buenos Aires como jefe de la coalición vencedora. Entre Ríos no desaparece ni se vuelve una posesión porteña; conserva su gobierno dentro del arreglo que ahora debe organizar la Confederación. Las deudas de la campaña y los compromisos con el Brasil sobreviven a la victoria.\n\nLa guerra decidió quién manda. La constitución decidirá bajo qué reglas."
 gg_argentina.83.d_siege:0 "Buenos Aires sostuvo el sitio seis meses, y no alcanzó. Rosas entregó el gobierno y se embarcó en un buque inglés rumbo a Inglaterra; la ciudad quedó en pie.\n\nUrquiza entra en Buenos Aires como jefe de la coalición vencedora. Entre Ríos no desaparece ni se vuelve una posesión porteña; conserva su gobierno dentro del arreglo que ahora debe organizar la Confederación. Las deudas de la campaña y los compromisos con el Brasil sobreviven a la victoria.\n\nLa guerra decidió quién manda. La constitución decidirá bajo qué reglas."
 gg_argentina.85.d_manoeuvre:0 "Seis meses de marchas y contramarchas no trajeron la batalla que Urquiza buscaba, y su ejército se cansó antes que el de Buenos Aires. La guerra se cerró sin vencedor.\n\nNo hay Confederación reunificada ni caída de Rosas. Hay dos autoridades que sobrevivieron y un Pacto Federal incapaz de volver a reunirlas por sí solo.\n\nLa campaña cierra en división. Cualquier reunificación futura tendrá que nacer de otro acuerdo o de otra guerra."
 gg_caseros.2.t:0 "La respuesta de Rosas"
 gg_caseros.2.d_battle:0 "Rosas nos espera en campo abierto. Si su ejército es vencido, su gobierno cae en el acto y él se va al exilio."
 gg_caseros.2.d_manoeuvre:0 "Rosas no presenta batalla: maniobra para elegir él el campo. Cada mes que no lo alcanzamos nos cuesta #N 5#! de apoyo a la guerra, y si a los #V 6#! meses nadie venció, la guerra se cierra sin vencedor."
 gg_caseros.2.d_siege:0 "Rosas se encierra en Buenos Aires. La plaza aguantará #V 6#! meses como mínimo, y hasta entonces, aunque la campaña se decida, él conserva la capital y su gobierno."
 gg_caseros.2.a:0 "Adelante."
 gg_caseros.3.t:0 "Se cumple el sitio de Buenos Aires"
 gg_caseros.3.d:0 "Se cumplieron seis meses de sitio. Desde ahora, lo que decida la guerra entre Buenos Aires y Entre Ríos se cumple sin más espera."
 gg_caseros.3.a:0 "Que se sepa."
 gg_caseros.4.d:0 "La guerra terminó sin que derribáramos a Rosas ni él nos sometiera. El Pronunciamiento queda en pie: Entre Ríos conserva la facultad que reasumió, y Rosas su gobierno."
 gg_caseros.4.d_manoeuvre:0 "Seis meses persiguiendo a un ejército que no presentaba batalla cansaron a nuestras tropas antes que a las suyas. La guerra se cerró sin vencedor: el Pronunciamiento queda en pie, y Rosas conserva su gobierno."
 gg_caseros.4.a:0 "Volver a Entre Ríos."
 gg_caseros.5.d:0 "Buenos Aires fue vencida. Urquiza toma el mando de la Confederación, y Entre Ríos conserva su gobierno dentro del arreglo que ahora hay que organizar."
 gg_caseros.5.d_exile:0 "Buenos Aires fue vencida y el gobierno de Rosas cayó con ella: Rosas partió al exilio en un buque inglés. Urquiza toma el mando de la Confederación, y Entre Ríos conserva su gobierno dentro del arreglo que ahora hay que organizar."
 gg_caseros.5.a:0 "Entrar en Buenos Aires."
 gg_pact_war_tilt_tt:0 "@warning! Buenos Aires no sale de la defensiva: mientras dure esta guerra, #b Entre Ríos#! gana #P +30#! de apoyo a la guerra por mes. Si el Litoral cruza en armas, las filas de Buenos Aires se desgranan: #N -40#! por mes."
 gg_pact_war_hold_tt:0 "@warning! Ningún bando deja las armas antes de tiempo: hasta el verano de 1852, el apoyo a la guerra de #b Entre Ríos#! y de #b Buenos Aires#! se repone cada semana que baja de #V 50#!."
