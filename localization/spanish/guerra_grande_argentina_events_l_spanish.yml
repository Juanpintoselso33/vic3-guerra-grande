l_spanish:
 gg_argentina.1.t:0 "Corrientes se separa"
 gg_argentina.1.d:0 "Corrientes acaba de desconocer al gobierno de Buenos Aires y de declararle la guerra. El gobernador #b Genaro Berón de Astrada#! no invoca doctrinas: invoca el #b bloqueo sobre su comercio#!. Es la provincia del #V 68#! por ciento de la yerba y de los cueros que bajan por el Paraná, y el puerto por donde tienen que pasar está cerrado por orden de usted.\n\nSe va con Misiones. Corrientes ocupa el territorio al sur del Aguapey desde #V 1830#!, lo repartió en enfiteusis y reivindicó la comarca entera el #b 1 de septiembre de 1832#!. De hecho y de derecho declarado, esa tierra es suya, y se la lleva.\n\nY se va #b sola#!. Ninguna otra provincia la acompaña: ni Entre Ríos, ni Santa Fe, ni el norte. La aislada Corrientes contra la Confederación entera es una cuenta que cualquiera sabe hacer — y aun así se separó."
 gg_argentina.1.f:0 "Una provincia, un río cerrado, y ninguna compañía."
 gg_argentina.1.a:0 "Que marche el ejército."
 gg_argentina.1.b:0 "Acompañar a Corrientes."
 gg_argentina.2.t:0 "Tucumán se pronuncia"
 gg_argentina.2.d:0 "Tucumán no se ha rebelado: ha hecho algo más preciso y más grave. Ha desconocido a usted #b en su carácter de gobernador de Buenos Aires#! y le ha #b retirado la delegación de las relaciones exteriores#!. Lo que se reclama no es la alianza con Francia: es que haya constitución.\n\nEn el correr del mes lo imitan #b Salta, Jujuy, Catamarca y La Rioja#!. Cinco provincias, y la cuenta puede seguir. El poder de usted sobre ellas nunca fue soberanía: fue una facultad prestada, y cinco legislaturas acaban de recordárselo.\n\nUna sola se niega de plano. #b Juan Felipe Ibarra#!, de Santiago del Estero, no firma — y su provincia queda como una cuña de suelo federal clavada en el medio del norte, partiendo el bloque en dos mitades que no se tocan."
 gg_argentina.2.f:0 "No es una rebelión: es una facultad que se reasume."
 gg_argentina.2.a:0 "El norte se pronuncia."
 gg_argentina.3.t:0 "El Pronunciamiento"
 gg_argentina.3.d:0 "Todos los años usted presenta la renuncia al mando de las relaciones exteriores, y todos los años las provincias se la rechazan. Es una ceremonia: se ofrece lo que se sabe que nadie va a tomar.\n\nEste año la Legislatura de Entre Ríos la #b aceptó#!. Y en mayo, la Convención lo pondrá por escrito con todas las letras: Entre Ríos, #b «habiendo reasumido»#! la facultad concedida al gobernador de Buenos Aires, vuelve a tratar por sí misma con las demás naciones.\n\nNo hay ninguna ilegalidad que denunciar, y ahí está lo peor. El Pacto Federal de 1831 es un tratado entre entidades soberanas, y cada una conservó el derecho de retirar lo que prestó. #b Justo José de Urquiza#! no ha usurpado nada: ha tomado la palabra de usted."
 gg_argentina.3.f:0 "Le aceptaron la renuncia."
 gg_argentina.3.a:0 "Entonces es la guerra."
 gg_argentina.3.b:0 "Pasar a Entre Ríos."
 gg_argentina.4.t:0 "Córdoba adhiere"
 gg_argentina.4.d:0 "Seis meses después del pronunciamiento de Tucumán, #b Córdoba#! se suma a la Coalición. Son #b seis provincias simultáneas#!, y ya no es un asunto del norte: la línea llega al corazón del camino que une Buenos Aires con el interior.\n\nLa Coalición ha dejado de ser un acuerdo de gobernadores. Tiene congreso de agentes reunido en Tucumán, tiene un director con facultad de hacer la guerra, firmar la paz y negociar empréstitos, y ahora tiene la provincia mediterránea más poblada.\n\nLo que no tiene es continuidad territorial. Santiago del Estero sigue sin firmar, y entre las seis provincias y el Litoral hay una cuña que obedece a Buenos Aires."
 gg_argentina.4.f:0 "Seis provincias, y un agujero en el medio."
 gg_argentina.4.a:0 "Seis, entonces."
 gg_argentina.10.t:0 "Pago Largo"
 gg_argentina.10.d:0 "Veinticinco días después de desconocer a Buenos Aires, el ejército correntino se deshizo en Pago Largo. #b Genaro Berón de Astrada#! murió mandándolo; ninguna provincia había acudido.\n\nFue exactamente lo que cualquiera podía calcular en marzo: una provincia sola contra la Confederación entera. Lo que no se calculaba es que se separara igual.\n\nLa Legislatura de Corrientes se somete a los vencedores. El río vuelve a estar cerrado, y la cuenta de la aduana vuelve a ser una sola."
 gg_argentina.10.f:0 "Ninguna otra provincia acudió."
 gg_argentina.10.a:0 "Que aprendan las demás."
 gg_argentina.11.t:0 "Quebracho Herrado"
 gg_argentina.11.d:0 "El Ejército Unido de Vanguardia alcanzó a Lavalle en Quebracho Herrado y lo deshizo. Del lado unitario quedaron más de mil quinientos muertos; del federal, treinta y seis.\n\nY conviene decir por qué, porque no fue una lección de táctica. Lavalle y #b Lamadrid#! habían acordado juntarse en la posta de Romero el 20 de noviembre. Lavalle llegó tarde y #b Lamadrid se había retirado sin avisar#!. La Coalición perdió su mejor ejército por una desinteligencia entre dos generales que no se hablaban.\n\nQuien manda esa vanguardia es #b Manuel Oribe#!, presidente depuesto de la República Oriental, que pelea la guerra de usted mientras espera la suya."
 gg_argentina.11.f:0 "Se perdió en una posta, no en el campo."
 gg_argentina.11.a:0 "Que siga hacia el norte."
 gg_argentina.12.t:0 "Famaillá, y después Metán"
 gg_argentina.12.d:0 "En Famaillá los milicianos tucumanos #b se retiraron sin luchar#!. Lavalle escapó con lo que le quedaba y moriría tres semanas después en Jujuy, por una bala que atravesó la cerradura de una puerta.\n\nDespués vino Metán. El gobernador #b Marco Avellaneda#! fue degollado en presencia de Oribe, y su cabeza clavada en una pica en la plaza de Tucumán. Unos dos mil opositores cruzaron a Chile.\n\nLa Coalición del Norte dejó de existir en dieciocho meses. Y el ejército que la deshizo queda libre — con su jefe mirando hacia el este, donde está Montevideo."
 gg_argentina.12.f:0 "Y la cabeza en una pica, en la plaza."
 gg_argentina.12.a:0 "El norte está quieto."
