l_spanish:
 gg_argentina.1.t:0 "Corrientes se separa"
 gg_argentina.1.d:0 "Corrientes acaba de desconocer al gobierno de Buenos Aires y de declararle la guerra. El gobernador #b Genaro Berón de Astrada#! no invoca doctrinas: invoca el #b bloqueo sobre su comercio#!. Es la provincia del #V 68#! por ciento de la yerba y de los cueros que bajan por el Paraná, y el puerto por donde tienen que pasar está cerrado por orden de usted.\n\nSe va con Misiones. Corrientes ocupa el territorio al sur del Aguapey desde #V 1830#!, lo repartió en enfiteusis y reivindicó la comarca entera el #b 1 de septiembre de 1832#!. De hecho y de derecho declarado, esa tierra es suya, y se la lleva.\n\nY se va #b sola#!. Ninguna otra provincia la acompaña: ni Entre Ríos, ni Santa Fe, ni el norte. La aislada Corrientes contra la Confederación entera es una cuenta que cualquiera sabe hacer — y aun así se separó."
 gg_argentina.1.f:0 "Una provincia, un río cerrado, y ninguna compañía."
 gg_argentina.1.a:0 "Que marche el ejército."
 gg_argentina.1.b:0 "Acompañar a Corrientes."
 gg_argentina.2.t:0 "Tucumán se pronuncia"
 gg_argentina.2.d:0 "Tucumán no se ha rebelado: ha hecho algo más preciso y más grave. Ha desconocido a usted #b en su carácter de gobernador de Buenos Aires#! y le ha #b retirado la delegación de las relaciones exteriores#!. Lo que se reclama no es la alianza con Francia: es que haya constitución.\n\nEn el correr del mes lo imitan #b Salta, Jujuy, Catamarca y La Rioja#!. Cinco provincias, y la cuenta puede seguir. El poder de usted sobre ellas nunca fue soberanía: fue una facultad prestada, y cinco legislaturas acaban de recordárselo.\n\nUna sola se niega de plano. #b Juan Felipe Ibarra#!, de Santiago del Estero, no firma — y su provincia queda como una cuña de suelo federal clavada en el medio del norte, partiendo el bloque en dos mitades que no se tocan."
 gg_argentina.2.f:0 "No es una rebelión: es una facultad que se reasume."
 gg_argentina.2.a:0 "El norte se pronuncia."
 gg_argentina.3.t:0 "El Pronunciamiento"
 gg_argentina.3.d:0 "Todos los años usted presenta la renuncia al mando de las relaciones exteriores, y todos los años las provincias se la rechazan. Es una ceremonia: se ofrece lo que se sabe que nadie va a tomar.\n\nEste año la Legislatura de Entre Ríos la #b aceptó#!. Y en mayo, la Convención lo pondrá por escrito con todas las letras: Entre Ríos, #b «habiendo reasumido»#! la facultad concedida al gobernador de Buenos Aires, vuelve a tratar por sí misma con las demás naciones.\n\nNo hay ninguna ilegalidad que denunciar, y ahí está lo peor. El Pacto Federal de 1831 es un tratado entre entidades soberanas, y cada una conservó el derecho de retirar lo que prestó. #b Justo José de Urquiza#! no ha usurpado nada: ha tomado la palabra de usted."
 gg_argentina.3.f:0 "Le aceptaron la renuncia."
 gg_argentina.3.a:0 "Aceptar la reasunción y convocar un congreso."
 gg_argentina.3.b:0 "Declarar la medida una rebelión."
 gg_argentina.3.c:0 "Declarar la rebelión y pasar a Entre Ríos."
 gg_pronunciamiento_accept_tt:0 "@information! #b Entre Ríos#! reasume pacíficamente las relaciones exteriores: su delegación se retira, no se abre una guerra y queda convocado un #V congreso constituyente#!."
 gg_pronunciamiento_rebelion_tt:0 "@warning! #b Entre Ríos#! retira su delegación, nace con el ejército reunido bajo Urquiza y comienza una #N guerra real#! por el Pacto Federal. Queda abierta la vía diplomática entre Entre Ríos, Montevideo y el Brasil."
 gg_argentina.4.t:0 "Córdoba adhiere"
 gg_argentina.4.d:0 "Seis meses después del pronunciamiento de Tucumán, #b Córdoba#! se suma a la Coalición. Son #b seis provincias simultáneas#!, y ya no es un asunto del norte: la línea llega al corazón del camino que une Buenos Aires con el interior.\n\nLa Coalición ha dejado de ser un acuerdo de gobernadores. Tiene congreso de agentes reunido en Tucumán, tiene un director con facultad de hacer la guerra, firmar la paz y negociar empréstitos, y ahora tiene la provincia mediterránea más poblada.\n\nLo que no tiene es continuidad territorial. Santiago del Estero sigue sin firmar, y entre las seis provincias y el Litoral hay una cuña que obedece a Buenos Aires."
 gg_argentina.4.f:0 "Seis provincias, y un agujero en el medio."
 gg_argentina.4.a:0 "Seis, entonces."
 gg_argentina.10.t:0 "Pago Largo"
 gg_argentina.10.d:0 "Veinticinco días después de desconocer a Buenos Aires, el ejército correntino se deshizo en #b Pago Largo#!. #b Genaro Berón de Astrada#! murió mandándolo; ninguna provincia había acudido.\n\nFue la cuenta que cualquiera podía hacer en marzo: una provincia sola contra la Confederación entera. En el campo quedaron el gobernador y el ejército con que había abierto la guerra.\n\nEl parte no trae una capitulación de la Legislatura ni una provincia reincorporada. Trae una fuerza enemiga rota, un jefe muerto y una campaña que todavía deberá resolverse sobre el terreno."
 gg_argentina.10.f:0 "Ninguna otra provincia acudió."
 gg_argentina.10.a:0 "El campo es nuestro; que siga la campaña."
 gg_argentina.11.t:0 "Quebracho Herrado"
 gg_argentina.11.d:0 "El Ejército Unido de Vanguardia alcanzó a Lavalle en Quebracho Herrado y lo deshizo. Del lado unitario quedaron más de mil quinientos muertos; del federal, treinta y seis.\n\nY conviene decir por qué, porque no fue una lección de táctica. Lavalle y #b Lamadrid#! habían acordado juntarse en la posta de Romero el 20 de noviembre. Lavalle llegó tarde y #b Lamadrid se había retirado sin avisar#!. La Coalición perdió su mejor ejército por una desinteligencia entre dos generales que no se hablaban.\n\nQuien manda esa vanguardia es #b Manuel Oribe#!, presidente depuesto de la República Oriental, que pelea la guerra de usted mientras espera la suya."
 gg_argentina.11.f:0 "Se perdió en una posta, no en el campo."
 gg_argentina.11.a:0 "Que siga hacia el norte."
 gg_argentina.12.t:0 "Famaillá, y después Metán"
 gg_argentina.12.d:0 "En #b Famaillá#! los milicianos tucumanos #b se retiraron sin luchar#!. #b Lavalle#! escapó con lo que le quedaba y moriría tres semanas después en Jujuy, por una bala que atravesó la cerradura de una puerta.\n\nDespués vino #b Metán#!. El gobernador #b Marco Avellaneda#! fue degollado en presencia de #b Oribe#!, y su cabeza clavada en una pica en la plaza de Tucumán. Unos #N dos mil#! opositores cruzaron a Chile.\n\nEl parte enumera muertos, fugitivos y una fuerza enemiga deshecha; no trae la rendición de las provincias que todavía sostienen la Coalición. La vanguardia ganó el campo, pero el norte sigue siendo una campaña."
 gg_argentina.12.f:0 "Y la cabeza en una pica, en la plaza."
 gg_argentina.12.a:0 "Reorganizar la vanguardia; la campaña sigue."
 gg_argentina.21.t:0 "El cruce de la Vanguardia"
 gg_argentina.21.d:0 "—El general Oribe está frente a Montevideo —informa el ministro—. Es el mismo Ejército Unido de Vanguardia que deshizo a Rivera en Arroyo Grande, y vuelve de la campaña del interior con la fuerza que quedó en pie. Hay que decidir qué cruza ahora y qué fuerza queda de este lado del río.\n\nPodemos mandar cuanto quedó y exigir que el litoral levante después su propia caballería; apartar una división antes del cruce; o retener al ejército hasta que esta orilla esté asegurada. No hay más tropas que repartir: cualquier fuerza guardada aquí faltará allá."
 gg_argentina.21.f:0 "Una sola vanguardia, dos orillas."
 gg_argentina.21.a:0 "Que cruce todo lo que quedó en pie."
 gg_argentina.21.b:0 "Que una división quede para el litoral."
 gg_argentina.21.c:0 "Que primero se asegure esta orilla."
 gg_argentina.21.t_held:0 "La Vanguardia se queda"
 gg_argentina.21.d_held:0 "—El general Oribe está frente a Montevideo —informa el ministro—, pero llega con sus orientales y nada más. El Ejército Unido de Vanguardia no puede seguirlo: el interior sigue en armas, y cada batallón que cruce el río es un batallón que falta contra las provincias alzadas.\n\nLa Confederación no puede sostener dos guerras con un solo ejército. Mientras una provincia desconozca el Pacto, la Vanguardia se queda de este lado del río.\n\nOribe tendrá que sitiar la plaza con lo que es suyo, y Buenos Aires le mandará lo que pueda cuando el interior esté en orden."
 gg_argentina.21.e:0 "Primero el interior."
 gg_argentina.30.t:0 "El mandato ya no alcanza"
 gg_argentina.30.d:0 "Más de la mitad de las provincias dejó de reconocer en Buenos Aires el encargo de conducir las relaciones exteriores. Algunas conservaron la delegación; otras la retiraron, y esa diferencia ya impide que una sola firma obligue a la Confederación.\n\nEl Pacto Federal no desaparece ni entrega automáticamente una vara de tierra. Lo que cae es el gobierno que pretendía hablar por todas las provincias con un mandato que ahora conserva una minoría. Los gobiernos provinciales siguen donde estaban; la disputa territorial se resolverá por sus propias guerras y tratados.\n\nLa aduana sigue en Buenos Aires. La representación común, no. Hace falta otro gobierno y otro arreglo."
 gg_argentina.30.f:0 "Una mayoría dejó de delegar; las provincias que no lo hicieron siguen en el mapa y en el pacto."
 gg_argentina.30.a:0 "Entregar el gobierno y abrir la organización constitucional."
 gg_argentina.82.t:0 "La Confederación negociada"
 gg_argentina.82.d:0 "El Congreso deja de ser una promesa para después de la próxima crisis. Buenos Aires reconoce que la conducción de las relaciones exteriores no puede seguir siendo una prórroga anual sin constitución; Entre Ríos acepta permanecer dentro del arreglo común y los pliegos pendientes se cierran sin otra campaña.\n\nRosas conserva el gobierno de Buenos Aires, pero no el sistema intacto: navegación, representación provincial y organización nacional quedan sujetos al pacto escrito que acaba de conceder. Ninguna provincia fue conquistada, y no hizo falta una batalla.\n\nEl viejo encargo termina porque se convierte en instituciones."
 gg_argentina.82.f:0 "Lo delegado por las legislaturas vuelve escrito por un congreso."
 gg_argentina.82.a:0 "Convocar a las provincias y cumplir lo firmado."
 gg_argentina.83.t:0 "La victoria de Urquiza"
 gg_argentina.83.d:0 "El ejército de Buenos Aires fue vencido y Entre Ríos impuso sus condiciones. Rosas ya no puede presentar la conducción de las relaciones exteriores como un encargo vigente: el gobierno que la ejercía cayó con la derrota.\n\nUrquiza entra en Buenos Aires como jefe de la coalición vencedora. Entre Ríos no desaparece ni se vuelve una posesión porteña; conserva su gobierno dentro del arreglo que ahora debe organizar la Confederación. Las deudas de la campaña y los compromisos con el Brasil sobreviven a la victoria.\n\nLa guerra decidió quién manda. La constitución decidirá bajo qué reglas."
 gg_argentina.83.f:0 "Caseros no fue solo una batalla: fue el fin de un gobierno."
 gg_argentina.83.a:0 "Instalar al vencedor y convocar la organización nacional."
 gg_argentina.84.t:0 "El mandato renovado por las armas"
 gg_argentina.84.d:0 "Buenos Aires impuso sus condiciones y Entre Ríos volvió a quedar subordinada en la conducción exterior. Rosas ganó la guerra, y la victoria lo confirma en el mando.\n\nLa delegación entrerriana se restaura, pero la rebelión no puede borrarse del expediente. Corrientes, las deudas de la campaña y las concesiones de navegación conservan sus propios resultados. Y si la guerra oriental ya terminó, el ejército de Oribe no vuelve.\n\nEl gobernador conserva el encargo. La falta de constitución se vuelve ahora el precio visible de haberlo conservado por la fuerza."
 gg_argentina.84.f:0 "Ganó Buenos Aires; la pregunta constitucional sobrevivió."
 gg_argentina.84.a:0 "Registrar la victoria y exigir nuevamente la delegación."
 gg_argentina.85.t:0 "Dos gobiernos, ningún vencedor"
 gg_argentina.85.d:0 "La guerra terminó sin que Buenos Aires sometiera a Entre Ríos ni Entre Ríos derribara al gobierno de Buenos Aires. El Pronunciamiento no se deshace: la provincia conserva la facultad que reasumió. Rosas conserva su gobierno, pero ya no puede hablar en nombre del litoral rebelado.\n\nNo hay Confederación reunificada ni caída de Rosas. Hay dos autoridades que sobrevivieron y un Pacto Federal incapaz de volver a reunirlas por sí solo.\n\nLa campaña cierra en división. Cualquier reunificación futura tendrá que nacer de otro acuerdo o de otra guerra."
 gg_argentina.85.f:0 "La paz detuvo los ejércitos; no reparó el mandato."
 gg_argentina.85.a:0 "Reconocer la división y cerrar el expediente."
 gg_arg_ejercito_correntino:0 "Ejército Correntino"
 gg_arg_ejercito_coalicion:0 "Ejército de la Coalición"
 gg_arg_ejercito_entrerriano:0 "Ejército Entrerriano"
 gg_arg_division_litoral:0 "División del Litoral"
 gg_argentina.40.t:0 "Renuncia Pacheco"
 gg_argentina.40.d:0 "#b Ángel Pacheco#! ha presentado su renuncia al mando. Es el general más capaz que le queda, el que ganó Rodeo del Medio, y se va a dos días de la batalla.\n\nNo se va por miedo. Se va porque hace semanas que recibe órdenes que se contradicen entre sí y que llegan cuando ya no sirven, y porque no está dispuesto a mandar una batalla que no puede dirigir.\n\nEl ejército queda al mando de usted, y usted no ha conducido una acción de campaña en veinte años."
 gg_argentina.40.f:0 "A dos días, y por escrito."
 gg_argentina.40.a:0 "Que se vaya."
 gg_argentina.41.t:0 "La hora de Caseros"
 gg_argentina.41.d:0 "El Ejército Grande está a unas leguas. Son entrerrianos, correntinos, orientales de la Defensa y brasileños, y lo manda el hombre que usted mismo llamó, hace dieciséis años, «ese jefe será su ruina».\n\nNo hay ya delegación que invocar ni congreso que prometer. Queda el ejército, el campo y las horas que faltan hasta que amanezca.\n\nTiene tres caminos, y la posteridad va a discutir durante un siglo cuál debió tomar."
 gg_argentina.41.f:0 "3 de febrero de 1852."
 gg_argentina.41.a:0 "Presentar batalla donde nos encuentren."
 gg_argentina.41.b:0 "Maniobrar y elegir nosotros el campo."
 gg_argentina.41.c:0 "Replegarse sobre Buenos Aires y sostener la plaza."
 gg_argentina.50.t:0 "Un mandato restituido"
 gg_argentina.50.d:0 "Se ha registrado una restitución de la delegación de relaciones exteriores a Buenos Aires.\n\nEl mandato retirado vuelve a estar vigente. La noticia corresponde a una reincorporación particular, no a la reunificación de todas las provincias.\n\nLa restitución ya está asentada en el Pacto."
 gg_argentina.50.f:0 "Buenos Aires vuelve a recibir el encargo."
 gg_argentina.50.a:0 "Que se registre la restitución."
 gg_argentina.51.t:0 "Corrientes: mandato restituido"
 gg_argentina.51.d:0 "#b Corrientes#! vuelve a delegar en Buenos Aires sus relaciones exteriores.\n\nNo es una anexión: conserva su propio gobierno.\n\nEl Pacto asienta el retorno; el mandato de las demás provincias sigue como estaba."
 gg_argentina.52.t:0 "Corrientes: mandato restituido"
 gg_argentina.52.d:0 "#b Corrientes#! volvió a quedar bajo el gobierno de Buenos Aires: su gobierno separado dejó de existir, y con él vuelve a regir su delegación de las relaciones exteriores.\n\nEl Pacto asienta el retorno; el mandato de las demás provincias sigue como estaba."
 gg_argentina.53.t:0 "La Coalición del Norte, disuelta"
 gg_argentina.53.d:0 "#b La Coalición del Norte#! dejó de existir. Batida en el campo, la liga se deshizo en las provincias que la formaban, y cada una vuelve a delegar en Buenos Aires sus relaciones exteriores, con un gobernador que elige Buenos Aires.\n\nNo es una anexión: cada provincia conserva su legislatura y su nombre.\n\nEl Pacto asienta el retorno; el mandato de las demás provincias sigue como estaba."
 gg_argentina.54.t:0 "La Coalición del Norte: mandato restituido"
 gg_argentina.54.d:0 "#b La Coalición del Norte#! volvió a quedar bajo el gobierno de Buenos Aires: su gobierno separado dejó de existir, y con él vuelve a regir la delegación de sus provincias.\n\nEl Pacto asienta el retorno; el mandato de las demás provincias sigue como estaba."
 gg_argentina.55.t:0 "Entre Ríos: mandato restituido"
 gg_argentina.55.d:0 "#b Entre Ríos#! vuelve a delegar en Buenos Aires sus relaciones exteriores.\n\nNo es una anexión: conserva su propio gobierno.\n\nEl Pacto asienta el retorno; el mandato de las demás provincias sigue como estaba."
 gg_argentina.56.t:0 "Entre Ríos: mandato restituido"
 gg_argentina.56.d:0 "#b Entre Ríos#! volvió a quedar bajo el gobierno de Buenos Aires: su gobierno separado dejó de existir, y con él vuelve a regir su delegación de las relaciones exteriores.\n\nEl Pacto asienta el retorno; el mandato de las demás provincias sigue como estaba."
 gg_argentina.5.t:0 "El pacto de la Liga del Norte"
 gg_argentina.5.d:0 "El Congreso de Agentes sesiona en Tucumán desde el #b 22 de agosto#!, y el veinticuatro de septiembre firmó lo que vino a firmar: una alianza defensiva y ofensiva de #V cinco#! provincias — Tucumán, Salta, Jujuy, Catamarca y La Rioja —, juramentadas a darle una constitución a la República y a hacerle la guerra a usted hasta que la haya.\n\nY le puso cabeza. #b Tomás Brizuela#!, gobernador de La Rioja, es Director de la Liga, con los «asuntos generales» en la mano y la facultad de #b hacer la guerra, firmar la paz y negociar empréstitos «dentro o fuera de la República»#!, además de celebrar tratados — estos últimos sujetos a la ratificación de cada provincia.\n\nNo lo eligieron por sus letras. Tiene el ejército más numeroso y mejor armado de la Coalición y la oficialidad más destacada, y controla los pasos de montaña a Chile, de donde esperan lo que no saben fabricar. El pronunciamiento lo escribieron los doctores; desde hoy responde por él un militar."
 gg_argentina.5.f:0 "«Hacer la guerra, firmar la paz, negociar empréstitos.»"
 gg_argentina.5.a:0 "Una liga con un solo hombre al frente."
 gg_argentina.6.t:0 "Caá Guazú"
 gg_argentina.6.d:0 "#b Pascual Echagüe#! entró en Corrientes con unos #V cinco mil#! hombres y volvió sin nada. #b José María Paz#! lo esperó en Caá Guazú con #V tres mil#!, lo aguantó con la infantería y cerró con la caballería, y el ejército entrerriano dejó de existir en una tarde: #N ochocientos#! muertos y #N mil#! prisioneros, contra #V cincuenta y tres#! muertos correntinos.\n\nEl campo importa menos que la aritmética, y la aritmética es el peor parte que le llegó del interior. Corrientes vuelve a ser una provincia en armas, con un ejército que ganó y un general que sabe conservarlo — el mismo #b Paz#! que pasó ocho años preso y salió para volver a mandar.\n\nHay un nombre que no está en el orden de batalla y le va a costar más que los mil prisioneros: Echagüe no llevó a #b Justo José de Urquiza#!, y Urquiza no va a tardar en ocupar la silla a la que Echagüe está volviendo."
 gg_argentina.6.f:0 "Cincuenta y tres hombres, contra mil ochocientos."
 gg_argentina.6.a:0 "Echagüe está terminado."
 gg_argentina.7.t:0 "El Paso de los Libres"
 gg_argentina.7.d:0 "Los hermanos #b Madariaga#! no vinieron a restaurar a nadie. Después de Arroyo Grande se negaron a arrimar sus escuadrones para salvar a #b Pedro Ferré#!, se volvieron a su estancia y dejaron pasar cuatro meses.\n\nEl primero de abril cruzaron el Uruguay desde suelo brasileño, por un paso que bautizaron #b de los Libres#!, y en #V trece#! días estaban en la ciudad. Lo que armaron ahí es de ellos y de nadie más: un partido unitario propio, y la confiscación de los bienes de #b todos los federales#! de la provincia — el método de Lavalle, y se dirá que también el suyo.\n\n#b Joaquín#! gobierna y #b Juan#! manda, y ese reparto del trabajo es la razón de que vayan a durar. Corrientes vuelve a estar de pie sobre el flanco mismo del río, en el mes en que su ejército llega frente a Montevideo en la otra orilla."
 gg_argentina.7.f:0 "Trece días del paso a la ciudad."
 gg_argentina.7.a:0 "La provincia vuelve a ser de ellos."
 gg_arg_division_rioja:0 "División Riojana"
 gg_arg_ejercito_caa_guazu:0 "Ejército de Caá Guazú"
 gg_arg_ejercito_libertador:0 "Ejército Libertador de Corrientes"
 gg_argentina.61.t:0 "El pliego de Corrientes"
 gg_argentina.61.d:0 "Desde #V 1830#!, #b Pedro Ferré#! sostiene el mismo programa para Corrientes: habilitar otros puertos y abrir a la navegación los ríos #b Paraná#! y #b Uruguay#!. No pide entregar la Confederación a los unitarios; pide que una provincia federal pueda sacar su producción sin pasar por una sola puerta.\n\nLa Ley de Aduana del #b 18 de diciembre de 1835#! le concedió la protección contra las manufacturas europeas. No le concedió los puertos ni los ríos, las dos partes del programa que apartan tráfico de Buenos Aires y tocan la recaudación porteña.\n\nEl pliego vuelve sobre esa mesa. Se puede conservar el paso único y con él la renta inmediata, pero Corrientes llevará otra negativa en sus cuentas; o se puede abrir el sistema y pagar desde ahora lo que cuesta cederlo."
 gg_argentina.61.f:0 "Federal, fluvial y escrito desde Corrientes."
 gg_argentina.61.a:0 "La Confederación tendrá una sola puerta."
 gg_argentina.61.b:0 "Habilitar los puertos y abrir los ríos."
 gg_argentina.62.t:0 "La cuenta de la aduana"
 gg_argentina.62.d:0 "El segundo reclamo de #b Ferré#! no se refiere al cauce sino a la caja: Corrientes pide coparticipar la renta de la aduana de Buenos Aires. Mientras toda mercadería pase por este puerto, sostiene el pliego, su producido no puede quedar en una sola provincia.\n\nLa respuesta porteña también está escrita. Buenos Aires carga con la deuda nacional, la seguridad de las costas y los cónsules; dividir la renta es dividir los recursos con que paga esas obligaciones. Fue por este punto y por los puertos que #b Ferré#! se retiró del debate de #V 1830-1831#!.\n\nLa firma puede reservar la cuenta para Buenos Aires y sumar otra negativa, o puede repartirla. El reparto exige plata hoy y reduce durante años lo que el gobierno podrá extraer de las provincias que administra."
 gg_argentina.62.f:0 "Una aduana, y más de un dueño reclamando su renta."
 gg_argentina.62.a:0 "Buenos Aires paga; Buenos Aires cobra."
 gg_argentina.62.b:0 "Coparticipar la renta."
 gg_argentina.63.t:0 "El río bajo bloqueo"
 gg_argentina.63.d:0 "El contraalmirante #b Louis Leblanc#! ha cerrado el puerto. El ultimátum francés exigía suspender el servicio militar de sus súbditos, pagar indemnizaciones y conceder el trato de nación más favorecida; cumplido el plazo, la escuadra empezó el bloqueo el #b 28 de marzo de 1838#!.\n\nLa orden cae sobre Buenos Aires, pero la asfixia remonta el río. Los cueros y la yerba de Corrientes necesitan una salida, y la provincia que discute puertos, navegación y aduana descubre que ahora ni siquiera el conducto disputado conduce al mar.\n\nLa caja puede anticipar socorros para sostener ese tráfico interior mientras dure el cierre. Si la aduana conserva hasta el último peso para resistir a Francia, la economía correntina cargará directamente con el bloqueo."
 gg_argentina.63.f:0 "La escuadra está en la boca; la cuenta sube río arriba."
 gg_argentina.63.a:0 "La aduana debe sostener la resistencia."
 gg_argentina.63.b:0 "Socorrer el comercio correntino."
 gg_argentina.64.t:0 "Corrientes permanece"
 gg_argentina.64.d:0 "No llegó una declaración de guerra desde Corrientes. Los puertos habilitados y la navegación abierta le dieron una salida propia; la renta compartida le dio parte en la cuenta que llevaba años discutiendo.\n\nEl bloqueo francés todavía pesa sobre el comercio del litoral, pero ya no puede presentarse como la última prueba de que Buenos Aires cierra el río y retiene sola su producido. El pliego correntino fue contestado antes de convertirse en ruptura.\n\nLa provincia permanece dentro de la Confederación. También permanecen el gasto hecho, la renta cedida y el límite que este gobierno aceptó sobre el monopolio de su aduana."
 gg_argentina.64.f:0 "No hubo ruptura porque hubo respuesta."
 gg_argentina.64.a:0 "Conservar el acuerdo y pagar su precio."
 gg_argentina.65.t:0 "El asesinato de Heredia"
 gg_argentina.65.d:0 "El parte llegado del norte confirma el asesinato de #b Alejandro Heredia#!. Durante la guerra contra la Confederación Perú-Boliviana había sido #b Protector de Salta, Jujuy, Catamarca y Tucumán#!; con él desaparece el hombre alrededor del cual se ordenaba el poder regional.\n\nTras su muerte, el gobierno de esas provincias pasa a grupos liberales. No hace falta llamarlos a todos unitarios para entender la mudanza: las manos que reciben los oficios de Buenos Aires ya no son las que los recibían bajo #b Heredia#!.\n\nBuenos Aires puede negar reconocimiento a las nuevas autoridades y exigir que continúe el orden anterior, o admitir a los gobiernos provinciales que han ocupado su lugar. El primer despacho que se les envíe decidirá si la relación empieza con un desconocimiento o con una concesión."
 gg_argentina.65.f:0 "Un asesinato, y otras manos sobre los oficios del norte."
 gg_argentina.65.a:0 "No reconocer a las nuevas autoridades."
 gg_argentina.65.b:0 "Reconocer a los gobiernos provinciales."
 gg_argentina.66.t:0 "Lamadrid a Tucumán"
 gg_argentina.66.d:0 "#b Gregorio Aráoz de Lamadrid#! puede partir hacia Tucumán con #V cincuenta#! granaderos. El oficio que llevará ya fija qué se hará con los armamentos del ejército que peleó en Bolivia; falta decidir si Buenos Aires pone detrás de esa resolución a un general y una escolta.\n\nEs un encargo pequeño en hombres y grande en confianza. El norte está en manos de grupos liberales desde la muerte de #b Heredia#!, y #b Lamadrid#! conoce esa tierra, sus oficiales y sus agravios mejor que cualquier emisario que pueda reemplazarlo.\n\nMandarlo afirma la intervención porteña sobre el mando del norte, pero también lo deja frente a quienes preparan el alzamiento. Retenerlo conserva al general en Buenos Aires y deja que las autoridades provinciales ejecuten por sí mismas lo ya resuelto."
 gg_argentina.66.f:0 "#V Cincuenta#! granaderos y un general al que habrá que confiar."
 gg_argentina.66.a:0 "Que vaya y reclame las armas."
 gg_argentina.66.b:0 "Retener a Lamadrid; no exponer ese mando."
 gg_argentina.67.t:0 "Dos órdenes para Urquiza"
 gg_argentina.67.d:0 "El despacho destinado a #b Justo José de Urquiza#! lleva el mando del ejército que deberá enfrentar al Brasil. En el mismo paquete va otra orden: cortar el tráfico de Entre Ríos con Montevideo, tolerado durante años aunque Buenos Aires lo considere contrabando.\n\nLas dos instrucciones no caben juntas sin costo. Se le pide organizar la guerra mientras se cierra el comercio que sostiene la economía de su provincia; se le entrega la mayor responsabilidad militar de la Confederación y se le quita la base material con que debe cumplirla.\n\nViaja además la renuncia anual de #b Rosas#! al encargo de las relaciones exteriores. Cada año las provincias la rechazan y el gesto confirma la delegación; esta vez, Entre Ríos recibirá al mismo tiempo una ceremonia que se espera ritual y dos órdenes que ponen a prueba su obediencia."
 gg_argentina.67.f:0 "El mando en una hoja; el cierre del tráfico en la siguiente."
 gg_argentina.67.a:0 "Darle el mando y cerrar el tráfico."
 gg_argentina.67.b:0 "Darle el mando y tolerar el tráfico."
 gg_argentina.67.c:0 "Cerrar el tráfico y confiar el mando a otro."
 gg_urquiza_orders_both_tt:0 "@warning! Se abre el pliego de #b Entre Ríos#!. Un #P ejército real#! se forma allí bajo Urquiza y Buenos Aires mejora su preparación; si siguen en pie, la Defensa pierde #N 20.000#! de su caja y el Cerrito recibe #P 10.000#!. La persecución comercial cuesta renta."
 gg_urquiza_command_trade_tt:0 "@information! El pliego de #b Entre Ríos#! queda cerrado y conserva la delegación. Un #P ejército real#! se forma bajo Urquiza y Buenos Aires mejora su preparación; si la Defensa sigue en pie, el tráfico entrega #P 20.000#! a su caja."
 gg_other_general_close_trade_tt:0 "@warning! Se abre el pliego de #b Entre Ríos#!. El ejército contra el Brasil se forma en Buenos Aires bajo #b otro general#!, de modo que Urquiza reúne menos fuerza propia; si siguen en pie, la Defensa pierde #N 20.000#! y el Cerrito recibe #P 10.000#!."
 gg_argentina.9.t:0 "La Regeneración"
 gg_argentina.9.d:0 "#b La Regeneración#! ha publicado el artículo de #b Terrada#!. La respuesta de #b Justo José de Urquiza#! ya está sobre la mesa: en Entre Ríos se respeta la libertad de prensa.\n\nNo es todavía una retirada de la delegación ni una declaración de guerra. Es una respuesta provincial al gobernador que conduce las relaciones exteriores y que, un mes atrás, juntó el mando del ejército con la persecución del comercio entrerriano.\n\nPuede dejarse pasar la respuesta, puede retirarse la presión comercial que alimenta el conflicto o puede exigirse obediencia sobre el periódico. Esa exigencia sería una decisión nueva de Buenos Aires: no consta que se haya dado."
 gg_argentina.9.f:0 "Una imprenta de Entre Ríos contesta a Buenos Aires."
 gg_argentina.9.a:0 "Dejar pasar la respuesta de Urquiza."
 gg_argentina.9.b:0 "Exigir que someta al periódico."
 gg_argentina.9.c:0 "Retirar las órdenes comerciales."
 gg_regeneracion_pass_tt:0 "@information! Se conserva el arreglo vigente: no cambia el pliego entrerriano, el tráfico ni el mando militar dispuesto en diciembre. Urquiza sale más fuerte de haber contestado sin que nadie lo corrija."
 gg_regeneracion_submit_tt:0 "@warning! La exigencia abre el pliego de #b Entre Ríos#! y levanta una #P reserva provincial#! adicional bajo Urquiza."
 gg_regeneracion_withdraw_tt:0 "@information! Se cierra el pliego de #b Entre Ríos#! y se levanta la persecución comercial; si la Defensa sigue en pie, recibe #P 20.000#! de la reanudación del tráfico. El mando militar ya concedido no se retira."
 gg_arg_ejercito_brasil_urquiza:0 "Ejército contra el Brasil"
 gg_arg_ejercito_brasil_nacional:0 "Ejército Nacional contra el Brasil"
 gg_arg_reserva_entrerriana:0 "Reserva de Entre Ríos"
 gg_argentina.68.t:0 "Los armamentos del norte"
 gg_argentina.68.d:0 "El ejército de operaciones que peleó contra la Confederación Perú-Boliviana ha dejado sus armamentos en el norte. Terminada aquella campaña, los gobiernos provinciales conservan hombres y pertrechos reunidos bajo el mando que ejercía #b Alejandro Heredia#!.\n\nBuenos Aires puede reclamarlos para la autoridad de la Confederación. Con ese reclamo mandó #b Rosas#! a #b Gregorio Aráoz de Lamadrid#! hacia Tucumán en marzo de #V 1840#!.\n\nLa otra firma deja los armamentos donde están y reconoce que las provincias administren lo que reunió su ejército. La Confederación pierde fuerza disponible, pero el norte no recibe una orden de entrega como primera respuesta a sus nuevos gobiernos."
 gg_argentina.68.f:0 "Las armas quedaron donde terminó la campaña; la autoridad sobre ellas sigue en disputa."
 gg_argentina.68.a:0 "Reclamar los armamentos."
 gg_argentina.68.b:0 "Dejarlos en manos de las provincias."
 gg_argentina.69.t:0 "El Tratado de Alcaraz"
 gg_argentina.69.d:0 "En agosto de #V 1846#!, #b Justo José de Urquiza#! y #b Madariaga#! han firmado la paz entre Entre Ríos y Corrientes. El acuerdo reincorpora a Corrientes a la Confederación y prevé la reunión de un congreso constituyente.\n\nEl tratado también libera a Corrientes de combatir en el Uruguay. #b Urquiza#! ha negociado por cuenta propia una paz que toca la guerra exterior y la organización de la Confederación, materias que Buenos Aires conduce por delegación de las provincias.\n\nSe pueden exigir modificaciones y devolver el acuerdo a #b Madariaga#!, como hizo Rosas en 1846, o dejar firme la firma entrerriana. Aceptarla preserva la paz acordada, pero reconoce hoy la autoridad provincial que Entre Ríos volverá a invocar mañana."
 gg_argentina.69.f:0 "La paz viene firmada desde Alcaraz; Buenos Aires decide si la devuelve."
 gg_argentina.69.a:0 "Exigir modificaciones al tratado."
 gg_argentina.69.b:0 "Dejar firme la paz de Alcaraz."
 gg_alcaraz_amendments_tt:0 "@warning! La guerra con #b Corrientes#! sigue o se reabre bajo el #b Pacto Federal#!, y el pliego de #b Entre Ríos#! queda pendiente. La salida militar continúa abierta."
 gg_alcaraz_accept_tt:0 "@information! Termina la guerra con #b Corrientes#!, que queda como #P protectorado#! y vuelve a delegar las relaciones exteriores. Corrientes queda exenta de aportar tropas al Cerrito y se abre la ruta a un #V congreso constituyente#!."
 gg_argentina.8.t:0 "La campaña de Corrientes"
 gg_argentina.8.d:0 "El tratado de Alcaraz volvió de Buenos Aires con modificaciones, #b Madariaga#! las rechazó y la guerra continúa. El frente correntino sigue abierto, pero la decisión de cómo sostenerlo vuelve a la mesa de #b Rosas#!.\n\n#b Justo José de Urquiza#! pide autoridad sobre la campaña y recursos entrerrianos reunidos bajo una formación propia. No promete una victoria: pide el ejército y el frente en que buscarla. Si conserva esa fuerza, también conservará un instrumento que no depende por completo de Buenos Aires.\n\nLa otra firma vuelve a poner sobre la mesa los términos que Urquiza y Madariaga habían firmado en Alcaraz en #V 1846#!: paz, reincorporación, exención del servicio en el Uruguay y congreso constituyente."
 gg_argentina.8.f:0 "La autoridad puede ir al frente; los términos anteriores pueden volver a la mesa."
 gg_argentina.8.a:0 "Dar a Urquiza la campaña y los recursos."
 gg_argentina.8.b:0 "Reabrir los términos de Alcaraz."
 gg_vences_delegate_tt:0 "@warning! Se forma y moviliza un #P ejército entrerriano reforzado#! bajo Urquiza y se lo envía al frente correntino. La batalla y el resultado de la guerra se deciden en el campo; Urquiza conserva una base militar propia más fuerte."
 gg_vences_reopen_alcaraz_tt:0 "@information! Vuelven los términos de #V Alcaraz de 1846#!: paz, protectorado y delegación restaurada para Corrientes, exención del servicio oriental y camino a un congreso."
 gg_argentina.70.t:0 "El norte no se pronuncia"
 gg_argentina.70.d:0 "Ha llegado el #b 7 de abril de 1840#! sin un pronunciamiento de Tucumán. Los gobiernos surgidos tras la muerte de #b Heredia#! fueron reconocidos antes de que el desacuerdo se convirtiera en una ruptura.\n\nLos armamentos del ejército que peleó en Bolivia quedaron en manos provinciales, y #b Lamadrid#! permaneció en Buenos Aires. Sin una exigencia de entrega ni un general porteño enviado a imponerla, las provincias del norte conservan sus gobiernos y continúan delegando las relaciones exteriores.\n\nLa Coalición no nace. También quedan en pie las concesiones que lo evitaron: menos autoridad política para este gobierno, menos fuerza reunida bajo su mano y un límite que las provincias podrán recordar en el próximo pliego."
 gg_argentina.70.f:0 "No hubo pronunciamiento porque los tres pliegos tuvieron respuesta."
 gg_argentina.70.a:0 "Conservar el arreglo y pagar su precio."
 gg_argentina.71.t:0 "La confederación negociada"
 gg_argentina.71.d:0 "Ha llegado el #b 1 de mayo de 1851#! con la ruta constitucional de Alcaraz todavía abierta y sin un pliego entrerriano pendiente. La Legislatura de Entre Ríos no acepta la renuncia anual de #b Rosas#!: el encargo de las relaciones exteriores continúa en Buenos Aires.\n\nLa paz de Alcaraz quedó firme cinco años atrás, Corrientes volvió a delegar y la convocatoria constituyente sobrevivió a las órdenes posteriores. La organización ya no descansa solamente en que cada provincia devuelva una renuncia ritual.\n\nNo hay Pronunciamiento ni ejército entrerriano marchando contra Buenos Aires. El cierre es otro: una #P confederación negociada#!, nacida de las concesiones que mantuvieron el Pacto y de un congreso que Buenos Aires aceptó abrir."
 gg_argentina.71.f:0 "El encargo permanece; la organización deja de ser una promesa aplazada."
 gg_argentina.71.a:0 "Escribir el acuerdo de la Confederación."
 gg_confederacion_negociada_tt:0 "@information! El pliego entrerriano queda cerrado y el arreglo constitucional se registra como #P confederación negociada#!."
 gg_argentina.60.t:0 "Oribe en Buenos Aires"
 gg_argentina.60.d:0 "Desembarcó #b Manuel Oribe#!. Hace cinco días, con la escuadra francesa frente al Cerro y la flotilla oriental desarmada, firmó en la Villa de la Unión un acta que los diarios de Montevideo llaman renuncia. Él no la llama así. Dice que se la hicieron firmar una escuadra extranjera y un rebelde en armas, y que un acto arrancado por la fuerza no obliga a nadie, y menos al que lo firmó.\n\nAsí que lo que está parado en el puerto es un emigrado pidiendo asilo o el #b presidente legal de la República Oriental#!, y cuál de los dos es depende enteramente de lo que este gobierno diga que es. Rivera ya gobierna en Montevideo. Francia y Gran Bretaña van a tratar con quien tenga la aduana.\n\nEs además un militar, y a este gobierno se le viene una guerra para la que todavía no tiene general. Mandó contra los farrapos, sostuvo la campaña tres años, y la oficialidad que salió de Montevideo salió con él. Se decida lo que se decida sobre el título, el hombre vale un ejército."
 gg_argentina.60.f:0 "«Resignó», dice el acta. Él dice que no renunció."
 gg_argentina.60.a:0 "Es el presidente, y como tal se lo recibe."
 gg_argentina.60.b:0 "Dele un mando y no se hable de la presidencia."
 gg_argentina.22.t:0 "El río cerrado"
 gg_argentina.22.d:0 "El ministro deja el parte sobre la mesa: las escuadras de Gran Bretaña y Francia han cerrado #b todos los puertos de la Confederación y del Uruguay#! salvo #P Montevideo#!. La escuadra de #b Brown#! fue capturada sin una declaración de guerra previa.\n\nEl cierre no detiene el comercio: lo desvía. Los cargamentos que ya no pasan por Buenos Aires enriquecen a #P Montevideo#! y al #b litoral entrerriano#!. Cada día de bloqueo alimenta ese desvío.\n\n«El río puede cerrarse con hombres y cañones», concluye el ministro. «También puede abrirse por concesión, o sostenerse apenas mientras la Cancillería busca un acuerdo. Pero no podemos gastar las mismas piezas en el Paraná, en el sitio y en el interior.»"
 gg_argentina.22.f:0 "Una sola aduana abierta basta para cambiar el curso de todos los cargamentos."
 gg_argentina.22.a:0 "#b Cerrar y fortificar el Paraná.#!"
 gg_argentina.22.b:0 "#b Aceptar la navegación extranjera.#!"
 gg_argentina.22.c:0 "#b Negociar y limitar las defensas.#!"
 gg_argentina.23.t:0 "Después de las cadenas"
 gg_argentina.23.d:0 "La relación de #b Obligado#! no permite consuelo táctico. Una flota de #V 22 buques de guerra#! y #V 92 mercantes#! rompió las cadenas y #N pasó#!. #b Mansilla#! quedó gravemente herido; #b Thorne#!, casi sordo.\n\nEl ministro de Guerra señala el mapa río arriba. La expedición comercial ha cruzado, pero el negocio que debía justificarla ya está fracasando. Las baterías todavía pueden seguirla desde la costa, a condición de que sus artilleros y su infantería no estén disponibles para ningún otro frente.\n\nLa otra salida es hacer de la resistencia una posición de negociación. Parte de la columna volvería al ejército; las piezas fijas quedarían atrás. Lo ocurrido en la vuelta no cambia con la firma."
 gg_argentina.23.f:0 "Las cadenas están rotas. La decisión empieza río arriba."
 gg_argentina.23.a:0 "#b Seguir la resistencia aguas arriba.#!"
 gg_argentina.23.b:0 "#b Convertir la defensa en una palanca diplomática.#!"
 gg_argentina.24.t:0 "El convoy vuelve por Quebracho"
 gg_argentina.24.d:0 "El convoy regresa por la #b Angostura del Quebracho#! con el fracaso comercial ya escrito en sus bodegas. Las baterías abren fuego y la flota pierde #N seis mercantes#!. Del lado argentino queda #N un muerto#!.\n\n«Éste fue el último golpe que podíamos darle a esa expedición», informa el ministro. Las piezas y los hombres siguen allí, todavía separados del resto del ejército. Conservarlos sobre el Paraná mantiene materialmente la exigencia de que las potencias reconozcan quién manda en el río.\n\nTambién pueden retirarse en parte. La columna móvil puede marchar hacia el litoral o hacia el frente paraguayo; la batería fija queda en su puesto, pero Buenos Aires llega a la mesa con menos fuerza detrás de su reclamo."
 gg_argentina.24.f:0 "Los mercantes vuelven menos de los que subieron."
 gg_argentina.24.a:0 "#b Conservar las baterías hasta el reconocimiento.#!"
 gg_argentina.24.b:0 "#b Mandar la columna al frente correntino.#!"
 gg_argentina.24.c:0 "#b Mandar la columna al frente paraguayo.#!"
 gg_argentina.25.t:0 "Las bases Hood, desde Buenos Aires"
 gg_argentina.25.d:0 "#b Thomas Samuel Hood#! trae una base común de las dos potencias. El papel ofrece reconocer la #P soberanía argentina sobre el Paraná#!, devolver #b Martín García#! y los buques capturados, desarmar a los extranjeros de Montevideo y abandonar la ciudad si la Defensa rechaza el arreglo.\n\nEl ministro no promete una paz que todavía no existe. Aceptar en Buenos Aires sólo lleva la respuesta al Cerrito y pone las condiciones ante la Defensa; Montevideo conserva su propia decisión. Nada en esta firma levanta por sí solo el bloqueo ni termina la guerra.\n\nRechazarlas mantiene la exigencia argentina fuera de este papel y conserva abiertas las operaciones. Es una decisión sobre qué camino se ofrece, no sobre un desenlace que aún pertenece a la otra orilla."
 gg_argentina.25.f:0 "Una misma hoja debe cruzar dos orillas antes de poder llamarse acuerdo."
 gg_argentina.25.a:0 "#b Aceptar las bases y remitirlas al Cerrito.#!"
 gg_argentina.25.b:0 "#b Continuar hasta obtener otro arreglo.#!"
 gg_argentina.26.t:0 "El sable del Libertador"
 gg_argentina.26.d:0 "El despacho de París comunica la muerte de #b José de San Martín#! en Boulogne-sur-Mer, el #V 17 de agosto#!, y transcribe la copia que #b Mariano Balcarce#! hizo de su testamento el #V 28 de septiembre#! y depositó en el archivo de la Legación. El original es ológrafo: San Martín lo escribió en París el #V 23 de enero de 1844#!, de su puño y letra, ante el escribano #b François Huillier#! y acompañado por Balcarce.\n\nLa tercera cláusula dice: #V «El sable que me ha acompañado en toda la guerra de la independencia de la América del Sud, le será entregado al General de la República Argentina, Don Juan Manuel de Rosas, como una prueba de la satisfacción que como argentino he tenido, al ver la firmeza con que ha sostenido el honor de la República contra las injustas pretensiones de los extranjeros que trataron de humillarla.»#!\n\nEl documento entero no se agota allí. Prohíbe todo funeral y pide ir directamente al cementerio sin acompañamiento, pero desea que su corazón sea depositado en el de #b Buenos Aires#!; declara #V «no deber ni haber jamás debido nada a nadie»#!. Y firma como #b «Generalísimo de la República del Perú y fundador de su libertad, Capitán General de la de Chile y Brigadier General de la Confederación Argentina»#!. Puede publicarse al hombre entero, recortarse el arma política o recibir el papel en silencio."
 gg_argentina.26.f:0 "Una cláusula para el gobierno; un testamento para el país."
 gg_argentina.26.a:0 "#b Publicarlo entero y declarar el duelo.#!"
 gg_argentina.26.b:0 "#b Imprimir solamente la cláusula tercera.#!"
 gg_argentina.26.c:0 "#b Recibirlo sin acto público.#!"
 gg_argentina.27.t:0 "La cláusula del Libertador"
 gg_argentina.27.d_full:0 "#b Buenos Aires#! ha publicado entero el testamento de #b José de San Martín#! y declarado el duelo. Desde París llega también a Montevideo la cláusula que importa al gobierno: #V «El sable que me ha acompañado en toda la guerra de la independencia de la América del Sud, le será entregado al General de la República Argentina, Don Juan Manuel de Rosas, como una prueba de la satisfacción que como argentino he tenido, al ver la firmeza con que ha sostenido el honor de la República contra las injustas pretensiones de los extranjeros que trataron de humillarla.»#!\n\nLa oposición a #b Rosas#! ya discute la autenticidad del documento y hasta la capacidad mental de San Martín cuando lo escribió. Ésa es un arma posible, pero tiene un precio: discutirle el testamento al hombre que libertó medio continente.\n\nHay otra respuesta. San Martín y Rosas mantuvieron correspondencia, pero esas cartas no convierten el elogio a la firmeza ante la agresión extranjera en apoyo a la política interna del gobernador. La Defensa puede honrar al Libertador y negar que la cláusula absuelva al gobierno."
 gg_argentina.27.d_clause:0 "#b Buenos Aires#! ha impreso solamente la cláusula tercera del testamento de #b José de San Martín#!: #V «El sable que me ha acompañado en toda la guerra de la independencia de la América del Sud, le será entregado al General de la República Argentina, Don Juan Manuel de Rosas, como una prueba de la satisfacción que como argentino he tenido, al ver la firmeza con que ha sostenido el honor de la República contra las injustas pretensiones de los extranjeros que trataron de humillarla.»#!\n\nEl recorte vuelve más filosa la pieza y también más fácil la respuesta. La oposición a #b Rosas#! ya discute la autenticidad del documento y hasta la capacidad mental de San Martín cuando lo escribió. Ésa es un arma posible, pero tiene un precio: discutirle el testamento al hombre que libertó medio continente.\n\nHay otra respuesta. San Martín y Rosas mantuvieron correspondencia, pero esas cartas no convierten el elogio a la firmeza ante la agresión extranjera en apoyo a la política interna del gobernador. La Defensa puede honrar al Libertador y negar que la cláusula absuelva al gobierno."
 gg_argentina.27.d_private:0 "#b Buenos Aires#! no ha hecho acto público, pero el informe llegado de París lleva la tercera cláusula del testamento de #b José de San Martín#!: #V «El sable que me ha acompañado en toda la guerra de la independencia de la América del Sud, le será entregado al General de la República Argentina, Don Juan Manuel de Rosas, como una prueba de la satisfacción que como argentino he tenido, al ver la firmeza con que ha sostenido el honor de la República contra las injustas pretensiones de los extranjeros que trataron de humillarla.»#!\n\nLa oposición a #b Rosas#! discute la autenticidad del documento y hasta la capacidad mental de San Martín cuando lo escribió. Ésa es un arma posible, pero tiene un precio: discutirle el testamento al hombre que libertó medio continente.\n\nHay otra respuesta. San Martín y Rosas mantuvieron correspondencia, pero esas cartas no convierten el elogio a la firmeza ante la agresión extranjera en apoyo a la política interna del gobernador. La Defensa puede honrar al Libertador y negar que la cláusula absuelva al gobierno."
 gg_argentina.27.f:0 "La firmeza contra el extranjero no decide quién gobierna adentro."
 gg_argentina.27.a:0 "#b Negar la autenticidad del testamento.#!"
 gg_argentina.27.b:0 "#b Honrar a San Martín, no absolver a Rosas.#!"
 gg_oribe_pretension:0 "Se sostiene la presidencia oriental"
 gg_oribe_recognised_tt:0 "@battalions! Al sostener a #b Oribe#! como presidente, Buenos Aires podrá prestar la Vanguardia como ejército de un gobierno: conservará hasta #P +1#! batallón de infantería y #P +1#! de caballería frente a recibirlo sólo como general."
 gg_oribe_unrecognised_tt:0 "@battalions! Al recibir a #b Oribe#! sólo como general, la Vanguardia que Buenos Aires pueda prestar contará hasta #N -1#! batallón de infantería y #N -1#! de caballería, con un mínimo de #V 1#! de cada arma."
 gg_vanguardia_cruce_total_tt:0 "@battalions! La Vanguardia cruzará con toda la fuerza disponible. El litoral quedará #N sin reserva#!: la caballería que se levante allí contará con #N +2#! escuadrones."
 gg_vanguardia_reserva_litoral_tt:0 "@battalions! La Vanguardia cruzará con #N -1#! batallón de infantería y #N -1#! escuadrón de caballería. Esas mismas unidades formarán una #P división propia#! de la Argentina."
 gg_vanguardia_held_tt:0 "@battalions! La Vanguardia #N no cruza#!: el ejército de Buenos Aires se queda en el interior mientras haya provincias alzadas contra el Pacto."
 gg_vanguardia_awaits_tt:0 "@battalions! El Ejército Unido de Vanguardia cruzará cuando Buenos Aires decida qué fuerza manda al otro lado del río."
 gg_vanguardia_cruce_postergado_tt:0 "@battalions! La Vanguardia conservará toda la fuerza disponible, pero su cruce se postergará #N seis meses#!. La caballería que pueda levantar el litoral contará con #N -2#! escuadrones."
 gg_urquiza_double_order_tt:0 "@warning! El mando contra el Brasil viaja junto con la orden de cortar el tráfico de Entre Ríos. Si la provincia retira el encargo, las tropas de #b Urquiza#! marcharán prevenidas durante #V 2 años#!: #P +10%#! de ofensiva y #P +10%#! de defensa."
 gg_lamadrid_sent_tt:0 "@warning! #b Lamadrid#! lleva al norte el reclamo de las armas con #V 50#! granaderos; si las provincias retiran el encargo, él y esa oficialidad podrán ponerse a sus órdenes."
 gg_norte_refusal_tt:0 "@warning! Este pliego queda sin contestar. Si subsiste siquiera #N 1#! de los #V 3#! agravios, las legislaturas del norte tendrán causa común para retirar el encargo a Buenos Aires."
 gg_norte_concession_tt:0 "Buenos Aires despacha favorablemente este pliego. Sólo si concede los #V 3#! quedará el norte sin causa común para retirar el encargo."
 gg_entre_rios_refusal_tt:0 "@warning! Buenos Aires devuelve este pliego sin acuerdo. Mientras quede siquiera #N 1#! de los #V 2#! agravios, Entre Ríos podrá aceptar la próxima renuncia de Rosas y reasumir el encargo."
 gg_entre_rios_concession_tt:0 "Buenos Aires cede en este pliego. Con los #V 2#! despachados favorablemente, la próxima renuncia de Rosas volverá rechazada y el encargo quedará en sus manos."
 gg_argentina.80.t:0 "Las provincias tenidas en depósito"
 gg_argentina.80.d:0 "El Pacto Federal quedó saldado, y lo que deja llega enseguida al interior: las provincias que este gobierno batió y dejó bajo gobernador federal esperan saber qué son ahora.\n\nNunca fueron anexadas. Cada una conservó su legislatura, su renta y su nombre, y llevó sus relaciones exteriores por Buenos Aires porque la obligaron a hacerlo — que es lo que el Pacto Federal les pedía desde el principio, sólo que obtenido por otros medios.\n\nLo que se firmó decide lo que sigue. Una constitución o un vencedor que la promete puede organizar la Nación como un solo Estado federal; un gobierno que ganó para conservar el encargo puede dejar la Confederación como estaba, una liga de provincias que delegan; y donde nadie ganó, nadie tiene autoridad para incorporarlas."
 gg_argentina.80.f:0 "Lo que se tenía en depósito: ¿se guarda o se toma?"
 gg_argentina.80.a:0 "Organizar la Nación: que se incorporen."
 gg_argentina.13.t:0 "La trampa de Montevideo"
 gg_argentina.13.d:0 "La Convención está sobre la mesa. #b Brasil#!, la #b República Oriental#! y #b Entre Ríos#! se obligan a sacar del territorio oriental a Oribe y a las fuerzas argentinas que manda. El artículo V deja al Imperio proteger personas y bienes hasta #N veinte leguas#! dentro del Estado Oriental; el XVIII abre la navegación del Paraná en el tramo ribereño; el XIX pone a #b Eugenio Garzón#! al frente del ejército oriental.\n\nLa cláusula que mira a esta orilla es la decimoquinta. Si Buenos Aires declara la guerra para sostener a Oribe, los tres aliados harán causa común contra ella. El precio brasileño está escrito; también está escrita la puerta que Rosas tendrá que decidir si cruza.\n\nEntre Ríos puede firmar y poner aliados reales en la guerra oriental, o conservar su guerra contra Buenos Aires sin esta alianza."
 gg_argentina.13.f:0 "Veinte leguas de precio; una cláusula vuelta hacia Buenos Aires."
 gg_argentina.13.a:0 "Firmar la Convención y pagar el precio."
 gg_argentina.13.b:0 "Combatir sin esta alianza."
 gg_montevideo_convention_sign_tt:0 "@battalions! #b Entre Ríos#! y el #b Brasil#! se comprometen con la Defensa a sacar a Oribe del país: sus cuerpos adelantados se forman y esperan la campaña. El Paraná queda #P abierto#! y el Cerrito pierde #N 20#! de aguante. La protección imperial alcanza #N veinte leguas#! dentro del Uruguay."
 gg_montevideo_convention_refuse_tt:0 "@warning! Entre Ríos conserva su guerra con Buenos Aires, pero #N renuncia#! a los contingentes, la navegación y la intervención militar de Brasil y Uruguay."
 gg_argentina.14.t:0 "La cláusula contra Buenos Aires"
 gg_argentina.14.d:0 "Entre Ríos ha firmado. Brasil y el gobierno de Montevideo ya se comprometieron contra Oribe, y el Cerrito siente la presión de tropas que no estaban allí ayer. La Convención no obliga todavía a los aliados a marchar contra Buenos Aires: la cláusula decimoquinta espera una declaración de este gobierno.\n\nAbandonar a #b Oribe#! retira a las fuerzas argentinas del arreglo que lo sostenía. Su ejército queda sin la base política y material de la resistencia, y la guerra oriental se cierra contra él. También termina la guerra general que el Pronunciamiento amenazaba con abrir.\n\nDeclarar la guerra hace lo contrario. Sostiene a Oribe y convierte, por la propia letra firmada, la alianza oriental en causa común contra Buenos Aires."
 gg_argentina.14.f:0 "La cláusula no se activa sola. Espera una declaración."
 gg_argentina.14.a:0 "Abandonar a Oribe y evitar la guerra general."
 gg_argentina.14.b:0 "Declarar la guerra para sostener a Oribe."
 gg_rosas_abandon_oribe_tt:0 "@information! El ejército del Cerrito se desbanda: el Cerrito se queda sin aguante (#N -100#!). Buenos Aires se queda sin apoyo en su guerra contra Entre Ríos. #b No#! se crea el Ejército Grande."
 gg_rosas_declare_alliance_tt:0 "@warning! La cláusula contra Buenos Aires queda activa: el #b Brasil#! queda comprometido a entrar en la guerra del lado de Entre Ríos, y la #b República Oriental#! a mandar su división bajo Urquiza, según lo que se acuerde."
 gg_argentina.15.t:0 "El precio del Ejército Grande"
 gg_argentina.15.d:0 "La segunda Convención convierte una alianza en un ejército. #b Urquiza#! cruzará el Paraná como generalísimo con #V 18.000 hombres#!. Brasil pone #V 3.000 soldados y su flota#!; el Uruguay, #V 2.500#!.\n\nEl movimiento se paga con un empréstito imperial de #V 100.000 patacones mensuales durante cuatro meses#!. No es un subsidio: devenga #N 6% anual#!. Urquiza se obliga a obtener del gobierno que suceda a Rosas el reconocimiento de la deuda por la Confederación. Si no lo obtiene, queda a cargo de Entre Ríos y Corrientes, que hipotecan desde ahora #N sus rentas y sus tierras públicas#!.\n\nPuede aceptarse íntegro, reducir la contribución extranjera a un primer tramo, o formar el ejército con las fuerzas entrerrianas y correntinas sin préstamo ni hipoteca. El cruce no existe hasta que una de estas firmas lo cree."
 gg_argentina.15.f:0 "Dieciocho mil hombres; cuatro letras; dos provincias hipotecadas."
 gg_argentina.15.a:0 "Aceptar íntegramente el préstamo y la hipoteca."
 gg_argentina.15.b:0 "Limitar la contribución extranjera."
 gg_argentina.15.c:0 "Marchar con entrerrianos y correntinos."
 gg_ejercito_grande_full_tt:0 "@battalions! Se forma bajo Urquiza un ejército de #P 18 batallones#!; los contingentes alcanzan los #V 3.000 brasileños#! y #V 2.500 orientales#! documentados, y aparece la flota imperial. @money! Entre Ríos recibe #P 400.000 patacones#! y, junto con Corrientes, hipoteca rentas y tierras públicas al #N 6%#!; la deuda sobrevive a la guerra."
 gg_ejercito_grande_limited_tt:0 "@battalions! Se forma bajo Urquiza un ejército de #P 18 batallones#! y marcha una contribución extranjera reducida. @money! Entre Ríos toma una sola mensualidad de #P 100.000 patacones#!; Entre Ríos y Corrientes soportan una hipoteca menor al #N 6%#! que sobrevive a la guerra."
 gg_ejercito_grande_alone_tt:0 "@battalions! Se forma bajo Urquiza un ejército de #P 18 batallones#!, sostenido por Entre Ríos y el ejército correntino ya existente. #P No#! se toma empréstito, no se hipotecan rentas ni tierras y ningún contingente extranjero marcha con él."
 gg_arg_ejercito_grande:0 "Ejército Grande"
 gg_arg_oriental_advance_contingent:0 "Vanguardia Oriental"
 gg_arg_brazilian_advance_contingent:0 "Vanguardia Imperial"
 gg_arg_brazilian_grand_army_contingent:0 "División Brasileña del Ejército Grande"
 gg_arg_oriental_grand_army_contingent:0 "División Oriental del Ejército Grande"
 gg_arg_brazilian_limited_contingent:0 "Contingente Brasileño Limitado"
 gg_arg_oriental_limited_contingent:0 "Contingente Oriental Limitado"
 gg_arg_brazilian_allied_fleet:0 "Escuadra Imperial Aliada"
 gg_ejercito_grande_full_mortgage:0 "Hipoteca del Ejército Grande"
 gg_ejercito_grande_limited_mortgage:0 "Hipoteca limitada del Ejército Grande"
 gg_oribe_abandoned_army:0 "El ejército abandonado"
 gg_argentina.41.d_full:0 "El Ejército Grande está a unas leguas. Son los #V 18.000#! de Urquiza, los contingentes brasileño y oriental comprados con el préstamo y la hipoteca, y las fuerzas correntinas. Lo manda el hombre que usted mismo llamó, hace dieciséis años, «ese jefe será su ruina».\n\nNo hay ya delegación que invocar ni congreso que prometer. Queda el ejército, el campo y las horas que faltan hasta que amanezca.\n\nTiene tres caminos, y la posteridad va a discutir durante un siglo cuál debió tomar."
 gg_argentina.41.d_limited:0 "El Ejército Grande está a unas leguas. Son los #V 18.000#! de Urquiza, las fuerzas correntinas y la contribución brasileña y oriental limitada que Entre Ríos aceptó financiar. Lo manda el hombre que usted mismo llamó, hace dieciséis años, «ese jefe será su ruina».\n\nNo hay ya delegación que invocar ni congreso que prometer. Queda el ejército, el campo y las horas que faltan hasta que amanezca.\n\nTiene tres caminos, y la posteridad va a discutir durante un siglo cuál debió tomar."
 gg_argentina.41.d_alone:0 "El Ejército Grande está a unas leguas. Son los #V 18.000#! de Urquiza y las fuerzas correntinas, sin contingentes extranjeros ni hipoteca. Lo manda el hombre que usted mismo llamó, hace dieciséis años, «ese jefe será su ruina».\n\nNo hay ya delegación que invocar ni congreso que prometer. Queda el ejército, el campo y las horas que faltan hasta que amanezca.\n\nTiene tres caminos, y la posteridad va a discutir durante un siglo cuál debió tomar."
 gg_argentina.80.b:0 "Que cada provincia conserve su gobierno."
 gg_argentina.80.a_tt:0 "@information! Las provincias sujetas a Buenos Aires se incorporan: dejan de ser gobiernos propios y su suelo pasa a ser de la Confederación."
 gg_argentina.80.b_tt:0 "@information! Cada provincia sigue siendo un protectorado de Buenos Aires, con su gobernador y su legislatura: la Confederación queda como liga de provincias que delegan."
 gg_play_as_entre_rios_tt:0 "@information! Pasás a gobernar #b Entre Ríos#!."
 gg_play_as_corrientes_tt:0 "@information! Pasás a gobernar #b Corrientes#!."
 gg_montevideo_convention_enabled_tt:0 "Cómo termine esta guerra por el #b Pacto Federal#! decidirá quién habla por la Confederación."
