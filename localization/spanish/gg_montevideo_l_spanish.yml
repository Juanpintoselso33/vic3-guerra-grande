l_spanish:
 gg_montevideo_port_city:0 "La ciudad-puerto"
 gg_montevideo_port_city_desc:0 "Montevideo vive de su bahía: la aduana, las barracas y los buques que recalan en ella la hacen la puerta de toda la Banda Oriental."
 gg_war_montevideo_refuge:0 "La Nueva Troya"
 gg_war_montevideo_refuge_desc:0 "Tras las murallas se apiñan los vecinos de extramuros, las familias que bajaron de la campaña y los que desembarcan cada semana: franceses, italianos, españoles y vascos. El padrón de 1843 contó 31.189 almas en la plaza; 5.324 eran franceses y 4.205 italianos. Mientras el mar siga abierto, la ciudad sitiada no deja de llenarse."
 gg_war_countryside_ravaged:0 "La campaña asolada"
 gg_war_countryside_ravaged_desc:0 "Las levas se llevan a los hombres, las divisiones carnean las haciendas y arrean el ganado a la frontera, y las familias buscan amparo en el Brasil, en Entre Ríos o detrás de las murallas. En enero de 1843 se mandó despoblar los pagos del Río Negro: unas diez mil almas marcharon en carretas detrás del ejército."
 gg_mvd_french_legion_men_tt:0 "Se alistan en #b Montevideo#!: #P +3.600#! soldados #b franceses#! y #P +750#! soldados #b vascos#! del batallón de Brie de Laustan."
 gg_mvd_french_legion_refused_men_tt:0 "Se quedan en #b Montevideo#! en sus oficios: #P +3.600#! jornaleros #b franceses#! y #P +750#! #b vascos#!."
 gg_mvd_french_legion_reinforcement_tt:0 "Nuevos alistados en #b Montevideo#!: #P +150#! soldados #b franceses#!."
 gg_mvd_italian_legion_men_tt:0 "Se alistan en #b Montevideo#!: #P +750#! soldados #b italianos#!."
 gg_mvd_italian_legion_reinforcement_tt:0 "Nuevos alistados en #b Montevideo#!: #P +300#! soldados #b italianos#!."
 gg_mvd_argentine_emigres_tt:0 "Se radican en #b Montevideo#!: #P +3.800#! emigrados #b argentinos#!, gente de pluma, de oficina y de charretera."
 gg_mvd_european_ships_tt:0 "Desembarcan en #b Montevideo#!: #P +1.000#! jornaleros #b italianos#!."
 gg_mvd_spaniards_enrolled_tt:0 "Desembarcan en #b Montevideo#!: #P +3.400#! jornaleros #b españoles#! y #P +1.700#! españoles alistados en la Guardia Nacional."
 gg_mvd_spaniards_foreigners_tt:0 "Desembarcan en #b Montevideo#!: #P +5.100#! jornaleros #b españoles#!, ninguno bajo las armas."
 gg_immigration.1.t:0 "Los proscriptos"
 gg_immigration.1.d:0 "Echagüe ha pasado el Uruguay con el ejército de Entre Ríos, y en el puerto no dejan de desembarcar los que huyen de Rosas. Son los hombres de la legión libertadora de Lavalle, los que sirven en el ejército de operaciones del general Rivera, los que escribieron contra el Restaurador hasta que no les quedó imprenta en Buenos Aires. Traen a sus familias, sus papeles y sus pleitos.\n\nEn este mes de setiembre un grupo de ellos se presenta ante el gobierno y ofrece formar una legión para el servicio de la ciudad. Muchos ya ocupan un escritorio en los ministerios, una columna en los diarios o un grado en las oficialidades; la plaza no tendría quien le redactara los partes ni quien le mandara una compañía sin ellos.\n\nBuenos Aires no lo olvida. Desde la misión Correa Morales de 1836, las instrucciones del ministro Arana piden medidas contra «los Unitarios o pérfidos Federales que han emigrado», y cada proscripto que se radica en Montevideo es un agravio más en la cuenta que lleva el Restaurador."
 gg_immigration.1.f:0 "Traen a sus familias, sus papeles y sus pleitos."
 gg_immigration.1.a:0 "Montevideo es asilo de los libres."
 gg_immigration.1.b:0 "Que sigan viaje."
 gg_immigration.1.b_tt:0 "Los emigrados #N no se radican#! en #b Montevideo#!."
 gg_immigration.2.t:0 "Los barcos de colonos"
 gg_immigration.2.d:0 "Desde 1835 han desembarcado en este puerto más de treinta y tres mil europeos, en un Estado que aquel año no pasaba de 128.371 habitantes. Son franceses, italianos, canarios, vascos de las dos orillas del Bidasoa, catalanes; artesanos, tenderos, comerciantes y jornaleros que llenan la ciudad nueva y el puerto.\n\nEste mes de mayo el Ministerio de Guerra y Marina autorizó el batallón vasco-navarro de Los Aguerridos, al mando del coronel José Guerra, veterano de las guerras carlistas. La casa de Genaro Rivas trae los colonos desde la Península y el Estado les paga el pasaje; a cambio, los contingentes quedan a disposición del gobierno para servir en el cuerpo, vestidos, racionados y pagados hasta el fin de la guerra.\n\nLos españoles no tienen cónsul que los reclame: el Reino no ha mandado todavía representante a la República. Nada impide inscribir a los isleños y a los peninsulares en las compañías de la Guardia Nacional como si fueran ciudadanos, y la plaza necesita cada hombre. Ellos dirán, el día que llegue quien los defienda, que vinieron a trabajar."
 gg_immigration.2.f:0 "Artesanos, tenderos, comerciantes y jornaleros."
 gg_immigration.2.a:0 "A la Guardia Nacional, como cualquier vecino."
 gg_immigration.2.b:0 "Son extranjeros: que trabajen en sus oficios."
