l_spanish:
 gg_ui_plata_phase_5:0 "@ships! Fase: #N Bloqueo francés#!"
 gg_ui_plata_phase_5_tt:0 "La escuadra del contraalmirante Leblanc bloquea el puerto de Buenos Aires, y lo va a bloquear hasta que Francia y Rosas se arreglen. El río está abierto para todos los demás: el que queda aislado es Buenos Aires.\n#b Efectos#!: orilla de Buenos Aires, capacidad comercial #N -50%#! y rendimiento del puerto #N -50%#!."
 gg_ui_plata_ba_blockaded_fr:0 "#N Bloqueada por Francia#!"
 gg_ui_plata_ba_blockaded_fr_tt:0 "La escuadra francesa está frente al puerto: la batería sigue en pie, pero los barcos que podría detener no son los que importan ahora."
 gg_ui_plata_word_french_blockade:0 "#b Francia#! bloquea Buenos Aires: la cuestión del río es su pleito con Rosas, no un cierre de Rosas."
 gg_ui_plata_word_french_blockade_tt:0 "El bloqueo empezó en marzo de 1838 por el trato a los súbditos franceses en Buenos Aires, y dura hasta que Francia y Rosas lo arreglen."
 gg_french_blockade_port:0 "Bloqueo francés"
 gg_french_blockade_port_desc:0 "Una escuadra francesa bloquea el puerto: casi no entra un barco, y la aduana que pagaba al gobierno está parada."
 gg_plata.42.t:0 "La escuadra de Leblanc frente a Buenos Aires"
 gg_plata.42.d:0 "El contraalmirante Leblanc declaró bloqueados el puerto de Buenos Aires y toda la costa de la Confederación. Francia exige para sus súbditos lo que Rosas no concede, y hasta que uno de los dos ceda sus barcos van a detener a todo buque que venga a nuestro puerto.\n\nLa aduana era la bolsa del gobierno. Desde hoy no cobra casi nada."
 gg_plata.42.f:0 "Buenos Aires, marzo de 1838."
 gg_plata.42.a:0 "Francia se va a cansar antes que nosotros."
 gg_plata.42.a_tt:0 "Mientras dure el bloqueo, la orilla de Buenos Aires tiene #N -50%#! de capacidad comercial y #N -50%#! de rendimiento del puerto."
 gg_plata.43.t:0 "Francia levanta el bloqueo"
 gg_plata.43.d:0 "La convención que firmaron Arana y el barón de Mackau termina el pleito con Francia: sus súbditos serán tratados como los de la nación más favorecida, y la escuadra levanta el bloqueo y vuelve a su país. Los barcos vuelven al puerto, y con ellos la aduana."
 gg_plata.43.f:0 "Buenos Aires, octubre de 1840."
 gg_plata.43.a:0 "El puerto vuelve a ser nuestro."
 gg_plata.43.a_tt:0 "Termina el bloqueo francés: la orilla de Buenos Aires recupera su comercio y su puerto."
