 gg_cisplatine_province_desc:0 "Una provincia del Imperio del Brasil, como lo fue la provincia de Montevideo hasta que la separó la Convención de 1828: pelea las guerras del Imperio y le paga parte de sus ingresos."
 gg_cisplatine_province_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] es la Provincia Cisplatina de [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
