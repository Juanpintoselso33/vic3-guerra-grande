 subject_type_gg_client_state:0 "@puppet! Estado cliente"
 subject_type_gg_client_state_no_icon:0 "Estado cliente"
 gg_client_state:0 "Estado cliente"
 gg_client_state_desc:0 "Una república aparte, con su bandera y su nombre, cuyo gobierno responde a su patrón: pelea sus guerras y le paga parte de sus ingresos."
