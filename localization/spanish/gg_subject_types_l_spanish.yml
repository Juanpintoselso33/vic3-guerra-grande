 gg_vassal_state_pact_desc:0 "[SCOPE.GetRootScope.GetDiplomaticPact.GetSecondCountry.GetName] es estado vasallo de [SCOPE.GetRootScope.GetDiplomaticPact.GetFirstCountry.GetName]."
