l_spanish:
 dp_gg_batalla:0 "Campaña oriental"
 gg_bat_india_muerta:0 "La campaña de India Muerta"
 gg_bat_1851:0 "La campaña de 1851"
 gg_bat_cerrito_field_army:0 "Ejército de operaciones del Cerrito"
 gg_bat_rivera_army:0 "Ejército de Rivera"
 gg_bat_defensa_field_army:0 "Ejército de operaciones de la Defensa"
 gg_bat_entre_rios_army:0 "Ejército de Entre Ríos"
 gg_battle.20.t:0 "India Muerta: la caballería de Rivera se sostiene"
 gg_battle.20.d:0 "En los campos de India Muerta, cerca de Rocha, las divisiones de Urquiza cargaron sobre el ejército de Rivera como en Arroyo Grande. Esta vez la línea aguantó: los escuadrones del Cerrito se retiraron hacia el norte y Rivera conserva su ejército en la campaña.\n\nEl sitio no se levanta por una batalla ganada, pero el Cerrito ya no puede dar por vacía la campaña."
 gg_battle.20.f:0 "Una batalla ganada en el campo no abre las puertas de la ciudad."
 gg_battle.20.a:0 "Que el parte llegue a la plaza."
 gg_battle.21.t:0 "Las líneas rotas"
 gg_battle.21.d:0 "Las fuerzas aliadas —las de la Defensa, las de Entre Ríos y, si llegaron, las del Imperio— dieron batalla a las del Cerrito en la campaña y las rompieron. Los batallones se desbandan hacia los pasos del Santa Lucía y la gente del Cerrito empieza a mirar el camino de sus estancias.\n\nNo es todavía la paz: es el fin de lo que sostenía el sitio."
 gg_battle.21.f:0 "Once mil hombres en armas no son un ejército si ya no creen en la guerra."
 gg_battle.21.a:0 "Replegarse sobre el Cerrito."
 gg_battle.22.t:0 "El Cerrito resiste"
 gg_battle.22.d:0 "Las fuerzas aliadas salieron a buscar la batalla, y el Cerrito se la dio y la sostuvo. Los aliados se repliegan a esperar refuerzos; en la plaza se enfría la esperanza de un final rápido."
 gg_battle.22.f:0 "Oribe todavía tiene con qué pelear."
 gg_battle.22.a:0 "Esperar al Imperio."
 gg_battle.22.a_tt:0 "@information! El cruce de los aliados se demora un mes."
