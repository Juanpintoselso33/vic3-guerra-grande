# Modificadores.
 gg_rivera_walls_stripped:0 "La muralla desguarnecida por la campaña"
 gg_rivera_walls_stripped_desc:0 "Los batallones que salieron a la campaña son batallones que no están en la muralla. En febrero de 1843 la infantería de línea era lo único que había entre Oribe y la ciudad; el resto era guardia nacional y milicia urbana."
 gg_rivera_the_city_takes_the_war:0 "La ciudad se hace cargo de la guerra"
 gg_rivera_the_city_takes_the_war_desc:0 "Llamada la Guardia Nacional, creados los primeros cuerpos de línea, y levantados y vueltos a montar los cañones coloniales que servían de postes en las veredas. La ciudad entendió que la defensa es la defensa de sus propias casas."
 gg_rivera_medina_takes_the_army:0 "Medina toma el ejército"
 gg_rivera_medina_takes_the_army_desc:0 "Anacleto Medina tuvo la derecha en India Muerta y había aconsejado no dar batalla. Es un profesional donde había un caudillo, y un hombre al que nadie en la campaña va a seguir por cariño."
 gg_rivera_arms_from_the_empire:0 "Armas del Imperio"
 gg_rivera_arms_from_the_empire_desc:0 "Fusiles, vestuario y caballos de los arsenales imperiales de Río Grande, tratados con el marqués de Caxias. Pone un ejército batido de vuelta en campaña y pone a la República en el libro mayor del Imperio, donde nunca se borra nada."
 gg_rivera_the_doctors_free_hand:0 "Los doctores con las manos libres"
 gg_rivera_the_doctors_free_hand_desc:0 "Con el caudillo en una celda imperial, los ministerios gobiernan por decreto y no le rinden cuentas a nadie a caballo. Es todo lo que los doctores decían querer, conseguido pidiéndole a un imperio extranjero que encarcelara al fundador de su propio partido."
 gg_rivera_gran_mariscal:0 "Gran mariscal de la República"
 gg_rivera_gran_mariscal_desc:0 "General en jefe del Ejército de Operaciones y gran mariscal de la República, las dos cosas en cuestión de días y de manos de un gobierno que acababa de intentar prohibirle desembarcar. Los hombres lo siguen. El gobierno anuló su propio decreto bajo los fusiles de su propia guarnición."
 gg_rivera_the_mutiny_broken:0 "El motín roto"
 gg_rivera_the_mutiny_broken_desc:0 "La orden se sostuvo y la guarnición no. El batallón de vascos y la infantería de línea de libertos eran los soldados de verdad de la muralla, y los dos coroneles que los sacaron a la calle eran los mejores oficiales de campo que tenía este gobierno."
 gg_rivera_the_doctors_republic:0 "Una república de ministros"
 gg_rivera_the_doctors_republic_desc:0 "Herrera y Obes en Gobierno y Relaciones Exteriores, la Asamblea de Notables sesionando, el decreto de destierro impreso con todos sus papeles, y ni un general que haya mandado alguna vez un ejército en campaña contra Oribe."
 gg_rivera_the_caudillos_republic:0 "Una república de un solo hombre"
 gg_rivera_the_caudillos_republic_desc:0 "Un gobierno que no destierra a su caudillo es un gobierno que maneja el caudillo. El ejército lo sigue y la campaña lo sigue; los ministerios, la Asamblea y todo el argumento que se le viene haciendo a París y a Londres sobre la civilización contra la barbarie caudillesca, no."
 gg_rivera_entre_orientales:0 "Entre orientales"
 gg_rivera_entre_orientales_desc:0 "Terminar la guerra, devolver lo confiscado, llamar a elecciones y mandar a su casa a las tropas extranjeras de los dos bandos. La oferta es pagable para todo el mundo en la República menos para el gobierno que la hace, porque las tropas extranjeras son lo que viene sosteniendo esta línea desde 1843."
 gg_rivera_the_triumvirate:0 "El Triunvirato de 1853"
 gg_rivera_the_triumvirate_desc:0 "Un ejecutivo de tres nombrado por un coronel que acaba de forzar la renuncia de un presidente, para terminar un período que no es suyo. Dos de los tres estaban afuera del país cuando los nombraron. Es un gobierno hecho de nombres, y los nombres son enormes."
 gg_rivera_flores_alone:0 "Flores gobierna solo"
 gg_rivera_flores_alone_desc:0 "Una cadena de mando limpia, y el gobierno de una fracción de un partido. La otra mitad del país no leyó así la paz, y lo va a decir con armas."
 gg_rivera_the_politics_of_fusion:0 "La política de fusión"
 gg_rivera_the_politics_of_fusion_desc:0 "Blancos y colorados en un mismo gabinete: la única lectura de «ni vencidos ni vencedores» que tiene algo adentro. Los hombres que sitiaron esta ciudad durante ocho años se sientan en su gobierno, y al ejército que levantó el sitio se le pide que les dé la mano."
 gg_rivera_colorado_exclusivism:0 "El partido es el gobierno"
 gg_rivera_colorado_exclusivism_desc:0 "El gobierno es el partido, el partido es el ejército y el puerto, y la campaña es de otro. Todo lo que la frase «ni vencidos ni vencedores» se escribió para evitar."
