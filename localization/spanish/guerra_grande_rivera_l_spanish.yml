l_spanish:

# ES: Fructuoso Rivera, 1842-1854: las derrotas, el destierro que decreta su propio gobierno, el
#     regreso y la muerte en el camino. Cada fecha, cifra y cita de abajo está documentada en
#     SOURCES_rivera.md y en los comentarios de events/guerra_grande_rivera.txt.

 gg_rivera.1.t:0 "Arroyo Grande"
 gg_rivera.1.d:0 "Ocho mil hombres por lado en el Arroyo Grande, en Entre Ríos. La derecha de Oribe, con Urquiza, y la caballería de su hermano Ignacio le deshacen el centro, y al caer la tarde el ejército que el Presidente cruzó el río ya no existe: dos mil muertos en el campo, mil cuatrocientos prisioneros, toda la artillería, toda la munición, veinticuatro mil caballos. A los oficiales los degüellan, y se dice que a los cabos y sargentos también; a los soldados los incorporan a las filas de Oribe, porque para los blancos un colorado es un hombre que volteó al gobierno legal con ayuda extranjera. Oribe pierde trescientos. Rivera huye del campo dejando la espada y las pistolas en el pasto, y vuelve a Montevideo a marchas forzadas con Oribe atrás.\n\nEl gobierno tiene diez semanas, con suerte. Oribe las pierde en asuntos menores, y la flota de Rosas tiene que cruzarle la artillería, así que recién el 16 de febrero su vanguardia acampa en la cuchilla. Lo que se decide ahora es dónde van a pararse los últimos cinco mil hombres de la República: afuera, en la campaña, con Rivera, donde todavía se puede ganar la guerra, o detrás de la muralla, donde está la ciudad."
 gg_rivera.1.f:0 "Batida en el exterior, sin ejércitos ni soldados, sin material de guerra, sin dinero, sin rentas y sin crédito."
 gg_rivera.1.a:0 "Mandarle la infantería. La guerra no se gana adentro de una muralla."
 gg_rivera.1.b:0 "Todo a la muralla. Llamar a la Guardia Nacional y volver a montar los cañones viejos."
 gg_rivera.2.t:0 "India Muerta"
 gg_rivera.2.d_reinforced:0 "Rosas mandó cuatro mil entrerrianos al mando de Urquiza con una sola instrucción: terminar con Rivera. La noche del 26 Rivera reúne consejo de guerra junto al arroyo, y el consejo vota dar batalla. Antes del amanecer llega un ayudante de Anacleto Medina con la opinión de Medina: no comprometer el encuentro hasta que llegue el resto de la gente. Rivera lo compromete.\n\nDura dos horas. El cuerpo izquierdo se había invertido y se pierde antes de poder formar; a Rivera casi lo matan en la derecha y lo sacan los coroneles que lo rodean; Urquiza mete su propia escolta y la batalla se acaba. Entre cuatrocientos y mil muertos en el campo, quinientos prisioneros, el parque, las caballadas, toda su correspondencia y su espada. Urquiza manda degollar a los quinientos prisioneros y cuelga un papel de un mangrullo: «El que entierre uno de estos será degollado.»\n\nCruza el Yaguarón por el Paso de las Piedras y le pide asilo al Imperio. El Ejército de Operaciones de la República son trescientos hombres en suelo brasileño y un general sin espada."
 gg_rivera.2.d_alone:0 "Dio batalla esperándonos. Ésa es la parte que se va a repetir en esta sala durante años.\n\nRosas mandó cuatro mil entrerrianos al mando de Urquiza con una sola instrucción: terminar con Rivera. Rivera destacó a Medina y a Olavarría a La Paloma a recibir la infantería que íbamos a mandarle, y su propio jefe de estado mayor, José Antonio Costa, le escribió que dudaba que llegara a tiempo. No llegó nunca. La noche del 26 el consejo de guerra votó dar batalla igual; antes del amanecer llegó un ayudante de Medina diciendo que no comprometiera nada hasta tener la gente; la comprometió.\n\nDos horas. Entre cuatrocientos y mil muertos, quinientos prisioneros, el parque, las caballadas, su correspondencia y su espada. Urquiza mandó degollar a los quinientos prisioneros y colgó un papel de un mangrullo: «El que entierre uno de estos será degollado.» Rivera cruzó el Yaguarón y le pidió asilo al Imperio."
 gg_rivera.2.f:0 "Tres derrotas en tres años, y cada una era el último ejército que tenía esta República."
 gg_rivera.2.a:0 "Destituirlo de todo mando. El ejército pasa a Anacleto Medina."
 gg_rivera.2.b:0 "Pagarle a Caxias armas y caballos, y ponerlo otra vez en campaña."
 gg_rivera.2.c:0 "Pedirle a Río de Janeiro que lo retenga donde está."
 gg_rivera.3.t:0 "Se viene el Patrón"
 gg_rivera.3.d:0 "Al hombre al que este gobierno le sacó todo lo nombró después su representante en el Paraguay: en parte para hacer algo por la celda en que lo tenía el Imperio, sobre todo para tenerlo en cualquier lado menos acá. El Brasil le negó el permiso para viajar a Asunción, igual lo sacó de la celda y lo embarcó en la goleta Perla rumbo a Montevideo. Está parado en la cubierta, en la rada, y media ciudad está en el muelle. La consigna viene corriendo por los cuarteles desde hace una semana: «Se viene el Patrón.»\n\nEste gobierno prohibió el desembarco. Le ofreció una legación en Europa y él la rechazó delante de testigos. La Sociedad Nacional —los señores de la ciudad organizados en su contra, con Santiago Vázquez en la presidencia— le arrancó un decreto de destierro. Y esta mañana el batallón de vascos, la infantería de línea de libertos y los escuadrones de los coroneles César Díaz y Venancio Flores están sobre las armas en la calle exigiendo que se rompa el decreto. Los hombres de la muralla le están preguntando al gobierno si quiere ser gobierno.\n\nSu mujer viene siendo el centro de la conspiración desde hace un mes. Lo espera al pie de la planchada."
 gg_rivera.3.f:0 "Un decreto vale lo que la guarnición esté dispuesta a hacer cumplir."
 gg_rivera.3.a:0 "Anularlo. Que desembarque, y que renuncie el ministerio."
 gg_rivera.3.b:0 "El decreto se sostiene. Romper el motín y dar de baja a los coroneles que lo encabezaron."
 gg_rivera.4.t:0 "La casa de la esquina, en Maldonado"
 gg_rivera.4.d_restored:0 "Tomó Mercedes, y después Paysandú en diciembre, y su gente la saqueó. En enero Ignacio Oribe y Servando Gómez lo diezmaron en el Cerro de las Ánimas y en una semana tenían las dos villas de vuelta. Desde entonces está en Maldonado, y no estuvo quieto: le mandó al Cerrito una paz de ocho condiciones por encima de este gobierno. Terminar la guerra. Devolver las propiedades confiscadas. Llamar a elecciones. Un arreglo «entre orientales», con evacuación de las tropas extranjeras de los dos bandos.\n\nHerrera y Obes ya desconoció la gestión por escrito. La comisión tiene el decreto redactado: destitución de todos los cargos que ocupa y destierro de la República «por todo el tiempo que dure la presente guerra». Los coroneles Lorenzo Batlle y Francisco Tajes esperan la orden con una fuerza considerable, y hay un buque francés —un buque de nuestro aliado— listo para llevarlo al Imperio.\n\nÉl fundó el partido que está sentado en esta sala. Él volteó a Oribe en 1838. Su gobierno creó a este gobierno."
 gg_rivera.4.d_brazilian_arms:0 "Rehizo sus divisiones con los arsenales del Imperio en Río Grande, con plata de este gobierno y con la firma de este gobierno, y en la Sociedad Nacional no hay uno solo que no lo sepa. Desde entonces: Mercedes tomada, Paysandú tomada en diciembre y saqueada por su propia gente, y en enero el Cerro de las Ánimas, donde Ignacio Oribe y Servando Gómez lo diezmaron y en una semana tenían las dos villas de vuelta.\n\nY ahora le mandó al Cerrito una paz de ocho condiciones por encima de este gobierno. Terminar la guerra. Devolver las propiedades confiscadas. Llamar a elecciones. Un arreglo «entre orientales», con evacuación de las tropas extranjeras de los dos bandos. Herrera y Obes lo desconoció por escrito. El pliego de cargos se escribe solo: un general que se arma con un imperio extranjero y negocia con el enemigo no es un general, y la palabra que le corresponde está en todos los pasquines de la ciudad.\n\nEl decreto está redactado: destitución y destierro «por todo el tiempo que dure la presente guerra». Batlle y Tajes esperan la orden, y hay un buque francés listo."
 gg_rivera.4.d_closed:0 "El expediente llegó tarde. El Gobierno del Cerrito ya no existe y la guerra a la que se referían las ocho condiciones terminó. No quedan plenipotenciarios enemigos con quienes negociar ni un destierro «por todo el tiempo que dure la presente guerra» que este ministerio pueda firmar ahora."
 gg_rivera.4.f:0 "El gobierno que él hizo, defendiendo la ciudad que él salvó, decidiendo dónde ponerlo."
 gg_rivera.4.a:0 "Firmarlo. Batlle y Tajes a Maldonado esta misma noche."
 gg_rivera.4.b:0 "Es el único general que tuvimos en la vida. Que gobierne, entonces."
 gg_rivera.4.c:0 "Respaldar las ocho condiciones. Mandarlas al Cerrito por encima del ministerio."
 gg_rivera.4.d:0 "Archivar el expediente: la guerra ya terminó."
 gg_rivera.5.t:0 "El triunvirato de los desterrados"
 gg_rivera.5.d_exiled:0 "La paz se firmó sin él. «Ni vencidos ni vencedores», y el hombre que venía proponiendo exactamente eso desde 1846 estaba en una casa de Río de Janeiro, con prohibición de salir de la ciudad, viviendo en la mayor pobreza. Cuando la guerra terminó, el presidente Juan Francisco Giró le prohibió volver: el decreto decía mientras durara la guerra, y el gobierno encontró otras palabras.\n\nTodos esperaban que Eugenio Garzón fuera el primer presidente del país reunificado. Garzón murió, y en su lugar se eligió a Giró, sobre la política de fusión: blancos y colorados en un mismo gabinete. No aguantó un año. Venancio Flores, jefe político de Montevideo y después ministro de Guerra, forzó la renuncia de Giró y nombró a tres hombres para terminar el período constitucional: él mismo, Juan Antonio Lavalleja y Fructuoso Rivera.\n\nDos de los tres triunviros están afuera del país. A uno lo puso ahí este gobierno."
 gg_rivera.5.d_at_home:0 "«Ni vencidos ni vencedores», y después dos años discutiendo qué querían decir esas palabras. Todos esperaban que Eugenio Garzón fuera el primer presidente del país reunificado; Garzón murió, y en su lugar se eligió a Juan Francisco Giró, sobre la política de fusión: blancos y colorados en un mismo gabinete. No aguantó un año.\n\nVenancio Flores, jefe político de Montevideo y después ministro de Guerra, forzó la renuncia de Giró y nombró a tres hombres para terminar el período constitucional: él mismo, Juan Antonio Lavalleja y Fructuoso Rivera. Es un gobierno hecho enteramente de nombres, y los nombres son los dos viejos que fundaron las dos mitades de la política de este país, más el coronel que escribió la lista."
 gg_rivera.5.d_incompatible:0 "El proyecto de triunvirato pertenecía a otro desenlace: una paz sin vencedores, el gobierno de Giró y una política de fusión. Ninguna de esas condiciones gobierna ya este país. El pliego conservado en secretaría no puede destituir al presidente vigente ni volver a decidir una sucesión que la guerra resolvió de otra manera."
 gg_rivera.5.f:0 "Lavalleja tiene sesenta y nueve años. Rivera, sesenta y cuatro."
 gg_rivera.5.a:0 "Llamarlos a los dos. Que el viejo tenga el sillón una tercera vez."
 gg_rivera.5.b:0 "Gobierna Flores. Que don Frutos se quede en Río de Janeiro."
 gg_rivera.5.c:0 "Cerrar el pliego. Esa sucesión no ocurrió."
 gg_rivera.6.t:0 "Arroyo Conventos"
 gg_rivera.6.d_on_the_road:0 "Volvió a cruzar el 19 de noviembre y durmió en la Posta de Menna. El 24 le salió al encuentro Anacleto Medina —el indio Medina, al que le entregaron su ejército en 1845— e hizo desfilar la tropa ante el triunviro, y al viejo se le humedecieron los ojos. En Durazno, donde había conocido sus glorias y sus amores, los amigos salieron al camino, y ahí empezaron los vómitos.\n\nDescansó unos días en Cerro Largo, escribió sus últimas cartas y siguió. Brígido Silveira, que mandaba su escolta, le rogó que parara más tiempo. No quiso: lo esperaba Bernardina, lo esperaba Pacheco y Obes, lo esperaba Flores, lo esperaba Montevideo. Al mediodía del 12 tomó conciencia y les habló a los que estaban en el rancho: «Ese baúl, si muero, se encargarán ustedes de entregarlo al Gobierno. En él se encierran todos los últimos actos de mi vida, y en ellos encontrarán mis enemigos documentos que prueban que jamás he dejado de servir a la patria.»\n\nMurió al día siguiente en el rancho de su compadre Bartolo Silva, junto al arroyo Conventos, cerca de Melo, tres meses y tres semanas después que Lavalleja. No hay cajón en toda la zona, así que lo meten en una caja de lata con caña y siguen viaje hacia la capital."
 gg_rivera.6.d_in_rio:0 "El aviso sube desde Río de Janeiro en el paquete, semanas tarde y en tres renglones. Fructuoso Rivera murió en enero, en la casa de la que no podía salir, en la mayor pobreza, a los sesenta y cuatro años.\n\nFue el primer presidente que eligió este país, dos veces más jefe de Estado, el fundador del partido que lo gobierna y el hombre que volteó a Manuel Oribe en 1838 y así empezó todo lo que vino después. Pasó los últimos siete años de su vida en una ciudad a la que lo mandó el gobierno que él creó, por un decreto que decía «por todo el tiempo que dure la presente guerra», y la guerra terminó hace dos años.\n\nEntre los efectos hay un baúl de papeles. Dejó dicho que fuera al Gobierno: «en ellos encontrarán mis enemigos documentos que prueban que jamás he dejado de servir a la patria»."
 gg_rivera.6.f:0 "Ni vencidos ni vencedores, y ya no queda nadie para discutir cuál de las dos cosas fue él."
 gg_rivera.6.a:0 "Enterrarlo en la Matriz al lado de Lavalleja, y sostener la fusión."
 gg_rivera.6.b:0 "El partido gobierna solo. Que se abra el baúl."
 gg_rivera.8.t:0 "Los libros del teniente coronel"
 gg_rivera.8.d:0 "El teniente coronel Bartolomé Mitre ha pedido la baja. Llegó con su familia a Montevideo en 1831; cinco años después entró a la Escuela Militar y se formó en artillería. Antes de que terminara 1839 ya había sido alférez, había escrito en El Iniciador y El Nacional y había peleado en Cagancha bajo las órdenes de Rivera. En 1842 se sumó a las fuerzas del general Paz y salió de Arroyo Grande derrotado y capitán. Después vino el Sitio Grande, y con él Garibaldi.\n\nEste año recibió el grado de teniente coronel. Ahora dice solamente que no seguirá sirviendo bajo Rivera. Sobre el motivo no hay nada asentado que este ministerio pueda agregar.\n\nHoy sale un barco. Mitre tiene preparados los libros que Esteban Echeverría le encargó repartir entre los exiliados durante la escala en Valparaíso. Todavía podemos dejarlo subir, devolverlo a las baterías o darle despacho para el litoral."
 gg_rivera.8.f:0 "Quince años en Montevideo, y todo lo que queda en el expediente es que un hombre no sirve más bajo otro."
 gg_rivera.8.a:0 "Que embarque. Y que los libros lleguen a Valparaíso."
 gg_rivera.8.b:0 "No. Que vuelva a las baterías."
 gg_rivera.8.c:0 "Darle despacho para el litoral. Que se presente ante Paz."

