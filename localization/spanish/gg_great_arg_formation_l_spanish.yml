 # 25/9/2026 (Juan) -- formar la Gran Argentina (Great_ARG): common/country_formation/zz_guerra_grande_formables.txt, common/scripted_triggers/gg_great_arg_formation.txt
 gg_garg_form_mandatory_tt:0 "Toda la costa oriental, #b Montevideo, San José, Maldonado, Cerro Largo#! y #b Paysandú#!, y las dos mitades del Paraguay, el #b Alto#! y el #b Bajo#!, en nuestras manos o en las de un gobierno ligado a nosotros que se sumará a la nación: las #V 7#!, sin excepción"
 gg_garg_form_provinces_tt:0 "Al menos #V 10#! de las #V 14#! provincias viejas de la Confederación, en nuestras manos o en las de un gobierno ligado a nosotros que se sumará a la nación: #b Buenos Aires, Santa Fe, Entre Ríos, Corrientes, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, Mendoza#! y #b San Luis#!. Por cada una que falte puede valer una tierra de frontera, #b Misiones, el Chaco, Formosa, Río Grande del Sur#! o cualquier tierra del sur, si se tiene de la misma manera y está poblada en al menos un #V 75%#!; la tierra que todavía se abre por debajo de esa parte no cuenta, y ninguna se exige por nombre"
 gg_garg_form_south_tt:0 "Además de esas diez, al menos #V 3#! tierras del sur tenidas de la misma manera y pobladas en al menos un #V 75%#!: #b La Pampa, Neuquén, Río Negro, Chubut, Santa Cruz, Tierra del Fuego#!, el sur chileno de #b Los Ríos, Los Lagos, Aysén#! y #b Magallanes#!, o las #b islas del Atlántico Sur#!. Valen tres cualesquiera; ninguna se exige por nombre"
