l_spanish:
# -------------------------------------------------------------------------------------------------
# EN/ES: the three countries of the Argentine side. The Coalition has no adjective of its own in
#     the sources -- it was a league, not a people -- so it takes a phrase.
#     / los tres paises del lado argentino. La Coalicion no tiene gentilicio propio en las fuentes
#     -- era una liga, no un pueblo -- asi que lleva una frase.
# -------------------------------------------------------------------------------------------------
 ENR:0 "Entre Ríos"
 ENR_ADJ:0 "entrerriano"
 CRR:0 "Corrientes"
 CRR_ADJ:0 "correntino"
 CLN:0 "Coalición del Norte"
 CLN_ADJ:0 "de la Coalición"
 gg_ai_strategy_corrientes:0 "Abrir el río"
 gg_ai_strategy_corrientes_desc:0 "[COUNTRY.GetName] se separó por el bloqueo a su comercio, no por una doctrina. Quiere puertos habilitados, libre navegación del Paraná y del Uruguay, y una parte de la renta de la aduana — y sabe que sola no le alcanza."
 gg_ai_strategy_coalicion:0 "Aguantar hasta que haya constitución"
 gg_ai_strategy_coalicion_desc:0 "[COUNTRY.GetName] no quiere un palmo de tierra ajena: quiere que la República se dé una constitución. No abre guerras, las contesta. Cada mes que dura es un mes que el ejército federal está en el interior."
 gg_ai_strategy_entre_rios:0 "Marchar sobre Buenos Aires"
 gg_ai_strategy_entre_rios_desc:0 "[COUNTRY.GetName] tiene el mejor ejército de la Confederación, al Imperio del Brasil de aliado y a Montevideo esperándolo. No está defendiendo nada."
