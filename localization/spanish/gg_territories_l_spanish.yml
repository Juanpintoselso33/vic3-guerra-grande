# ES: 24/9/2026 (AUD-CONST-TERR) -- un territorio nacional se vuelve provincia bajo la confederacion (events/gg_arg_territories.txt).
 gg_arg_territories.1.t:0 "Una gobernación pide ser provincia"
 gg_arg_territories.1.t_la_pampa:0 "La Pampa pide ser provincia"
 gg_arg_territories.1.t_neuquen:0 "Neuquén pide ser provincia"
 gg_arg_territories.1.t_rio_negro:0 "Río Negro pide ser provincia"
 gg_arg_territories.1.t_chubut:0 "Chubut pide ser provincia"
 gg_arg_territories.1.t_santa_cruz:0 "Santa Cruz pide ser provincia"
 gg_arg_territories.1.t_tierra_del_fuego:0 "Tierra del Fuego pide ser provincia"
 gg_arg_territories.1.t_misiones:0 "Misiones pide ser provincia"
 gg_arg_territories.1.t_formosa:0 "Formosa pide ser provincia"
 gg_arg_territories.1.t_chaco:0 "Chaco pide ser provincia"
 gg_arg_territories.1.d:0 "El censo de la frontera llegó al despacho del gobierno: la gobernación que Buenos Aires administra en nombre de la Confederación alcanzó las sesenta mil almas, y el comercio, el correo y los jueces llegan a sus pueblos como a los de cualquier provincia. Sus vecinos piden lo que tienen las demás: un gobernador propio, una legislatura y sus rentas.\n\nEl Pacto de 1831 no conoce territorios: conoce provincias que se reconocen «su libertad, independencia, representación y derechos». Y el artículo 12 dice cómo entra una más: «con el expreso y unánime consentimiento de cada una de las demás provincias federales». Pedirlo es sumar una firma a ese tratado; negárselo es seguir gobernando desde Buenos Aires a sesenta mil personas que no eligieron a nadie.\n\nBuenos Aires conservaría lo que las demás provincias le confiaron: las relaciones exteriores."
 gg_arg_territories.1.d_ley:0 "El censo de la frontera llegó al despacho del gobierno: la gobernación que Buenos Aires administra en nombre de la Confederación alcanzó las sesenta mil almas, y el comercio, el correo y los jueces llegan a sus pueblos como a los de cualquier provincia. Sus vecinos piden lo que tienen las demás: un gobernador propio, una legislatura y sus rentas.\n\nLa cifra es la de la ley de territorios nacionales de 1884: «Cuando la población de una Gobernación alcance a sesenta mil habitantes, constatados por el censo general y los censos suplementarios sucesivos, tendrá derecho para ser declarada provincia argentina». El Pacto de 1831 no conoce territorios: conoce provincias que se reconocen «su libertad, independencia, representación y derechos», y admite a otra «con el expreso y unánime consentimiento de cada una de las demás provincias federales».\n\nBuenos Aires conservaría lo que las demás provincias le confiaron: las relaciones exteriores."
 gg_arg_territories.1.f:0 "Donde hay sesenta mil vecinos, hay una provincia que pide su firma."
 gg_arg_territories.1.a:0 "Que se pida el consentimiento de las provincias y se la admita en el Pacto."
 gg_arg_territories.1.a_tt:0 "@information! La gobernación se vuelve un país, #b provincia del Pacto#! bajo Buenos Aires, con su gobernador y su legislatura, y su tierra queda #P incorporada#!. Buenos Aires conserva las relaciones exteriores; la gobernación deja de ser suya."
 gg_arg_territories.1.b:0 "Que espere al censo que viene."
 gg_arg_territories.1.b_tt:0 "@warning! Los vecinos lo anotan: #N +10%#! de radicales en la gobernación. El pedido no vuelve a tratarse por #V 5#! años."
 gg_arg_territories.2.t:0 "Una nueva provincia del Pacto"
 gg_arg_territories.2.t_la_pampa:0 "La Provincia de La Pampa"
 gg_arg_territories.2.t_neuquen:0 "La Provincia del Neuquén"
 gg_arg_territories.2.t_rio_negro:0 "La Provincia del Río Negro"
 gg_arg_territories.2.t_chubut:0 "La Provincia del Chubut"
 gg_arg_territories.2.t_santa_cruz:0 "La Provincia de Santa Cruz"
 gg_arg_territories.2.t_tierra_del_fuego:0 "La Provincia de Tierra del Fuego"
 gg_arg_territories.2.t_misiones:0 "La Provincia de Misiones"
 gg_arg_territories.2.t_formosa:0 "La Provincia de Formosa"
 gg_arg_territories.2.t_chaco:0 "La Provincia del Chaco"
 gg_arg_territories.2.d:0 "El gobierno de Buenos Aires, encargado de las relaciones exteriores de la Confederación, reunió el consentimiento de las provincias federales y admitió a esta gobernación en el Pacto. Desde hoy tiene gobernador propio y legislatura, cobra sus rentas y firma el Pacto de 1831 como las demás: se le reconoce, y reconoce a las otras, «su libertad, independencia, representación y derechos».\n\nLo que no cambia: las relaciones con el extranjero siguen en Buenos Aires, como se las confiaron las otras provincias.\n\nLa frontera sigue siendo frontera. Lo que era un despacho del gobierno de Buenos Aires es ahora un gobierno."
 gg_arg_territories.2.f:0 "Una firma más al pie del Pacto."
 gg_arg_territories.2.a:0 "Que se instale la legislatura."
 gg_arg_territories.2.a_tt:0 "@information! Somos #b provincia del Pacto#!: gobierno y rentas propios; las relaciones exteriores, en Buenos Aires."
