l_spanish:
 gg_constitution.1.t:0 "La Constitución"
 gg_constitution.1.d:0 "El Pacto Federal ya no es una promesa aplazada: las provincias acordaron cómo seguir juntas, y la pregunta que Buenos Aires esquivó veinte años está sobre la mesa. ¿Qué ley va a regir a la Confederación?\n\nEn la mesa circulan las #b Bases#! de Alberdi, escritas en Valparaíso: una república con un presidente fuerte, libertad de cultos, puertas abiertas a la inmigración, ningún esclavo en su suelo. Enfrente está lo que existe: el encargo de las relaciones exteriores, la suma del poder público y la religión del Estado.\n\nCualquiera de las dos se escribe con la misma tinta."
 gg_constitution.1.d_urquiza:0 "El general Urquiza entró en Buenos Aires con la palabra #b Constitución#! en la bandera, y ahora tiene que escribirla. El Congreso se reúne en Santa Fe con las #b Bases#! de Alberdi en cada banca: una república con un presidente fuerte, libertad de cultos, puertas abiertas a la inmigración, ningún esclavo en su suelo.\n\nNo hay vuelta atrás: la suma del poder público se fue con el Restaurador."
 gg_constitution.1.d_rosas:0 "El Restaurador ganó, y los que le pedían un Congreso tienen ahora que esperar su respuesta. Puede darles la Constitución que Alberdi escribió en Valparaíso, con una república, libertad de cultos y puertas abiertas a la inmigración; o puede seguir gobernando como gobernó siempre, con el encargo de las relaciones exteriores y la suma del poder público.\n\nEn Buenos Aires nadie cree que vaya a elegir lo primero. Eso mismo hace que lo segundo cueste poco."
 gg_constitution.1.f:0 "«Gobernar es poblar.» — Juan Bautista Alberdi, Bases, 1852"
 gg_constitution.1.a:0 "La Constitución de 1853: república, cultos libres, puertas abiertas."
 gg_constitution.1.b:0 "El Pacto sin Constitución: la suma del poder público sigue."
 gg_pais_sin_constitucion:0 "El país sin Constitución"
 gg_pais_sin_constitucion_desc:0 "El Restaurador gobierna con la suma del poder público, y nadie discute su autoridad mientras viva. Pero la pregunta que el Pacto dejó sin contestar sigue ahí: federales y unitarios esperan, cada uno con su constitución en el bolsillo, el día en que él ya no esté."
 gg_constitution.1.b_tt:0 "@warning! Rosas gobierna con todo el poder, y la cuestión entre #b federales y unitarios#! queda abierta: #b El país sin Constitución#! mientras viva."
 gg_constitution.2.t:0 "Muere el Restaurador"
 gg_constitution.2.d:0 "Juan Manuel de Rosas ha muerto, y con él se termina la suma del poder público: no era una ley, era un hombre. Nadie en la Confederación tiene su autoridad, y nadie la hereda.\n\nLa pregunta que el Pacto Federal dejó sin contestar vuelve a la superficie el mismo día del entierro. Los federales quieren una constitución que respete a las provincias; los unitarios, una que las ordene desde una capital. Cada gobernador empieza a contar con quién está.\n\nEl país que Rosas tuvo unido a la fuerza tiene ahora que decidir si quiere seguir unido, y bajo qué ley."
 gg_constitution.2.f:0 "La suma del poder público no se hereda."
 gg_constitution.2.a:0 "Que cada provincia diga qué país quiere."
 gg_constitution.2.a_tt:0 "@warning! Termina #b El país sin Constitución#!. Las provincias empiezan a tomar partido entre #b federales y unitarios#!."
