l_spanish:
 gg_constitution.1.t:0 "La Constitución"
 gg_constitution.1.d:0 "El Pacto Federal ya no es una promesa aplazada: las provincias acordaron cómo seguir juntas, y la pregunta que Buenos Aires esquivó veinte años está sobre la mesa. ¿Qué ley va a regir a la Confederación?\n\nEl Pacto lo prometió en 1831: un #b Congreso General Federativo#! que arreglara la administración del país. De un lado, una constitución escrita: una república con un presidente fuerte, libertad de cultos, puertas abiertas a la inmigración, ningún esclavo en su suelo. Enfrente está lo que existe: el encargo de las relaciones exteriores, la suma del poder público y la religión del Estado.\n\nCualquiera de las dos se escribe con la misma tinta."
 gg_constitution.1.d_urquiza:0 "El general Urquiza encabeza sus papeles desde 1851 con otro lema, «¡Mueran los enemigos de la Organización Nacional!», y ahora tiene que cumplirlo. El Congreso se reúne en Santa Fe, y entre los diputados corren las #b Bases#! de Alberdi, que el propio Urquiza leyó y elogió: una república con un presidente fuerte, libertad de cultos, puertas abiertas a la inmigración, ningún esclavo en su suelo.\n\nNo hay vuelta atrás: la suma del poder público se fue con el Restaurador."
 gg_constitution.1.d_rosas:0 "El Restaurador ganó, y los que le pedían un Congreso esperan su respuesta. Desde el 7 de marzo de 1835 gobierna con la suma del poder público que le dio la Sala de Representantes, y la Confederación sigue como la dejó el Pacto: cada provincia con su gobierno, y el encargo de las relaciones exteriores en Buenos Aires.\n\nEl Pacto de 1831 prometió un #b Congreso General Federativo#! que arreglara la administración del país bajo el sistema federal. Los papeles de los emigrados lo siguen pidiendo, de mano en mano, en voz baja.\n\nNadie en la Confederación puede ya discutirle nada. Si hay Constitución, será porque él la da."
 gg_constitution.1.f:0 "«…que por medio de un Congreso General Federativo se arregle la administración general del país bajo el sistema federal.» — Pacto Federal, 4 de enero de 1831, art. 16"
 gg_constitution.1.a:0 "La Constitución de 1853: república, cultos libres, puertas abiertas."
 gg_constitution.1.b:0 "El Pacto sin Constitución: la suma del poder público sigue."
 gg_pais_sin_constitucion:0 "El país sin Constitución"
 gg_pais_sin_constitucion_desc:0 "El Restaurador gobierna con la suma del poder público, y nadie discute su autoridad mientras viva. Pero la pregunta que el Pacto dejó sin contestar sigue ahí: federales y unitarios esperan, cada uno con su constitución en el bolsillo, el día en que él ya no esté."
 gg_constitution.1.b_tt:0 "@warning! Rosas gobierna con todo el poder, y la cuestión entre #b federales y unitarios#! queda abierta: #b El país sin Constitución#! mientras viva."
 gg_constitution.1.b_confed_tt:0 "@arrow_up! Toda provincia que siga por su cuenta y en paz con Buenos Aires, sea #b Entre Ríos#!, #b Corrientes#! o la #b Coalición del Norte#!, vuelve a poner sus relaciones exteriores en manos del gobernador de Buenos Aires: #b provincias del Pacto#!."
 gg_constitution.2.t:0 "Muere el Restaurador"
 gg_constitution.2.d:0 "Juan Manuel de Rosas ha muerto, y con él se termina la suma del poder público: no era una ley, era un hombre. Nadie en la Confederación tiene su autoridad, y nadie la hereda.\n\nLa pregunta que el Pacto Federal dejó sin contestar vuelve a la superficie el mismo día del entierro. Los federales quieren una constitución que respete a las provincias; los unitarios, una que las ordene desde una capital. Cada gobernador empieza a contar con quién está.\n\nEl país que Rosas tuvo unido a la fuerza tiene ahora que decidir si quiere seguir unido, y bajo qué ley."
 gg_constitution.2.f:0 "La suma del poder público no se hereda."
 gg_constitution.2.a:0 "Que cada provincia diga qué país quiere."
 gg_constitution.2.a_tt:0 "@warning! Termina #b El país sin Constitución#!. #b Corrientes#! y las provincias del norte (#b Tucumán, Salta, Jujuy, Catamarca#!) se alzan como la #b Coalición del Norte#!, unitaria; el resto sigue a Buenos Aires con los federales. Quien gane la guerra escribe la #b Constitución#!, y el país queda uno solo."
 gg_constitution.1.a_tt:0 "@warning! Una #b federación#!, no una confederación: las provincias del Pacto se incorporan a un solo país y conservan sus gobiernos. Termina la autocracia: #b república presidencial#!, #b sufragio universal masculino#!, #b libertad de cultos#!, sin esclavitud, sin trabas a la inmigración y con #b derecho de reunión#!."
 gg_constitution.4.t:0 "La Constitución de los vencedores"
 gg_constitution.4.d_federal:0 "Los federales ganaron la guerra que siguió a la muerte del Restaurador, y escriben la Constitución que las provincias venían pidiendo desde 1831: una república federal, con un presidente fuerte, libertad de cultos, puertas abiertas a la inmigración y el voto de todos los varones.\n\nYa no es una confederación de provincias que delegan: es una sola nación, y cada provincia conserva su gobierno dentro de ella. La suma del poder público no vuelve: ahora hay una ley que la prohíbe."
 gg_constitution.4.d_unitaria:0 "Los unitarios ganaron la guerra que siguió a la muerte del Restaurador, y escriben la Constitución que la Liga llevaba en el bolsillo: una república que se gobierna desde una capital, con la religión del Estado y el voto de los que tienen con qué.\n\nEl país se reúne bajo esa ley. La suma del poder público no vuelve, pero las provincias tampoco recuperan lo que el Pacto les dejaba."
 gg_constitution.4.f:0 "La guerra decidió quién escribe; la ley, cómo se gobierna."
 gg_constitution.4.a:0 "Que se jure en todas las provincias."
 gg_constitution.4.d_peace:0 "La guerra que siguió a la muerte del Restaurador terminó sin vencedor: la Coalición del Norte dejó las armas sin haber impuesto su ley. Los federales siguen en el gobierno, y escriben la Constitución que las provincias venían pidiendo desde 1831: una república federal, con un presidente fuerte, libertad de cultos, puertas abiertas a la inmigración y el voto de todos los varones.\n\nEs una sola nación, y cada provincia conserva su gobierno dentro de ella. La suma del poder público no vuelve: ahora hay una ley que la prohíbe."
 gg_constitution.5.t:0 "Una sola Nación"
 gg_constitution.5.d:0 "La provincia que gobernás entra en la Nación que acaba de constituirse: su tierra, su gente y sus tropas pasan a ser argentinas, y su gobernador responde desde ahora a una ley común.\n\nEn la provincia ya no queda un gobierno propio que conducir. Queda uno solo para todas, y es ese el que hay que tomar.\n\nLo que se defendió en la provincia se sigue defendiendo desde la Nación."
 gg_constitution.5.f:0 "Una provincia menos que gobernar; una Nación entera por delante."
 gg_constitution.5.a:0 "Seguir desde el gobierno nacional."
 gg_play_as_argentina_tt:0 "@information! Pasás a gobernar la #b Argentina#!, y tu país se incorpora a ella."
 gg_constitution.1.d_stalemate:0 "El Pacto Federal se partió en dos. Las provincias del litoral y del interior siguen a Urquiza y se gobiernan desde Paraná; en Buenos Aires quedan la ciudad, la campaña, el puerto y la aduana.\n\nEl #b Congreso General Federativo#! que el Pacto prometió en 1831 se reunirá, si se reúne, sin diputados porteños. Aquí la pregunta es otra: con qué ley se gobierna una provincia que ya no habla por las demás.\n\nEl encargo de las relaciones exteriores ya no alcanza a nadie más. La suma del poder público, en cambio, sigue en las mismas manos."
 gg_constitution.1.c:0 "Convocar el Congreso que prometió el Pacto: una Constitución federal."
 gg_constitution.1.c_tt:0 "@warning! El Restaurador convoca el #b Congreso General Federativo#!. Una #b federación#!, no una confederación: las provincias del Pacto se incorporan a un solo país y conservan sus gobiernos. Termina la suma del poder público: #b república presidencial#!, #b sufragio universal masculino#!, #b libertad de cultos#!, sin esclavitud, sin trabas a la inmigración y con #b derecho de reunión#!."
 gg_constitution.1.e:0 "Una Constitución para el Estado de Buenos Aires."
 gg_constitution.1.e_tt:0 "@warning! Buenos Aires se da su propia ley, sin esperar al Congreso de Paraná: un #b Estado#! que guarda su soberanía mientras no la delegue en un gobierno federal. Termina la suma del poder público: #b república presidencial#!, #b voto censitario#!, #b religión del Estado#!, sin esclavitud y con #b derecho de reunión#!. Las provincias siguen con la Confederación."
 gg_constitution.1.g:0 "El Pacto de 1831 y nada más: cada provincia en su libertad, independencia y derechos."
 gg_constitution.1.g_tt:0 "@information! Una #b confederación#!, no una federación: cada provincia del Pacto vuelve a ser un país, con su gobernador, su legislatura y sus rentas, una #b provincia del Pacto#! que deja en Buenos Aires el encargo de las relaciones exteriores. Buenos Aires conserva su provincia y las tierras de frontera que no gobierna ninguna provincia. No cambia ninguna ley de Buenos Aires: un tratado entre gobiernos no escribe ninguna. La provincia en guerra con Buenos Aires, ligada a otra potencia o que eligió quedarse sola queda como está."
 gg_constitution.1.g_rosas_tt:0 "@warning! El Restaurador conserva la suma del poder público, y la cuestión entre #b federales y unitarios#! queda abierta: #b El país sin Constitución#! mientras viva."
 gg_constitution.1.a_tt_one:0 "@warning! Una #b federación#!, no una confederación: las provincias ya forman un solo país, y esta ley les conserva sus gobiernos. Termina la autocracia: #b república presidencial#!, #b sufragio universal masculino#!, #b libertad de cultos#!, sin esclavitud, sin trabas a la inmigración y con #b derecho de reunión#!."
 gg_constitution.1.c_tt_one:0 "@warning! El Restaurador convoca el #b Congreso General Federativo#!. Una #b federación#!, no una confederación: las provincias ya forman un solo país, y esta ley les conserva sus gobiernos. Termina la suma del poder público: #b república presidencial#!, #b sufragio universal masculino#!, #b libertad de cultos#!, sin esclavitud, sin trabas a la inmigración y con #b derecho de reunión#!."
 gg_constitution.1.c_vote_tt:0 "@information! Desde ahora el gobierno se gana en las urnas."
 gg_constitution_rosas_first_term_tt:0 "@information! #b Rosas#! preside el primer período que fija la Constitución: #V seis años#!, cesa en el poder el día mismo en que expira, y no puede ser reelegido sino con intervalo de #V un período#!. Después, el gobierno se gana en las urnas."
