l_spanish:

 gg_peace.1.desc_withdraws:0 "La guerra está decidida sin una batalla más. Oribe pidió a las escuadras la garantía para embarcarse con la división argentina y se fue: Urquiza no se queda con el parque, y en el Cerrito quedan los orientales, sin jefe y sin ganas de seguir.\n\nEste gobierno escribe las condiciones. Lo que no puede es rechazarlas: ya no hay con quién seguir la guerra."
 gg_peace.1.desc_imperial:0 "La guerra está decidida, y se decidió con plata y barcos del Imperio. Lamas lo firmó en Río: el Brasil ayuda, y a cambio el Brasil tiene la última palabra sobre cómo termina esto.\n\nLas condiciones que se pueden escribir ahora son las que Río acepta. La independencia plena, con las manos libres, ya no está sobre la mesa."
 gg_peace.1.desc_sold:0 "La guerra está decidida y, por primera vez en nueve años, este gobierno escribe las condiciones.\n\nY tiene una bandera: en 1845 el Cerrito le contestó a Rosas que sí. Para la prensa de Montevideo, Oribe entregó el país, y cada oriental que dude de esta paz va a leerlo en todas las esquinas. No hay pruebas de que Oribe quisiera la anexión, pero la acusación ya no necesita pruebas."
 gg_peace.1.g:0 "Vasallaje: la República queda bajo el Imperio del Brasil."
 gg_peace.1.h:0 "Provincia Cisplatina: la República queda como provincia títere del Brasil."
 gg_peace_cisplatina_tt:0 "El Uruguay queda como títere del Brasil bajo el nombre de #b Provincia Cisplatina#!, y el Imperio conserva la facultad de incorporarlo. La Argentina y las potencias lo toman como un agravio."
 gg_peace.2.desc_pledged:0 "Las puertas están abiertas. Nueve años frente a la muralla, y al final la abrió el hambre.\n\nPero en 1845 el Cerrito le dijo que sí a Rosas, y la Confederación viene a cobrar. Las condiciones que se pueden escribir son las argentinas: vasallo, cliente o, si Rosas tiene la fuerza, una provincia más. No hay documento que muestre que Oribe lo quisiera. Ahora es el precio."
 gg_peace.2.g:0 "Reincorporación: la República entra a la Confederación como una provincia más."
 gg_peace_reincorporation_tt:0 "La República deja de existir: la Argentina incorpora el país, cuyos estados conservan la autonomía de la #b Provincia Oriental#!. El Brasil y las potencias lo toman como un agravio."
 gg_powers.32.t:0 "Lamas en Río"
 gg_powers.32.f:0 "Un protector que se paga caro también es un dueño."
 gg_powers.32.a:0 "Aceptar el compromiso con el Imperio."
 gg_powers.32.b:0 "Seguir pidiendo ayuda sin atarse."
 gg_imperial_pledge_tt:0 "@information! El compromiso ata a la #R Defensa#! a una paz escrita en condiciones brasileñas."
 gg_postwar.2.t:0 "La cuenta del vencedor"
 gg_postwar.2.d:0 "La guerra terminó con castigo. Nadie reconoce las deudas del gobierno vencido, y sus hombres vuelven a la campaña con el rencor intacto. La fusión de los partidos queda descartada. Lo único que se puede decidir ahora es si se ablanda la mano, tarde."
 gg_postwar.2.f:0 "Una paz que castiga es una guerra que cambia de forma."
 gg_postwar.2.a:0 "Que paguen."
 gg_postwar.2.b:0 "Una amnistía tardía."
 gg_postwar.3.t:0 "Las deudas de los dos gobiernos"
 gg_postwar.3.d:0 "Como en el Pantanoso, la paz sin vencidos trae una cuenta: lo que debían la Defensa y el Cerrito. Si el Estado asume las dos, los acreedores de los dos bandos quedan tranquilos. Si solo reconoce la propia, la mitad del país queda con papeles sin valor."
 gg_postwar.3.d_mortgaged:0 "Como en el Pantanoso, la paz sin vencidos trae una cuenta: lo que debían la Defensa y el Cerrito. Y la aduana ya estaba hipotecada otra vez desde que se terminó el subsidio francés, así que la cuenta es mayor. Si solo se reconoce la deuda propia, la mitad del país queda con papeles sin valor."
 gg_postwar.3.f:0 "Sin vencidos, y con deudas de los dos."
 gg_postwar.3.a:0 "El Estado asume las dos."
 gg_postwar.3.b:0 "Solo reconocer la propia."
 gg_postwar.4.t:0 "Las elecciones de 1852"
 gg_postwar.4.d:0 "Todos esperaban a Eugenio Garzón, pero murió en diciembre de 1851. Las Cámaras tienen que elegir presidente, y la paz sin vencidos dice que cualquiera puede ganar. Históricamente eligieron a Juan Francisco Giró, un blanco aceptable para los dos bandos."
 gg_postwar.4.d_powers:0 "La paz de las potencias termina en las urnas, y Londres y París miran. Todos esperaban a Eugenio Garzón, pero murió en diciembre de 1851. Las Cámaras eligen presidente con observadores europeos en la barra. Históricamente eligieron a Juan Francisco Giró, un blanco aceptable para los dos bandos."
 gg_postwar.4.f:0 "1 de marzo de 1852."
 gg_postwar.4.a:0 "Un blanco de compromiso: Giró."
 gg_postwar.4.b:0 "El candidato de la Defensa."
 gg_postwar.4.c:0 "El candidato de la campaña."
 gg_postwar.5.t:0 "Vuelven los caudillos"
 gg_postwar.5.d:0 "La paz con castigo dejó a los caudillos con tropa y con motivos. Rivera, Flores y los jefes de la campaña piden su parte del gobierno, y no piden permiso."
 gg_postwar.5.d_contained:0 "Pasaron los años de la paz sin vencidos, y los caudillos vuelven a pedir su parte, como en el triunvirato de 1853. Llegan más tarde y con menos fuerza de la que tendrían después de una paz con castigo."
 gg_postwar.5.f:0 "Los partidos se firman en un papel; los caudillos, a caballo."
 gg_postwar.5.a:0 "Dejarlos entrar al gobierno."
 gg_postwar.5.b:0 "Dejarlos afuera."
 gg_postwar.6.t:0 "La política de fusión"
 gg_postwar.6.d:0 "Andrés Lamas lo escribe en 1855: los partidos de la guerra ya no tienen razón de ser, y el país necesita dejar las divisas. La fusión promete estabilidad. Los caudillos, que viven de las divisas, no la van a aceptar sin pelear."
 gg_postwar.6.f:0 "Ni blancos ni colorados: orientales."
 gg_postwar.6.a:0 "Adoptar la fusión."
 gg_postwar.6.b:0 "Mantener las divisas."
 gg_peace_imperial_vassal:0 "Vasallo del Imperio"
 gg_peace_imperial_vassal_desc:0 "La República gobierna con la garantía del Brasil, y el Brasil decide lo que la República puede hacer afuera."
 gg_peace_cisplatina:0 "La Provincia Cisplatina"
 gg_peace_cisplatina_desc:0 "Veintitrés años después de la Convención de 1828, el Uruguay vuelve a llevar el nombre de la ocupación. Nadie en la Defensa lo pidió."
 gg_provincia_oriental:0 "Provincia Oriental"
 gg_provincia_oriental_desc:0 "La Banda Oriental entra en la Confederación como una provincia más, con su propio gobierno y sus caudillos."
 gg_peace_oribe_withdrew:0 "Oribe se fue con los argentinos"
 gg_peace_oribe_withdrew_desc:0 "El jefe del Cerrito se embarcó con la división argentina bajo la garantía de las escuadras. Los blancos que quedaron no tienen a quién seguir."
 gg_peace_oribe_sold_country:0 "«Oribe entregó el país»"
 gg_peace_oribe_sold_country_desc:0 "La prensa de Montevideo repite que el Cerrito aceptó volver a la Confederación en 1845. No hay pruebas de que Oribe lo quisiera, pero la acusación funciona."
 gg_postwar_unrecognised_debts:0 "Deudas del vencido sin reconocer"
 gg_postwar_unrecognised_debts_desc:0 "Los acreedores del gobierno vencido no cobran, y el crédito de la República lo paga."
 gg_postwar_unrest:0 "Campaña resentida"
 gg_postwar_unrest_desc:0 "Los hombres del bando vencido volvieron a sus pagos con las armas escondidas."
 gg_postwar_late_amnesty:0 "Amnistía tardía"
 gg_postwar_late_amnesty_desc:0 "El gobierno perdonó tarde. La campaña se calma, y el ejército lo toma como una debilidad."
 gg_postwar_shared_debts:0 "Deudas de los dos gobiernos"
 gg_postwar_shared_debts_desc:0 "El Estado asumió lo que debían la Defensa y el Cerrito, como en el Pantanoso."
 gg_postwar_debts_disowned:0 "Deudas desconocidas"
 gg_postwar_debts_disowned_desc:0 "El Estado solo reconoce lo que debía su propio gobierno."
 gg_postwar_observed_election:0 "Elección bajo la mirada europea"
 gg_postwar_observed_election_desc:0 "La paz de las potencias terminó en una votación que Londres y París dieron por buena."
 gg_postwar_caudillos:0 "Los caudillos en el gobierno"
 gg_postwar_caudillos_desc:0 "Los jefes de la guerra mandan otra vez, con sus tropas detrás."
 gg_postwar_fusion:0 "Política de fusión"
 gg_postwar_fusion_desc:0 "Las divisas pierden peso y el país gana estabilidad, mientras los caudillos lo aguanten."
 gg_powers.10.a_tt:0 "@information! Gran Bretaña se ofende y sostiene más a la Defensa. Si con eso el mar queda abierto, las escuadras levantan el bloqueo igual."
 gg_powers.12.a_tt:0 "@information! La propuesta pasa a Montevideo: si la Defensa también la acepta, se firma la paz de las potencias y la elección decide quién gobierna."
 gg_powers.13.a_tt:0 "@information! Se firma la paz de las potencias: un solo gobierno, y lo decide la elección. Si los #blue_value blancos#! van adelante en el puntaje, gobierna el Cerrito."
 gg_powers.14.a_tt:0 "@information! La oferta pasa a Montevideo: si la Defensa acepta, seis meses de tregua (el asedio y las negociaciones se congelan)."
 gg_powers.15.a_tt:0 "@information! Seis meses de tregua: el asedio y toda presión por la paz quedan quietos mientras dure."
 gg_powers.16.a_tt:0 "@information! Oribe asume la presidencia con garantía europea: el Cerrito absorbe a la Defensa en paz, y Rosas pasa a ser enemigo."
 gg_powers.23.b_tt:0 "@information! El Cerrito pide condiciones: la Defensa va a dictar la paz."
 gg_powers.23.c_tt:0 "@information! Oribe se embarca con la división argentina: la Defensa va a dictar la paz y Oribe se va del país."
 gg_powers.28.a_tt:0 "@information! Solo prospera si alguien ya se sentó a una mesa: las #b bases Hood#!, las #b ocho condiciones#! de Rivera o un #blue_value Cerrito#! que pidió condiciones. Entonces el que va adelante en el puntaje dicta la paz; con empate, la #R Defensa#!."
 gg_peace_reject_tt:0 "@information! La guerra sigue, y durante dos años nadie vuelve a ofrecer la paz."
 gg_peace.6.blancos_tt:0 "@information! Los #blue_value blancos#! ganan la elección: el Cerrito absorbe a la Defensa y gobierna la República."
 gg_peace.6.colorados_tt:0 "@information! Los #R colorados#! ganan la elección: la Defensa absorbe al Cerrito y gobierna la República."
 gg_peace.9.t:0 "Los blancos ganan la elección"
 gg_peace.9.desc:0 "Los dos gobiernos aceptaron las bases de Londres y de París, y la elección que las potencias vigilaron la ganó el partido que tenía más del país. La Defensa entrega la ciudad sin un tiro, las legiones entregan las armas, y el presidente cuyo mandato cortó el alzamiento de 1838 vuelve a gobernar la República entera."
 gg_peace.9.flav:0 "Nueve años de sitio, y la ciudad se abre con una urna."
 gg_peace.9.a:0 "Gobernar la República entera."
 gg_peace.9.a_tt:0 "@information! El Cerrito absorbe a la Defensa y vuelve a ser la República Oriental del Uruguay."
 gg_loan.4.a_tt:0 "@information! El compromiso ata al #blue_value Cerrito#! a una paz argentina: vasallaje, clientela o reincorporación. El apoyo de Rosas sube mucho."
 guerra_grande.9.b_tt:0 "@information! Las potencias mandan mediadores; el mar cerrado ya no impide que su propuesta llegue al gobierno."
