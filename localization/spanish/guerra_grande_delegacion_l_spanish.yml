l_spanish:
 je_gg_delegation:0 "El Pacto Federal"
 je_gg_delegation_desc:0 "El poder de Buenos Aires sobre las demás provincias no es soberanía: es un encargo. Por el Pacto Federal del 4 de enero de 1831, tratado entre entidades soberanas, las provincias le delegaron al gobernador de Buenos Aires el manejo de las relaciones exteriores — y cada una conservó el derecho de retirar lo que prestó.\n\nNo hay Estado nacional al que traicionar. Hay catorce provincias que se reconocen independientes entre sí, y una de ellas habla por todas mientras las demás la dejen."
 je_gg_delegation_reason:0 "El poder de Buenos Aires sobre las demás provincias no es soberanía: es un encargo. Por el Pacto Federal del 4 de enero de 1831, tratado entre entidades soberanas, las provincias le delegaron al gobernador de Buenos Aires el manejo de las relaciones exteriores — y cada una conservó el derecho de retirar lo que prestó.\n\nNo hay Estado nacional al que traicionar. Hay catorce provincias que se reconocen independientes entre sí, y una de ellas habla por todas mientras las demás la dejen.\n\n#b Lo que se cuenta#!\n• @information! #b Trece provincias#! delegan: las catorce de la Confederación menos Buenos Aires, que no puede delegar en sí misma. Cuando no quede ninguna, no quedará tampoco de qué ser gobernador encargado.\n• Cada provincia que se pronuncia se va entera. Recuperarla por las armas la trae de vuelta, y eso es lo que se juega en el interior.\n• @battalions! Sostener al ejército de Oribe frente a Montevideo cuesta, mes a mes, la doceava parte de una provincia. Nueve años de sitio son nueve años de desgaste, y no se ven hasta que se ven.\n• Nada de esto es opinión: son hechos. La barra no mide lo que las provincias piensan de usted, mide cuántas siguen dejándolo hablar por ellas."
 je_gg_delegation_status_rosas:0 "Todavía hablan por su boca #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! provincias."
 je_gg_delegation_status_provincia:0 "Buenos Aires todavía habla por #V [GetGlobalVariable('gg_delegating_provinces').GetValue|0]#! provincias. Por ésta, ya no."
 je_gg_delegation_complete_tt:0 "Ninguna provincia delega ya sus relaciones exteriores en el gobernador de Buenos Aires."
 gg_delegation_bar_desc:0 "Provincias que siguen delegando"
