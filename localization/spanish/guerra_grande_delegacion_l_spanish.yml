l_spanish:
 je_gg_delegation:0 "El Pacto Federal"
 je_gg_delegation_desc:0 "El poder de Buenos Aires sobre las demás provincias no es soberanía: es un encargo. Por el Pacto Federal del 4 de enero de 1831, tratado entre entidades que se reconocen soberanas entre sí, las provincias le delegaron al gobernador de Buenos Aires el manejo de sus relaciones exteriores — y cada una conservó el derecho de retirar lo que prestó.\n\nAcá no hay Estado nacional al que traicionar. Hay catorce provincias, y una habla por las demás exactamente mientras las demás la dejen."
 je_gg_delegation_reason:0 "El poder de Buenos Aires sobre las demás provincias no es soberanía: es un encargo. Por el Pacto Federal del 4 de enero de 1831, tratado entre entidades que se reconocen soberanas entre sí, las provincias le delegaron al gobernador de Buenos Aires el manejo de sus relaciones exteriores — y cada una conservó el derecho de retirar lo que prestó.\n\nAcá no hay Estado nacional al que traicionar. Hay catorce provincias, y una habla por las demás exactamente mientras las demás la dejen.\n\n#b Cómo se lee esto#!\n• @information! #b Trece provincias#! pueden delegar: las catorce de la Confederación menos Buenos Aires, que no puede delegar en sí misma. Arriba están repartidas en tres: las que delegan, las que delegan con un pliego sin contestar, y las que retiraron el encargo.\n• Una provincia que se pronuncia se va entera, y vuelve entera — batida en el campo y con un gobernador federal encima, que es lo que de verdad les pasó a Corrientes y a Tucumán. A ninguna la anexaron nunca.\n• @battalions! Los meses del pie son los que el ejército de Oribe lleva parado frente a Montevideo. Acá no cuestan nada: están para que se vea qué está costando en tiempo la guerra de la otra orilla.\n• #b El encargo se quiebra con media Confederación ida Y el sitio encima#!. Que deleguen seis o menos no alcanza: en octubre de 1840 eso es lo que hay y Rosas gobernó once años más. Lo que lo quebró fue sostener al ejército frente a Montevideo #b tres años#! mientras el interior estaba en armas. Las dos cosas a la vez."
 je_gg_delegation_complete_tt:0 "Sólo #N 6 o menos#! de las #V 13#! provincias dejan hablar por ellas a Buenos Aires, mientras el ejército lleva #V 3 años#! frente a Montevideo. El encargo ya no alcanza para sostener la Confederación."
 gg_delegation_bar_desc:0 "Provincias que siguen delegando"
 je_gg_del_l_corrientesok_cordobaok_norteok_entre_riosok:0 "#P Delegan#! (#V 13#!): Corrientes, Entre Ríos, Santa Fe, Córdoba, Santiago del Estero, Tucumán, Salta, Jujuy, Catamarca, La Rioja, San Juan, San Luis y Mendoza.\n\nEl ejército frente a Montevideo lleva #V [GetGlobalVariable('gg_oribe_siege_months').GetValue|0]#! meses ahí."
