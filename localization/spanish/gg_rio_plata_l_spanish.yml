l_spanish:
 gg_ui_plata_weight_blancos:0 "El río inclina la guerra #blue_value +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! hacia los blancos."
 gg_ui_plata_weight_colorados:0 "El río inclina la guerra #R +[JournalEntry.MakeScope.ScriptValue('gg_ui_plata_weight_points')|0]#! hacia los colorados."
 gg_plata_rosas_close_tt:0 "@ships! Rosas #N cierra el Plata#! a toda bandera extranjera. Mientras su orilla tenga batería, el cierre rige aunque Montevideo quede abierta.\n@warning! #b Con Rosas en tus manos, el bloqueo no rige hasta que cierres tu orilla#! en el panel del estrecho del Río de la Plata (hacé clic en el estrecho, en el mapa, entre Buenos Aires y Montevideo). Sin batería en la orilla de Buenos Aires, tampoco se cierra."
 gg_plata_rosas_open_tt:0 "@ships! Rosas #P abre el Plata#!.\n#grey (Con Rosas en tus manos: dejá abierta tu orilla en el panel del estrecho. Si la volvés a cerrar, vuelve a contar la paciencia de las potencias; si el río está bajo su garantía, sus escuadras entran enseguida.)#!"
 gg_plata_rosas_neutrals_tt:0 "@ships! El bloqueo de Rosas sólo detiene a los barcos de la Defensa: #P los neutrales entran al puerto#!."
 gg_plata_fort_remove_tt:0 "@warning! Se pierde la batería de Buenos Aires: #N Rosas no puede cerrar el río#! hasta recuperarla."
 gg_plata_fort_restore_tt:0 "@ships! Buenos Aires recupera su batería: #b Rosas vuelve a poder cerrar el río#!."
 gg_plata_intervention_start_tt:0 "@warning! #N Empieza la intervención anglo-francesa#!: Gran Bretaña y Francia rompen con Rosas (relaciones #N -30#!), y sus escuadras entran al río."
 gg_plata_squadrons_called_tt:0 "@information! La paciencia de las potencias que respaldan a la Defensa con el río cerrado baja de #V 18#! a #V 12#! meses."
 gg_plata.2.b_tt:0 "@information! El Cerrito puede volver a pedirlo dentro de un año."
 gg_plata.2.t:0 "Oribe pide el bloqueo de Montevideo"
 gg_plata.2.d:0 "El general #b Oribe#! nos escribe desde el Cerrito: la plaza vive del puerto, y mientras entren barcos por el río el sitio no la va a rendir. Pide que la escuadra del brigadier #b Brown#! cierre las aguas de Montevideo a toda bandera.\n\nLa estación británica ya avisó cómo lo va a recibir. Su gobierno tiene por principio no reconocerles «a los nuevos puertos de Sudamérica» el ejercicio de «tan alto e interesante derecho como el del bloqueo», y el comodoro #b Purvis#! tiene fondeado en la rada al #b Alfred#!, de cincuenta cañones.\n\nLo que se resuelva lo sostiene la batería de Buenos Aires. Sin ella ninguna prohibición nuestra se cumple en el agua; con ella, el río se cierra desde nuestra orilla aunque la otra siga abierta."
 gg_plata.2.f:0 "El que tiene la orilla tiene el río."
 gg_plata.2.a:0 "Declarar el bloqueo."
 gg_plata.2.b:0 "La escuadra no se juega por Montevideo."
 gg_plata.10.t:0 "Los pasaportes de los ministros"
 gg_plata.10.d:0 "El ministro británico #b William Gore Ouseley#! y el barón #b Deffaudis#!, que llegó con las instrucciones de Guizot, nos exigen lo mismo nota tras nota: que se levante el bloqueo de Montevideo y que las divisiones argentinas salgan del Estado Oriental. Declaran que no admitirán al general Oribe como presidente legal «ni aun elegido».\n\nAhora llega el ultimátum, con plazo. Si no se accede, sus almirantes se apoderan de la escuadra del brigadier Brown frente a Montevideo y los puertos de la Confederación quedan bloqueados. Los dos ministros ya pidieron sus pasaportes para el caso.\n\nEl señor #b Arana#! los tiene preparados. Devolverlos es la guerra con las dos primeras potencias de Europa sin que ninguna la declare. Retenerlos es levantar el bloqueo sin concederles lo demás: el río se abre, y Londres y París quedan como garantes de que no vuelva a cerrarse."
 gg_plata.10.f:0 "«Tanto por el interés de nuestro comercio, cuanto por el de la humanidad, nos vemos forzados a poner término a un estado de cosas que ha venido a ser intolerable.» — Guizot, instrucciones al barón Deffaudis"
 gg_plata.10.a:0 "Devolver los pasaportes."
 gg_plata.10.b:0 "Levantar el bloqueo."
 gg_strait_control_magellan:0 "Orilla del estrecho de Magallanes"
 gg_strait_control_magellan_desc:0 "Quien tiene esta costa tiene el paso, aunque no haya fuerte que lo cierre."
 gg_plata_rosas_yielded:0 "Arrió la bandera ante las potencias"
 gg_plata_rosas_yielded_desc:0 "Rosas levantó el bloqueo ante el ultimátum de Londres y París."
 gg_ai_strategy_plata_open:0 "El río abierto"
 gg_ai_strategy_plata_open_desc:0 "[COUNTRY.GetName] deja pasar a toda bandera por su orilla del Plata."
 gg_ai_strategy_plata_closed:0 "El bloqueo de Montevideo"
 gg_ai_strategy_plata_closed_desc:0 "[COUNTRY.GetName] cierra su orilla del Plata a toda bandera que no sea la suya."
 gg_ai_strategy_plata_enemies:0 "El bloqueo a medias"
 gg_ai_strategy_plata_enemies_desc:0 "[COUNTRY.GetName] solo detiene a los barcos de sus enemigos; los neutrales entran al puerto."
 gg_ai_strategy_plata_defensa:0 "El puerto abierto"
 gg_ai_strategy_plata_defensa_desc:0 "[COUNTRY.GetName] vive de su puerto y lo mantiene abierto a todos."
 gg_plata.20.t:0 "El río cerrado"
 gg_plata.20.d:0 "Rosas cerró el Plata desde la orilla de Buenos Aires: ningún barco extranjero llega ya a Montevideo.\n\nMientras dure el cierre, la plaza se aprieta (mortalidad #N +5%#!). Fuera de las treguas, además, cada mes suma a su hambre, gasta la paciencia de las potencias que respaldan a la Defensa y corre la guerra hacia los #blue_value blancos#!. Un solo mes de río abierto corta la racha del hambre."
 gg_plata.20.a:0 "Que se sepa en la línea."
 gg_plata.21.t:0 "El río abierto"
 gg_plata.21.d_battery:0 "Buenos Aires perdió su batería, y sin ella Rosas no puede cerrar el río: los barcos vuelven a llegar a Montevideo. No habrá cierre hasta que la batería vuelva a levantarse.\n\nLa racha de meses sin barcos se corta."
 gg_plata.21.d_shore:0 "La orilla de Buenos Aires ya no está en manos de Rosas, y nadie más puede cerrar el río: los barcos vuelven a llegar a Montevideo.\n\nLa racha de meses sin barcos se corta."
 gg_plata.21.d_neutrals:0 "Rosas deja pasar a los barcos neutrales. El bloqueo ya solo detiene a los de la Defensa, y por la puerta de los neutrales la plaza vuelve a abastecerse.\n\nLa racha de meses sin barcos se corta."
 gg_plata.21.d_rosas:0 "Rosas levantó el cierre del río, y los barcos vuelven a llegar a Montevideo.\n\nLa racha de meses sin barcos se corta."
 gg_plata.22.t:0 "Los ministros piden sus pasaportes"
 gg_plata.22.d:0 "Los ministros de Londres y París exigieron a Rosas que levante el bloqueo del río, y esperan su respuesta. De ella depende que sus escuadras entren al Plata.\n\nArgentina pierde prestigio (#N -10%#!) mientras la cuestión sigue abierta."
 gg_plata.23.t:0 "Las escuadras en el río"
 gg_plata.23.d:0 "Las escuadras de Gran Bretaña y Francia entraron al Plata y bloquean el puerto de Buenos Aires. El paso a Montevideo no se abre solo: depende de lo que pase con la escuadra de Brown y con la batería de Rosas."
 gg_plata.24.t:0 "El arreglo con Rosas"
 gg_plata.24.d:0 "Londres y París firmaron con Rosas y retiraron sus escuadras, con las fragatas que le habían prestado a la Defensa. Si Rosas conserva la orilla de Buenos Aires y su batería, el río vuelve a quedar en sus manos."
 gg_plata_guarantee_tt:0 "@information! Londres y París quedan como #b garantes del río abierto#!: mientras dure la garantía, el Cerrito no puede pedir el cierre, y si Rosas vuelve a cerrar, sus escuadras entran enseguida, sin nuevo ultimátum.\n#grey (Con Rosas en tus manos: abrí tu orilla en el panel del estrecho dentro de dos meses.)#!"
 gg_plata_yield_cerrito_tt:0 "@warning! El Cerrito #N pierde el apoyo rosista#! que el bloqueo le había dado."
 gg_plata.10.d_france:0 "Londres no se mete en esto; París sí. El ministro de Francia nos exige nota tras nota que se levante el bloqueo de Montevideo, y ahora llega el ultimátum, con plazo. Si no se accede, la escuadra francesa entra al Plata. El ministro ya pidió sus pasaportes para el caso.\n\nEl señor #b Arana#! los tiene preparados. Devolverlos es la guerra con Francia sin que la declare. Retenerlos es levantar el bloqueo: el río se abre, y París queda como garante de que no vuelva a cerrarse."
 gg_plata.22.d_france:0 "Londres no se mete en la cuestión, pero el ministro de Francia le exigió que levante el bloqueo del río, y espera su respuesta. De ella depende que la escuadra francesa entre al Plata.\n\nArgentina pierde prestigio (#N -10%#!) mientras la cuestión sigue abierta."
 gg_plata.25.t:0 "Rosas cede al ultimátum"
 gg_plata.25.d:0 "Rosas cedió al ultimátum y se comprometió a levantar el bloqueo: en cuanto se abra su orilla, los barcos vuelven a llegar a Montevideo, y Londres y París quedan como garantes de que el río siga abierto.\n\nMientras dure la garantía, el Cerrito no puede pedirle a Rosas que vuelva a cerrarlo. Si dentro de dos meses el río sigue cerrado, o si Rosas lo vuelve a cerrar, las escuadras entran enseguida, sin nuevo ultimátum; esos dos meses no cuentan para el hambre ni para la paciencia. La garantía dura hasta que Londres reconozca el derecho de bloqueo."
 gg_plata.25.d_france:0 "Rosas cedió al ultimátum de Francia y se comprometió a levantar el bloqueo: en cuanto se abra su orilla, los barcos vuelven a llegar a Montevideo, y París queda como garante de que el río siga abierto.\n\nMientras dure la garantía, el Cerrito no puede pedirle a Rosas que vuelva a cerrarlo. Si dentro de dos meses el río sigue cerrado, o si Rosas lo vuelve a cerrar, la escuadra francesa entra enseguida; esos dos meses no cuentan para el hambre ni para la paciencia. La garantía dura hasta que París también reconozca el derecho de bloqueo."
 gg_plata.26.t:0 "Rosas falta a su palabra"
 gg_plata.26.d:0 "Con el río bajo la garantía de las potencias, Rosas volvió a cerrarlo. No hay nueva nota ni nuevo plazo: sus escuadras entran al Plata y bloquean el puerto de Buenos Aires."
 gg_plata.27.t:0 "Londres reconoce el derecho de bloqueo"
 gg_plata.27.d:0 "Sin haber disparado un cañón, Londres reconoce la soberanía argentina sobre sus ríos y su derecho a bloquear, como en el tratado Arana-Southern. Su garantía se termina: el Cerrito puede volver a pedirle a Rosas que cierre el río, y desde ahora solo cuenta la paciencia de París."
 gg_plata.28.t:0 "París arregla con Rosas"
 gg_plata.28.d:0 "París también arregla con Rosas, como en la convención Arana-Lepredour, y reconoce su derecho a bloquear. Ya no queda potencia que responda por el río: si Rosas lo vuelve a cerrar, las escuadras no vuelven."
 gg_plata_guarantee_france_tt:0 "@information! París queda como #b garante del río abierto#!: mientras dure la garantía, el Cerrito no puede pedir el cierre, y si Rosas vuelve a cerrar, la escuadra francesa entra enseguida, sin nuevo ultimátum.\n#grey (Con Rosas en tus manos: abrí tu orilla en el panel del estrecho dentro de dos meses.)#!"
 gg_plata_intervention_start_france_tt:0 "@warning! #N Empieza la intervención francesa#!: Francia rompe con Rosas (relaciones #N -30#!), y su escuadra entra al río y bloquea el puerto de Buenos Aires. Londres no participa."
 gg_plata.23.d_france:0 "La escuadra de Francia entró al Plata y bloquea el puerto de Buenos Aires. Londres se queda afuera. El bloqueo francés no abre por sí solo el paso a Montevideo: mientras Rosas conserve su orilla y su batería, puede seguir cerrándolo."
 gg_plata.26.d_france:0 "Con el río bajo la garantía de París, Rosas volvió a cerrarlo. No hay nueva nota ni nuevo plazo: la escuadra francesa entra al Plata y bloquea el puerto de Buenos Aires."
 gg_plata.25.d_cost:0 "Rosas cedió al ultimátum y se comprometió a levantar el bloqueo: en cuanto se abra su orilla, los barcos vuelven a llegar a Montevideo, y Londres y París quedan como garantes de que el río siga abierto.\n\nMientras dure la garantía, el Cerrito no puede pedirle a Rosas que vuelva a cerrarlo, y pierde el apoyo rosista que el bloqueo le había dado. Si dentro de dos meses el río sigue cerrado, o si Rosas lo vuelve a cerrar, las escuadras entran enseguida, sin nuevo ultimátum; esos dos meses no cuentan para el hambre ni para la paciencia. La garantía dura hasta que Londres reconozca el derecho de bloqueo."
 gg_plata.25.d_france_cost:0 "Rosas cedió al ultimátum de Francia y se comprometió a levantar el bloqueo: en cuanto se abra su orilla, los barcos vuelven a llegar a Montevideo, y París queda como garante de que el río siga abierto.\n\nMientras dure la garantía, el Cerrito no puede pedirle a Rosas que vuelva a cerrarlo, y pierde el apoyo rosista que el bloqueo le había dado. Si dentro de dos meses el río sigue cerrado, o si Rosas lo vuelve a cerrar, la escuadra francesa entra enseguida; esos dos meses no cuentan para el hambre ni para la paciencia. La garantía dura hasta que París también reconozca el derecho de bloqueo."
 gg_plata.20.d_france:0 "Rosas cerró el Plata desde la orilla de Buenos Aires: ningún barco extranjero llega ya a Montevideo.\n\nMientras dure el cierre, la plaza se aprieta (mortalidad #N +5%#!). Fuera de las treguas, además, cada mes suma a su hambre, gasta la paciencia de París (Londres no se mete en la cuestión) y corre la guerra hacia los #blue_value blancos#!. Un solo mes de río abierto corta la racha del hambre."
 gg_plata.20.d_none:0 "Rosas cerró el Plata desde la orilla de Buenos Aires: ningún barco extranjero llega ya a Montevideo.\n\nLondres y París ya le reconocieron el derecho de bloqueo: ninguna escuadra europea va a venir. Pero el Litoral vive del Paraná, y cada mes de río cerrado corre el peso de #b Urquiza#! contra Rosas. Mientras dure el cierre, la plaza se aprieta (mortalidad #N +5%#!). Fuera de las treguas, además, cada mes suma a su hambre y corre la guerra hacia los #blue_value blancos#!. Un solo mes de río abierto corta la racha del hambre."
 gg_ui_plata_phase_1_prewar_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Mientras no haya dos gobiernos orientales en guerra, el cierre aprieta a la plaza, pero no cuenta para su hambre ni para la paciencia de Londres y París.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_1_truce_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Durante la tregua no se mueve ninguna cuenta: ni el hambre de la plaza ni la paciencia de las potencias.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_1_grace_tt:0 "Rosas cedió al ultimátum, pero su orilla sigue cerrada: tiene dos meses para abrirla. En ese plazo el cierre no cuenta para el hambre de la plaza ni para la paciencia de las potencias; si al vencer sigue cerrado, las escuadras entran sin nuevo ultimátum.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_1_none_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Cada mes de río cerrado suma al hambre de la plaza, pero ninguna potencia respalda hoy a la Defensa lo bastante para reclamarle nada a Rosas.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_1_france_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Cada mes de río cerrado suma al hambre de la plaza y gasta la paciencia de París; Londres no se mete en la cuestión.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_3_howden_tt:0 "Lord Howden levantó el bloqueo británico y Walewski no quiso levantar el francés: la escuadra de Francia sigue frente a Buenos Aires, y Londres sigue en la cuestión hasta que firme con Rosas. Mientras Rosas conserve su orilla y su batería, puede cerrar el paso a Montevideo.\n#b Efectos#!: Buenos Aires, capacidad comercial #N -10#!; las potencias con escuadra en el río, generación de infamia #N +10%#!; la Defensa, #V 4#! fragatas prestadas por las potencias, con los pertrechos por cuenta de Francia; Montevideo, mortalidad #N +5%#! mientras el río siga cerrado."
 gg_ui_plata_phase_3_southern_tt:0 "Londres firmó con Rosas, como en el tratado Arana-Southern, y le reconoció el derecho de bloqueo. En el río queda solo la escuadra de Francia, que ya levantó su bloqueo de Buenos Aires y sigue sosteniendo a la plaza hasta que París también firme. Mientras Rosas conserve su orilla y su batería, puede cerrar el paso a Montevideo.\n#b Efectos#!: Francia, generación de infamia #N +10%#!; la Defensa, #V 4#! fragatas prestadas por las potencias, con los pertrechos por cuenta de Francia; Montevideo, mortalidad #N +5%#! mientras el río siga cerrado."
 gg_ui_plata_phase_4_france_tt:0 "París firmó con Rosas, retiró su escuadra y le reconoció el derecho a bloquear; Londres ya no estaba en la cuestión. Si Rosas conserva la orilla de Buenos Aires y su batería, el río vuelve a estar en sus manos, y un nuevo cierre ya no trae a ninguna escuadra."
 gg_ui_plata_ba_blockaded_fr_int_tt:0 "La escuadra de Francia está frente al puerto de Buenos Aires: el cerrado es Buenos Aires, no Montevideo. La batería sigue decidiendo si Rosas puede cerrar el río."
 gg_ui_plata_ba_port_blockaded:0 "#N Puerto bloqueado#!"
 gg_ui_plata_ba_port_blockaded_tt:0 "Hay barcos de guerra frente al puerto de Buenos Aires. Es un bloqueo del puerto, aparte del paso del río, que sigue dependiendo de la orilla y de su batería."
 gg_ui_plata_decree_pending:0 "#b Decretaste el bloqueo#!, pero tu orilla todavía deja pasar barcos: falta cerrar el paso del estrecho."
 gg_ui_plata_decree_pending_tt:0 "El decreto está firmado y la batería en pie, pero el cierre todavía no rige en el agua: los barcos siguen llegando a Montevideo, y el río no suma al hambre de la plaza ni gasta la paciencia de las potencias.\n@warning! #b Con Rosas en tus manos, el bloqueo no rige hasta que cierres tu orilla#! en el panel del estrecho del Río de la Plata (hacé clic en el estrecho, en el mapa, entre Buenos Aires y Montevideo). Hacen falta los dos ajustes: el acceso en #b Cerrado#! y los países permitidos en #b Solo el controlador del estrecho#!. Con #b No enemigos#!, que es el ajuste de siempre, el cierre solo alcanza a quien esté en guerra con Buenos Aires: los barcos británicos siguen pasando y el río cuenta como abierto. Sin batería en la orilla de Buenos Aires, tampoco se cierra."
 gg_ui_plata_decree_neutrals:0 "#b El bloqueo de Rosas no detiene a nadie#!: Purvis no lo reconoce y los barcos entran al puerto."
 gg_ui_plata_decree_neutrals_tt:0 "La estación británica no reconoce el bloqueo, y Buenos Aires no está en guerra con ninguna bandera que llegue a la plaza: su orilla, cerrada solo a los enemigos, no detiene a nadie. Mientras sea así, la plaza come: el río no suma a su hambre ni gasta la paciencia de las potencias."
 gg_ui_plata_sec_clocks_truce:0 "Relojes detenidos por la tregua"
 gg_ui_plata_sec_clocks_truce_tt:0 "Durante la tregua no se mueve ninguna cuenta del río: ni el hambre de la plaza, ni la paciencia de las potencias, ni su peso en la guerra."
 gg_plata.10.d_peace:0 "Los ministros de Londres y París nos exigen, con plazo, que se levante el bloqueo del río. Pero la guerra oriental ya terminó, y lo que se conteste ahora queda entre Buenos Aires y las potencias.\n\nEl señor #b Arana#! tiene preparados los pasaportes. Devolverlos es la guerra con las dos primeras potencias de Europa sin que ninguna la declare. Retenerlos es levantar el bloqueo: el río se abre, y ya no queda guerra que las potencias tengan que garantizar."
 gg_plata.20.d_prewar:0 "Rosas cerró el Plata desde la orilla de Buenos Aires: ningún barco extranjero llega ya a Montevideo.\n\nMientras dure el cierre, la plaza se aprieta (mortalidad #N +5%#!). Todavía no hay dos gobiernos orientales en guerra: el cierre no acerca a la plaza a tratar la paz ni gasta la paciencia de Londres y París."
 gg_plata.20.d_squadrons:0 "Rosas volvió a cerrar el Plata desde la orilla de Buenos Aires, con las potencias ya encima: ningún barco extranjero llega a Montevideo.\n\nMientras dure el cierre, la plaza se aprieta (mortalidad #N +5%#!). Fuera de las treguas, además, cada mes cerrado suma a su hambre y corre la guerra hacia los #blue_value blancos#!. Un solo mes de río abierto corta la racha del hambre."
 gg_plata.21.d_squadron:0 "Las escuadras de las potencias se llevaron la de Brown frente a Montevideo, y sin escuadra la batería de Rosas no cierra nada: los barcos vuelven a llegar a la plaza. No habrá cierre hasta que le devuelvan lo que le quitaron.\n\nLa racha de meses sin barcos se corta."
 gg_plata.24.d_france:0 "París firmó con Rosas y retiró su escuadra, con las fragatas que le había prestado a la Defensa; Londres ya no estaba en la cuestión. Si Rosas conserva la orilla de Buenos Aires y su batería, el río vuelve a quedar en sus manos."
 gg_plata.27.d_none:0 "Sin haber disparado un cañón, Londres reconoce la soberanía argentina sobre sus ríos y su derecho a bloquear, como en el tratado Arana-Southern. Su garantía se termina: el Cerrito puede volver a pedirle a Rosas que cierre el río, y hoy ninguna potencia respalda a la Defensa lo bastante para reclamarle nada."
 gg_plata.44.t:0 "La estación británica y el bloqueo"
 gg_plata.44.d:0 "El comodoro #b Purvis#!, desde el #b Alfred#!, contesta a nuestro bloqueo que su gobierno no les reconoce a los nuevos puertos de Sudamérica «tan alto e interesante derecho como el del bloqueo», y reclama paso para los neutrales que van a la plaza.\n\nHasta que Londres respalde o desautorice a su comodoro, el bloqueo que la estación británica está dispuesta a tolerar es el que solo detiene a los barcos de la Defensa."
 gg_plata.44.f:0 "«Mr. Brown, súbdito británico al mando de los buques de Buenos Aires.» — el comodoro Purvis"
 gg_plata.44.a:0 "Que Londres lo desautorice."
 gg_plata.44.a_tt:0 "@information! Mientras Londres no desautorice a Purvis, la palabra de Rosas es que su bloqueo solo detiene a los barcos de la Defensa.\n#grey (Con Rosas en tus manos: tu orilla sigue como la dejaste en el panel del estrecho. Cerrada solo a los enemigos, entran los neutrales; cerrada a toda bandera, el cierre sigue rigiendo.)#!"
 gg_plata.45.t:0 "Londres desautoriza a Purvis"
 gg_plata.45.d:0 "Lord #b Aberdeen#! desautorizó a su comodoro: Londres reconoce nuestro derecho de bloqueo, y la estación británica ya no reclama paso para la plaza. A #b Purvis#! no lo castigan.\n\nNada impide ya cerrar el río a toda bandera."
 gg_plata.45.f:0 "Londres no castigó a su comodoro; solo le quitó la razón."
 gg_plata.45.a:0 "Cerrar otra vez el río."
 gg_plata.10.d_peace_france:0 "El ministro de Francia nos exige, con plazo, que se levante el bloqueo del río; Londres no se mete. Pero la guerra oriental ya terminó, y lo que se conteste ahora queda entre Buenos Aires y París.\n\nEl señor #b Arana#! tiene preparados los pasaportes. Devolverlos es la guerra con Francia sin que la declare. Retenerlos es levantar el bloqueo: el río se abre, y ya no queda guerra que París tenga que garantizar."
 gg_ui_plata_sec_clocks_grace:0 "Relojes quietos: el plazo de Rosas"
 gg_ui_plata_sec_clocks_grace_tt:0 "Rosas cedió al ultimátum y tiene dos meses para abrir su orilla. Mientras corre ese plazo no se mueve ninguna cuenta del río: ni el hambre de la plaza, ni la paciencia de las potencias, ni su peso en la guerra."
 gg_ui_plata_phase_3_lifted_tt:0 "Francia levantó su bloqueo de Buenos Aires, como hizo el barón Gros en junio de 1848: ninguna escuadra cierra ya el puerto de Rosas. Londres y París siguen en la cuestión, con sus escuadras en el río, hasta que firmen con Rosas. Mientras Rosas conserve su orilla y su batería, puede cerrar el paso a Montevideo.\n#b Efectos#!: las potencias con escuadra en el río, generación de infamia #N +10%#!; la Defensa, #V 4#! fragatas prestadas por las potencias, con los pertrechos por cuenta de Francia; Montevideo, mortalidad #N +5%#! mientras el río siga cerrado."
 gg_ui_plata_phase_3_france_lifted_tt:0 "Francia levantó su bloqueo de Buenos Aires, como hizo el barón Gros en junio de 1848, pero su escuadra sigue en el río y París sigue en la cuestión hasta que firme con Rosas; Londres está afuera. Mientras Rosas conserve su orilla y su batería, puede cerrar el paso a Montevideo.\n#b Efectos#!: Francia, generación de infamia #N +10%#!; la Defensa, #V 4#! fragatas prestadas por Francia, con los pertrechos por su cuenta; Montevideo, mortalidad #N +5%#! mientras el río siga cerrado."
 gg_plata.46.t:0 "Francia levanta el bloqueo de Buenos Aires"
 gg_plata.46.d:0 "Francia levanta su bloqueo del puerto de Buenos Aires, como en junio de 1848, cuando el barón Gros lo dio por terminado con la convención que arregló para Montevideo. Los barcos vuelven al puerto de Rosas.\n\nNo es el fin de la intervención: la escuadra francesa sigue en el Plata, y París sigue en la cuestión hasta que firme con Rosas. Londres también sigue, hasta su propio arreglo."
 gg_plata.46.d_france:0 "Francia levanta su bloqueo del puerto de Buenos Aires, como en junio de 1848, cuando el barón Gros lo dio por terminado con la convención que arregló para Montevideo. Los barcos vuelven al puerto de Rosas.\n\nNo es el fin de la intervención: la escuadra francesa sigue en el Plata, y París sigue en la cuestión hasta que firme con Rosas."
 gg_plata.46.a_tt:0 "@information! La orilla de Buenos Aires deja de estar bloqueada: recupera #P +10#! de capacidad comercial. La escuadra francesa sigue en el río."
 gg_ui_plata_decree_pending_ai:0 "#b Rosas decretó el bloqueo#!, pero su orilla todavía deja pasar barcos."
 gg_ui_plata_decree_pending_ai_tt:0 "El decreto está firmado y la batería en pie, pero el cierre todavía no rige en el agua: los barcos siguen llegando a Montevideo, y el río no suma al hambre de la plaza ni gasta la paciencia de las potencias. Mientras Buenos Aires no cierre su orilla, el bloqueo queda en el papel."
 gg_plata.47.t:0 "Las escuadras fuerzan el paso"
 gg_plata.47.d:0 "Con las escuadras de Londres y París todavía en el río, Rosas volvió a cerrar su orilla. No hubo nota ni plazo: los buques aliados se acercaron a la batería de Buenos Aires y la callaron, como en agosto de 1845 se llevaron la escuadra de Brown.\n\nEl paso queda abierto y los barcos vuelven a llegar a Montevideo. Sin batería en la orilla de Buenos Aires, Rosas ya no puede cerrar el río."
 gg_plata.47.d_rosas:0 "Cerramos la orilla con las escuadras de Londres y París todavía en el río. No mandaron nota ni plazo: sus buques se acercaron a la batería y la callaron, como en agosto de 1845 se llevaron la escuadra de Brown.\n\nEl paso queda abierto y los barcos vuelven a llegar a Montevideo. Sin batería en la orilla, el río ya no se puede cerrar."
 gg_plata.47.a_tt:0 "@warning! La orilla de Buenos Aires #N pierde su batería#!: Rosas no puede volver a cerrar el río. Londres y París quedan más frías con Buenos Aires (#N -20#! de relaciones)."
 gg_plata.48.t:0 "El Imperio fuerza el río"
 gg_plata.48.d:0 "Londres y París ya habían firmado con Rosas, y el río volvió a cerrarse. Esta vez responde Río de Janeiro: el Imperio no quiere a Rosas dueño del Plata, y la escuadra imperial de John Pascoe Grenfell entra al río y calla la batería de Buenos Aires.\n\nEl paso queda abierto y los barcos vuelven a llegar a Montevideo. Sin batería en su orilla, Rosas ya no puede cerrar el río, y el Brasil queda más cerca de la Defensa."
 gg_plata.48.d_rosas:0 "Las potencias europeas ya habían firmado, y volvimos a cerrar el río. Respondió Río de Janeiro: la escuadra imperial de John Pascoe Grenfell entró al río y calló nuestra batería.\n\nEl paso queda abierto y los barcos vuelven a llegar a Montevideo. Sin batería en la orilla, el río ya no se puede cerrar, y el Imperio queda más cerca de la Defensa."
 gg_plata.48.a_tt:0 "@warning! La orilla de Buenos Aires #N pierde su batería#!: Rosas no puede volver a cerrar el río."
 gg_plata.49.t:0 "La escuadra de Brown"
 gg_plata.49.d_lost:0 "Llega la noticia de Buenos Aires: Rosas no cedió al ultimátum, y los buques aliados tomaron la escuadra de Brown frente a Montevideo sin disparar un tiro. La Confederación no tiene con qué bloquear la plaza, y la batería de su orilla quedó en manos de las potencias.\n\nEn el Cerrito se dice que América ya sabe quién robó la escuadra. En la línea se sabe otra cosa: por el río van a seguir entrando barcos a la ciudad."
 gg_plata.49.d_saved:0 "Llega la noticia de Buenos Aires: Rosas le ordenó a Brown levantar el bloqueo y salvó la escuadra. Los barcos siguen siendo de la Confederación y la batería sigue en pie, pero el río queda abierto y la ciudad vuelve a recibir lo que viene por agua.\n\nEn el Cerrito se lo entiende: Rosas no va a perder su flota por Montevideo."
 gg_plata_settled_close_cost_tt:0 "@warning! Londres y París ya reconocieron el derecho de bloqueo, pero cerrar tiene precio: cada mes de río cerrado el Litoral pierde el comercio del Paraná, y el peso de #b Urquiza#! se corre contra Rosas (#N -5#! de su apoyo mientras esté con él), y su agravio crece. Cuando el #b Imperio del Brasil#! se mete en el Plata, cuenta esos meses como antes las potencias: al llegar a #V 6#!, su escuadra fuerza el paso."
 gg_ui_plata_phase_1_brazil_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Londres y París ya firmaron, pero cada mes de río cerrado suma al hambre de la plaza, le cuesta al Litoral el comercio del Paraná (el peso de #b Urquiza#! se corre contra Rosas) y gasta la paciencia del #b Imperio del Brasil#!.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_1_settled_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, y los barcos extranjeros ya no llegan a Montevideo. Londres y París ya firmaron, pero cada mes de río cerrado suma al hambre de la plaza y le cuesta al Litoral el comercio del Paraná: el peso de #b Urquiza#! se corre contra Rosas.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_ui_plata_phase_1_held_tt:0 "Rosas cerró el río desde la orilla de Buenos Aires, pero Londres y París ya perdieron la paciencia: mientras sus ministros esperan instrucciones, sus estaciones escoltan a los mercantes hasta Montevideo. La plaza pasa necesidad, pero no se muere de hambre: la racha no crece ni se corta mientras las potencias la sostengan.\n#b Efectos#!: Montevideo, mortalidad #N +5%#!."
 gg_plata.20.d_brazil:0 "Rosas cerró el Plata desde la orilla de Buenos Aires: ningún barco extranjero llega ya a Montevideo.\n\nLondres y París ya le reconocieron el derecho de bloqueo, pero Río de Janeiro no: el #b Imperio del Brasil#! cuenta ahora los meses de río cerrado, y el Litoral, que vive del Paraná, corre el peso de #b Urquiza#! contra Rosas. Mientras dure el cierre, la plaza se aprieta (mortalidad #N +5%#!). Fuera de las treguas, además, cada mes suma a su hambre y corre la guerra hacia los #blue_value blancos#!. Un solo mes de río abierto corta la racha del hambre."
 gg_powers.19_britain_out_tt:0 "@information! Gran Bretaña deja de contar en el río: lo que se garantice en adelante lo garantiza Francia sola, y la batería vuelve a la orilla de Buenos Aires."
