l_spanish:
 gg_ba_play_name:0 "La cuestión de Buenos Aires"
 dp_gg_buenos_aires:0 "Resolver la integridad nacional"
 gg_ba_army_name:0 "Ejército de Buenos Aires"
 gg_ba_differential_duties_hit:0 "Derechos diferenciales"
 gg_ba_differential_duties_hit_desc:0 "Lo que se descarga directo en los puertos de la Confederación paga menos que lo que pasa por nuestra aduana. El cabotaje se paraliza y la renta del puerto baja."
 gg_ba_differential_duties_gain:0 "Buques de ultramar en el Paraná"
 gg_ba_differential_duties_gain_desc:0 "Con los derechos diferenciales, los buques de ultramar empiezan a subir hasta Rosario, y la aduana del río cobra lo que antes cobraba Buenos Aires."
 gg_ba_flores_customs:0 "La aduana a la Nación"
 gg_ba_flores_customs_desc:0 "Por el Pacto de San José de Flores, el gobierno federal toma la aduana de Buenos Aires y le garantiza a la provincia su presupuesto por cinco años."

 gg_ba.1.t:0 "La revolución de septiembre"
 gg_ba.1.d:0 "El 11 de septiembre de 1852 Buenos Aires derrocó a las autoridades que le había impuesto el Director Provisorio y se negó a seguir en la Confederación. Ya en junio la Legislatura había rechazado el Acuerdo de San Nicolás: los porteños no querían perder ni la ciudad capital ni las rentas de su aduana.\n\nLa organización nacional sigue sin ellos. Las trece provincias mandan sus diputados al congreso de Santa Fe, y el gobierno de la Confederación sube por el río hasta Paraná. Buenos Aires se queda con el puerto, con la aduana y con la mitad de la renta del país.\n\nEn la campaña porteña hay jefes federales que no aceptan a los hombres de la ciudad. Hilario Lagos junta gente y promete sitiarla antes de fin de año, si alguien lo sostiene."
 gg_ba.1.f:0 "El puerto, la aduana y la ciudad capital: lo que Buenos Aires no quiso entregar."
 gg_ba.1.a:0 "Dejarla ir. La Nación se organiza igual."
 gg_ba.1.a_tt:0 "Buenos Aires queda aparte, sin guerra. La cuestión queda abierta."
 gg_ba.1.b:0 "Sostener a Lagos y sitiar la ciudad."
 gg_ba.1.b_tt:0 "La Confederación le hace la guerra a Buenos Aires junto a los federales de la campaña."
 gg_ba.1.c:0 "Seguir la suerte de Buenos Aires."
 gg_ba.1.c_tt:0 "Pasás a gobernar el Estado de Buenos Aires."

 gg_ba.2.t:0 "Dos gobiernos"
 gg_ba.2.d:0 "La guerra del Pacto no tuvo vencedor, y el tiempo no la resolvió. Rosas sigue en Buenos Aires con el puerto y la aduana; Urquiza gobierna desde Paraná a las provincias que ya no quieren recibir órdenes de la ciudad.\n\nNinguno de los dos reconoce al otro como gobierno de la Nación, y los dos se llaman argentinos. Los comerciantes siguen cargando en los dos puertos, los emigrados cambian de orilla según el viento, y cada correo trae una proclama nueva.\n\nLo que se decida entre los dos se va a decidir con tratados o con batallas: no hay otro tribunal."
 gg_ba.2.f:0 "Una Nación, dos gobiernos, y ninguno dispuesto a ceder."
 gg_ba.2.a:0 "Que el tiempo diga quién hace la Nación."
 gg_ba.2.a_tt:0 "Buenos Aires y la Confederación siguen cada una por su lado."

 gg_ba.3.t:0 "La escuadra de Coe"
 gg_ba.3.d:0 "Desde la Nochebuena de 1852 la ciudad está sitiada por tierra, y la pequeña escuadra de la Confederación, al mando del norteamericano John Halstead Coe, la bloquea por el río. Pero el sitio se alarga: los federales tienen el número y Buenos Aires tiene el puerto, la aduana y el crédito.\n\nA Coe y a varios de sus oficiales se los puede comprar. El coronel José María Flores, que vino de Montevideo, ya anda comprando a los oficiales de Lagos: en pocos días el desbande puede ser general.\n\nSi se paga, el bloqueo se levanta y el sitio no tiene cómo seguir."
 gg_ba.3.f:0 "Una escuadra que se vende no se hunde: se cambia de bandera."
 gg_ba.3.a:0 "Pagar. Que la escuadra se pase a Buenos Aires."
 gg_ba.3.a_tt:0 "Se levanta el sitio y la guerra termina con Buenos Aires aparte."
 gg_ba.3.b:0 "Aguantar sin pagarle a nadie."
 gg_ba.3.b_tt:0 "La guerra sigue por las armas."

 gg_ba.4.t:0 "Un Estado con su soberanía"
 gg_ba.4.d:0 "El 12 de abril de 1854 la Legislatura sanciona la constitución de Buenos Aires. Su primer artículo la declara «un Estado con el libre ejercicio de su soberanía interior y exterior, mientras no la delegue expresamente en un Gobierno federal».\n\nLa palabra es Estado, no provincia, y está puesta a propósito. Con ella Buenos Aires se atribuye casi la mitad del territorio que llama nacional: La Pampa y toda la Patagonia, aunque detrás de la frontera de fortines manden los caciques de Calfucurá.\n\nPastor Obligado, que gobierna desde el fin del sitio, será su primer gobernador constitucional."
 gg_ba.4.f:0 "Mientras no la delegue expresamente."
 gg_ba.4.a:0 "Jurar la constitución del Estado."

 gg_ba.5.t:0 "El tratado de convivencia"
 gg_ba.5.d:0 "A fines de 1854, cuando Lagos y Costa volvieron a entrar en la campaña porteña, los dos gobiernos estuvieron a un paso de la guerra. La evitaron dos comerciantes, Daniel Gowland y José María Cullen, con el apoyo del vicecónsul británico: el 20 de diciembre se firmó un statu quo.\n\nEl 8 de enero de 1855, en Paraná, el statu quo se hace tratado. Buenos Aires y la Confederación se aliarán contra un ataque de afuera y contra los malones; los buques mercantes de los dos usarán la bandera nacional, y no habrá aduanas entre ellos.\n\nNadie cree que dure mucho. Pero por ahora los barcos cargan en los dos puertos sin pagar dos veces."
 gg_ba.5.f:0 "Una convivencia firmada no es una unión: es una tregua con aduanas abiertas."
 gg_ba.5.a:0 "Firmar y seguir cada uno en lo suyo."

 gg_ba.6.t:0 "Los derechos diferenciales"
 gg_ba.6.d:0 "La Confederación habilitó catorce puertos sobre el Paraná y cinco sobre el Uruguay, y los buques de ultramar casi no llegan: siguen descargando en Buenos Aires, y lo que entra al interior paga allí. La aduana porteña cobra la renta de la Nación entera.\n\nAlberdi y los diputados Lucero y Rueda proponen una ley: lo que se descargue directo en un puerto de la Confederación pagará menos que lo que haya pasado por la aduana de Buenos Aires. El Congreso la resistió dos años.\n\nSi la ley pasa, Buenos Aires puede contestar cerrando su puerto a los frutos del interior."
 gg_ba.6.f:0 "Una guerra de aduanas encarece todo, y alguien la tiene que ganar."
 gg_ba.6.a:0 "Sancionar la ley. Que los buques suban hasta Rosario."
 gg_ba.6.b:0 "No sancionarla. El comercio no se toca."
 gg_ba.6.b_tt:0 "La aduana porteña sigue cobrando lo de todos."

 gg_ba.7.t:0 "Por la razón o por la fuerza"
 gg_ba.7.d:0 "El 20 de mayo de 1859 el Congreso reunido en Paraná, «capital provisoria de la Confederación Argentina», autoriza al Presidente «para resolver la cuestión de integridad nacional respecto de la provincia disidente de Buenos Aires, por medio de negociaciones pacíficas o de la guerra, según lo aconsejaren las circunstancias».\n\nLa ley le permite movilizar las guardias nacionales, aumentar el ejército de línea y formar una armada. El ministro Derqui lo dijo en la Cámara sin rodeos: se trata de «concluir con este estado de cosas por la razón o la fuerza».\n\nEn Buenos Aires la ley se lee como una declaración de guerra. El coronel Mitre ya reúne el ejército para marchar sobre Santa Fe."
 gg_ba.7.f:0 "«Dando cuenta al Congreso del resultado que obtenga por uno u otro medio.»"
 gg_ba.7.a:0 "Marchar. La integridad nacional no espera."
 gg_ba.7.a_tt:0 "Guerra entre la Confederación y Buenos Aires."
 gg_ba.7.b:0 "Esperar. Que Buenos Aires venga cuando quiera."
 gg_ba.7.b_tt:0 "Buenos Aires sigue aparte, y la cuestión con ella."

 gg_ba.8.t:0 "El Pacto de San José de Flores"
 gg_ba.8.d:0 "En la cañada de Cepeda, la caballería de la Confederación decidió la batalla: Mitre dejó en el campo cien muertos, dos mil prisioneros y una veintena de cañones, y se retiró de noche hacia San Nicolás. Urquiza avanzó hasta San José de Flores y no entró a la ciudad por la fuerza.\n\nCon la mediación de Francisco Solano López, el hijo del presidente paraguayo, y la renuncia del gobernador Alsina, el 11 de noviembre de 1859 se firma el pacto: Buenos Aires se declara parte integrante de la Confederación, podrá proponer reformas a la Constitución, y el gobierno federal toma su aduana garantizándole el presupuesto por cinco años.\n\nSu territorio no podrá dividirse sin el consentimiento de su Legislatura. Y un olvido perpetuo cubre todo lo que causó la desunión."
 gg_ba.8.f:0 "«Buenos Aires se declara parte integrante de la Confederación Argentina.»"
 gg_ba.8.a:0 "La Nación, otra vez de trece más una."
 gg_ba.8.a_tt:0 "Buenos Aires queda bajo el gobierno federal, con su aduana en manos de la Nación."

 gg_ba.10.t:0 "La ruptura"
 gg_ba.10.d:0 "El 22 de agosto de 1861 se rompen las relaciones entre Buenos Aires y el gobierno de Paraná. Lo firmado en San José de Flores no alcanzó: cada gobierno acusa al otro de violarlo, y en las provincias del interior los partidos ya se matan en su nombre.\n\nMitre quiere la guerra y cree que la puede ganar. Sumó mercenarios reclutados en Europa por Hilario Ascasubi y a buena parte de los ranqueles; sus tropas están mejor armadas y disciplinadas. Son quince mil cuatrocientos porteños contra diecisiete mil nacionales.\n\nLa marcha sería sobre Santa Fe, como dos años antes. Esta vez, dicen en la ciudad, no habrá Cepeda."
 gg_ba.10.d_apart:0 "El 22 de agosto de 1861 se rompen las relaciones entre Buenos Aires y el gobierno de Paraná. Ningún pacto ata a los dos gobiernos: cada uno acusa al otro de querer la guerra, y en las provincias del interior los partidos ya se matan en su nombre.\n\nMitre quiere la guerra y cree que la puede ganar. Sumó mercenarios reclutados en Europa por Hilario Ascasubi y a buena parte de los ranqueles; sus tropas están mejor armadas y disciplinadas. Son quince mil cuatrocientos porteños contra diecisiete mil nacionales.\n\nLa marcha sería sobre Santa Fe, camino de Paraná."
 gg_ba.10.f:0 "Dos años después de Cepeda, el mismo camino hacia el norte."
 gg_ba.10.a:0 "Marchar sobre Santa Fe."
 gg_ba.10.a_tt:0 "Guerra entre Buenos Aires y la Confederación, y de ella sale quién hace la Nación."
 gg_ba.10.b:0 "Ceder. La Nación se hace en Paraná."
 gg_ba.10.b_tt:0 "Buenos Aires entra al gobierno de la Confederación sin pelear."

 gg_ba.11.t:0 "Una sola República"
 gg_ba.11.d_ba:0 "En Pavón, la caballería nacional arrolló las dos alas porteñas mientras la infantería de Buenos Aires desalojaba a la nacional. Y entonces Urquiza, sin tocar su reserva entrerriana, dejó el campo, cruzó el Paraná y se volvió a su provincia. Mitre tardó días en convencerse de que había ganado.\n\nEl gobierno de Paraná se deshace solo. El 12 de diciembre de 1861 queda disuelto, y Mitre toma el mando como gobernador de Buenos Aires encargado del Poder Ejecutivo Nacional; el Congreso nuevo se reúne en Buenos Aires.\n\nLa Nación se organiza por fin, pero a la manera porteña. En las provincias, los que eran federales ayer ya empiezan a pagar la cuenta."
 gg_ba.11.d_conf:0 "La última guerra entre Buenos Aires y la Confederación terminó sin dejarle a la ciudad con qué seguir sola. Sus diputados ocuparán las bancas que les corresponden por su población, y su aduana es de la Nación.\n\nLa Constitución de 1853, con las reformas que Buenos Aires pidió, rige en las catorce provincias. La ciudad conserva sus instituciones y su Legislatura; lo que pierde es la pretensión de ser un Estado aparte.\n\nLos porteños que soñaban con la independencia se callan o se embarcan. Los demás empiezan a buscar su lugar en el gobierno de todos."
 gg_ba.11.f:0 "Una Nación, un gobierno."
 gg_ba.11.a:0 "Que se organice la República."
 gg_ba.11.a_tt:0 "Buenos Aires y la Confederación se vuelven un solo país."
 gg_ba.11.a_tt_players:0 "@information! Ninguno de los dos gobiernos desaparece: el que perdió la última guerra queda #N provincia del Pacto#! bajo el que la ganó, con su gobernante y su capital."

 gg_ba.12.t:0 "Buenos Aires sigue aparte"
 gg_ba.12.d:0 "La guerra terminó y la cuestión quedó donde estaba. Buenos Aires conserva su puerto, su aduana y su gobierno; la Confederación, sus trece provincias y su capital en Paraná.\n\nLos dos gobiernos cuentan los muertos, pagan las deudas de la campaña y se echan la culpa en los diarios. En los puertos, los comerciantes vuelven a cargar como si nada.\n\nNadie cree que esto sea el final. Solo es el final de esta guerra."
 gg_ba.12.f:0 "Dos gobiernos, y la misma pregunta de siempre."
 gg_ba.12.a:0 "Hasta la próxima."

 gg_ba.13.t:0 "El otro gobierno"
 gg_ba.13.d:0 "El gobierno al que servías deja de existir: sus provincias, sus tropas y sus hombres pasan a la República que sale de esta guerra.\n\nQueda un solo gobierno para la Nación entera, y es ese el que ahora hay que conducir.\n\nLo que se perdió en el campo se puede ganar en el gabinete."
 gg_ba.13.f:0 "Se pierde una capital; la Nación sigue."
 gg_ba.13.a:0 "Seguir desde el gobierno que queda."

 # 24/9/2026 (Juan): con dos gobiernos, la Buenos Aires de Rosas y no la de Alsina
 gg_ba.5.d_rosas:0 "A fines de 1854 los dos gobiernos estuvieron a un paso de la guerra. La evitaron los comerciantes de los dos puertos, que cargan en Buenos Aires y en Rosario y no quieren pagar dos veces la misma carga.\n\nEl 8 de enero de 1855, en Paraná, se firma un tratado de convivencia. Buenos Aires y la Confederación se aliarán contra un ataque de afuera y contra los malones; los buques mercantes de los dos usarán la bandera nacional, y no habrá aduanas entre ellos.\n\nNadie cree que dure mucho: en Buenos Aires sigue mandando el mismo partido contra el que Urquiza se pronunció. Pero por ahora los barcos cargan en los dos puertos sin pagar dos veces."
 gg_ba.7.d_rosas:0 "El 20 de mayo de 1859 el Congreso reunido en Paraná, «capital provisoria de la Confederación Argentina», autoriza al Presidente «para resolver la cuestión de integridad nacional respecto de la provincia disidente de Buenos Aires, por medio de negociaciones pacíficas o de la guerra, según lo aconsejaren las circunstancias».\n\nLa ley le permite movilizar las guardias nacionales, aumentar el ejército de línea y formar una armada. El ministro Derqui lo dijo en la Cámara sin rodeos: se trata de «concluir con este estado de cosas por la razón o la fuerza».\n\nEn Buenos Aires la ley se lee como una declaración de guerra. El gobierno de la ciudad llama a las milicias de la campaña y a los regimientos de la frontera, los mismos que le dieron sus hombres al Pacto durante veinte años."
 gg_ba.8.d_rosas:0 "En la cañada de Cepeda la caballería de la Confederación decidió la batalla, y el ejército de Buenos Aires se retiró de noche. Urquiza avanzó hasta San José de Flores y no entró a la ciudad por la fuerza.\n\nEl 11 de noviembre de 1859 se firma el pacto: Buenos Aires se declara parte integrante de la Confederación, y el gobierno federal toma su aduana garantizándole a la provincia el presupuesto por cinco años. El gobierno que durante veinte años habló por todas las provincias pasa a ser uno entre catorce.\n\nSu territorio no podrá dividirse sin el consentimiento de su Legislatura. Y un olvido perpetuo cubre todo lo que causó la desunión."
 gg_ba.10.d_rosas:0 "El 22 de agosto de 1861 se rompen las relaciones entre Buenos Aires y el gobierno de Paraná. Lo firmado en San José de Flores no alcanzó: cada gobierno acusa al otro de violarlo, y en las provincias del interior los partidos ya se matan en su nombre.\n\nEn Buenos Aires los federales de la ciudad quieren recuperar lo que perdieron en Cepeda: la aduana y la voz de la provincia. Las milicias de la campaña y los regimientos de la frontera vuelven a estar bajo las armas.\n\nLa marcha sería sobre Santa Fe, como dos años antes. Esta vez, dicen en la ciudad, no habrá Cepeda."
 gg_ba.10.d_apart_rosas:0 "El 22 de agosto de 1861 se rompen las relaciones entre Buenos Aires y el gobierno de Paraná. Ningún pacto ata a los dos gobiernos: cada uno acusa al otro de querer la guerra, y en las provincias del interior los partidos ya se matan en su nombre.\n\nEn Buenos Aires el gobierno de la ciudad cree que la puede ganar: tiene el puerto, la aduana y el crédito que a la Confederación le faltan. Las milicias de la campaña y los regimientos de la frontera vuelven a estar bajo las armas.\n\nLa marcha sería sobre Santa Fe, camino de Paraná."
 gg_ba.11.d_ba_rosas:0 "La última guerra entre Buenos Aires y la Confederación la ganó la ciudad. El gobierno de Paraná se deshace solo: sus ministros se dispersan, y las provincias vuelven a mandar sus pliegos a Buenos Aires.\n\nLa Nación se rehace como estaba antes del Pronunciamiento, con Buenos Aires a la cabeza y sin una constitución que la ate. Las provincias conservan sus gobernadores; lo que pierden es el gobierno propio que tuvieron en Paraná.\n\nEn Entre Ríos y en Corrientes nadie olvida lo que costó. Los que se pronunciaron en 1851 vuelven a delegar lo que habían reasumido."
 gg_ba.11.d_conf_rosas:0 "La última guerra entre Buenos Aires y la Confederación terminó sin dejarle a la ciudad con qué seguir sola. Sus diputados ocuparán las bancas que les corresponden por su población, y su aduana es de la Nación.\n\nLa ciudad conserva sus instituciones y su Legislatura. Lo que pierde es el gobierno que durante veinte años habló por todas las provincias, y la suma del poder público que lo sostuvo.\n\nLos federales porteños que soñaban con volver a mandar se callan o se embarcan. Los demás empiezan a buscar su lugar en el gobierno de todos."
