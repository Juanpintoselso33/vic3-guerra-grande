l_spanish:

 gg_phase1.9.t:0 "Oribe se va igual"
 gg_phase1.9.d:0 "Resistimos más de lo que nadie esperaba, y no alcanzó. Rivera es dueño de la campaña, el río es de otros y la capital está sola.\n\nEl presidente no va a firmar una renuncia. Le va a presentar a la Asamblea una «resignación» y va a pedir una «licencia temporal»: dos veces evita la palabra, para que quede escrito que sigue siendo el presidente legal y que se va por una fuerza que no depende de él. En Buenos Aires, Rosas lo va a recibir como presidente constitucional.\n\nLo que se ganó resistiendo es cómo se va: con cuánta gente, y con qué garantías para los que se quedan."
 gg_phase1.9.f:0 "Una resignación, no una renuncia."
 gg_phase1.9.a:0 "Salir con los que quieran seguirlo."
 gg_phase1.9.b:0 "Negociar la salida y una amnistía para los que se quedan."
 gg_phase1.1.t:0 "La guerra a Rosas"
 gg_phase1.1.d:0 "Oribe se fue el 29 de octubre en un barco británico, con trescientos soldados y colaboradores, y en Buenos Aires Rosas lo recibió como presidente constitucional. Ahora le ofrece el mando de los ejércitos de la Confederación.\n\nDe este lado, los emigrados unitarios le piden a Rivera que termine lo que empezó, y el gobernador de Corrientes, Genaro Berón de Astrada, ofrece un tratado contra Rosas: Corrientes tiene puertos sobre el Paraná y quiere comerciar con los barcos europeos sin pasar por Buenos Aires. Francia, que bloquea Buenos Aires desde el año pasado, empuja en la misma dirección. Lavalle, en cambio, todavía no quiere saber nada con una guerra hecha del brazo de los franceses.\n\nDeclararle la guerra al Restaurador es invitarlo a cruzar el río."
 gg_phase1.1.f:0 "«No al benemérito pueblo argentino sino que al tirano del pueblo inmortal de Sud América.»"
 gg_phase1.1.a:0 "La guerra, a Rosas."
 gg_phase1.1.b:0 "El tratado con Corrientes, y nada más."
 gg_phase1.1.c:0 "La República no entra en la guerra de otros."
 gg_phase1.2.t:0 "Echagüe cruza el Uruguay"
 gg_phase1.2.d:0 "El 21 de marzo Echagüe deshizo a Berón de Astrada en Pago Largo. Hubo degüello de heridos y de prisioneros, y el propio gobernador de Corrientes quedó en el campo. Ahora Echagüe y Juan Antonio Lavalleja cruzaron el Uruguay por Salto con un ejército que duplica al nuestro.\n\nRivera lo vio venir y ya tiene caballería sobre el Queguay. Su plan es el que sabe hacer: hostigarlos desde que pisen la costa, saltar del Queguay al Negro y del Negro al Santa Lucía, cubrirse detrás de ese río hasta que lleguen la infantería y la artillería de Montevideo, y dejar que el hambre haga el resto. Un ejército así necesita ganado, y para buscarlo tiene que partirse.\n\nO se puede salir a buscarlos ahora, antes de que se instalen."
 gg_phase1.2.f:0 "Una guerra de caballos antes que de batallas."
 gg_phase1.2.a:0 "Guerra de recursos, detrás del Santa Lucía."
 gg_phase1.2.b:0 "Salir a buscarlos ya."
 gg_phase1.3.t:0 "Cagancha"
 gg_phase1.3.d:0 "Salió bien. Echagüe tuvo que partir su ejército para buscar ganado: Anacleto Medina alcanzó a Manuel Lavalleja en las puntas del arroyo Arias, y el coronel Fortunato Silva deshizo a Leonardo Olivera en San Carlos el 17 de octubre. Con la infantería y la artillería ya incorporadas, Rivera dejó la barrera del Santa Lucía, fue a buscarlo, y en Cagancha tres mil hombres batieron a seis mil.\n\nAhora los unitarios quieren más. Que el ejército cruce a Entre Ríos y lleve la guerra al territorio de la Confederación, ahora que Echagüe se retira deshecho. Lavalle ya está en Corrientes, a las órdenes del gobernador Pedro Ferré.\n\nLa República se defendió. Lo que se decide es si además ataca."
 gg_phase1.3.f:0 "En los campos de Cagancha."
 gg_phase1.3.a:0 "Cruzar a Entre Ríos."
 gg_phase1.3.b:0 "La República ya se defendió. Quedarse."
 gg_phase1.4.t:0 "Lavalle"
 gg_phase1.4.d:0 "Juan Lavalle vivió estos años en Montevideo sin querer entrar en una guerra que se hacía del brazo de Francia. Cambió de idea. Desembarcó en Entre Ríos con los emigrados, firmó una proclama adhiriendo al federalismo que nadie tomó en serio, y pasó a Corrientes a ponerse a las órdenes del gobernador Pedro Ferré.\n\nAhora pide lo que no tiene: barcos, hombres y un puerto donde armarlos. Los barcos pueden ser franceses; los hombres y el puerto tienen que ser nuestros. En Montevideo, los emigrados repiten que «es acción santa matar a Rosas» desde que en junio fracasó el atentado en Buenos Aires y fusilaron al coronel Ramón Maza.\n\nAyudar a Lavalle es meter a la República en la guerra civil argentina hasta el cuello."
 gg_phase1.4.f:0 "Traen su pleito adentro del nuestro."
 gg_phase1.4.a:0 "Barcos, hombres y puerto para Lavalle."
 gg_phase1.4.b:0 "Que la guerra de los unitarios la paguen los unitarios."
 gg_phase1.5.t:0 "Francia se va"
 gg_phase1.5.d:0 "El 29 de octubre el almirante Mackau y el ministro Felipe Arana firmaron la paz entre Francia y la Confederación. Francia levanta el bloqueo de Buenos Aires y cobra lo que vino a buscar: Buenos Aires reconoce las indemnizaciones de los franceses. Para los que pelearon contra Rosas con su ayuda, la amnistía de la convención no alcanza a los generales ni a los jefes.\n\nLa noticia llega en el peor momento. Lavalle desembarcó en San Pedro en agosto con cuatro mil correntinos en barcos franceses, esperó que Buenos Aires se levantara y encontró hostilidad e indiferencia. El 7 de setiembre ordenó la retirada, y los emigrados de Montevideo ya lo llaman traidor.\n\nLa República le declaró la guerra a Rosas con Francia detrás. Hay que buscar otro apoyo antes de que el Restaurador lo note."
 gg_phase1.5.d_neutral:0 "El 29 de octubre el almirante Mackau y el ministro Felipe Arana firmaron la paz entre Francia y la Confederación. Francia levanta el bloqueo de Buenos Aires y cobra lo que vino a buscar: Buenos Aires reconoce las indemnizaciones de los franceses. Para los que pelearon contra Rosas con su ayuda, la amnistía de la convención no alcanza a los generales ni a los jefes.\n\nLa noticia llega en el peor momento. Lavalle desembarcó en San Pedro en agosto con cuatro mil correntinos en barcos franceses, esperó que Buenos Aires se levantara y encontró hostilidad e indiferencia. El 7 de setiembre ordenó la retirada, y los emigrados de Montevideo ya lo llaman traidor.\n\nLa República se quedó afuera de la guerra de los otros, pero Francia era el único contrapeso de Rosas en el Plata, y se va. Hay que buscar otro apoyo antes de que el Restaurador lo note."
 gg_phase1.5.f:0 "«Un golpe de muerte para la causa antirrosista.»"
 gg_phase1.5.a:0 "Buscar a Gran Bretaña."
 gg_phase1.5.b:0 "Apoyarse en los unitarios y en Corrientes."
 gg_phase1.5.c:0 "Pedirle al Brasil, aunque cobre en frontera."
 gg_phase1.6.t:0 "Noticias de Famaillá"
 gg_phase1.6.d:0 "Las noticias del norte llegan todas juntas. Oribe, al mando del ejército de la Confederación, deshizo a Lavalle en Quebracho Herrado en noviembre del año pasado y lo volvió a deshacer en Famaillá el 19 de setiembre. Después de Famaillá hubo fusilamientos y degüellos de prisioneros. Oribe le escribió a Rosas que había «mandado cortar la cabeza» del «salvaje unitario Avellaneda», y que la cabeza «será colocada a la expectación de los habitantes en la plaza pública de la ciudad de Tucumán».\n\nLavalle murió el 9 de octubre en Jujuy, de un balazo en la garganta, en una casa donde había entrado a dormir con una escolta de ocho hombres. Los suyos se llevaron el cuerpo hacia Bolivia para que Oribe no lo tuviera.\n\nLa prensa de Montevideo tiene material para toda una campaña, y el hombre del que habla va a volver a este lado del río."
 gg_phase1.6.f:0 "Un nombre también es un arma."
 gg_phase1.6.a:0 "Que la prensa lo llame por su nombre: degollador."
 gg_phase1.6.b:0 "No tocar el tema."
 gg_phase1.7.t:0 "El Uruguay mayor"
 gg_phase1.7.d:0 "El 28 de noviembre pasado José María Paz, el Manco, deshizo a Echagüe en Caaguazú, y Entre Ríos quedó con un gobernador nuevo, Justo José de Urquiza. Paz se nombró a sí mismo gobernador de Entre Ríos, y en febrero los representantes de Paz, de Pedro Ferré, de Juan Pablo López y de Rivera acordaron seguir la guerra con un objetivo preciso: un Estado nuevo con Entre Ríos, Corrientes, Santa Fe y la Banda Oriental. Bento Gonçalves, en secreto, sumaría Río Grande.\n\nHoy, en Paysandú, los jefes de la alianza le ofrecen a Rivera el mando supremo de los ejércitos. Paz no lo toma bien. Nadie en Entre Ríos lo reconoce como gobernador, y el almirante Brown ya barrió del río la flotilla de Garibaldi.\n\nMandar la coalición es quedar a cargo de todo lo que salga mal."
 gg_phase1.7.f:0 "Un país del tamaño de la ambición de un caudillo."
 gg_phase1.7.a:0 "Aceptar el mando supremo."
 gg_phase1.7.b:0 "La República no se agranda con tierra ajena."
 gg_phase1.8.t:0 "Oribe desvalido"
 gg_phase1.8.d:0 "Un hombre de confianza del ministro británico Mandeville llega de Buenos Aires con una noticia que parece un regalo. Oribe vuelve de Jujuy con el ejército gastado: sin caballos y con pocas armas, ya en Entre Ríos, al alcance de la mano. Mandeville se lo oyó a Rosas en persona, que lo dijo como quien se lamenta: «Si el Pardejón supiera aprovecharse...».\n\nMandeville se tiene por amigo del Restaurador.\n\nRivera tiene el mando de la coalición y un ejército grande. Puede cruzar el Uruguay y caerle a Oribe antes de que se rehaga, o esperarlo de este lado, en la costa, donde el que tiene que cruzar el río es el otro."
 gg_phase1.8.f:0 "«Si el Pardejón supiera aprovecharse...»"
 gg_phase1.8.a:0 "Cruzar y sorprenderlo."
 gg_phase1.8.b:0 "Esperarlo en la costa."
 gg_phase1_cagancha_lost:0 "Derrota ante Echagüe"
 gg_phase1.2.d_small:0 "El 21 de marzo Echagüe deshizo a Berón de Astrada en Pago Largo. Hubo degüello de heridos y de prisioneros, y el propio gobernador de Corrientes quedó en el campo. Ahora Echagüe y Juan Antonio Lavalleja cruzaron el Uruguay por Salto.\n\nVienen con menos de lo que Rosas habría mandado contra una declaración de guerra: la República firmó el tratado con Corrientes, pero no se la declaró. Aun así son más que nosotros. Rivera ya tiene caballería sobre el Queguay y sabe lo que va a hacer: hostigarlos, cubrirse detrás del Santa Lucía hasta que llegue la infantería de Montevideo, y dejar que el hambre los obligue a partirse.\n\nO se puede salir a buscarlos ahora, antes de que se instalen."
 gg_phase1.2.a_tt:0 "@information! Rivera espera la infantería de Montevideo y recibe a Echagüe con el ejército completo."
 gg_phase1.2.b_tt:0 "@information! Rivera marcha sin infantería: mitad y mitad entre una victoria temprana y una derrota que vale #P +2#! para los #blue_value blancos#! y tres años de desorden."
 gg_phase1.3.a_tt:0 "@information! El ejército queda expuesto del otro lado del río: una derrota en Entre Ríos valdría #P +1#! para los #blue_value blancos#! en Arroyo Grande."
 gg_phase1.7.a_tt:0 "@information! Rivera pasa a mandar la coalición del Uruguay mayor; una derrota del otro lado valdría #P +1#! para los #blue_value blancos#! en Arroyo Grande."
 gg_phase1.1.b_tt:0 "@information! Al no declararle la guerra a Rosas, Rosas se ve obligado a mandar un ejército menor; los #R colorados#! conservan una ventaja de #P +1#! frente a él."
 gg_phase1.1.c_tt:0 "@information! La República evita por ahora una invasión, pero Rosas sigue preparando la vuelta de Oribe; la disputa pasa al otro lado del río y la unidad del país se debilita antes."
 gg_phase1.1.c_calendar_tt:0 "@warning! La disputa pasa a la otra orilla sin la República: sin coalición para un #b Uruguay mayor#!, y la división del país se adelanta."
 gg_phase1.8.a_tt:0 "@information! Rivera cruza el Uruguay y apuesta el ejército entero a alcanzar a Oribe; la división de la República se acerca."
 gg_phase1.8.b_tt:0 "@information! El ejército #R colorado#! queda entero de este lado; Oribe conserva la iniciativa, pero la división de la República se posterga."
 gg_phase1.9.b_tt:0 "@information! Rivera decreta «perpetuo y absoluto olvido de opiniones anteriores»: los blancos que se quedan no son perseguidos, y la paz interior le sirve a su gobierno."
