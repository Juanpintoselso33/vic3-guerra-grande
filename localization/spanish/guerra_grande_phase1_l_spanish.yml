l_spanish:

 gg_phase1.9.t:0 "Oribe se va igual"
 gg_phase1.9.d:0 "Se resistió a firmar la renuncia, se sostuvo unos meses más, y no alcanzó: con la flotilla desarmada, Martín García en manos francesas y Rivera dueño de la campaña, Manuel Oribe deja el gobierno. Lo que se ganó resistiendo es cómo se va."
 gg_phase1.9.f:0 "Una resignación, no una renuncia."
 gg_phase1.9.a:0 "Que se vaya con su ejército."
 gg_phase1.9.b:0 "Negociar la salida, y la amnistía."
 gg_phase1.1.t:0 "La guerra a Rosas"
 gg_phase1.1.d:0 "Rivera es presidente, los emigrados unitarios le piden que termine lo que empezó, y el gobernador de Corrientes, Berón de Astrada, ofrece un tratado contra Rosas. Francia empuja. Declararle la guerra al Restaurador es invitarlo a cruzar el río."
 gg_phase1.1.f:0 "«No al benemérito pueblo argentino, sino al tirano.»"
 gg_phase1.1.a:0 "La guerra, a Rosas."
 gg_phase1.1.b:0 "El tratado con Corrientes, y nada más."
 gg_phase1.1.c:0 "La República no entra en la guerra de otros."
 gg_phase1.2.t:0 "Echagüe cruza el Uruguay"
 gg_phase1.2.d:0 "Después de Pago Largo, Pascual Echagüe y Juan Antonio Lavalleja cruzan el río por Salto con un ejército que duplica al nuestro. Rivera puede hacer lo que sabe hacer, retirarse, cortarles el ganado y esperar la infantería de Montevideo detrás del Santa Lucía, o salir a buscarlos ahora."
 gg_phase1.2.f:0 "Una guerra de caballos antes que de batallas."
 gg_phase1.2.a:0 "Guerra de recursos, detrás del Santa Lucía."
 gg_phase1.2.b:0 "Salir a buscarlos ya."
 gg_phase1.3.t:0 "Cagancha"
 gg_phase1.3.d:0 "Con la infantería y la artillería llegadas de Montevideo, Rivera deja la barrera del Santa Lucía y bate a Echagüe en Cagancha. Los unitarios quieren más: que cruce a Entre Ríos y lleve la guerra a la Confederación."
 gg_phase1.3.f:0 "29 de diciembre de 1839."
 gg_phase1.3.a:0 "Cruzar a Entre Ríos."
 gg_phase1.3.b:0 "La República ya se defendió. Quedarse."
 gg_phase1.4.t:0 "Lavalle"
 gg_phase1.4.d:0 "Juan Lavalle, que hasta ahora se negó a entrar en una guerra con Francia de por medio, se suma a la lucha contra Rosas y necesita barcos, hombres y un puerto. Ayudarlo es meter a la República en la guerra civil argentina hasta el cuello."
 gg_phase1.4.f:0 "Traen su pleito adentro del nuestro."
 gg_phase1.4.a:0 "Barcos, hombres y puerto para Lavalle."
 gg_phase1.4.b:0 "Que la guerra de los unitarios la paguen los unitarios."
 gg_phase1.5.t:0 "Francia se va"
 gg_phase1.5.d:0 "El 29 de octubre el almirante Mackau y el ministro Arana firman la paz: Francia levanta el bloqueo de Buenos Aires y deja solos a los que peleaban contra Rosas con su ayuda. Hay que buscar otro apoyo antes de que el Restaurador lo note."
 gg_phase1.5.f:0 "Un golpe de muerte para la causa antirrosista."
 gg_phase1.5.a:0 "Buscar a Gran Bretaña."
 gg_phase1.5.b:0 "Apoyarse en los unitarios y en Corrientes."
 gg_phase1.5.c:0 "Pedirle al Brasil, aunque cobre en frontera."
 gg_phase1.6.t:0 "Noticias de Famaillá"
 gg_phase1.6.d:0 "Oribe, al mando de las tropas de la Confederación, deshizo a Lavalle en Quebracho Herrado y en Famaillá, y llegan historias de prisioneros degollados. Lavalle murió en Jujuy. La prensa de Montevideo tiene material para toda una campaña."
 gg_phase1.6.f:0 "Un nombre también es un arma."
 gg_phase1.6.a:0 "Que la prensa lo llame por su nombre: degollador."
 gg_phase1.6.b:0 "No tocar el tema."
 gg_phase1.7.t:0 "El Uruguay mayor"
 gg_phase1.7.d:0 "José María Paz, Pedro Ferré, Juan Pablo López, Bento Gonçalves y Rivera hablan de un Estado nuevo: Entre Ríos, Corrientes, Santa Fe, Río Grande y la Banda Oriental. En Paysandú le ofrecen el mando supremo a Rivera, y Paz, disgustado, se retira."
 gg_phase1.7.f:0 "Un país del tamaño de la ambición de un caudillo."
 gg_phase1.7.a:0 "Aceptar el mando supremo."
 gg_phase1.7.b:0 "La República no se agranda con tierra ajena."
 gg_phase1.8.t:0 "Oribe desvalido"
 gg_phase1.8.d:0 "Llega por el ministro británico Mandeville una noticia de Buenos Aires: Oribe vuelve de Jujuy sin caballos y con pocas armas, y está en Entre Ríos al alcance de la mano. Rivera puede cruzar el Uruguay y sorprenderlo, o esperarlo de este lado."
 gg_phase1.8.f:0 "«Si el Pardejón supiera aprovecharse...»"
 gg_phase1.8.a:0 "Cruzar y sorprenderlo."
 gg_phase1.8.b:0 "Esperarlo en la costa."
 gg_phase1_cagancha_lost:0 "Derrota ante Echagüe"
