l_spanish:
 # EN/ES: El Sitio Grande journal (22/9/2026 redesign) -- docs/guerra-grande-flujo/sitio-textos-mecanica.md
 gg_siege_ui_short:0 "El gobierno del Cerrito tiene la República entera menos la plaza; la plaza tiene la bahía, la aduana y sus murallas. Al sitiador le faltan cañones de brecha, y al sitiado, campaña."
 gg_siege_ui_sec_line:0 "Frente a la muralla"
 gg_siege_ui_leader_defender:0 "#R Defiende la plaza#!\n#b [Character.GetFullName]#!"
 gg_siege_ui_leader_besieger:0 "#blue_value Sitia la plaza#!\n#b [Character.GetFullName]#!"
 gg_siege_ui_sec_sides:0 "Lo que tiene cada lado"
 gg_siege_ui_col_plaza:0 "#R La plaza#!"
 gg_siege_ui_col_campo:0 "#blue_value El campo#!"
 gg_siege_ui_walls_tt:0 "Las murallas de Montevideo sostienen a la plaza desde la partición.\n#b Efectos#! (la Defensa): resistencia al bloqueo #P +100#!, riesgo de desgaste #P -25%#!, cansancio de guerra por bajas #P -25%#!.\nSus generales en el frente de Montevideo: defensa #P +75%#!, mientras la plaza sea de la Defensa."
 gg_siege_ui_guns_tt:0 "De veintitrés piezas en febrero de 1843 a cien en junio: la plaza triplicaba en artillería al sitiador.\n#b Efectos#! (Montevideo): resistencia de las fortificaciones al bombardeo #P +250#!."
 gg_siege_ui_port_tt:0 "La aduana que reconocen los extranjeros y la única bahía honda, y ni una vaca de este lado de la línea.\n#b Efectos#! (Montevideo): capacidad fiscal #P +60%#!, capacidad comercial #P +30#!, ventaja comercial #P +25%#!, atracción migratoria #P +50%#!, ganadería y agricultura #N -60%#!, conscripción #N -15%#!, adultos que trabajan #P +15%#!."
 gg_siege_ui_sea_tt:0 "Lo que la plaza no puede reclutar le llega por barco: hombres, plata y pólvora.\n#b Efectos#! (la Defensa): recuperación de las unidades #P +25%#!, recuperación de la moral #P +15%#!."
 gg_siege_ui_mortgaged_tt:0 "La renta de la aduana se vende por adelantado a la Sociedad Compradora de los Derechos de Aduana: plata hoy, y una deuda que sobrevive a la guerra.\n#b Efectos#! (la Defensa): acuñación #P +300#!, interés de los préstamos #N +50%#!, autoridad #N -40#!."
 gg_siege_ui_trading_def_tt:0 "Los dos gobiernos prohibieron comerciar con el enemigo, y los dos lo permiten con licencias: cada uno necesita lo que tiene el otro.\n#b Efectos#! (cada gobierno): acuñación #P +50#!, prestigio #N -5%#!, autoridad #N -20#!."
 gg_siege_ui_trading_cer_tt:0 "Los dos gobiernos prohibieron comerciar con el enemigo, y los dos lo permiten con licencias: cada uno necesita lo que tiene el otro.\n#b Efectos#! (cada gobierno): acuñación #P +50#!, prestigio #N -5%#!, autoridad #N -20#!."
 gg_siege_ui_cattle_tt:0 "La tregua de Howden deja entrar ganado a la plaza durante seis meses.\n#b Efectos#! (la Defensa): legitimidad #P +5#!, aprobación de la pequeña burguesía #P +3#!."
 gg_siege_ui_noguns_tt:0 "Treinta y cinco piezas frente a Montevideo, y ninguna capaz de abrir un muro.\n#b Efectos#! (los generales del Cerrito en el frente de Montevideo): ataque #N -50%#!, velocidad de ocupación #N -50%#!, provincias capturadas #N -50%#!. Lejos de la plaza, el Cerrito pelea sin ese lastre."
 gg_siege_ui_countryside_tt:0 "El ganado, los cueros, los saladeros y los jinetes están de este lado; los puertos son playas abiertas, y su carga, contrabando para la plaza.\n#b Efectos#! (San José, Maldonado, la Banda Oriental y Paysandú): capacidad fiscal #N -30%#!, capacidad comercial #N -20%#!, ventaja comercial #N -25%#!, rendimiento de los puertos #N -20%#!, resistencia al bloqueo #N -60#!, atracción migratoria #N -50%#!, ganadería y agricultura #P +30%#!, conscripción #P +25%#!."
 gg_siege_ui_buceo_tt:0 "El Buceo, habilitado como puerto por decreto del 10 de julio de 1843, con su aduana: poca renta, y ninguna deuda.\n#b Efectos#! (el Cerrito): acuñación #P +100#!, interés de los préstamos #P -25%#!, autoridad #P +40#!."
 gg_siege_ui_frontier_tt:0 "Con las escuadras de las potencias en el río, el comercio del campo sale por el norte: la Laguna Merín, el Yaguarón, Melo y el litoral del Uruguay.\n#b Efectos#! (la Banda Oriental y Paysandú, cinco años): capacidad comercial #P +25%#!, ventaja comercial #P +20%#!, ganadería #P +20%#!."
 gg_siege_ui_sec_forces:0 "Las fuerzas de cada lado"
 gg_siege_ui_italian_0:0 "#b Legión Italiana#!: #V sin formar#!"
 gg_siege_ui_italian_1:0 "#b Legión Italiana#!: #P formada#!"
 gg_siege_ui_italian_2:0 "#b Legión Italiana#!: #P reforzada#!"
 gg_siege_ui_italian_tt:0 "Los italianos de la ciudad. Formarla suma una formación nueva; Garibaldi llega como general si el gobierno la forma por decreto, o si ya se ha hecho un nombre.\n#b Efectos#! (la Defensa, al formarse; se desvanecen en diez años): defensa #P +10%#!, costo de los bienes militares #P -5%#!, aprobación de las Fuerzas Armadas #P +2#!.\nReforzarla cuesta #N 20.000#! y #N -5#! del sostén de Francia, y la renueva por cinco años."
 gg_siege_ui_french_0:0 "#b Legión Francesa#!: #V sin formar#!"
 gg_siege_ui_french_1:0 "#b Legión Francesa#!: #P formada#!"
 gg_siege_ui_french_2:0 "#b Legión Francesa#!: #P reforzada#!"
 gg_siege_ui_french_3:0 "#b Legión Francesa#!: #N la plaza no la aceptó#!"
 gg_siege_ui_french_tt:0 "Los franceses residentes, con Thiébaut. Se puede formar desde 1843, y trae tropas y a Thiébaut como general.\n#b Efectos#! (la Defensa, al formarse; se desvanecen en diez años): defensa #P +15%#!, costo de los bienes militares #P -10%#!, atracción migratoria #P +25%#!, aprobación de las Fuerzas Armadas #P +2#!.\nReforzarla cuesta #N 20.000#! y #N -5#! del sostén de Francia, y la renueva por cinco años."
 gg_siege_ui_argentine_0:0 "#b Legión Argentina#!: #V sin formar#!"
 gg_siege_ui_argentine_1:0 "#b Legión Argentina#!: #P formada#!"
 gg_siege_ui_argentine_tt:0 "Los emigrados que huyeron de Rosas, con las armas de la plaza. Formarla cuesta #N 10.000#! y enfría la relación con Buenos Aires (#N -30#!).\n#b Efectos#! (la Defensa, al formarse; se desvanecen en siete años): ataque #P +5%#!, aprobación de los intelectuales #P +2#!, prestigio #P +5%#!."
 gg_siege_ui_aux_0:0 "#b Batallones de Rosas#!: #V sin auxilio de Buenos Aires#!"
 gg_siege_ui_aux_1:0 "#b Batallones de Rosas#!: #P con auxilio de Buenos Aires#!"
 gg_siege_ui_aux_tt:0 "Las divisiones que Buenos Aires le presta al Cerrito, sin declararle la guerra a la República. Si vienen con el préstamo de Rosas, llegan además con plata y con otro sostén.\n#b Efectos#! (el Cerrito, diez años): ataque #P +10%#!, costo de los bienes militares #P -5%#!, acuñación #P +200#!."
 gg_siege_ui_basque_cer:0 "#b El batallón vasco#!: #P se pasó al Cerrito#!"
 gg_siege_ui_basque_tt:0 "El batallón vasco-navarro levantado en la plaza deserta al campo de Oribe: el Cerrito suma un batallón y a la Defensa le cuesta #N 10.000#!. Si la Legión Argentina está formada, llega a la plaza José María Paz como general.\n#b Efectos#! (la Defensa, al desertar; se desvanecen en cinco años): defensa #N -5%#!, autoridad #N -25#!, aprobación de las Fuerzas Armadas #N -2#!."
 gg_siege_ui_more:0 "El sitio, en detalle"
 gg_siege_ui_more_body:0 "#b Dos gobiernos, una línea#!\nEl Cerrito gobierna la República entera menos la plaza, desde el Cerrito de la Victoria, la Villa de la Restauración y la aduana del Buceo. La Defensa tiene la bahía, la aduana que reconocen los extranjeros y sus murallas, y nada de campaña. Cada lado tiene justo lo que al otro le falta.\n\n#b Por qué no cae la plaza#!\nAl sitiador le faltan cañones de brecha, y las murallas multiplican la defensa de la ciudad: un asalto frontal cuesta caro. El campo recluta y cría ganado; la plaza vive de la aduana, de la deuda y de lo que le llega por mar.\n\n#b Las legiones#!\nLa plaza está llena de extranjeros. Italianos, franceses, vascos y emigrados argentinos forman sus propios cuerpos; reforzar la italiana o la francesa cuesta plata y el favor de Francia. Del otro lado de la línea, los batallones de Rosas.\n\n#b Lo que se decide en otra parte#!\nEl río lo disputan Rosas y las escuadras de las potencias; la paz, los dos gobiernos y quienes los sostienen."
 gg_siege_ui_brie:0 "#b Cazadores Vascos#!: #P formados#!"
 gg_siege_ui_brie_tt:0 "Las compañías vascas se separan de la Legión Francesa y forman su propio regimiento, a las órdenes de Jean Baptiste Brie: la plaza suma un batallón."
 gg_siege_ui_allied:0 "#b Ejército Aliado#!: #P en la plaza#!"
 gg_siege_ui_allied_tt:0 "Con los tratados de 1851 con el Imperio del Brasil, la plaza recibe infantería y caballería.\n#b Efectos#! (la Defensa; se desvanecen en quince años): acuñación #P +400#!, prestigio #N -15%#!, autoridad #N -50#!. El Cerrito pierde #N 30#! de apoyo a la guerra."
