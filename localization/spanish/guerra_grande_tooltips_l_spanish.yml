 je_gg_siege:0 "El Sitio Grande"
 je_gg_siege_reason:0 "El 16 de febrero de 1843 el ejército de Oribe llegó frente a Montevideo, y el sitio duró ocho años y medio. El Cerrito tenía tres campamentos: el Cerrito de la Victoria, donde se organizaba la tropa; la Villa de la Restauración, sede del gobierno; y el puerto del Buceo, por donde salían los cueros. Adentro de los muros, la Defensa armó un ejército que mandaban José María Paz y Melchor Pacheco y Obes, y las colectividades francesa, española e italiana formaron legiones que, juntas, eran más que los soldados orientales.\n\nCada gobierno tiene justo lo que al otro le falta. Montevideo tiene la aduana reconocida, la bahía honda y las escuadras extranjeras que la mantienen abierta: plata, y ninguna campaña con qué alimentarse ni con qué levantar un ejército nacional. El Cerrito tiene el ganado, los cueros, los saladeros y los jinetes de la República entera, y desembarcaderos propios sobre el mismo río —pero son playas abiertas, su aduana no se la reconoce nadie, y todo lo que sale de ahí sale como contrabando—. Ninguno puede terminar con el otro, y por eso esto dura nueve años.\n\n#b La plaza y el río#!\n• @ships! Cada mes con el río cerrado y el bloqueo en pie, el cerco aprieta un poco más; cualquier mes en que la ciudad reciba por agua, se afloja otro tanto.\n• A los #V 24#! meses de aprieto la #R Defensa#! no tendrá con qué seguir y deberá negociar; desde 1851 le bastarán #V 12#!. Una tregua detiene el reloj.\n• Quien abre el río no está en el Plata: está en París y en Londres.\n• #blue_value Cerrito:#! #b cerrar el río#! pide dos cosas — la voluntad de Rosas en #V 40#! o más, y la escuadra de Brown en el agua. Si las escuadras europeas lo abren, el bloqueo se cae solo, y habrá que volver a ponerlo cuando se pueda.\n• #R Defensa:#! los franceses, los españoles y los italianos de la ciudad pueden tomar las armas. Cuesta plata, y en París no gusta que sus súbditos mueran en guerra ajena."
