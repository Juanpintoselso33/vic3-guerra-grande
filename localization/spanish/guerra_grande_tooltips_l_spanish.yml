 gg_oribe_exile_tt:0 "@warning! #b Manuel Oribe#! e #b Ignacio Oribe#! se van a Buenos Aires. #R Rivera#! gobierna hasta que la República se parta, aunque haya elecciones."
 gg_intro.1.t:0 "La Guerra Grande"
 gg_intro.1.d:0 "Esta partida sigue la historia del Uruguay entre 1836 y 1852. La República tiene un presidente, Manuel Oribe, y un jefe militar de la campaña, Fructuoso Rivera, que no se soportan. De esa pelea van a salir las divisas, blancos y colorados, y después dos gobiernos: la #R Defensa#! en Montevideo y el #blue_value Cerrito#! frente a la ciudad.\n\nEl journal #b La Guerra Grande#! lleva la cuenta. Cada decisión de estos años y, desde 1843, cada mes de sitio y cada golpe de la guerra suman puntaje para un bando. La barra muestra quién va adelante: con #V 10#! de ventaja, el otro bando tiene que negociar, y el que gana dicta la paz.\n\nEl segundo journal, #b La intervención extranjera#!, lleva la otra mitad del asunto: ninguno de los dos bandos puede sostener esta guerra solo. Rosas sostiene a los #blue_value blancos#!; Francia, Gran Bretaña y el Brasil miran a Montevideo. Mientras el mar esté abierto, la ciudad respira; si se cierra, el sitio manda.\n\nLas reglas completas están en el recuadro de cada journal."
 gg_intro.1.f:0 "Dos divisas, dos gobiernos, un solo país."
 gg_intro.1.a:0 "Abrir los dos journals."
 gg_intro.4.t:0 "El Sitio Grande"
 gg_intro.4.d:0 "El ejército de Oribe llegó frente a Montevideo, y la República tiene ahora dos gobiernos. La ciudad no se puede tomar por asalto: se rinde por hambre o no se rinde.\n\nEl journal #b El Sitio Grande#! lleva la cuenta del asedio. Cada mes con el bloqueo del #blue_value Cerrito#! puesto y el mar cerrado suma uno; cualquier otro mes resta uno. Con #V 24#! meses, la #R Defensa#! tiene que negociar. El Cerrito puede cerrar el río desde este journal; la Defensa puede armar a los extranjeros de la ciudad en legiones."
 gg_intro.4.f:0 "16 de febrero de 1843."
 gg_intro.4.a:0 "Abrir «El Sitio Grande»."
