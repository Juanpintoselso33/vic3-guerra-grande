 je_gg_patrons:0 "La intervención extranjera"
 je_gg_patrons_reason:0 "La Guerra Grande no se peleó solo entre orientales. [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] #b Rosas#! le dio a Oribe el mando del Ejército Unido de Vanguardia y lo financió hasta el final. [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b Francia#! bloqueó Buenos Aires entre 1838 y 1840 y en 1848 le pagaba a la Defensa un subsidio mensual. [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #b Gran Bretaña#! y Francia bloquearon los puertos de la Confederación de 1845 a 1850, dejando abierto solo el de Montevideo. [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b El Brasil#! prestó plata y en 1851 entró en la alianza. @gg_entre_rios_flag! #b Urquiza#!, gobernador de Entre Ríos, se pronunció contra Rosas el 1 de mayo de 1851.\n\n#b Cómo funciona#!\n• Cada apoyo va de #V 0#! a #V 100#! y lo mueven las decisiones: las opciones lo muestran con una flecha.\n• Rosas sostiene a los #blue_value blancos#!; Francia, Gran Bretaña y el Brasil, a los #R colorados#!. Urquiza cuenta para el bando al que se pase.\n• Si los apoyos de un bando suman menos de #V 40#!, ese bando pierde apoyo a la guerra todos los meses. Cada aliado manda plata según su apoyo.\n• @ships! #b El mar:#! con Francia y Gran Bretaña en #V 60#! o más, las escuadras abren el río, levantan el bloqueo del Cerrito y el asedio de Montevideo no avanza. Es la barra de este journal. Un #b bloqueo declarado con la escuadra de Brown en el agua#! le resta #V 15#!: alcanza para cerrar el río mientras las dos estaciones europeas no estén juntas en él.\n• @warning! En la paz, las opciones de un aliado solo aparecen si tiene apoyo, y un compromiso tomado con Rosas o con el Imperio recorta el menú de ese bando.\n• El botón #b Llamar a las escuadras#! (desde 1843) pide la intervención: sube a Francia y a Gran Bretaña, con un precio."
