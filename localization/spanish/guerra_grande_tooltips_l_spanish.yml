 gg_naval_anglo_french_station:0 "La estación anglo-francesa"
 gg_naval_anglo_french_station_desc:0 "Francia y Gran Bretaña sostienen el río: el puerto no se puede cerrar."
 gg_loan.1.a_tt2:0 "@information! Queda firmado el convenio francés; París le debe ahora a la #R Defensa#! lo que promete el papel."
 gg_loan.2.a_tt2:0 "@information! El Imperio queda comprometido por escrito, y se puede reclamar todo su peso."
 gg_loan.2.b_tt2:0 "@information! El Imperio queda comprometido sin figurar en el papel, y aun así se puede reclamar todo su peso."
 gg_loan.3.a_tt2:0 "@warning! La deuda del #blue_value Cerrito#! queda anotada en los libros y sobrevive a la guerra."
 gg_peace.6.a_tt2:0 "@information! Las potencias escriben el arreglo; sus condiciones gobiernan tanto el fin de la guerra como el orden que sigue."
 gg_powers.11.b_tt2:0 "@warning! Sin escuadra no hay bloqueo: Rosas pierde la batería de su orilla y #N no puede cerrar el río#! hasta que se la devuelvan."
 gg_powers.12.b_tt2:0 "@warning! Las bases Hood quedan rechazadas: la paz de las potencias no vuelve hasta que las potencias la traigan de nuevo."
 gg_powers.16.c_tt2:0 "@information! La misión queda trabada, no rota: se puede retomar más adelante."
 gg_powers.19.a_tt2:0 "@information! La misión le cuesta #N 10.000#! al tesoro. Tres veces de cada cuatro pasa inadvertida, y cuando Francia arregle con Rosas su apoyo a la Defensa caerá #N 10#! en vez de #N 20#!. Una de cada cuatro se descubre: el apoyo francés cae #N 10#! en el acto y la retirada no se suaviza."
 gg_powers.19.b_tt2:0 "@information! El Imperio queda comprometido, y se puede reclamar todo su peso."
 gg_powers.21.b_tt2:0 "@warning! La aduana sigue hipotecada después de la paz."
 gg_powers.26.a_tt2:0 "@information! Acusar a Rosas ante Europa endurece a los mediadores contra el #blue_value Cerrito#!."
 gg_rivera.1.a_tt2:0 "@information! Rivera conserva un ejército en la campaña y fuerza suficiente para disputarla."
 gg_rivera.1.b_tt2:0 "@information! Rivera queda afuera sin infantería; su próxima campaña descansa en sus propios jinetes."
 gg_rivera.2.a_tt2:0 "@warning! Rivera pierde el mando, pero conserva un partido fuera del gobierno."
 gg_rivera.2.b_tt2:0 "@information! Con armas brasileñas, Rivera vuelve a campaña y el Imperio queda adentro de la cuenta."
 gg_rivera.2.c_tt2:0 "@warning! Retenido en el Brasil, Rivera queda fuera de la guerra, y quienes lo entregaron se ganan su enemistad."
 gg_rivera.3.a_tt2:0 "@information! Rivera recupera el mando, y su gente recupera su lugar en el gobierno."
 gg_rivera.3.b_tt2:0 "@warning! Rivera sigue fuera del gobierno; su gente queda sin jefe en las disputas de la ciudad."
 gg_rivera.4.a_tt2:0 "@warning! Rivera queda desterrado en Río, aunque el gobierno conserva la facultad de llamarlo de vuelta."
 gg_rivera.4.b_tt2:0 "@information! Rivera queda en el gobierno; toda coalición nueva tendrá que contar con él desde adentro."
 gg_rivera.4.c_tt2:0 "@information! Las #b ocho condiciones#! de Rivera quedan sobre la mesa para cualquier arreglo."
 gg_rivera.5.a_tt2:0 "@information! Se manda la orden de regreso; el camino desde Río es largo y la salud de Rivera está quebrada."
 gg_rivera.5.b_tt2:0 "@information! Rivera queda en Río, lejos de los suyos y sin camino de vuelta."
 gg_rivera.7.a_tt2:0 "@warning! Urquiza gobierna la provincia en que se entra y lo toma como una ofensa: su apoyo #N -15#!. Los excesos de la campaña se pagan: siete veces de cada diez la guerra termina corrida #blue_value +1#! hacia los blancos; las otras tres, #R +2#! hacia los colorados."
 gg_rivera.7.c_tt2:0 "@information! Las #b ocho condiciones#! de Rivera quedan sobre la mesa para cualquier arreglo."
 gg_rivera.8.a_tt2:0 "@warning! #N Mitre deja el servicio de la Defensa#! y lleva los libros de Echeverría a Valparaíso."
 gg_rivera.8.b_tt2:0 "@information! #P Bartolomé Mitre entra como general#! y las baterías de la Defensa suman #P 2 unidades de artillería#! @battalions!; el desacuerdo con Rivera queda abierto."
 gg_rivera.8.c_tt2:0 "@information! #P Bartolomé Mitre entra como general en Corrientes#! y su ejército suma #P 1 unidad de artillería#! @battalions!."
 gg_argentina.22.a_tt:0 "@battalions! Se separan del resto del ejército #N 2 unidades de infantería#! y #N 2 unidades de artillería#! en dos formaciones reales sobre el Paraná."
 gg_argentina.22.b_tt:0 "@information! Los reclamos fluviales de #b Corrientes#! y #b Entre Ríos#! quedan contestados en el #b Pacto Federal#!. @money! Durante #V 10 años#!, ambas provincias ganan #P +10#! de capacidad comercial y #P +1#! intercambio semanal; Buenos Aires pierde #N 5%#! de acuñación durante #V 20 años#!."
 gg_argentina.22.c_tt:0 "@battalions! Una defensa limitada reúne #N 1 unidad de infantería#! y #N 1 unidad de artillería#!. @information! La vía de mediación de las potencias queda habilitada sin levantar el bloqueo."
 gg_argentina.23.a_tt:0 "@battalions! Las #N 2 unidades de infantería#! y #N 2 unidades de artillería#! permanecen asignadas al Paraná y fuera de otros frentes."
 gg_argentina.23.b_tt:0 "@battalions! La columna móvil —#P 1 unidad de infantería#! y #P 1 de artillería#!— queda movilizada para otro frente; la batería fija permanece en el río. @information! La vía de mediación queda habilitada."
 gg_argentina.24.a_tt:0 "@battalions! Las dos formaciones permanecen sobre el Paraná. @information! Buenos Aires conserva toda la fuerza material de su exigencia de soberanía fluvial."
 gg_argentina.24.b_tt:0 "@battalions! La columna móvil —#P 1 unidad de infantería#! y #P 1 de artillería#!— se moviliza y, si existe, se despliega al frente contra #b Corrientes#!. @warning! La exigencia fluvial pierde el respaldo de esa columna."
 gg_argentina.24.c_tt:0 "@battalions! La columna móvil —#P 1 unidad de infantería#! y #P 1 de artillería#!— se moviliza y, si existe, se despliega al frente contra #b Paraguay#!. @warning! La exigencia fluvial pierde el respaldo de esa columna."
 gg_argentina.25.a_tt:0 "@information! Buenos Aires acepta las bases. El #blue_value Cerrito#! recibe esta misma respuesta y, si la confirma, la propuesta pasa a la #R Defensa#!. #b La guerra no termina con esta firma.#!"
 gg_argentina.25.b_tt:0 "@warning! Buenos Aires rechaza esta vía. El #blue_value Cerrito#! recibe la misma respuesta y las operaciones continúan."
 gg_argentina.26.a_tt:0 "@information! Quedan contestados #P todos los pliegos pendientes#! del #b Pacto Federal#!; una provincia que ya retiró la delegación #N no vuelve a delegar#!. La #R Defensa#! recibe la misma noticia."
 gg_argentina.26.b_tt:0 "@information! Queda contestado #P un pliego pendiente#! del #b Pacto Federal#!, si lo hay; los demás conservan su estado. La #R Defensa#! recibe la misma noticia y el recorte porteño."
 gg_argentina.26.c_tt:0 "@information! La delegación y sus pliegos #V no cambian#!. La noticia llega igualmente a la #R Defensa#!, sin una publicación oficial porteña que discutir."
 gg_argentina.27.a_tt:0 "@battalions! La ofensiva contra #b Rosas#! suma #P +2#! en la balanza a favor de los #R colorados#!. @warning! Discutirle el testamento al Libertador genera #N radicales#! en la ciudad."
 gg_argentina.27.b_tt:0 "@battalions! Separar al Libertador del gobierno suma #P +1#! en la balanza a favor de los #R colorados#!, sin negar el testamento."
 gg_powers.18.a_tt:0 "@information! A los vascos se les retira el patrocinio: la Legión Francesa pierde su paga y sus privilegios, y los hombres que quedan pasan a ser tropa común."
 gg_powers.18.b_tt:0 "@information! A los italianos se les retira el patrocinio: la Legión Italiana pierde su paga y sus privilegios, y si Garibaldi la manda, se embarca; los hombres que quedan pasan a ser tropa común."
 gg_powers.18.c_tt:0 "@information! A las dos legiones se les retira el patrocinio: pierden su paga y sus privilegios, y si Garibaldi manda la italiana, se embarca; los hombres que quedan pasan a ser tropa común."
