 je_gg_patrons_status:0 "[GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] #b Rosas#!: #V [GetGlobalVariable('gg_patron_rosas').GetValue|v0]#!  (#blue_value blancos#!)\n[GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b Francia#!: #V [GetGlobalVariable('gg_patron_francia').GetValue|v0]#!  (#R colorados#!)\n[GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #b Gran Bretaña#!: #V [GetGlobalVariable('gg_patron_britania').GetValue|v0]#!  (#R colorados#!)\n[GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b Brasil#!: #V [GetGlobalVariable('gg_patron_brasil').GetValue|v0]#!  (#R colorados#!)\n@gg_entre_rios_flag! #b Urquiza#!: #V [GetGlobalVariable('gg_patron_urquiza').GetValue|v0]#!  (elige bando; con #V 60#! se pronuncia solo)"
