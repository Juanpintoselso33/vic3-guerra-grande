 je_gg_factions:0 "Doctores y caudillos"
 je_gg_factions_reason:0 "Adentro de cada bando se pelea quién manda: los doctores de la ciudad o los caudillos de la campaña."
 je_gg_factions_desc:0 "La puja no fue solo entre blancos y colorados. En los dos bandos había doctores y caudillos: en el Cerrito, Oribe contra Berro y Acevedo; en la Defensa, Rivera y Flores contra Herrera y Obes y Suárez. Cada balanza va de −100 (mandan los caudillos) a 100 (mandan los doctores), y la mueven las decisiones.\n\n#b Lo que hace:#! con los caudillos fuertes (−30 o menos), ese gobierno aguanta más la guerra. Con los doctores fuertes (30 o más), las ofertas de paz de las potencias le cuestan menos y la posguerra es más civil."
 je_gg_factions_status:0 "#blue_value Blancos#! #V [GetGlobalVariable('gg_cerrito_balance').GetValue|v0]#!  ·  #R Colorados#! #V [GetGlobalVariable('gg_defensa_balance').GetValue|v0]#!   (−100 caudillos · 100 doctores)"
 gg_cerrito_balance_bar:0 "Los blancos"
 gg_defensa_balance_bar:0 "Los colorados"
 gg_balance_bar_doctores_desc:0 "@intelligentsia! Doctores"
 gg_balance_bar_caudillos_desc:0 "Caudillos @armed_forces!"
