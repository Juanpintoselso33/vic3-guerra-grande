 je_gg_patrons:0 "La intervención extranjera"
 je_gg_patrons_reason:0 "La Guerra Grande no se peleó solo entre orientales. [GetGlobalVariable('gg_flag_arg').GetCountry.GetFlagTextIcon] #b Rosas#! le dio a Oribe el mando del Ejército Unido de Vanguardia y lo financió hasta el final. [GetGlobalVariable('gg_flag_fra').GetCountry.GetFlagTextIcon] #b Francia#! bloqueó Buenos Aires entre 1838 y 1840 y en 1848 le pagaba a la Defensa un subsidio mensual. [GetGlobalVariable('gg_flag_gbr').GetCountry.GetFlagTextIcon] #b Gran Bretaña#! y Francia bloquearon los puertos de la Confederación de 1845 a 1850, dejando abierto solo el de Montevideo. [GetGlobalVariable('gg_flag_brz').GetCountry.GetFlagTextIcon] #b El Brasil#! prestó plata y en 1851 entró en la alianza. @gg_entre_rios_flag! #b Urquiza#!, gobernador de Entre Ríos, se pronunció contra Rosas el 1 de mayo de 1851.\n\n#b Lo que se cuenta en las cancillerías#!\n• La voluntad de cada padrino se mide de #V 0#! a #V 100#! y cambia con lo que usted haga: cada decisión avisa cuánto le gana o cuánto le cuesta.\n• Rosas sostiene a los #blue_value blancos#!. Francia, Gran Bretaña y el Imperio miran a los #R colorados#!. Urquiza pesa del lado en el que esté.\n• El bando cuyos padrinos no lleguen juntos a #V 40#! se queda sin con qué, y pierde el aguante mes a mes. Lo que cada aliado manda en plata va en proporción a las ganas que tenga.\n• @ships! #b El río:#! con Francia y Gran Bretaña en #V 60#! o más, las escuadras lo abren, levantan el bloqueo y el cerco deja de apretar. Un bloqueo declarado con la escuadra de Brown en el agua les resta #V 15#!: alcanza para cerrarlo mientras las dos estaciones europeas no estén juntas en él.\n• @warning! A la hora de la paz, un aliado sin ganas no ofrece nada, y un compromiso ya tomado con Rosas o con el Imperio le cierra puertas a ese bando.\n• #b Llamar a las escuadras#!, desde 1843, es pedirle a París y a Londres que intervengan. Vienen — y pasan la cuenta."
