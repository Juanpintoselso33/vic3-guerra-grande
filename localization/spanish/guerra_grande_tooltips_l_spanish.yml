 je_gg_siege:0 "El Sitio Grande"
 je_gg_siege_reason:0 "El 16 de febrero de 1843 el ejército de Oribe llegó frente a Montevideo, y el sitio duró ocho años y medio. El Cerrito tenía tres campamentos: el Cerrito de la Victoria, donde se organizaba la tropa; la Villa de la Restauración, sede del gobierno; y el puerto del Buceo, por donde salían los cueros. Adentro de los muros, la Defensa armó un ejército que mandaban José María Paz y Melchor Pacheco y Obes, y las colectividades francesa, española e italiana formaron legiones que, juntas, eran más que los soldados orientales.\n\n#b Cómo funciona#!\n• @ships! #b El asedio:#! cada mes con el bloqueo del Cerrito puesto y el mar cerrado suma uno; cualquier otro mes resta uno. La barra lo muestra.\n• Con #V 24#! meses, la Defensa tiene que negociar (desde 1851, con #V 12#!). La tregua lo congela.\n• El mar lo abren Francia y Gran Bretaña: se sigue en #b La intervención extranjera#!.\n• #blue_value Cerrito:#! el botón #b Cerrar el río#! cierra el puerto (necesita a Rosas en #V 40#! o más y la escuadra de Brown). Si el mar se abre, el bloqueo se levanta y se puede volver a pedir cuando se cierre.\n• #R Defensa:#! los botones de las #b legiones#! arman a los extranjeros de la ciudad, con plata y con costo en apoyo francés."
 je_gg_siege_desc:0 "El 16 de febrero de 1843 el ejército de Oribe llegó frente a Montevideo, y el sitio duró ocho años y medio. El Cerrito tenía tres campamentos: el Cerrito de la Victoria, donde se organizaba la tropa; la Villa de la Restauración, sede del gobierno; y el puerto del Buceo, por donde salían los cueros. Adentro de los muros, la Defensa armó un ejército que mandaban José María Paz y Melchor Pacheco y Obes, y las colectividades francesa, española e italiana formaron legiones que, juntas, eran más que los soldados orientales.\n\n#b Cómo funciona#!\n• @ships! #b El asedio:#! cada mes con el bloqueo del Cerrito puesto y el mar cerrado suma uno; cualquier otro mes resta uno. La barra lo muestra.\n• Con #V 24#! meses, la Defensa tiene que negociar (desde 1851, con #V 12#!). La tregua lo congela.\n• El mar lo abren Francia y Gran Bretaña: se sigue en #b La intervención extranjera#!.\n• #blue_value Cerrito:#! el botón #b Cerrar el río#! cierra el puerto (necesita a Rosas en #V 40#! o más y la escuadra de Brown). Si el mar se abre, el bloqueo se levanta y se puede volver a pedir cuando se cierre.\n• #R Defensa:#! los botones de las #b legiones#! arman a los extranjeros de la ciudad, con plata y con costo en apoyo francés."
