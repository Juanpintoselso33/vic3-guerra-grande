 gg_brown_squadron_name:0 "Escuadra de Brown"
 gg_lent_squadron_name:0 "Escuadra anglo-francesa"
 gg_naval_anglo_french_station:0 "La estación anglo-francesa"
 gg_naval_anglo_french_station_desc:0 "Francia y Gran Bretaña sostienen el río: el puerto no se puede cerrar."
 gg_loan.1.a_tt2:0 "@information! Queda firmado el convenio francés: cuando estalle la revolución de 1848, París va a tener algo escrito que cumplir."
 gg_loan.2.a_tt2:0 "@information! El Imperio queda comprometido por escrito: en 1851 puede entrar con todo."
 gg_loan.2.b_tt2:0 "@information! El Imperio queda comprometido igual, pero sin figurar: en 1851 puede entrar con todo."
 gg_loan.3.a_tt2:0 "@warning! La deuda del Cerrito queda anotada, y se la van a cobrar en la posguerra."
 gg_peace.6.a_tt2:0 "@information! La paz la escriben las potencias: cambia cómo se cierra la guerra y cómo empieza la posguerra."
 gg_powers.11.b_tt2:0 "@warning! Sin escuadra no hay bloqueo real: el botón del río queda cerrado hasta 1850."
 gg_powers.12.b_tt2:0 "@warning! Las bases Hood quedan rechazadas: la paz de las potencias no vuelve hasta que el árbitro la traiga de nuevo."
 gg_powers.16.c_tt2:0 "@information! La misión queda trabada, no rota: se puede retomar más adelante."
 gg_powers.19.a_tt2:0 "@information! La misión a París le va a costar a Francia un poco de apoyo cuando se sepa."
 gg_powers.19.b_tt2:0 "@information! El Imperio queda comprometido: en 1851 puede entrar con todo."
 gg_powers.21.b_tt2:0 "@warning! La aduana queda hipotecada, y la posguerra empieza con esa cuenta."
 gg_powers.26.a_tt2:0 "@information! Acusar a Rosas ante Europa endurece a los mediadores que vienen en 1848."
 gg_rivera.1.a_tt2:0 "@information! Rivera se queda con un ejército en la campaña: en 1845 va a haber campaña que perder o que ganar."
 gg_rivera.1.b_tt2:0 "@information! Rivera queda solo afuera: lo que pase en 1845 lo va a decidir él sin infantería."
 gg_rivera.2.a_tt2:0 "@warning! Destituido, Rivera vuelve como problema político: el desembarco de 1846 sale de acá."
 gg_rivera.2.b_tt2:0 "@information! Con armas brasileñas, Rivera vuelve a campaña y el Imperio queda adentro de la cuenta."
 gg_rivera.2.c_tt2:0 "@warning! Retenido en el Brasil, Rivera queda fuera de la guerra, y el que lo entregó lo va a pagar en 1846."
 gg_rivera.3.a_tt2:0 "@information! Rivera restituido: vuelve a mandar, y la crisis de 1849 lo va a tener de un lado."
 gg_rivera.3.b_tt2:0 "@warning! Rivera no vuelve más: su gente queda sin jefe para la crisis de 1849."
 gg_rivera.4.a_tt2:0 "@warning! Desterrado, Rivera queda en Río, y volver a llamarlo será una decisión de 1851."
 gg_rivera.4.b_tt2:0 "@information! Rivera en el gobierno: en 1851 el triunvirato lo va a encontrar adentro, no afuera."
 gg_rivera.4.c_tt2:0 "@information! Las ocho condiciones quedan sobre la mesa: son la base de lo que se hable en 1851."
 gg_rivera.5.a_tt2:0 "@information! Llamado de vuelta, Rivera muere en camino y su entierro es una decisión más."
 gg_rivera.5.b_tt2:0 "@information! Rivera se queda en Río: su muerte llega igual, pero lejos."
 gg_rivera.7.a_tt2:0 "@information! Con Rivera en el litoral, Urquiza tiene con quién hablar antes de 1851."
 gg_rivera.7.c_tt2:0 "@information! Las ocho condiciones quedan sobre la mesa: son la base de lo que se hable en 1851."
