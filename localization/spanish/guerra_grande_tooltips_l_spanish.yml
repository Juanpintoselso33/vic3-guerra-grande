 je_gg_siege_complete_tt:0 "El sitio terminó con la paz."
 gg_oribe_exile_tt:0 "@warning! #b Manuel Oribe#! e #b Ignacio Oribe#! se van a Buenos Aires. #R Rivera#! toma el gobierno y conserva el mando aunque haya elecciones."
 gg_arg_intro.1.t:0 "El encargo"
 gg_arg_intro.1.d:0 "Su poder sobre las demás provincias no es soberanía, y este gobierno nunca pretendió que lo fuera. Por el #b Pacto Federal del 4 de enero de 1831#! — tratado entre entidades que se reconocen soberanas entre sí — las provincias le delegaron al gobernador de Buenos Aires el manejo de sus relaciones exteriores. Nada más. Acá no hay Estado nacional del que ser cabeza.\n\nAsí que la cuenta que importa es una cuenta de #b consentimiento#!: #V trece#! provincias, las catorce de la Confederación menos ésta, que no puede delegar en sí misma. Cada una conserva por escrito el derecho de retirar lo que prestó — y cada año este gobierno presenta su renuncia al encargo, y cada año se la rechazan. Es una ceremonia. Es también toda la arquitectura de su autoridad.\n\nDos cosas pueden deshacerla, y ninguna es una batalla perdida. Una legislatura puede #b retirar el encargo#! por votación, y esa provincia pasa a hablar por sí misma ante el mundo; hasta ahí, lo que hay son #b pliegos sin contestar#!, que se acumulan y se ven. Y cuando delegue #b menos de la mitad#! — seis de trece — el gobernador de Buenos Aires será el encargado de las relaciones exteriores de una minoría, que no es nada. Por ahora no se movió nadie."
 gg_arg_intro.1.f:0 "«Encargado de las relaciones exteriores de la Confederación.»"
 gg_arg_intro.1.a:0 "Trece, y no se movió ninguna."
 gg_intro.1.t:0 "La Guerra Grande"
 gg_intro.1.d:0 "Montevideo, enero de 1836. La República tiene catorce años y ya tiene dos dueños: el presidente #b Manuel Oribe#! y el Comandante General de Campaña, #b Fructuoso Rivera#!, que no se soportan. De esa pelea van a salir las divisas —#blue_value blancos#! y #R colorados#!— y, andando el tiempo, dos gobiernos que se dirán los dos legítimos: la #R Defensa#! encerrada en Montevideo y el #blue_value Cerrito#! acampado enfrente.\n\nDe aquí en más se lleva cuenta de todo. Cada batalla, cada tratado, cada favor cobrado o negado inclina la balanza hacia una divisa, y desde 1843 la inclinan también los meses de cerco. Cuando una divisa saque #V 10#! de ventaja, a la otra no le quedará más que sentarse a la mesa, y el que llegue arriba dictará las condiciones.\n\nY hay una segunda cuenta, que no se lleva en Montevideo: ninguno de los dos bandos puede pagarse esta guerra solo. Rosas sostiene a los #blue_value blancos#! desde Buenos Aires; Francia, Gran Bretaña y el Imperio del Brasil miran la plaza. Mientras el río esté abierto, la ciudad come. El día que se cierre, manda el cerco."
 gg_intro.1.f:0 "Dos divisas, dos gobiernos, un solo país."
 gg_intro.1.a:0 "Que se lleve cuenta de todo."
 gg_intro.4.t:0 "El Sitio Grande"
 gg_intro.4.d:0 "El ejército de Oribe llegó frente a Montevideo, y la República tiene desde hoy dos gobiernos. La ciudad no se toma por asalto: se rinde por hambre o no se rinde.\n\nDe aquí en adelante lo que decide es el agua. Cada mes con el río cerrado y el bloqueo del #blue_value Cerrito#! en pie, el cerco aprieta un poco más; cualquier mes en que entren barcos, se afloja otro tanto. A los #V 24#! meses de aprieto, la #R Defensa#! no tendrá con qué seguir.\n\nAl #blue_value Cerrito#! le queda cerrar el río, si Rosas quiere y la escuadra de Brown está en el agua. A la #R Defensa#! le quedan los extranjeros de la ciudad, que son más que sus propios soldados y que pueden tomar las armas."
 gg_intro.4.f:0 "16 de febrero de 1843."
 gg_intro.4.a:0 "Que empiece el cerco."
