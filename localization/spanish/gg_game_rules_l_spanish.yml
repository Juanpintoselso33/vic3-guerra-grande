l_spanish:
 rule_gg_war_outcome:0 "#blue_value GG#! Final de la Guerra Grande"
 setting_gg_war_outcome_dynamic:0 "Dinámico"
 setting_gg_war_outcome_dynamic_desc:0 "El árbitro decide por el puntaje, el aguante y el río, con el calendario del sitio: puede ganar cualquiera de los dos gobiernos."
 setting_gg_war_outcome_historical:0 "Histórico"
 setting_gg_war_outcome_historical_desc:0 "La paz llega en octubre de 1851, como en la historia: ni vencidos ni vencedores. Nadie se rinde antes."
 setting_gg_war_outcome_defensa:0 "Gana la Defensa"
 setting_gg_war_outcome_defensa_desc:0 "El Cerrito puede caer antes; la Defensa nunca. Si en octubre de 1851 la guerra sigue, la Defensa dicta la paz."
 setting_gg_war_outcome_cerrito:0 "Gana el Cerrito"
 setting_gg_war_outcome_cerrito_desc:0 "La Defensa puede caer antes; el Cerrito nunca. Si en octubre de 1851 la guerra sigue, el Cerrito dicta la paz."
 setting_gg_war_outcome_defensa_punish:0 "Gana la Defensa: castigo"
 setting_gg_war_outcome_defensa_punish_desc:0 "La Defensa vence y cumple los decretos de febrero de 1843: los blancos, proscriptos."
 setting_gg_war_outcome_defensa_brazil_treaties:0 "Gana la Defensa: tratados con el Brasil"
 setting_gg_war_outcome_defensa_brazil_treaties_desc:0 "La Defensa vence y firma los cinco tratados con el Imperio: límites, alianza, comercio, extradición y subsidio."
 setting_gg_war_outcome_defensa_europe:0 "Gana la Defensa: protectorado europeo"
 setting_gg_war_outcome_defensa_europe_desc:0 "La Defensa vence y le pide el protectorado a Londres y a París."
 setting_gg_war_outcome_defensa_war_rosas:0 "Gana la Defensa: guerra a Rosas"
 setting_gg_war_outcome_defensa_war_rosas_desc:0 "La Defensa vence, pacifica la República y cruza el río contra Rosas."
 setting_gg_war_outcome_defensa_brazil_vassal:0 "Gana la Defensa: vasallo del Brasil"
 setting_gg_war_outcome_defensa_brazil_vassal_desc:0 "La Defensa vence y la República queda bajo el Imperio del Brasil."
 setting_gg_war_outcome_defensa_cisplatina:0 "Gana la Defensa: provincia Cisplatina"
 setting_gg_war_outcome_defensa_cisplatina_desc:0 "La Defensa vence y la República vuelve a ser la Cisplatina, provincia del Imperio del Brasil."
 setting_gg_war_outcome_cerrito_amnesty:0 "Gana el Cerrito: amnistía"
 setting_gg_war_outcome_cerrito_amnesty_desc:0 "El Cerrito vence y concede la cláusula del pliego de Oribe: ni vencidos ni vencedores."
 setting_gg_war_outcome_cerrito_presidency:0 "Gana el Cerrito: presidencia restituida"
 setting_gg_war_outcome_cerrito_presidency_desc:0 "El Cerrito vence y Oribe vuelve a la presidencia: todo decreto de la Defensa es nulo."
 setting_gg_war_outcome_cerrito_punish:0 "Gana el Cerrito: castigo"
 setting_gg_war_outcome_cerrito_punish_desc:0 "El Cerrito vence y castiga a los salvajes unitarios."
 setting_gg_war_outcome_cerrito_pact_province:0 "Gana el Cerrito: provincia del Pacto"
 setting_gg_war_outcome_cerrito_pact_province_desc:0 "El Cerrito vence y la Banda Oriental vuelve a la Confederación como provincia del Pacto, con su gobierno propio."
 setting_gg_war_outcome_cerrito_rosas_client:0 "Gana el Cerrito: república bajo Rosas"
 setting_gg_war_outcome_cerrito_rosas_client_desc:0 "El Cerrito vence y la República queda independiente y reconocida, bajo la protección de Rosas."
 setting_gg_war_outcome_cerrito_reincorporation:0 "Gana el Cerrito: reincorporación a la Argentina"
 setting_gg_war_outcome_cerrito_reincorporation_desc:0 "El Cerrito vence y la República entra a la Confederación como una provincia más. El Brasil lo tomará como una violación de la Convención de 1828."
 rule_gg_pact_outcome:0 "#blue_value GG#! Final del Pacto Federal"
 setting_gg_pact_outcome_dynamic:0 "Dinámico"
 setting_gg_pact_outcome_dynamic_desc:0 "En mayo de 1851 Urquiza pesa sus agravios: se pronuncia, reclama o se queda. Si hay guerra, la decide el campo de batalla."
 setting_gg_pact_outcome_historical:0 "Histórico"
 setting_gg_pact_outcome_historical_desc:0 "Urquiza se pronuncia y vence: Caseros, a más tardar el 3 de febrero de 1852. Rosas parte al exilio y la Confederación se da la constitución de 1853."
 setting_gg_pact_outcome_negotiated:0 "Confederación negociada"
 setting_gg_pact_outcome_negotiated_desc:0 "Rosas acepta que Entre Ríos reasuma sus facultades y convoca el congreso. No hay guerra: las provincias se dan una constitución."
 setting_gg_pact_outcome_rosas:0 "Gana Rosas: país sin constitución"
 setting_gg_pact_outcome_rosas_desc:0 "Urquiza se pronuncia y es batido. Rosas sigue gobernando sin constitución mientras viva; lo que venga después se decide a su muerte."
 setting_gg_pact_outcome_stalemate:0 "Dos gobiernos"
 setting_gg_pact_outcome_stalemate_desc:0 "Urquiza se pronuncia y la guerra termina sin vencedor, a más tardar en febrero de 1852: Buenos Aires y el Litoral quedan cada uno por su lado."
