l_spanish:

# ES: La asimetría económica del Sitio Grande. Todas las cifras citadas están documentadas en
#     ~/dev/juegos/victoria3-uruguay/SOURCES_siege.md y en los comentarios de
#     common/static_modifiers/guerra_grande_siege_modifiers.txt.

 gg_siege_port_without_a_countryside:0 "Un puerto sin campaña"
 gg_siege_port_without_a_countryside_desc:0 "Montevideo tiene la aduana y la bahía, y nada más. Con Buenos Aires bloqueado, todo el comercio de la cuenca pasa por acá: la renta del puerto subió de 86.000 pesos en 1844 a más de 2.900.000 en 1847. La ventaja no es el agua —el enemigo tiene tres desembarcaderos propios sobre el mismo río—. Es que ésta es la única aduana por la que un capitán extranjero puede despachar y seguir llamando lícita a su carga en cualquier otra parte. Los inmigrantes siguen desembarcando: de 31.000 habitantes, apenas unos 11.000 son orientales. Pero las quintas y las chacras quedaron extramuros y adentro de la línea enemiga, así que cada arroba de carne y cada fanega de grano hay que comprarla y traerla por agua, y la guarnición que se la come no es un ejército nacional."
 gg_siege_countryside_without_a_port:0 "Puertos que nadie reconoce"
 gg_siege_countryside_without_a_port_desc:0 "El Cerrito gobierna la República entera menos la plaza amurallada: el ganado, los cueros, los saladeros y los jinetes están todos acá afuera, y los saladeros del Buceo, de la Guardia de Arredondo sobre el Yaguarón y del litoral del río Uruguay trabajan toda la guerra mientras los de Montevideo se arruinan. Costa tampoco le falta. Oribe habilitó el Buceo por decreto el 10 de julio de 1843 y levantó ahí una aduana con setenta funcionarios adentro; en su mejor momento había cuarenta buques de ultramar fondeados frente a la playa. Lo que le falta es reconocimiento. El Buceo es una rada abierta sin obras de puerto, Montevideo declara pirata a todo buque que recale ahí y contrabando a toda su carga, y una sola escuadra cierra los tres desembarcaderos en una semana. Un cuero vendido de contrabando desde una playa sigue siendo un cuero vendido: por menos de lo que vale, a quien se anime a venir."
 gg_siege_mortgaged_customs:0 "La aduana hipotecada"
 gg_siege_mortgaged_customs_desc:0 "La Defensa tiene plata y no hay un peso que sea suyo. La renta de aduana se vende por adelantado año por año a la Sociedad Compradora de los Derechos de Aduana, que la cobra a cambio de la mitad de lo que entre; el contrato del 12 de octubre de 1847 compra la renta entera de 1850 por 555.000 pesos contra un subsidio de 150.000 por mes. La Plaza Matriz y el Cabildo están hipotecados a un comerciante francés. Desde junio de 1848 Francia paga 40.000 pesos mensuales por convención; desde julio de 1850 Brasil paga 18.000 pesos fuertes por mes en secreto. Plata hoy, y un acreedor por cada peso."
 gg_siege_customs_house_at_the_buceo:0 "La aduana del Buceo"
 gg_siege_customs_house_at_the_buceo_desc:0 "El 10 de julio de 1843 Oribe y su ministro Villademoros habilitan el Buceo como puerto, expresamente para que más fácilmente se llenen las necesidades de la población y se haga más fácil el percibo de los derechos para el estado, y levantan ahí una aduana —la «aduana de Oribe»— con setenta funcionarios a las órdenes del Primer Receptor Ignacio Soria. Es la principal fuente de recursos del Cerrito y es chica. A cambio: el Cerrito no le debe a nadie. Oribe rechazó un empréstito británico de tres millones de pesos antes que firmar el tratado perpetuo de alianza que venía con él, y gobierna y recauda el país él mismo."
 gg_siege_trading_with_the_enemy:0 "Comercio a través de la línea"
 gg_siege_trading_with_the_enemy_desc:0 "Los dos gobiernos prohibieron toda comunicación con el enemigo —Montevideo el 26 de junio de 1843, Oribe más apretado en febrero de 1845— y los dos la habilitan igual, porque cada uno necesita justo lo que tiene el otro. El ganado entra a la plaza sitiada por agua y por la costa, vendido con permisos firmados en el propio Cuartel General de Oribe. La carga de ultramar llega a Buenos Aires pagando derechos antes en Montevideo, así que el comercio del aliado de los sitiadores le paga al gobierno que están sitiando. Ninguno de los dos puede matar de hambre al otro, y los dos lo saben."
 gg_siege_the_asymmetry_tt:0 "Cada gobierno tiene justo lo que al otro le falta. Montevideo tiene la aduana reconocida, la bahía honda y las escuadras extranjeras que la mantienen abierta: plata, y ninguna campaña con qué alimentarse ni con qué levantar un ejército nacional. El Cerrito tiene el ganado, los cueros, los saladeros y los jinetes de la República entera, y desembarcaderos propios sobre el mismo río —pero son playas abiertas, su aduana no se la reconoce nadie, y todo lo que sale de ahí sale como contrabando—. Ninguno puede terminar con el otro, y por eso esto dura nueve años."
 gg_siege_the_land_frontier_stays_open:0 "La frontera terrestre no se cierra"
 gg_siege_the_land_frontier_stays_open_desc:0 "Cierren el río y el comercio se va al norte caminando. Oribe habilita puertos sobre el Yaguarón, la Laguna Merín y el Chuy y muda la Administración Central de la Aduana a Melo; desde 1845 los saladeros vuelven a trabajar en el norte, donde la frontera está abierta al comercio de ganado mientras los puertos del Plata están cerrados, y las tropas de ganado cruzan en pie a Rio Grande do Sul. Ninguna escuadra en el río llega a nada de eso: el espejo del camino del mar que la plaza no puede perder."
 gg_siege_no_breaching_guns:0 "Ningún cañón de brecha"
 gg_siege_no_breaching_guns_desc:0 "Treinta y cinco piezas en el parque frente a Montevideo y ninguna capaz de abrir un muro. Oribe se sentó frente a la ciudad esperando que el hambre hiciera el trabajo, y el hambre tardó nueve años."
 gg_siege_guns_of_the_plaza:0 "Los cañones de la plaza"
 gg_siege_guns_of_the_plaza_desc:0 "Veintitrés cañones en febrero, cien y ochocientos artilleros en junio. El sitiado triplicaba en artillería al sitiador."
 gg_siege_the_sea_lane_stays_open:0 "El puerto no se cierra"
 gg_siege_the_sea_lane_stays_open_desc:0 "El puerto no cerró nunca. Por barco entraron hombres, plata y comida durante nueve años, y ningún ejército de la campaña podía llegar al agua."
