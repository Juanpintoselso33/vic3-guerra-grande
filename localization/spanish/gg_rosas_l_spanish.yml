l_spanish:
 gg_rosas.1.t:0 "El ejército de Oribe ante Montevideo"
 gg_rosas.1.d:0 "Después de #b Arroyo Grande#!, el 6 de diciembre, el ejército de Rivera ya no existe, y el general #b Oribe#! avanza sobre Montevideo con las divisiones que Buenos Aires le dio para esa campaña. Ahora se sienta frente a la muralla, y la guerra que se creía de semanas empieza a parecer de años.\n\nEsas divisiones son argentinas, las pagan las cajas de la Confederación, y el Litoral pregunta cuánto tiempo más van a faltar de sus provincias. Oribe pide que se queden: sin ellas, el Cerrito es una línea de caballería frente a una ciudad con puerto.\n\nEn la Casa de Gobierno hay que decidir cuánto de la guerra oriental es guerra de la Confederación."
 gg_rosas.1.d_no_battle:0 "Rivera no quiso cruzar a buscarlo y esperó en su costa; el general #b Oribe#! pasó el Uruguay igual, con las divisiones que Buenos Aires le dio para esa campaña. Ahora se sienta frente a la muralla, con el ejército de Rivera todavía en la campaña a sus espaldas, y la guerra que se creía de semanas empieza a parecer de años.\n\nEsas divisiones son argentinas, las pagan las cajas de la Confederación, y el Litoral pregunta cuánto tiempo más van a faltar de sus provincias. Oribe pide que se queden: sin ellas, el Cerrito es una línea de caballería frente a una ciudad con puerto.\n\nEn la Casa de Gobierno hay que decidir cuánto de la guerra oriental es guerra de la Confederación."
 gg_rosas.1.f:0 "Una ciudad con puerto no se toma con caballería."
 gg_rosas.1.a:0 "Las divisiones se quedan con Oribe."
 gg_rosas.1.b:0 "Que vuelvan las tropas; a Oribe se le manda plata."
 gg_rosas.1.c:0 "La guerra oriental es de Oribe."
 gg_rosas.1.a_tt:0 "@information! El respaldo de #b Rosas#! al Cerrito sube #P 10#!, y el Cerrito recibe los #b auxiliares argentinos#! por cinco años. Le cuesta a la Confederación #N 30.000#!."
 gg_rosas.1.b_tt:0 "@information! El respaldo de #b Rosas#! sube #P 5#! y el aguante del Cerrito #P 10#!. Cuesta #N 20.000#!."
 gg_rosas.1.c_tt:0 "@warning! El respaldo de #b Rosas#! al Cerrito baja #N 10#!."
 gg_rosas.2.t:0 "Urquiza cruza el Uruguay"
 gg_rosas.2.d:0 "Rivera volvió del Brasil y anda por la campaña oriental con un ejército nuevo, levantando partidas y evitando la batalla. El gobernador de Entre Ríos, #b Justo José de Urquiza#!, tiene su caballería del otro lado del río y pide la orden de cruzar.\n\nMandarlo es terminar con Rivera en campo abierto, donde la caballería entrerriana no tiene rival. También es darle a Urquiza la victoria más grande de su carrera, con soldados de la Confederación y en suelo oriental."
 gg_rosas.2.f:0 "Los caudillos del Litoral se hacen en las batallas que otros les mandan a pelear."
 gg_rosas.2.a:0 "Que Urquiza cruce y termine con Rivera."
 gg_rosas.2.b:0 "Urquiza se queda en Entre Ríos."
 gg_rosas.2.a_tt:0 "@information! El aguante de la #R Defensa#! baja #N 10#! y los #blue_value blancos#! suman #P 1#!. El respaldo de #b Urquiza#! al Cerrito sube #P 10#!."
 gg_rosas.2.b_tt:0 "@warning! El respaldo de #b Rosas#! al Cerrito baja #N 5#!: Oribe esperaba la caballería del Litoral."
 gg_rosas.3.t:0 "Lord Howden en Buenos Aires"
 gg_rosas.3.d:0 "Lord #b Howden#! y el conde #b Walewski#! vinieron a terminar la guerra oriental con una fórmula: un armisticio, el desarme de las fuerzas extranjeras y elecciones en la Banda Oriental. Howden despacha desde la fragata Raleigh, y cada propuesta pasa por la mesa del ministro #b Arana#!.\n\nLa pregunta de fondo es una sola: ¿Buenos Aires sostiene que #b Oribe#! es el presidente legal de la República, o acepta tratarlo como una de las partes?"
 gg_rosas.3.f:0 "Howden escribió que el bloqueo no dañaba a Rosas y solo daba dinero a los que lo sostenían."
 gg_rosas.3.a:0 "Oribe es el presidente legal: no hay otra fórmula."
 gg_rosas.3.b:0 "Aconsejarle a Oribe que acepte el armisticio."
 gg_rosas.3.a_tt:0 "@information! El respaldo de #b Rosas#! sube #P 5#!. La relación con Gran Bretaña baja #N 10#!."
 gg_rosas.3.b_tt:0 "@warning! El respaldo de #b Rosas#! baja #N 10#! y el aguante del Cerrito #N 10#!. La relación con Gran Bretaña sube #P 20#!."
 gg_rosas.4.t:0 "El tratado Arana-Southern"
 gg_rosas.4.d:0 "Sir #b Henry Southern#! soportó en Buenos Aires quince postergaciones antes de presentar credenciales, y hoy se firma el tratado: Gran Bretaña, que ya levantó el bloqueo, devuelve la isla Martín García y los buques tomados, y reconoce que la navegación del Paraná es un asunto interior de la Confederación.\n\nQueda una cláusula por fijar. El artículo sexto dice que el Restaurador solo tratará si su aliado, el presidente #b Oribe#!, está de acuerdo. Southern pregunta si va en el texto; Londres preferiría no verla."
 gg_rosas.4.f:0 "«…estuviese previamente conforme con ella.» — Tratado Arana-Southern, art. VI"
 gg_rosas.4.a:0 "Firmar con el artículo sexto: nada sin Oribe."
 gg_rosas.4.b:0 "Firmar sin atarse a Oribe."
 gg_rosas.4.a_tt:0 "@information! La relación con Gran Bretaña sube #P 40#! y el respaldo de #b Rosas#! al Cerrito #P 5#!."
 gg_rosas.4.b_tt:0 "@warning! La relación con Gran Bretaña sube #P 60#!, pero el respaldo de #b Rosas#! baja #N 20#! y el aguante del Cerrito #N 20#!."
 gg_rosas.5.t:0 "El tratado Arana-Le Prédour"
 gg_rosas.5.d:0 "El almirante #b Le Prédour#! trae a Buenos Aires lo que Francia necesita para irse del Plata con honor: el fin del bloqueo, el retiro de la legión y un arreglo sobre la Banda Oriental. El ministro #b Arana#! tiene el texto sobre la mesa.\n\nComo con Southern, lo que se discute es #b Oribe#!: si el tratado lo protege o si Buenos Aires se desentiende de la suerte del Cerrito."
 gg_rosas.5.f:0 "Un tratado que París nunca ratificó."
 gg_rosas.5.a:0 "Firmar cuidando a Oribe."
 gg_rosas.5.b:0 "Firmar sin atarse a Oribe."
 gg_rosas.5.a_tt:0 "@information! La relación con Francia sube #P 40#! y el respaldo de #b Rosas#! al Cerrito #P 5#!."
 gg_rosas.5.b_tt:0 "@warning! La relación con Francia sube #P 60#!, pero el respaldo de #b Rosas#! baja #N 20#! y el aguante del Cerrito #N 20#!."
 gg_rosas.6.t:0 "La paz en la Banda Oriental"
 gg_rosas.6.d:0 "De la otra orilla llegan noticias: la guerra oriental se acerca a su fin, y las condiciones de la paz pueden estar sobre la mesa en semanas. Lo que Buenos Aires haga ahora pesa en cómo termina."
 gg_rosas.6.d_blanco:0 "De la otra orilla llegan buenas noticias: la balanza se inclinó hacia el Cerrito, y #b Oribe#! está en condiciones de dictar la paz. En semanas se sabrá qué República sale de nueve años de sitio, y cuánto de ella le debe a Buenos Aires.\n\nOribe pide un último esfuerzo para que la paz sea la suya y no una a medias."
 gg_rosas.6.d_colorado:0 "De la otra orilla llegan malas noticias: la balanza se inclinó hacia la Defensa, y la paz que se discute no es la de #b Oribe#!. Nueve años de sitio pueden terminar sin que el Cerrito entre en Montevideo.\n\nOribe pide que Buenos Aires no lo deje solo en la mesa."
 gg_rosas.6.d_cut:0 "De la otra orilla llegan noticias de la paz, y ninguna buena para #b Oribe#!. Desde que #b Urquiza#! reasumió las relaciones exteriores de Entre Ríos, el camino del Uruguay está cerrado: lo que Buenos Aires mande a la Banda Oriental tiene que cruzar una provincia en armas contra el Restaurador.\n\nOribe pide que no lo dejen solo en la mesa. Buenos Aires ya no puede mandarle hombres ni plata; solo un consejo."
 gg_rosas.6.f:0 "Las guerras largas se terminan en la mesa."
 gg_rosas.6.a:0 "Sostener a Oribe hasta el final."
 gg_rosas.6.b:0 "Aconsejarle a Oribe que negocie."
 gg_rosas.6.a_tt:0 "@information! El aguante del Cerrito sube #P 15#! y el respaldo de #b Rosas#! #P 5#!. Cuesta #N 40.000#!."
 gg_rosas.6.b_tt:0 "@information! El respaldo de #b Rosas#! baja #N 5#!. Londres y París lo toman bien: #P +10#! con cada una."
