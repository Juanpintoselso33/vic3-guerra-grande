l_spanish:

 gg_powers.10.t:0 "Purvis no reconoce el bloqueo"
 gg_powers.10.d:0 "Rosas declaró el bloqueo de Montevideo, pero el comodoro británico Purvis dice que no reconoce a los puertos nuevos de Sudamérica el derecho de bloquear, y sus botes llevan tropas de la ciudad a la costa. Insistir es jugar la escuadra de Brown contra la marina más grande del mundo. Hay otra forma de apretar a la ciudad: dejarla comerciar con la campaña hasta que se quede sin metálico."
 gg_powers.10.f:0 "El agua no reconoce gobiernos: reconoce cañones."
 gg_powers.10.a:0 "Sostener el bloqueo aunque Inglaterra se ofenda."
 gg_powers.10.b:0 "Que comercien. Que se les acabe la plata."
 gg_powers.11.t:0 "La escuadra de Brown"
 gg_powers.11.d:0 "El 21 de julio los ministros de Inglaterra y Francia pasan el ultimátum: que se levante el bloqueo de Montevideo o se toma la escuadra. Rosas contesta declarando el bloqueo total y, cuando ve lo que viene, le ordena a Brown volver a Buenos Aires con la flota.\n\nYa es tarde. Los buques aliados rodean a la escuadra frente a la ciudad: la fragata #b 25 de Mayo#!, los bergantines #b General Echagüe#! y #b San Martín#! —la capitana—, y las goletas #b Maipú#! y #b 9 de Julio#!. Seis buques, tomados sin combate, en lo que Buenos Aires va a llamar para siempre el robo de la escuadra.\n\nSalvar los barcos es perder el bloqueo; resistir es perder los barcos y quedarse igual sin bloqueo. Lo que viene detrás es peor para el Restaurador: desde el 2 de agosto las escuadras aliadas cierran todos los puertos de la Confederación y de la República, menos uno. Menos Montevideo."
 gg_powers.11.f:0 "Treinta y tres años de bandera, arriados sin un tiro."
 gg_powers.11.a:0 "Levantar el bloqueo y salvar la escuadra."
 gg_powers.11.b:0 "Que se la lleven. América va a saber quién la robó."
 gg_powers.12.t:0 "Las bases Hood"
 gg_powers.12.d:0 "Thomas Samuel Hood llega en nombre de Londres y de París con una propuesta: cese de hostilidades, desarme de los extranjeros de Montevideo, retiro de las tropas argentinas, fin del bloqueo, elecciones libres y amnistía amplia. Rosas la acepta con retoques. La decisión del Cerrito es la primera; la de Montevideo viene después."
 gg_powers.12.f:0 "Una paz que nadie ganó, ofrecida por los que no pelean."
 gg_powers.12.a:0 "Aceptarla, con los retoques de Rosas."
 gg_powers.12.b:0 "No se negocia con los que bloquean."
 gg_powers.13.t:0 "Montevideo y las bases Hood"
 gg_powers.13.d:0 "El Cerrito aceptó. Ahora la propuesta de las potencias está sobre la mesa de la Defensa: elecciones que probablemente gane Oribe, las legiones desarmadas y los argentinos de vuelta a su orilla. Si Montevideo la rechaza, Londres y París dicen que no van a seguir sosteniéndola."
 gg_powers.13.f:0 "Aceptar es perder la ciudad por los votos. Rechazar es arriesgarla por el hambre."
 gg_powers.13.a:0 "Aceptar la paz de las potencias."
 gg_powers.13.b:0 "Rechazarla. Montevideo no se entrega por un pliego."
 gg_powers.14.t:0 "Howden y Walewski en el Cerrito"
 gg_powers.14.d:0 "Los nuevos mediadores, lord Howden y el conde Walewski, suben al Cerrito. Oribe no va a firmar una paz sin Rosas, pero puede ofrecer algo: seis meses de tregua y ganado para la ciudad, a cambio de que se levante el bloqueo."
 gg_powers.14.f:0 "Una tregua es una paz con fecha de vencimiento."
 gg_powers.14.a:0 "Ofrecer la tregua y el ganado."
 gg_powers.14.b:0 "No hay nada que ofrecer sin Rosas."
 gg_powers.15.t:0 "La tregua de Howden"
 gg_powers.15.d:0 "El Cerrito ofrece seis meses sin tiros y ganado para la plaza. Lord Howden ya dio orden de levantar el bloqueo británico; el francés sigue. Aceptar es comer, y darle seis meses al otro para prepararse."
 gg_powers.15.f:0 "Seis meses de carne son seis meses de muralla."
 gg_powers.15.a:0 "Aceptar la tregua."
 gg_powers.15.b:0 "La ciudad no negocia con el sitiador."
 gg_powers.16.t:0 "Gore y Gros"
 gg_powers.16.d:0 "Robert Gore y el barón Gros traen otra oferta, y esta vez es para Oribe solo: la presidencia en Montevideo por el tiempo que le faltó en 1838, con garantía de las potencias, si deja de ser el lugarteniente de Rosas. Desde Buenos Aires llega la advertencia: si Oribe acepta, las potencias quedan libres para ir contra la Confederación, y después contra él."
 gg_powers.16.f:0 "La presidencia, a cambio del hombre que la pagó."
 gg_powers.16.a:0 "Aceptar la presidencia y dejar a Rosas."
 gg_powers.16.b:0 "Oribe no se separa del Restaurador."
 gg_powers.16.c:0 "Contestar con cortesías y ganar tiempo."
 gg_powers.17.t:0 "Urquiza y el tratado de Alcaraz"
 gg_powers.17.d:0 "Justo José de Urquiza firmó la paz con Corrientes en Alcaraz, y Rosas no la aprueba: lo que el gobernador de Entre Ríos arregla por su cuenta con una provincia rebelde huele a política propia, y en la Confederación la política propia es traición.\n\nPor canales reservados, Urquiza escucha a Montevideo. No promete nada: pregunta, deja preguntar y mide. Entre Ríos vive del río y de los cueros, y el bloqueo que Rosas sostiene le cierra las dos cosas; el ejército entrerriano es, además, el mejor de la Confederación después del de Buenos Aires.\n\nSi Rosas está fuerte, lo va a retener y esta conversación no existió nunca. Si no lo está, Entre Ríos puede cambiar de lado cuatro años antes de lo que nadie espera, y la guerra se decide en una tarde en la otra orilla."
 gg_powers.17.f:0 "El mejor general de Rosas no es un hombre de Rosas."
 gg_powers.17.a:0 "Ofrecerle la alianza."
 gg_powers.17.b:0 "Es demasiado arriesgado."
 gg_powers.18.t:0 "Los que se van"
 gg_powers.18.d:0 "Francia recorta lo que manda y la ciudad no puede pagar a todos. Los voluntarios vascos que vinieron con la Legión Francesa se están pasando a Buenos Aires, donde hay trabajo y no hay ración de sitio, y la emigración se lleva mes a mes lo que la muralla necesita.\n\nGaribaldi prepara el regreso a Italia: en 1848 le estalló la revolución en su casa, y el marino de Niza que armó una legión en el Plata va a pelear la suya. Con él se van los que lo siguieron, que nunca fueron muchos y ahora son menos de la mitad de los setecientos del mejor momento.\n\nSe puede retener a algunos pagando caro, o dejarlos ir y quedarse con una guarnición más chica y más barata. Ninguna de las dos cosas devuelve lo que se va: los legionarios que quedan son, cada vez más, gente que ya no tiene a dónde volver."
 gg_powers.18.f:0 "Una legión es quien esté dispuesto a pararse en ella."
 gg_powers.18.a:0 "Retener a los italianos."
 gg_powers.18.b:0 "Retener a los vascos."
 gg_powers.18.c:0 "Que se vayan. La muralla la sostienen los de acá."
 gg_powers.19.t:0 "Inglaterra se va"
 gg_powers.19.d:0 "El 24 de noviembre, el ministro Southern y Arana firman el tratado: Gran Bretaña reconoce la soberanía de la Confederación sobre sus ríos, devuelve la escuadra y Martín García, y deja de sostener a Montevideo. Francia sigue, por ahora. La Defensa tiene que elegir a quién le pide lo que falta."
 gg_powers.19.f:0 "Los aliados también firman tratados."
 gg_powers.19.a:0 "Mandar a Pacheco y Obes a París."
 gg_powers.19.b:0 "Que Lamas le pida al Imperio."
 gg_powers.19.c:0 "Aguantar solos."
 gg_powers.21.t:0 "Se termina el subsidio"
 gg_powers.21.d:0 "La Asamblea francesa votó el subsidio por nueve meses más y los nueve meses pasaron. La ciudad no tiene con qué pagar la guarnición. Queda la aduana, que ya está comprometida, o recortar."
 gg_powers.21.f:0 "Una ciudad que se sostiene con plata ajena se hipoteca a sí misma."
 gg_powers.21.a:0 "Hipotecar la aduana otra vez."
 gg_powers.21.b:0 "Recortar lo que haya que recortar."
 gg_powers.23.t:0 "Se pasan los jefes"
 gg_powers.23.d:0 "Urquiza cruzó el Uruguay. En Paysandú se le suma #b Servando Gómez#!, comandante militar del departamento y uno de los dos jefes en que el Cerrito dividió el país, y detrás van Lucas Píriz y otros oficiales hartos de una guerra sin fin.\n\nLas tropas de Ignacio Oribe desertan en masa. No es una derrota: es un ejército que deja de existir porque la gente se vuelve a su casa, y el gobierno del Cerrito se queda con once mil hombres en los papeles y con mucho menos en el campo.\n\nQuedan tres caminos: pelear con lo que haya, pedir condiciones mientras todavía se pueda pedir algo, o pedirle a las escuadras una garantía para embarcar a los argentinos y terminar esto sin que nadie cuelgue a nadie."
 gg_powers.23.f:0 "Nueve años de sitio, y el sitio se deshace en un mes."
 gg_powers.23.a:0 "Pelear con lo que queda."
 gg_powers.23.b:0 "Mandar a Lucas Moreno ante Urquiza."
 gg_powers.23.c:0 "Pedir la garantía naval para irse con los argentinos."
 gg_powers.24.t:0 "La crisis de la Defensa"
 gg_powers.24.d:0 "Inglaterra se fue, y un golpe así cambia quién manda adentro de la muralla. De un lado están los doctores del gobierno de Suárez, con Herrera y Obes a la cabeza, que quieren negociar con quien haga falta. Del otro, los jefes militares que siguen a Rivera y a Flores, que no quieren oír hablar de condiciones.\n\nDarle el gobierno al otro bando ahora tiene un costo."
 gg_powers.24.f:0 "Dentro de la muralla también hay dos gobiernos."
 gg_powers.24.a:0 "Seguir como estamos."
 gg_powers.24.b:0 "Darle el gobierno al otro bando."
 gg_powers.25.t:0 "El convenio con España"
 gg_powers.25.d:0 "Juan Francisco Giró negocia en Madrid un convenio de reconocimiento de la independencia. Es un papel firmado, no un tratado: España no lo va a ratificar mientras haya dos gobiernos en la República, porque atarse a uno solo compromete la relación con el que gane. Aun así, es un papel que se puede mostrar en dos mesas distintas."
 gg_powers.25.f:0 "La antigua metrópoli firma, y se guarda la ratificación."
 gg_powers.25.a:0 "Mostrarlo en Londres y en París."
 gg_powers.25.b:0 "Mostrarlo en Buenos Aires."
 gg_powers.26.t:0 "Florencio Varela"
 gg_powers.26.d:0 "El día después de que llegan Gore y Gros, asesinan frente a su casa a Florencio Varela, el hombre que fue a Londres y a París a pedir la intervención. La prensa de Montevideo ya tiene un culpable. Nadie probó quién fue."
 gg_powers.26.f:0 "Un muerto le sirve a todos los que lo nombran."
 gg_powers.26.a:0 "Fue Rosas. Que Europa lo sepa."
 gg_powers.26.b:0 "Que se investigue antes de acusar."
 gg_powers.28.t:0 "Las exequias de Larrañaga"
 gg_powers.28.d:0 "Murió el presbítero Dámaso Antonio Larrañaga, que vivía cerca del Cerrito y decía misa en la Matriz. Por un día se suspende la guerra, y gente de los dos bandos camina junta detrás del cajón. Algunos dicen que es el momento de hablar entre orientales."
 gg_powers.28.f:0 "Un entierro no es una paz, pero se le parece."
 gg_powers.28.a:0 "Aprovechar para tantear una paz."
 gg_powers.28.b:0 "Respetar el duelo, y nada más."
 gg_powers.29.t:0 "La nueva Troya"
 gg_powers.29.d:0 "Melchor Pacheco y Obes volvió de París con poco más que buenas palabras y un libro. Alejandro Dumas escribió sobre esta ciudad como una nueva Troya: nueve años de sitio, una plaza que no cae, y del otro lado un asedio que en el relato francés se parece bastante al de Homero.\n\nNo es historia y nadie en Montevideo cree que lo sea. Es propaganda escrita por el novelista más leído de Europa, encargada por el gobierno que necesita que París siga mirando para acá cuando la Asamblea vote lo que va a mandar.\n\nDifundirlo cuesta plata que la aduana no tiene. Lo que compra no es un batallón ni un subsidio: es tiempo, en la única moneda que la Defensa todavía maneja bien, que es la opinión europea."
 gg_powers.29.f:0 "Una ciudad sitiada también se defiende con novelas."
 gg_powers.29.a:0 "Que se lea en toda Francia."
 gg_powers.29.b:0 "La plata hace más falta en la muralla."
 gg_powers.31.t:0 "Se abre la Universidad"
 gg_powers.31.d:0 "Once años después del decreto, la Universidad Mayor de la República abre sus puertas en plena guerra. El que tiene Montevideo decide cómo se hace."
 gg_powers.31.f:0 "18 de julio de 1849."
 gg_powers.31.a:0 "Con ceremonia."
 gg_powers.31.b:0 "Sin ceremonia."
 gg_rivera.7.t:0 "Mercedes y Paysandú"
 gg_rivera.7.d:0 "Rivera está otra vez en la campaña y quiere pelear: el litoral está a su alcance, y Mercedes y Paysandú se pueden tomar. Herrera y Obes preferiría que se quedara cubriendo Maldonado mientras él negocia en secreto. Y hay quien dice que Rivera ya le escribe a Oribe."
 gg_rivera.7.f:0 "Diciembre de 1846."
 gg_rivera.7.a:0 "Que tome el litoral."
 gg_rivera.7.b:0 "Que cubra Maldonado y deje negociar."
 gg_rivera.7.c:0 "Que hable con Oribe, entre orientales."
 gg_peace.6.t:0 "La paz de las potencias"
 gg_peace.6.desc:0 "Los dos gobiernos aceptaron las bases de Londres y de París. Se deponen las armas, los extranjeros de Montevideo entregan las suyas, los argentinos vuelven a su orilla y hay amnistía para todos. Queda una sola República, y la elección decide quién la gobierna."
 gg_peace.6.flav:0 "Nadie ganó la guerra. Alguien va a ganar la elección."
 gg_peace.6.a:0 "Que voten los orientales."
 gg_peace.7.t:0 "Oribe, presidente"
 gg_peace.7.desc:0 "Oribe aceptó la oferta de Gore y Gros: termina su período en Montevideo con la garantía de las potencias, y la Defensa se disuelve en paz. En Buenos Aires, Rosas no perdona: el lugarteniente se fue, y la Confederación queda enemistada con la República."
 gg_peace.7.flav:0 "Una presidencia recuperada, un protector perdido."
 gg_peace.7.a:0 "Gobernar con la garantía europea."
 gg_peace.7.b:0 "Gobernar y convocar a elecciones."
 gg_powers_ships_lost:0 "Barcos perdidos ante los británicos"
 gg_powers_specie_drain:0 "El metálico se va de la ciudad"
 gg_powers_american_cause:0 "La causa americana"
 gg_powers_hardened:0 "Las potencias, en contra"
 gg_truce_cattle:0 "Ganado para la ciudad"
 gg_line_change:0 "La Defensa cambia de manos"
 gg_university_inaugurated:0 "La Universidad Mayor"
 gg_peace_powers_tutelage:0 "La paz de las potencias"
 gg_peace_european_guarantee:0 "La garantía europea"
 guerra_grande_requires_brown_fleet:0 "Sin la escuadra de Brown no hay bloqueo hasta 1850."
 gg_powers_ships_lost_desc:0 "La escuadra de Brown quedó en manos británicas y francesas, y con ella el bloqueo."
 gg_powers_specie_drain_desc:0 "La ciudad comercia con la campaña y paga en metálico: la plata se va por los portones."
 gg_powers_american_cause_desc:0 "Frente a las escuadras europeas, la Confederación se presenta como la defensa de América."
 gg_powers_hardened_desc:0 "Londres y París tomaron el rechazo como una afrenta, y lo cobran."
 gg_truce_cattle_desc:0 "La tregua de Howden deja entrar ganado a la plaza."
 gg_line_change_desc:0 "El gobierno de la Defensa pasó de un bando a otro en plena guerra, y lo paga en desorden."
 gg_university_inaugurated_desc:0 "La Universidad Mayor de la República abrió sus puertas el 18 de julio de 1849."
 gg_peace_powers_tutelage_desc:0 "La paz la escribieron Londres y París, y la vigilan."
 gg_peace_european_guarantee_desc:0 "La presidencia de Oribe descansa en la garantía de las potencias, no en la de Rosas."
