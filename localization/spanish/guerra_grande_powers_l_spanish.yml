l_spanish:

 gg_powers.10.t:0 "Purvis no reconoce el bloqueo"
 gg_powers.10.d:0 "Rosas declaró el bloqueo de Montevideo y la escuadra de Brown lo hace cumplir. El comodoro británico #b John Brett Purvis#! contesta que su gobierno tiene por principio no reconocerles a los puertos nuevos de Sudamérica «tan alto e interesante derecho como el del bloqueo», y actúa en consecuencia.\n\nCuando Brown se lleva la pólvora que los comerciantes guardaban en la Isla de Ratas, Purvis le apunta los cañones y se la hace devolver. A un almirante que hace treinta años es ciudadano argentino le habla como «Mr. Brown, súbdito británico al mando de los buques de Buenos Aires», y le avisa que si hostiliza la ciudad lo va a tratar como pirata. Sus botes llevan tropas de la plaza a la costa y le entran víveres al puerto sitiado.\n\nLondres lo va a desautorizar y no lo va a castigar. Mientras tanto la ciudad come, y el bloqueo que tenía que rendirla en meses no rinde nada. Insistir es jugarse la escuadra contra la primera marina del mundo."
 gg_powers.10.f:0 "El agua no reconoce gobiernos: reconoce cañones."
 gg_powers.10.a:0 "Sostener el bloqueo aunque Inglaterra se ofenda."
 gg_powers.10.b:0 "Que comercien. Que se les acabe la plata."
 gg_powers.11.t:0 "La escuadra de Brown"
 gg_powers.11.d:0 "El 21 de julio los ministros de Inglaterra y Francia pasan el ultimátum: que se levante el bloqueo de Montevideo o se toma la escuadra. Rosas contesta declarando el bloqueo total y, cuando ve lo que viene, le ordena a Brown volver a Buenos Aires con la flota.\n\nYa es tarde. Los buques aliados rodean a la escuadra frente a la ciudad: la fragata #b 25 de Mayo#!, los bergantines #b General Echagüe#! y #b San Martín#! —la capitana—, y las goletas #b Maipú#! y #b 9 de Julio#!. Seis buques, tomados sin combate, en lo que Buenos Aires va a llamar para siempre el robo de la escuadra.\n\nSalvar los barcos es perder el bloqueo; resistir es perder los barcos y quedarse igual sin bloqueo. Lo que viene detrás es peor para el Restaurador: desde el 2 de agosto las escuadras aliadas cierran todos los puertos de la Confederación y de la República, menos uno. Menos Montevideo."
 gg_powers.11.f:0 "Treinta y tres años de bandera, arriados sin un tiro."
 gg_powers.11.a:0 "Levantar el bloqueo y salvar la escuadra."
 gg_powers.11.b:0 "Que se la lleven. América va a saber quién la robó."
 gg_powers.12.t:0 "Las bases Hood"
 gg_powers.12.d:0 "#b Thomas Samuel Hood#! fue cónsul británico en Montevideo veinte años, hasta que en 1843 lo removieron por su cercanía con Oribe. Ahora vuelve como enviado de Londres, y París también lo acredita: un solo hombre habla por las dos potencias.\n\nTrae siete bases. Cese de hostilidades; desarme de las legiones extranjeras de Montevideo; retiro de las divisiones argentinas; levantamiento del bloqueo con devolución de Martín García y de los buques; el Paraná reconocido como río exclusivamente argentino; amnistía general, menos para los emigrados de Buenos Aires; y veintiún cañonazos a la bandera argentina. Arriba de todo eso, elecciones libres en la República.\n\nRosas las acepta con enmiendas, y Oribe las aprueba el 11 de agosto. Lo que no está escrito en el papel lo dicen los ministros en voz alta: si Montevideo rechaza, Inglaterra y Francia la dejan a su suerte."
 gg_powers.12.f:0 "Una paz que nadie ganó, ofrecida por los que no pelean."
 gg_powers.12.a:0 "Aceptarla, con los retoques de Rosas."
 gg_powers.12.b:0 "No se negocia con los que bloquean."
 gg_powers.13.t:0 "Montevideo y las bases Hood"
 gg_powers.13.d:0 "El Cerrito aceptó. Ahora la propuesta de las potencias está sobre la mesa de la Defensa, y dice lo que dice: cese de hostilidades, elecciones, desarme de los cuerpos extranjeros y retiro de las tropas argentinas.\n\nEn esa cuenta hay una trampa que todos ven. Elecciones con la campaña entera en manos de Oribe son elecciones que gana Oribe; desarmar las legiones es desarmar a la mitad de la guarnición, porque la otra mitad son libertos y guardias nacionales que no aguantan solos la línea.\n\nLondres y París lo dicen sin vueltas: si Montevideo rechaza lo que el Cerrito aceptó, no van a seguir sosteniendo una plaza que rechaza la paz que ellos mismos escribieron. Aceptar es entregar el gobierno con un papel firmado. Rechazar es quedarse solo con la muralla."
 gg_powers.13.f:0 "Aceptar es perder la ciudad por los votos. Rechazar es arriesgarla por el hambre."
 gg_powers.13.a:0 "Aceptar la paz de las potencias."
 gg_powers.13.b:0 "Rechazarla. Montevideo no se entrega por un pliego."
 gg_powers.14.t:0 "Howden y Walewski en el Cerrito"
 gg_powers.14.d:0 "Los mediadores nuevos son #b lord Howden#! y el conde #b Walewski#!, hijo no reconocido de Napoleón. Ninguno de los dos vive en tierra: Howden despacha desde la fragata Raleigh, porque los legionarios extranjeros de la plaza amenazaron con matarlo, y se lo escribe a Palmerston sin vueltas.\n\nSuben al Cerrito y encuentran lo que era previsible. Oribe no firma una paz sin Rosas y no levanta el sitio, pero ofrece cuatro bases: seis meses sin hostilidades, las tropas donde están, mil quinientas cabezas de ganado por mes para la ciudad, y el bloqueo levantado en las dos orillas.\n\nRosas ya les dijo lo que piensa de todo esto: los proyectos de los señores ministros «están tan alejados, son tan diferentes de las bases Hood, como el cielo lo es del infierno». La oferta del Cerrito, en cambio, está sobre la mesa y hay que contestarla."
 gg_powers.14.f:0 "Una tregua es una paz con fecha de vencimiento."
 gg_powers.14.a:0 "Ofrecer la tregua y el ganado."
 gg_powers.14.b:0 "No hay nada que ofrecer sin Rosas."
 gg_powers.15.t:0 "La tregua de Howden"
 gg_powers.15.d:0 "El Cerrito ofrece cuatro bases: seis meses sin hostilidades, las tropas donde están, mil quinientas cabezas de ganado por mes para la plaza, y el bloqueo levantado en las dos orillas.\n\nLord Howden ya dio orden de levantar el bloqueo británico y su colega francés no lo acompaña. De las dos escuadras que sostienen el río, una se va, y el ministro Barreiro contesta lo que piensa el gobierno: sostener los bloqueos «es una de las condiciones de nuestra existencia», y levantarlos «comprometería muy peligrosamente nuestra conservación».\n\nAceptar es comer seis meses y darle seis meses al otro para rehacer caballadas y descansar una tropa que lleva cuatro años de campamento. Rechazar es seguir flaco, con una escuadra menos en el río y la carne del otro lado del foso."
 gg_powers.15.f:0 "Seis meses de carne son seis meses de muralla."
 gg_powers.15.a:0 "Aceptar la tregua."
 gg_powers.15.b:0 "La ciudad no negocia con el sitiador."
 gg_powers.16.t:0 "Gore y Gros"
 gg_powers.16.d:0 "#b Robert Gore#! y el barón #b Gros#! llegaron hace días y no bajaron a tierra: la ciudad no es segura, y el asesinato de Florencio Varela al otro día de su llegada les da la razón. La misión entera se maneja desde los barcos.\n\nEl 20 de abril pasan siete horas en el campamento sitiador. La oferta es para Oribe solo, y está diseñada para separarlo de Rosas: que ocupe la presidencia en Montevideo por el tiempo que le faltó en 1838, con garantía de las potencias. Villademoros contesta por escrito con otras bases: reconocimiento de Oribe como presidente legal, anulación de las confiscaciones «para echar un velo sobre lo pasado», amnistía, y las legiones entregando las armas.\n\nLa respuesta de Buenos Aires llega el 8 de mayo y termina la negociación: «¿Qué clase de mediadores son ésos? No pueden ser mediadores, porque son beligerantes. ¿No han hostilizado a usted? ¿No han cañoneado los puertos de la Confederación Argentina, su aliada?»"
 gg_powers.16.f:0 "La presidencia, a cambio del hombre que la pagó."
 gg_powers.16.a:0 "Aceptar la presidencia y dejar a Rosas."
 gg_powers.16.b:0 "Oribe no se separa del Restaurador."
 gg_powers.16.c:0 "Contestar con cortesías y ganar tiempo."
 gg_powers.17.t:0 "Urquiza y el tratado de Alcaraz"
 gg_powers.17.d:0 "Justo José de Urquiza firmó la paz con Corrientes en Alcaraz, y Rosas no la aprueba: lo que el gobernador de Entre Ríos arregla por su cuenta con una provincia rebelde huele a política propia, y en la Confederación la política propia es traición.\n\nPor canales reservados, Urquiza escucha a Montevideo. No promete nada: pregunta, deja preguntar y mide. Entre Ríos vive del río y de los cueros, y el bloqueo que Rosas sostiene le cierra las dos cosas; el ejército entrerriano es, además, el mejor de la Confederación después del de Buenos Aires.\n\nSi Rosas está fuerte, lo va a retener y esta conversación no existió nunca. Si no lo está, Entre Ríos puede cambiar de lado cuatro años antes de lo que nadie espera, y la guerra se decide en una tarde en la otra orilla."
 gg_powers.17.f:0 "El mejor general de Rosas no es un hombre de Rosas."
 gg_powers.17.a:0 "Ofrecerle la alianza."
 gg_powers.17.b:0 "Es demasiado arriesgado."
 gg_powers.18.t:0 "Los que se van"
 gg_powers.18.d:0 "Francia recorta lo que manda y la ciudad no puede pagar a todos. Los voluntarios vascos que vinieron con la Legión Francesa se están pasando a Buenos Aires, donde hay trabajo y no hay ración de sitio, y la emigración se lleva mes a mes lo que la muralla necesita.\n\nGaribaldi prepara el regreso a Italia: en 1848 le estalló la revolución en su casa, y el marino de Niza que armó una legión en el Plata va a pelear la suya. Con él se van los que lo siguieron, que nunca fueron muchos y ahora son menos de la mitad de los setecientos del mejor momento.\n\nSe puede retener a algunos pagando caro, o dejarlos ir y quedarse con una guarnición más chica y más barata. Ninguna de las dos cosas devuelve lo que se va: los legionarios que quedan son, cada vez más, gente que ya no tiene a dónde volver."
 gg_powers.18.f:0 "Una legión es quien esté dispuesto a pararse en ella."
 gg_powers.18.a:0 "Retener a los italianos."
 gg_powers.18.b:0 "Retener a los vascos."
 gg_powers.18.c:0 "Que se vayan. La muralla la sostienen los de acá."
 gg_powers.19.t:0 "Inglaterra se va"
 gg_powers.19.d:0 "El 24 de noviembre, a las dos y media de la tarde, #b Felipe Arana#! y el ministro británico #b Henry Southern#! firman en Buenos Aires. Southern había esperado quince postergaciones para presentar credenciales, porque Rosas no negociaba sobre otra cosa que no fueran las bases Hood.\n\nEl tratado reconoce la soberanía argentina sobre sus ríos y el derecho de la Confederación a arreglar su cuestión con la República sin intervención extranjera, incluido el derecho de bloquear. Gran Bretaña evacúa Martín García, devuelve los buques de guerra que tomó en 1845 y saluda la bandera argentina con veintiún cañonazos.\n\nPara la ciudad no es un tratado entre terceros: es el retiro de la potencia que sostuvo el puerto abierto durante seis años. Francia sigue, por ahora, y la Defensa tiene que decidir si compra tiempo o si acepta que el mar dejó de ser suyo."
 gg_powers.19.f:0 "Los aliados también firman tratados."
 gg_powers.19.a:0 "Mandar a Pacheco y Obes a París."
 gg_powers.19.b:0 "Que Lamas le pida al Imperio."
 gg_powers.19.c:0 "Aguantar solos."
 gg_powers.21.t:0 "Renunciar al subsidio"
 gg_powers.21.d:0 "El subsidio francés viene de la convención del 12 de junio de 1848: cuarenta mil pesos por mes, adelantados por el cónsul y cubiertos después por la Asamblea, para compensar a la ciudad por el levantamiento del bloqueo. París nunca lo negó: lo votó cuatro veces, y siempre por goleada, quinientos treinta contra veintiséis la más peleada.\n\nCobrarlo es otra cosa. Cada mes el consulado retiene las letras para sacar alguna concesión, y hace dos años que la plaza vive de esa negociación humillante. Mármol lo escribe en su diario sin vueltas: «Cada mes ha sido una cuestión la entrega.»\n\nAhora el Brasil se decidió y Urquiza se pronunció. Renunciar al subsidio es quedarse sin la única entrada segura de la caja, pero también es sacarle a la Asamblea francesa el argumento del gasto inútil justo cuando va a votar sobre el Plata, y presentarse ante los aliados nuevos como un gobierno que no vive de limosna."
 gg_powers.21.f:0 "«Cada mes ha sido una cuestión la entrega.» — José Mármol"
 gg_powers.21.a:0 "Renunciar al subsidio y jugarse a los aliados nuevos."
 gg_powers.21.b:0 "Seguir cobrándolo mientras dure."
 gg_powers.23.t:0 "Se pasan los jefes"
 gg_powers.23.d:0 "Urquiza cruzó el Uruguay. En Paysandú se le suma #b Servando Gómez#!, comandante militar del departamento y uno de los dos jefes entre los que el Cerrito dividió el país, y detrás van Lucas Píriz y otros oficiales hartos de una guerra sin fin.\n\nLas tropas de Ignacio Oribe desertan en masa. No es una derrota: es un ejército que deja de existir porque la gente se vuelve a su casa, y el gobierno del Cerrito se queda con once mil hombres en los papeles y con mucho menos en el campo.\n\nQuedan tres caminos: pelear con lo que haya, pedir condiciones mientras todavía se pueda pedir algo, o pedirle a las escuadras una garantía para embarcar a los argentinos y terminar esto sin que nadie cuelgue a nadie."
 gg_powers.23.f:0 "Nueve años de sitio, y el sitio se deshace en un mes."
 gg_powers.23.a:0 "Pelear con lo que queda."
 gg_powers.23.b:0 "Mandar a Lucas Moreno ante Urquiza."
 gg_powers.23.c:0 "Pedir la garantía naval para irse con los argentinos."
 gg_powers.24.t:0 "La crisis de la Defensa"
 gg_powers.24.d:0 "Inglaterra se fue, y un golpe así cambia quién manda adentro de la muralla. De un lado están los doctores del gobierno de Suárez, con Herrera y Obes a la cabeza, que quieren negociar con quien haga falta y sostienen que la ciudad se salva por la diplomacia o no se salva.\n\nDel otro están los jefes militares que siguen a Rivera y a Flores, que no quieren oír hablar de condiciones mientras quede un batallón formado. Vienen de una guerra de caballos y no entienden una plaza que se defiende con notas.\n\nDarle el gobierno a uno de los dos bandos ahora tiene un costo. Con los doctores arriba, la paz de las potencias sale más barata y la posguerra es más civil; con los caudillos, la plaza aguanta más tiempo y el que cede después cede peor."
 gg_powers.24.f:0 "Dentro de la muralla también hay dos gobiernos."
 gg_powers.24.a:0 "Seguir como estamos."
 gg_powers.24.b:0 "Darle el gobierno al otro bando."
 gg_powers.25.t:0 "España firma y no ratifica"
 gg_powers.25.d:0 "La antigua metrópoli todavía no reconoce a la República. Hubo un tratado firmado en París en 1841 y hay otro, ampliado, firmado en Montevideo el 26 de marzo de 1846, con el encargado de negocios #b Carlos Creus#!, que vino a hacerse cargo de un consulado dentro de una ciudad sitiada.\n\nMadrid no ratifica ninguno de los dos. La razón no es la deuda colonial ni el orgullo: es que en la República hay dos gobiernos, y firmar con uno solo es tomar partido contra el otro y quedar mal con el que gane la guerra.\n\nMientras tanto el papel existe, y un papel firmado se puede mostrar. En Londres y en París sirve para decir que la Defensa es un Estado que trata de igual a igual con la corona de España; en Buenos Aires, para recordarle a Rosas que la independencia que él discute ya la reconocieron en Europa."
 gg_powers.25.f:0 "España firma, y se guarda la ratificación para el que gane."
 gg_powers.25.a:0 "Mostrarlo en Londres y en París."
 gg_powers.25.b:0 "Mostrarlo en Buenos Aires."
 gg_powers.26.t:0 "Florencio Varela"
 gg_powers.26.d:0 "La noche del lunes matan a #b Florencio Varela#! en la calle Misiones, de una puñalada por la espalda, a pocos pasos de su puerta. Es el director de #b El Comercio del Plata#!, el hombre al que la Defensa mandó a Londres y a París a pedir la intervención, y el que más fuerte escribió para que no se negocie con Rosas.\n\nEl matador es #b Andrés Cabrera#!, canario, analfabeto, que no conocía a Varela de vista: alguien se lo señaló desde las sombras, y a ese nadie lo detuvo. Cabrera huye del lado sitiador. La prensa de la ciudad ya tiene culpable y lo grita: Oribe, Rosas, o los dos.\n\nEl ministro Herrera y Obes le escribe a Lamas otra cosa, en privado: el asesino escapó al Buceo «y tiene cómplices aquí de levita». Nadie probó nunca quién le pagó, y la ciudad va a discutirlo durante un siglo y medio."
 gg_powers.26.f:0 "Un muerto le sirve a todos los que lo nombran."
 gg_powers.26.a:0 "Fue Rosas. Que Europa lo sepa."
 gg_powers.26.b:0 "Que se investigue antes de acusar."
 gg_powers.28.t:0 "Las exequias de Larrañaga"
 gg_powers.28.d:0 "Murió el presbítero #b Dámaso Antonio Larrañaga#!, el hombre que fundó la Biblioteca, redactó las instrucciones del año XIII y puso la ley que mandó crear las primeras cátedras de la República. Tenía ochenta y seis años, estaba ciego, y hacía tiempo que vivía retirado en su quinta del Miguelete.\n\nLa quinta está del lado de afuera de la muralla, en campo de Oribe. Lo entierran ahí mismo, en el oratorio de su chacra, con honores del Cerrito, y #b El Defensor de la Independencia Americana#! publica una necrológica de Villademoros que es la primera biografía del vicario.\n\nAdentro de la ciudad no pueden llegar al cuerpo, así que la Defensa hace sus propias exequias y lo declara #b general de la República#!. Dos gobiernos que no se ponen de acuerdo en nada firman, cada uno por su lado, el mismo duelo."
 gg_powers.28.f:0 "Dos entierros para un solo hombre, uno de cada lado del foso."
 gg_powers.28.a:0 "Usar el duelo para tantear una paz entre orientales."
 gg_powers.28.b:0 "Respetar el duelo, y nada más."
 gg_powers.29.t:0 "La nueva Troya"
 gg_powers.29.d:0 "Melchor Pacheco y Obes volvió de París con poco más que buenas palabras y un libro. Alejandro Dumas escribió sobre esta ciudad como una nueva Troya: nueve años de sitio, una plaza que no cae, y del otro lado un asedio que en el relato francés se parece bastante al de Homero.\n\nNo es historia y nadie en Montevideo cree que lo sea. Es propaganda escrita por el novelista más leído de Europa, encargada por un gobierno que necesita que París siga mirando para acá cuando la Asamblea vote lo que va a mandar.\n\nDifundirlo cuesta plata que la aduana no tiene. Lo que compra no es un batallón ni un subsidio: es tiempo, en la única moneda que la Defensa todavía maneja bien, que es la opinión europea."
 gg_powers.29.f:0 "Una ciudad sitiada también se defiende con novelas."
 gg_powers.29.a:0 "Que se lea en toda Francia."
 gg_powers.29.b:0 "La plata hace más falta en la muralla."
 gg_powers.31.t:0 "Se abre la Universidad"
 gg_powers.31.d:0 "El 18 de julio, aniversario de la Constitución, se inaugura en la capilla de San Ignacio la #b Universidad Mayor de la República#!. La ciudad está sitiada, come de la ración y acaba de perder el apoyo británico; abre una universidad igual.\n\nNo la fundan hoy: la fundó el decreto del 27 de mayo de 1838, firmado por #b Manuel Oribe#!, sobre la ley que Larrañaga hizo votar en 1833. El decreto de Suárez de hace cuatro días manda cumplir aquel decreto y aquella ley. La universidad que inaugura la Defensa la creó, en papel, el hombre que la está sitiando.\n\nDe las cuatro facultades del reglamento solo va a funcionar Jurisprudencia, con unos sesenta estudiantes. El primer rector es el presbítero Lorenzo Fernández, vicario apostólico y sucesor de Larrañaga; el patrono es el ministro Herrera y Obes, que va a ser rector él mismo al año siguiente."
 gg_powers.31.f:0 "18 de julio de 1849, en una ciudad que come de la ración."
 gg_powers.31.a:0 "Con ceremonia."
 gg_powers.31.b:0 "Sin ceremonia."
 gg_rivera.7.t:0 "Mercedes y Paysandú"
 gg_rivera.7.d:0 "Rivera está otra vez en la campaña y quiere pelear: el litoral está a su alcance, y Mercedes y Paysandú se pueden tomar. Herrera y Obes preferiría que se quedara cubriendo Maldonado mientras él negocia en secreto. Y hay quien dice que Rivera ya le escribe a Oribe."
 gg_rivera.7.f:0 "Diciembre de 1846."
 gg_rivera.7.a:0 "Que tome el litoral."
 gg_rivera.7.b:0 "Que cubra Maldonado y deje negociar."
 gg_rivera.7.c:0 "Que hable con Oribe, entre orientales."
 gg_peace.6.t:0 "La paz de las potencias"
 gg_peace.6.desc:0 "Los dos gobiernos aceptaron las bases de Londres y de París. Se deponen las armas, los extranjeros de Montevideo entregan las suyas, los argentinos vuelven a su orilla y hay amnistía para todos. Queda una sola República, y la elección decide quién la gobierna."
 gg_peace.6.flav:0 "Nadie ganó la guerra. Alguien va a ganar la elección."
 gg_peace.6.a:0 "Que voten los orientales."
 gg_peace.7.t:0 "Oribe, presidente"
 gg_peace.7.desc:0 "Oribe aceptó la oferta de Gore y Gros: termina su período en Montevideo con la garantía de las potencias, y la Defensa se disuelve en paz. En Buenos Aires, Rosas no perdona: el lugarteniente se fue, y la Confederación queda enemistada con la República."
 gg_peace.7.flav:0 "Una presidencia recuperada, un protector perdido."
 gg_peace.7.a:0 "Gobernar con la garantía europea."
 gg_peace.7.b:0 "Gobernar y convocar a elecciones."
 gg_powers_ships_lost:0 "Barcos perdidos ante los británicos"
 gg_powers_specie_drain:0 "El metálico se va de la ciudad"
 gg_powers_american_cause:0 "La causa americana"
 gg_powers_hardened:0 "Las potencias, en contra"
 gg_truce_cattle:0 "Ganado para la ciudad"
 gg_line_change:0 "La Defensa cambia de manos"
 gg_university_inaugurated:0 "La Universidad Mayor"
 gg_peace_powers_tutelage:0 "La paz de las potencias"
 gg_peace_european_guarantee:0 "La garantía europea"
 guerra_grande_requires_brown_fleet:0 "Sin la escuadra de Brown no hay bloqueo hasta 1850."
 gg_powers_ships_lost_desc:0 "La escuadra de Brown quedó en manos británicas y francesas, y con ella el bloqueo."
 gg_powers_specie_drain_desc:0 "La ciudad comercia con la campaña y paga en metálico: la plata se va por los portones."
 gg_powers_american_cause_desc:0 "Frente a las escuadras europeas, la Confederación se presenta como la defensa de América."
 gg_powers_hardened_desc:0 "Londres y París tomaron el rechazo como una afrenta, y lo cobran."
 gg_truce_cattle_desc:0 "La tregua de Howden deja entrar ganado a la plaza."
 gg_line_change_desc:0 "El gobierno de la Defensa pasó de un bando a otro en plena guerra, y lo paga en desorden."
 gg_university_inaugurated_desc:0 "La Universidad Mayor de la República abrió sus puertas el 18 de julio de 1849."
 gg_peace_powers_tutelage_desc:0 "La paz la escribieron Londres y París, y la vigilan."
 gg_peace_european_guarantee_desc:0 "La presidencia de Oribe descansa en la garantía de las potencias, no en la de Rosas."
 gg_powers.32.d:0 "#b Andrés Lamas#! está en Río de Janeiro desde noviembre de 1847 pidiendo lo mismo una y otra vez: que el Imperio entre. El Imperio pagó por debajo —los préstamos de Mauá, los adelantos secretos— y no se movió, porque una intervención abierta le costaba la neutralidad que le servía.\n\nAhora la respuesta llega con condiciones. El Brasil puede entrar antes y con todo, pero a cambio quiere tratados: alianza con derecho a intervenir, límites, comercio, extradición y un subsidio garantizado con la aduana de la República.\n\nLamas escribe que Londres intenta frenar al Imperio y llega tarde. Puede tener razón. Lo que también es cierto es que el que financia una guerra ajena termina decidiendo cómo se firma la paz, y esta vez lo va a decidir por escrito."
