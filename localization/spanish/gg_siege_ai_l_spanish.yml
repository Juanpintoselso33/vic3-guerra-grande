l_spanish:
 gg_siege_line:0 "Línea de sitio"
 gg_siege_line_gerund:0 "Sosteniendo la línea de sitio"
 gg_siege_line_desc:0 "Mantener la línea frente a la plaza sin lanzarse contra sus muros: el campamento del Cerrito, atrincherado y abastecido por toda la campaña, espera a que el hambre haga lo que los cañones que faltan no pueden. Solo durante el Gran Sitio, en el frente de Montevideo."
 gg_siege_line_tooltip:0 "#header $gg_siege_line$#!"
 gg_siege_walls:0 "Defensa de las murallas"
 gg_siege_walls_gerund:0 "Defendiendo las murallas"
 gg_siege_walls_desc:0 "Sostener la línea de la plaza con la ciudad a la espalda. Solo durante el Gran Sitio, en el frente de Montevideo."
 gg_siege_walls_tooltip:0 "#header $gg_siege_walls$#!"
 gg_siege_behind_the_walls:0 "Detrás de las murallas"
 gg_siege_behind_the_walls_desc:0 "Este general pelea en el frente de Montevideo, amparado por la línea fortificada de la plaza."
 gg_siege_without_breaching_guns:0 "Sin cañones de brecha"
 gg_siege_without_breaching_guns_desc:0 "Este general está frente a la plaza sin artillería de sitio: sus asaltos contra la muralla rinden la mitad."
 gg_ai_strategy_cerrito_siege:0 "Sostener el sitio"
 gg_ai_strategy_cerrito_siege_desc:0 "[COUNTRY.GetName] evita otras guerras mientras la plaza siga en pie: todo el esfuerzo está en la línea del Cerrito."
