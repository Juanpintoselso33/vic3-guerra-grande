l_spanish:
 gg_tt_endurance_defensa_5:0 "Aguante de #R la Defensa#!: #P +5#!"
 gg_tt_endurance_cerrito_5:0 "Aguante del #blue_value Cerrito#!: #P +5#!"
 gg_notice.1.t:0 "La Convención del 29 de mayo"
 gg_notice.1.d:0 "En Montevideo firman tres hombres: el encargado de negocios del Imperio, #b Rodrigo de Souza da Silva Pontes#!; nuestro ministro de Gobierno y Relaciones Exteriores, #b Manuel Herrera y Obes#!; y por el Estado de Entre Ríos, #b Antonio Cuyás y Sampere#!. El artículo I dice para qué: una alianza ofensiva y defensiva «haciendo salir del territorio de esta al General D. Manuel Oribe y las fuerzas argentinas que manda», y después, «restituidas las cosas a su estado normal», la elección libre del Presidente según la Constitución.\n\nEl precio también está escrito. El artículo V deja a las fuerzas del Imperio cuidar personas y propiedades «hasta una distancia de veinte leguas dentro del Estado Oriental». El XIX obliga a este gobierno a nombrar general en jefe a #b Eugenio Garzón#!, «así que dicho General haya reconocido en el Gobierno de Montevideo al Gobierno de la República». El XXI le deja al presidente que se elija el deber de celebrar con el Imperio «todos los ajustes y convenciones» que falten.\n\nEl XXIV manda que el convenio «se conservará secreto hasta que se consiga el fin a que se dirige». Ocho años de sitio se terminan, si se terminan, con un papel que la ciudad todavía no puede leer. Queda decidir cómo se lo cumple: contar con que el ejército del Imperio marche hacia la frontera, como promete el artículo IV, o traer a los emigrados que pide el VII, «por cuenta de la República»."
 gg_notice.1.f:0 "Veinticuatro artículos, y el último manda que nadie los lea."
 gg_notice.1.a:0 "Que el Imperio marche hacia la frontera, como dice el artículo IV."
 gg_notice.1.a_tt:0 "@information! La Defensa confía el fin del sitio al ejército del Imperio: la ciudad ve el final, y el #b Brasil#! pesa más en la paz que venga."
 gg_notice.1.b:0 "Que vuelvan los emigrados, por cuenta de la República."
 gg_notice.1.b_tt:0 "@information! La aduana paga #N 20.000#! en pasajes y equipo para los emigrados; los orientales que vuelven a las armas cuentan a favor de la Defensa en la mesa, sin deberle más al Imperio."
 gg_notice.2.t:0 "El ejército del Imperio cruza"
 gg_notice.2.d:0 "El Conde de #b Caxias#! cruza por Santana con 16.200 hombres en cuatro divisiones: 6.500 de infantería, 8.900 de caballería, 800 artilleros, veintiséis cañones. Es lo que el Imperio firmó en mayo, en el artículo IV de la Convención: que su ejército marcharía hacia la frontera «para entrar en acción sobre el territorio de la República cuando sea necesario».\n\nEl artículo VI ponía a los aliados bajo el mando del general en jefe oriental, salvo que sus fuerzas fueran más que las nuestras. Lo son: dieciséis mil hombres no caben bajo ningún general de esta ciudad, y el mismo artículo lo prevé. Los manda un jefe de su nación, que tiene que «ponerse de acuerdo con el general del ejército oriental» para dirigir la guerra.\n\nEl artículo V le da además al Imperio veinte leguas de frontera para proteger a los brasileños «contra los robos, asesinatos y tropelías». Se puede dejar que ese ejército entre con todo y acorte la guerra, o pedirle que se atenga a su franja y deje la campaña a los orientales y a Entre Ríos."
 gg_notice.2.f:0 "Dieciséis mil hombres no esperan órdenes del general en jefe."
 gg_notice.2.a:0 "Que entre el Ejército Aliado."
 gg_notice.2.a_tt:0 "@battalions! El Ejército Aliado entra en la campaña oriental y se suma a las fuerzas del sitio; el #b Brasil#! gana peso en la Defensa."
 gg_notice.2.b:0 "Que el Imperio se atenga a sus veinte leguas."
 gg_notice.2.b_tt:0 "@information! La campaña queda en manos orientales y entrerrianas: el golpe al Cerrito es menor, y el #b Brasil#! pesa menos en la Defensa."
 gg_notice.10.t:0 "La respuesta de la plaza"
 gg_notice.10.d:0 "Llega la contestación de la plaza a las cuatro bases que el Presidente aceptó: seis meses sin hostilidades, las tropas donde están, mil quinientas cabezas de ganado por mes para Montevideo y el bloqueo levantado en las dos orillas. El ministro #b Barreiro#! dice que no: sostener los bloqueos «es una de las condiciones de nuestra existencia».\n\nEse mismo día #b lord Howden#! levanta el bloqueo británico, en las dos orillas. El conde #b Walewski#! se niega a levantar el francés, y la alianza de las dos potencias que cerró el río se parte en la rada.\n\nPara el campamento es la primera escuadra que se va. Quedan los franceses, y queda la plaza, que prefirió seguir flaca antes que darnos seis meses de descanso."
 gg_notice.10.d_truce:0 "La plaza acepta las cuatro bases que el Presidente ofreció: seis meses sin hostilidades, las tropas donde están, mil quinientas cabezas de ganado por mes para Montevideo y el bloqueo levantado en las dos orillas.\n\n#b Lord Howden#! ya levantó el bloqueo británico, en las dos orillas. El conde #b Walewski#! se niega a levantar el francés, y la alianza de las dos potencias que cerró el río se parte en la rada.\n\nPara el campamento son seis meses sin tiros para rehacer las caballadas y descansar una tropa que lleva años en la línea. La carne que come la ciudad sale de nuestras estancias."
 gg_notice.10.f:0 "Una escuadra se va; la otra se queda."
 gg_notice.10.a:0 "Que se sepa en el campamento."
 gg_notice.11.t:0 "La noche de la calle Misiones"
 gg_notice.11.d:0 "La noche del lunes 20 de marzo matan en la calle Misiones a #b Florencio Varela#!, el director de #b El Comercio del Plata#!, el hombre que la plaza mandó a Londres y a París a pedir la intervención. Una puñalada por la espalda, a pocos pasos de su puerta.\n\nEl matador es #b Andrés Cabrera#!, canario y analfabeto, que no lo conocía de vista: alguien se lo señaló desde las sombras. Cabrera huyó hacia nuestras líneas, y la prensa de la ciudad ya tiene culpable: Oribe, Rosas, o los dos.\n\nPasa en la semana en que llegaron los mediadores #b Gore#! y #b Gros#!, que no bajan a tierra y manejan todo desde los barcos. Lo que conteste el Cerrito lo van a leer ellos antes que nadie."
 gg_notice.11.f:0 "Un puñal en la calle Misiones, y un culpable en cada diario."
 gg_notice.11.a:0 "Que conteste #b El Defensor de la Independencia Americana#!."
 gg_notice.11.b:0 "Buscar a Cabrera y ponerlo ante un juez."
 gg_notice.11.b_tt:0 "@information! El campamento no quiere entregar a uno de los suyos, pero los mediadores ven un gobierno que no tapa un crimen: #b Francia#! respalda menos a la Defensa."
 gg_notice.12.t:0 "Gros y el Buceo"
 gg_notice.12.d:0 "En junio el barón #b Gros#!, el vicealmirante #b Le Prédour#! y el encargado de negocios #b Devoize#! firman con el gobierno de la plaza un convenio de prestación de socorros: cuarenta mil pesos por mes, «en dinero o en letras sobre Francia», a título de préstamo. Es el precio del bloqueo francés, que Gros da por terminado: Francia deja el puerto de Rosas y los nuestros, y le paga a Montevideo para que la ciudad no lo sienta.\n\nEl 14 la guarnición de la plaza abandona #b Maldonado#! a bordo de vapores franceses, y frente al Buceo ya no queda buque enemigo. El capitán del puerto, #b Joaquín Idoyaga#!, eleva el primer caso: la sumaca brasileña #b Delmira#! dice venir de Río Grande y trae géneros de Montevideo. El Cuartel General contesta lo de siempre: que salga sin operar, y que se le anote en sus papeles la prohibición de entrar en cualquier otro punto de nuestras costas.\n\nPero el campo sostiene un ejército de más de catorce mil hombres y un pueblo, la Restauración, que no para de crecer. Un Buceo abierto a toda bandera, venga de donde venga, llena la aduana; Buenos Aires, que en los puertos de la Confederación le exige fianza por el duplo del cargamento a todo lo que sale de Montevideo, lo va a llamar comercio con el enemigo. Un Buceo cerrado a lo que tocó la plaza deja que el sitio siga siendo sitio."
 gg_notice.12.f:0 "Francia se va del río y se queda en la caja; frente al Buceo no queda un centinela."
 gg_notice.12.a:0 "Que entre toda bandera, venga de donde venga."
 gg_notice.12.a_tt:0 "@information! La aduana del Buceo cobra también lo que pasó por la plaza, y el campo vive de ella: el #blue_value Cerrito#! recobra #P +3#! de aguante por mes durante #V 36#! meses. Los consignatarios de la plaza también ganan, y Buenos Aires lo toma como comercio con el enemigo."
 gg_notice.12.b:0 "Que salga todo buque que haya tocado la plaza."
 gg_notice.12.b_tt:0 "@information! El sitio sigue siendo sitio: nada de lo que entra por el Buceo le deja un peso a Montevideo. Buenos Aires lo aprueba."
 gg_notice.13.t:0 "Arana y Southern"
 gg_notice.13.d:0 "En Buenos Aires firman el ministro #b Felipe Arana#! y el ministro británico #b Henry Southern#!, que esperó quince postergaciones para presentar credenciales. Gran Bretaña evacúa Martín García, devuelve los buques de guerra que tomó y saluda la bandera argentina con veintiún cañonazos.\n\nLo que importa en el Cerrito está en otras cláusulas. El tratado reconoce el derecho de la Confederación a arreglar su cuestión con la República sin intervención extranjera, incluido el derecho de bloquear; y el artículo sexto dice que Buenos Aires firmó solo con la conformidad previa de su aliado, el presidente #b Oribe#!: «una condición indispensable en todo arreglo». Esa conformidad ya está dada.\n\nQueda el artículo tercero: las divisiones auxiliares argentinas «repasarán el Uruguay cuando el gobierno francés desarme a la legión extranjera» y a los demás extranjeros en armas de la plaza. Esperar a París es seguir con los batallones de Rosas en el campo; pedirle a Buenos Aires que se los lleve ya es que la República pelee sola."
 gg_notice.13.f:0 "Veintiún cañonazos para una bandera que Londres quiso cerrar."
 gg_notice.13.a:0 "Conforme, como aliado: las divisiones se quedan."
 gg_notice.13.a_tt:0 "@information! Buenos Aires lo agradece, y las divisiones siguen en el campo."
 gg_notice.13.b:0 "Conforme, y que las divisiones repasen el Uruguay ya."
 gg_notice.13.b_tt:0 "@warning! Las divisiones auxiliares vuelven a la otra orilla, y con ellas el aguante que le daban al #blue_value Cerrito#! (#P +2#! por mes). La República pelea sola y la balanza lo anota; Buenos Aires lo toma a mal."
 gg_notice.14.t:0 "El litoral después de San Antonio"
 gg_notice.14.d:0 "En agosto la plaza resolvió «reconquistar todos los puertos del Uruguay». Con las escuadras de la intervención tomó la #b Colonia#!, Martín García y Gualeguaychú, y después el #b Salto#!, que la guarnición le dejó sin pelear. #b Urquiza#!, de vuelta de India Muerta, atacó el Salto a principios de diciembre con tres mil jinetes, no lo pudo tomar y siguió a Corrientes, adonde lo mandaba Rosas; ahora está otra vez en Entre Ríos, del otro lado del río.\n\nEl 8 de febrero, en San Antonio, #b Servando Gómez#! salió con mil doscientos hombres —un tercio de infantería, y con ellos el batallón de Patricios de Buenos Aires— a cortarle el paso a #b Medina#!, que bajaba de la frontera con trescientos para reforzar el Salto. #b Garibaldi#! lo cubrió con unos doscientos legionarios y cien jinetes de Báez: la caballería volvió al Salto y la infantería aguantó de las doce a las nueve de la noche. El parte de Gómez vino fechado «en el campo de la Victoria de San Antonio del Uruguay», y el diario del campamento escribió que «el salvaje pirata Garibaldi se ha librado apenas de quedar tendido como los más de sus soldados». Pero Medina entró al Salto, y la plaza mandó poner en la bandera de la legión: «Invencibles, combatieron el 8 de febrero de 1846».\n\nEn la plaza celebran San Antonio. Arriba del Río Negro manda #b Gómez#!; abajo, #b Ignacio Oribe#!. Se pueden juntar las dos divisiones sobre el litoral, con la línea del sitio más delgada; se puede sostener la línea y dejarle el río a la plaza por ahora; o se le puede pedir a Rosas una división que cruce el Uruguay."
 gg_notice.14.d_legion:0 "En agosto la plaza resolvió «reconquistar todos los puertos del Uruguay». Con las escuadras de la intervención tomó la #b Colonia#!, Martín García y Gualeguaychú, y después el #b Salto#!, que la guarnición le dejó sin pelear. #b Urquiza#!, de vuelta de India Muerta, atacó el Salto a principios de diciembre con tres mil jinetes, no lo pudo tomar y siguió a Corrientes, adonde lo mandaba Rosas; ahora está otra vez en Entre Ríos, del otro lado del río.\n\nEl 8 de febrero, en San Antonio, #b Servando Gómez#! salió con mil doscientos hombres —un tercio de infantería, y con ellos el batallón de Patricios de Buenos Aires— a cortarle el paso a #b Medina#!, que bajaba de la frontera con trescientos para reforzar el Salto. La legión italiana de la plaza lo cubrió con unos doscientos hombres y cien jinetes de Báez: la caballería volvió al Salto y la infantería aguantó de las doce a las nueve de la noche. El parte de Gómez vino fechado «en el campo de la Victoria de San Antonio del Uruguay». Pero Medina entró al Salto, y la plaza mandó poner en la bandera de la legión: «Invencibles, combatieron el 8 de febrero de 1846».\n\nEn la plaza celebran San Antonio. Arriba del Río Negro manda #b Gómez#!; abajo, #b Ignacio Oribe#!. Se pueden juntar las dos divisiones sobre el litoral, con la línea del sitio más delgada; se puede sostener la línea y dejarle el río a la plaza por ahora; o se le puede pedir a Rosas una división que cruce el Uruguay."
 gg_notice.14.d_nolegion:0 "En agosto la plaza resolvió «reconquistar todos los puertos del Uruguay». Con las escuadras de la intervención tomó la #b Colonia#!, Martín García y Gualeguaychú, y después el #b Salto#!, que la guarnición le dejó sin pelear. #b Urquiza#!, de vuelta de India Muerta, atacó el Salto a principios de diciembre con tres mil jinetes, no lo pudo tomar y siguió a Corrientes, adonde lo mandaba Rosas; ahora está otra vez en Entre Ríos, del otro lado del río.\n\nEl 8 de febrero, en San Antonio, #b Servando Gómez#! salió con mil doscientos hombres —un tercio de infantería, y con ellos el batallón de Patricios de Buenos Aires— a cortarle el paso a #b Medina#!, que bajaba de la frontera con trescientos para reforzar el Salto. El parte de Gómez vino fechado «en el campo de la Victoria de San Antonio del Uruguay». Pero Medina entró al Salto.\n\nEn la plaza celebran San Antonio. Arriba del Río Negro manda #b Gómez#!; abajo, #b Ignacio Oribe#!. Se pueden juntar las dos divisiones sobre el litoral, con la línea del sitio más delgada; se puede sostener la línea y dejarle el río a la plaza por ahora; o se le puede pedir a Rosas una división que cruce el Uruguay."
 gg_notice.14.f:0 "Del Salto a Montevideo, un campo que se dice victorioso y una bandera que se dice invencible."
 gg_notice.14.a:0 "Juntar las dos divisiones sobre el litoral."
 gg_notice.14.a_tt:0 "@information! Hombres de la línea del sitio bajan al río: el litoral le deja de rendir a la plaza, y el campo lo paga en aguante."
 gg_notice.14.b:0 "Sostener la línea y dejarle el río a la plaza, por ahora."
 gg_notice.14.b_tt:0 "@information! El sitio no afloja un hombre y el campo descansa; el litoral queda en manos de la plaza, y la balanza lo anota a favor de los colorados."
 gg_notice.14.c:0 "Pedirle a Rosas una división."
 gg_notice.14.c_tt:0 "@information! Una división de Buenos Aires cruza el Uruguay: el campo respira y la balanza lo anota a favor de los blancos; Rosas se cobra el favor."
 gg_notice.15.t:0 "Las escuelas de la Restauración"
 gg_notice.15.d:0 "El 18 de julio la plaza inauguró en la capilla de San Ignacio su Universidad Mayor, con el decreto que el presidente #b Oribe#! firmó en 1838 como partida de nacimiento. Del otro lado de la muralla hacen universidad con la firma de este gobierno.\n\nAcá las escuelas se hicieron con lo que había. En 1843 #b Ramón Massini#! abrió el Colegio Uruguayo; los primeros bancos de la escuela de #b José María Cordero#! fueron tablones de la Maestranza, barricas llenas de piedra y arena y cajones de pólvora, y entre los niños se sentaban mocetones del ejército. En la Restauración está el colegio que el presidente mandó construir y que dirige #b Cayetano Rivas#!; en 1846 Mercedes tuvo maestro a veinticinco pesos por mes, con la escuela bajo la inspección del cura, para inspirar a los niños «el amor patrio y apego á las instituciones republicanas que nos rigen».\n\n#b El Defensor#! tiene la pluma lista, como la tuvo en 1847 para el Instituto de Instrucción Pública de la plaza. También se puede contestar con escuelas: que cada pueblo del Estado tenga la suya, con su maestro pago, y que una comisión de hombres de letras las dirija."
 gg_notice.15.f:0 "Una universidad adentro de la muralla; bancos de cajones de pólvora afuera."
 gg_notice.15.a:0 "Que cada pueblo tenga su escuela, y una comisión que las dirija."
 gg_notice.15.a_tt:0 "@information! Maestros pagos y escuelas bajo la inspección del cura en los pueblos del Estado: el gobierno gana legitimidad y la Iglesia lo aprueba. Sale de la caja."
 gg_notice.15.b:0 "Contestarles desde El Defensor."
 gg_notice.15.b_tt:0 "@warning! No cuesta un peso; una polémica en lugar de escuelas no les gusta a los intelectuales."
 gg_arg_notice.1.t:0 "Se vino el Patrón"
 gg_arg_notice.1.d:0 "Señor gobernador: #b Fructuoso Rivera#! desembarcó en Montevideo. El Imperio lo tenía preso en Río, acusado de conspirar con los republicanos riograndenses; el gobierno de la plaza lo nombró su representante en el Paraguay para tenerlo lejos, el Brasil le negó el permiso para viajar a Asunción y lo embarcó en la goleta #b Perla#!.\n\nLa plaza le prohibió bajar. El 1 de abril se sublevaron el batallón de vascos, los libertos de la infantería y las fuerzas de #b César Díaz#! y #b Venancio Flores#!; #b Pacheco y Obes#! dejó la comandancia de armas y se embarcó para Europa, y el gobierno anuló el destierro. Rivera bajó del brazo de su mujer, y hoy es general en jefe del Ejército de Operaciones y gran mariscal de la República.\n\nVuelve a la campaña, y la campaña oriental mira a Entre Ríos por todo el río Uruguay. Queda decidir si vigilar esa costa es cosa de la Confederación o del presidente #b Oribe#!."
 gg_arg_notice.1.f:0 "El gobierno que lo desterró lo hizo gran mariscal en dos semanas."
 gg_arg_notice.1.a:0 "Que la caballería de Entre Ríos vigile la costa del Uruguay."
 gg_arg_notice.1.a_tt:0 "@information! La vigilancia cuesta #N 10.000#! a la caja, y Buenos Aires queda más atada a la suerte del Cerrito."
 gg_arg_notice.1.b:0 "Es asunto del presidente Oribe."
 gg_arg_notice.2.t:0 "Se va una escuadra"
 gg_arg_notice.2.d:0 "Señor gobernador: #b lord Howden#! levantó el bloqueo británico, en esta orilla y en la otra. Lo hizo el mismo día en que el gobierno de Montevideo rechazó las cuatro bases que el presidente #b Oribe#! había aceptado, y que pedían, entre otras cosas, el bloqueo levantado en las dos orillas.\n\nEl conde #b Walewski#! se negó a acompañarlo: el bloqueo francés sigue, y la alianza de las dos potencias en el Plata quedó rota en la rada de Montevideo.\n\nLos buques de bandera inglesa pueden volver a las balizas de Buenos Aires. Pesa en la aduana; no decide la guerra."
 gg_arg_notice.2.d_truce:0 "Señor gobernador: el gobierno de Montevideo aceptó las cuatro bases que el presidente #b Oribe#! había ofrecido: seis meses sin hostilidades, las tropas donde están, ganado para la plaza y el bloqueo levantado en las dos orillas. #b Lord Howden#! ya había levantado el británico, en esta orilla y en la otra.\n\nEl conde #b Walewski#! se negó a acompañarlo: el bloqueo francés sigue, y la alianza de las dos potencias en el Plata quedó rota en la rada de Montevideo.\n\nLos buques de bandera inglesa pueden volver a las balizas de Buenos Aires. Pesa en la aduana; no decide la guerra."
 gg_arg_notice.2.f:0 "Dos potencias entraron juntas al río; salen de a una."
 gg_arg_notice.2.a:0 "Abrir la aduana a la bandera inglesa."
 gg_arg_notice.2.a_tt:0 "@information! Vuelven los buques ingleses: la aduana cobra #P 15.000#!. El bloqueo francés sigue."
 gg_arg_notice.3.t:0 "Un emigrado en la calle Misiones"
 gg_arg_notice.3.d:0 "Señor gobernador: en Montevideo mataron a #b Florencio Varela#!, el emigrado argentino que dirigía #b El Comercio del Plata#! y al que el gobierno de la plaza mandó a Londres y a París a pedir la intervención contra esta Confederación. Fue la noche del lunes 20 de marzo, en la calle Misiones, de una puñalada por la espalda.\n\nEl que lo mató es un canario, #b Andrés Cabrera#!, que ni lo conocía de vista y huyó hacia las líneas del Cerrito. La prensa de la plaza ya dictó la sentencia: Oribe, Rosas, o los dos.\n\nPasó en la semana en que llegaron dos mediadores, #b Gore#! y el barón #b Gros#!, que no bajan a tierra. Lo que se diga desde Buenos Aires lo van a leer ellos antes que nadie."
 gg_arg_notice.3.f:0 "Cada diario de la plaza tiene su culpable."
 gg_arg_notice.3.a:0 "Que conteste el #b Archivo Americano#!."
 gg_arg_notice.3.a_tt:0 "@information! La imprenta cuesta #N 5.000#!, y Buenos Aires responde en público por su aliado."
 gg_arg_notice.3.b:0 "Que el presidente Oribe conteste por su campamento."
 gg_arg_notice.4.t:0 "Mediadores beligerantes"
 gg_arg_notice.4.d:0 "Señor gobernador: los mediadores #b Robert Gore#! y el barón #b Gros#! pusieron sus bases el 5 de abril: que el presidente #b Oribe#! licencie las tropas argentinas, que Montevideo disuelva y desarme sus legiones, y las dos cosas a la vez. En el Cerrito buscaron separar al presidente de esta Confederación.\n\nEl presidente no se separa, y la carta que le escribe el Restaurador lo dice todo: «¿Qué clase de mediadores son ésos? No pueden ser mediadores, porque son beligerantes. ¿No han hostilizado a usted? ¿No han cañoneado los puertos de la Confederación Argentina, su aliada?»\n\nEl #b Archivo Americano#! ya tiene su juicio sobre la misión: «insidiosa en su plan, torpe en su ejecución, ridícula en sus resultados». En Londres y en París lo van a leer."
 gg_arg_notice.4.f:0 "«No pueden ser mediadores, porque son beligerantes.»"
 gg_arg_notice.4.a:0 "Que se publique."
 gg_gore_gros_refused_tt:0 "@information! La negativa llega a #b Buenos Aires#!, que la hace suya ante los mediadores."
 gg_howden_answered_tt:0 "@information! La respuesta de la plaza llega al #b Cerrito#! y a #b Buenos Aires#!."
