# ES: Cada nombre de estado y de hub chequeado contra dos cosas: la coordenada real del pueblo,
#     leida del mapa de provincias, y su anio de fundacion documentado. Ninguno lleva nombre de
#     rio ni de cuchilla, y ninguno lleva el nombre de un pueblo que en 1836 no existia, salvo
#     donde no habia ningun poblado en esa provincia: en Cerro Largo habia exactamente dos.
#     Las fuentes estan en SOURCES.md.

 # Estados / States
 STATE_SAN_JOSE: "San José"
 STATE_MALDONADO: "Maldonado"
 STATE_BANDA_ORIENTAL: "Cerro Largo"

 # Montevideo: la plaza fuerte / the fortress
 HUB_NAME_STATE_MONTEVIDEO_city: "Montevideo"
 HUB_NAME_STATE_MONTEVIDEO_port: "Montevideo"
 HUB_NAME_STATE_MONTEVIDEO_wood: "Santa Lucía"

 # San José: la campaña / the countryside
 HUB_NAME_STATE_SAN_JOSE_city: "Florida"
 HUB_NAME_STATE_SAN_JOSE_port: "Colonia del Sacramento"
 HUB_NAME_STATE_SAN_JOSE_farm: "San José"
 HUB_NAME_STATE_SAN_JOSE_mine: "Minas"
 HUB_NAME_STATE_SAN_JOSE_wood: "Durazno"

 # Maldonado
 HUB_NAME_STATE_MALDONADO_city: "Maldonado"
 HUB_NAME_STATE_MALDONADO_port: "Maldonado"
 HUB_NAME_STATE_MALDONADO_mine: "San Carlos"
 HUB_NAME_STATE_MALDONADO_farm: "Rocha"
 HUB_NAME_STATE_MALDONADO_wood: "Santa Teresa"

 # Cerro Largo
 HUB_NAME_STATE_BANDA_ORIENTAL_city: "Melo"
 HUB_NAME_STATE_BANDA_ORIENTAL_mine: "Pueblo Arredondo"
 HUB_NAME_STATE_BANDA_ORIENTAL_farm: "Treinta y Tres"
 HUB_NAME_STATE_BANDA_ORIENTAL_port: "Lascano"
 HUB_NAME_STATE_BANDA_ORIENTAL_wood: "Santa Clara de Olimar"

 # Paysandú
 HUB_NAME_STATE_PAYSANDU_city: "Salto"
 HUB_NAME_STATE_PAYSANDU_farm: "Paysandú"
 HUB_NAME_STATE_PAYSANDU_mine: "San Fructuoso"
 HUB_NAME_STATE_PAYSANDU_wood: "Mercedes"

# EN/ES: standalone (19/9/2026) -- these two states used to take their names from la Argentina,
#     where they were born; the mod owns the five oriental states now / estos dos estados
#     tomaban el nombre de la Argentina, donde nacieron; el mod ahora es duenio de los cinco
 STATE_MONTEVIDEO: "Montevideo"
 STATE_PAYSANDU: "Paysandú"
