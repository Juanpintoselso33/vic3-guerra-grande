l_spanish:
 ARG_FLAVOR_TEXT:0 "Buenos Aires no gobierna a las provincias: habla por ellas. Trece legislaturas le confían sus relaciones exteriores, y ocho de ellas pueden retirarle el encargo. Rosas tiene el puerto, la aduana y los ríos; enfrente, la otra orilla del Plata está por partirse en dos, y las escuadras de Europa no andan lejos."
