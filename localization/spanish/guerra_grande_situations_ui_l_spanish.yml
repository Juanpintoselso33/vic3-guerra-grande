 gg_war_ui_exhaustion_tt:0 "Meses consecutivos con apoyo bélico de #V −25#! o menos en esta guerra. La cuenta vuelve a cero cuando se recupera el apoyo; no mide pérdidas de tropas."
 gg_war_ui_current_ruler:0 "Gobierno\n#b [Character.GetFullName]#!"
