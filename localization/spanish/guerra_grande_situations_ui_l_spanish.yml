 gg_war_ui_balance_causes:0 "#b Lo que inclina la balanza#!\nEl río: #V [JournalEntry.MakeScope.ScriptValue('gg_plata_pressure_blanco')|0]#! a favor de los blancos, #V [JournalEntry.MakeScope.ScriptValue('gg_plata_pressure_colorado')|0]#! a favor de los colorados (un punto cada #V 4#! meses de río cerrado o abierto, hasta #V 4#!)."
 gg_war_ui_defensa_condition:0 "#R Gobierno de la Defensa#!\nAgotamiento: #V [GetGlobalVariable('gg_defensa_exhausted').GetValue|0]#! meses"
