 gg_war_ui_diplomacy_3:0 "#Y Hay condiciones de paz en consideración.#! La resolución corresponde a los gobiernos que reciben los pliegos."
 gg_war_ui_diplomacy_4:0 "#Y Rige una tregua.#! El cómputo del cerco y del abastecimiento queda suspendido."
