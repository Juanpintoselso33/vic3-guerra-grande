l_spanish:

# ES: Los botones del Cerrito. No son legiones extranjeras: son la campania y el rio. Fuentes en
#     ~/dev/juegos/victoria3-uruguay/SOURCES_french_legion.md, seccion 3.

 guerra_grande_montonera_levy_button:0 "Levantar la campaña"
 guerra_grande_montonera_levy_button_desc:0 "La ciudad compra sus soldados; nosotros no tenemos por qué. La República de afuera de las murallas es nuestra: dos circunscripciones militares, al norte y al sur del Río Negro, un comandante en cada departamento y una estancia detrás de cada uno. Se corre la voz y los paisanos vienen con caballo propio, que es lo único que ninguna aduana de Montevideo puede comprar. Lo que cuesta es la campaña misma: cada hombre que llega montado es un hombre que ya no está con la hacienda."
 guerra_grande_requires_campana:0 "Tenemos que tener la campaña"

 guerra_grande_river_blockade_button:0 "Cerrar el río"
 guerra_grande_river_blockade_button_desc:0 "La línea de sitio no toma Montevideo mientras el mar que tiene atrás siga abierto: por ahí le llegan la harina, la pólvora y la plata de la aduana.\n\nSe le pide a Rosas que cierre el río, y la escuadra del almirante Guillermo Brown se arma en Maldonado al servicio del Cerrito (una sola vez, si Maldonado es nuestro). Si Rosas accede, cada mes de cierre aprieta a la plaza, la acerca a tratar la paz y corre la guerra hacia los #blue_value blancos#!, pero gasta la paciencia de Londres y París. Si se niega, se puede volver a pedir."
 guerra_grande_requires_rosas:0 "La Confederación tiene que seguir en pie"
 guerra_grande_requires_river_unwatched:0 "Rosas tiene que tener su orilla del Plata con batería, y ninguna escuadra extranjera interviniendo en el río"
 gg_plata_requires_no_guarantee:0 "El río no puede estar bajo la garantía de las potencias (Rosas cedió a su ultimátum)"
 gg_plata_requires_no_refusal:0 "Rosas no puede haber negado el pedido en el último año"
