l_spanish:

# ES: Los botones del Cerrito. No son legiones extranjeras: son la campania y el rio. Fuentes en
#     ~/dev/juegos/victoria3-uruguay/SOURCES_french_legion.md, seccion 3.


 guerra_grande_river_blockade_button:0 "Cerrar el río"
 guerra_grande_river_blockade_button_desc:0 "La línea de sitio no toma Montevideo mientras el mar que tiene atrás siga abierto: por ahí le llegan la harina, la pólvora y la plata de la aduana.\n\nSe le pide a Rosas que cierre el río, y la escuadra del almirante Guillermo Brown se arma en Maldonado al servicio del Cerrito (una sola vez, si Maldonado es nuestro). Si Rosas accede, cada mes de cierre aprieta a la plaza, la acerca a tratar la paz y corre la guerra hacia los #blue_value blancos#!, pero gasta la paciencia de las potencias que respaldan a la Defensa. Si se niega, se puede volver a pedir pasado un año."
 guerra_grande_requires_rosas:0 "La Confederación tiene que seguir en pie"
 guerra_grande_requires_river_unwatched:0 "Rosas tiene que tener su orilla del Plata con batería, y ninguna escuadra extranjera interviniendo en el río"
 gg_plata_requires_no_guarantee:0 "El río no puede estar bajo la garantía de las potencias (Rosas cedió a su ultimátum)"
 gg_plata_requires_no_refusal:0 "Rosas no puede haber negado el pedido en el último año"
 gg_cerrito_assembly_button:0 "Convocar a la Asamblea"
 gg_cerrito_assembly_button_desc:0 "Las Cámaras que el Cerrito hizo elegir en 1845 sesionan con la Constitución de 1830 en la mano; la plaza, desde 1846, se gobierna con una Asamblea de Notables creada por decreto. Cuando Rosas propuso «reunificar la patria», #b Oribe#! mandó la propuesta a una comisión de esas Cámaras, y la comisión no resolvió nada. Convocarlas otra vez es hacer hablar a la República por sí misma."
 gg_cerrito_assembly_button_tt:0 "@information! Una sola vez. La balanza lo anota a favor de los blancos, y Buenos Aires, que esperaba otra cosa de esas Cámaras, también lo anota."
 gg_cerrito_assembly_requires_once:0 "La Asamblea no puede haber sido convocada ya"
 gg_cerrito_assembly_requires_window:0 "Tiene que ser antes de julio de 1851"
