l_spanish:

# ES: El emprestito brasileno y lo que costo, y la plata argentina que lo espeja.
#     Cada cifra, fecha y cita esta documentada en SOURCES_loans.md y en los
#     comentarios de events/guerra_grande_loans.txt.

 gg_loan.1.t:0 "Cuarenta mil pesos por mes"
 gg_loan.1.d:0 "Las escuadras se van y el tesoro no se llena. En junio de 1848 el barón de Gros, el vicealmirante Le Prédour y el encargado de negocios Devoize firman con el gobierno de Joaquín Suárez un convenio de prestación de socorros, vigente desde el 15: cuarenta mil pesos corrientes a fin de cada mes, «en dinero o en letras sobre Francia», desde el 30. No es un regalo. Los artículos lo llaman préstamo reembolsable y nombran la garantía: la aduana, desde 1852. La aduana ya está vendida. Desde el contrato del 5 de marzo de 1846 una sociedad de accionistas acreedores es dueña por adelantado de los derechos de los años que vienen, y el gobierno vive de lo que esa caja le pasa. Esto hipotecaría lo que queda de lo que queda."
 gg_loan.1.f:0 "París paga la muralla. Alguien le va a pagar a París."
 gg_loan.1.a:0 "Que se firme. La ciudad come este mes."
 gg_loan.1.b:0 "La República no hipoteca una aduana que ya no es suya."
 gg_loan.2.t:0 "Los contratos de setiembre"
 gg_loan.2.d:0 "Las mensualidades francesas se recortan y Andrés Lamas lleva tres años en Río de Janeiro pidiéndole al Imperio que ocupe ese lugar. En setiembre de 1850 lo consigue: dieciocho mil pesos fuertes por mes durante trece meses, garantidos sobre las rentas fiscales de la República para cuando se restablezca el orden. Los contratos son secretos. Las letras las entrega el comerciante Irineu Evangelista de Souza, para que en público se lea como una casa de comercio sosteniendo a otra; el artículo 6 lo pone a juntar los recibos, y los recibos son los títulos de una deuda con el Brasil. Hay una segunda manera de tomar la misma plata. Souza la adelanta por su cuenta, en francos, a su precio: de las tres primeras cuotas de cincuenta y cuatro mil pesos fuertes retiene cuarenta y dos mil, y de las diez mensualidades de dieciocho mil se queda con trece mil doscientos."
 gg_loan.2.f:0 "La plata del Imperio, o la de un comerciante, y el comerciante es el Imperio."
 gg_loan.2.a:0 "Firmar con el Imperio. Que sea una alianza."
 gg_loan.2.b:0 "Tomarla por la casa de Souza. Que el Imperio no figure en el papel."
 gg_loan.2.c:0 "No. La paga de este mes se busca en Montevideo."
 gg_loan.3.t:0 "El Buceo y la caja"
 gg_loan.3.d:0 "Todos los departamentos menos la plaza amurallada responden al Cerrito, y nada de eso es plata. El país es ganado y cueros, y los cueros necesitan puerto. En julio de 1843 sale el decreto con la firma de Oribe y la de Villademoros: se habilita la bahía del Buceo, «con carácter provisorio a fin de que más fácilmente se llenen las necesidades de la población y se haga más fácil el percibo de los derechos para el estado». Habrá muelle, una aduana en parte artillada, setenta empleados a las órdenes del receptor Ignacio Soria y, con el tiempo, más de cuarenta buques mercantes de ultramar fondeados. Montevideo contesta declarando pirata a todo barco que recale ahí y contrabando a todo el tráfico. El otro camino es más corto. Rosas nombró a Oribe general en jefe del Ejército de Vanguardia en octubre de 1840 y desde entonces mantiene a ese ejército en ganado y plata fuerte; Buenos Aires paga el sitio y se acabó."
 gg_loan.3.f:0 "Una aduana propia, o una caja del otro lado del río."
 gg_loan.3.a:0 "Tomar la caja. El sitio no espera a los cueros."
 gg_loan.3.b:0 "Habilitar el Buceo. Lo que gana el país, lo gasta el país."
 gg_loan.4.t:0 "La reunificación de la patria"
 gg_loan.4.d:0 "Una alianza, no una bandera. Rosas gana un amigo, no una provincia."
 gg_loan.4.f:0 "No hay documento. Hay una propuesta, y hay una comisión."
 gg_loan.4.a:0 "Aceptar. Que la Banda Oriental vuelva a ser provincia de la Confederación."
 gg_loan.4.b:0 "Mandarlo a una comisión de la Asamblea."
 gg_loan.4.c:0 "La República es una república. Que se lo digan a Buenos Aires."
 gg_loan.5.t:0 "La cuenta del doce de octubre"
 gg_loan.5.d:0 "Cinco tratados en un día en Río de Janeiro, todos firmados por Andrés Lamas: alianza, límites, extradición, comercio y navegación, y prestación de socorros. Por el último, el Imperio cede sesenta mil patacones por mes desde el 1 de noviembre, presta ciento treinta y ocho mil en el acto al seis por ciento anual, y el gobierno oriental reconoce doscientos ochenta y ocho mil setecientos noventa y un pesos fuertes de lo que ya le prestaron, con sus intereses. El artículo X dice qué hay detrás de la cifra: la República «hipoteca todas las rentas del Estado, todas las contribuciones directas e indirectas, especialmente los derechos de aduana». Hasta que no se cancele, una Junta de Crédito Público con representantes imperiales administra las finanzas del país. Lamas le escribió a su ministro al día siguiente que en cuestión de territorio el título verdadero es la fuerza, que la disputa solo podía prolongarse en provecho del fuerte, y que un derecho claro y reconocido era al menos una barrera. La cuenta está sobre la mesa igual."
 gg_loan.5.f:0 "Se levanta el sitio. Se abren los libros."
 gg_loan.5.a:0 "Reconocerla. Lo que se pidió prestado se gastó en la muralla."
 gg_loan.5.b:0 "Quemarlos en la plaza. Ahí no firmó ninguna mano libre."
 gg_loan.6.t:0 "Las deudas del Cerrito"
 gg_loan.6.d:0 "El Pantanoso, 8 de octubre de 1851. Oribe queda en libertad y puede disponer de su persona; los actos de su gobierno se consideran legales a todos los efectos; todos los orientales tienen los mismos derechos, hayan usado la divisa que hayan usado; se reconoce que la resistencia a la intervención anglo-francesa se hizo para defender la independencia oriental; la guerra termina sin vencidos ni vencedores. Y entre las cláusulas de una capitulación que se lee como una amnistía hay una línea sobre plata: el gobierno que salga de las próximas elecciones asume las deudas que contrajo este. Nueve años de un país gobernado desde un cerro, financiado por una aduana en una bahía abierta y por una caja en Buenos Aires, reducidos a una cifra que va a cargar otro. Cuatro meses después, en Caseros, el hombre que llenaba esa caja va a perderlo todo en una tarde y a embarcarse para Inglaterra."
 gg_loan.6.f:0 "Ni vencidos ni vencedores. Sólo acreedores."
 gg_loan.6.a:0 "Reconocer lo que se pidió. Con eso se comió la tropa."
 gg_loan.6.b:0 "Ya no queda acreedor. Que la cuenta se muera con él."
