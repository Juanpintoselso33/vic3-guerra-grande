l_spanish:
 gg_arg_direct_tax:0 "Contribución Directa reformada"
 gg_arg_paper_issue:0 "La cuenta del papel"
 gg_arg_land_sales:0 "Tierra pública en pocas manos"
 gg_arg_small_ranchers:0 "Alivio al pequeño hacendado"
 gg_arg_full_resignation:0 "El encargo ratificado"
 gg_arg_soft_resignation:0 "La fórmula atenuada"
 gg_arg_no_resignation:0 "El encargo sin ceremonia"
 gg_arg_port_enforcement:0 "La puerta única"
 gg_arg_port_tolerance:0 "Tolerancia del tráfico"
 gg_arg_port_licences:0 "Licencias de exportación provinciales"
 gg_arg_flavour_trade_expired_tt:0 "@information! #b Entre Ríos#! ya no está bajo esta delegación y administración: el despacho queda sin efecto y no mueve dinero ni agravios."
 gg_arg_littoral_restricted:0 "Cargamentos retenidos"
 gg_arg_flavour_hard_tt:0 "@arrow_up! Agravio de #b Entre Ríos#!: #N +1#! si todavía delega; su pliego queda abierto."
 gg_arg_flavour_relief_tt:0 "@arrow_down! Agravio de #b Entre Ríos#!: #P −1#!, hasta un mínimo de #V 0#!, si todavía delega. Su pliego se cierra sólo si no queda agravio."
 gg_arg_flavour_ritual_tt:0 "@information! La ceremonia conserva el carácter #b revocable#! del encargo; no restaura delegaciones retiradas ni salda pliegos pendientes."
 gg_arg_flavour_omit_tt:0 "@warning! Se abren pliegos en #b Corrientes, Entre Ríos y las provincias del norte#! que todavía deleguen y cuya cuenta regional de agravios sea mayor que #V 0#!."
 gg_argentina.16.t:0 "La caja sin aduana"
 gg_argentina.16.d:0 "Señor gobernador: el bloqueo ha derrumbado la renta de la aduana. La caja no puede esperar a que vuelvan los buques.\n\nLa reforma de la #b Contribución Directa#! del #V 12 de abril de 1839#! elimina exenciones y cambia la tasación. Podemos sostenerla y cobrar sobre una base más amplia, aun a costa del disgusto de los propietarios alcanzados.\n\nTambién podemos cubrir el faltante con papel o acelerar la venta de tierra pública. Son recursos que entran hoy; sus cuentas quedan para mañana."
 gg_argentina.16.f:0 "La aduana está cerrada; las obligaciones del gobierno, no."
 gg_argentina.16.a:0 "Cobremos la Contribución Directa."
 gg_argentina.16.b:0 "Cubrámoslo con emisión."
 gg_argentina.16.c:0 "Pongamos tierra pública en venta."
 gg_argentina.17.t:0 "Los que pudieron esperar"
 gg_argentina.17.d:0 "Señor gobernador: levantado el bloqueo francés, no todos vuelven al mercado en las mismas condiciones. Los grandes propietarios pudieron suspender la faena, aumentar vientres, acopiar cueros y comprar tierra.\n\nEl pequeño hacendado tuvo que vender carne a precio vil. Muchos se arruinaron; aquella fractura, junto con el fin de la enfiteusis, alimentó a los #b Libres del Sur#!.\n\nSeguir vendiendo sin renovar los arrendamientos trae dinero y compradores poderosos. Frenar las ventas y reservar alivio para los pequeños deja menos en la caja, pero otra disposición en la campaña."
 gg_argentina.17.f:0 "Unos vendieron para comer; otros compraron porque podían esperar."
 gg_argentina.17.a:0 "Sigamos vendiendo."
 gg_argentina.17.b:0 "Reservemos alivio al pequeño hacendado."
 gg_argentina.18.t:0 "La renuncia de este año"
 gg_argentina.18.d:0 "Señor gobernador: corresponde volver a escribir a las provincias. Como cada año, la renuncia al encargo de las relaciones exteriores invocará su salud; esperamos que los gobiernos vuelvan a rechazarla.\n\nLa ceremonia afirma que el encargo viene de ellos. Pero una renuncia ofrecida puede ser aceptada: la ratificación no convierte la delegación en propiedad nuestra.\n\nPodemos repetir la fórmula íntegra, moderarla o dejar pasar este año sin pedir esa nueva expresión de confianza."
 gg_argentina.18.f:0 "Quien recibe el encargo debe recordar quién se lo confió."
 gg_argentina.18.a:0 "Repitamos la ceremonia completa."
 gg_argentina.18.b:0 "Atenuemos la fórmula."
 gg_argentina.18.c:0 "Este año no presentaremos renuncia."
 gg_argentina.19.t:0 "Carnes, charque, sebo y lenguas"
 gg_argentina.19.d:0 "Señor gobernador: la intimación a #b Entre Ríos#! exige buques nacionales, fianza por el duplo del cargamento y prohíbe enviar a Montevideo carnes, charque, sebo, velas, grasa y lenguas saladas. Es la producción de sus saladeros.\n\nPese a las amenazas, el tráfico sigue siendo intenso. Hacer cumplir cada prohibición protege nuestra aduana, pero enfrenta al gobierno con quienes necesitan vender esos cargamentos.\n\nPodemos perseguirlos, tolerar el comercio mientras se guarden las apariencias o licenciar una parte y cobrar por ella."
 gg_argentina.19.f:0 "La orden enumera lo que el saladero tiene para vender."
 gg_argentina.19.a:0 "Exijamos la fianza y persigamos el tráfico."
 gg_argentina.19.b:0 "Toleremos el comercio."
 gg_argentina.19.c:0 "Licenciemos una parte y cobremos."
 gg_argentina.28.t:0 "El sesenta y ocho por ciento"
 gg_argentina.28.d:0 "Señor gobernador: las cuentas de comercio de #V 1846–1847#! atribuyen a #b Montevideo#! el #V 68%#! de los productos rioplatenses exportados. La mercadería encuentra otra puerta.\n\nEl tráfico del litoral se desplaza del Paraná al Uruguay, especialmente hacia Concepción del Uruguay y Concordia. Los puertos abiertos sostienen el crecimiento entrerriano; se ocultan los flujos para evitar el conflicto con Buenos Aires.\n\nPodemos insistir en concentrar las exportaciones aquí, admitir provisionalmente esa salida durante el bloqueo o reconocer licencias provinciales a cambio de una participación en la renta."
 gg_argentina.28.f:0 "Los cargamentos no esperan a que los gobiernos se pongan de acuerdo."
 gg_argentina.28.a:0 "Concentremos las exportaciones en Buenos Aires."
 gg_argentina.28.b:0 "Admitamos provisionalmente la salida entrerriana."
 gg_argentina.28.c:0 "Reconozcamos licencias a cambio de participación."
 gg_arg_flavour_corrientes_hard_tt:0 "@arrow_up! Agravio de #b Corrientes#!: #N +1#! si todavía delega; su pliego queda abierto."
 gg_arg_flavour_corrientes_relief_tt:0 "@arrow_down! Agravio de #b Corrientes#!: #P −1#!, hasta un mínimo de #V 0#!, si todavía delega. Su pliego se cierra sólo si no queda agravio."
 gg_arg_flavour_corrientes_gone_tt:0 "@information! #b Corrientes#! ya no está bajo esta delegación: la cuenta no mueve sus agravios."
 gg_arg_flavour_entre_rios_gone_tt:0 "@information! #b Entre Ríos#! ya no está bajo esta delegación: la cuenta no mueve sus agravios."
