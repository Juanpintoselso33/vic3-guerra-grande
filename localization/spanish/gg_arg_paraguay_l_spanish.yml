l_spanish:
 gg_arg_paraguay.1.t:0 "La independencia del Paraguay"
 gg_arg_paraguay.1.d_urquiza:0 "Llegan de la Asunción los pliegos del doctor #b Santiago Derqui#!, encargado de negocios en misión especial cerca del gobierno del Paraguay. El 15 de julio firmó con el ministro Benito Varela un tratado de límites, comercio y navegación: el Paraná por frontera, la libre navegación del Paraná para el pabellón paraguayo y la del río Paraguay para el argentino. Falta el acto que el presidente #b Carlos Antonio López#! pide desde que su Congreso juró la independencia, en noviembre de 1842.\n\nRosas nunca lo dio. En abril de 1843 contestó que la Confederación no prestaba su aquiescencia, después prohibió a todo buque de sus puertos comerciar con el Paraguay, y el 4 de diciembre de 1845 el Paraguay le declaró la guerra. El Imperio, en cambio, la reconoció el 14 de septiembre de 1844, y por el tratado del 25 de diciembre de 1850 se obligó a socorrer al Paraguay si la Confederación lo atacaba.\n\nLas instrucciones autorizan a Derqui a reconocerla «como un hecho consumado», con la adhesión de los gobiernos provinciales y a cuenta del próximo Congreso General. El acta está redactada: «reconozco en nombre de la expresada Confederación Argentina la Independencia y Soberanía de la República del Paraguay». Falta la orden del Director."
 gg_arg_paraguay.1.d_confederation:0 "Buenos Aires quedó con Rosas y las provincias con el gobierno de #b Urquiza#!, y es a este gobierno al que se dirige la Asunción. El presidente #b Carlos Antonio López#! pide que la Confederación reconozca la independencia que su Congreso juró en noviembre de 1842, y ofrece lo que el Litoral necesita: el Paraná por frontera y la libre navegación del río Paraguay para el pabellón argentino, a cambio de la del Paraná para el suyo.\n\nRosas nunca la reconoció. En abril de 1843 contestó que la Confederación no prestaba su aquiescencia, después prohibió a todo buque de sus puertos comerciar con el Paraguay, y el 4 de diciembre de 1845 el Paraguay le declaró la guerra. El Imperio, en cambio, la reconoció el 14 de septiembre de 1844, y por el tratado del 25 de diciembre de 1850 se obligó a socorrer al Paraguay si la Confederación lo atacaba.\n\nCon Buenos Aires aparte, reconocer al Paraguay es también el primer acto exterior de un gobierno que todavía tiene que probar que lo es. El acta que se propone dice: «la República del Paraguay está en el derecho de ejercer todas las grandes prerrogativas que son inherentes a su Independencia y Soberanía Nacional»."
 gg_arg_paraguay.1.d_rosas:0 "Vuelve a Palermo la cuestión de siempre, ahora con la guerra ya decidida. El presidente #b Carlos Antonio López#! pide otra vez que la Confederación reconozca la independencia que su Congreso juró en noviembre de 1842, y esta vez no escribe solo: el Imperio la reconoció el 14 de septiembre de 1844, y por el tratado del 25 de diciembre de 1850 se obligó a socorrer al Paraguay si la Confederación lo atacaba.\n\nLa respuesta de este gobierno está escrita desde abril de 1843: el encargado de las relaciones exteriores no presta su aquiescencia, y a la vez asegura que «jamás las armas de la Confederación Argentina turbarán la paz y tranquilidad del pueblo paraguayo». Cuando López se entendió con Corrientes, se prohibió a todo buque de los puertos de la Confederación comerciar con el Paraguay, y el 4 de diciembre de 1845 la Asunción declaró la guerra.\n\nPara Buenos Aires, la antigua provincia del Paraguay es una provincia que no ha vuelto. Para la Asunción, y ahora para Río de Janeiro, es una República. Hay que contestar."
 gg_arg_paraguay.1.f:0 "«Un hecho consumado competentemente comunicado.»"
 gg_arg_paraguay.1.a:0 "Reconocer la independencia y soberanía de la República del Paraguay, como un hecho consumado."
 gg_arg_paraguay.1.b:0 "No prestar aquiescencia: el Paraguay es una provincia que no ha vuelto."
 gg_arg_paraguay.1.a_tt:0 "@information! La Confederación #b renuncia a reclamar#! el suelo que es enteramente paraguayo. El Chaco queda como está: sus límites siguen pendientes. En Río de Janeiro se lee como una garantía cumplida."
 gg_arg_paraguay.1.b_tt:0 "@warning! La Confederación #b reclama como suyo#! el suelo que es enteramente paraguayo, provincia rebelde. Las cortes que ya reconocieron a la República toman nota, y el Imperio, que se obligó a socorrerla, más que ninguna."
