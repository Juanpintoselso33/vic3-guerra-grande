l_spanish:
 gg_int_arg_offer_button:0 "Ofrecer un auxilio a Oribe"
 gg_int_arg_offer_button_desc:0 "Mandarle al gobierno de Oribe una remesa extraordinaria. Buenos Aires paga solo si Oribe acepta quedar obligado con Buenos Aires."
 gg_int_arg_offer_possible:0 "La guerra sigue abierta; Oribe tiene un gobierno que pueda recibirla; al menos #V 4#! provincias siguen delegando; y no se hizo antes otra oferta extraordinaria, aceptada o no. La caja tiene que cubrir #V £20.000#! si delegan al menos #V 10#! provincias, o #V £10.000#! si no."
 gg_int_arg_offer_tt:0 "Una sola remesa: #V £20.000#! si delegan al menos #V 10#! provincias, #V £10.000#! si no. No se paga nada hasta que Oribe la acepte; puede rechazarla, y una oferta pendiente o rechazada no se repite."
 gg_int_arg_withdraw_button:0 "Retirar el respaldo financiero"
 gg_int_arg_withdraw_button_desc:0 "Cortarle al Cerrito la plata de todos los meses. Lo ya pagado no vuelve, y la obligación contraída sigue en pie."
 gg_int_arg_withdraw_possible:0 "Oribe aceptó la remesa extraordinaria, la guerra sigue abierta y todavía no se le cortó la plata."
 gg_int_arg_withdraw_tt:0 "Se le corta al Cerrito la plata de todos los meses hasta que termine la guerra. Lo pagado no se devuelve y la obligación sigue en pie."
 gg_int_arg_accept_tt:0 "Buenos Aires paga #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#! y este gobierno las recibe; el gasto va a la cuenta del Pacto Federal. Quedamos obligados con Buenos Aires, sin renunciar a nuestra independencia."
 gg_int_arg_decline_tt:0 "Se cierra la oferta sin plata ni obligación. Mientras dure la guerra, el respaldo de Rosas baja #N 5#!."
 gg_int_status_pending:0 "#Y Se espera la respuesta de Oribe#! a una oferta de #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#!. Todavía no se pagó nada."
 gg_int_status_refused:0 "#Y La remesa extraordinaria quedó cerrada#!: ni pago ni obligación."
 gg_int_status_withdrawn:0 "#N Buenos Aires cortó la plata#!. Los pagos de todos los meses al Cerrito están suspendidos; lo ya remitido y la obligación contraída siguen en pie."
 gg_int_pact_account:0 "\n\n#b Auxilios a Oribe#!: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#! en remesas extraordinarias. Respaldo de Buenos Aires: #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100. Las provincias que retiran la delegación achican lo que se puede ofrecer."
 gg_international.2.t:0 "Una oferta de Buenos Aires"
 gg_international.2.d:0 "Buenos Aires ofrece una remesa extraordinaria para sostener a nuestro gobierno, sacada de su propio tesoro.\n\nLa condición es diplomática: al recibir la plata quedamos obligados con el gobierno que la manda. No se renuncia a nuestra independencia, pero tampoco es un regalo sin consecuencias.\n\nLa tesorería pide resolver si aceptamos o nos arreglamos con lo nuestro. Si el que ofrece ya no puede pagar, o este gobierno dejó de ser el destinatario, no hay pago."
 gg_international.2.f:0 "La remesa y el compromiso forman parte del mismo acuerdo."
 gg_international.2.a:0 "Aceptar los fondos y la obligación."
 gg_international.2.b:0 "Cerrar la oferta sin aceptarla."
