l_spanish:
 gg_int_arg_offer_button:0 "Ofrecer un auxilio a Oribe"
 gg_int_arg_offer_button_desc:0 "Presentar una remesa extraordinaria al gobierno de Oribe. Buenos Aires paga solamente si el otro gobierno acepta una obligación diplomática."
 gg_int_arg_offer_possible:0 "El conflicto sigue sin resolverse; Oribe tiene un gobierno que puede recibir la oferta; al menos #V 4#! provincias siguen delegando; no se envió antes una oferta extraordinaria. La reserva debe cubrir #V £20.000#! con al menos #V 10#! provincias delegantes, o #V £10.000#! en caso contrario."
 gg_int_arg_offer_tt:0 "Enviar una única oferta de auxilio extraordinario: #V £20.000#! con al menos #V 10#! provincias delegantes; en caso contrario, #V £10.000#!. No se transfiere dinero hasta la aceptación. El destinatario puede rechazarla; una oferta pendiente o rechazada no puede enviarse de nuevo."
 gg_int_arg_withdraw_button:0 "Retirar el respaldo financiero"
 gg_int_arg_withdraw_button_desc:0 "Cerrar el acceso mensual de la campaña a los fondos argentinos. Los pagos anteriores y la obligación diplomática no se cancelan."
 gg_int_arg_withdraw_possible:0 "Se aceptó una oferta extraordinaria, el conflicto sigue sin resolverse y todavía no se retiró el respaldo financiero."
 gg_int_arg_withdraw_tt:0 "Suspender el subsidio mensual ordinario al Cerrito por el resto del conflicto. Los pagos anteriores no se devuelven y la obligación diplomática permanece."
 gg_int_arg_accept_tt:0 "Buenos Aires paga #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#! y este gobierno recibe la misma cantidad. El gasto queda en la cuenta del Pacto Federal. Se debe una obligación diplomática al donante; no se renuncia a la independencia."
 gg_int_arg_decline_tt:0 "Cerrar esta oferta extraordinaria sin transferir dinero ni contraer una obligación. Mientras el conflicto siga sin resolverse, el respaldo de Rosas baja #N 5#!."
 gg_int_status_pending:0 "#Y Se espera la respuesta de Oribe#! a una oferta de #V £[GetGlobalVariable('gg_int_arg_quote').GetValue|0]#!. Todavía no se pagó nada."
 gg_int_status_refused:0 "#Y La oferta extraordinaria quedó cerrada#!. No produjo ningún pago ni obligación."
 gg_int_status_withdrawn:0 "#N Respaldo financiero argentino retirado#!. Los pagos ordinarios al Cerrito están suspendidos; el auxilio anterior y la obligación contraída no se cancelan."
 gg_int_pact_account:0 "\n\n#b Auxilios a Oribe#!: #V £[GetGlobalVariable('gg_int_arg_spent').GetValue|0]#! remitidas extraordinariamente. Respaldo de Buenos Aires: #V [GetGlobalVariable('gg_patron_rosas').GetValue|0]#!/100. Las provincias que retiran la delegación limitan el monto que puede ofrecerse."
 gg_international.2.t:0 "Una oferta de Buenos Aires"
 gg_international.2.d:0 "Buenos Aires ofrece una remesa extraordinaria para sostener a nuestro gobierno. El dinero saldría de su propio tesoro; la propuesta no es una orden de entrar en la guerra de otro país.\n\nLa condición es diplomática. Al recibir los fondos quedaríamos debiendo una obligación al gobierno que los proporciona. No se renuncia al reconocimiento de nuestra independencia, pero tampoco podríamos tratar esta asistencia como un regalo sin consecuencias.\n\nLa tesorería pide resolver si aceptamos estas condiciones o nos atenemos a nuestros propios recursos. Ningún pago puede cursarse si el donante ya no puede afrontarlo o el gobierno al que estaba destinado dejó de ser el nuestro."
 gg_international.2.f:0 "La remesa y el compromiso forman parte del mismo acuerdo."
 gg_international.2.a:0 "Aceptar los fondos y la obligación."
 gg_international.2.b:0 "Cerrar la oferta sin aceptarla."
