l_spanish:
 gg_cisplatina.1.t:0 "La Banda Oriental, ¿provincia o república?"
 gg_cisplatina.1.d:0 "La Asamblea del Cerrito vuelve a sesionar el 11 de agosto y su primer acto es confirmar a Oribe como presidente legítimo. En la Casa de Gobierno se piensa más lejos: diecisiete años después de la Convención Preliminar de 1828, la independencia de la Banda Oriental sigue siendo, para muchos federales, una herida que Lord Ponsonby abrió y que nadie cerró.\n\nEl Restaurador va a ofrecerle a Oribe «reunificar la patria»: que la Provincia Oriental vuelva a la Confederación, con su gobierno propio como cualquier otra provincia del Pacto. Queda por decidir cuánto apretar. Una oferta se puede mandar a una comisión; un pedido formal, con los batallones de Buenos Aires sosteniendo la línea del Cerrito, es otra cosa.\n\nEn Paraná y en Corrientes se mira con recelo cualquier Buenos Aires más grande, y los encargados de negocios de Londres y París no ocultan que el Plata les interesa con dos orillas y un río abierto."
 gg_cisplatina.1.f:0 "«Reunificar la patria», decían en Buenos Aires; «anular la Convención», leían en Río de Janeiro."
 gg_cisplatina.1.a:0 "Pedirle que vuelva como provincia de la Confederación."
 gg_cisplatina.1.b:0 "Que quede como oferta: Oribe sabrá lo que conviene."
 gg_cisplatina.1.a_tt:0 "@information! Oribe recibe el pedido con todo el peso del respaldo de Buenos Aires: si gana la guerra, volver como #b provincia#! (del Pacto, o incorporada del todo) pasa a ser lo que más probablemente elija, y la incorporación queda a su alcance aunque no la acepte ahora.\n@warning! El Litoral no quiere una Buenos Aires más grande: el respaldo de #b Urquiza#! baja #N 10#!. Gran Bretaña y Francia, que quieren el Plata con dos orillas, enfrían la relación: #N -25#! con cada una."
 gg_cisplatina.1.b_tt:0 "@information! La oferta llega al Cerrito sin más presión que la de siempre."
 gg_cisplatina.2.t:0 "La Convención de 1828, rota"
 gg_cisplatina.2.desc:0 "Hace un mes que la Provincia Oriental volvió a la Confederación Argentina, y en Río de Janeiro el Consejo de Estado relee el texto que se firmó en esta misma ciudad el 27 de agosto de 1828. El artículo primero separó la provincia de Montevideo, llamada entonces Cisplatina, del Imperio; el segundo obligó a las Provincias Unidas a reconocerla independiente; el tercero comprometió a los dos gobiernos a defender esa independencia.\n\nEl tratado definitivo de paz que la Convención prometía nunca se firmó, y en Buenos Aires se sostiene que eso deja las manos libres. En Río no se lee así: la independencia de la Banda Oriental fue el precio de la paz, y Rosas acaba de tomarla sin pagar nada. Los estancieros riograndenses, que tienen tierras y ganado al otro lado del Cuareim, preguntan qué va a hacer el Imperio.\n\nEl ministro de Negocios Extranjeros pone sobre la mesa tres caminos de guerra y uno de protesta."
 gg_cisplatina.2.f:0 "Tercero: ambas altas partes contratantes se obligan a defender la independencia e integridad de la Provincia de Montevideo. — Convención Preliminar de Paz, 1828"
 gg_cisplatina.2.a:0 "Protestar y nada más: no es el momento de otra guerra en el Plata."
 gg_cisplatina.2.b:0 "Hacer cumplir la Convención: la República tiene que volver a existir."
 gg_cisplatina.2.c:0 "Si la Convención ya no vale, la Cisplatina vuelve al Imperio."
 gg_cisplatina.2.d:0 "Una República libre, pero bajo la protección del Imperio."
 gg_cisplatina.2.a_tt:0 "@information! No hay guerra. La relación con la Argentina baja #N 30#!."
 gg_cisplatina.2.b_tt:0 "@warning! #b Guerra con la Argentina#!. Si el Imperio la gana, la #b República Oriental del Uruguay#! vuelve a existir con todos sus estados. Si no, la Provincia Oriental sigue en la Confederación."
 gg_cisplatina.2.c_tt:0 "@warning! #b Guerra con la Argentina#!. Si el Imperio la gana, los estados orientales pasan al #b Brasil#!. Si no, la Provincia Oriental sigue en la Confederación."
 gg_cisplatina.2.d_tt:0 "@warning! #b Guerra con la Argentina#!. Si el Imperio la gana, la #b República Oriental del Uruguay#! vuelve a existir como protectorado del Brasil. Si no, la Provincia Oriental sigue en la Confederación."
 gg_cisplatina.4.t:0 "La segunda guerra cisplatina termina"
 gg_cisplatina.4.d_1:0 "Las armas del Imperio decidieron lo que la Convención no había podido sostener sola: la bandera de las nueve franjas vuelve a flamear en el Fuerte de Montevideo, y la República Oriental del Uruguay existe otra vez, dueña de todos sus departamentos.\n\nEn Buenos Aires se habla de traición de los aliados y de la debilidad de los tratados; en Río, de la palabra empeñada en 1828. En Montevideo, de volver a empezar."
 gg_cisplatina.4.d_2:0 "Lo que se perdió en Ituzaingó se recuperó veinte años después: los departamentos orientales vuelven al Imperio, y el Cuareim deja de ser frontera.\n\nEn Buenos Aires la derrota se paga en la Legislatura; en Montevideo, los que pidieron volver a la Confederación descubren que no pidieron volver al Brasil."
 gg_cisplatina.4.d_3:0 "La República Oriental del Uruguay vuelve a existir, pero su independencia tiene ahora un garante que se sienta en Río de Janeiro: el Imperio maneja sus relaciones exteriores, y ningún gobierno en Montevideo va a poder olvidarlo.\n\nEn Buenos Aires se dice que se cambió una dependencia por otra. En Río, que se cumplió la Convención."
 gg_cisplatina.4.d_0:0 "El Imperio no logró imponer sus términos. La Provincia Oriental sigue en la Confederación Argentina, y la Convención de 1828 queda, otra vez, como un papel que cada orilla lee a su manera."
 gg_cisplatina.4.f:0 "Dos veces en veinte años se peleó por la misma orilla."
 gg_cisplatina.4.a:0 "Que se sepa."
 gg_cis_play_name:0 "La segunda guerra cisplatina"
 dp_gg_cisplatina:0 "Hacer cumplir la Convención de 1828"
 gg_peace_reincorporation_brazil_tt:0 "@warning! Rompe la #b Convención Preliminar de Paz de 1828#!: el #b Brasil#! va a responder."
 gg_cisplatina.1.c:0 "Pedirle una república aparte, reconocida, bajo nuestra protección."
 gg_cisplatina.1.c_tt:0 "@information! Si gana la guerra, Oribe se inclina por una #b república aparte#!: independiente y reconocida, pero bajo la protección de Buenos Aires, con la bandera uruguaya de siempre. No rompe la Convención de 1828.\n@warning! Gran Bretaña y Francia desconfían igual: #N -10#! con cada una."
