l_spanish:
 gg_urquiza.1.t:0 "La representación de Entre Ríos"
 gg_urquiza.1.d:0 "La Legislatura de Entre Ríos no aceptó la renuncia anual del Restaurador: el encargo de las relaciones exteriores sigue en Buenos Aires. Pero con la respuesta llega una #b representación#! firmada por el general Urquiza, y no es de cortesía.\n\nPide lo que el Litoral viene pidiendo desde el Pacto de 1831: que se reúna el Congreso que el Pacto prometía, que los ríos no sean asunto de una sola aduana, que las órdenes de 1850 no caigan sobre las provincias como caen sobre enemigos. Lo pide sin retirar el encargo, y lo pide por escrito.\n\nEn la Casa de Gobierno se sabe lo que significa una representación que no se contesta."
 gg_urquiza.1.f:0 "Entre Ríos todavía delega; ahora también pregunta."
 gg_urquiza.1.a:0 "Atender la representación y abrir el camino del Congreso."
 gg_urquiza.1.b:0 "Una provincia no le da órdenes al encargado de las relaciones exteriores."
 gg_urquiza.1.a_tt:0 "@information! Entre Ríos sigue en el Pacto y se abre la #b confederación negociada#!. El respaldo de #b Urquiza#! sube #P 10#!.\n#grey El descontento de Entre Ríos era #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!: lo empujan los agravios abiertos (Alcaraz, las órdenes de 1850, el Congreso aplazado, cada reclamo sin contestar, un Brasil libre para intervenir); lo frenan una Guerra Grande ganada, la Banda Oriental en la Confederación, un Brasil vencido y un Litoral que delega.#!"
 gg_urquiza.1.b_tt:0 "@warning! La representación queda sin respuesta. El respaldo de #b Urquiza#! baja #N 10#!, y lo que hoy es un pliego #b puede volverse un pronunciamiento#!."
 gg_urquiza.2.t:0 "Urquiza, solo"
 gg_urquiza.2.d:0 "El gobernador de Entre Ríos se pronunció, pero se pronunció solo. No hay en Montevideo un gobierno sitiado que busque aliados contra el Restaurador, y en Río de Janeiro nadie firma convenciones sobre el Plata con quien no puede garantizarlas.\n\nUrquiza tiene su provincia, su caballería y lo que Corrientes quiera darle. Contra él están los ejércitos de la Confederación, que ya no tienen otra guerra que atender."
 gg_urquiza.2.f:0 "Un pronunciamiento sin convención es una apuesta."
 gg_urquiza.2.a:0 "Que se sepa en el Litoral."
 gg_urquiza.2.a_tt:0 "@information! La guerra con Entre Ríos es la que abrió el pronunciamiento, sin contingentes extranjeros. Cuando termine, el Pacto se decide por su resultado."
 gg_argentina.71.d_strong:0 "Ha llegado el #b 1 de mayo de 1851#! y la Legislatura de Entre Ríos no acepta la renuncia anual de #b Rosas#!: el encargo de las relaciones exteriores continúa en Buenos Aires.\n\nNo es gratitud. La otra orilla del Plata está en paz y del lado del Restaurador, el Imperio no tiene cómo intervenir y el Litoral delega sin rodeos. Urquiza hizo la cuenta que haría cualquier gobernador con caballería y sin aliados, y la cuenta no le dio.\n\nLo que queda por delante es escribir la Confederación mientras la calma dura."
 gg_argentina.3.d_alone:0 "Todos los años usted presenta la renuncia al mando de las relaciones exteriores, y todos los años las provincias se la rechazan. Es una ceremonia: se ofrece lo que se sabe que nadie va a tomar.\n\nEste año la Legislatura de Entre Ríos la #b aceptó#!. Entre Ríos, #b «habiendo reasumido»#! la facultad concedida al gobernador de Buenos Aires, vuelve a tratar por sí misma con las demás naciones, aunque ya no queda en la otra orilla quien firme con ella.\n\nNo hay ninguna ilegalidad que denunciar, y ahí está lo peor. El Pacto Federal de 1831 es un tratado entre entidades soberanas, y cada una conservó el derecho de retirar lo que prestó. #b Justo José de Urquiza#! no ha usurpado nada: ha tomado la palabra de usted."
 gg_pronunciamiento_rebelion_alone_tt:0 "@warning! #b Entre Ríos#! retira su delegación, nace con el ejército reunido bajo Urquiza y comienza una #N guerra real#! por el Pacto Federal. Esta vez #b sin aliados#! del otro lado del río."
 gg_argentina.67.d_postwar:0 "El despacho destinado a #b Justo José de Urquiza#! lleva el mando del ejército de observación sobre la frontera del Imperio. En el mismo paquete va otra orden: cortar el tráfico directo de Entre Ríos con los buques extranjeros, tolerado durante años aunque Buenos Aires lo considere contrabando.\n\nLas dos instrucciones no caben juntas sin costo. Se le entrega la mayor responsabilidad militar de la Confederación y se le quita el comercio que sostiene la economía de su provincia.\n\nViaja además la renuncia anual de #b Rosas#! al encargo de las relaciones exteriores. Cada año las provincias la rechazan y el gesto confirma la delegación; esta vez, Entre Ríos recibirá al mismo tiempo una ceremonia que se espera ritual y dos órdenes que ponen a prueba su obediencia."
 gg_argentina.26.defensa_tt:0 "@information! La #R Defensa#! recibe la misma noticia."
 gg_alcaraz_accept_postwar_tt:0 "@information! Termina la guerra con #b Corrientes#!, que queda como #P protectorado#! y vuelve a delegar las relaciones exteriores, y se abre la ruta a un #V congreso constituyente#!."
 gg_argentina.83.d_alone:0 "El ejército de Buenos Aires fue vencido y Entre Ríos impuso sus condiciones, sin más aliados que su propia caballería. Rosas ya no puede presentar la conducción de las relaciones exteriores como un encargo vigente: el gobierno que la ejercía cayó con la derrota.\n\nUrquiza entra en Buenos Aires como jefe del Litoral vencedor. Entre Ríos no desaparece ni se vuelve una posesión porteña; conserva su gobierno dentro del arreglo que ahora debe organizar la Confederación.\n\nLa guerra decidió quién manda. La constitución decidirá bajo qué reglas."
