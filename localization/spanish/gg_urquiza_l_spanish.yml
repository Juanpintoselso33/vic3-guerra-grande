l_spanish:
 gg_urquiza.1.t:0 "La representación de Entre Ríos"
 gg_urquiza.1.d:0 "Llega a Palermo una carta del gobernador de Entre Ríos. Va dirigida al doctor Rufino de Elizalde, pero pide que se la reserve para todos «con la única excepción del señor general Rosas»: es para el Restaurador, y no es de cortesía.\n\nUrquiza no retira el encargo de las relaciones exteriores; enumera agravios. Que la #b Gaceta Mercantil#! pierde de vista los méritos del ejército entrerriano y le da Arroyo Grande solo a Oribe y a Pacheco. Que el doctor Baldomero García, ante la Sala el 2 de noviembre, no lo nombró a él «junto al ínclito general Oribe y al intrépido general Pacheco». Que Entre Ríos «ha prodigado el oro de su provincia y la sangre gloriosa de sus soldados» por la Causa Federal y es «desoída cada vez que reclama», como en la extracción del oro. Y que el capitán del puerto les toma declaración a los patrones de los buques que vienen de su provincia, «como si fuera considerada enemiga de los principios de la causa nacional».\n\nPide reparación pública, y la pide por escrito. En la Casa de Gobierno se sabe lo que significa una representación que no se contesta."
 gg_urquiza.1.f:0 "Entre Ríos todavía delega; ahora también pregunta."
 gg_urquiza.1.a:0 "Atender la representación: que la Gaceta rectifique y el puerto deje en paz a los buques entrerrianos."
 gg_urquiza.1.b:0 "Una provincia no le da órdenes al encargado de las relaciones exteriores."
 gg_urquiza.1.a_tt:0 "@information! La representación queda contestada: se salda #b un agravio#! de los que Entre Ríos tenga pendientes, y el respaldo de #b Urquiza#! sube #P 10#!. En San José se anota que Buenos Aires respondió.\n#grey El descontento de Entre Ríos, al llegar la carta, era #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!: lo empujan los agravios abiertos (Alcaraz, las órdenes de 1850, el Congreso aplazado, cada reclamo sin contestar, un Brasil libre para intervenir, la nota del Imperio rechazada); lo frenan una Guerra Grande ganada, la Banda Oriental en la Confederación, un Brasil vencido, la nota del Imperio contestada en paz y un Litoral que delega.#!"
 gg_urquiza.1.b_tt:0 "@warning! La representación queda sin respuesta: se suma #b un agravio#! a la cuenta de Entre Ríos, y el respaldo de #b Urquiza#! baja #N 10#!. Lo que hoy es una carta #b puede volverse un pronunciamiento#!."
 gg_urquiza.1.a_far_tt:0 "@information! La representación queda contestada, y el respaldo de #b Urquiza#! sube #P 10#!. En San José se anota que Buenos Aires respondió."
 gg_urquiza.1.b_far_tt:0 "@warning! La representación queda sin respuesta, y el respaldo de #b Urquiza#! baja #N 10#!. Lo que hoy es una carta #b puede volverse un pronunciamiento#!."
 gg_urquiza.2.t:0 "Urquiza, solo"
 gg_urquiza.2.d:0 "El gobernador de Entre Ríos se pronunció, pero se pronunció solo. No hay en Montevideo un gobierno sitiado que busque aliados contra el Restaurador, y en Río de Janeiro nadie firma convenciones sobre el Plata con quien no puede garantizarlas.\n\nUrquiza tiene su provincia, su caballería y lo que Corrientes quiera darle. Contra él están los ejércitos de la Confederación, que ya no tienen otra guerra que atender."
 gg_urquiza.2.f:0 "Un pronunciamiento sin convención es una apuesta."
 gg_urquiza.2.a:0 "Que se sepa en el Litoral."
 gg_urquiza.2.a_tt:0 "@information! La guerra con Entre Ríos es la que abrió el pronunciamiento, sin contingentes extranjeros. Cuando termine, el Pacto se decide por su resultado."
 gg_urquiza.4.t:0 "Urquiza, entre Oribe y Rosas"
 gg_urquiza.4.d:0 "En San José espera sobre la mesa la renuncia anual de #b Rosas#! al encargo de las relaciones exteriores, la que se ofrece todos los años seguro de que se la van a devolver. La Legislatura aguarda la palabra de V. E. Pero en la otra orilla ya no hay sitio: #b Oribe#! gobierna la República, amigo del Restaurador, y en Montevideo no queda gobierno de la Defensa con quien firmar nada. Lo que haría falta para dar el paso, un ejército amigo en la frontera y una escuadra en los ríos interiores, no está.\n\nV. E. conoce la cuenta. El encargado de negocios del Brasil escribió de usted que «conoce perfectamente los riesgos de su posición» y que podría salir de ella «apenas se convenza de poder hacerlo con buen éxito». Don Antonio Cuyás lo dejó dicho: no conviene dar la cara de frente «hasta que se asegure los elementos con que debe contribuir cada uno de los Estados de la coalición en un tratado o convención». Hoy no hay coalición, ni tratado, ni convención.\n\nAceptar la renuncia así es tomarle la palabra a Rosas con el ejército de la Confederación libre ya de la guerra de la otra orilla. En Río de Janeiro lo escribieron sin rodeos: con Rosas «no hay términos medios: u obediencia ciega y absoluta, o rebelión abierta». Y el Restaurador ya lo había advertido en 1836: «Tenga cuidado; ese jefe será su ruina». Entre Ríos tiene su caballería; lo que no tiene es con quién."
 gg_urquiza.4.d_province:0 "En San José espera sobre la mesa la renuncia anual de #b Rosas#! al encargo de las relaciones exteriores, la que se ofrece todos los años seguro de que se la van a devolver. La Legislatura aguarda la palabra de V. E. Pero en la otra orilla ya no hay sitio: la Banda Oriental delega en Buenos Aires como una provincia más del Pacto, con #b Oribe#! a su frente, y en Montevideo no queda gobierno de la Defensa con quien firmar nada. Lo que haría falta para dar el paso, un ejército amigo en la frontera y una escuadra en los ríos interiores, no está.\n\nV. E. conoce la cuenta. El encargado de negocios del Brasil escribió de usted que «conoce perfectamente los riesgos de su posición» y que podría salir de ella «apenas se convenza de poder hacerlo con buen éxito». Don Antonio Cuyás lo dejó dicho: no conviene dar la cara de frente «hasta que se asegure los elementos con que debe contribuir cada uno de los Estados de la coalición en un tratado o convención». Hoy no hay coalición, ni tratado, ni convención.\n\nAceptar la renuncia así es tomarle la palabra a Rosas con el ejército de la Confederación libre ya de la guerra de la otra orilla, y con las dos orillas del Uruguay en sus manos. En Río de Janeiro lo escribieron sin rodeos: con Rosas «no hay términos medios: u obediencia ciega y absoluta, o rebelión abierta». Y el Restaurador ya lo había advertido en 1836: «Tenga cuidado; ese jefe será su ruina». Entre Ríos tiene su caballería; lo que no tiene es con quién."
 gg_urquiza.4.f:0 "«Obrará según las circunstancias se presenten.» Antonio Cuyás y Sampere, sobre Urquiza"
 gg_urquiza.4.a:0 "Que la Legislatura devuelva la renuncia, como todos los años."
 gg_urquiza.4.b:0 "Que la acepte: Entre Ríos reasume sus facultades, con aliados o sin ellos."
 gg_urquiza.4.a_tt:0 "@information! Entre Ríos #b no se pronuncia#!: el encargo sigue en Buenos Aires y los agravios pendientes se tratan con #b Rosas#!, dentro del Pacto.\n#grey El descontento de Entre Ríos, hoy: #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!.#!"
 gg_urquiza.4.b_tt:0 "@warning! Entre Ríos #N se pronuncia sin convención y sin escuadra#!: reasume la delegación, y la respuesta queda en manos de #b Rosas#!, que puede aceptarla o hacerle la guerra.\n#grey El descontento de Entre Ríos, hoy: #V [GetGlobalVariable('gg_urquiza_discontent_now').GetValue|0]#!.#!"
 gg_argentina.71.d_alone:0 "Ha llegado el #b 1 de mayo de 1851#! y la Legislatura de Entre Ríos devuelve, como todos los años, la renuncia de #b Rosas#!: el encargo de las relaciones exteriores continúa en Buenos Aires.\n\nNo es gratitud. En la otra orilla gobierna #b Oribe#!, en Montevideo no queda gobierno de la Defensa con quien firmar, y el Imperio no se ha comprometido con Entre Ríos: ni tratado, ni escuadra en los ríos. Urquiza hizo la cuenta que haría cualquier gobernador con caballería y sin aliados, y la cuenta no le dio.\n\nLos agravios de Entre Ríos no se borraron; se van a tratar en la mesa. Lo que queda por delante es escribir la Confederación mientras la calma dura."
 gg_argentina.71.d_strong:0 "Ha llegado el #b 1 de mayo de 1851#! y la Legislatura de Entre Ríos no acepta la renuncia anual de #b Rosas#!: el encargo de las relaciones exteriores continúa en Buenos Aires.\n\nNo es gratitud. La otra orilla del Plata está en paz y del lado del Restaurador, el Imperio no tiene cómo intervenir y el Litoral delega sin rodeos. Urquiza hizo la cuenta que haría cualquier gobernador con caballería y sin aliados, y la cuenta no le dio.\n\nLo que queda por delante es escribir la Confederación mientras la calma dura."
 gg_argentina.3.d_alone:0 "Todos los años usted presenta la renuncia al mando de las relaciones exteriores, y todos los años las provincias se la rechazan. Es una ceremonia: se ofrece lo que se sabe que nadie va a tomar.\n\nEste año la Legislatura de Entre Ríos la #b aceptó#!. Entre Ríos, #b «habiendo reasumido»#! la facultad concedida al gobernador de Buenos Aires, vuelve a tratar por sí misma con las demás naciones, aunque ya no queda en la otra orilla quien firme con ella.\n\nNo hay ninguna ilegalidad que denunciar, y ahí está lo peor. El Pacto Federal de 1831 es un tratado entre entidades soberanas, y cada una conservó el derecho de retirar lo que prestó. #b Justo José de Urquiza#! no ha usurpado nada: ha tomado la palabra de usted."
 gg_pronunciamiento_rebelion_alone_tt:0 "@warning! #b Entre Ríos#! retira su delegación, nace con el ejército reunido bajo Urquiza y comienza una #N guerra real#! por el Pacto Federal. Esta vez #b sin aliados#! del otro lado del río."
 gg_argentina.67.d_postwar:0 "El despacho destinado a #b Justo José de Urquiza#! lleva el mando del ejército de observación sobre la frontera del Imperio. En el mismo paquete va otra orden: cortar el tráfico directo de Entre Ríos con los buques extranjeros, tolerado durante años aunque Buenos Aires lo considere contrabando.\n\nLas dos instrucciones no caben juntas sin costo. Se le entrega la mayor responsabilidad militar de la Confederación y se le quita el comercio que sostiene la economía de su provincia.\n\nViaja además la renuncia anual de #b Rosas#! al encargo de las relaciones exteriores. Cada año las provincias la rechazan y el gesto confirma la delegación; esta vez, Entre Ríos recibirá al mismo tiempo una ceremonia que se espera ritual y dos órdenes que ponen a prueba su obediencia."
 gg_argentina.26.defensa_tt:0 "@information! La #R Defensa#! recibe la misma noticia."
 gg_alcaraz_accept_postwar_tt:0 "@information! Termina la guerra con #b Corrientes#!, que queda como #P protectorado#! y vuelve a delegar las relaciones exteriores, y se abre la ruta a un #V congreso constituyente#!."
 gg_argentina.83.d_alone:0 "El ejército de Buenos Aires fue vencido y Entre Ríos impuso sus condiciones, sin más aliados que su propia caballería. Rosas ya no puede presentar la conducción de las relaciones exteriores como un encargo vigente: el gobierno que la ejercía cayó con la derrota.\n\nUrquiza entra en Buenos Aires como jefe del Litoral vencedor. Entre Ríos no desaparece ni se vuelve una posesión porteña; conserva su gobierno dentro del arreglo que ahora debe organizar la Confederación.\n\nLa guerra decidió quién manda. La constitución decidirá bajo qué reglas."
